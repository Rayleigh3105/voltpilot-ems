# Deutsche Texte des VoltPilot-Login-Themes (Login-Screen Stufe 1).
#
# Der Grossteil kommt aus dem deutschen Basis-Theme (keycloak.v2); hier stehen
# die Marken-Angleichungen und die Texte, die es dort nicht gibt.
#
# ⚠ JEDER Schluessel muss auch in messages_en.properties stehen - fehlt er
# dort, rendert Keycloak den nackten Schluesselnamen.

