# Deutsche Textfeinheiten fuers VoltPilot-Login. Der Grossteil der Texte kommt
# aus dem deutschen Basis-Theme (keycloak.v2); hier nur Marken-Angleichungen
# und die Texte der neuen geteilten Anmelde-Ansicht (login.ftl).

# Seitentitel ueber dem Formular (die Marke rendert links auf dem Verlauf).
loginAccountTitle=Willkommen zurück

# Browser-Tab-Titel.
loginTitle=VoltPilot EMS - Anmeldung

# Hinweiszeile unter dem Titel.
vpLoginHint=Melden Sie sich an Ihrer Anlage an.

# Passwort-vergessen: ohne SMTP gibt es keinen Selbstservice-Reset -
# der Support setzt das Passwort zurueck (Admin-Konsole, Benutzer-Seite).
vpForgotSupport=Passwort vergessen? Bitte kontaktieren Sie unseren Support.

# Vertrauenszeile unter dem Formular.
vpTrustEncrypted=Verschlüsselt
vpTrustServers=Server in Deutschland
vpTrustDsgvo=DSGVO-konform
