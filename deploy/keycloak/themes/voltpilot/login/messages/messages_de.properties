# Deutsche Texte des VoltPilot-Login-Themes (Login-Screen Stufe 1, Buehne „Kacheln“).
#
# Der Grossteil kommt aus dem deutschen Basis-Theme (keycloak.v2); hier stehen
# die Marken-Angleichungen und die Texte, die es dort nicht gibt.
#
# ⚠ JEDER Schluessel muss auch in messages_en.properties stehen - fehlt er
# dort, rendert Keycloak den nackten Schluesselnamen.
#
# ⚠ Die Buehne spricht mit dem Portal (frontend/portal/src/components/
# AuthScreen.tsx): wer hier einen Satz aendert, aendert ihn dort mit.

# --- Titel ---------------------------------------------------------------
loginAccountTitle=Willkommen zurück
loginTitle=VoltPilot EMS - Anmeldung
vpLoginHint=Melden Sie sich mit Ihrem VoltPilot-Konto an.

