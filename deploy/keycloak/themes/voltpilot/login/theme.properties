# VoltPilot Login-Theme - gebaut auf den Design-System-Tokens des Portals
# (frontend/portal/designsystem/tokens/*.css: Cornflower-Blau, Inter/Inter Tight,
# helle Flaechen). Das eingebaute keycloak.v2-Theme (PatternFly v5) wird geerbt -
# alle Auth-Flows, Fehler-/Info-/Passwort-vergessen-Seiten und die deutschen
# Standardtexte kommen von dort. Seit dem Captain-Login-Redesign tragen WIR
# zusaetzlich template.ftl (die geteilte Ansicht: Marke + Orbit links, Formular
# rechts - eine treue Kopie des 26.0.5-Originals plus vp-split-Wrapper) und
# login.ftl (Hinweiszeile, Passwort-vergessen-Support-Hinweis, Vertrauenszeile).
# Beim Keycloak-Upgrade beide gegen das neue keycloak.v2 re-diffen.
parent=keycloak.v2
import=common/keycloak

# css/styles.css kommt aus keycloak.v2 (Resource-Vererbung) und MUSS zuerst
# stehen, sonst fehlt das PatternFly-Grundlayout. css/voltpilot.css ueberschreibt
# danach gezielt Farben, Karte, Buttons, Eingabefelder und die Wortmarke.
styles=css/styles.css css/voltpilot.css

# "Konto erstellen"-Link auf der Login-Seite: die Selbstregistrierung ist ein
# PORTAL-Formular (Route #register), das Skript leitet den Portal-Origin aus
# dem redirect_uri der Auth-Anfrage ab (kein Env noetig, Dev + Prod korrekt).
scripts=js/register-link.js

# Das Portal-Design-System ist hell (keine Dark-Tokens definiert). darkMode=false
# haelt PatternFlys eingebautes Dark-Theme draussen, damit es die VoltPilot-Farben
# nicht ueberschreibt.
darkMode=false
