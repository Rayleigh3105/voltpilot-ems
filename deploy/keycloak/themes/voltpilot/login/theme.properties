# VoltPilot Login-Theme (Login-Screen Stufe 1, Konzept data/vp-login-screen-k3).
#
# Der Login ist die ERSTE SEITE DES PORTALS, keine Marketing-Buehne davor:
# links die weisse Markenflaeche wie die Portal-Seitenleiste, rechts die helle
# Flaeche mit EINER Karte aus denselben Tokens wie jede Portal-Karte.
#
# WIR tragen template.ftl (die Zweiteilung), login.ftl und die Flow-Seiten
# login-update-password / login-page-expired / login-otp / login-reset-password
# / logout-confirm / error / info - Letztere, weil sie vorher UNGESTYLT von
# keycloak.v2 geerbt wurden und unter OS-Dunkelmodus in eine dunkle
# PatternFly-Palette kippten. Beim Keycloak-Upgrade gegen das neue keycloak.v2
# re-diffen.
parent=keycloak.v2
import=common/keycloak

# STUFE 1 (Captain-Entscheid C): PatternFly bleibt geladen, damit jede NICHT
# ueberschriebene Seite (register, terms, webauthn, select-authenticator, ...)
# ihr Grundlayout behaelt. css/voltpilot.css kommt danach und traegt die
# VoltPilot-Optik; ihr letzter Block gibt den geerbten Seiten die Haus-Felder.
# Stufe 2 loest PatternFly ab - dann steht hier `styles=css/voltpilot.css`.
styles=css/styles.css css/voltpilot.css

# js/register-link.js: der "Konto erstellen"-Link (die Selbstregistrierung ist
#   eine PORTAL-Route, das Skript leitet den Origin aus dem redirect_uri ab).
# js/submit-state.js: Lade-Zustand + Passwort-Umschalter. Extern statt inline -
#   dieselbe Disziplin wie die Portal-CSP.
scripts=js/register-link.js js/submit-state.js

# Das Portal-Design-System ist hell; der Login bleibt hell. Zusaetzlich ist die
# `pf-v5-theme-dark`-Logik aus unserem template.ftl entfernt (26.0 kennt diese
# Eigenschaft noch nicht) und css/voltpilot.css setzt `color-scheme: light`.
darkMode=false
