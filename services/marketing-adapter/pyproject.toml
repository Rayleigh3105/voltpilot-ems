[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voltpilot-marketing-adapter"
version = "0.1.0"
description = "Voltpilot-EMS generic Direktvermarktung adapter (stub)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
voltpilot-marketing-adapter = "voltpilot_marketing_adapter.__main__:main"

[tool.setuptools.packages.find]
include = ["voltpilot_marketing_adapter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
