spring:
  application:
    name: voltpilot-timescale-writer

  # Ceiling for the graceful shutdown below: after this the remaining
  # in-flight work is cut and the JVM leaves. Must stay COMFORTABLY BELOW the
  # pod's terminationGracePeriodSeconds (recommendation: 20s here, 45s there,
  # see docs/k8s-readiness.md) so the process always exits on its own instead
  # of being SIGKILLed.
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

  kafka:
    bootstrap-servers: ${REDPANDA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: timescale-writer
      auto-offset-reset: earliest
      # We deserialize to String and parse JSON ourselves (see the consumer).
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # At-least-once: the container commits offsets only after the listener
      # returns normally; a write failure re-throws and Kafka redelivers.
      enable-auto-commit: false
    listener:
      ack-mode: record
  # Runtime connection: the non-privileged app role so Postgres RLS is enforced
  # on writes (the writer sets app.tenant_id per event; see the repository).
  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/voltpilot}
    username: ${APP_DB_USER:voltpilot_app}
    password: ${APP_DB_PASSWORD:voltpilot_app_dev_pw}
    # Pool size as an ENV knob (docs/k8s-readiness.md): the Hikari default of
    # 10 is kept so nothing changes today, but a multi-replica deployment sizes
    # it per replica against the DB's max_connections without a rebuild.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}

server:
  port: ${WRITER_PORT:8092}
  # Graceful shutdown (docs/k8s-readiness.md). Load-bearing here: the Kafka
  # listener container stops as part of the context close, so the in-flight
  # record finishes and ITS offset is committed before the process leaves -
  # a rollout replays nothing (the insert is idempotent either way).
  shutdown: graceful

voltpilot:
  redpanda:
    telemetry-topic: ${REDPANDA_TELEMETRY_TOPIC:telemetry.raw}
    # v2 entity telemetry (dual-consume next to v1; docs/contracts/v2).
    telemetry-v2-topic: ${REDPANDA_TELEMETRY_V2_TOPIC:telemetry-v2.raw}
    measurements-topic: ${REDPANDA_MEASUREMENTS_TOPIC:measurements.raw}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
