spring:
  application:
    name: voltpilot-timescale-writer

  # Ceiling for the graceful shutdown below: after this the remaining
  # in-flight work is cut and the JVM leaves. Must stay COMFORTABLY BELOW the
  # pod's terminationGracePeriodSeconds (recommendation: 20s here, 45s there,
  # see docs/k8s-readiness.md) so the process always exits on its own instead
  # of being SIGKILLed.
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

  kafka:
    bootstrap-servers: ${REDPANDA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: timescale-writer
      auto-offset-reset: earliest
      # We deserialize to String and parse JSON ourselves (see the consumer).
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # At-least-once: the container commits offsets only after the listener
      # returns normally; a write failure re-throws and Kafka redelivers.
      enable-auto-commit: false
    listener:
      ack-mode: record
  # Runtime connection: the non-privileged app role so Postgres RLS is enforced
  # on writes (the writer sets app.tenant_id per event; see the repository).
  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/voltpilot}
    username: ${APP_DB_USER:voltpilot_app}
    password: ${APP_DB_PASSWORD:voltpilot_app_dev_pw}
    # Pool size as an ENV knob (docs/k8s-readiness.md): the Hikari default of
    # 10 is kept so nothing changes today, but a multi-replica deployment sizes
    # it per replica against the DB's max_connections without a rebuild.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}

server:
  port: ${WRITER_PORT:8092}
  # Graceful shutdown (docs/k8s-readiness.md). Load-bearing here: the Kafka
  # listener container stops as part of the context close, so the in-flight
  # record finishes and ITS offset is committed before the process leaves -
  # a rollout replays nothing (the insert is idempotent either way).
  shutdown: graceful

voltpilot:
  redpanda:
    telemetry-topic: ${REDPANDA_TELEMETRY_TOPIC:telemetry.raw}
    # v2 entity telemetry (dual-consume next to v1; docs/contracts/v2).
    telemetry-v2-topic: ${REDPANDA_TELEMETRY_V2_TOPIC:telemetry-v2.raw}
    measurements-topic: ${REDPANDA_MEASUREMENTS_TOPIC:measurements.raw}
    # Ereignisse (UEMS AP-07 IP-8, docs/contracts/v2/events-raw.event.schema.json):
    # EventsRawConsumer prueft jedes gegen den Vertrag und haengt es an
    # messreihe_ereignis. Die Datenannahme (IP-5) und die Cloud-Dienste beschicken es.
    events-topic: ${REDPANDA_EVENTS_TOPIC:events.raw}
  # Kafka-consumer-lag observability (com.voltpilot.writer.KafkaLagMetricsCollector,
  # scout vp-scale-readiness-p4 §5.1/§6.3): the backlog of the telemetry consumer
  # group per topic, so a store-and-forward replay burst is visible BEFORE the
  # data goes stale. Same TIMER discipline as the api metrics; ON by default, kill
  # switch VOLTPILOT_METRICS_KAFKA_LAG_ENABLED=false (also removes the scheduler
  # thread pool and the AdminClient). Read via the AdminClient (committed offset
  # to log end), robust to a stalled consumer - unlike the client-side records-lag.
  metrics:
    kafka-lag:
      enabled: ${VOLTPILOT_METRICS_KAFKA_LAG_ENABLED:true}
      interval-ms: ${VOLTPILOT_METRICS_KAFKA_LAG_INTERVAL_MS:60000}
      initial-delay-ms: ${VOLTPILOT_METRICS_KAFKA_LAG_INITIAL_DELAY_MS:20000}
      timeout: ${VOLTPILOT_METRICS_KAFKA_LAG_TIMEOUT:PT10S}

# Actuator at the root: /health for the probes, /metrics for the Prometheus
# scrape (the actuator endpoint id `prometheus`, remapped like the api). The
# writer has no security starter, so /metrics answers anonymously - Prometheus
# scrapes each pod on the pod network; the frontend nginx never proxies it.
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
