spring:
  application:
    name: voltpilot-ingest
  # Kafka producer target (Redpanda). Not connected until the producer is wired.
  kafka:
    bootstrap-servers: ${REDPANDA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${INGEST_PORT:8091}

# MQTT ingress (EMQX). Consumed once the MQTT inbound adapter is wired.
voltpilot:
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    telemetry-topic-filter: ${MQTT_TELEMETRY_TOPIC_FILTER:ems/+/+/+/telemetry}
  redpanda:
    telemetry-topic: ${REDPANDA_TELEMETRY_TOPIC:telemetry.raw}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
