spring:
  application:
    name: voltpilot-ingest

  # Ceiling for the graceful shutdown below: after this the remaining
  # in-flight work is cut and the JVM leaves. Must stay COMFORTABLY BELOW the
  # pod's terminationGracePeriodSeconds (recommendation: 20s here, 45s there,
  # see docs/k8s-readiness.md) so the process always exits on its own instead
  # of being SIGKILLed.
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

  # Redpanda (Kafka API) producer target. String key/value; we serialize the
  # telemetry.raw event to JSON ourselves. Idempotent + acks=all for durability.
  kafka:
    bootstrap-servers: ${REDPANDA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

server:
  port: ${INGEST_PORT:8091}
  # Graceful shutdown (docs/k8s-readiness.md). Ingest serves no user traffic,
  # but the same lifecycle also drains the MQTT adapter cleanly on SIGTERM.
  shutdown: graceful

# MQTT ingress (EMQX) + Redpanda egress.
voltpilot:
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:voltpilot-ingest}
    telemetry-topic-filter: ${MQTT_TELEMETRY_TOPIC_FILTER:ems/+/+/+/telemetry}
    # v2 entity telemetry uplink (docs/contracts/v2/mqtt-telemetry-2.0.md).
    # Single-level wildcards keep the two eras apart: the v1 filter never
    # matches the 6-segment v2 topic and vice versa (dual-consume).
    telemetry-v2-topic-filter: ${MQTT_TELEMETRY_V2_TOPIC_FILTER:ems/+/+/+/v2/telemetry}
    qos: ${MQTT_QOS:1}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
  redpanda:
    telemetry-topic: ${REDPANDA_TELEMETRY_TOPIC:telemetry.raw}
    telemetry-v2-topic: ${REDPANDA_TELEMETRY_V2_TOPIC:telemetry-v2.raw}
  # v2 entity telemetry leg (envelope-only validation -> telemetry-v2.raw).
  # Disable to run a v1-only ingest.
  telemetry-v2:
    enabled: ${VOLTPILOT_TELEMETRY_V2_ENABLED:true}
  # Zero-touch provisioning resolver (docs/contracts/mqtt-provisioning.schema.json):
  # answers provision/{ref}/hello of CLAIMED refs with a retained
  # provision/{ref}/config. Lookup is lazy plain JDBC with the trusted backend
  # credentials (a hello has no tenant, so the RLS app role cannot serve it).
  provisioning:
    enabled: ${VOLTPILOT_PROVISIONING_ENABLED:true}
    hello-topic-filter: ${MQTT_PROVISION_TOPIC_FILTER:provision/+/hello}
    db:
      jdbc-url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/voltpilot}
      username: ${POSTGRES_USER:voltpilot}
      password: ${POSTGRES_PASSWORD:voltpilot_dev_pw}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
