spring:
  application:
    name: voltpilot-ingest

  # Ceiling for the graceful shutdown below: after this the remaining
  # in-flight work is cut and the JVM leaves. Must stay COMFORTABLY BELOW the
  # pod's terminationGracePeriodSeconds (recommendation: 20s here, 45s there,
  # see docs/k8s-readiness.md) so the process always exits on its own instead
  # of being SIGKILLed.
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

  # Redpanda (Kafka API) producer target. String key/value; we serialize the
  # telemetry.raw event to JSON ourselves. Idempotent + acks=all for durability.
  kafka:
    bootstrap-servers: ${REDPANDA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

server:
  port: ${INGEST_PORT:8091}
  # Graceful shutdown (docs/k8s-readiness.md). Ingest serves no user traffic,
  # but the same lifecycle also drains the MQTT adapter cleanly on SIGTERM.
  shutdown: graceful

# MQTT ingress (EMQX) + Redpanda egress.
voltpilot:
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:voltpilot-ingest}
    telemetry-topic-filter: ${MQTT_TELEMETRY_TOPIC_FILTER:ems/+/+/+/telemetry}
    # v2 entity telemetry uplink (docs/contracts/v2/mqtt-telemetry-2.0.md).
    # Single-level wildcards keep the two eras apart: the v1 filter never
    # matches the 6-segment v2 topic and vice versa (dual-consume).
    telemetry-v2-topic-filter: ${MQTT_TELEMETRY_V2_TOPIC_FILTER:ems/+/+/+/v2/telemetry}
    measurement-topic-filter: ${MQTT_MEASUREMENT_TOPIC_FILTER:ems/+/+/+/v2/measurement-samples}
    # Box events (docs/contracts/v2/mqtt-events-2.1.schema.json, UEMS AP-07 IP-5):
    # one events.raw record per entry; persistent session + manual ack like
    # measurement-samples. An older box simply sends nothing here.
    events-topic-filter: ${MQTT_EVENTS_TOPIC_FILTER:ems/+/+/+/v2/events}
    qos: ${MQTT_QOS:1}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
  redpanda:
    telemetry-topic: ${REDPANDA_TELEMETRY_TOPIC:telemetry.raw}
    telemetry-v2-topic: ${REDPANDA_TELEMETRY_V2_TOPIC:telemetry-v2.raw}
    measurements-topic: ${REDPANDA_MEASUREMENTS_TOPIC:measurements.raw}
    # Events of the box AND of the Datenannahme itself (rejected / clock_ahead /
    # too_old), docs/contracts/v2/events-raw.event.schema.json. The ingest creates
    # it itself when it is missing (events-topic-anlegen below). While it is still
    # missing - creation switched off, not allowed, broker away - the ingest falls
    # back (values flow, refusals only logged and counted, box adapter waits,
    # readiness DOWN) - services/ingest/README.md.
    events-topic: ${REDPANDA_EVENTS_TOPIC:events.raw}
    # Create a missing events.raw at start (since 15.09.2026) with the values
    # redpanda-init gives its neighbours, read it back, only then be ready. An
    # existing topic is never created twice and never altered; a deviation is a
    # WARN plus health detail "abweichung". WHY the app may do this although
    # decision b07-recreate D point 4 said "no topic creation from code": that
    # point was a boundary without a safety reason (D had solved the Recreate
    # stall without creation), the captain wants no manual topic creation any
    # more, and a mis-configured topic only arises when the BROKER auto-creates
    # it with its defaults on first send - this explicit path runs before any
    # send. Switch off (false) where the operator manages topics itself, e.g.
    # once Redpanda moves into the cluster with a PreSync job.
    events-topic-anlegen:
      enabled: ${REDPANDA_EVENTS_TOPIC_ANLEGEN:true}
      partitionen: ${REDPANDA_EVENTS_TOPIC_PARTITIONEN:3}
      replikate: ${REDPANDA_EVENTS_TOPIC_REPLIKATE:1}
  # Measurement-time plausibility of the Datenannahme (UEMS AP-07 E13, the
  # contract values of events-vocabulary-vectors.json "regeln" - not a tuning
  # knob): a measurement time more than 300 s AFTER arrival is refused as
  # clock_ahead, more than 90 days before it as too_old; exactly on the limit
  # is accepted.
  datenannahme:
    zukunft-hoechstens-s: 300
    vergangenheit-hoechstens-s: 7776000
  # v2 entity telemetry leg (envelope-only validation -> telemetry-v2.raw).
  # Disable to run a v1-only ingest.
  telemetry-v2:
    enabled: ${VOLTPILOT_TELEMETRY_V2_ENABLED:true}
  # Zero-touch provisioning resolver (docs/contracts/mqtt-provisioning.schema.json):
  # answers provision/{ref}/hello of CLAIMED refs with a retained
  # provision/{ref}/config. Lookup is lazy plain JDBC with the trusted backend
  # credentials (a hello has no tenant, so the RLS app role cannot serve it).
  provisioning:
    enabled: ${VOLTPILOT_PROVISIONING_ENABLED:true}
    hello-topic-filter: ${MQTT_PROVISION_TOPIC_FILTER:provision/+/hello}
    db:
      jdbc-url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/voltpilot}
      username: ${POSTGRES_USER:voltpilot}
      password: ${POSTGRES_PASSWORD:voltpilot_dev_pw}

# Actuator at the root: /health for the probes, /metrics for the Prometheus
# scrape (the actuator endpoint id `prometheus`, remapped exactly like the writer
# on 8092 and the api). Der ingest hat keinen Security-Starter, /metrics
# antwortet also anonym - Prometheus scrapt jeden Pod im Pod-Netz, das nginx des
# Portals reicht ihn nie durch. Erst damit sind die Zaehler der Datenannahme
# ueberhaupt abholbar (docs/agents/root/uems-betriebsueberwachung.md).
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
      # Readiness = readinessState PLUS, once, the Redpanda topic events.raw
      # (UEMS AP-07 IP-5): a missing topic is first created
      # (voltpilot.redpanda.events-topic-anlegen), then checked, then ready; a
      # deploy whose topic can neither be found nor created never becomes ready,
      # and once seen the check is cached for the process lifetime, so a later
      # Redpanda blip never takes the pod out (docs/k8s-readiness.md).
      group:
        readiness:
          include: readinessState,eventsTopic
