# Werkbank-Brücke (services/werkstatt-dienst/bruecke).
[main]
# Für den Werkstatt-Anschluss keine automatische Verbindung mit DHCP anlegen.
no-auto-default=interface-name:@WERKSTATT@

[connection-vp-werkbank-wlan]
# WLAN ins Netz der Werkbank: Energiesparen aus (Prüfstein PS-13).
match-device=interface-name:@NETZ@
wifi.powersave=2
