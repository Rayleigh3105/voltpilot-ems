# Werkbank-Brücke (services/werkstatt-dienst/bruecke): Durchleitung vom
# Werkstatt-Anschluss ins Internet. Was durchgeht, entscheidet die
# nftables-Tabelle inet werkbank (Richtung Netz: nur öffentliche Ziele).
net.ipv4.ip_forward = 1
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.@WERKSTATT@.send_redirects = 0
net.ipv4.conf.@WERKSTATT@.accept_redirects = 0
# kein IPv6 am Werkstatt-Anschluss: eine Box ab Werk spricht dort nur IPv4
net.ipv6.conf.@WERKSTATT@.disable_ipv6 = 1
