# Werkbank-Brücke (services/werkstatt-dienst/bruecke): SSH-Server.
# Von einrichten.sh erzeugt; nicht von Hand ändern. Die Nummer 10 steht vor
# den Dateien von Imager und cloud-init (50-…): in sshd gilt die erste
# gefundene Einstellung.
#
# Herein kommt nur der Benutzer werkstatt, nur mit Schlüssel. Seine Schlüssel
# stehen root-eigen in /etc/ssh/vp-werkbank/werkstatt; jeder Schlüssel des
# Dienstes hat dort seinen festen Befehl (Status, Pflege) oder nur die
# Weiterleitung zu den Werkstatt-Adressen.
AllowUsers werkstatt
AuthorizedKeysFile /etc/ssh/vp-werkbank/%u
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
PermitUserEnvironment no
MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 30
ClientAliveCountMax 3

# Weiterleitung nur lokal (ssh -L) und nur zu den Werkstatt-Adressen der Box;
# der Schlüssel des Dienstes ist zusätzlich mit permitopen auf dieselben Ziele
# begrenzt.
AllowTcpForwarding local
PermitOpen @ZIELE@
AllowStreamLocalForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
