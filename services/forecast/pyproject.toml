[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voltpilot-forecast"
version = "0.1.0"
description = "Voltpilot-EMS load/PV forecast service (baseline in v1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
voltpilot-forecast = "voltpilot_forecast.__main__:main"

[tool.setuptools.packages.find]
include = ["voltpilot_forecast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
