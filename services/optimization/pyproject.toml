[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voltpilot-optimization"
version = "0.2.0"
description = "Voltpilot-EMS optimization engine: battery-dispatch MILP (HiGHS via Pyomo), rolling 24h/15-min horizon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyomo>=6.7",
]

[project.optional-dependencies]
# HiGHS ships as a platform-specific wheel that isn't available everywhere.
# Keep it out of the hard runtime deps so `pip install -e` always succeeds and
# solver tests can importorskip gracefully.
solver = [
    "highspy>=1.7",
]
# psycopg is only needed for the DB-backed inputs/persistence; kept optional so
# the solver logic and its tests install without a DB driver present.
db = [
    "psycopg[binary]>=3.1",
]
# paho is only needed to publish plans to the broker; the contract payload
# builder itself is pure.
mqtt = [
    "paho-mqtt>=2.0",
]
# openpyxl is only needed by the bdew-convert CLI (turning the operator's own
# BDEW profile publication into the simulation's SIM_BDEW_H25_JSON file); kept
# out of the runtime deps so the optimizer/simulation image stays lean.
convert = [
    "openpyxl>=3.1",
]
# jsonschema validates published payloads against the frozen contract in tests;
# openpyxl lets the bdew-convert tests build their synthetic workbooks;
# pytest-timeout turns any wedged test (e.g. a deadlocked process pool) into a
# loud failure instead of hanging the CI runner for hours.
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "jsonschema>=4.21",
    "openpyxl>=3.1",
]

# NOTE: the forecast-fallback (voltpilot_optimization.fallback) additionally
# reuses the sibling package services/forecast (voltpilot-forecast). It is a
# path dependency, not a PyPI one, so it cannot be declared here; install it
# alongside (`pip install -e ../forecast`) - the Dockerfile and CI do.

[project.scripts]
voltpilot-optimization = "voltpilot_optimization.cli:main"

[tool.setuptools.packages.find]
include = ["voltpilot_optimization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Hard per-test ceiling (pytest-timeout): a deadlock FAILS the run instead of
# wedging the single CI runner. Generous on purpose - the whole suite runs in
# seconds; only a genuine hang ever hits this.
timeout = 300
markers = [
    "slow: heavy multi-solve year runs (gold-equivalence chains); excluded in the CI gate via `pytest -m 'not slow'`, included in a plain local `pytest`",
]
