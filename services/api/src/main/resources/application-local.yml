# Local / dev-compose profile. Adds the DEV-ONLY seed migrations (two tenants +
# demo telemetry) on top of the prod-safe core migrations. Activated by
# SPRING_PROFILES_ACTIVE=local (set on the api service in docker-compose.yml)
# and by the integration tests.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev

# Legacy local fixtures retain the old admin switcher explicitly; production defaults to false.
voltpilot:
  uems:
    unterstuetzung:
      umschalter-enabled: ${VOLTPILOT_UEMS_UNTERSTUETZUNG_UMSCHALTER_ENABLED:true}
