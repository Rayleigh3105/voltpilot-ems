spring:
  application:
    name: voltpilot-api

  # Ceiling for the graceful shutdown below: after this the remaining
  # in-flight work is cut and the JVM leaves. Must stay COMFORTABLY BELOW the
  # pod's terminationGracePeriodSeconds (recommendation: 20s here, 45s there,
  # see docs/k8s-readiness.md) so the process always exits on its own instead
  # of being SIGKILLed.
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

  # Datei-Upload der Bezugsdaten-Vorschau (UEMS AP-09 E14, IP-12): 5MB ist Springs 5 x 1024 x 1024 =
  # 5 242 880 Bytes, dieselbe Zahl wie CsvLeser.BYTES_HOECHSTENS. Die Anfrage darf etwas groesser sein
  # (Zuordnung + Multipart-Rahmen). Lazily: erst die Route liest die Teile - so antwortet sie selbst mit
  # dem Befund `datei_zu_gross` statt eines rohen Fehlers. Ingress-Grenze im gitops-Repo pruefen.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      resolve-lazily: true

  # Runtime connection: the NON-privileged app role so Row-Level-Security applies.
  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/voltpilot}
    username: ${APP_DB_USER:voltpilot_app}
    password: ${APP_DB_PASSWORD:voltpilot_app_dev_pw}
    # Pool size as an ENV knob (docs/k8s-readiness.md): the Hikari default of
    # 10 is kept so nothing changes today, but a multi-replica deployment sizes
    # it per replica against the DB's max_connections without a rebuild.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}

  # Migrations run as the Postgres SUPERUSER (owns schema, creates the app role
  # and the RLS policies). baseline-version 0 lets the idempotent V1 run even on
  # the dev-compose DB that 01-init.sql already bootstrapped.
  flyway:
    enabled: true
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/voltpilot}
    user: ${POSTGRES_USER:voltpilot}
    password: ${POSTGRES_PASSWORD:voltpilot_dev_pw}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    # Profile changes can leave the known db/dev seeds in history. The startup
    # strategy permits only explicit version+script identities (docs/api.md).
    # This Flyway pattern alone is NOT a guard: it also ignores missing core
    # migrations from a newer build. The strategy rejects those before migrate/repair.
    ignore-migration-patterns: "*:missing"
    # Apply a migration whose version is BELOW the highest already-applied one.
    #
    # ⚠ WHY (production incident 2026-08-26): the version number is the moment a
    # migration was AUTHORED, but the order it reaches a long-lived database is
    # the order its PR was MERGED - and those two diverge whenever branches run
    # in parallel. Two real pairs from that week: V20260846010000 (#509) merged
    # AFTER V20260847000000 (#516), and V20260842000000 (#512) merged AFTER
    # V20260844000000 (#507). Prod had already applied the higher versions, so
    # Flyway's default (out-of-order = false) put the newcomers in state IGNORED
    # and aborted the boot with "Detected resolved migration not applied to
    # database: 20260846010000". Twelve migrations then stayed unapplied, the
    # optimizer wrote into columns that did not exist (schedule.unplanned_load_
    # discharge) and the fleet went a night without a Fahrplan.
    #
    # ⚠ repair() CANNOT fix this - it only realigns the bookkeeping of migrations
    # that ARE applied (checksums/descriptions/types) - so the
    # SelfHealingFlywayMigrationStrategy deliberately does NOT try: it names the
    # migration and this setting instead of claiming a heal that never happens.
    #
    # What it does NOT loosen: checksum/description/type validation is untouched
    # (an edited applied migration still fails), and a FRESH database still
    # applies everything in version order - which is exactly why "never renumber
    # a migration" stays the rule (docs/deploy.md). Out-of-order only decides
    # whether a late arrival is applied or refused.
    #
    # Break-glass: SPRING_FLYWAY_OUT_OF_ORDER=false turns it off again (Boot's
    # relaxed env binding - the same knob the 2026-08-26 gitops hotfix used to
    # turn it ON before this line existed). Deliberately a literal here, not a
    # ${ENV:default} placeholder, so there is exactly ONE path to the value.
    out-of-order: true
    placeholders:
      appDbUser: ${APP_DB_USER:voltpilot_app}
      appDbPassword: ${APP_DB_PASSWORD:voltpilot_app_dev_pw}
      # V4 creates the dedicated cross-tenant admin role (BYPASSRLS) used only by
      # the platform-admin API. Password is a placeholder like the app role.
      adminDbUser: ${ADMIN_DB_USER:voltpilot_admin}
      adminDbPassword: ${ADMIN_DB_PASSWORD:voltpilot_admin_dev_pw}

  security:
    oauth2:
      resourceserver:
        jwt:
          # The issuer the browser-minted tokens carry (Keycloak KC_HOSTNAME).
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/voltpilot}
          # JWKS is fetched from here - inside compose this is the internal
          # keycloak:8080 URL, so the API never needs to resolve localhost:8081.
          # This is the fix for the issuer/JWKS-host mismatch: iss is validated
          # against issuer-uri while keys come from a reachable jwk-set-uri.
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8081/realms/voltpilot/protocol/openid-connect/certs}

server:
  port: ${API_PORT:8090}
  # Response compression (audit vp-portal-perf-a4, finding B3). The portal's
  # JSON payloads are 79-93 % compressible and re-fetched on a 30 s poll, so
  # every unshipped byte is paid repeatedly on mobile/remote links. In prod the
  # frontend nginx (the single web entry) also gzips, but it PASSES THROUGH an
  # already-encoded upstream response - so enabling this here compresses the api
  # for prod too AND covers every non-nginx path (dev, a direct probe, a future
  # ingress that does not gzip). `min-response-size` skips tiny bodies where the
  # gzip header costs more than it saves.
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain,text/css,application/javascript
    min-response-size: 1024
  # Graceful shutdown (docs/k8s-readiness.md): on SIGTERM Tomcat stops
  # accepting new connections and lets in-flight requests finish instead of
  # cutting them. That is what makes a rolling deploy invisible to the portal
  # (which polls every 30 s) - together with a preStop drain so the load
  # balancer has removed the pod before the signal arrives. Harmless in
  # compose: `docker compose down` just waits out any in-flight request.
  shutdown: graceful

# Toggle OIDC resource-server validation. ON by default (fail-secure: a
# deployment that forgot the env var authenticates rather than permits-all);
# offline unit tests and broker-less dev setups opt out explicitly with
# VOLTPILOT_SECURITY_OIDC_ENABLED=false.
voltpilot:
  flyway:
    # The switch alone never relaxes startup without the explicit local profile.
    startwaechter: ${VOLTPILOT_FLYWAY_STARTWAECHTER:streng}
  # Additional measurement-point selection (Geraete-Erlebnis Slice 5). D5's
  # global limits live in code; representative driver bench runs may only
  # TIGHTEN the sample ceiling per canonical catalog family, never widen 600.
  # Example deployment override:
  #   VOLTPILOT_MEASUREMENTS_DRIVER_SAMPLE_LIMITS_HYBRID_3P=480
  measurements:
    driver-sample-limits: {}
  # Public self-service registration (tenant + login in one step). On by default;
  # closed platforms set VOLTPILOT_REGISTRATION_ENABLED=false to remove the
  # endpoint entirely.
  registration:
    enabled: ${VOLTPILOT_REGISTRATION_ENABLED:true}
    # Abuse guard for the public endpoint: sliding-window limits per client
    # address plus a global cap that bounds total volume even across many
    # addresses. Window is an ISO-8601 duration. trusted-proxies is the number
    # of own proxy hops in front of the api (each APPENDS to X-Forwarded-For,
    # so only the rightmost entries are trustworthy): 0 = ignore the header and
    # use the socket address (directly-reachable dev api); production
    # (external proxy -> frontend nginx -> api) sets 2.
    rate-limit:
      enabled: ${VOLTPILOT_REGISTRATION_RATE_LIMIT_ENABLED:true}
      per-client-max: ${VOLTPILOT_REGISTRATION_RATE_LIMIT_PER_CLIENT_MAX:10}
      global-max: ${VOLTPILOT_REGISTRATION_RATE_LIMIT_GLOBAL_MAX:100}
      window: ${VOLTPILOT_REGISTRATION_RATE_LIMIT_WINDOW:PT1H}
      trusted-proxies: ${VOLTPILOT_REGISTRATION_RATE_LIMIT_TRUSTED_PROXIES:0}
  # Fleet-operations metrics (com.voltpilot.api.metrics): the Prometheus gauges
  # an alert rule watches - plan age and telemetry age per site, priced-slot
  # coverage per bidding zone. Collected on a TIMER, never per scrape, so a
  # scrape can never cost a fleet-wide aggregate.
  #
  # ON by default, on purpose: this is the only thing standing between a dead
  # optimizer and a plant running 17 hours on its fallback (the 06./07.08.2026
  # incident), and an alarm source that depends on someone remembering an env
  # var is not an alarm source. VOLTPILOT_METRICS_FLEET_ENABLED=false is the
  # kill switch (it also removes the scheduler thread pool).
  metrics:
    fleet:
      enabled: ${VOLTPILOT_METRICS_FLEET_ENABLED:true}
    # Consumer-control observability (Inkrement 5, §18): active/connected/
    # disturbed consumers, requirement instances per state, at-risk deadlines,
    # clamped-by-reason, active manual overrides. Same TIMER discipline as the
    # fleet metrics; ON by default so the pilot is observable, kill switch
    # VOLTPILOT_METRICS_CONSUMER_ENABLED=false.
    consumer:
      enabled: ${VOLTPILOT_METRICS_CONSUMER_ENABLED:true}
      interval-ms: ${VOLTPILOT_METRICS_FLEET_INTERVAL_MS:60000}
      initial-delay-ms: ${VOLTPILOT_METRICS_FLEET_INITIAL_DELAY_MS:10000}
    # Data-plane health (com.voltpilot.api.metrics.DbHealthMetricsCollector,
    # scout vp-scale-readiness-p4 §6.3): DB size per hypertable (the 0,5-TB
    # cold-archive trigger), the fail status of the TimescaleDB background jobs
    # (retention/compression - a silently failing drop_chunks would otherwise
    # only surface at the disk level), and the last optimizer-cycle duration
    # (read from optimizer_cycle_stat - the "15-min cadence tipping" curve).
    # Same TIMER discipline as the fleet metrics; ON by default, kill switch
    # VOLTPILOT_METRICS_DB_ENABLED=false. Reads via the BYPASSRLS admin role.
    db:
      enabled: ${VOLTPILOT_METRICS_DB_ENABLED:true}
      interval-ms: ${VOLTPILOT_METRICS_DB_INTERVAL_MS:60000}
      initial-delay-ms: ${VOLTPILOT_METRICS_DB_INITIAL_DELAY_MS:15000}
      # Mandantenanteile brauchen vier Vollscans. Einmal taeglich sammeln und
      # dazwischen fuer beliebig viele Prometheus-Scrapes im Prozess cachen.
      storage-interval-ms: ${VOLTPILOT_METRICS_DB_STORAGE_INTERVAL_MS:86400000}
      storage-initial-delay-ms: ${VOLTPILOT_METRICS_DB_STORAGE_INITIAL_DELAY_MS:300000}
    # UEMS-Betriebsueberwachung (AP-14 IP-9, Konzept "Erste Produktfreigabe" §3.5,
    # com.voltpilot.api.metrics.UemsMetricsCollector): Rueckstand der drei
    # Arbeitslisten, "zuletzt gelaufen"/Fehler je UEMS-Laeufer, Alter des
    # juengsten Mess-Eingangs je Kundenbereich mit aktiver Funktion "Messen" und
    # die Ergebnisse der drei Bestands-Laeufer. Dieselbe TAKT-Disziplin wie oben:
    # gesammelt im Takt, ein Prometheus-Scrape fuehrt NIE eine Abfrage aus.
    # Vorgabe AN, Not-Aus VOLTPILOT_METRICS_UEMS_ENABLED=false. Die zwei Abfragen
    # sind klein (gedeckelte Arbeitslisten, verdichteter Lueckenstand), darum der
    # billige 60-s-Takt und nicht der taegliche der Speicherklassen. Liest ueber
    # die BYPASSRLS-Admin-Rolle - unter RLS zaehlte jede Abfrage null und meldete
    # faelschlich Ruhe. Die Schwellen und Regeln dazu baut IP-10 in gitops.
    uems:
      enabled: ${VOLTPILOT_METRICS_UEMS_ENABLED:true}
      interval-ms: ${VOLTPILOT_METRICS_UEMS_INTERVAL_MS:60000}
      initial-delay-ms: ${VOLTPILOT_METRICS_UEMS_INITIAL_DELAY_MS:20000}
  security:
    oidc:
      enabled: ${VOLTPILOT_SECURITY_OIDC_ENABLED:true}
    cors:
      allowed-origins: ${VOLTPILOT_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Complete OCPP 1.6 station-originated journal. The edge removes credentials
  # before durable spooling; this boundary applies the same policy again before
  # Postgres. Compose enables the MQTT consumer, while broker-less tests keep it
  # disabled. The pepper is secret in production and must remain stable so an
  # idTag maps to the same opaque reference without becoming reversible.
  ocpp:
    mqtt-listener-enabled: ${VOLTPILOT_OCPP_MQTT_LISTENER_ENABLED:false}
    # Stable per API deployment: clean-session=false lets EMQX queue QoS1
    # station events while the API restarts. Use a distinct stable ID per
    # replica if this service is ever scaled horizontally.
    mqtt-client-id: ${VOLTPILOT_OCPP_MQTT_CLIENT_ID:voltpilot-api-ocpp}
    privacy-pepper: ${VOLTPILOT_OCPP_PRIVACY_PEPPER:local-dev-only-change-me}
  # Dedicated cross-tenant datasource for the platform-admin API. Connects as the
  # voltpilot_admin BYPASSRLS role (created by Flyway V4) to the SAME database as
  # the app datasource (URL falls back to spring.datasource.url); only the role
  # credentials differ. Set voltpilot.admin-datasource.url only to point elsewhere.
  admin-datasource:
    username: ${ADMIN_DB_USER:voltpilot_admin}
    password: ${ADMIN_DB_PASSWORD:voltpilot_admin_dev_pw}
  # Zero-touch device onboarding (docs/contracts/mqtt-provisioning.schema.json):
  # on claim, publish the retained provision/{ref}/config to the broker so a
  # waiting device is configured immediately. Best-effort; off by default so
  # unit tests and broker-less setups are unaffected (compose turns it on).
  # Shadow-mode forecasting (docs/forecasting.md): the DEFAULT model per kind.
  # Since the portal promotion switch these are step 2 of a three-step
  # precedence that ForecastModelService resolves and every consumer shares:
  # the newest row in forecast_model_choice wins, else this env value, else the
  # registry baseline. Keep them in sync with the forecast-collector and
  # optimizer env (compose passes the same variables to all three). Promotion
  # of a challenger is a deliberate act on /api/v1/admin/forecast-models;
  # never automatic.
  forecast:
    active-load-model: ${VOLTPILOT_ACTIVE_LOAD_MODEL:load-persistence}
    active-pv-model: ${VOLTPILOT_ACTIVE_PV_MODEL:pv-physical}
  # Api-side MIRROR of the optimizer's platform tunables (services/optimization
  # voltpilot_optimization/config.py) feeding the admin optimizer panel and the
  # per-slot diagnostics. The api only DISPLAYS these - pass the SAME
  # OPTIMIZER_* env vars to the api and the optimization container (the compose
  # files do), the VOLTPILOT_ACTIVE_*_MODEL discipline. terminal-value-* are
  # read-only in the panel (env-level; changing them is a redeploy).
  optimizer:
    default-wear-cost-ct-per-kwh: ${OPTIMIZER_WEAR_COST_CT_PER_KWH:4.0}
    terminal-value-quantile: ${OPTIMIZER_TERMINAL_VALUE_QUANTILE:0.3}
    terminal-value-ct-per-kwh: ${OPTIMIZER_TERMINAL_VALUE_CT_PER_KWH:}
    eeg-rates-json: ${OPTIMIZER_EEG_RATES_JSON:}
    default-supply-components: ${OPTIMIZER_DEFAULT_SUPPLY_COMPONENTS:true}
  # Flow platform (E3a editor + E2 compiler). `compiler.base-url` is the flowc
  # sidecar (edge-app/nodered/flowc/serve.js, compose service "flowc") the
  # activation path POSTs flow graphs to; the api never reimplements the JCS
  # content hash. `activation.enabled` stays the safety gate (default OFF, only
  # the simulator-rig sets it): no production site is ever flagged.
  flows:
    activation:
      enabled: ${VOLTPILOT_FLOWS_ACTIVATION_ENABLED:false}
    compiler:
      base-url: ${VOLTPILOT_FLOWS_COMPILER_BASE_URL:http://flowc:8099}
  # Ersparnis-Simulation: the internal Python simulation service (the
  # optimization image's simulate-serve entrypoint, compose service
  # "simulation"). The api owns auth/tenancy/master-data resolution and
  # proxies async jobs; the service itself knows neither tenants nor tokens.
  simulation:
    base-url: ${VOLTPILOT_SIMULATION_BASE_URL:http://simulation:8095}
  # Marktstammdatenregister lookups ("Anlage verknuepfen"). Dual-source: with
  # the captain's Webdienstnutzer credentials set, the official SOAP webservice
  # is used; with the BLANK defaults, the keyless public JSON backend serves
  # the same port - so dev and a fresh deployment need no registry secret.
  mastr:
    api-key: ${MASTR_API_KEY:}
    marktakteur-nummer: ${MASTR_MARKTAKTEUR_NUMMER:}
  provisioning:
    enabled: ${VOLTPILOT_PROVISIONING_ENABLED:false}
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
  # Register schreiben ueber das Portal (Konzept vp-reg-schreib-konzept-p8).
  # Publisher und Quittungs-Zuhoerer reiten auf voltpilot.provisioning.* oben -
  # dieses Feature hat bewusst KEINEN eigenen Transport-Schalter.
  #
  # ⚠ DIE ZEITFENSTER-INVARIANTE (Produktionsvorfall 20.08.2026): beide Budgets
  # muessen GROESSER sein als die Schranke, mit der die BOX ihren eigenen
  # Bus-Rundlauf begrenzt (installerWriteTimeout = 30 s in
  # edge-app/core/internal/agent/installerwrite.go). Der frueher hier
  # eingebaute Vorgabewert von 20 s lag DARUNTER: auf jeder Anlage, deren
  # Wechselrichter-Bus gerade mit dem laufenden Poll belegt war, gab die api
  # auf, BEVOR das Geraet ueberhaupt antworten konnte - die Box antwortete
  # korrekt nach 22 s, die Korrelation war da schon vergessen. Wer eine der
  # beiden Zahlen anfasst, fasst beide an; RegisterWriteBudgetTest nagelt die
  # Invariante fest.
  #
  # `enabled` ist der plattformweite NOT-AUS: false laesst nur die zwei
  # SCHREIBENDEN Schritte mit 503 und deutschem Grund refuesieren, der Verlauf
  # bleibt lesbar. Vorgabe AN (die gitops-Falle: ein per Vorgabe
  # ausgeschaltetes Flag muss im gitops-Repo nachgezogen werden).
  register-write:
    enabled: ${VOLTPILOT_REGISTER_WRITE_ENABLED:true}
    read-timeout: ${VOLTPILOT_REGISTER_WRITE_READ_TIMEOUT:PT40S}
    write-timeout: ${VOLTPILOT_REGISTER_WRITE_WRITE_TIMEOUT:PT60S}
  # Device-initiated data purge (docs/contracts/mqtt-data-purge.schema.json):
  # subscribe ems/+/+/+/status for purge_request messages published by the edge
  # ("Datenaufzeichnungen löschen" on its local web app) and run the same purge
  # the portal endpoint uses. Reuses the provisioning broker settings above.
  # Off by default so unit tests and broker-less setups are unaffected; compose
  # turns it on.
  # Verbrauchssteuerung Inkrement 4 (§16/§19): the consumer-policy activation
  # path's two gates, BOTH default OFF - only tests and the simulator rig turn
  # them on; productivisation/de-gating is Inkrement 5. `enabled` is the master
  # switch of the activation surface (off = activate answers honestly
  # "activation_disabled" and every portal surface keeps saying "Steuerung noch
  # nicht aktiviert"); `policy-compiler-enabled` additionally gates the
  # compile+rollout half (the generated vp.consumer.reactive artifact). The
  # STOP paths (deactivate/pause + retained-artifact retraction) deliberately
  # ignore both flags - Flag aus ≠ gestoppt (the OTA/flow lesson).
  consumer-control:
    enabled: ${VOLTPILOT_CONSUMER_CONTROL_ENABLED:false}
    policy-compiler-enabled: ${VOLTPILOT_CONSUMER_POLICY_COMPILER_ENABLED:false}
    # D8 event replanning (§13.4): its OWN status listener watches the
    # consumers block for the four trigger events and calls the solve
    # service's POST /replan, debounced per site + rate-limited. The 15-min
    # tick stays the Grundschlag. Off by default like every listener.
    replan-trigger-enabled: ${VOLTPILOT_CONSUMER_REPLAN_TRIGGER_ENABLED:false}
    replan-debounce-seconds: ${VOLTPILOT_CONSUMER_REPLAN_DEBOUNCE_SECONDS:8}
    replan-min-interval-seconds: ${VOLTPILOT_CONSUMER_REPLAN_MIN_INTERVAL_SECONDS:120}
  purge:
    mqtt-listener-enabled: ${VOLTPILOT_PURGE_MQTT_LISTENER_ENABLED:false}
  # Inverter-control confirmation ingestion: a sibling listener on the same
  # status topic parses the additive `control` block of the device heartbeat
  # (commanded vs. read-back inverter setpoint) into device_control_status, so
  # the portal can render the "Steuerung" strip. Reuses the provisioning broker
  # settings above. Off by default; compose turns it on next to the purge one.
  control:
    mqtt-listener-enabled: ${VOLTPILOT_CONTROL_MQTT_LISTENER_ENABLED:false}
  # Sustained (>3 kW AND >20 %) fresh telemetry-vs-plan load deviations. The
  # local 10-second follower handles impulses; only 20 s persistence reaches
  # the solver, with at most one request attempt/site/120 s and pending-failure retry.
  load-residual-replan:
    enabled: ${VOLTPILOT_LOAD_RESIDUAL_REPLAN_ENABLED:false}
    absolute-kw: ${VOLTPILOT_LOAD_RESIDUAL_REPLAN_ABSOLUTE_KW:3}
    relative-fraction: ${VOLTPILOT_LOAD_RESIDUAL_REPLAN_RELATIVE_FRACTION:0.20}
    sustained-seconds: ${VOLTPILOT_LOAD_RESIDUAL_REPLAN_SUSTAINED_SECONDS:20}
    min-interval-seconds: ${VOLTPILOT_LOAD_RESIDUAL_REPLAN_MIN_INTERVAL_SECONDS:120}
    retry-seconds: ${VOLTPILOT_LOAD_RESIDUAL_REPLAN_RETRY_SECONDS:5}
    max-sample-age-seconds: ${VOLTPILOT_LOAD_RESIDUAL_REPLAN_MAX_SAMPLE_AGE_SECONDS:30}
  # Feed-in curtailment ("Abregeln") execution truth: a sibling listener on the
  # same status topic parses the additive `curtailment` block (configured units,
  # per-unit First-Light releases, applied cap + readback match + possible
  # override) into device_curtailment_status, so the portal can tell a planned
  # "Abregeln" slot that IS executed from one the plant cannot execute yet. Its
  # OWN listener, not part of the control one: the two blocks arrive
  # independently. Same broker settings; off by default, both composes turn it
  # on next to the control listener.
  curtailment:
    mqtt-listener-enabled: ${VOLTPILOT_CURTAILMENT_MQTT_LISTENER_ENABLED:false}
  # E1b bidirectional entity sync: ingest the heartbeat `entities` block (the
  # edge's per-entity observed Ist + local commissioning view) into
  # entity_observed_state so the portal can surface Soll/Ist drift. Same
  # listener pattern/broker settings as `control`. Off by default.
  entities:
    mqtt-listener-enabled: ${VOLTPILOT_ENTITIES_MQTT_LISTENER_ENABLED:false}
    # Das Anlagen-Modell füllt sich von selbst: die v2-Komposition läuft
    # automatisch beim Geräte-Claim, beim Speicher-Speichern und über den
    # getakteten Abgleich (V2SiteBackfillRunner) - KEIN Admin-Handgriff, kein
    # Kunden-Klick. `enabled` ist der Not-Aus für das ganze Feature (Start-Lauf
    # UND Takt), `reconcile-enabled` schaltet NUR den Takt (im Testlauf aus, in
    # PRODUKTION an - siehe EntitiesSchedulingConfig).
    backfill:
      enabled: ${VOLTPILOT_ENTITIES_BACKFILL_ENABLED:true}
      reconcile-enabled: ${VOLTPILOT_ENTITIES_BACKFILL_RECONCILE_ENABLED:true}
      interval-ms: ${VOLTPILOT_ENTITIES_BACKFILL_INTERVAL_MS:300000}
  # Steuerung Stufe 4 (B6): ein Handeingriff über der 4-h-Arbiter-Kappe wird
  # ERNEUERT statt den Vertrag D-5 zu dehnen. Vorgabe AN - ein per Vorgabe
  # ausgeschaltetes Flag müsste im gitops-Repo nachgezogen werden (die
  # dokumentierte OTA-Listener-Falle); der Testlauf schaltet ihn über die
  # surefire-Systemeigenschaft aus.
  interventions:
    renewal-enabled: ${VOLTPILOT_INTERVENTIONS_RENEWAL_ENABLED:true}
    renewal-interval-ms: ${VOLTPILOT_INTERVENTIONS_RENEWAL_INTERVAL_MS:600000}
  # Einheitsmodell Stufe 2: die BESTANDS-ÜBERNAHME läuft AUTOMATISCH
  # (Captain-Entscheid E2). Sobald eine box-verwaltete Anlage ihren
  # Einrichtungs-Stand VOLLSTÄNDIG meldet - also nach dem Box-Update, das die
  # Verbindungsfelder mitschickt -, wird er als Soll übernommen und die
  # Autorität dreht auf `portal`. Auf der Box ist das ein No-op (die
  # Quellen-Kennungen sind deterministisch), es wandert nur der
  # Bearbeitungs-Ort. `enabled` ist der Not-Aus für das ganze Feature (Start-Lauf
  # UND Takt), `reconcile-enabled` schaltet NUR den Takt (im Testlauf aus, in
  # PRODUKTION an - siehe ComponentsSchedulingConfig). Der Rückweg ist die
  # Admin-Route .../v2-entities/revert-to-device.
  components:
    adoption:
      enabled: ${VOLTPILOT_COMPONENTS_ADOPTION_ENABLED:true}
      reconcile-enabled: ${VOLTPILOT_COMPONENTS_ADOPTION_RECONCILE_ENABLED:true}
      interval-ms: ${VOLTPILOT_COMPONENTS_ADOPTION_INTERVAL_MS:300000}
  # UEMS AP-02 IP-9: die BESTANDSÜBERNAHME der Standorte läuft AUTOMATISCH bei
  # jedem Start (BestandsuebernahmeLaeufer, kein Takt): ein Kundenbereich mit
  # genau einer Anlage bekommt seinen Standort (Entwurf, Adresse fehlt) samt
  # Zuordnung ab site.created_at, einer mit mehreren je Anlage einen Vorschlag.
  # Idempotent; ändert keine Anlage, keinen Push, kein Kommando. `enabled` ist
  # der Not-Aus des Start-Laufs - Vorgabe AN, im Testlauf AUS (surefire).
  uems:
    # AP-14 IP-18 (Kasten E11): interne UUID des Kundenbereichs "VoltPilot
    # Dauerlaeufer (intern)" - zwei simulierte Boxen, die dauerhaft den Weg
    # Box -> Bericht gehen. Leer = kein Dauerlaeufer, jede Kennzahl wie vorher.
    # Gesetzt zaehlt er in KEINER Flottenkennzahl (voltpilot_sites und die
    # voltpilot_site_*-Reihen); sein Messkunden-Alter bleibt mit Etikett tenant
    # sichtbar, denn darauf schaut VoltPilotDauerlaeuferStumm. Derselbe Wert wie
    # voltpilot:uems_dauerlaeufer in gitops. Drehbuch: docs/rollout/uems-erste-freigabe.md §14.
    dauerlaeufer:
      tenant: ${VOLTPILOT_UEMS_DAUERLAEUFER_TENANT:}
    uebergabe:
      enabled: ${VOLTPILOT_UEMS_UEBERGABE_ENABLED:true}
      interval-ms: ${VOLTPILOT_UEMS_UEBERGABE_INTERVAL_MS:1000}
      initial-delay-ms: ${VOLTPILOT_UEMS_UEBERGABE_INITIAL_DELAY_MS:30000}
    # UEMS AP-10 IP-18: sichtbare Historienquoten ausserhalb 0..100 % reisen
    # ungeklemmt mit Unplausibel-Kennzeichen. Vorgabe AN; AUS stellt fuer den
    # Rollback die alte sichtbare 0-/100-%-Klemme wieder her. Rollups und Exporte
    # liegen vor dieser Darstellung und werden vom Schalter nicht beruehrt.
    historie:
      ungeklemmte-quoten-enabled: ${VOLTPILOT_UEMS_HISTORIE_UNGEKLEMMTE_QUOTEN_ENABLED:true}
    # UEMS AP-12 IP-5 (RW1): die Build-Kennung (Git-SHA) des Deployments für das
    # Regelwerk-Verzeichnis im Kopf jedes Berichts-Abzugs (BerichtRegelwerk). Ohne
    # sie nennt der Abzug Version und Build-Zeit aus build-info (pom.xml). Kein Flag.
    berichte:
      build: ${VOLTPILOT_BUILD:}
      # UEMS AP-12 IP-8: die Kaskaden-Naht der Berichte (BerichtKaskade). Eine
      # freigegebene oder zurückgenommene Korrektur bildet betroffene Entwürfe in
      # der Transaktion der Kaskade neu und stößt gültige Berichtsstände an - ein
      # Stand wird nie geändert. `enabled` ist der Rückbau: aus -> BerichteNaht.Keine,
      # die Tabellen bleiben. Kein eigener Takt. Vorgabe AN, im Testlauf AUS (surefire).
      enabled: ${VOLTPILOT_UEMS_BERICHTE_ENABLED:true}
      # UEMS AP-12 IP-9: der Strukturänderungs-Läufer (Pfad 2, StrukturAenderungLaeufer).
      # Liest rückwirkende Zuordnungen, Flächen und Verteilungen aus ort_aenderung und
      # messstelle_aenderung (Wasserzeichen bericht_struktur_gelesen) und ruft dieselbe
      # Naht in einer eigenen Transaktion je Protokollzeile - die Schreibwege selbst
      # bleiben, wie sie sind. Läuft nur, wenn auch `berichte.enabled` an ist.
      # `enabled` ist der Not-Aus. Vorgabe AN, im Testlauf AUS (surefire).
      struktur:
        enabled: ${VOLTPILOT_UEMS_BERICHTE_STRUKTUR_ENABLED:true}
    bestandsuebernahme:
      enabled: ${VOLTPILOT_UEMS_BESTANDSUEBERNAHME_ENABLED:true}
    # UEMS AP-01 IP-2: der UMSTIEG „Bestand → Zustand" der Funktionen läuft direkt
    # NACH der Bestandsübernahme der Standorte (FunktionBestandLaeufer, kein Takt):
    # eine heute zugeordnete Anlage mit laufender Betriebsweise wird Teilnahme
    # `aktiv` (übernommen), ihr Standort trägt den höchsten Zustand. Idempotent,
    # lesend gegenüber dem Bestand (kein Push, kein Kommando, kein Ruhe-Eintrag).
    # `enabled` ist der Not-Aus - Vorgabe AN, im Testlauf AUS (surefire).
    funktion-bestand:
      enabled: ${VOLTPILOT_UEMS_FUNKTION_BESTAND_ENABLED:true}
    # UEMS AP-03 IP-2: die BESTANDSÜBERNAHME der Rechte (E12) - beim Start holt
    # ZugriffBestandLaeufer je Kundenbereich die Konten aus Keycloak; wer hier noch
    # nie eine Zuweisung hatte, wird Kundenadministrator (mandantenweit). Idempotent,
    # ein entzogener Zugriff kommt nie zurück; läuft im eigenen Thread. `enabled` ist
    # der Not-Aus des Start-Laufs - Vorgabe AN, im Testlauf AUS (surefire).
    zugriff-bestand:
      enabled: ${VOLTPILOT_UEMS_ZUGRIFF_BESTAND_ENABLED:true}
    # UEMS AP-03 IP-8: der TAKT der Unterstuetzung - minuetlich traegt AblaufLaeufer
    # abgelaufene Gewaehrungen ins Zugriffsprotokoll ein (ablaufen) und erinnert 7 Tage
    # vor dem Ende. Er BEENDET nichts: der Zugang endet mit endet_am von selbst
    # (zugriff_zeitraum, bei jeder Anfrage neu gefragt) - der Takt macht es sichtbar.
    # `enabled` ist der Not-Aus - Vorgabe AN, im Testlauf AUS (surefire).
    unterstuetzung:
      enabled: ${VOLTPILOT_UEMS_UNTERSTUETZUNG_ENABLED:true}
      # AP-03 W3: gilt der Mandanten-Umschalter X-Tenant-Id auf KUNDENrouten noch?
      # IP-15: Produktion AUS. Kundenflächen verlangen gewährte Unterstützung oder
      # Notfall-Zugriff über X-Kundenbereich. Nur das lokale Kompatibilitätsprofil
      # behält den alten Umschalter ausdrücklich für Bestandsnachweise.
      # /api/v1/admin/** (Plattform-Betrieb) ist davon nie betroffen.
      umschalter-enabled: ${VOLTPILOT_UEMS_UNTERSTUETZUNG_UMSCHALTER_ENABLED:false}
    # UEMS AP-07 IP-12: der VERDICHTUNGS-LAUF der Speicherklasse Viertelstunden-
    # werte - alle fuenf Minuten bildet er aus der Menge der Rohwerte der
    # Arbeitsliste die vorlaeufigen Intervalle (E6: JEDE Reihe) und faehrt
    # nebenher die einmalige Rueckrechnung der letzten 90 Tage in Tagesscheiben.
    # Vorgabe AN (die Hausregel "ein Flag hat die Vorgabe AN"), im Testlauf AUS
    # (surefire); wer ihn prueft, ruft ViertelstundeVerdichter.lauf() selbst.
    # `stapel` = Intervalle je Transaktion, `stapel-je-lauf` = Transaktionen je
    # Takt, `arbeit-hochwasser` = ab so vielen offenen Eintraegen pausiert die
    # Rueckrechnung, damit die Arbeitsliste nie unbegrenzt waechst.
    viertelstunde:
      enabled: ${VOLTPILOT_UEMS_VIERTELSTUNDE_ENABLED:true}
      interval-ms: ${VOLTPILOT_UEMS_VIERTELSTUNDE_INTERVAL_MS:300000}
      stapel: ${VOLTPILOT_UEMS_VIERTELSTUNDE_STAPEL:500}
      stapel-je-lauf: ${VOLTPILOT_UEMS_VIERTELSTUNDE_STAPEL_JE_LAUF:40}
      arbeit-hochwasser: ${VOLTPILOT_UEMS_VIERTELSTUNDE_ARBEIT_HOCHWASSER:200000}
    # UEMS AP-11 IP-6: der RECHENLAUF der Kennzahlen - ein Schritt im Stundentakt
    # der Endgueltigkeit (unten), NACH den berechneten Messstellen. Er liest die
    # Periodenwerte der Messstellen, die wirksamen Bezugsgroessen-Werte und die
    # Stammdaten am Stichtag und haengt Kennzahl-Werte an (append-only, vorlaeufige
    # ziehen nach, endgueltige bleiben stehen). `enabled` ist der Not-Aus NUR dieses
    # Schritts - Vorgabe AN; im Testlauf ist der ganze Takt aus.
    kennzahlen:
      enabled: ${VOLTPILOT_UEMS_KENNZAHLEN_ENABLED:true}
    # UEMS AP-07 IP-13: der STUNDENLAUF der Endgueltigkeit und der TAGESLAUF.
    # Einmal je Stunde setzt er jede faellige Viertelstunde (Intervallende +
    # 7 Tage, Entscheid E5) auf `endgueltig` und zieht danach die Tageswerte
    # nach - ein Kalendertag in der ZEITZONE DES STANDORTS (W10), die Zeitzone
    # steht in der Zeile. Vorgabe AN (die Hausregel "ein Flag hat die Vorgabe
    # AN"), im Testlauf AUS (surefire); wer ihn prueft, ruft
    # EndgueltigkeitLauf.umschalten() und TagVerdichter.lauf() selbst.
    # `endgueltigkeit.stapel` = Zeilen je Transaktion des Umschaltens,
    # `tag.stapel` = Eintraege je Transaktion des Tageslaufs, `tag.frist-je-lauf`
    # = wie viele faellige Tage ein Takt hoechstens nachzieht.
    endgueltigkeit:
      enabled: ${VOLTPILOT_UEMS_ENDGUELTIGKEIT_ENABLED:true}
      interval-ms: ${VOLTPILOT_UEMS_ENDGUELTIGKEIT_INTERVAL_MS:3600000}
      stapel: ${VOLTPILOT_UEMS_ENDGUELTIGKEIT_STAPEL:2000}
      stapel-je-lauf: ${VOLTPILOT_UEMS_ENDGUELTIGKEIT_STAPEL_JE_LAUF:200}
    tag:
      stapel: ${VOLTPILOT_UEMS_TAG_STAPEL:200}
      stapel-je-lauf: ${VOLTPILOT_UEMS_TAG_STAPEL_JE_LAUF:40}
      frist-je-lauf: ${VOLTPILOT_UEMS_TAG_FRIST_JE_LAUF:20000}
      arbeit-hochwasser: ${VOLTPILOT_UEMS_TAG_ARBEIT_HOCHWASSER:200000}
    # UEMS AP-07 IP-9: der LUECKEN-MELDER - alle fuenf Minuten schreibt er fest,
    # dass Werte FEHLEN: je Reihe aus der Kadenz zum Zeitpunkt (kein guter Wert
    # ueber 2 x Kadenz) und je Box aus dem letzten Eingang ("Box meldet sich
    # nicht", eine Luecke je Box und je Datenquelle der Box) - und schliesst sie
    # bei Rueckkehr/Nachlieferung (nachgeliefert_am, backfill). Kein Alarm, keine
    # Benachrichtigung. Vorgabe AN (die Hausregel "ein Flag hat die Vorgabe AN"),
    # im Testlauf AUS (surefire); wer ihn prueft, ruft LueckenMelder.lauf() selbst.
    # `stapel` = Einheiten je Transaktion, `stapel-je-lauf` = Transaktionen je
    # Takt, `werte-je-lochsuche` = wie viele Werte einer Reihe eine Suche liest.
    luecken:
      enabled: ${VOLTPILOT_UEMS_LUECKEN_ENABLED:true}
      interval-ms: ${VOLTPILOT_UEMS_LUECKEN_INTERVAL_MS:300000}
      stapel: ${VOLTPILOT_UEMS_LUECKEN_STAPEL:200}
      stapel-je-lauf: ${VOLTPILOT_UEMS_LUECKEN_STAPEL_JE_LAUF:50}
      werte-je-lochsuche: ${VOLTPILOT_UEMS_LUECKEN_WERTE_JE_LOCHSUCHE:20000}
    # UEMS AP-08 IP-13: der ERSATZWERT-LAUF - alle fuenf Minuten bildet er fuer jeden
    # neu erfassten oder zurueckgenommenen Ersatzwert die Viertelstunden als Version
    # (messreihe_viertelstunde_version) und haelt seine Wirkung fest. Er rechnet nichts
    # selbst (VerbrauchRegeln) und fuellt nie etwas automatisch auf: jeder Ersatzwert ist
    # ein Mensch mit Begruendung. Vorgabe AN (die Hausregel), im Testlauf AUS (surefire);
    # wer ihn prueft, ruft ErsatzwertLauf.lauf() selbst. `je-lauf` = Ersatzwerte je Takt.
    ersatzwert:
      enabled: ${VOLTPILOT_UEMS_ERSATZWERT_ENABLED:true}
      interval-ms: ${VOLTPILOT_UEMS_ERSATZWERT_INTERVAL_MS:300000}
      je-lauf: ${VOLTPILOT_UEMS_ERSATZWERT_JE_LAUF:200}
    # UEMS AP-08 IP-17: die KORREKTUR-KASKADE - alle fuenf Minuten zieht sie jede freigegebene
    # oder zurueckgenommene Korrektur und jeden gerechneten Ersatzwert bis zum Jahr durch
    # (Viertelstunde, Tag, Monat, Jahr, berechnete Messstellen, Kennzahlen-Naht) und gibt
    # freigegebenen Berichten NUR den Revisions-Ausloeser; danach zieht sie vorlaeufige Versionen
    # mit ihrer Grundlage nach. Die Freigabe selbst bleibt beim Menschen (E14). Vorgabe AN, im
    # Testlauf AUS (surefire); wer sie prueft, ruft KorrekturKaskade.lauf() selbst.
    kaskade:
      enabled: ${VOLTPILOT_UEMS_KASKADE_ENABLED:true}
      interval-ms: ${VOLTPILOT_UEMS_KASKADE_INTERVAL_MS:300000}
      je-lauf: ${VOLTPILOT_UEMS_KASKADE_JE_LAUF:50}
    # Zeilentexte eines Bezugsdaten-Imports bleiben zwei Jahre (AP-09 E14, IP-12): ein taeglicher Lauf
    # entfernt aeltere Texte; Urteil, Schluessel und Fingerabdruck bleiben. Die Frist steht in der
    # Datenbank (bezugsdaten_zeilentext_frist()). Vorgabe AN, im Testlauf AUS (surefire); wer ihn
    # prueft, ruft ZeilentextAufbewahrung.lauf() selbst.
    zeilentexte:
      enabled: ${VOLTPILOT_UEMS_ZEILENTEXTE_ENABLED:true}
      cron: ${VOLTPILOT_UEMS_ZEILENTEXTE_CRON:0 17 3 * * *}
    # Frist fuer plan_zustellung (AP-15 IP-11): ein taeglicher Lauf loescht Zeilen, deren juengster
    # Zeitpunkt aelter als die Frist ist - je Box bleiben IMMER die juengste veroeffentlichte und die
    # juengste angenommene Zeile. Vorgabe AN, im Testlauf AUS (surefire); wer ihn prueft, ruft
    # PlanZustellungAufbewahrung.lauf() selbst.
    plan-zustellung:
      enabled: ${VOLTPILOT_UEMS_PLAN_ZUSTELLUNG_ENABLED:true}
      cron: ${VOLTPILOT_UEMS_PLAN_ZUSTELLUNG_CRON:0 47 3 * * *}
      aufbewahrung-tage: ${VOLTPILOT_UEMS_PLAN_ZUSTELLUNG_AUFBEWAHRUNG_TAGE:35}
    # Verbund-Bilanz (AP-15 IP-12): taeglich je Anlage MIT Gemeinsamer Steuerung den Vortag rechnen
    # (Netzpunkt gegen Summe der Box-Beitraege); unplausibel fuehrt eine Anlage ueber S1 auf S1 zurueck,
    # die Anteile bleiben in Kraft. Vorgabe AN, im Testlauf AUS (surefire); wer ihn prueft, ruft
    # VerbundBilanzLaeufer.lauf(tag) selbst.
    verbund-bilanz:
      enabled: ${VOLTPILOT_UEMS_VERBUND_BILANZ_ENABLED:true}
      cron: ${VOLTPILOT_UEMS_VERBUND_BILANZ_CRON:0 37 4 * * *}
    # Vorbehalt aus Messwerten (AP-15 IP-13): taeglich nach der Verbund-Bilanz je Anlage MIT Gemeinsamer
    # Steuerung den hoechsten belegten Viertelstundenwert des Ungeregelten der letzten 12 Monate x 1,1
    # gegen den Vorbehalt der Bezugsseite halten: ERHOEHEN selbsttaetig (verengt, Zweischritt, Zaehler
    # voltpilot_uems_vorbehalt_erhoeht_total), SENKEN nur als Vorschlag (Freigabe unter /api/v1/admin).
    # Vorgabe AN, im Testlauf AUS (surefire); wer ihn prueft, ruft VorbehaltLaeufer.lauf(heute) selbst.
    vorbehalt:
      enabled: ${VOLTPILOT_UEMS_VORBEHALT_ENABLED:true}
      cron: ${VOLTPILOT_UEMS_VORBEHALT_CRON:0 52 4 * * *}
      # Derselbe Vorbehalt im VIERTELSTUNDEN-Takt (IP-13 Folge, R23 "die Cloud prueft nach jeder
      # Viertelstunde"): 10 Minuten nach jedem Viertelstunden-Ende (Reife: Verdichter 5 min +
      # Sicherheit 2 min + Transport) das Ungeregelte der reifen, vollstaendigen Viertelstunden von
      # gestern und heute - NUR erhoehen (derselbe Weg wie oben), Senken/30 Tage/12 Monate bleiben
      # beim Tageslauf. Haengt zusaetzlich an vorbehalt.enabled. Vorgabe AN, im Testlauf AUS
      # (surefire); wer ihn prueft, ruft VorbehaltViertelstundeLaeufer.lauf(jetzt) selbst.
      viertelstunde:
        enabled: ${VOLTPILOT_UEMS_VORBEHALT_VIERTELSTUNDE_ENABLED:true}
        cron: ${VOLTPILOT_UEMS_VORBEHALT_VIERTELSTUNDE_CRON:0 10/15 * * * *}
    # Grenzblatt-Anstoss (AP-15 IP-3 Folgepaket): stuendlich je Anlage mit Ladepark-Rahmen den heute
    # wirksamen Bezug gegen den zuletzt zugestellten vergleichen und nur bei einem Unterschied das
    # Ladepark-Dokument neu zustellen (Fassung/Bindung am Tageswechsel, Nachholen nach Ausfall).
    # Vorgabe AN, im Testlauf AUS (surefire); wer ihn prueft, ruft LadeparkGrenzeLaeufer.lauf() selbst.
    ladepark-grenze:
      enabled: ${VOLTPILOT_UEMS_LADEPARK_GRENZE_ENABLED:true}
      cron: ${VOLTPILOT_UEMS_LADEPARK_GRENZE_CRON:0 1 * * * *}
    # AP-06 IP-14: additive data_sources[] heartbeat block -> latest state per
    # (box, data source). Production default ON; Surefire turns the broker
    # listener off globally and parser tests call it directly.
    data-source-status:
      mqtt-listener-enabled: ${VOLTPILOT_UEMS_DATA_SOURCE_STATUS_MQTT_LISTENER_ENABLED:true}
  # Per-measurement-point Ist: ingest the heartbeat `sources` block (the primary
  # inverter + each configured source with its OWN latest reading + freshness)
  # into device_source_status, so the portal can explain a multi-inverter site's
  # composite PV ("39,0 kW = Deye 8,3 + Fronius 21,3 + ..."). Same listener
  # pattern/broker settings as `control`. Display-only. Off by default.
  sources:
    mqtt-listener-enabled: ${VOLTPILOT_SOURCES_MQTT_LISTENER_ENABLED:false}
  # Lastmanagement Stufe 3: ingest the heartbeat `chargers` block (the site's
  # charging budget + every OCPP charge point with its connectors) into
  # device_charging_budget / device_charge_point / device_charge_connector, so
  # the portal can answer "which station is charging, and why is the third one
  # waiting?" without opening the box's own :8484 page. Same listener
  # pattern/broker settings as `sources`. Display-only - the budget itself is
  # decided on the box (the connection limit is physical, its watchdog must not
  # hang off the WAN). Off by default; both composes turn it on.
  chargers:
    mqtt-listener-enabled: ${VOLTPILOT_CHARGERS_MQTT_LISTENER_ENABLED:false}
  # OTA Stufe 0 „Sehen": ingest the heartbeat's TOP-LEVEL `version` field plus
  # the additive `update` block into device_update_status, so the fleet view
  # knows which build every box runs - including the boxes on which no
  # automation was ever rolled out (those never send the `flows` block the
  # older version ingest hangs on). Its OWN listener for exactly that reason.
  # Read-only: there is no write path towards any device. Off by default; both
  # composes turn it on next to the other listeners.
  ota:
    mqtt-listener-enabled: ${VOLTPILOT_OTA_MQTT_LISTENER_ENABLED:false}
  # First-boot device enrollment over HTTPS: a fresh edge device uploads a CSR
  # for its reference and polls for its mTLS certificate; once the ref is
  # claimed, the api signs the CSR with the device CA (ca-dir = the working dir
  # tools/pki/voltpilot-ca.sh init-ca creates; mount it read-write) and appends
  # the per-device broker ACL grant (acl-file; blank = grants managed out of
  # band; in a container, bind-mount the file's DIRECTORY, never the file - a
  # single-file mount breaks the atomic replace with EBUSY, see AclGrantWriter).
  # Off by default - only deployments that stage the CA enable it (see
  # docker-compose.prod.yml). mqtt-host/-port are handed to the device together
  # with its certificate. The rate limiter guards the unauthenticated
  # endpoints; defaults accommodate legitimate certificate polling (the
  # documented 30-60 s poll interval).
  enrollment:
    enabled: ${VOLTPILOT_ENROLLMENT_ENABLED:false}
    ca-dir: ${VP_ENROLLMENT_CA_DIR:}
    acl-file: ${VP_ENROLLMENT_ACL_FILE:}
    mqtt-host: ${VP_ENROLLMENT_MQTT_HOST:localhost}
    mqtt-port: ${VP_ENROLLMENT_MQTT_PORT:8883}
    rate-limit:
      enabled: ${VOLTPILOT_ENROLLMENT_RATE_LIMIT_ENABLED:true}
      per-client-max: ${VOLTPILOT_ENROLLMENT_RATE_LIMIT_PER_CLIENT_MAX:240}
      global-max: ${VOLTPILOT_ENROLLMENT_RATE_LIMIT_GLOBAL_MAX:5000}
      window: ${VOLTPILOT_ENROLLMENT_RATE_LIMIT_WINDOW:PT1H}
      trusted-proxies: ${VOLTPILOT_ENROLLMENT_RATE_LIMIT_TRUSTED_PROXIES:0}
    # Auto-reload the EMQX file authorizer the moment a device grant is written
    # (issuance) or removed (unclaim), so a freshly claimed device is publishable
    # within seconds instead of waiting for the deploy-time / cron reload
    # (tools/pki/reload-broker-authz.sh, which stays as the backstop). EMQX's
    # file authorizer never re-reads acl.conf on its own; the api can't run
    # `emqx eval` (no docker), so it re-initialises the source over the EMQX REST
    # management API: PUT {api-url}/authorization/sources/file with the current
    # acl.conf as `rules` (verified on 5.8.3 - see BrokerAuthzReloader). Off by
    # default; only enrollment deployments that expose the internal EMQX REST
    # port enable it. api-url is the REST base incl. /api/v5 (e.g.
    # http://emqx:18083/api/v5). Auth: an EMQX API key (Basic, preferred) OR the
    # dashboard user/password (reuses EMQX_DASHBOARD_* already in the prod stack).
    broker-authz-reload:
      enabled: ${VOLTPILOT_BROKER_AUTHZ_RELOAD_ENABLED:false}
      api-url: ${VOLTPILOT_BROKER_AUTHZ_RELOAD_API_URL:}
      api-key: ${VOLTPILOT_BROKER_AUTHZ_RELOAD_API_KEY:}
      api-secret: ${VOLTPILOT_BROKER_AUTHZ_RELOAD_API_SECRET:}
      username: ${VOLTPILOT_BROKER_AUTHZ_RELOAD_USERNAME:}
      password: ${VOLTPILOT_BROKER_AUTHZ_RELOAD_PASSWORD:}
      timeout: ${VOLTPILOT_BROKER_AUTHZ_RELOAD_TIMEOUT:PT5S}
      debounce: ${VOLTPILOT_BROKER_AUTHZ_RELOAD_DEBOUNCE:PT0.3S}
  # Keycloak Admin REST API access for provisioning customer users. The API
  # authenticates as the voltpilot-api service account (client_credentials) that
  # holds the realm-management roles. base-url is the compose-internal Keycloak.
  keycloak:
    admin:
      base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://keycloak:8080}
      realm: ${KEYCLOAK_REALM:voltpilot}
      client-id: ${KEYCLOAK_API_CLIENT_ID:voltpilot-api}
      client-secret: ${KEYCLOAK_API_CLIENT_SECRET:voltpilot-api-dev-secret}

# Expose actuator at the root so health is reachable at /health (and /info).
#
# The Prometheus scrape endpoint is the actuator endpoint whose id is
# `prometheus`, so with the root base-path it would sit at /prometheus. It is
# REMAPPED to /metrics: that is the ecosystem convention (and the ServiceMonitor
# default), while /prometheus only leaks the framework name into an ops
# contract. The JSON `metrics` endpoint (actuator id `metrics`) is deliberately
# NOT exposed, so /metrics is unambiguously the scrape endpoint.
#
# It answers ANONYMOUSLY - Prometheus scrapes without a token - which is why
# SecurityConfig permits exactly this one path (MetricsEndpointSecurityTest
# guards both halves). It is not publicly reachable: the frontend nginx proxies
# only /api/ and /auth/, so it exists only on the pod/compose network.
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
