# Demo-Umgebung zum Durchklicken - lokal, nie gegen Produktion.
#
# Liegt über `docker-compose.yml` UND `infra/local/pruefumgebung/docker-compose.pruefumgebung.yml`
# (Bühnen-Uhr 30.04.2029 für das Energiemanagement von Ahrenberg). Nur über
# `infra/local/demo/demo.sh` benutzen: eigenes Compose-Projekt `voltpilot-demo`, eigene Volumes.
#
# Was diese Datei ändert und warum:
# - `portal`: das GEBAUTE Portal (frontend/portal/dist) hinter der nginx.conf des Portal-Images auf
#   http://localhost:5173 - dieselbe Adresse wie der Dev-Server, darum passen Keycloak-Redirects und CORS.
#   Die CSP bekommt `http://localhost:8081` dazu: lokal liegt Keycloak auf eigenem Port, in Produktion
#   unter /auth derselben Adresse.
# - `timescaledb`, `keycloak`: Init-SQL, Realm und Login-Theme stecken im Image statt als Bind-Mount.
#   Die Demo läuft weiter, wenn der Arbeitsbaum, aus dem sie gestartet wurde, später verschwindet.
# - Speichergrenzen: der ganze Stapel teilt sich die Docker-VM mit den Testläufen der anderen Bahnen.
services:
  timescaledb:
    build:
      context: .
      dockerfile_inline: |
        FROM timescale/timescaledb:2.17.2-pg16
        COPY infra/local/timescale/ /docker-entrypoint-initdb.d/
    image: voltpilot-demo-timescaledb
    volumes: !override
      - timescale-data:/var/lib/postgresql/data
    environment:
      # timescaledb-tune (nur beim ersten Anlegen) rechnet sonst mit der ganzen VM.
      TS_TUNE_MEMORY: 1GB
      TS_TUNE_NUM_CPUS: "2"
    # Das Tuning für 1 GB setzt max_connections = 25; api, ingest, writer, Sammler, Optimierer und
    # der Welt-Aufbau brauchen zusammen mehr. Die Kommandozeile gilt auch für ein bestehendes Volume.
    command: ["postgres", "-c", "max_connections=200"]
    mem_limit: 1200m

  keycloak:
    build:
      context: .
      dockerfile_inline: |
        FROM quay.io/keycloak/keycloak:26.0.5
        COPY infra/local/keycloak/ /opt/keycloak/data/import/
        COPY deploy/keycloak/themes/voltpilot/ /opt/keycloak/themes/voltpilot/
    image: voltpilot-demo-keycloak
    volumes: !reset []
    environment:
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx512m"
    mem_limit: 900m

  api:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx1g -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC"
    mem_limit: 1600m

  redpanda:
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=400M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
    mem_limit: 700m

  emqx:
    mem_limit: 450m

  ingest:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:+UseSerialGC"
    mem_limit: 450m

  writer:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:+UseSerialGC"
    mem_limit: 450m

  market-data:
    mem_limit: 300m

  weather-collector:
    mem_limit: 300m

  forecast-collector:
    mem_limit: 600m

  optimizer:
    mem_limit: 900m

  simulation:
    environment:
      SIM_MAX_WORKERS: "1"
      WHATIF_MAX_CONCURRENT: "1"
    mem_limit: 700m

  # Die simulierte Box der Anlage „Demo“ (Mandant `demo`): PV, Speicher, Hauslast als v1-Telemetrie
  # über EMQX → ingest → Redpanda → writer. Identität = Demo-Gerät des lokalen Seeds.
  edge-simulator:
    mem_limit: 128m

  # Die simulierten Boxen des UEMS-Kunden Ahrenberg (Mandant 20000000-…-0001): je eine je Anlage/Box
  # des Seeds (`infra/local/seed/ahrenberg.sql`), damit die Anlagen im Portal „liefern Daten“ zeigen und
  # die Flächen „Energie“ und „Erlöse“ Werte tragen. Dieselbe v1-Telemetrie-Strecke wie die Demo-Box
  # (Bild aus `tools/edge-simulator`). Werk Lindach (…0503) entsteht im Weltszenario erst am 15.10.2026;
  # die Box läuft trotzdem mit und meldet, sobald die Anlage dem Standort zugeordnet ist.
  #
  # JEDE Box bekommt ihr EIGENES Profil passend zur Referenzwelt
  # (`docs/contracts/v2/uems-referenzunternehmen.json`, `anlagen[]`/`netzanschluesse[]`) - sonst meldeten
  # alle drei dieselbe Haushalts-PV-Kurve und „reine Messung“-Anlagen speisten ein:
  #  · Halle 1 (AN-1, NA-1 550 kW): die EINZIGE steuernde Anlage - PV 240 kWp + Speicher 200 kWh/100 kW,
  #    Betriebsmodell Lastspitzenkappung (`gewerbe-steuernd`, Netzspitze auf ~300 kW gekappt,
  #    Einspeisegrenze 100 kW laut `netzanschluss_grenzen`).
  #  · Halle 2 (AN-2, NA-2 200 kW) und Werk Lindach (AN-3, NA-3 120 kW): „reine Messung … steuert nicht“,
  #    kein PV, kein Speicher (`gewerbe-mess`): Industrie-Lastgang mit Schichtbetrieb und Netzbezug, NIE
  #    Einspeisung. Größen so, dass die Lastspitze im 15-min-Raster unter der vereinbarten Leistung bleibt.
  # Jahresverbrauch der Welt ~2,2 GWh gesamt (3 Anlagen); die Tageswerte liegen in dieser Größenordnung.
  edge-sim-ahrenberg-halle1:
    build: ./tools/edge-simulator
    container_name: voltpilot-edge-sim-ahrenberg-halle1
    profiles: ["demo"]
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
    mem_limit: 96m
    environment:
      EDGE_SIM_HOST: emqx
      EDGE_SIM_PORT: "1883"
      EDGE_SIM_TENANT_ID: "20000000-0000-0000-0000-000000000001"
      EDGE_SIM_SITE_ID: "20000000-0000-0000-0000-000000000501"
      EDGE_SIM_DEVICE_ID: "20000000-0000-0000-0000-000000000701"
      EDGE_SIM_CLIENT_ID: "edge-sim-ahrenberg-halle1"
      EDGE_SIM_INTERVAL: "5"
      EDGE_SIM_TIME_SCALE: "1"
      # Halle 1 = AN-1: steuernde Anlage, PV 240 kWp + Speicher 200 kWh/100 kW, Lastspitzenkappung.
      EDGE_SIM_PROFILE: "gewerbe-steuernd"
      EDGE_SIM_LOAD_BASE_KW: "70"      # Grundlast (Nacht/Wochenende): Druckluft, Kühlung, Gebäudetechnik
      EDGE_SIM_LOAD_PEAK_KW: "300"     # Produktionslast Spritzguss SG01-06 -> Lastspitze ~390 kW (< 550)
      EDGE_SIM_PV_PEAK_KW: "200"       # 240 kWp Dach Halle 1, AC-seitig wirksam
      EDGE_SIM_BATT_CAPACITY_KWH: "200"
      EDGE_SIM_BATT_MAX_KW: "100"
      EDGE_SIM_SOC_INIT_PCT: "55"
      EDGE_SIM_PEAK_GRID_KW: "300"     # Lastspitzenkappung: Netzbezug auf ~300 kW halten
      EDGE_SIM_EXPORT_LIMIT_KW: "100"  # Einspeisegrenze NA-1 (netzanschluss_grenzen, ab 03.05.2027)
      EDGE_SIM_GRID_LIMIT_KW: "550"    # vereinbarte Leistung NA-1
      EDGE_SIM_SHIFT_START_HOUR: "6"
      EDGE_SIM_SHIFT_END_HOUR: "20"
      EDGE_SIM_WEEKEND_FACTOR: "0.15"
      EDGE_SIM_NOISE: "0.05"
      EDGE_SIM_SEED: "1101"

  edge-sim-ahrenberg-halle2:
    build: ./tools/edge-simulator
    container_name: voltpilot-edge-sim-ahrenberg-halle2
    profiles: ["demo"]
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
    mem_limit: 96m
    environment:
      EDGE_SIM_HOST: emqx
      EDGE_SIM_PORT: "1883"
      EDGE_SIM_TENANT_ID: "20000000-0000-0000-0000-000000000001"
      EDGE_SIM_SITE_ID: "20000000-0000-0000-0000-000000000502"
      EDGE_SIM_DEVICE_ID: "20000000-0000-0000-0000-000000000702"
      EDGE_SIM_CLIENT_ID: "edge-sim-ahrenberg-halle2"
      EDGE_SIM_INTERVAL: "5"
      EDGE_SIM_TIME_SCALE: "1"
      # Halle 2 = AN-2: reine Messung (steuert nicht), kein PV/Speicher -> nur Netzbezug, keine Einspeisung.
      EDGE_SIM_PROFILE: "gewerbe-mess"
      EDGE_SIM_LOAD_BASE_KW: "30"      # Grundlast Halle 2 (Lager-Allgemeinstrom, Standby)
      EDGE_SIM_LOAD_PEAK_KW: "120"     # Spritzguss SG07-10 + Montage M1 -> Lastspitze ~155 kW (< 200)
      EDGE_SIM_GRID_LIMIT_KW: "200"    # vereinbarte Leistung NA-2
      EDGE_SIM_SHIFT_START_HOUR: "6"
      EDGE_SIM_SHIFT_END_HOUR: "22"
      EDGE_SIM_WEEKEND_FACTOR: "0.18"
      EDGE_SIM_NOISE: "0.05"
      EDGE_SIM_SEED: "2102"

  edge-sim-ahrenberg-lindach:
    build: ./tools/edge-simulator
    container_name: voltpilot-edge-sim-ahrenberg-lindach
    profiles: ["demo"]
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
    mem_limit: 96m
    environment:
      EDGE_SIM_HOST: emqx
      EDGE_SIM_PORT: "1883"
      EDGE_SIM_TENANT_ID: "20000000-0000-0000-0000-000000000001"
      EDGE_SIM_SITE_ID: "20000000-0000-0000-0000-000000000503"
      EDGE_SIM_DEVICE_ID: "20000000-0000-0000-0000-000000000703"
      EDGE_SIM_CLIENT_ID: "edge-sim-ahrenberg-lindach"
      EDGE_SIM_INTERVAL: "5"
      EDGE_SIM_TIME_SCALE: "1"
      # Werk Lindach = AN-3: reine Messung (steuert nicht), kein PV/Speicher -> nur Netzbezug, keine Einspeisung.
      # Lager/Logistik + kleine Montage M2: leichter, eine Tagschicht, am Wochenende fast still.
      EDGE_SIM_PROFILE: "gewerbe-mess"
      EDGE_SIM_LOAD_BASE_KW: "16"      # Grundlast (Tore, Förderer, Beleuchtung, Standby)
      EDGE_SIM_LOAD_PEAK_KW: "72"      # Montage M2 + Logistik -> Lastspitze ~90 kW (< 120)
      EDGE_SIM_GRID_LIMIT_KW: "120"    # vereinbarte Leistung NA-3
      EDGE_SIM_SHIFT_START_HOUR: "7"
      EDGE_SIM_SHIFT_END_HOUR: "17"
      EDGE_SIM_WEEKEND_FACTOR: "0.08"
      EDGE_SIM_NOISE: "0.06"
      EDGE_SIM_SEED: "3103"

  portal:
    build:
      context: frontend/portal
      dockerfile_inline: |
        FROM nginx:1.27-alpine
        COPY nginx.conf /etc/nginx/conf.d/default.conf
        RUN sed -i "s#connect-src 'self'#connect-src 'self' http://localhost:8081#; s#frame-src 'self'#frame-src 'self' http://localhost:8081#" /etc/nginx/conf.d/default.conf \
         && grep -q "connect-src 'self' http://localhost:8081" /etc/nginx/conf.d/default.conf
        COPY dist/ /usr/share/nginx/html/
    image: voltpilot-demo-portal
    container_name: voltpilot-portal
    profiles: ["demo"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      keycloak:
        condition: service_started
    ports:
      - "${PORTAL_PORT:-5173}:80"
    mem_limit: 64m
