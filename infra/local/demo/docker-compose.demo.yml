# Demo-Umgebung zum Durchklicken - lokal, nie gegen Produktion.
#
# Liegt über `docker-compose.yml` UND `infra/local/pruefumgebung/docker-compose.pruefumgebung.yml`
# (Bühnen-Uhr 30.04.2029 für das Energiemanagement von Ahrenberg). Nur über
# `infra/local/demo/demo.sh` benutzen: eigenes Compose-Projekt `voltpilot-demo`, eigene Volumes.
#
# Was diese Datei ändert und warum:
# - `portal`: das GEBAUTE Portal (frontend/portal/dist) hinter der nginx.conf des Portal-Images auf
#   http://localhost:5173 - dieselbe Adresse wie der Dev-Server, darum passen Keycloak-Redirects und CORS.
#   Die CSP bekommt `http://localhost:8081` dazu: lokal liegt Keycloak auf eigenem Port, in Produktion
#   unter /auth derselben Adresse.
# - `timescaledb`, `keycloak`: Init-SQL, Realm und Login-Theme stecken im Image statt als Bind-Mount.
#   Die Demo läuft weiter, wenn der Arbeitsbaum, aus dem sie gestartet wurde, später verschwindet.
# - Speichergrenzen: der ganze Stapel teilt sich die Docker-VM mit den Testläufen der anderen Bahnen.
services:
  timescaledb:
    build:
      context: .
      dockerfile_inline: |
        FROM timescale/timescaledb:2.17.2-pg16
        COPY infra/local/timescale/ /docker-entrypoint-initdb.d/
    image: voltpilot-demo-timescaledb
    volumes: !override
      - timescale-data:/var/lib/postgresql/data
    environment:
      # timescaledb-tune (nur beim ersten Anlegen) rechnet sonst mit der ganzen VM.
      TS_TUNE_MEMORY: 1GB
      TS_TUNE_NUM_CPUS: "2"
    # Das Tuning für 1 GB setzt max_connections = 25; api, ingest, writer, Sammler, Optimierer und
    # der Welt-Aufbau brauchen zusammen mehr. Die Kommandozeile gilt auch für ein bestehendes Volume.
    command: ["postgres", "-c", "max_connections=200"]
    mem_limit: 1200m

  keycloak:
    build:
      context: .
      dockerfile_inline: |
        FROM quay.io/keycloak/keycloak:26.0.5
        COPY infra/local/keycloak/ /opt/keycloak/data/import/
        COPY deploy/keycloak/themes/voltpilot/ /opt/keycloak/themes/voltpilot/
    image: voltpilot-demo-keycloak
    volumes: !reset []
    environment:
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx512m"
    mem_limit: 900m

  api:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx1g -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC"
    mem_limit: 1600m

  redpanda:
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=400M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
    mem_limit: 700m

  emqx:
    mem_limit: 450m

  ingest:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:+UseSerialGC"
    mem_limit: 450m

  writer:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:+UseSerialGC"
    mem_limit: 450m

  market-data:
    mem_limit: 300m

  weather-collector:
    mem_limit: 300m

  forecast-collector:
    mem_limit: 600m

  optimizer:
    mem_limit: 900m

  simulation:
    environment:
      SIM_MAX_WORKERS: "1"
      WHATIF_MAX_CONCURRENT: "1"
    mem_limit: 700m

  # Die simulierte Box der Anlage „Demo“ (Mandant `demo`): PV, Speicher, Hauslast als v1-Telemetrie
  # über EMQX → ingest → Redpanda → writer. Identität = Demo-Gerät des lokalen Seeds.
  edge-simulator:
    mem_limit: 128m

  portal:
    build:
      context: frontend/portal
      dockerfile_inline: |
        FROM nginx:1.27-alpine
        COPY nginx.conf /etc/nginx/conf.d/default.conf
        RUN sed -i "s#connect-src 'self'#connect-src 'self' http://localhost:8081#; s#frame-src 'self'#frame-src 'self' http://localhost:8081#" /etc/nginx/conf.d/default.conf \
         && grep -q "connect-src 'self' http://localhost:8081" /etc/nginx/conf.d/default.conf
        COPY dist/ /usr/share/nginx/html/
    image: voltpilot-demo-portal
    container_name: voltpilot-portal
    profiles: ["demo"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      keycloak:
        condition: service_started
    ports:
      - "${PORTAL_PORT:-5173}:80"
    mem_limit: 64m
