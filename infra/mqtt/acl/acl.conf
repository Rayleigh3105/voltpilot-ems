%%============================================================================
%% VoltPilot EMQX authorization (file source).
%%
%% Active ONLY on the secured broker (docker-compose.prod.yml wires this file
%% into EMQX as an authorization source and enables the mTLS listener on 8883).
%% The base dev stack does NOT enable this file, so plaintext 1883 stays open
%% for local development and the internal ingest consumer.
%%
%% Identity model: the mTLS listener maps peer_cert_as_username = cn, so a
%% device's MQTT username is its device_id (UUID, the cert CN). tenant_id and
%% site_id live in the cert O / OU (audit) and in each per-device grant below.
%%
%% Rules are evaluated top-down, FIRST MATCH WINS. Do not reorder the sections.
%% Regenerate the per-device grants with tools/pki/voltpilot-ca.sh (issue/revoke).
%%============================================================================

%% --- Dashboard: allow the built-in dashboard user to watch $SYS. ------------
{allow, {username, "dashboard"}, subscribe, ["$SYS/#"]}.

%% --- Internal backbone services (ingest / timescale-writer). ----------------
%% They connect over the trusted, firewalled plaintext listener (1883) using
%% the username "vp-internal" and need the full ems/# tree (ingest subscribes
%% to ems/+/+/+/telemetry across all tenants). Keep 1883 internal-only in prod.
{allow, {username, "vp-internal"}, all, ["#"]}.

%% --- Per-device grants (GENERATED - do not hand-edit between the anchors). ---
%% Each device may publish ONLY its own telemetry/status (+ its own v2/# subtree
%% up) and subscribe ONLY to its own schedule/command/config (+ its own v2/#
%% subtree down - decision D-2, docs/contracts/v2/mqtt-schedule-2.0.md #1).
%% tools/pki/voltpilot-ca.sh inserts one block per issued device here and
%% removes it on revoke.
%%<<BEGIN GENERATED DEVICE GRANTS>>
%%<<device 00000000-0000-0000-0000-000000000003 tenant 00000000-0000-0000-0000-000000000001 site 00000000-0000-0000-0000-000000000002>>
{allow, {username, "00000000-0000-0000-0000-000000000003"}, publish,   ["ems/00000000-0000-0000-0000-000000000001/00000000-0000-0000-0000-000000000002/00000000-0000-0000-0000-000000000003/telemetry", "ems/00000000-0000-0000-0000-000000000001/00000000-0000-0000-0000-000000000002/00000000-0000-0000-0000-000000000003/status"]}.
{allow, {username, "00000000-0000-0000-0000-000000000003"}, subscribe, ["ems/00000000-0000-0000-0000-000000000001/00000000-0000-0000-0000-000000000002/00000000-0000-0000-0000-000000000003/schedule", "ems/00000000-0000-0000-0000-000000000001/00000000-0000-0000-0000-000000000002/00000000-0000-0000-0000-000000000003/command", "ems/00000000-0000-0000-0000-000000000001/00000000-0000-0000-0000-000000000002/00000000-0000-0000-0000-000000000003/config"]}.
{deny, {username, "00000000-0000-0000-0000-000000000003"}, publish,   ["ems/00000000-0000-0000-0000-000000000001/00000000-0000-0000-0000-000000000002/00000000-0000-0000-0000-000000000003/v2/measurement-config"]}.
{deny, {username, "00000000-0000-0000-0000-000000000003"}, subscribe, ["ems/00000000-0000-0000-0000-000000000001/00000000-0000-0000-0000-000000000002/00000000-0000-0000-0000-000000000003/v2/measurement-config-status", "ems/00000000-0000-0000-0000-000000000001/00000000-0000-0000-0000-000000000002/00000000-0000-0000-0000-000000000003/v2/measurement-samples"]}.
{allow, {username, "00000000-0000-0000-0000-000000000003"}, publish,   ["ems/00000000-0000-0000-0000-000000000001/00000000-0000-0000-0000-000000000002/00000000-0000-0000-0000-000000000003/v2/#"]}.
{allow, {username, "00000000-0000-0000-0000-000000000003"}, subscribe, ["ems/00000000-0000-0000-0000-000000000001/00000000-0000-0000-0000-000000000002/00000000-0000-0000-0000-000000000003/v2/#"]}.
%%<<end device 00000000-0000-0000-0000-000000000003>>
%%<<END GENERATED DEVICE GRANTS>>

%% --- Default-deny for devices. ----------------------------------------------
%% Any client whose username is a UUID (i.e. an mTLS device) that was NOT
%% matched by a grant above is denied every topic. This is what makes
%% revocation "remove the grant": an ungranted device_id falls straight here.
{deny, {username, {re, "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"}}, all, ["#"]}.

%% --- Protect $SYS from everyone else. ---------------------------------------
{deny, all, subscribe, ["$SYS/#"]}.

%% --- Anonymous internal/dev clients on the trusted plaintext listener. ------
%% Reached only by clients WITHOUT a UUID username (empty-username backbone
%% clients on 1883). Devices never reach this line. 1883 must stay firewalled.
{allow, all}.
