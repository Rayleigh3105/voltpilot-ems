# NW-3-Ueberlagerung ueber edge-app/docker-compose.yml + test/docker-compose.e2e.yml
# DES TAGS. Sie aendert nur, was dieses Rig braucht, und nichts am Verhalten der
# Box: die Bilder sind lokal aus dem Tag gebaut (pull_policy never - sonst zoege
# `up` das :latest aus der Registry und der Lauf pruefte den falschen Stand).
services:
  cloud-broker:
    image: ${NW3_BROKER_IMAGE:-nw3-broker:local}
    pull_policy: never
  core:
    pull_policy: never
  nodered:
    pull_policy: never
  edge-sim:
    image: ${NW3_SIM_IMAGE:-nw3-edge-sim:local}
    pull_policy: never
