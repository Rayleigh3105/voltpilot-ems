# Stand-Blatt des Betreibers - VORLAGE.
#
# Die echte Datei gehoert NICHT ins Repo: sie liegt beim Betreiber, er pflegt sie
# selbst, und der Tor-Pruefer liest sie nur (`--stand /BETREIBER/freigabe-stand.yaml`).
# Das Werkzeug fragt nie interaktiv und raet nie.
#
# Hier steht ausschliesslich, was nur der Betreiber wissen kann. Ein Eintrag hier
# macht einen Punkt NICHT gruen: der Tor-Pruefer gibt ihn als
# "nicht maschinell pruefbar" mit Datum und Wortlaut zurueck. Was sich pruefen
# laesst - Testlaeufe, Generalprobe, Bestandsblatt, git - kommt NIE aus dieser Datei.
#
# Form (streng, zwei Ebenen, zwei Leerzeichen Einzug):
#   punkt:
#     bestaetigt: ja|nein
#     am: JJJJ-MM-TT          (Pflicht bei "ja")
#     durch: <Name oder Rolle>
#     beleg: <ein Satz, woran es der Betreiber festmacht>
#
# Ein fehlender Punkt und "bestaetigt: nein" sind beide "offen" - mit dem
# Unterschied, dass "nein" den Grund aus "beleg:" mitnennt.

