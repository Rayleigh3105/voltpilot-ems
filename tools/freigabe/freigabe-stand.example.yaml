# Stand-Blatt des Betreibers - VORLAGE.
#
# Die echte Datei gehoert NICHT ins Repo: sie liegt beim Betreiber, er pflegt sie
# selbst, und der Tor-Pruefer liest sie nur (`--stand /BETREIBER/freigabe-stand.yaml`).
# Das Werkzeug fragt nie interaktiv und raet nie.
#
# Hier steht ausschliesslich, was nur der Betreiber wissen kann. Ein Eintrag hier
# macht einen Punkt NICHT gruen: der Tor-Pruefer gibt ihn als
# "nicht maschinell pruefbar" mit Datum und Wortlaut zurueck. Was sich pruefen
# laesst - Testlaeufe, Generalprobe, Bestandsblatt, git - kommt NIE aus dieser Datei.
#
# Form (streng, zwei Ebenen, zwei Leerzeichen Einzug):
#   punkt:
#     bestaetigt: ja|nein
#     am: JJJJ-MM-TT          (Pflicht bei "ja")
#     durch: <Name oder Rolle>
#     beleg: <ein Satz, woran es der Betreiber festmacht>
#
# Ein fehlender Punkt und "bestaetigt: nein" sind beide "offen" - mit dem
# Unterschied, dass "nein" den Grund aus "beleg:" mitnennt.

# ---------------------------------------------------------------------------
# G1 - Ausrollen
# ---------------------------------------------------------------------------

m1_ausgewertet:
  bestaetigt: nein
  beleg: Bestandsblatt gegen Produktion noch nicht gefahren, Q03 Lage c/f offen

# Q15 "WAL-Archiv laeuft" (AP-20 IP-19, BT2): eigener Punkt, weil er auch die
# Zusage Z-015 der Bewertung traegt (tools/bewertung/uebungen.py). M-1b ist erst
# bestaetigt, wenn m1_ausgewertet UND dieser Punkt es sind. "ja" nur, wenn am
# selben Tag BEIDES gilt: Bestandsblatt Q15 ohne Befund (letzte Archivierung
# juenger als 1 h, Fehler steigen nicht) und
# /srv/docker/voltpilot/tools/backup/vp-db-backup-check.sh mit Exit 0.
# durch: eine benannte Person, nicht nur die Rolle - "Betreiber (M. K.)", nie
# "Betreiber" allein; ohne sie bleibt Z-015 in der Bewertung offen (AP-20 NR4).
# beleg: die drei OK-Zeilen des Alterschecks in einem Satz, etwa
#   "vp-db-backup-check.sh Exit 0: Basis-Backup 20261004T024012Z (9 h alt),
#    WAL-Archiv aktuell (2 min), archive_mode=on, Archiver ok"
