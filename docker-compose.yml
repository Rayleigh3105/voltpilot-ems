# =============================================================================
# Voltpilot-EMS - local development stack (stateful backbone)
# -----------------------------------------------------------------------------
# `docker compose up -d` brings up the MVP data-path backbone:
#   EMQX (MQTT) -> [Ingest] -> Redpanda (event log) -> [Writer] -> TimescaleDB
# plus Keycloak (OIDC). The JVM/Python app services are scaffolded under
# services/* with their own Dockerfiles; they are intentionally NOT started
# here yet (backbone-first). See README.md and AGENTS.md.
#
# All credentials come from .env (copy .env.example -> .env). DEV-ONLY secrets.
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-voltpilot}

services:
  # ---------------------------------------------------------------------------
  # TimescaleDB: one Postgres instance for timeseries (hypertables) + master
  # data. Init scripts in infra/local/timescale/ enable the extension and lay
  # down the example telemetry hypertable + stammdaten tables.
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: voltpilot-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voltpilot}
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltpilot_dev_pw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      # *.sql / *.sh here run once, in filename order, on first init.
      - ./infra/local/timescale:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voltpilot} -d ${POSTGRES_DB:-voltpilot}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # EMQX: MQTT 5.0 broker (device ingress). Dashboard on :18083.
  # Topic convention: ems/{tenant_id}/{site_id}/{device_id}/{telemetry|status|
  # schedule|command|config}. See docs/contracts/mqtt-telemetry.schema.json.
  # ---------------------------------------------------------------------------
  emqx:
    image: emqx/emqx:5.8.3
    container_name: voltpilot-emqx
    restart: unless-stopped
    environment:
      EMQX_NODE__COOKIE: voltpilot_dev_cookie
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-voltpilot_dev_pw}
    ports:
      - "${EMQX_MQTT_PORT:-1883}:1883"       # MQTT
      - "${EMQX_MQTT_TLS_PORT:-8883}:8883"   # MQTT over TLS
      - "${EMQX_WS_PORT:-8083}:8083"         # MQTT over WebSocket
      - "${EMQX_DASHBOARD_PORT:-18083}:18083" # Dashboard
    volumes:
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Redpanda: single-broker Kafka-API event log (durable replay, consumer
  # decoupling). No Zookeeper/JVM. Topic telemetry.raw created by redpanda-init.
  # ---------------------------------------------------------------------------
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: voltpilot-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      # Advertise an internal listener (compose network) and an external one
      # (host) so both in-cluster services and host tooling can connect.
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "${REDPANDA_KAFKA_PORT:-9092}:9092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # One-shot: create the MVP telemetry.raw topic, then exit 0.
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    container_name: voltpilot-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        rpk topic create ${REDPANDA_TELEMETRY_TOPIC:-telemetry.raw}
        --brokers redpanda:29092
        --partitions ${REDPANDA_TELEMETRY_PARTITIONS:-3}
        --replicas 1 || true;
        rpk topic create ${REDPANDA_TELEMETRY_V2_TOPIC:-telemetry-v2.raw}
        --brokers redpanda:29092
        --partitions ${REDPANDA_TELEMETRY_PARTITIONS:-3}
        --replicas 1 || true;
        rpk topic list --brokers redpanda:29092
    restart: "no"

  # Redpanda Console: web UI for topics/consumers (dev convenience).
  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: voltpilot-redpanda-console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8080}:8080"

  # ---------------------------------------------------------------------------
  # Keycloak: OIDC provider. Dev realm `voltpilot` imported on start with one
  # client for the API and one for the frontend. Admin console on :8081.
  #
  # KC_HOSTNAME pins the issuer/frontend URL to http://localhost:8081. This is
  # the fix for the issuer trap: every token (browser- or script-minted) now
  # carries iss=http://localhost:8081/realms/voltpilot, which the API validates,
  # while the API fetches JWKS over the internal keycloak:8080 URL (see the api
  # service's OIDC_JWK_SET_URI). Issuer host and JWKS host are decoupled, so a
  # browser-obtained token validates on the compose-internal resource server.
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    container_name: voltpilot-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-voltpilot_dev_pw}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8081}
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./infra/local/keycloak:/opt/keycloak/data/import:ro
      # VoltPilot login theme (deploy/keycloak/themes/voltpilot). start-dev keeps
      # the theme cache off, so CSS edits show up on reload; the realm import
      # selects it via loginTheme. A keycloak RESTART is needed once after the
      # mount is first added.
      - ./deploy/keycloak/themes/voltpilot:/opt/keycloak/themes/voltpilot:ro
    healthcheck:
      # KC 26 exposes health on the management port 9000; /health/ready is the
      # readiness gate. curl is not in the image, so probe via the bundled JRE.
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/localhost/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'"
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 40s

  # ---------------------------------------------------------------------------
  # EDGE (field side). Guarded behind the `edge` profile so the default
  # `docker compose up -d` stays backbone-only. Bring the edge up with:
  #   docker compose --profile edge up -d --build edge-sim edge-nodered
  # See edge/node-red/README.md.
  # ---------------------------------------------------------------------------

  # Simulated SunSpec Modbus TCP inverter/battery (stands in for hardware).
  edge-sim:
    build: ./edge/sim
    container_name: voltpilot-edge-sim
    profiles: ["edge"]
    restart: unless-stopped
    # Modbus TCP 502 is reachable in-cluster as `edge-sim:502`. Exposed on the host
    # (15020) only for debugging with a Modbus client.
    ports:
      - "${EDGE_SIM_PORT:-15020}:502"

  # Thin Node-RED edge runtime. Reaches EMQX at `emqx:1883` and the simulator
  # at `edge-sim:502` over the compose network (both in-cluster names).
  edge-nodered:
    build: ./edge/node-red
    container_name: voltpilot-edge-nodered
    profiles: ["edge"]
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
      edge-sim:
        condition: service_started
    environment:
      # Device identity + battery envelope (defaults mirror the dev seed).
      VP_TENANT_ID: ${VP_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      VP_SITE_ID: ${VP_SITE_ID:-00000000-0000-0000-0000-000000000002}
      VP_DEVICE_ID: ${VP_DEVICE_ID:-00000000-0000-0000-0000-000000000003}
    ports:
      - "${EDGE_NODERED_PORT:-1880}:1880" # Node-RED editor (dev only)

  # Standalone edge simulator (tools/edge-simulator): a dependency-light Python
  # MQTT publisher that emits a believable PV/battery/load day straight to EMQX.
  # It is the containerized form of the drop-on-a-Pi artifact; guarded behind its
  # OWN `sim` profile (NOT `edge`) so it never double-publishes with edge-nodered
  # under the same device id. Bring it up with:
  #   docker compose --profile edge up -d emqx ingest timescale-writer   # ingest path
  #   docker compose --profile sim  up -d --build edge-simulator          # the publisher
  # Defaults mirror the `demo` dev seed, so rows land in the demo telemetry view.
  edge-simulator:
    build: ./tools/edge-simulator
    container_name: voltpilot-edge-simulator
    profiles: ["sim"]
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
    environment:
      EDGE_SIM_HOST: emqx
      EDGE_SIM_PORT: "1883"
      EDGE_SIM_TENANT_ID: ${VP_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      EDGE_SIM_SITE_ID: ${VP_SITE_ID:-00000000-0000-0000-0000-000000000002}
      EDGE_SIM_DEVICE_ID: ${VP_DEVICE_ID:-00000000-0000-0000-0000-000000000003}
      EDGE_SIM_INTERVAL: ${EDGE_SIM_INTERVAL:-5}
      # time-scale >1 replays a full day quickly for a demo; 1 = realtime.
      EDGE_SIM_TIME_SCALE: ${EDGE_SIM_TIME_SCALE:-1}
      EDGE_SIM_VERBOSE: "true"

  # Portal API (Spring Boot): the user-facing spine. OAuth2 resource server
  # (validates Keycloak JWTs), tenant-scoped REST over TimescaleDB with
  # Postgres Row-Level-Security, and device claiming. On start it runs Flyway
  # migrations as the Postgres superuser (creating the non-privileged
  # voltpilot_app role, the RLS policies and - under the `local` profile - the
  # two-tenant dev seed), then serves requests as voltpilot_app so RLS applies.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: voltpilot-api
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      # Activates the dev seed migrations (two tenants + demo telemetry).
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8090
      # Runtime connection: non-privileged app role (RLS applies to it).
      POSTGRES_JDBC_URL: jdbc:postgresql://timescaledb:5432/${POSTGRES_DB:-voltpilot}
      APP_DB_USER: ${APP_DB_USER:-voltpilot_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-voltpilot_app_dev_pw}
      # Dedicated cross-tenant admin role (BYPASSRLS, created by Flyway V4) used
      # ONLY by the platform-admin API; customer endpoints keep using the app role.
      ADMIN_DB_USER: ${ADMIN_DB_USER:-voltpilot_admin}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-voltpilot_admin_dev_pw}
      # Flyway connection: Postgres superuser (owns schema, creates role + RLS).
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltpilot_dev_pw}
      # OIDC on. Issuer is the browser-facing Keycloak URL; JWKS is fetched over
      # the compose-internal URL (the issuer-trap fix - see the keycloak block).
      VOLTPILOT_SECURITY_OIDC_ENABLED: "true"
      # Public self-service registration (portal "Konto erstellen"); on in dev.
      VOLTPILOT_REGISTRATION_ENABLED: ${VOLTPILOT_REGISTRATION_ENABLED:-true}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8081/realms/voltpilot}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:-http://keycloak:8080/realms/voltpilot/protocol/openid-connect/certs}
      # Keycloak Admin REST API (provisioning customer users). The API calls it as
      # the voltpilot-api service account; base-url is the compose-internal host.
      KEYCLOAK_ADMIN_BASE_URL: ${KEYCLOAK_ADMIN_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-voltpilot}
      KEYCLOAK_API_CLIENT_ID: ${KEYCLOAK_API_CLIENT_ID:-voltpilot-api}
      KEYCLOAK_API_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET:-voltpilot-api-dev-secret}
      VOLTPILOT_CORS_ALLOWED_ORIGINS: ${VOLTPILOT_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Which forecast model is LIVE per kind. Since the portal promotion
      # switch (docs/forecasting.md) these are the DEFAULT: a row in
      # site_forecast_model_choice (je Anlage) bzw. forecast_model_choice
      # (plattformweit) wins over them. Keep them in sync with
      # forecast-collector + optimizer (same .env variables) - all three
      # resolve the SAME precedence, so they cannot disagree.
      VOLTPILOT_ACTIVE_LOAD_MODEL: ${VOLTPILOT_ACTIVE_LOAD_MODEL:-load-persistence}
      VOLTPILOT_ACTIVE_PV_MODEL: ${VOLTPILOT_ACTIVE_PV_MODEL:-pv-physical}
      # Api-side mirror of the optimizer's platform tunables (admin optimizer
      # panel + per-slot diagnostics) - same .env variables as the optimization
      # service, so the display and the solver never disagree.
      OPTIMIZER_WEAR_COST_CT_PER_KWH: ${OPTIMIZER_WEAR_COST_CT_PER_KWH:-4.0}
      OPTIMIZER_TERMINAL_VALUE_QUANTILE: ${OPTIMIZER_TERMINAL_VALUE_QUANTILE:-0.3}
      OPTIMIZER_TERMINAL_VALUE_CT_PER_KWH: ${OPTIMIZER_TERMINAL_VALUE_CT_PER_KWH:-}
      OPTIMIZER_EEG_RATES_JSON: ${OPTIMIZER_EEG_RATES_JSON:-}
      OPTIMIZER_DEFAULT_SUPPLY_COMPONENTS: ${OPTIMIZER_DEFAULT_SUPPLY_COMPONENTS:-true}
      # Marktstammdatenregister ("Anlage verknüpfen"): blank = the keyless public
      # JSON backend; set the captain's Webdienst credentials to use the official
      # SOAP webservice instead (see AGENTS.md, "MaStR integration").
      MASTR_API_KEY: ${MASTR_API_KEY:-}
      MASTR_MARKTAKTEUR_NUMMER: ${MASTR_MARKTAKTEUR_NUMMER:-}
      # Zero-touch onboarding: on claim, publish the retained provision/{ref}/config
      # (docs/contracts/mqtt-provisioning.schema.json). Best-effort - the api stays
      # healthy without the broker; the ingest resolver answers hello retries.
      VOLTPILOT_PROVISIONING_ENABLED: "true"
      MQTT_BROKER_URL: tcp://emqx:1883
      # Device-initiated data purge: consume purge_request messages from the
      # status topic (docs/contracts/mqtt-data-purge.schema.json).
      VOLTPILOT_PURGE_MQTT_LISTENER_ENABLED: "true"
      # Inverter-control confirmation: ingest the additive `control` block of the
      # status heartbeat into device_control_status (portal "Steuerung" strip).
      VOLTPILOT_CONTROL_MQTT_LISTENER_ENABLED: "true"
      # Feed-in curtailment ("Abregeln"): ingest the additive `curtailment` block
      # into device_curtailment_status, so the portal can tell a planned Abregeln
      # slot that IS executed from one the plant cannot execute yet.
      VOLTPILOT_CURTAILMENT_MQTT_LISTENER_ENABLED: "true"
      # Consumer runtime status (Verbrauchssteuerung Inkrement 3, D9): the
      # heartbeat consumers block -> consumer_runtime_status.
      VOLTPILOT_CONSUMERS_MQTT_LISTENER_ENABLED: "true"
      # Register schreiben ueber das Portal: der CLOUD-NOT-AUS. Vorgabe AN.
      # Er ist der EINZIGE plattformweite Hebel - auf der Box gibt es seit der
      # Captain-Korrektur vom 20.08.2026 KEIN Feature-Flag mehr (D2
      # KORRIGIERT), der Einmal-Schreibpfad ist dort immer verfuegbar. Auf
      # "false" gesetzt refuesieren die zwei SCHREIBENDEN Schritte mit 503 und
      # deutschem Grund; Ziel-Liste, Register-Wissen und VERLAUF bleiben lesbar
      # - das Schreiben abzuschalten darf die Papier-Spur nie verstecken.
      VOLTPILOT_REGISTER_WRITE_ENABLED: "${VOLTPILOT_REGISTER_WRITE_ENABLED:-true}"
      # Verbrauchssteuerung Inkrement 4: the consumer-policy activation gates,
      # BOTH default OFF (tests/rig only; Produktivierung ist Inkrement 5). The
      # stop paths (deactivate/pause + retained-artifact retraction) ignore
      # them by design (Flag aus != gestoppt).
      VOLTPILOT_CONSUMER_CONTROL_ENABLED: ${VOLTPILOT_CONSUMER_CONTROL_ENABLED:-false}
      VOLTPILOT_CONSUMER_POLICY_COMPILER_ENABLED: ${VOLTPILOT_CONSUMER_POLICY_COMPILER_ENABLED:-false}
      # D8 event replanning: the trigger listener (sibling on the status
      # topic) - on like the other listeners; it only ever CALLS the solve
      # service, which is itself semaphore-bounded.
      VOLTPILOT_CONSUMER_REPLAN_TRIGGER_ENABLED: ${VOLTPILOT_CONSUMER_REPLAN_TRIGGER_ENABLED:-true}
      VOLTPILOT_SOURCES_MQTT_LISTENER_ENABLED: "true"
      VOLTPILOT_CHARGERS_MQTT_LISTENER_ENABLED: "true"
      # OCPP 1.6 station-originated calls/results/errors from the edge journal.
      # The edge already masks tags/secrets; the api repeats redaction before DB.
      VOLTPILOT_OCPP_MQTT_LISTENER_ENABLED: "true"
      VOLTPILOT_OCPP_MQTT_CLIENT_ID: voltpilot-api-ocpp
      VOLTPILOT_OCPP_PRIVACY_PEPPER: ${VOLTPILOT_OCPP_PRIVACY_PEPPER:-voltpilot-local-ocpp-privacy}
      VOLTPILOT_ENTITIES_MQTT_LISTENER_ENABLED: "true"
      # Portal v3 M5: deployment acks + the feature-flagged per-node flow states.
      VOLTPILOT_FLOWS_MQTT_LISTENER_ENABLED: "true"
      # OTA Stufe 0: the top-level `version` + the additive `update` block -
      # which build every box runs, INCLUDING those without a flow deployment
      # (they never send the `flows` block the version ingest above hangs on).
      VOLTPILOT_OTA_MQTT_LISTENER_ENABLED: "true"
      # OTA Stufe 2: derselbe Schalter traegt den Rollout-Waechter (Zustaende
      # fortschreiben, Auto-Halt, Drift-Republish) - ohne den Status-Ingest
      # gaebe es kein gemeldetes IST, gegen das er urteilen koennte. Der
      # RETAINED Verteilweg selbst reitet auf voltpilot.provisioning.* (derselbe
      # Broker wie Provisionierung und Entity-Push), also kein neuer Knopf.
      # Ersparnis-Simulation: the internal simulation service (optimize profile).
      # The api proxies async jobs there; without the service running, starting
      # a simulation returns a friendly 502.
      VOLTPILOT_SIMULATION_BASE_URL: ${VOLTPILOT_SIMULATION_BASE_URL:-http://simulation:8095}
      # Flow compiler: the flowc-serve sidecar (flows profile) the activation
      # path compiles graphs with. Activation is OFF by default; with the flag
      # on but the sidecar down, activation refuses honestly (flow stays
      # "simuliert"), never half-activated.
      VOLTPILOT_FLOWS_COMPILER_BASE_URL: ${VOLTPILOT_FLOWS_COMPILER_BASE_URL:-http://flowc:8099}
    ports:
      - "${API_PORT:-8090}:8090"
    healthcheck:
      # The temurin JRE image has no curl and its /bin/sh is dash (no /dev/tcp),
      # so probe /health explicitly through bash.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/localhost/8090; echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '\"status\":\"UP\"'"
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  # ---------------------------------------------------------------------------
  # LIVE INGEST PIPE (EMQX -> ingest -> Redpanda -> writer -> TimescaleDB).
  # In the `edge` profile so a full `docker compose --profile edge up` brings up
  # the whole live data path alongside the edge; a plain backbone `up` stays
  # lean (portal then shows only dev-seeded telemetry). No host ports are
  # published (health is probed in-container) so these never collide with the
  # shared dev stack.
  # ---------------------------------------------------------------------------

  # Ingest: subscribe to EMQX telemetry topics (QoS1), validate against the
  # telemetry contract, and produce telemetry.raw events to Redpanda keyed by
  # {tenant_id}:{site_id}.
  ingest:
    build:
      context: ./services/ingest
    container_name: voltpilot-ingest
    profiles: ["edge"]
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 8091
      MQTT_BROKER_URL: tcp://emqx:1883
      MQTT_TELEMETRY_TOPIC_FILTER: ${MQTT_TELEMETRY_TOPIC_FILTER:-ems/+/+/+/telemetry}
      REDPANDA_BOOTSTRAP_SERVERS: ${REDPANDA_BOOTSTRAP_SERVERS:-redpanda:29092}
      REDPANDA_TELEMETRY_TOPIC: ${REDPANDA_TELEMETRY_TOPIC:-telemetry.raw}
      REDPANDA_TELEMETRY_V2_TOPIC: ${REDPANDA_TELEMETRY_V2_TOPIC:-telemetry-v2.raw}
      # Zero-touch provisioning resolver: looks a hello's ref up in the device
      # table (trusted backend credentials - a hello carries no tenant) and
      # answers claimed refs with the retained provision/{ref}/config.
      POSTGRES_JDBC_URL: jdbc:postgresql://timescaledb:5432/${POSTGRES_DB:-voltpilot}
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltpilot_dev_pw}
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/localhost/8091; echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '\"status\":\"UP\"'"
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  # Writer: consume telemetry.raw and insert into the TimescaleDB `telemetry`
  # hypertable. Connects as the non-privileged voltpilot_app role and sets the
  # RLS tenant per event, so writes land under the message's tenant exactly
  # where that tenant's portal read finds them. Depends on `api` because api's
  # Flyway migrations own the schema, the RLS policies and the voltpilot_app role.
  writer:
    build:
      context: ./services/timescale-writer
    container_name: voltpilot-writer
    profiles: ["edge"]
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      SERVER_PORT: 8092
      REDPANDA_BOOTSTRAP_SERVERS: ${REDPANDA_BOOTSTRAP_SERVERS:-redpanda:29092}
      REDPANDA_TELEMETRY_TOPIC: ${REDPANDA_TELEMETRY_TOPIC:-telemetry.raw}
      REDPANDA_TELEMETRY_V2_TOPIC: ${REDPANDA_TELEMETRY_V2_TOPIC:-telemetry-v2.raw}
      POSTGRES_JDBC_URL: jdbc:postgresql://timescaledb:5432/${POSTGRES_DB:-voltpilot}
      APP_DB_USER: ${APP_DB_USER:-voltpilot_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-voltpilot_app_dev_pw}
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/localhost/8092; echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '\"status\":\"UP\"'"
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  # ---------------------------------------------------------------------------
  # DATA FEEDS (KEYLESS public sources). Guarded behind the `feeds` profile so
  # the default `docker compose up -d` stays backbone-only. Bring them up with:
  #   docker compose --profile feeds up -d --build market-data weather-collector
  # Both are long-running collectors (no host ports): they refresh on startup and
  # then periodically, writing into hypertables the portal reads.
  # ---------------------------------------------------------------------------

  # Day-ahead spot prices (15-min) from energy-charts.info (Fraunhofer ISE, no
  # API key). `serve` refreshes today+tomorrow on startup then every 6h. Writes
  # into day_ahead_prices as the superuser (public per-zone table, no RLS).
  market-data:
    build:
      context: ./services/market-data
    container_name: voltpilot-market-data
    profiles: ["feeds"]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["serve", "--persist"]
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-voltpilot}
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltpilot_dev_pw}
      # Keyless energy-charts is the default source (no ENTSOE_SECURITY_TOKEN).
      MARKET_DATA_SOURCE: ${MARKET_DATA_SOURCE:-energy-charts}
      MARKET_DATA_ZONE: ${MARKET_DATA_ZONE:-DE-LU}
      MARKET_DATA_REFRESH_SECONDS: ${MARKET_DATA_REFRESH_SECONDS:-21600}
      # Coverage-aware retry: past ~12:45 Berlin, poll every 15 min until
      # tomorrow's prices land (bounded at midnight), then back to baseline.
      MARKET_DATA_FAST_REFRESH_SECONDS: ${MARKET_DATA_FAST_REFRESH_SECONDS:-900}
      MARKET_DATA_PUBLICATION_HOUR: ${MARKET_DATA_PUBLICATION_HOUR:-12.75}

  # Weather forecast (hourly, coming days) from Open-Meteo (EU-hosted, no API
  # key). Reads sites' lat/lon, fetches per site, upserts into weather_forecast.
  # Depends on `api` so the RLS-scoped weather_forecast table + grants exist.
  weather-collector:
    build:
      context: ./services/forecast
    container_name: voltpilot-weather-collector
    profiles: ["feeds"]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      api:
        condition: service_healthy
    entrypoint: ["python", "-m", "voltpilot_forecast.weather_collect"]
    command: ["serve", "--persist"]
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-voltpilot}
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltpilot_dev_pw}
      WEATHER_FORECAST_DAYS: ${WEATHER_FORECAST_DAYS:-3}
      WEATHER_REFRESH_SECONDS: ${WEATHER_REFRESH_SECONDS:-10800}

  # Forecast collector (shadow-mode model registry, docs/forecasting.md): every
  # 15 min it runs the BASELINE models plus the gated XGBoost challengers for
  # every site, persists each run model-tagged into the `forecast` hypertable,
  # keeps the per-model status in forecast_model_state, and once per Berlin day
  # retrains the challengers + runs the forecast/plan evaluation
  # (forecast_accuracy / plan_accuracy). The optimizer consumes ONLY the active
  # model's rows (VOLTPILOT_ACTIVE_*; default = baselines - flip to promote).
  # Depends on `api`: its Flyway owns forecast.model + the quality tables.
  forecast-collector:
    build:
      context: ./services/forecast
    container_name: voltpilot-forecast-collector
    profiles: ["feeds"]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      api:
        condition: service_healthy
    entrypoint: ["python", "-m", "voltpilot_forecast.forecast_collect"]
    command: ["serve"]
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-voltpilot}
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltpilot_dev_pw}
      FORECAST_INTERVAL_SECONDS: ${FORECAST_INTERVAL_SECONDS:-900}
      FORECAST_HORIZON_HOURS: ${FORECAST_HORIZON_HOURS:-24}
      # Challenger self-gate: full telemetry days required before training.
      VOLTPILOT_ML_MIN_DAYS: ${VOLTPILOT_ML_MIN_DAYS:-21}
      # Which model the OPTIMIZER consumes by DEFAULT (a portal promotion in
      # site_forecast_model_choice / forecast_model_choice wins over these;
      # defaults are the baselines).
      VOLTPILOT_ACTIVE_LOAD_MODEL: ${VOLTPILOT_ACTIVE_LOAD_MODEL:-load-persistence}
      VOLTPILOT_ACTIVE_PV_MODEL: ${VOLTPILOT_ACTIVE_PV_MODEL:-pv-physical}

  # ---------------------------------------------------------------------------
  # OPTIMIZATION ENGINE. Own `optimize` profile (not `feeds`: it is a consumer
  # of the feeds and an MQTT publisher, not a keyless collector; not `edge`: it
  # is cloud-side). Bring it up with:
  #   docker compose --profile feeds --profile optimize up -d --build
  # (the feeds provide the day-ahead prices it plans against; without them every
  # site is skipped until prices land). Build context is the REPO ROOT because
  # the image installs services/forecast alongside (persistence-baseline
  # fallback - see services/optimization/Dockerfile).
  # ---------------------------------------------------------------------------

  # Rolling battery-dispatch planner: every 15 min, for every site with a
  # battery asset, solve the cost-optimal 24h schedule, persist it to the
  # `schedule` hypertable and publish it retained to the device's MQTT schedule
  # topic (docs/contracts/mqtt-schedule.schema.json). Depends on `api` because
  # its Flyway owns the schedule table + asset.roundtrip_efficiency_pct.
  optimizer:
    build:
      context: .
      dockerfile: services/optimization/Dockerfile
    container_name: voltpilot-optimizer
    profiles: ["optimize"]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      emqx:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-voltpilot}
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltpilot_dev_pw}
      MQTT_HOST: emqx
      MQTT_PORT: "1883"
      OPTIMIZER_INTERVAL_SECONDS: ${OPTIMIZER_INTERVAL_SECONDS:-900}
      OPTIMIZER_HORIZON_HOURS: ${OPTIMIZER_HORIZON_HOURS:-24}
      # Shadow-mode forecasting: the optimizer reads ONLY the ACTIVE model's
      # rows from the forecast hypertable. These are the DEFAULT - a portal
      # promotion wins - per PLANT (site_forecast_model_choice) over the
      # platform default (forecast_model_choice); the optimizer reads both
      # ONCE per cycle and resolves them PER SITE. Keep in sync with
      # forecast-collector.
      VOLTPILOT_ACTIVE_LOAD_MODEL: ${VOLTPILOT_ACTIVE_LOAD_MODEL:-load-persistence}
      VOLTPILOT_ACTIVE_PV_MODEL: ${VOLTPILOT_ACTIVE_PV_MODEL:-pv-physical}
      # Optimizer-redesign Stage 1 tunables (services/optimization config.py):
      # battery wear cost per kWh cycled (per-asset override via
      # asset.wear_cost_ct_per_kwh) + telemetry freshness windows.
      OPTIMIZER_WEAR_COST_CT_PER_KWH: ${OPTIMIZER_WEAR_COST_CT_PER_KWH:-4.0}
      OPTIMIZER_GRID_LIMIT_MAX_AGE_MINUTES: ${OPTIMIZER_GRID_LIMIT_MAX_AGE_MINUTES:-60}
      OPTIMIZER_SOC_MAX_AGE_MINUTES: ${OPTIMIZER_SOC_MAX_AGE_MINUTES:-120}
      # Structured Bezugspreis: researched default supply components as the
      # fallback for dynamisch-without-Aufschlag / ohne sites WITHOUT a
      # maintained site_supply_price row (report vp-nacht-bezug-e7 §3.1).
      # Default ON (captain decision 2026-07-29) - a site without a
      # maintained price sheet rechnet mit den Default-Komponenten; set
      # this to false to opt out. Mirrored to the api service (same
      # variable) so display and solver agree.
      OPTIMIZER_DEFAULT_SUPPLY_COMPONENTS: ${OPTIMIZER_DEFAULT_SUPPLY_COMPONENTS:-true}
      # The three in-slot price-aware duties published per slot (the edge
      # enforces them against MEASURED values, never a price): the charge-side
      # trim that LOWERS a charge (charge_from_surplus_only), the discharge-side
      # load following (cover_load_from_battery) and the charge-side absorption
      # that RAISES a charge to the measured surplus (charge_surplus_to_battery).
      # SEPARATE levers on purpose - they push the setpoint in different
      # directions on a control path, so one must be stoppable without losing
      # the others. All default ON; off = payloads byte-identical to before and
      # every edge behaves exactly as it did (the fields are FAIL-OPEN on the
      # edge by contract).
      OPTIMIZER_SLOT_TRIM_ENABLED: ${OPTIMIZER_SLOT_TRIM_ENABLED:-true}
      OPTIMIZER_LOAD_FOLLOW_ENABLED: ${OPTIMIZER_LOAD_FOLLOW_ENABLED:-true}
      OPTIMIZER_SURPLUS_CHARGE_ENABLED: ${OPTIMIZER_SURPLUS_CHARGE_ENABLED:-true}
      # MIG v1->v2 migration switch (see docs/migration-v1-to-v2.md): comma-
      # separated site UUIDs to ALSO publish a v2 shadow plan for. Empty (the
      # default) = nothing flagged = byte-identical v1.
      VOLTPILOT_V2_PLAN_SITES: ${VOLTPILOT_V2_PLAN_SITES:-}
      # Verbrauchssteuerung §19 Inkrement 5: the master gate for co-optimizing
      # steuerbare Verbraucher. OFF (default) = a flagged site's v2 plan stays
      # consumer-less, byte-identical to the pre-Inkrement-2 shadow. Turned on
      # per the runbook (docs/verbrauchssteuerung-betrieb.md) after the pilot.
      OPTIMIZER_CONTROLLABLE_LOADS_ENABLED: ${OPTIMIZER_CONTROLLABLE_LOADS_ENABLED:-false}

  # Ersparnis-Simulation service: the SAME optimization image with a different
  # entrypoint (the weather-collector pattern) - an internal async-job HTTP
  # service the api proxies (no auth of its own, never a public port in prod).
  # Prerequisite for real runs: backfill the reference year's prices once, e.g.
  #   docker compose --profile feeds run --rm market-data backfill --year 2025 --persist
  simulation:
    build:
      context: .
      dockerfile: services/optimization/Dockerfile
    container_name: voltpilot-simulation
    profiles: ["optimize"]
    restart: unless-stopped
    command: ["simulate-serve"]
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-voltpilot}
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltpilot_dev_pw}
      SIM_MAX_WORKERS: ${SIM_MAX_WORKERS:-3}
      # Concurrent SYNCHRONOUS admin what-if re-optimizes (design §4.3).
      # A what-if solves in the request thread, so it is bounded: excess
      # calls get 429 instead of starving the simulation jobs' CPU budget.
      WHATIF_MAX_CONCURRENT: ${WHATIF_MAX_CONCURRENT:-2}
      # D8 on-demand replan (POST /replan, Verbrauchssteuerung §13.4): one real
      # cycle per call, bounded; the api's trigger listener debounces per site.
      # MQTT_HOST wires the retained plan publish - without it a replan
      # persists and honestly reports published: false.
      REPLAN_MAX_CONCURRENT: ${REPLAN_MAX_CONCURRENT:-1}
      MQTT_HOST: emqx
      MQTT_PORT: "1883"
      VOLTPILOT_V2_PLAN_SITES: ${VOLTPILOT_V2_PLAN_SITES:-}
      # Verbrauchssteuerung §19 Inkrement 5: same master gate as the optimizer,
      # so a /replan runs the same consumer-less shadow while it is off.
      OPTIMIZER_CONTROLLABLE_LOADS_ENABLED: ${OPTIMIZER_CONTROLLABLE_LOADS_ENABLED:-false}
      # Same pricing layer as the optimizer - keep the ONE price truth
      # (default-supply-components defaults ON platform-wide, opt out with false).
      OPTIMIZER_DEFAULT_SUPPLY_COMPONENTS: ${OPTIMIZER_DEFAULT_SUPPLY_COMPONENTS:-true}
    ports:
      - "127.0.0.1:${SIM_PORT:-8095}:8095"

  # ---------------------------------------------------------------------------
  # flowc-serve: the CLOUD-side flow-graph -> flow-artifact compiler sidecar
  # (E2 flowc; edge-app/nodered/flowc/serve.js). The api compiles flows through
  # it during activation (no Node runtime in the JVM, and the JCS content hash
  # is never reimplemented in Java). Stdlib Node, internal-only, /health probed.
  # In its own `flows` profile so a plain backbone `up` stays lean; the editor's
  # activation is off by default and only the rig flips the flag.
  # ---------------------------------------------------------------------------
  flowc:
    build:
      context: ./edge-app/nodered/flowc
    container_name: voltpilot-flowc
    profiles: ["flows"]
    restart: unless-stopped
    environment:
      FLOWC_PORT: "8099"
    ports:
      - "127.0.0.1:${FLOWC_PORT:-8099}:8099"

volumes:
  timescale-data:
  emqx-data:
  redpanda-data:
