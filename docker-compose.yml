# =============================================================================
# Voltpilot-EMS - local development stack (stateful backbone)
# -----------------------------------------------------------------------------
# `docker compose up -d` brings up the MVP data-path backbone:
#   EMQX (MQTT) -> [Ingest] -> Redpanda (event log) -> [Writer] -> TimescaleDB
# plus Keycloak (OIDC). The JVM/Python app services are scaffolded under
# services/* with their own Dockerfiles; they are intentionally NOT started
# here yet (backbone-first). See README.md and AGENTS.md.
#
# All credentials come from .env (copy .env.example -> .env). DEV-ONLY secrets.
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-voltpilot}

services:
  # ---------------------------------------------------------------------------
  # TimescaleDB: one Postgres instance for timeseries (hypertables) + master
  # data. Init scripts in infra/local/timescale/ enable the extension and lay
  # down the example telemetry hypertable + stammdaten tables.
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: voltpilot-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voltpilot}
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltpilot_dev_pw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      # *.sql / *.sh here run once, in filename order, on first init.
      - ./infra/local/timescale:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voltpilot} -d ${POSTGRES_DB:-voltpilot}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # EMQX: MQTT 5.0 broker (device ingress). Dashboard on :18083.
  # Topic convention: ems/{tenant_id}/{site_id}/{device_id}/{telemetry|status|
  # schedule|command|config}. See docs/contracts/mqtt-telemetry.schema.json.
  # ---------------------------------------------------------------------------
  emqx:
    image: emqx/emqx:5.8.3
    container_name: voltpilot-emqx
    restart: unless-stopped
    environment:
      EMQX_NODE__COOKIE: voltpilot_dev_cookie
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-voltpilot_dev_pw}
    ports:
      - "${EMQX_MQTT_PORT:-1883}:1883"       # MQTT
      - "${EMQX_MQTT_TLS_PORT:-8883}:8883"   # MQTT over TLS
      - "${EMQX_WS_PORT:-8083}:8083"         # MQTT over WebSocket
      - "${EMQX_DASHBOARD_PORT:-18083}:18083" # Dashboard
    volumes:
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Redpanda: single-broker Kafka-API event log (durable replay, consumer
  # decoupling). No Zookeeper/JVM. Topic telemetry.raw created by redpanda-init.
  # ---------------------------------------------------------------------------
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: voltpilot-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      # Advertise an internal listener (compose network) and an external one
      # (host) so both in-cluster services and host tooling can connect.
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "${REDPANDA_KAFKA_PORT:-9092}:9092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # One-shot: create the MVP telemetry.raw topic, then exit 0.
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    container_name: voltpilot-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        rpk topic create ${REDPANDA_TELEMETRY_TOPIC:-telemetry.raw}
        --brokers redpanda:29092
        --partitions ${REDPANDA_TELEMETRY_PARTITIONS:-3}
        --replicas 1 || true;
        rpk topic list --brokers redpanda:29092
    restart: "no"

  # Redpanda Console: web UI for topics/consumers (dev convenience).
  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: voltpilot-redpanda-console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8080}:8080"

  # ---------------------------------------------------------------------------
  # Keycloak: OIDC provider. Dev realm `voltpilot` imported on start with one
  # client for the API and one for the frontend. Admin console on :8081.
  #
  # KC_HOSTNAME pins the issuer/frontend URL to http://localhost:8081. This is
  # the fix for the issuer trap: every token (browser- or script-minted) now
  # carries iss=http://localhost:8081/realms/voltpilot, which the API validates,
  # while the API fetches JWKS over the internal keycloak:8080 URL (see the api
  # service's OIDC_JWK_SET_URI). Issuer host and JWKS host are decoupled, so a
  # browser-obtained token validates on the compose-internal resource server.
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    container_name: voltpilot-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-voltpilot_dev_pw}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8081}
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./infra/local/keycloak:/opt/keycloak/data/import:ro
      # VoltPilot login theme (deploy/keycloak/themes/voltpilot). start-dev keeps
      # the theme cache off, so CSS edits show up on reload; the realm import
      # selects it via loginTheme. A keycloak RESTART is needed once after the
      # mount is first added.
      - ./deploy/keycloak/themes/voltpilot:/opt/keycloak/themes/voltpilot:ro
    healthcheck:
      # KC 26 exposes health on the management port 9000; /health/ready is the
      # readiness gate. curl is not in the image, so probe via the bundled JRE.
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/localhost/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'"
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 40s

  # ---------------------------------------------------------------------------
  # EDGE (field side). Guarded behind the `edge` profile so the default
  # `docker compose up -d` stays backbone-only. Bring the edge up with:
  #   docker compose --profile edge up -d --build edge-sim edge-nodered
  # See edge/node-red/README.md.
  # ---------------------------------------------------------------------------

  # Simulated SunSpec Modbus TCP inverter/battery (stands in for hardware).
  edge-sim:
    build: ./edge/sim
    container_name: voltpilot-edge-sim
    profiles: ["edge"]
    restart: unless-stopped
    # Modbus TCP 502 is reachable in-cluster as `edge-sim:502`. Exposed on the host
    # (15020) only for debugging with a Modbus client.
    ports:
      - "${EDGE_SIM_PORT:-15020}:502"

  # Thin Node-RED edge runtime. Reaches EMQX at `emqx:1883` and the simulator
  # at `edge-sim:502` over the compose network (both in-cluster names).
  edge-nodered:
    build: ./edge/node-red
    container_name: voltpilot-edge-nodered
    profiles: ["edge"]
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
      edge-sim:
        condition: service_started
    environment:
      # Device identity + battery envelope (defaults mirror the dev seed).
      VP_TENANT_ID: ${VP_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      VP_SITE_ID: ${VP_SITE_ID:-00000000-0000-0000-0000-000000000002}
      VP_DEVICE_ID: ${VP_DEVICE_ID:-00000000-0000-0000-0000-000000000003}
    ports:
      - "${EDGE_NODERED_PORT:-1880}:1880" # Node-RED editor (dev only)

  # Standalone edge simulator (tools/edge-simulator): a dependency-light Python
  # MQTT publisher that emits a believable PV/battery/load day straight to EMQX.
  # It is the containerized form of the drop-on-a-Pi artifact; guarded behind its
  # OWN `sim` profile (NOT `edge`) so it never double-publishes with edge-nodered
  # under the same device id. Bring it up with:
  #   docker compose --profile edge up -d emqx ingest timescale-writer   # ingest path
  #   docker compose --profile sim  up -d --build edge-simulator          # the publisher
  # Defaults mirror the `demo` dev seed, so rows land in the demo telemetry view.
  edge-simulator:
    build: ./tools/edge-simulator
    container_name: voltpilot-edge-simulator
    profiles: ["sim"]
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
    environment:
      EDGE_SIM_HOST: emqx
      EDGE_SIM_PORT: "1883"
      EDGE_SIM_TENANT_ID: ${VP_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      EDGE_SIM_SITE_ID: ${VP_SITE_ID:-00000000-0000-0000-0000-000000000002}
      EDGE_SIM_DEVICE_ID: ${VP_DEVICE_ID:-00000000-0000-0000-0000-000000000003}
      EDGE_SIM_INTERVAL: ${EDGE_SIM_INTERVAL:-5}
      # time-scale >1 replays a full day quickly for a demo; 1 = realtime.
      EDGE_SIM_TIME_SCALE: ${EDGE_SIM_TIME_SCALE:-1}
      EDGE_SIM_VERBOSE: "true"

  # Portal API (Spring Boot): the user-facing spine. OAuth2 resource server
  # (validates Keycloak JWTs), tenant-scoped REST over TimescaleDB with
  # Postgres Row-Level-Security, and device claiming. On start it runs Flyway
  # migrations as the Postgres superuser (creating the non-privileged
  # voltpilot_app role, the RLS policies and - under the `local` profile - the
  # two-tenant dev seed), then serves requests as voltpilot_app so RLS applies.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./services/api
    container_name: voltpilot-api
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      # Activates the dev seed migrations (two tenants + demo telemetry).
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8090
      # Runtime connection: non-privileged app role (RLS applies to it).
      POSTGRES_JDBC_URL: jdbc:postgresql://timescaledb:5432/${POSTGRES_DB:-voltpilot}
      APP_DB_USER: ${APP_DB_USER:-voltpilot_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-voltpilot_app_dev_pw}
      # Dedicated cross-tenant admin role (BYPASSRLS, created by Flyway V4) used
      # ONLY by the platform-admin API; customer endpoints keep using the app role.
      ADMIN_DB_USER: ${ADMIN_DB_USER:-voltpilot_admin}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-voltpilot_admin_dev_pw}
      # Flyway connection: Postgres superuser (owns schema, creates role + RLS).
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltpilot_dev_pw}
      # OIDC on. Issuer is the browser-facing Keycloak URL; JWKS is fetched over
      # the compose-internal URL (the issuer-trap fix - see the keycloak block).
      VOLTPILOT_SECURITY_OIDC_ENABLED: "true"
      # Public self-service registration (portal "Konto erstellen"); on in dev.
      VOLTPILOT_REGISTRATION_ENABLED: ${VOLTPILOT_REGISTRATION_ENABLED:-true}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8081/realms/voltpilot}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:-http://keycloak:8080/realms/voltpilot/protocol/openid-connect/certs}
      # Keycloak Admin REST API (provisioning customer users). The API calls it as
      # the voltpilot-api service account; base-url is the compose-internal host.
      KEYCLOAK_ADMIN_BASE_URL: ${KEYCLOAK_ADMIN_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-voltpilot}
      KEYCLOAK_API_CLIENT_ID: ${KEYCLOAK_API_CLIENT_ID:-voltpilot-api}
      KEYCLOAK_API_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET:-voltpilot-api-dev-secret}
      VOLTPILOT_CORS_ALLOWED_ORIGINS: ${VOLTPILOT_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Zero-touch onboarding: on claim, publish the retained provision/{ref}/config
      # (docs/contracts/mqtt-provisioning.schema.json). Best-effort - the api stays
      # healthy without the broker; the ingest resolver answers hello retries.
      VOLTPILOT_PROVISIONING_ENABLED: "true"
      MQTT_BROKER_URL: tcp://emqx:1883
    ports:
      - "${API_PORT:-8090}:8090"
    healthcheck:
      # The temurin JRE image has no curl and its /bin/sh is dash (no /dev/tcp),
      # so probe /health explicitly through bash.
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/localhost/8090; echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '\"status\":\"UP\"'"
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  # ---------------------------------------------------------------------------
  # LIVE INGEST PIPE (EMQX -> ingest -> Redpanda -> writer -> TimescaleDB).
  # In the `edge` profile so a full `docker compose --profile edge up` brings up
  # the whole live data path alongside the edge; a plain backbone `up` stays
  # lean (portal then shows only dev-seeded telemetry). No host ports are
  # published (health is probed in-container) so these never collide with the
  # shared dev stack.
  # ---------------------------------------------------------------------------

  # Ingest: subscribe to EMQX telemetry topics (QoS1), validate against the
  # telemetry contract, and produce telemetry.raw events to Redpanda keyed by
  # {tenant_id}:{site_id}.
  ingest:
    build:
      context: ./services/ingest
    container_name: voltpilot-ingest
    profiles: ["edge"]
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 8091
      MQTT_BROKER_URL: tcp://emqx:1883
      MQTT_TELEMETRY_TOPIC_FILTER: ${MQTT_TELEMETRY_TOPIC_FILTER:-ems/+/+/+/telemetry}
      REDPANDA_BOOTSTRAP_SERVERS: ${REDPANDA_BOOTSTRAP_SERVERS:-redpanda:29092}
      REDPANDA_TELEMETRY_TOPIC: ${REDPANDA_TELEMETRY_TOPIC:-telemetry.raw}
      # Zero-touch provisioning resolver: looks a hello's ref up in the device
      # table (trusted backend credentials - a hello carries no tenant) and
      # answers claimed refs with the retained provision/{ref}/config.
      POSTGRES_JDBC_URL: jdbc:postgresql://timescaledb:5432/${POSTGRES_DB:-voltpilot}
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltpilot_dev_pw}
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/localhost/8091; echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '\"status\":\"UP\"'"
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  # Writer: consume telemetry.raw and insert into the TimescaleDB `telemetry`
  # hypertable. Connects as the non-privileged voltpilot_app role and sets the
  # RLS tenant per event, so writes land under the message's tenant exactly
  # where that tenant's portal read finds them. Depends on `api` because api's
  # Flyway migrations own the schema, the RLS policies and the voltpilot_app role.
  writer:
    build:
      context: ./services/timescale-writer
    container_name: voltpilot-writer
    profiles: ["edge"]
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      SERVER_PORT: 8092
      REDPANDA_BOOTSTRAP_SERVERS: ${REDPANDA_BOOTSTRAP_SERVERS:-redpanda:29092}
      REDPANDA_TELEMETRY_TOPIC: ${REDPANDA_TELEMETRY_TOPIC:-telemetry.raw}
      POSTGRES_JDBC_URL: jdbc:postgresql://timescaledb:5432/${POSTGRES_DB:-voltpilot}
      APP_DB_USER: ${APP_DB_USER:-voltpilot_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-voltpilot_app_dev_pw}
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/localhost/8092; echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '\"status\":\"UP\"'"
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  # ---------------------------------------------------------------------------
  # DATA FEEDS (KEYLESS public sources). Guarded behind the `feeds` profile so
  # the default `docker compose up -d` stays backbone-only. Bring them up with:
  #   docker compose --profile feeds up -d --build market-data weather-collector
  # Both are long-running collectors (no host ports): they refresh on startup and
  # then periodically, writing into hypertables the portal reads.
  # ---------------------------------------------------------------------------

  # Day-ahead spot prices (15-min) from energy-charts.info (Fraunhofer ISE, no
  # API key). `serve` refreshes today+tomorrow on startup then every 6h. Writes
  # into day_ahead_prices as the superuser (public per-zone table, no RLS).
  market-data:
    build:
      context: ./services/market-data
    container_name: voltpilot-market-data
    profiles: ["feeds"]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["serve", "--persist"]
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-voltpilot}
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltpilot_dev_pw}
      # Keyless energy-charts is the default source (no ENTSOE_SECURITY_TOKEN).
      MARKET_DATA_SOURCE: ${MARKET_DATA_SOURCE:-energy-charts}
      MARKET_DATA_ZONE: ${MARKET_DATA_ZONE:-DE-LU}
      MARKET_DATA_REFRESH_SECONDS: ${MARKET_DATA_REFRESH_SECONDS:-21600}

  # Weather forecast (hourly, coming days) from Open-Meteo (EU-hosted, no API
  # key). Reads sites' lat/lon, fetches per site, upserts into weather_forecast.
  # Depends on `api` so the RLS-scoped weather_forecast table + grants exist.
  weather-collector:
    build:
      context: ./services/forecast
    container_name: voltpilot-weather-collector
    profiles: ["feeds"]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      api:
        condition: service_healthy
    entrypoint: ["python", "-m", "voltpilot_forecast.weather_collect"]
    command: ["serve", "--persist"]
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-voltpilot}
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltpilot_dev_pw}
      WEATHER_FORECAST_DAYS: ${WEATHER_FORECAST_DAYS:-3}
      WEATHER_REFRESH_SECONDS: ${WEATHER_REFRESH_SECONDS:-10800}

  # ---------------------------------------------------------------------------
  # OPTIMIZATION ENGINE. Own `optimize` profile (not `feeds`: it is a consumer
  # of the feeds and an MQTT publisher, not a keyless collector; not `edge`: it
  # is cloud-side). Bring it up with:
  #   docker compose --profile feeds --profile optimize up -d --build
  # (the feeds provide the day-ahead prices it plans against; without them every
  # site is skipped until prices land). Build context is the REPO ROOT because
  # the image installs services/forecast alongside (persistence-baseline
  # fallback - see services/optimization/Dockerfile).
  # ---------------------------------------------------------------------------

  # Rolling battery-dispatch planner: every 15 min, for every site with a
  # battery asset, solve the cost-optimal 24h schedule, persist it to the
  # `schedule` hypertable and publish it retained to the device's MQTT schedule
  # topic (docs/contracts/mqtt-schedule.schema.json). Depends on `api` because
  # its Flyway owns the schedule table + asset.roundtrip_efficiency_pct.
  optimizer:
    build:
      context: .
      dockerfile: services/optimization/Dockerfile
    container_name: voltpilot-optimizer
    profiles: ["optimize"]
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      emqx:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-voltpilot}
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voltpilot_dev_pw}
      MQTT_HOST: emqx
      MQTT_PORT: "1883"
      OPTIMIZER_INTERVAL_SECONDS: ${OPTIMIZER_INTERVAL_SECONDS:-900}
      OPTIMIZER_HORIZON_HOURS: ${OPTIMIZER_HORIZON_HOURS:-24}

volumes:
  timescale-data:
  emqx-data:
  redpanda-data:
