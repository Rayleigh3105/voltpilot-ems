# VoltPilot-Baustein: ein Kühlraum hält mit Sonnenstrom Kälte auf Vorrat.
# Der Kühlstellenregler regelt Verdichter und Abtauung weiter selbst; die Logik verschiebt nur seinen Sollwert.
# Raumtemperatur, Tür und Abtauung liest sie am Regler selbst; seine Signale folgen ihm in die Lücke.
block: 1
name: Kälte auf Vorrat
description: Ist Sonnenstrom übrig, kühlt der Raum tiefer und hält die Kälte auf Vorrat.
sentence: Kühle {regler} auf {normal}, mit Sonnenstrom {vorrat} tiefer.
logic: |
  logic: 1
  name: Kälte auf Vorrat
  description: >
    Ist Sonnenstrom übrig, kühlt der Raum etwas tiefer und hält die Kälte auf Vorrat.
    Sonst gilt der normale Sollwert. Wird es zu warm, kommt eine Meldung.

  devices:
    regler: {entity: geraet-regler, name: Kühlraum}

  inputs:
    raum:  {source: geraet-regler.room_temperature, name: Kühlraum,       max_age: 5 min}
    tuer:  {source: geraet-regler.door_open,        name: Tür offen,      max_age: 5 min}
    abtau: {source: geraet-regler.defrost,          name: Abtauung läuft, max_age: 5 min}
    netz:  {source: site.grid,                      name: Netzbezug,      max_age: 60 s}

  settings:
    vorrat_an: {name: Kälte auf Vorrat, type: boolean, default: on, editable_by: customer,
                help: {when_on: "An: Mit Sonnenstrom kühlt der Raum auf {normal - vorrat} statt {normal}.",
                       when_off: "Aus: Der Raum hält immer {normal}."}}
    normal:    {name: Sollwert normal,      default: 4 °C,   range: [2 °C, 6 °C],      step: 0.5 K, editable_by: customer}
    vorrat:    {name: Auf Vorrat tiefer um, default: 2 K,    range: [0.5 K, 3 K],      step: 0.5 K, editable_by: customer}
    ab_kw:     {name: Sonnenstrom übrig ab, default: 1.5 kW, range: [0.5 kW, 10 kW],   step: 0.5 kW}
    warn_ab:   {name: Warnen ab,            default: 8 °C,   range: [5 °C, 12 °C],     step: 0.5 K}
    warn_nach: {name: Warnen nach,          default: 30 min, range: [10 min, 120 min], step: 5 min}

  constraints:
    - Die Warnschwelle liegt über dem normalen Sollwert: warn_ab >= normal + 2 K

  formulas:
    uebrig: max(0 kW, -netz)

  states:
    sonne_da:
      name: Sonnenstrom ist übrig
      type: boolean
      on_when:
        - Seit 5 Minuten ist genug Sonnenstrom übrig: holds(uebrig >= ab_kw, 5 min)
      off_when:
        - Der Netzwert fehlt, oder seit 10 Minuten ist kaum Sonnenstrom übrig: unknown(netz) or holds(uebrig < 0.2 kW, 10 min)
      on_text: Sonnenstrom gilt als übrig
      off_text: Sonnenstrom gilt nicht mehr als übrig
      after_restart: off
    speichern:
      name: Kälte auf Vorrat
      type: boolean
      on_when:
        - Kälte auf Vorrat ist eingeschaltet: vorrat_an
        - Es ist Sonnenstrom übrig: sonne_da
        - Die Tür ist zu: not tuer
        - Es wird nicht abgetaut: not abtau
      off_when_any:
        - Kälte auf Vorrat ist ausgeschaltet: not vorrat_an
        - Die Tür steht seit 2 Minuten offen: holds(tuer, 2 min)
        - Der Netzwert fehlt: unknown(netz)
        # der Verdichter soll nicht wegen einer Wolke umkehren: frühestens nach 15 Minuten zurück
        - Der Sonnenstrom ist weg: not sonne_da and since(speichern) >= 15 min
      on_text: Kühlt tiefer und speichert Kälte
      off_text: Kühlt wieder auf den normalen Sollwert
      after_restart: off

  outputs:                      # ohne Wunsch der Logik gilt der Ruhewert des Geräts: sein eigener Sollwert
    regler: {setpoint: "if(speichern, normal - vorrat, normal)"}

  notifications:
    - when: holds(raum > warn_ab, warn_nach)
      to: [customer, installer]
      text: Der Kühlraum ist seit {warn_nach} wärmer als {warn_ab}. Jetzt sind es {raum}.

  status:
    - when: unknown(raum)
      title: Störung Fühler
      type: fault
      text: Der Fühler liefert keinen Wert. Der Regler des Kühlraums kühlt weiter auf {normal}.
    - when: raum > warn_ab
      title: Zu warm
      type: fault
      text: Im Kühlraum sind es {raum}. Normal sind {normal}.
    - when: abtau
      title: Taut ab
      type: waiting
      text: Der Regler taut gerade ab. Danach kühlt er wieder auf {normal}.
    - when: speichern
      title: Kühlt auf Vorrat
      type: solar
      text: Es ist Sonnenstrom übrig. Der Raum kühlt auf {normal - vorrat} statt {normal}.
    - else: true
      title: Kühlt normal
      type: idle
      text: Der Raum hält {normal}. Jetzt sind es {raum}.

  # Die Proben rechnen mit den eingestellten Werten: der erwartete Sollwert folgt "normal" und "vorrat".
  tests:
    - name: Morgens ohne Sonnenstrom gilt der normale Sollwert
      given: {raum: normal + 0.2 K, tuer: off, abtau: off, netz: 0.8 kW, clock: "08:00"}
      after: 6 min
      expect: {speichern: off, regler.setpoint: normal, status: Kühlt normal}
    - name: Mittags ist Sonnenstrom übrig, dann kühlt der Raum tiefer
      given: {raum: normal + 0.2 K, tuer: off, abtau: off, netz: -3 kW, clock: "12:00"}
      after: 6 min
      expect: {speichern: on, regler.setpoint: normal - vorrat, status: Kühlt auf Vorrat}
    - name: Steht die Tür offen, wird nicht auf Vorrat gekühlt
      given: {raum: normal + 1 K, tuer: on, abtau: off, netz: -3 kW, clock: "12:30"}
      after: 10 min
      expect: {speichern: off, regler.setpoint: normal}
    - name: Eine Wolke kehrt den Verdichter nicht sofort um
      given: {raum: normal - 0.5 K, tuer: off, abtau: off, netz: 0.5 kW, speichern: on, sonne_da: off, clock: "14:00"}
      after: 5 min
      expect: {speichern: on, regler.setpoint: normal - vorrat}
    - name: Bleibt die Sonne eine Viertelstunde weg, gilt wieder der normale Sollwert
      given: {raum: normal - 0.5 K, tuer: off, abtau: off, netz: 0.5 kW, speichern: on, sonne_da: off, clock: "16:00"}
      after: 16 min
      expect: {speichern: off, regler.setpoint: normal, status: Kühlt normal}
    - name: Eine halbe Stunde zu warm, dann kommt die Meldung
      given: {raum: warn_ab + 1 K, tuer: off, abtau: off, netz: 0.5 kW, clock: "17:00"}
      after: 31 min
      expect: {status: Zu warm, notifications: 1}
