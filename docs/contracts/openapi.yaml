        gueltigAb: { type: string, format: date, nullable: true, description: Fehlend = heute in der Zeitzone des Standorts. }
        nutzung: { type: array, nullable: true, description: "E4 - das erste Wort ist die Hauptnutzung; null = keine gewählt.", items: { $ref: "#/components/schemas/Nutzung" } }
        baujahr: { type: integer, nullable: true, description: Nur Gebäude; 1800 ... laufendes Jahr. }
        notiz: { type: string, nullable: true, maxLength: 500 }
        flaecheM2: { type: integer, nullable: true, minimum: 1, description: Die erste Fläche, ab gueltigAb. }
    OrtBearbeiten:
      type: object
      additionalProperties: false
