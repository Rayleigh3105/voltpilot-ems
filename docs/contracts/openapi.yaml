      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kurzzeichen: { type: string, maxLength: 24 }
        nutzung: { type: array, nullable: true, description: "E4 - das erste Wort ist die Hauptnutzung; null = keine gewählt.", items: { $ref: "#/components/schemas/Nutzung" } }
        baujahr: { type: integer, nullable: true }
        notiz: { type: string, nullable: true, maxLength: 500 }
    OrtFlaeche:
      type: object
      additionalProperties: false
      required: [m2]
      properties:
        m2: { type: integer, minimum: 1, example: 3400 }
        gueltigAb: { type: string, format: date, nullable: true, example: "2027-01-01" }
    Ort:
      type: object
      description: >
        Ein Gebäude oder Bereich nach dem Schreiben. `standortId`: der Standort,
        an dessen Baum der Ort heute hängt (sonst der seines ersten Tages).
        `rueckwirkung` gehört zum "gültig ab" dieses Vorgangs - null beim
