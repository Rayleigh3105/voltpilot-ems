openapi: 3.1.0
info:
  title: Voltpilot-EMS Portal API
  version: 0.1.0-mvp
  description: >
    OpenAPI contract for the portal backend (Spring Boot). BINDING contract
    (architecture section 20 item 8). Covers the MVP portal surface: auth-guarded
    tenancy, device claiming, telemetry and schedule views, and economic KPIs
    (architecture section 4).


    Every non-system endpoint requires a Keycloak-issued Bearer JWT (realm
    `voltpilot`). The `tenant_id` claim scopes all data via Postgres
    Row-Level-Security - a caller only ever sees its own tenant's rows; another
    tenant's resources return 404 (not found) rather than 403. The
    sites/devices/telemetry/prices/weather/schedule and device-claim endpoints
    are implemented in services/api; KPIs remain a stub pending a later
    increment.
  contact:
    name: Voltpilot-EMS
servers:
  - url: http://localhost:8090
    description: Local dev (docker compose / `mvn spring-boot:run`)
security:
  - bearerAuth: []
tags:
  - name: system
  - name: registration
    description: >
      Public self-service registration: a new customer creates their own tenant
      and login in one step (no operator involved). Unauthenticated by design;
      can be disabled platform-wide via VOLTPILOT_REGISTRATION_ENABLED=false.
  - name: sites
  - name: ortsstruktur
    description: >
      UEMS-Ortsstruktur (AP-02): das Unternehmen des Kundenbereichs und seine
      Standorte zum Stichtag. Mandantengebunden wie /api/v1/sites/** (RLS ist
      der Zaun; ein fremdes Objekt ist 404, nie 403; Admins über X-Tenant-Id).
      Lesend seit IP-3; die Schreibrouten folgen mit IP-4/IP-5.
  - name: devices
  - name: enrollment
    description: >
      First-boot device enrollment over HTTPS (the "kinderleicht" mTLS
      onboarding): a fresh edge device knows only its printed reference and the
      portal URL. It generates a keypair ON the device, uploads the CSR (the
      private key never travels), and polls for its certificate. Once the
      customer claims the reference in the portal, the poll returns a
      device-CA-signed client certificate - identity ENFORCED from the claim
      (CN=device_id, O=tenant_id, OU=site_id + SPIFFE URI SAN), never from the
      CSR - plus the CA and broker connection params for the mTLS listener
      (8883). Unauthenticated by design and strictly rate-limited; a pending
      reference answers exactly like an unknown one, so polling cannot
      enumerate refs. Polling etiquette for device agents: start at ~10 s
      intervals, back off to >= 60 s after the first minutes, and keep polling
      indefinitely (claiming may happen days after first boot); on 429 back
      off harder (>= 5 min). Disabled unless the deployment stages the device
      CA (VOLTPILOT_ENROLLMENT_ENABLED; see docker-compose.prod.yml).
  - name: measurements
    description: >
      Zusätzliche Messwerte eines Geräts: der gewünschte, revisionierte
      Pollplan, sein Katalog, seine Budget-Vorschau und der Verlauf je Punkt.
      Mandanten-Zaun ist der normale Geräte-/RLS-Pfad (fremdes Gerät = 404),
      Plattform-Admins nutzen den X-Tenant-Id-Umschalter.
      Seit Geräteseite Stufe 3b trägt jede Auswahl optional die KOMPONENTE,
      der sie gehört (entityId). Ohne den Parameter antwortet jede Route
      Zeichen für Zeichen wie vorher: die Auswahl gehört dann dem Gerät als
      Ganzem. Zwei baugleiche Wechselrichter hinter EINER Box führen damit
      getrennte Listen - während Revision und Budget geräteweit bleiben (es
      gibt EIN veröffentlichtes Plan-Dokument und EINEN physischen Bus).
  - name: telemetry
  - name: market
  - name: weather
  - name: schedules
  - name: history
  - name: registry
    description: >
      Optional MaStR "Anlage verknüpfen" step: look a unit up in the German
      Marktstammdatenregister (preview only), then persist the
      customer-confirmed values onto the site's assets. Tenant-scoped like all
      site endpoints (foreign site = 404 via RLS).
  - name: kpis
  - name: rules
    description: >
      Das Regel-Protokoll (Einheitsmodell Stufe 5b): der Verlaufsspeicher der
      Regeln einer Anlage. Die drei Momentaufnahmen-Tabellen des Herzschlags
      werden je Takt ersetzt - dieser Speicher haelt die WECHSEL fest und
      beantwortet damit "diese Regel hat heute 3x geschaltet". Kundendaten,
      also mandantenbezogen (RLS) und unter /sites/**, nicht unter /admin/**.
  - name: commands
    description: >
      Der Kommando-Verlauf (Kommando-Transparenz V1, Konzept
      vp-kommando-transparenz-k3): "was schickt VoltPilot wirklich an meine
      Geraete?". Der Verlaufsspeicher haelt HALTEPERIODEN + Punkt-Ereignisse
      fest, die die drei Momentaufnahmen-Tabellen des Herzschlags je Takt
      wegwerfen - abgeleitet AUSSCHLIESSLICH aus den bestehenden Stroemen,
      ohne eine einzige Edge-Aenderung. READ-ONLY: es entsteht kein
      Schreibpfad zu einem Geraet. Kundendaten, also mandantenbezogen (RLS)
      und unter /sites/**, nicht unter /admin/**.
  - name: register-write
    description: >
      Einmaliges Beschreiben eines Geraete-Registers ueber das Portal (Konzept
      vp-reg-schreib-konzept-p8, Stufen 1-3): erst den
      Ist-Wert LESEN (die Vorschau ueber DIESELBE Lane, ueber die geschrieben
      wuerde - sie beweist damit, dass der Weg offen ist), dann EINMAL
      schreiben, danach ein Beleg mit Rueckleseprobe. Jeder Schreibvorgang
      hinterlaesst eine append-only Papier-Spur (register_write_event) mit
      beweisbarer Herkunft und den VERBATIM getippten Begriffen.
      WELCHES Register eine Box ausfuehrt, entscheidet die BOX (seit Stufe 2
      ueber LANE-Regeln statt einer Adress-Allowlist) - die Cloud entscheidet
      nur, WER welche Anlage erreicht. Kundendaten, also mandantenbezogen (RLS)
      und unter /sites/**, nicht unter /admin/**.
      Seit Stufe 3 "Bis zum Endkunden" faehrt der ENDKUNDE dieselbe Strecke auf
      seiner eigenen Anlage (Reichweite = RLS, Herkunft `kunde` im Journal); die
      Rollen unterscheiden nur die Reichweite, nie die Register. Der
      plattformweite NOT-AUS ist voltpilot.register-write.enabled: auf false
      refuesieren die zwei SCHREIBENDEN Routen mit 503 und deutschem Grund,
      waehrend Ziel-Liste, Register-Wissen und VERLAUF lesbar bleiben.
  - name: topology
    description: >
      Anlagen-Topologie-Read-Model (AE1, adaptive EMS-UI): the site as an
      entity graph aggregated into the role-grouped hub topology
      (PV-Erzeugung / Speicher / Netz / Verbraucher) + directed flows the
      adaptive energy-flow diagram renders. Each capability is assignable to a
      role (customer/admin); the maßgebliche grid measurement is markable.
      Tenant-scoped like every site endpoint (foreign site = 404 via RLS); the
      shared derivation is the Go/TS/Java twin
      (docs/contracts/v2/topology-read-model.md). Role ASSIGNMENT is
      platform-admin-only.
  - name: components
    description: >
      Der EINE Anlege-Weg (Einheitsmodell Stufe 1): a component is a TEMPLATE
      plus its connection plus a role, saved versioned on the customer's own
      plant. Tenant-fenced by RLS like every /sites/** route (foreign site =>
      404, never 403); admins reach any plant through the X-Tenant-Id switcher.
  - name: templates
    description: >
      Komponenten-VORLAGEN (Einheitsmodell Stufe 0a, "Vorlagen werden Daten"):
      the device catalog the LATER one-assistant renders its brand/model choice
      from. Read-only in this stage and consumed by NOTHING yet - the surfaces
      still render the edge-side Go catalog. Authenticated + tenant-agnostic
      (the register is global platform data like edge_release /
      provisioned_device, no tenant_id, no RLS); the fence is the ORIGIN filter -
      only `builtin` + `certified` are served, never a `custom` (private
      per-Anlage) template, which has no tenant fence until Stufe 3. Managing
      templates (create/version) is Stufe 6 and does not exist here.
  - name: profile
    description: >
      Nutzungsprofil / EMS-Modus (AE7, the second adaptation axis): the usage
      profile (arbitrage | peak | private) DERIVED from the site's strategy nodes
      + entity mix + money master data, driving the adaptive portal/edge EMPHASIS
      (money/peak/flow/devices). Explicitly overridable; ONE truth - not a
      competing concept (docs/contracts/v2/usage-profile.md). Tenant-scoped.
  - name: simulation
    description: >
      Ersparnis-Simulation: asynchronous what-if jobs over a full historical
      reference year (3 scenarios - ohne Speicher / Standard-Speicher /
      VoltPilot - plus a battery-size sweep and the Netzladen variant),
      computed by the internal simulation service with the UNCHANGED
      production optimizer. The customer route is tenant-scoped like every
      site endpoint (defaults from the site's master data, body fields
      override them, foreign site = 404 via RLS); the prospect route is
      platform-admin-only with explicit inputs and persists nothing (V1 is
      stateless - results live in the service's job cache for ~1 h).
  - name: consumer
    description: >
      Steuerbare Verbraucher (docs/verbrauchssteuerung.md): a Portal-User models,
      names and rule-configures a controllable consumer (Wallbox / Heizstab /
      Pumpe / generische Last) of THEIR OWN site. A consumer STAYS a v2 entity;
      these routes carry the extra master data (consumer_profile) + the
      declarative operating requirements (consumer_policy, contract
      docs/contracts/v2/consumer-policy.schema.json). Tenant-scoped like every
      site endpoint (foreign site = 404 via RLS; a body tenant_id/site_id is
      never trusted; the requested control kind is mapped onto the INTERSECTION
      of the device's reported capabilities, never widened). Increment 1 ships
      consumer-options + CRUD + policy GET/PUT only; a policy is stored as a
      DRAFT (no compiler / optimizer / edge command yet, so every surface reports
      "Steuerung noch nicht aktiviert").
  - name: probe
    description: >
      Probe-Kanal (Einheitsmodell Stufe 0b): a one-shot "read these registers on
      my plant, once" - the groundwork every live preview and connection test of
      the later component assistant will run on. The route publishes a
      NON-retained request on the device's own v2/probe topic (contract
      docs/contracts/mqtt-probe.schema.json), waits a few seconds for the
      answer on v2/probe-result and persists NOTHING. Tenant-scoped like every
      site endpoint (foreign site = 404 via RLS). It is a READ: the contract's
      reserved switch_test op belongs to the later release wizard and is
      refused by the box itself with an honest not_supported. Every rule that
      can stop a device from being touched - private target, expiry, rate
      limit - lives ON THE BOX, which is the only party that knows its own LAN.
  - name: flows
    description: >
      Customer flow editor (E3b "Kunden-Freigabe"): a Portal-User builds,
      validates, simulates, activates and deactivates the flows of THEIR OWN
      sites (tenant from the JWT, RLS-scoped; a Portal-Admin reaches any site via
      the X-Tenant-Id switcher). The lifecycle + gates are identical to the admin
      flow API (draft -> simulated -> active -> retired) and never relaxed for a
      customer: a flow carrying a GATED strategy node activates only after a
      Portal-Admin enables that node type for the site. Governance WRITE and the
      auto-start seed stay platform-admin-only (the admin flow API).
  - name: messstellen
    description: >
      UEMS-Messstellen (AP-04 IP-3): die logische Messstelle des Kundenbereichs
      anlegen, lesen, bearbeiten, anhalten, fortsetzen und archivieren. Die Regeln
      sind der Vertrag docs/contracts/v2/messstelle.md (Java-Zwilling
      MessstelleRegeln); die Antwort IST eine Messstelle nach messstelle.schema.json
      - deshalb, anders als der Rest dieser API, in snake_case - plus `id`,
      `fehlt`, `angehalten_ab`, `archiviert_am`. Mandanten-Zaun ist die RLS
      (fremde Messstelle = 404, nie 403; Plattform-Admins nutzen X-Tenant-Id). Die
      Durchsetzung der Rechte-Matrix (docs/contracts/v2/rechte-matrix.json:
      `messstelle.bearbeiten`, `messwerte.ansehen`, `aenderung.rueckwirkend`) kommt
      mit AP-03; bis dahin gilt authenticated(). Jeder Schreibvorgang schreibt
      GENAU EINEN Eintrag in das Änderungsprotokoll (messstelle_aenderung) mit
      Urheber. Ort, Stellung, Prozesse, Kostenstellen (IP-7) und Quellen (IP-13)
      kommen additiv; bis dahin sind diese Listen leer und eine gemessene
      Messstelle ehrlich ein Entwurf (`fehlt: [ort]`).
  - name: datenquellen
    description: >
      UEMS-Datenquellen (AP-06 IP-3): der Erfassungsweg einer Anlage (Protokoll +
      Adresse, Kennzeichen DQ-n) anlegen, bearbeiten, von GENAU der gewählten Box
      prüfen und ihr ab einem Zeitpunkt zuweisen - mit Protokoll und Urheber je
      Quelle. Die Regeln sind der Vertrag docs/contracts/v2/data-source-assignment.md
      (Java-Zwilling DatenquelleRegeln; kein zweites Regelwerk im Dienst), die Wörter
      stehen in seiner Schreibweise (snake_case) wie bei den Messstellen.
      Zuständigkeiten sind halboffen auf die volle Minute (`effective_to` gehört
      nicht dazu), nie rückwirkend, nie überschrieben: ein Wechsel beendet den
      laufenden Zeitraum und trägt den neuen ein, in EINER Transaktion. Eine
      Zuständigkeit braucht die bestandene Erreichbarkeitsprüfung von genau der
      Ziel-Box - das Ergebnis steht im Protokoll, nie in der Anfrage. Mandanten-Zaun
      ist die RLS (fremde Anlage, Quelle oder Box = 404, nie 403; Plattform-Admins
      nutzen X-Tenant-Id). Rechte (AP-06 §4.8): `datenquelle.bearbeiten` /
      `datenquelle.zustaendigkeit` - noch NICHT in rechte-matrix.json, nächste
      Zeile dort `geraet.einrichten`; bis AP-03 durchsetzt, gilt authenticated().
      Push an die Box (IP-6), Übergabe zum Zeitpunkt (IP-7), Budget (IP-10) und die
      Bestands-Vorschlagsliste (IP-4) kommen mit ihren Paketen.
  - name: geraete
    description: >
      UEMS-Geräte (AP-04 IP-10): das physische Kästchen hinter der VoltPilot-Box
      (Wechselrichter, Zähler, Ladestation, Controller mit Energiekarten) -
      NICHT die Box (`device`). Nur lesend. Eine Zeile ist EIN Einbau: ein
      Zählerwechsel ist ein neues Gerät an derselben Komponente, `kennzeichen`
      (GR-4) bleibt, `einbau_kennzeichen` (Z-5a, Z-5b) wechselt - das Paar
      `geraet`/`einbau` des Herkunfts- und des Messstellen-Vertrags; die
      früheren Einbauten desselben Geräts sind die `vorgaenger`. Welche
      Komponente ein Einbau wann speist, steht zeitgültig halboffen auf die
      Minute in `komponenten`. Wie die übrigen UEMS-Schnittstellen in
      snake_case. Jede Bestands-Komponente hat nach der Migration V20260911200000
      genau ein laufendes Gerät, jede neu angelegte bekommt es im Anlege-Weg nach
      derselben Regel (V20260911240000; `aus_bestand`: aus der Komponente
      abgeleitet, eingebaut_am ist dann der Beginn ihres Verlaufs, nicht der
      Einbautag); was nicht erhoben ist, ist `null`,
      nie geraten. Mandanten-Zaun ist die RLS (fremd = 404, nie 403;
      Plattform-Admins nutzen X-Tenant-Id). Recht `messwerte.ansehen`
      (docs/contracts/v2/rechte-matrix.json) - die Durchsetzung kommt mit AP-03,
      bis dahin gilt authenticated(). Zähler- und Controllerwechsel (IP-17/IP-19)
      kommen additiv mit dem Recht `geraet.einrichten`.
  - name: admin
    description: >
      Platform-admin API (Portal-Admins only). Every operation requires the
      `platform-admin` realm role and is refused with 403 for customer tokens
      (`operator`). These endpoints are cross-tenant by design and do NOT rely on
      the tenant_id claim / RLS; they use a dedicated admin database role and the
      Keycloak Admin API.
paths:
  /health:
    get:
      tags: [system]
      summary: Liveness/readiness (Spring Boot Actuator).
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: UP }
  /api/v1/registration:
    post:
      tags: [registration]
      summary: Self-register - create a tenant and its first login in one step.
      description: >
        The front door of customer onboarding. Creates a B2C tenant named after
        the customer and a Keycloak user (username = email, `tenant_id` attribute
        + customer role), so the standard OIDC + RLS spine isolates the new
        account exactly like operator-provisioned customers. If the user cannot
        be created (e.g. email already registered), the tenant is rolled back -
        no orphans. Implemented in services/api (RegistrationController).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationRequest" }
      responses:
        "201":
          description: Account created; the customer can now log in via OIDC.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationResponse" }
        "400": { description: Invalid input (blank name, invalid email, password shorter than 8 chars). }
        "409": { description: An account with this email already exists. }
        "429": { description: Too many registration attempts (sliding-window rate limit per client address plus a global cap; nothing was created). }
  /api/v1/enrollment/{ref}/csr:
    post:
      tags: [enrollment]
      summary: Upload the device-generated CSR for a reference (first boot).
      description: >
        Stores the pending CSR keyed by the canonical reference (trimmed;
        VP- sticker refs uppercased, exactly like the claim endpoint). The CSR
        must be a PEM PKCS#10 request, self-signed by the enclosed key (proof
        of possession), with an RSA >= 2048 or EC P-256/P-384 key; the subject
        it requests is irrelevant - issuance overrides it with the
        claim-derived identity. Sticker refs (VP-) must exist in the
        provisioned-device registry (422 otherwise). Idempotent per ref:
        re-POSTing replaces the pending CSR until a certificate is issued;
        afterwards the enrolled key is fixed (409) and re-keying goes through
        the operator (revoke + unclaim/re-claim). Implemented in services/api
        (EnrollmentController).
      security: []
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
          description: The device reference printed on the device (Edge-Referenz / sticker Geräte-ID).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentCsrRequest" }
      responses:
        "202":
          description: CSR stored; poll GET .../certificate until the ref is claimed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentPending" }
        "400": { description: Invalid reference, or the CSR is unparsable / badly signed / off key policy. }
        "409": { description: A certificate was already issued for this reference (the enrolled key is fixed). }
        "422": { description: Unknown sticker Geräte-ID (not in the provisioned-device registry). }
        "429": { description: Rate limit (per client address + global sliding window). Back off >= 5 min. }
  /api/v1/enrollment/{ref}/certificate:
    get:
      tags: [enrollment]
      summary: Poll for the issued device certificate (long-poll-friendly 404 while pending).
      description: >
        404 with body status=pending while the reference is unclaimed - and
        identically for a reference that was never enrolled (no enumeration).
        Once the reference is claimed in the portal, the response carries the
        CA-signed client certificate (subject CN=device_id, O=tenant_id,
        OU=site_id, SPIFFE URI SAN), the CA PEM to verify the broker, the
        broker host/port and the topic identity. The certificate stays
        retrievable for device retries (the private key is the secret and
        never left the device); the per-device broker ACL grant is written at
        issuance. Revocation stays the operator kill switch
        (tools/pki/voltpilot-ca.sh revoke - api-issued certs are recorded in
        the same CA database). After an unclaim the poll returns to pending;
        a re-claim re-issues against the stored CSR with the new identity.
      security: []
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Certificate issued (or re-fetched) - the device switches to mTLS operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentCertificate" }
        "400": { description: Invalid reference. }
        "404":
          description: Pending (unclaimed ref, unknown ref, or no CSR yet - deliberately indistinguishable). Keep polling with backoff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentPending" }
        "429": { description: Rate limit. Back off >= 5 min. }
  /api/v1/tenant-context:
    get:
      tags: [sites]
      summary: The caller's tenant context (U0 login bootstrap).
      description: >
        The tenant half of the portal's login bootstrap (composition-driven UI
        overhaul, U0): the caller's tenant row with the EFFECTIVE Betriebsart
        ('endkunde' | 'betreiber') that picks the navigation shell - the
        explicit tenant.betriebsart override when set, else null = unknown
        (the portal then falls back to its site-count heuristic; the segment is
        deliberately NOT used). Derived in the api only; the portal never
        re-derives. RLS-scoped: a customer gets exactly their
        own tenant; a Portal-Admin gets the tenant selected via the X-Tenant-Id
        switcher, and without a selected tenant is default-deny -> 404.
      responses:
        "200":
          description: The caller's tenant context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantContext" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No tenant context (admin without a selected tenant). }
  /api/v1/unternehmen:
    get:
      tags: [ortsstruktur]
      summary: Das Unternehmen des Kundenbereichs mit den Zahlen von heute (AP-02 IP-3).
      description: >
        Name, Kurzname und Zeitzonen-Vorgabe des Unternehmens (genau eines je
        Kundenbereich, AP-00 E2) und die Zahlen, auf die die Startansicht-Weiche
        (AP-01 E1/IP-5) wartet: Standorte, die es heute gibt; Anlagen des
        Kundenbereichs; Anlagen, die heute keinem Standort zugeordnet sind.
        Ein Kundenbereich ohne Unternehmen-Zeile bekommt den benannten Zustand
        `nicht_angelegt` (Stammdaten null, Zahlen trotzdem richtig) - nie einen
        Fehler. RLS-scoped; ein Admin ohne gewählten Mandanten ist default-deny -> 404.
        Rechte (rechte-matrix.json): lesend ohne eigene Kennung; Bearbeiten ist
        `unternehmen.bearbeiten` (IP-4).
      responses:
        "200":
          description: Das Unternehmen und seine Zahlen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unternehmen" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No tenant context (admin without a selected tenant). }
    put:
      tags: [ortsstruktur]
      summary: Das Unternehmen bearbeiten - Name, Kurzname, Zeitzonen-Vorgabe, Sitz, Rechtsform (AP-02 IP-4).
      description: >
        Die ganze Menge der bearbeitbaren Stammdaten (§4.1); ein fehlendes Feld
        ist leer. Kein Anlegen, kein Löschen: das Unternehmen gibt es genau
        einmal je Kundenbereich. Die Zeitzonen-Vorgabe belegt nur NEUE
        Standorte vor (Regel 11). Ändert sich etwas, schreibt die Route in
        einer Transaktion genau einen Eintrag "bearbeitet" ins Änderungsprotokoll
        (`ort_aenderung`, alt/neu nur der geänderten Felder, Urheber); ohne
        Änderung wird nichts geschrieben. Ein Feld, das es hier nicht gibt, ist
        400 `anfrage_ungueltig`. Rechte (rechte-matrix.json): `unternehmen.bearbeiten`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnternehmenBearbeiten" }
            example:
              name: Kunststoffwerk Ahrenberg GmbH
              kurzname: Ahrenberg
              zeitzone: Europe/Berlin
              sitz: { strasse: Gewerbering 7, plz: null, ort: Ahrenberg, land: DE }
              rechtsform: GmbH
      responses:
        "200":
          description: Das Unternehmen, wie GET /api/v1/unternehmen es jetzt zeigt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unternehmen" }
        "400": { $ref: "#/components/responses/OrtAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/OrtAbgelehnt" }
  /api/v1/unternehmen/aenderungen:
    parameters:
      - $ref: "#/components/parameters/ProtokollVon"
      - $ref: "#/components/parameters/ProtokollBis"
      - $ref: "#/components/parameters/ProtokollAchse"
      - $ref: "#/components/parameters/ProtokollLimit"
      - $ref: "#/components/parameters/ProtokollNach"
    get:
      tags: [unternehmen]
      summary: Das Aenderungsprotokoll des ganzen Unternehmens ueber einen Zeitraum (AP-04 IP-21).
      description: >
        Recht `aenderungsprotokoll.lesen`. Fuehrt die Eintraege der drei Journale
        zusammen: Messstellen (samt Quellenbindung, Einstellungs-Fassung und
        Zaehlerwechsel), Ortsstruktur (Unternehmen, Standort, Gebaeude, Bereich,
        Anlage) und Datenquellen. Sortiert nach der gewaehlten Achse absteigend,
        stabil nach `quelle` und laufender Nummer - deshalb springt die Seitenweise
        auch bei gleichen Zeitstempeln nicht. `limit` Vorgabe 100, hoechstens 500;
        `nach` ist der Wert `weiter` der vorigen Seite (fehlt er, gibt es keine).
      responses:
        "200":
          description: Das Protokoll des Unternehmens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protokoll" }
        "400": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/standorte:
    get:
      tags: [ortsstruktur]
      summary: Die Standorte zum Stichtag und die Gruppe "noch nicht zugeordnet" (AP-02 IP-3).
      description: >
        Das Standort-Read-Model: je Standort Kurzzeichen, Name, Adresse,
        Zeitzone, Zustand und "es fehlt", die Anlagen mit am Stichtag gültiger
        Zuordnung, Gebäude- und Bereichszahl und die Fläche (eigene ODER Summe
        der Gebäude nur, wenn jedes eine hat; Bereiche nie addiert; fehlend null,
        nie 0) - alles so, wie es am Stichtag galt (dieselbe Ableitung wie der
        Vertrag docs/contracts/v2/ortsbaum-vectors.json). Standorte, die es an
        dem Tag nicht gab oder die archiviert waren, stehen mit Grund und Satz
        unter `nichtGezeigt`. `nochNichtZugeordnet` ist null, sobald jede
        Anlage zugeordnet ist (A15). Ohne Standorte ist `standorte` eine leere
        Liste. Name, Adresse, Zustand sind einfache Felder und stehen wie heute.
        Rechte (rechte-matrix.json): heute lesend ohne eigene Kennung; ein
        Stichtag in der Vergangenheit ("Stand am") ist `aenderungsprotokoll.lesen`.
        Additiv vorgesehen: `teilansicht` (AP-03 IP-10).
      parameters:
        - name: stichtag
          in: query
          required: false
          description: Der Tag (ISO), Vorgabe heute in der Zeitzone des Unternehmens.
          schema: { type: string, format: date, example: "2027-02-15" }
      responses:
        "200":
          description: Die Standorte zum Stichtag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandorteAmStichtag" }
        "400": { description: stichtag ist kein ISO-Tag. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [ortsstruktur]
      summary: Einen Standort anlegen (AP-02 IP-4).
      description: >
        Ohne `kurzzeichen` vergibt die Datenbank das nächste ST-n (E8: automatisch,
        änderbar, eindeutig je Kundenbereich über Standorte UND Gebäude/Bereiche,
        nie wiederverwendet - auch ein früher getragenes oder archiviertes bleibt
        belegt). Ohne `zeitzone` gilt die Vorgabe des Unternehmens. Die Adresse
        ist Pflicht: Straße, Ort, Land (DE, AT, CH); die PLZ ist optional und
        wird im Format je Land geprüft ("Die PLZ 84xxx passt nicht zu Österreich
        (vierstellig)."). Mit Adresse ist der Standort sofort eingerichtet und
        aktiv. Geprüft wird erst die Form (400), dann Name und Kurzzeichen
        (409 `name_belegt` / `kurzzeichen_belegt` mit `verweis`): der Name ist
        eindeutig unter den Standorten, die es heute gibt (ohne Groß-/Klein-
        schreibung und Randleerzeichen; ein archivierter gibt seinen Namen frei).
        Standort, Kurzzeichen und genau ein Protokolleintrag "angelegt" entstehen
        in EINER Transaktion. Rechte: `standort.verwalten`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StandortStammdaten" }
            example:
              name: Werk Ahrenberg
              adresse: { strasse: Gewerbering 7, plz: null, ort: Ahrenberg, land: DE }
              zeitzone: Europe/Berlin
              nutzung: [produktion, buero]
              notiz: Zwei Netzanschlüsse (NA-1, NA-2)
              lage: { breitengrad: 48.25, laengengrad: 11.43 }
      responses:
        "201":
          description: Angelegt; `Location` zeigt auf den neuen Standort (so, wie er heute im Lesemodell steht).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandortAmStichtag" }
        "400": { $ref: "#/components/responses/OrtAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/OrtAbgelehnt" }
        "409": { $ref: "#/components/responses/OrtAbgelehnt" }
  /api/v1/standorte/kurzzeichen-vorschlag:
    get:
      tags: [ortsstruktur]
      summary: Das Kurzzeichen, das ein neuer Standort jetzt bekäme (AP-02 IP-4, E8).
      description: >
        Für den Anlege-Dialog ("vorbelegt, meist unberührt"). Bewegt den Zähler
        nicht; wer es unverändert schickt, bekommt es - außer ein anderer war
        schneller (dann 409 mit Verweis). Rechte: `standort.verwalten`.
      responses:
        "200":
          description: Der Vorschlag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandortKurzzeichenVorschlag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/OrtAbgelehnt" }
  /api/v1/standorte/{standortId}:
    get:
      tags: [ortsstruktur]
      summary: Ein Standort zum Stichtag (AP-02 IP-3).
      description: >
        Derselbe Eintrag wie in der Liste. Gab es den Standort am Stichtag nicht
        (noch nicht / archiviert), sagt es `bestand` + `bestandText`; die
        zeitgültigen Teile sind dann leer bzw. null. Ein fremder Standort
        (anderer Kundenbereich) ist 404, nie 403 (A14).
      parameters:
        - { name: standortId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: stichtag
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Der Standort zum Stichtag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandortAmStichtag" }
        "400": { description: stichtag ist kein ISO-Tag. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Standort not found for this tenant. }
    put:
      tags: [ortsstruktur]
      summary: Einen Standort bearbeiten (AP-02 IP-4).
      description: >
        Die ganze Menge der Stammdaten; ein fehlendes Feld ist leer.
        `kurzzeichen` und `zeitzone` sind Pflicht. Die Adresse (Straße, Ort,
        Land) darf nur einem Entwurf fehlen (E10); wird sie einem Entwurf
        nachgetragen, ist er ab jetzt eingerichtet und aktiv. Name und
        Kurzzeichen wie beim Anlegen (409 mit Verweis; der Standort kollidiert
        nie mit sich selbst und darf zu seinem früheren Kurzzeichen zurück).
        Ein archivierter Standort wird nicht bearbeitet (409 `archiviert`).
        Genau ein Protokolleintrag "bearbeitet" mit alt/neu NUR der geänderten
        Felder; ohne Änderung wird nichts geschrieben. Ein fremder Standort ist
        404, nie 403. Rechte: `standort.verwalten`.
      parameters:
        - { name: standortId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StandortStammdaten" }
      responses:
        "200":
          description: Der Standort, wie er heute im Lesemodell steht.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandortAmStichtag" }
        "400": { $ref: "#/components/responses/OrtAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/OrtAbgelehnt" }
        "409": { $ref: "#/components/responses/OrtAbgelehnt" }
  /api/v1/standorte/{standortId}/archivieren:
    post:
      tags: [ortsstruktur]
      summary: Einen Standort archivieren - nur ohne aktive Anlagen und Messstellen (AP-02 IP-4, E12).
      description: >
        Archiviert ab HEUTE in der Zeitzone des Standorts: sein Bestehen endet am
        Vortag. Gesperrt (409 `archivieren_gesperrt`), solange heute eine Anlage
        an ihm aktiv ist, eine Messstelle in seinem Teilbaum aktiv ist oder eine
        Zuordnung hinein oder heraus geplant ist - `gruende` ist die GANZE Liste
        in fester Reihenfolge (Anlagen, Messstellen, geplante Zuordnungen), je
        Grund mit `weg`; `message` ist der Satz mit Grund und Weg
        ("Werk Lindach kann nicht archiviert werden: die Anlage Werk Lindach ist
        aktiv. Ordnen Sie die Anlage einem anderen Standort zu oder archivieren
        Sie sie zuerst."). Die Regel ist docs/contracts/v2/ortsbaum-vectors.json
        (Familie `archiv`). Messstellen sperren, sobald AP-04 IP-7 sie an Orte
        hängt - bis dahin kennt die Sperre nur Anlagen. Leere Gebäude und
        Bereiche werden mitarchiviert; keine Kaskade auf Anlagen oder
        Messstellen. Genau ein Protokolleintrag "archiviert" am Standort
        (`neu.mitarchiviert` nennt die Kinder). Kein Inhalt oder `{}`; jedes
        Feld ist 400. Ein Löschen gibt es für den Standort nicht (§4.1, E1).
        Rechte: `standort.verwalten`.
      parameters:
        - { name: standortId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Archiviert - der Standort heute (`bestand` archiviert, `archiviertAm` gesetzt).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandortAmStichtag" }
        "400": { $ref: "#/components/responses/OrtAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/OrtAbgelehnt" }
        "409": { $ref: "#/components/responses/OrtAbgelehnt" }
  /api/v1/standorte/{standortId}/wiederherstellen:
    post:
      tags: [ortsstruktur]
      summary: Einen archivierten Standort wiederherstellen - ein neues Bestehen ab heute (AP-02 IP-4, A8).
      description: >
        Ein NEUES Bestehen ab heute; die Lücke seit dem Archivieren bleibt
        sichtbar und wird nie aufgefüllt (die Sicht "Stand am" zeigt ihn dort als
        archiviert; das Paar archiviert → wiederhergestellt im Protokoll trägt
        sie, `neu.luecke`). Der Name muss unter den Standorten, die es heute
        gibt, frei sein - sonst 409 `wiederherstellen_gesperrt` mit
        `grund: name_belegt` und `verweis`; optional `{"name": …}` benennt ihn im
        selben Dialog um. Mitarchivierte Gebäude und Bereiche kommen nicht still
        mit zurück. Danach aktiv (mit Adresse) bzw. wieder Entwurf. Genau ein
        Protokolleintrag "wiederhergestellt". Rechte: `standort.verwalten`.
      parameters:
        - { name: standortId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StandortWiederherstellen" }
      responses:
        "200":
          description: Wiederhergestellt - der Standort heute.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StandortAmStichtag" }
        "400": { $ref: "#/components/responses/OrtAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/OrtAbgelehnt" }
        "409": { $ref: "#/components/responses/OrtAbgelehnt" }
  /api/v1/standorte/{standortId}/orte:
    get:
      tags: [ortsstruktur]
      summary: Der Ortsbaum eines Standorts zum Stichtag (AP-02 IP-5).
      description: >
        Die Gebäude mit ihren Bereichen, die Bereiche "direkt am Standort" und
        je Knoten die Fläche mit ihrer Quelle, so wie sie am Stichtag galten -
        dieselbe Ableitung wie GET /api/v1/standorte (Vertrag
        docs/contracts/v2/ortsbaum-vectors.json, "Stand am"). Ein Knoten, den
        es am Stichtag nicht gab, fehlt; einer, der heute archiviert ist, es an
        dem Tag aber gab, steht mit `zustand: archiviert` da. Gab es den
        Standort am Stichtag nicht, sagt es `standort.bestand`, und die
        zeitgültigen Teile sind leer bzw. null. `messstellenZahl` (AP-04 IP-7): je
        Knoten die Messstellen, deren Ort am Stichtag GENAU dieser Knoten ist (am
        Gebäude nicht die seiner Bereiche; `direktAmStandort` die am Standort
        selbst), 0 wenn keine. Gebäude und Bereiche
        tragen keine Zeitzone - sie erben die des Standorts (A16). Ein fremder
        Standort ist 404, nie 403 (A14). Rechte (rechte-matrix.json): heute
        lesend ohne eigene Kennung; ein Stichtag in der Vergangenheit ("Stand
        am") ist `aenderungsprotokoll.lesen`. Additiv vorgesehen: `teilansicht`
        (AP-03 IP-10).
      parameters:
        - { name: standortId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: stichtag
          in: query
          required: false
          description: Der Tag (ISO), Vorgabe heute in der Zeitzone des Standorts.
          schema: { type: string, format: date, example: "2026-10-20" }
      responses:
        "200":
          description: Der Ortsbaum zum Stichtag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrtsbaumAmStichtag" }
        "400": { description: stichtag ist kein ISO-Tag. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [ortsstruktur]
      summary: Ein Gebäude oder einen Bereich anlegen (AP-02 IP-5).
      description: >
        Legt den Ort mit seiner Zuordnung ab `gueltigAb` an (fehlend: heute in
        der Zeitzone des Standorts; rückwirkend erlaubt und sichtbar, E2),
        auf Wunsch mit der ersten Fläche ab demselben Tag, und schreibt GENAU
        EINEN Eintrag ins Änderungsprotokoll ("angelegt"). Ohne `kurzzeichen`
        wird das nächste vergeben (G-1 ... / B-1 ..., je Kundenbereich, nie
        wiederverwendet, E8). Ein Bereich hängt an einem Gebäude dieses
        Standorts (`elternId`) oder direkt am Standort (E7); ein Gebäude nur
        am Standort. Die Regeln urteilt der Ortsbaum-Vertrag in fester
        Reihenfolge - ein Ziel falscher Art ist 400 `ziel_art_unzulaessig`
        (Bereich unter Bereich, Gebäude unter Bereich), ein Ziel, das es am
        Tag noch nicht gab, 422 `ziel_gab_es_noch_nicht`, ein archiviertes 409
        `ziel_archiviert`; danach der Name unter den Geschwistern am Tag (409
        `name_belegt` mit Verweis) und das Kurzzeichen (409
        `kurzzeichen_belegt`, auch gegen einen Standort). Rechte:
        `gebaeude.pflegen`, mit `gueltigAb` vor heute zusätzlich
        `aenderung.rueckwirkend`.
      parameters:
        - { name: standortId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrtAnlegen" }
      responses:
        "201":
          description: Angelegt; `Location` ist /api/v1/orte/{id}.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ort" }
        "400": { $ref: "#/components/responses/OrtAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/OrtAbgelehnt" }
        "409": { $ref: "#/components/responses/OrtAbgelehnt" }
        "422": { $ref: "#/components/responses/OrtAbgelehnt" }
  /api/v1/standorte/{standortId}/messstellen-vorschlag:
    parameters:
      - { name: standortId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [messstellen]
      summary: Die Vorschlagsliste der Bestandsübernahme - aus den Komponenten des Standorts werden Messstellen (AP-04 IP-16).
      description: >
        Recht `messstelle.ansehen` (AP-04 E6, §5.10/§5.15, Abnahme A9; Portal-Hälfte
        AP-01 IP-9b). Liest nur - nichts entsteht ungefragt: keine Messstelle, keine
        Bindung, keine Zeile an der Anlage. Aus den Komponenten der Anlagen des
        Standorts und ihren Messkanälen (IP-9) wird je Komponente und Fluss HÖCHSTENS
        EIN Vorschlag (MessstelleRegeln.vorschlagsliste, Vektoren Familie `vorschlag`):
        Zählerstand vor Leistung (aus einer Leistung wird die Wirkenergie integriert,
        `herleitung: integration`), der Ladestand steht als Nebengröße neben dem
        Speicher-Fluss derselben Komponente. Die Stellung kommt aus der Topologie -
        maßgebliche Netzmessung → Hauptzähler (nur mit Netzanschluss), Erzeugung →
        Erzeuger, Speicher → Speicher, jeder andere Bezug → "Unterzähler von" dem
        Bezug-Hauptzähler seiner Anlage (vorgeschlagen oder bestehend); findet sich
        keiner, bleibt sie leer - nie geraten. Der Name ist der Alias der Komponente
        ("getippt gewinnt"), der Ort der Standort, `ab` der Beginn des Verlaufs (nie vor
        dem Standort und nie über einen Gerätewechsel hinweg). Was NICHT vorgeschlagen
        wird, steht mit Grund und Satz unter `ausgelassen` (abgeleitet · ohne_messkanal ·
        ohne_geraet · attribut_kanal · keine_messgroesse · ohne_richtung · weitere_groesse ·
        vorzeichen_wert · vergleich_kandidat · gleicher_fluss · passt_nicht). Ist alles
        übernommen, ist die Liste leer und sagt es (`leer`, `text`).
      responses:
        "200":
          description: Die Vorschläge und die ausgelassenen Messwerte.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessstelleVorschlagsliste" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/standorte/{standortId}/messstellen-vorschlag/uebernehmen:
    parameters:
      - { name: standortId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [messstellen]
      summary: Die ausgewählten Vorschläge übernehmen - Messstellen mit rückwirkender Bindung (AP-04 IP-16).
      description: >
        Rechte `messstelle.bearbeiten` und `messstelle.quelle`; die Bindung beginnt am
        Beginn des Verlaufs, also zusätzlich `aenderung.rueckwirkend`. Je Zeile entstehen
        in EINER Transaktion: die Messstelle (Kennzeichen vom Server, E7), ihr Ort (der
        Standort) ab dem Verlaufsbeginn, die führende Quelle ab dem Verlaufsbeginn
        (rückwirkend, `herkunft: bestandsuebernahme`), die Nebengrößen und zuletzt die
        Stellung. Geschrieben wird in der Reihenfolge der Liste, damit ein Unterzähler
        seinen Hauptzähler schon vorfindet; fehlt dieser (nicht mitbestätigt), ist das
        422 `stellung_ungueltig` (`grund: bezug_fehlt`). Bestätigt wird nur, was gezeigt
        wurde - eine abweichende Zeile ist 409 `vorschlag_geaendert`, und nichts wird
        geschrieben. Ein Messwert, der dieselbe Messstelle schon speist, zählt als
        `unveraendert`: ein zweiter Aufruf legt nichts an (A9). Der Name darf
        überschrieben werden ("benennt um"); an Komponenten, Mess-Selektion, Geräten und
        Reihen ändert sich nichts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessstelleVorschlagUebernehmen" }
      responses:
        "200":
          description: Die angelegten (und die schon vorhandenen) Messstellen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessstelleVorschlagUebernommen" }
        "400":
          description: Die Anfrage ist unvollständig (`anfrage_ungueltig`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessstelleFehler" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Der Vorschlag hat sich geändert (`vorschlag_geaendert`) oder ein Kennzeichen ist belegt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessstelleFehler" }
        "422":
          description: Eine Regel des Vertrags lehnt ab (Passung, Gerät zum Zeitpunkt, Stellung).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessstelleFehler" }

  /api/v1/orte/{ortId}:
    put:
      tags: [ortsstruktur]
      summary: Ein Gebäude oder einen Bereich bearbeiten (AP-02 IP-5).
      description: >
        Die einfachen Felder (§4.3: ohne Gültigkeit, sofort wirksam) - ganz:
        fehlend ist leer, Name und Kurzzeichen sind Pflicht. Das Protokoll
        ("bearbeitet", gilt ab heute) trägt nur die geänderten Felder alt ->
        neu; ohne Änderung gibt es keinen Eintrag. Woran der Ort hängt, ändert
        das Verschieben (IP-12) - `elternId` an dieser Route ist 400. Ein
        archivierter Ort ist 409 `archiviert`. Rechte: `gebaeude.pflegen`.
      parameters:
        - { name: ortId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrtBearbeiten" }
      responses:
        "200":
          description: Der Ort nach dem Bearbeiten.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ort" }
        "400": { $ref: "#/components/responses/OrtAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/OrtAbgelehnt" }
        "409": { $ref: "#/components/responses/OrtAbgelehnt" }
  /api/v1/orte/{ortId}/flaeche:
    put:
      tags: [ortsstruktur]
      summary: Die Bezugsfläche ab einem Tag setzen oder ändern (AP-02 IP-5, E3).
      description: >
        Ganze m² > 0 ab `gueltigAb` (fehlend: heute in der Zeitzone des
        Standorts). Die laufende Fläche endet am Vortag, die neue erbt deren
        Ende; beginnt am Tag schon eine, wird sie ersetzt (Korrektur - sie
        bleibt aufgehoben lesbar). Die Regel ist die des Vertrags
        (ortsbaum-vectors.json, Familie flaeche/eintrag). Rückwirkend ist
        erlaubt und sichtbar: `rueckwirkung` sagt "rückwirkend (14 Tage)"
        (A3), das Protokoll ("flaeche_geaendert", alt -> neu) trägt es.
        Abgelehnt: 400 `flaeche_ungueltig` (keine ganze Zahl > 0 - 3100.5
        wird nie gerundet), 400 `gleiche_flaeche`, 422 `gab_es_noch_nicht`
        (vor dem ersten Tag des Orts), 409 `archiviert`. Rechte:
        `gebaeude.pflegen`, mit `gueltigAb` vor heute zusätzlich
        `aenderung.rueckwirkend`.
      parameters:
        - { name: ortId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrtFlaeche" }
      responses:
        "200":
          description: Der Ort mit seinen Flächen nach dem Eintrag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ort" }
        "400": { $ref: "#/components/responses/OrtAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/OrtAbgelehnt" }
        "409": { $ref: "#/components/responses/OrtAbgelehnt" }
        "422": { $ref: "#/components/responses/OrtAbgelehnt" }
  /api/v1/overview:
    get:
      tags: [sites]
      summary: Tenant-wide fleet overview for the adaptive Uebersicht.
      description: >
        One aggregate for the portal's fleet mode (customers with several
        sites): per site the device status (liveness from each device's newest
        telemetry ARRIVAL, the store-and-forward rule), the newest live
        telemetry snapshot, and today's planned battery savings (ex-ante, from
        the persisted optimizer plans, Europe/Berlin day, latest run per slot);
        plus fleet totals and the fleet-wide per-day savings of the last 14
        Berlin days for the hero mini chart. RLS-scoped: the fleet is exactly
        the caller's tenant. Admins read another tenant's fleet via the
        X-Tenant-Id switcher.
      responses:
        "200":
          description: The caller's fleet overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/edge-versions:
    get:
      tags: [sites]
      summary: Reported edge software version per device (tenant-wide).
      description: >
        The `core_version` / `palette_version` each device reports in the
        `flows` block of its status heartbeat, persisted by the flow-status
        listener - the data behind the platform overview's "Edge-Stand" column.
        RLS-scoped like /overview (admins read another tenant's devices via the
        X-Tenant-Id switcher). A device is ABSENT until it reports: the edge
        only builds the `flows` block once it has seen a flow deployment set, so
        a device without a rolled-out automation reports no version at all.
        Absent therefore means "unknown", never "outdated". Since Geräteseiten
        Stufe 1 (R2a) each row additionally carries the JUDGEMENT against the
        release register (`newestRelease`/`upToDate`) - the yardstick never
        reached the customer before, so their box showed a version nobody could
        place. The judgement travels, NEVER the register.
      responses:
        "200":
          description: One entry per device that reported a version.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EdgeVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/earnings:
    get:
      tags: [sites]
      summary: Realized earnings - measured "mit VoltPilot vs. ungeregelte Anlage".
      description: >
        The measured money numbers behind the portal hero (fleet AND
        single-site), computed per 15-min slot from the telemetry rollups
        valued at the slot's day-ahead price in each site's own bidding zone
        (PT15M rows preferred, PT60M fallback): baseline = (load_kwh - pv_kwh)
        * price/1000 (the UNREGULATED plant - same generation and consumption,
        fed in immediately, battery idle), actual = (grid_import_kwh -
        grid_export_kwh) * price/1000, saved = baseline - actual. Both are
        signed COSTS (negative = revenue); with symmetric spot pricing, saved
        equals the battery's dispatch valued at spot, so round-trip losses
        debit VoltPilot automatically. Windows are Europe/Berlin calendar
        periods containing `at`; range=all starts at the fleet's first covered
        slot and the response's `from` says so. RLS-scoped like every customer
        endpoint; admins use the X-Tenant-Id switcher.
      parameters:
        - name: range
          in: query
          schema: { type: string, enum: [day, month, year, all], default: month }
        - name: at
          in: query
          description: The date whose period to report (default today, Europe/Berlin).
          schema: { type: string, format: date }
        - name: strip
          in: query
          description: >
            Opt in to the tappable 12-month strip (`monthlyStrip`). It is a fixed
            ~173 ms 12-month scan and no portal surface renders the fleet strip's
            values today, so it is computed ONLY on demand (audit
            vp-portal-perf-a4, finding B5); `monthlyStrip` is [] when omitted.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The caller's realized earnings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Earnings" }
        "400": { description: Unknown range. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/sites:
    get:
      tags: [sites]
      summary: List sites for the caller's tenant (tenant_id from OIDC token).
      responses:
        "200":
          description: Sites (only the caller's tenant, via RLS).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Site" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [sites]
      summary: Create a site for the caller's own tenant (self-service onboarding).
      description: >
        Creates a site (Standort) for the CALLER's tenant. The tenant is taken from
        the OIDC `tenant_id` claim (via TenantContext) and enforced by RLS' WITH
        CHECK - never from the request body - so a customer can only ever create a
        site for themselves. This unblocks onboarding: a fresh customer creates a
        site, then claims devices into it. Implemented in services/api.
        Additively (UEMS AP-02 IP-9) the new site is assigned to its Standort in
        the SAME transaction, from the day of its `created_at` in the Standort's
        time zone: `standortId` if given; without it the one Standort of the
        Kundenbereich when there is exactly one; none when there is none (as
        before - the site stays "noch nicht zugeordnet" until the
        Bestandsübernahme or the Vorschau); with several the choice is required
        (422 `standort_waehlen`). The response is the unchanged `Site`; `GET
        /sites/{siteId}` shows the Standort. Today several Standorte can only
        come from the Standort API (`POST /api/v1/standorte`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSiteRequest" }
      responses:
        "201":
          description: Site created (for the caller's tenant).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400":
          description: >
            Invalid input (blank name, out-of-range coordinates, or bad zone).
            An unknown or foreign `standortId` answers in the form of the
            Ortsstruktur - `anfrage_ungueltig` with `feld: standortId`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrtFehler" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "`ziel_archiviert` - the chosen Standort is archived (`feld: standortId`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrtFehler" }
        "422":
          description: >
            `standort_waehlen` - no `standortId` although the Kundenbereich has
            several (not archived) Standorte; `standorte` lists them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrtFehler" }
  /api/v1/sites/{siteId}:
    get:
      tags: [sites]
      summary: One site, plus its Standort today.
      description: >
        Exactly the `Site` fields of the list and of PUT, unchanged, plus -
        additively - `standort` (UEMS AP-02 IP-3): the Standort the site is
        assigned to today, or null while it is not assigned (a Kundenbereich
        with several sites until its Vorschau is confirmed; the
        Bestandsübernahme IP-9 assigns the one site of a single-site
        Kundenbereich, `POST /sites` a new one). RLS makes a foreign site a 404.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
    put:
      tags: [sites]
      summary: Update a site (name/bidding zone/coordinates).
      description: >
        Validation mirrors create. RLS makes a foreign site a 404 and pins the
        row to its tenant, so a site can never be moved across tenants. Admins
        edit any tenant's sites through the same endpoint via the X-Tenant-Id
        tenant switcher.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSiteRequest" }
      responses:
        "200":
          description: Updated site.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400": { description: Invalid input (blank name, out-of-range coordinates, or bad zone). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
    delete:
      tags: [sites]
      summary: Delete a site (guarded; cascades assets + series data).
      description: >
        Refused (409) while the site still has devices - they must be removed
        first. On success the site's assets cascade by FK and its series data
        (telemetry, rollups, forecast, schedule, weather, forecast-quality rows)
        is deleted in the same transaction. Use the deletion-preview endpoint to
        show the concrete consequences before confirming. Its Standort
        assignment is not deleted (UEMS AP-02 W5): it ends today and stays as an
        ended interval with a log entry (`geloescht`) at the Standort.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Site and its recorded data deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
        "409": { description: The site still has devices; remove them first. }
  /api/v1/sites/{siteId}/deletion-preview:
    get:
      tags: [sites]
      summary: What deleting this site would remove (for the confirm dialog).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Device count and recorded-data extent/counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDeletionPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/devices:
    get:
      tags: [devices]
      summary: List devices for the caller's tenant.
      responses:
        "200":
          description: Devices (only the caller's tenant, via RLS).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/devices/{deviceId}:
    put:
      tags: [devices]
      summary: Update a device (type + label only; the ref is immutable).
      description: >
        Only `kind` and the optional customer-facing label `name` are editable.
        The `externalRef` is the device's identity (MQTT topics, registry
        gating, the printed sticker) and cannot be changed. Editing never
        unclaims/re-claims a device: identity, history, commands and audit stay
        attached to the same id.
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDeviceRequest" }
      responses:
        "200":
          description: Updated device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { description: Invalid kind or over-long label. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Device not found for this tenant. }
    delete:
      tags: [devices]
      summary: Unclaim (delete) a device incl. its telemetry + MQTT cleanup.
      description: >
        Removes the device row AND its telemetry, and clears the broker's
        retained `provision/{ref}/config` and schedule topics (best-effort,
        like the on-claim publish) so the physical device falls back to its
        watchdog default. The ref becomes claimable again; a sticker ID stays
        registered in the manufacturing registry.
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Device unclaimed; its telemetry deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Device not found for this tenant. }
  /api/v1/devices/{deviceId}/purge-data:
    post:
      tags: [devices]
      summary: Purge ALL recorded data of a device WITHOUT unclaiming it.
      description: >
        "Datenaufzeichnungen löschen": irreversibly deletes every recorded
        timeseries datapoint of this device - raw telemetry plus the site's
        derived rollups, which are rebuilt from the remaining devices - while
        the device itself stays claimed and fully operational (enrollment,
        certificates, config and the retained schedule are untouched). A purge
        watermark (`purgedBefore`) is stamped on the device: the ingest path
        refuses any sample OBSERVED at or before it, so a store-and-forward
        edge replaying old buffered samples can never resurrect the deleted
        history. The device is additionally told to wipe its local buffers via
        a retained MQTT `purge_data` command (contract:
        mqtt-data-purge.schema.json) - delivered on reconnect if it is offline.
        New data recorded after the purge flows and charts normally.
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Purge completed (cloud data is gone).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevicePurgeResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Device not found for this tenant. }
  /api/v1/devices/{deviceId}/measurement-selection:
    get:
      tags: [measurements]
      summary: Gewünschter Pollplan, Papier-Spur und Jahresvolumen-Schätzung.
      description: >
        Der gespeicherte SOLL-Zustand. `applyStatus` ist niemals eine
        Anwendungs-Zusage: `pending_edge` heißt, die Box hat noch nicht
        quittiert. `entityId` schneidet Auswahl UND Papier-Spur auf EINE
        Komponente zu; `desiredRevision` (das Optimistic-Concurrency-Token des
        einen veröffentlichten Plans) und `volumeEstimate` (die physische Last
        des einen Busses) bleiben dabei geräteweit.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: entityId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >
            Die Komponente (measurement_point) dieses Geräts. Sie muss an
            derselben Anlage stehen; eine fremde ist 404. Ohne den Parameter
            antwortet die Route für das GANZE Gerät.
      responses:
        "200":
          description: Soll-Zustand des Geräts bzw. der Komponente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeasurementSelectionState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Gerät oder Komponente nicht gefunden (RLS). }
  /api/v1/devices/{deviceId}/measurement-selection/catalog:
    get:
      tags: [measurements]
      summary: Der versionierte Messpunkt-Katalog, durchsuchbar und facettiert.
      description: >
        Liefert nur lesbare Punkte. `availableOnly` filtert auf die
        Anbindungs-Familien, die zu diesem Ziel passen: MIT `entityId` ist das
        die Familie DIESER Komponente, ohne ihn die Vereinigung der Punkte, die
        die Geräte-UUID tragen - auf einer Box mit mehreren Komponenten also
        die des komponierten Hybriden und damit die falsche Frage je Komponente.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: entityId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Die Komponente, deren Familie und Auswahl gelten sollen.
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: >
            Freitext über Label, Selektor/Adresse/API-Schlüssel, Einheit,
            Gruppe und Punkt-Schlüssel.
        - name: family
          in: query
          required: false
          schema: { type: array, items: { type: string } }
          description: >
            Katalog-Familien, etwa `goe.api_v2` oder `sunspec.model_103`.
        - name: group
          in: query
          required: false
          schema: { type: string }
        - name: semanticStatus
          in: query
          required: false
          schema: { type: string }
          description: >
            `known`, `vendor_label_only` oder `unknown` - Letzteres trägt weder
            Einheit noch Semantik.
        - name: recorded
          in: query
          required: false
          schema: { type: boolean }
          description: >
            Nur schon (bzw. noch nicht) gemessene Punkte. Geräteweit - Samples
            tragen bis Stufe 3c keine Komponenten-Dimension.
        - name: availableOnly
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: selectedOnly
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            Nur aktuell ausgewählte Punkte der angefragten Geräte- bzw.
            Komponenten-Sicht. Dieser kompakte Statusabruf ist unabhängig von
            der Position eines Punkts im paginierten Gesamtkatalog.
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: >
            Seite des Katalogs samt Facetten-Zählern, je Punkt mit Label,
            Einheit, Adresse/Selektor, Kadenz-Vorgaben, Aufbewahrung, ob er
            ausgewählt bzw. gemessen ist und dem letzten bekannten Wert.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { description: Unbekannte Facette oder ungültige Seite. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Gerät oder Komponente nicht gefunden (RLS). }
  /api/v1/devices/{deviceId}/measurement-selection/estimate:
    get:
      tags: [measurements]
      summary: Volumen- und Gerätelast-Vorschau vor dem Klick; schreibt nichts.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: entityId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >
            Die Komponente, deren Auswahl ersetzt wird. Die Schätzung zählt
            weiterhin den GANZEN Bus.
        - name: pointKey
          in: query
          required: true
          schema: { type: string }
        - name: enabled
          in: query
          required: false
          schema: { type: boolean, default: true }
        - name: cadenceS
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 86400 }
          description: >
            Ohne Angabe die Katalog-Vorgabe des Punktes. Unterhalb seiner
            sicheren Geräteempfehlung ist die Anfrage 400.
      responses:
        "200":
          description: >
            Samples/min, Requests/min, Duty-Cycle und die Jahresvolumen-Spanne,
            dazu die Grenzen (Warnung ab 120 Samples/min; hart bei 600
            Samples/min, 30 Requests/min oder 20 % Duty). Es gibt kein
            Punktzahl-Limit.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { description: Unbekannter Punkt oder unzulässige Kadenz. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Gerät oder Komponente nicht gefunden (RLS). }
  /api/v1/devices/{deviceId}/measurement-selection/custom/estimate:
    post:
      tags: [measurements]
      summary: Dieselbe Vorschau für ein noch nicht angelegtes freies Register.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: entityId
          in: query
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomMeasurementDefinition" }
      responses:
        "200":
          description: Budget-Vorschau.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: >
            Ungültige Definition - unter anderem ein mitgeschickter
            Schreibparameter oder eine selbst gewählte Kostenannahme.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Gerät oder Komponente nicht gefunden (RLS). }
  /api/v1/devices/{deviceId}/measurement-selection/custom:
    post:
      tags: [measurements]
      summary: Eigenen Messwert hinzufügen - ein validiertes, NUR LESBARES freies Register.
      description: >
        Der Punkt-Schlüssel wird serverseitig aus dem Idempotenzschlüssel
        gebildet (`custom.<hex>`); die Definition ist per Kontrakt read-only und
        trägt keine Schreibfunktion. Die Request-Kostenannahme setzt
        ausschließlich der Server (konservativ), ein Client-Wert ist 400.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: entityId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Die Komponente, der das Register gehört.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, idempotencyKey, definition]
              properties:
                expectedRevision: { type: integer, format: int64, minimum: 0 }
                idempotencyKey: { type: string, format: uuid }
                definition: { $ref: "#/components/schemas/CustomMeasurementDefinition" }
      responses:
        "200":
          description: Soll-Zustand nach dem Anlegen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeasurementSelectionState" }
        "400": { description: Ungültige Definition oder fehlender Idempotenzschlüssel. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Gerät oder Komponente nicht gefunden (RLS). }
        "409":
          description: >
            Veraltete Revision, oder derselbe Idempotenzschlüssel für eine
            andere Änderung.
        "422": { description: Technisches Messwertbudget überschritten. }
  /api/v1/devices/{deviceId}/measurement-selection/{pointKey}:
    put:
      tags: [measurements]
      summary: Revisionierte An-/Abwahl eines Katalogpunktes.
      description: >
        Abwählen ist ein UPDATE, nie ein DELETE: die Auswahlzeile und ihre
        Ereignisse bleiben, nur künftige Proben hören auf. Aktivieren stempelt
        `enabledAt` serverseitig - es wird nichts rückwirkend ergänzt. Die
        Wiederholung mit demselben Idempotenzschlüssel und derselben Nutzlast
        ist ein echter Replay und erzeugt keine neue Revision.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: pointKey
          in: path
          required: true
          schema: { type: string }
        - name: entityId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >
            Die Komponente, der diese Auswahl gehört. Derselbe Punkt kann so auf
            zwei baugleichen Geräten hinter einer Box getrennt beobachtet
            werden. Ohne den Parameter gehört die Auswahl dem Gerät.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, idempotencyKey, enabled]
              properties:
                expectedRevision: { type: integer, format: int64, minimum: 0 }
                idempotencyKey: { type: string, format: uuid }
                enabled: { type: boolean }
                cadenceS: { type: integer, minimum: 1, maximum: 86400, nullable: true }
      responses:
        "200":
          description: >
            Soll-Zustand nach der Änderung, auf die Komponente zugeschnitten,
            wenn eine genannt wurde.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeasurementSelectionState" }
        "400":
          description: >
            Unbekannter oder nicht lesbarer Punkt, unzulässige Kadenz oder
            fehlender Idempotenzschlüssel.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Gerät oder Komponente nicht gefunden (RLS). }
        "409":
          description: >
            Veraltete Revision, oder derselbe Idempotenzschlüssel für eine
            andere Änderung.
        "422": { description: Technisches Messwertbudget überschritten. }
  /api/v1/devices/{deviceId}/measurement-selection/{pointKey}/history:
    get:
      tags: [measurements]
      summary: Verlauf EINES Messpunktes, semantisch aggregiert.
      description: >
        Bis 48 h wird qualitätsgefiltertes Raw gebucketet, längere Zeiträume
        lesen die dauerhaften 5-/15-min-Rollups. Gauge liefert gewichtetes
        Mittel/Min/Max, Counter nur positive Deltas (Resets zählen nicht als
        Verbrauch), Zustände den letzten Wert. `representation=raw` gibt es nur,
        wo echte Rohdaten vorliegen, sonst 400.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: pointKey
          in: path
          required: true
          schema: { type: string }
        - name: range
          in: query
          required: false
          schema: { type: string, default: "24h" }
          description: >
            `24h`, `7d`, `30d`, `90d`, `year` oder frei über from/to.
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: representation
          in: query
          required: false
          schema: { type: string, enum: [decoded, raw], default: decoded }
        - name: siteId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >
            Der historische Standort nach einem Geräte-Umzug; ohne Angabe der
            aktuelle.
        - name: entityId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: >
            Die Komponente, deren Familienwechsel als Marker mitreisen sollen.
            Sie muss an der abgefragten Anlage stehen - dieselbe Regel wie bei
            einer Auswahl je Komponente.
      responses:
        "200":
          description: >
            Meta, Datenpunkte und Marker (Auswahl-, Lücken-, Reset-, Zustands-
            und Familienwechsel).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: >
            Unbekannter Zeitraum, oder für diesen Zeitraum liegen keine echten
            Rohdaten vor.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >
            Gerät, Anlage, Komponente oder Messwert nicht gefunden (RLS).
  /api/v1/devices/{deviceId}/measurement-selection/{pointKey}/export:
    get:
      tags: [measurements]
      summary: Derselbe Verlauf als CSV.
      description: >
        Trägt Punkt-Schlüssel, Standort, Labels, Einheit, Aggregation, Semantik,
        Katalogfassung und Darstellung im Kopf und neutralisiert Formel-Präfixe
        von Tabellenkalkulationen.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: pointKey
          in: path
          required: true
          schema: { type: string }
        - name: range
          in: query
          required: false
          schema: { type: string, default: "24h" }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: representation
          in: query
          required: false
          schema: { type: string, enum: [decoded, raw], default: decoded }
        - name: siteId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: entityId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: CSV.
          content:
            "text/csv":
              schema: { type: string }
        "400":
          description: >
            Unbekannter Zeitraum, oder für diesen Zeitraum liegen keine echten
            Rohdaten vor.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >
            Gerät, Anlage, Komponente oder Messwert nicht gefunden (RLS).
  /api/v1/devices/claim:
    post:
      tags: [devices]
      summary: Claim an edge device into a site (onboarding = one insert).
      description: >
        Claims an unclaimed edge device (identified by `externalRef`) into one of
        the caller's sites. `externalRef` is canonicalized before use: trimmed,
        and sticker Geräte-IDs (prefix `VP-`, case-insensitive) uppercased, so
        the typed case never creates a second device. Sticker IDs additionally
        validate against the provisioned-device registry (manufactured IDs,
        maintained via the admin API): an unknown sticker ID yields 422 instead
        of creating a ghost device, and the claimed device inherits the
        registry's `kind`. Non-sticker refs stay ungated. The claim is idempotent
        within the tenant: re-claiming a ref the caller already owns returns 200
        with the existing device (at its original site) instead of a conflict.
        `externalRef` is globally unique, so a device claimed by ANOTHER tenant -
        which RLS hides - yields 409. The target site must belong to the caller's
        tenant, else 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceClaimRequest" }
      responses:
        "200":
          description: Already claimed by the caller's own tenant - the existing device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "201":
          description: Device claimed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Target site not found for this tenant. }
        "409": { description: Device already claimed by another tenant. }
        "422": { description: Unknown sticker Geräte-ID (not in the provisioned-device registry). }
  /api/v1/sites/{siteId}/telemetry:
    get:
      tags: [telemetry]
      summary: Query telemetry timeseries for a site.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: >
            Telemetry points (tenant-scoped via RLS). `from`/`to` default to the
            last 24h. Windows longer than 3h are downsampled server-side to
            1-minute averages so the series stays complete AND current for chatty
            devices; when the row cap would bite, the oldest points are dropped,
            never the newest.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TelemetryPoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/prices:
    get:
      tags: [market]
      summary: Day-ahead spot prices (15-min slots) for a site's bidding zone.
      description: >
        Returns the day-ahead electricity spot prices for the site's bidding zone
        (DE-LU). Prices are market-wide PER ZONE (not per tenant), but the endpoint
        is site-scoped so the portal reads "the price for this site": the site is
        resolved via RLS (a foreign site is 404), then its zone's series is
        returned. Collected KEYLESS from energy-charts.info (Fraunhofer ISE), with
        ENTSO-E as an alternative source. `from`/`to` default to roughly
        today+tomorrow. Implemented in services/api.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Price series for the site's zone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceSeries" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/price-history:
    get:
      tags: [market]
      summary: Day-ahead prices aggregated over one range (Tag/Woche/Monat/Jahr).
      description: >
        Day-ahead spot prices for the site's bidding zone, aggregated over one
        historical period, mirroring the Historie period pattern. `at` picks the
        period containing that date; boundaries are Europe/Berlin. Aggregation
        happens in SQL (TimescaleDB time_bucket): 15-min buckets for the day,
        hourly for the week, Europe/Berlin-daily for month/year - so a year is
        ~365 rows, not ~35k slots. Each bucket carries avg/min/max (the band the
        chart draws), and the response includes range summary stats (avg/min/max,
        cheapest & most expensive slot, slot count, actual data coverage). The
        day range anchored on today extends `to` into tomorrow so the
        forward-looking day-ahead curve stays visible; past days show one day.
        Prices are market-wide per zone (no tenant); the site is resolved via RLS
        (foreign site => 404). Because the collector only fetches today+tomorrow,
        historical depth grows one day per collector day - empty/partial windows
        are expected and returned as empty bucket lists. Implemented in
        services/api.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: range
          in: query
          required: false
          schema: { type: string, enum: [day, week, month, year], default: day }
        - name: at
          in: query
          required: false
          description: Any ISO date (YYYY-MM-DD) inside the wanted period (Europe/Berlin); defaults to today.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Aggregated price series for the range (empty buckets if no data).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceHistory" }
        "400": { description: Invalid range value. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/weather:
    get:
      tags: [weather]
      summary: Latest weather forecast (hourly) for a site.
      description: >
        Returns the most recent weather-forecast run for the site (temperature,
        cloud cover and shortwave/GHI radiation useful for PV), hourly over the
        coming days. The `weather_forecast` table carries `tenant_id` and is
        RLS-scoped, and the site lookup is RLS-gated, so a foreign site is 404 and
        no other tenant's weather can leak. Collected KEYLESS from Open-Meteo
        (EU-hosted). Implemented in services/api.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Latest weather forecast (empty points array if none stored yet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherForecast" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/schedule:
    get:
      tags: [schedules]
      summary: Current 24h optimization schedule (15-min slots) for a site.
      description: >
        Two readings of the same hypertable, selected by `mode`.


        `mode=latest` (DEFAULT, unchanged): the latest optimizer run - what the
        device is executing right now. Per-slot planned battery power (+charge /
        -discharge), projected grid power and SoC, the day-ahead price and the
        projected cost vs. the no-battery baseline, plus the headline savingsEur
        over the horizon. Empty slots array (null metadata) when no plan has
        been produced yet.


        `mode=day` ("wie der Tag geplant war", Tages-Splice): per 15-min slot of
        the Europe/Berlin day the value from the NEWEST run that planned the
        slot BEFORE it began - the plan that was in force when the quarter hour
        started. The per-slot winner uses the same DISTINCT-ON splice the
        savings math has always used. Slots that had not started yet resolve to
        the newest run, so the tail of the response IS the current plan
        (including its slots on the following day). A slot no run planned
        ex-ante simply has no row, so a day whose optimizer only started at noon
        honestly begins at noon. Run-level facts describe ONE run and are
        therefore null on a spliced day (planId, bankedValueEur, socStartPct,
        socEndPct, peakTargetKw, fallback14a); generatedAt/deviceId name the
        newest run that contributed a slot, and savingsEur sums the spliced
        slots. Feeds the portal's "Film des Tages", which ticks off the elapsed
        phases as PLANNED (never as measured).


        Both modes are RLS-scoped by tenant and carry the recomposed decision
        prices (importPriceCtKwh / exportValueCtKwh / importPriceSource).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: mode
          in: query
          required: false
          description: Which reading of the plan; unknown values are rejected (400).
          schema: { type: string, enum: [latest, day], default: latest }
      responses:
        "200":
          description: The site's current plan (empty slots array if none yet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { description: Unknown mode. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/control-status:
    get:
      tags: [schedules]
      summary: Latest inverter-control confirmation for a site ("Steuerung").
      description: >
        What the schedule commanded vs. what the inverter read back for this
        site's device(s), ingested from the additive `control` block of the
        device status heartbeat (report §5). Feeds the portal's calm "Steuerung"
        strip ("Fahrplan-Sollwert X -> Wechselrichter bestätigt Y", healthy |
        mismatch | stale). RLS-scoped by tenant. 204 (no body) until a device has
        reported a control readback.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's latest control confirmation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlStatus" }
        "204": { description: No control readback reported yet for this site. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/curtailment-status:
    get:
      tags: [schedules]
      summary: Latest feed-in curtailment ("Abregeln") truth for a site.
      description: >
        Does the plant actually throttle its PV in a planned "Abregeln" slot, or
        is the plan a plan because the curtailment actor is not released yet?
        Ingested from the additive `curtailment` block of the device status
        heartbeat. Deliberately its OWN read next to `control-status` rather than
        extra fields there: the two heartbeat blocks arrive independently (a
        device may report either alone) and each carries its own freshness
        anchor. RLS-scoped by tenant. 204 (no body) until a device has reported
        the block - the portal then keeps its plan wording, which is exactly the
        honest fallback.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's latest curtailment truth.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurtailmentStatus" }
        "204": { description: No curtailment block reported yet for this site. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/sources:
    get:
      tags: [sites]
      summary: The site's measurement points as the edge reports them.
      description: >
        The primary inverter plus every configured additional source
        (Erzeuger/Netz-Zähler/Verbraucher) with its OWN latest reading and
        freshness, ingested from the additive `sources` block of the device
        status heartbeat. It makes a multi-inverter site's composite PV
        explainable in the portal ("39,0 kW = Deye 8,3 + Fronius 21,3 + …")
        instead of one opaque number. Display-only - the composite telemetry
        path is untouched. RLS-scoped by tenant; an empty list means no device
        has reported the block yet.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's reported measurement points (primary first).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteSource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/charging-config:
    get:
      tags: [sites]
      summary: Die im Portal gepflegte Lastmanagement-Konfiguration.
      description: >
        Die Anschlussgrenze der Anlage und die Vorrang-Wahl je Ladesäule
        (Lastmanagement Stufe 3). `gridLimitKw: null` heißt „noch nicht
        gepflegt" - und dann gibt die Box keine Ladeleistung frei; das ist der
        ehrliche Zustand einer Anlage, die niemand eingerichtet hat, nie eine
        erfundene Grenze. RLS-gefenced (fremde Anlage 404).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Die gepflegte Konfiguration (leer, solange nichts gepflegt ist).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargingConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
    put:
      tags: [sites]
      summary: Anschlussgrenze und Vorrang speichern (PATCH-Semantik).
      description: >
        Speichert, was der Kunde über SEINEN Anschluss entscheidet, und schickt
        es als retained Dokument an die Box (Kontrakt
        `mqtt-charging-config.schema.json`). GERECHNET und DURCHGESETZT wird
        dort - die Anschlussgrenze ist eine physische Grenze, ihr Wächter darf
        nicht am WAN hängen; es entsteht kein zweiter Verteiler und kein
        Schreibpfad auf eine Ladesäule.


        PATCH-Semantik: ein ABWESENDES Feld behält den gespeicherten Wert (ein
        Dialog, der nur den Vorrang stellt, darf die Anschlussgrenze nicht
        löschen); eine LEERE Vorrang-Liste ist dagegen eine Aussage („keine
        Säule hat Vorrang"). Eine Grenze ≤ 0 und eine unbekannte ChargePointId
        sind 400 mit deutschem Grund - beides würde sonst still zu einer
        Einstellung, die niemand wollte.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gridLimitKw:
                  type: number
                  nullable: true
                  description: "Die Anschlussgrenze in kW (> 0). Abwesend = unverändert."
                priorityChargePointIds:
                  type: array
                  nullable: true
                  description: "Die Vorrang-Säulen. Abwesend = unverändert, leer = ausdrücklich keine."
                  items: { type: string }
                surplusPolicy:
                  type: string
                  nullable: true
                  enum: [nur_sonne, sonne_zuerst, schnell]
                  description: >
                    Die Überschuss-Priorität (Stufe 4): woher der Ladestrom
                    kommen soll. Sie ändert KEINE Grenze - die zwei Bahnen
                    komponieren most-restrictive-wins. Abwesend = unverändert;
                    das ist NICHT dasselbe wie `schnell` (eine eigene Aussage).
                storagePriority:
                  type: string
                  nullable: true
                  enum: [speicher_vor_auto, auto_vor_speicher]
                  description: >
                    Wer den Sonnenüberschuss zuerst bekommt. `auto_vor_speicher`
                    klemmt dafür auf der Box die Ladung des Speichers auf den
                    Rest - sonst wäre die Wahl nur ein Wunsch.
      responses:
        "200":
          description: Die gespeicherte Konfiguration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargingConfig" }
        "400": { description: Unplausible Grenze oder unbekannte Ladesäule (deutscher Grund im Körper). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/charging-config/charge-points:
    post:
      tags: [sites]
      summary: Eine Ladesäule eintragen (Anbinde-Assistent, Schritt 1).
      description: >
        Trägt EINE ChargePointId in die Allowlist der Anlage ein und schickt sie
        als retained Dokument an die Box (Kontrakt
        `mqtt-charging-config.schema.json`). Bis hierher liess sich die
        Allowlist nur am Gerät selbst pflegen (`:8484`), also musste jemand im
        LAN am Gerät stehen, um eine Säule anzubinden.


        DIE ALLOWLIST BLEIBT, NUR IHR PFLEGE-ORT WANDERT. Eine unbekannte
        Kennung wird von der Box weiterhin abgewiesen und protokolliert; es
        entsteht KEIN Anlern-Fenster, in dem eine fremde Säule hereinkäme.


        Es ist ein POST, kein PUT, und das ist die Aussage: die Liste fügt nur
        hinzu. Ein PUT lüde dazu ein, sie als Ganzes zu setzen - und damit einen
        Eintrag durch WEGLASSEN zu entfernen. Eine Kennung zurückzunehmen ist
        eine eigene, ausdrückliche Handlung (DELETE auf genau diese Kennung).
        Dieselbe Kennung erneut einzutragen ist ein No-op, das nur die
        Betreiber-Angaben auffrischt - und eine zurückgenommene Kennung wird
        dadurch WIEDER eingetragen. RLS-gefenced (fremde Anlage 404).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chargePointId]
              properties:
                chargePointId:
                  type: string
                  maxLength: 64
                  description: >
                    Die OCPP-ChargePointId, zeichengleich wie sie in der Säule
                    eingetragen ist. Erlaubt sind Buchstaben, Ziffern, Punkt,
                    Bindestrich und Unterstrich - dieselbe Prüfung, die die Box
                    an ihrem eigenen Formular führt.
                label: { type: string, nullable: true, maxLength: 120, description: "Der Name für den Kunden; abwesend = die Box nimmt die Kennung." }
                ratedKw: { type: number, nullable: true, description: "Nennleistung je Stecker, sofern bekannt. Abwesend = unbekannt, nie 0." }
                connectors: { type: integer, nullable: true, description: "Steckerzahl, sofern bekannt. Abwesend = die Box lernt sie von der Säule." }
                source: { type: string, nullable: true, enum: [nur_sonne, sonne_zuerst, schnell], description: "Die STEUERART dieser Säule (P5) - woher IHR Ladestrom kommen soll. Abwesend = für sie äußert sich das Portal nicht und es gilt der ANLAGEN-STANDARD (surplusPolicy); nie \"schnell\", das wäre eine Netzstrom-Freigabe, die niemand erteilt hat." }
                minKw: { type: number, nullable: true, description: "Ab welcher Leistung diese Säule überhaupt anfängt. Abwesend = unbekannt, nie 0." }
      responses:
        "200":
          description: Die gespeicherte Konfiguration inklusive der Allowlist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargingConfig" }
        "400": { description: Unzulässige Kennung, unplausible Angabe oder Deckel erreicht (deutscher Grund im Körper). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/charging-config/charge-points/{chargePointId}:
    delete:
      tags: [sites]
      summary: Eine eingetragene Ladepunkt-Kennung zurücknehmen.
      description: >
        Nimmt GENAU EINE ChargePointId aus der Allowlist der Anlage und schickt
        die Rücknahme als retained Dokument an die Box (Feld
        `removed_charge_point_ids` im Kontrakt
        `mqtt-charging-config.schema.json`).


        DIE FOLGE AM GERÄT: die Säule wird getrennt und ein Wiederverbinden
        abgewiesen. Ihr zuletzt hinterlegtes Sicherheitsprofil behält sie - es
        liegt IN der Säule -, ein laufender Ladevorgang endet dadurch also
        nicht, er fällt auf dieses Profil zurück.


        SIE IST EIN GRABSTEIN, KEIN LÖSCHEN: das retained Dokument wird als
        Ganzes ersetzt, also würde eine Kennung nur wegzulassen von einer Box,
        die gerade offline war, nie gesehen (`charge_points` fügt nur hinzu).
        Die Rücknahme wird deshalb dauerhaft geführt und in JEDEM folgenden
        Dokument genannt, bis die Kennung wieder eingetragen wird. Eine ÄLTERE
        Box kennt das Feld nicht und behält die Kennung - der Vorzustand, nie
        eine falsche Handlung; die Rücknahme wirkt dort erst nach dem nächsten
        Edge-Release. RLS-gefenced (fremde Anlage 404).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: chargePointId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        "200":
          description: Die gespeicherte Konfiguration ohne diese Kennung.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargingConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Anlage unbekannt, oder diese Kennung ist hier nicht eingetragen (deutscher Grund im Körper). }
  /api/v1/sites/{siteId}/charging-config/charge-points/{chargePointId}/source:
    put:
      tags: [sites]
      summary: Die Steuerart EINER Ladesäule setzen (Verbrauchsmanagement v1 / P5).
      description: >
        Setzt QUELLE und Mindestleistung GENAU EINER eingetragenen Säule und
        schickt sie als retained Dokument an die Box
        (`charge_points[].source` / `.min_kw` im Kontrakt
        `mqtt-charging-config.schema.json`).


        SIE ÄNDERT KEINE GRENZE. Die Quelle sagt, WOHER der Ladestrom dieser
        Säule kommen soll; die physische Bahn (Anschlussgrenze,
        Sicherheitsabstand, §14a, Ausfall-Profil) bindet sie unverändert - die
        zwei komponieren most-restrictive-wins, und keine kann die andere
        aufweichen.


        DER ANLAGEN-STANDARD BLEIBT DANEBEN STEHEN (`surplusPolicy` auf
        `PUT /charging-config`): eine Säule OHNE eigene Wahl folgt ihm weiter.
        Beides zu verschmelzen hiesse, eine Wahl für alle zu treffen.


        PATCH-Semantik: ein abwesendes Feld behält den gespeicherten Wert; ein
        Rumpf, der zu beidem schweigt, ist eine benannte Ablehnung. Eine
        Kennung, die diese Anlage nicht (mehr) führt, ist 404 - das Eintragen
        ist eine eigene, bewusste Handlung. RLS-gefenced (fremde Anlage 404).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: chargePointId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { type: string, nullable: true, enum: [nur_sonne, sonne_zuerst, schnell] }
                minKw: { type: number, nullable: true }
      responses:
        "200":
          description: Die gespeicherte Konfiguration inklusive der Allowlist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargingConfig" }
        "400": { description: Unbekannte Quelle, unplausible Mindestleistung oder ein leerer Rumpf (deutscher Grund im Körper). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Anlage unbekannt, oder diese Kennung ist hier nicht eingetragen. }
  /api/v1/admin/sites/{siteId}/charging-frame:
    put:
      tags: [admin]
      summary: Den Ladepark-RAHMEN setzen (Verbrauchsmanagement v1 / P5, E10).
      description: >
        Setzt Hausreserve, Sicherheitsabstand, Mindestleistung, Wechsel-Takt,
        höchste bekannte Gebäudelast und statisch/gemessen - den RAHMEN, den
        bis P5 nur `:8484` pflegen konnte.


        ADMIN-ONLY, mit Begründung: das sind Auslegungs-Zahlen des
        Anschlusses, die VoltPilot beim Einrichten misst (die Mockups nennen
        sie „Von VoltPilot eingerichtet"). Der Kunde LIEST sie seit P5 über
        `GET /api/v1/sites/{siteId}/charging-config`; die EINE Zahl, die ihm
        gehört, bleibt die Anschlussgrenze.


        Über den `X-Tenant-Id`-Umschalter auf dem RLS-Pfad - KEIN BYPASSRLS,
        eine fremde Anlage ist 404. PATCH-Semantik: ein abwesendes Feld behält
        den gespeicherten Wert, und ein Rumpf ohne einen einzigen Wert ist eine
        benannte Ablehnung. Die Plausibilität gegen die eigenen Säulen prüft am
        Ende die BOX (`lastmgmt.Settings.Apply`).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LadeparkRahmen" }
      responses:
        "200":
          description: Die gespeicherte Konfiguration inklusive des Rahmens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChargingConfig" }
        "400": { description: Unplausibler oder leerer Rahmen (deutscher Grund im Körper). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Kein Plattform-Admin. }
        "404": { description: Anlage im gewählten Mandanten nicht gefunden. }
  /api/v1/sites/{siteId}/charging-boost:
    post:
      tags: [sites]
      summary: Einen EINZELNEN Ladevorgang übersteuern - „Jetzt voll laden" oder „Laden pausieren".
      description: >
        Die Übersteuerung der Überschuss-Priorität für GENAU EINEN laufenden
        Ladevorgang (Lastmanagement Stufe 4). Sie geht als NICHT-retained
        Einmal-Nachricht an die Box (Kontrakt
        `mqtt-charging-boost.schema.json`) und mündet dort in denselben Kern wie
        die `:8484`-Taste - es gibt keinen zweiten Weg zu übersteuern.


        SIE IST KEINE GRENZE: sie erlaubt diesem einen Ladevorgang, auch
        Netzstrom zu ziehen. Anschlussgrenze, Sicherheitsabstand, §14a,
        Mindestleistung, Vorrang und das in der Säule hinterlegte Ausfall-Profil
        binden ihn unverändert, und die Priorität ALLER ANDEREN Ladevorgänge
        bleibt, wie sie ist. Sie gilt bis das Fahrzeug voll ist, längstens 4
        Stunden, und endet mit der Sitzung.


        `action` wählt die RICHTUNG (Verbrauchsmanagement v1 / P3b, Entscheid
        E5): `voll` (die Vorgabe, das oben Beschriebene) oder `pause` - „Laden
        pausieren", das GENAU DIESEN Ladevorgang auf 0 kW deckelt, während jeder
        andere unverändert weiterlädt. Der Deckel ist restrict-only: er kann
        keine Grenze weiten. ABWESEND = `voll`, also ist ein älterer Client
        zeichengleich wie vorher; ein unbekanntes Wort ist 400.


        `cancel: true` nimmt BEIDE Richtungen sofort zurück (auf jeder Fläche
        „Automatik fortsetzen"). Ein Stecker ohne laufenden Ladevorgang ist 409 -
        eine Zusage über ein Fahrzeug, das nicht da ist, wäre erfunden. Ein nicht
        erreichbarer Broker ist 503, und dann entsteht AUCH KEIN Beleg: die
        Nachricht IST die Freigabe. RLS-gefenced (fremde Anlage 404).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chargePointId, connectorId]
              properties:
                chargePointId: { type: string, description: "Die OCPP-ChargePointId der Säule." }
                connectorId: { type: integer, minimum: 1, description: "Der Stecker (ab 1)." }
                minutes: { type: integer, minimum: 1, maximum: 240, nullable: true, description: "Dauer; abwesend = der 4-Stunden-Deckel. Ein größerer Wert wird geklemmt." }
                cancel: { type: boolean, description: "true nimmt eine laufende Übersteuerung zurück - gleich welcher Richtung." }
                action: { type: string, enum: [voll, pause], description: "Die Richtung; abwesend = voll." }
      responses:
        "200":
          description: Die erteilte (oder zurückgenommene) Übersteuerung, mit ihrem deutschen Satz.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chargePointId: { type: string }
                  connectorId: { type: integer }
                  active: { type: boolean }
                  requestedAt: { type: string, format: date-time }
                  note: { type: string, description: "Was jetzt gilt - und was unverändert bleibt." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Anlage, Säule oder Stecker unbekannt (deutscher Grund im Körper). }
        "400": { description: Unbekannte Art des Eingriffs (deutscher Grund im Körper). }
        "409": { description: An diesem Stecker läuft gerade kein Ladevorgang. }
        "503": { description: Die Box war nicht erreichbar - es entstand keine Freigabe. }
  /api/v1/sites/{siteId}/interventions:
    get:
      tags: [sites]
      summary: Die laufenden Handeingriffe der Anlage (Steuerung Stufe 4).
      description: >
        Der EINE Lesepfad der Jetzt-Zone: der Speicher-Eingriff („Ladestand
        halten" / „Speicher jetzt laden") und die „Automatik pausieren"-Sperre.
        Ein ABGELAUFENER Eingriff liest server-seitig als ABWESEND (§16) - hier
        kommt nie ein Geist an. RLS-gefenced wie jede `/sites/**`-Route (fremde
        Anlage 404, Admins über den `X-Tenant-Id`-Umschalter); eine leere Liste
        mit `automationPaused: false` ist der Normalzustand jeder Anlage.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Laufende Eingriffe + die Pause.
          content:
            application/json:
              schema:
                type: object
                properties:
                  automationPaused: { type: boolean }
                  pausedUntil:
                    type: string
                    format: date-time
                    nullable: true
                    description: Bis wann die Pause läuft; null = keine Pause.
                  interventions:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                          enum: [speicher_halten, speicher_laden]
                        entityId: { type: string, format: uuid }
                        targetValueKw: { type: number, nullable: true }
                        endsAt: { type: string, format: date-time }
                        createdBy: { type: string, nullable: true }
                        createdAt: { type: string, format: date-time }
        "404": { description: Anlage nicht gefunden (auch bei fremdem Mandanten). }
  /api/v1/sites/{siteId}/battery-override:
    post:
      tags: [sites]
      summary: „Speicher jetzt laden" / „Ladestand halten" (Captain-Entscheid S1 = A).
      description: >
        Ein TTL-gebundener Handeingriff am Speicher. Es gibt KEIN neues
        Kommando: „halten" ist `setpoint_kw = 0`, „laden" ein positiver
        Sollwert - beides reist über den BESTEHENDEN `v2/desired`-Weg und wird
        auf dem Gerät durch die BESTEHENDE Guard-Kette geklemmt. Ob dabei aus
        dem NETZ geladen werden darf, entscheidet deshalb die Box gegen ihre
        Registry-Angabe `charge_from_grid_allowed` (D-8) - nicht diese Route.
        Eine Dauer oder Endzeit ist PFLICHT (400 sonst); über der 4-h-Kappe des
        Arbiters wird der Wunsch cloud-seitig ERNEUERT, nie der Vertrag gedehnt.
        Ein NEGATIVER Sollwert ist eine benannte Ablehnung, nie eine Klemmung -
        einen „jetzt entladen"-Eingriff gibt es nicht.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [speicher_halten, speicher_laden]
                durationMinutes: { type: integer, minimum: 15 }
                endsAt: { type: string, format: date-time }
                setpointKw:
                  type: number
                  description: >
                    Nur bei `speicher_laden`; ohne Angabe die volle
                    Ladeleistung. Auf die Nennleistung gekappt.
      responses:
        "200": { description: Der Eingriff ist notiert (und, wenn möglich, gesendet). }
        "400": { description: Ohne Dauer, mit unbekannter Art oder mit negativem Sollwert. }
        "404": { description: Anlage nicht gefunden. }
        "409": { description: Diese Anlage hat keinen steuerbaren Speicher. }
    delete:
      tags: [sites]
      summary: „Automatik fortsetzen" für den Speicher - wirkt sofort.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Der Eingriff ist beendet. }
        "404": { description: Anlage nicht gefunden. }
  /api/v1/sites/{siteId}/automation-pause:
    post:
      tags: [sites]
      summary: „Automatik pausieren" - Fahrplan UND Regeln ruhen für die Dauer.
      description: >
        Die Sperre reist im RETAINED Registry-Push als ABSOLUTER Zeitpunkt
        (`automation_paused_until`), damit eine Box, die beim Ablauf offline
        war, sie nach ihrer EIGENEN Uhr aufheben kann. Auf dem Gerät fällt dann
        jede Komponente auf ihren Registry-Failsafe: der Speicher auf
        Eigenverbrauch, ein Gerät auf release/off. Was NICHT pausiert: Messen,
        die Guard-Kette, § 14a, die Abregelung und die Einspeise-Wache - sie
        liegen unterhalb der Arbitrierung.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                durationMinutes: { type: integer, minimum: 15 }
                endsAt: { type: string, format: date-time }
      responses:
        "200": { description: Die Pause läuft. }
        "400": { description: Ohne Dauer oder Endzeit. }
        "404": { description: Anlage nicht gefunden. }
    delete:
      tags: [sites]
      summary: „Automatik fortsetzen" für die ganze Anlage - wirkt sofort.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Die Automatik läuft wieder. }
        "404": { description: Anlage nicht gefunden. }
  /api/v1/sites/{siteId}/steuerung-vorschau:
    post:
      tags: [sites]
      summary: Was eine Entscheidung am Fahrplan ändert - in Euro (Steuerung Stufe 7).
      description: >
        Die KUNDEN-Tür zu derselben Rechen-Maschine wie
        `POST /api/v1/admin/sites/{siteId}/optimizer-what-if`: zwei Läufe über
        EINE frisch geholte Eingabe (die Anlage wie sie ist, und die Anlage
        unter dieser Entscheidung), und die Differenz ihres Netto-Vorteils.
        Es wird NICHTS festgeschrieben - kein Plan persistiert, kein MQTT
        veröffentlicht; das ist eine Eigenschaft des Rechendienstes (er
        importiert weder Persistenz noch einen Publisher, per Import-Graph-Test
        festgenagelt).


        Vier Unterschiede zur Admin-Tür: der Zaun ist RLS (fremde Anlage 404,
        nie 403, und die Id erreicht den Rechendienst erst danach); der Rumpf
        trägt NUR die drei Kunden-Knöpfe (Verschleiss, SoC-Band und Netzladen
        existieren hier gar nicht); ein Deckel antwortet mit einem deutschen
        Satz, bevor der teure Lauf beginnt; und die Antwort ist EINE Zahl statt
        zweier voller Pläne.


        `deltaEur` zeigt aus KUNDENSICHT - negativ = die Entscheidung kostet.
        Es ist IMMER eine Näherung (`naeherung: true`): gerechnet wird über den
        Fahrplan-Horizont, nicht über die Lebensdauer einer Regel. `null` heisst
        „keine Zahl", und `grund` sagt warum - entweder nicht berechenbar oder
        (ein ANDERER Fall) berechnet und ohne sichtbaren Unterschied.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        description: >
          Jedes Feld ist optional; `null` heisst „lass es, wie die Anlage es
          hat". Ein LEERER Rumpf rechnet die Anlage zweimal gleich und ist damit
          die ehrliche Aussage „das ändert nichts". Ein Verbraucher-Fenster
          braucht Beginn, Länge und Leistung ZUSAMMEN - halb gefüllt ist 400,
          nie ergänzt.
        content:
          application/json:
            schema:
              type: object
              properties:
                socFloorNow:
                  type: boolean
                  description: >
                    „Ladestand halten" - der Speicher geht nicht unter seinen
                    jetzigen Stand. Ein BODEN, keine Einfrierung: laden und
                    wieder bis auf diesen Stand entladen bleibt erlaubt, die
                    Vorschau unterschätzt die Wirkung des Handeingriffs also
                    eher, als sie zu überschätzen.
                forcedChargeSlots:
                  type: integer
                  minimum: 1
                  maximum: 192
                  description: >
                    „Speicher jetzt laden" - so viele Viertelstunden lädt er.
                    Auf den Kopfraum des Speichers gekappt; ein bereits voller
                    Speicher ist eine benannte Ablehnung, keine unlösbare
                    Vorschau.
                verbraucherAbSlot: { type: integer, minimum: 0, maximum: 191 }
                verbraucherSlots: { type: integer, minimum: 1, maximum: 192 }
                verbraucherKw: { type: number, minimum: 0.1 }
      responses:
        "200":
          description: Die Vorschau - eine Zahl, oder ein Grund, warum es keine gibt.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deltaEur:
                    type: number
                    nullable: true
                    description: variante − basis; negativ = es kostet. null = keine Zahl.
                  basisEur: { type: number, nullable: true }
                  varianteEur: { type: number, nullable: true }
                  horizonSlots: { type: integer, nullable: true }
                  naeherung: { type: boolean, description: immer true }
                  grund: { type: string, nullable: true }
        "400": { description: Ein halb gefülltes Verbraucher-Fenster oder ein krummer Wert. }
        "404": { description: Anlage nicht gefunden. }
        "409": { description: Diese Anlage hat keinen Speicher. }
        "429": { description: Zu viele Vorschauen - mit deutschem Grund, nie einer erfundenen Zahl. }
        "502": { description: Der Rechendienst war nicht erreichbar. }
  /api/v1/sites/{siteId}/suggestion-states:
    get:
      tags: [sites]
      summary: Welche Vorschläge der Kunde gerade nicht sehen will (Steuerung Stufe 6).
      description: >
        Das GEDÄCHTNIS der Vorschläge. Es gibt bewusst KEINE Route, die
        Vorschläge LIEFERT: ein Vorschlag ist eine Ableitung aus Fahrplan ×
        steuerbaren Komponenten × dem, was schon läuft, und sie lebt im Portal
        (`vorschlaege.ts`) - eine Server-Route müsste dieselbe Ableitung ein
        zweites Mal führen. Gespeichert wird nur die Gegenrichtung. Eine
        ABGELAUFENE Haltung wird gar nicht erst ausgeliefert.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Die geltenden Haltungen.
          content:
            application/json:
              schema:
                type: object
                properties:
                  states:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          description: Der ABGELEITETE Vorschlags-Schlüssel (Art + Komponente).
                        state: { type: string, enum: [spaeter, abgelehnt] }
                        mutedUntil: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
        "404": { description: Anlage nicht gefunden. }
  /api/v1/sites/{siteId}/suggestion-states/{key}:
    put:
      tags: [sites]
      summary: „Später" (ein Tag) oder „Ablehnen" (sieben Tage).
      description: >
        Die FRIST rechnet der Server - eine vom Client gewählte Dauer wäre ein
        Weg, einen Vorschlag für immer verstummen zu lassen, ohne ihn je
        abzulehnen. Der Schlüssel wird auf seine Form geprüft, nie
        zurechtgebogen: ein still verändertes Wort träfe beim nächsten Lesen
        einen anderen Vorschlag als den weggeklickten.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [spaeter, abgelehnt] }
      responses:
        "200": { description: Die Haltung ist gemerkt; `mutedUntil` sagt bis wann. }
        "400": { description: Unbekannte Auswahl oder ungültiger Schlüssel. }
        "404": { description: Anlage nicht gefunden. }
  /api/v1/sites/{siteId}/verbraucher:
    get:
      tags: [consumer]
      summary: Die Zone "Verbraucher" der Steuerungsseite (lesend).
      description: >
        EIN Lese-Aggregat je Anlage (Konzept vp-verbrauchsmgmt-konzept-v1 §6,
        Paket P1): je steuerbarer Komponente ihre STEUERART (genau eine Quelle,
        höchstens ein Ziel), der Anlagen-Standard der Ladepunkte samt
        Ladepark-Rahmen, und die initiale Rangliste bei knapper Leistung.
        Alles ist eine PROJEKTION auf den Bestand - die aktive consumer_policy
        (§7.1), die Quellen-Wahl der Box in site_charging_config (§7.2), der
        chargers-Herzschlag und die Ansprüche der aktiven Flows; es entsteht
        kein zweites Datenformat. Seit P2 trägt jede Zeile zusätzlich ihre
        WÄHLBAREN Steuerarten (`optionen`) - aus derselben reinen Klasse, mit
        der der Schreibweg unten die Wahl ein zweites Mal prüft; die
        REIHENFOLGE ist seit P4 über PUT /rangliste setzbar (auch sie eine
        Projektion, kein neues Format). RLS-gefenced (fremde Anlage 404, Admins
        über den `X-Tenant-Id`-Umschalter); eine Anlage ohne steuerbares Gerät
        bekommt eine wohlgeformte LEERE Antwort.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Verbraucher, Ladepunkt-Abschnitt und Rangliste.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Verbraucher" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/sites/{siteId}/rangliste:
    put:
      tags: [consumer]
      summary: Die Reihenfolge bei knapper Leistung setzen.
      description: >
        Speichert die Rangliste (Konzept vp-verbrauchsmgmt-konzept-v1 §5, Paket
        P4) und antwortet mit der Zone, wie sie danach GELESEN wird - also der
        Normalform. Es entsteht KEINE Rangliste-Tabelle: geschrieben werden
        genau die vier Felder, die die Maschine schon kennt -
        consumer_profile.default_service_rank (die Position, die der Optimierer
        in D2-Stufe 1 zum Ordnen der Pflichten benutzt),
        consumer_profile.storage_relation (über dem Speicher = consumer_first,
        darunter = storage_first), site_charging_config.storage_priority und die
        Vorrang-Menge der Säulen. PFLICHTEN (Frist, feste Zeiten) gehen weiter
        IMMER vor der Rangliste - sie deckt der Optimierer, bevor der Rang
        irgendetwas ordnet. Steht keine Säule über dem Speicher, bleibt die
        Vorrang-Menge unangetastet (die Liste sagt dann nichts über sie).
        RLS-gefenced (fremde Anlage 404); jede Ablehnung ist ein deutscher Satz
        und schreibt NICHTS.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eintraege]
              properties:
                eintraege:
                  type: array
                  minItems: 1
                  maxItems: 200
                  description: >
                    Die Liste FLACH, ein Gerät je Eintrag, von oben nach unten.
                    Eine Gruppe gleichrangiger Ladepunkte schickt der Client als
                    ihre Mitglieder hintereinander; der Server gruppiert beim
                    Lesen wieder. Nicht genannte Geräte landen unten.
                  items:
                    type: object
                    required: [art]
                    properties:
                      art: { type: string, enum: [speicher, ladepunkt, verbraucher] }
                      entityId:
                        type: string
                        format: uuid
                        nullable: true
                        description: Pflicht außer beim Speicher-Platz.
      responses:
        "200":
          description: Die Zone nach dem Speichern (die Normalform).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Verbraucher" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/sites/{siteId}/fahrzeuge:
    get:
      tags: [consumer]
      summary: Die Ladekarten dieser Anlage samt ihren Profilen.
      description: >
        Die FAHRZEUGE (Konzept vp-verbrauchsmgmt-konzept-v1 §4.5, Paket P7,
        Captain-Entscheid E4). Eine Zeile ist eine LADEKARTE, die hier schon
        einmal geladen hat - und, sobald der Kunde sie benannt hat, ihr Profil.


        DER SCHLÜSSEL IST EIN PSEUDONYM DER BOX: `tagref_` + HMAC-SHA256 mit
        ihrem eigenen Schlüssel, gemeldet im Herzschlag. Der Klartext-IdTag
        verlässt die Box nie und steht in keiner Cloud-Tabelle. Es ist
        AUSDRÜCKLICH NICHT der Bezug aus `ocpp_transaction` - den pfeffert die
        Cloud beim Ingest ein zweites Mal, die zwei Pseudonym-Räume sind
        verschiedene Werte für dieselbe Karte.


        `steuerart: null` heißt „kein Profil - die Karte lädt wie ihr
        Ladepunkt". `laedt` kommt aus dem Herzschlag, nie aus der Sichtungszeit
        geraten. RLS-gefenced wie jede /sites/**-Route (fremde Anlage 404).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Die Karten, zuletzt gesehene zuerst.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fahrzeuge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/sites/{siteId}/fahrzeuge/{tagRef}:
    put:
      tags: [consumer]
      summary: Eine Ladekarte benennen und/oder ihr eine Steuerart geben.
      description: >
        PATCH je Feld: ein Feld, das der Wunsch NICHT nennt, wird nicht
        angefasst - „benannt" und „gesteuert" sind zwei Schritte.


        DIE QUELLE HAT DREI ZUSTÄNDE: der Schlüssel FEHLT = nichts ändern; ein
        Wort SETZT sie; die LEERE Zeichenkette NIMMT DAS PROFIL ZURÜCK (die
        Karte lädt wieder wie ihr Ladepunkt) - ohne den dritten Zustand gäbe es
        keinen Weg zurück, ohne zugleich den Namen zu verlieren.


        EIN PROFIL TRÄGT EINE QUELLE UND NIE EIN ZIEL: ein Ziel („bis 06:00
        fertig") wird Stunden im Voraus für einen LADEPUNKT geplant, und welches
        Auto dann dort steckt, weiß niemand - `guenstig`/`feste_zeiten` werden
        deshalb BEIM NAMEN mit 400 abgelehnt.


        Eine Karte, die diese Anlage nie gesehen hat, ist 404 (ein Profil darauf
        träfe nie ein Auto); was gar kein Pseudonym dieser Box sein kann, ist
        400 - ein Klartext-IdTag darf hier nicht einmal ankommen.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tagRef, in: path, required: true, schema: { type: string, pattern: "^tagref_[0-9a-f]{8,64}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                  description: Leer LÖSCHT den Namen; abwesend lässt ihn stehen.
                quelle:
                  type: string
                  enum: ["", sofort, ueberschuss]
                  description: >
                    Abwesend = nichts ändern, "" = Profil zurücknehmen.
                ueberschussModus: { type: string, enum: [pausieren, mindestleistung] }
                mindestleistungKw: { type: number, minimum: 0, maximum: 1000 }
      responses:
        "200":
          description: Die Karten nach dem Speichern.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fahrzeuge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [consumer]
      summary: Das Profil einer Ladekarte zurücknehmen.
      description: >
        Nullt Name UND Steuerart. Die SICHTUNG bleibt stehen - eine Rücknahme
        ist keine Beweisvernichtung, und die Karte erscheint danach wieder als
        unbenannte Bekannte statt beim nächsten Herzschlag als „neu".
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: tagRef, in: path, required: true, schema: { type: string, pattern: "^tagref_[0-9a-f]{8,64}$" } }
      responses:
        "200":
          description: Die Karten nach der Rücknahme.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fahrzeuge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/sites/{siteId}/verbraucher/{entityId}/steuerart:
    put:
      tags: [consumer]
      summary: Die Steuerart EINER Komponente setzen.
      description: >
        Der EINE Schreibweg der Steuerart (Konzept vp-verbrauchsmgmt-konzept-v1
        §3.3/§4.4, Paket P2). Er schreibt KEIN neues Format: er stellt ein
        consumer_profile sicher (auch für eine Komponente, die noch keines hat),
        legt die Requirement-Projektion (§3.3) als NEUE consumer_policy-Fassung
        ab und aktiviert sie über den BESTEHENDEN Pfad - mit dessen Kompilierung,
        V-5-Anspruchsprüfung, Flag-Toren und Audit-Spur.


        Der Rumpf ist die SPIEGELFORM der gelesenen Steuerart, damit der
        Rundlauf hält: was hier hingeht, liest die Projektion danach wieder aus.
        "Sofort" hat per §3.3 GAR KEINE Anforderung und das Schema verlangt
        `minItems: 1` - diese Quelle NIMMT deshalb die aktive Fassung zurück
        (der flag-unabhängige Stopppfad), statt eine leere zu schreiben.


        Eine OCPP-Ladesäule (`ev-charger`) ist hier 422 mit dem Weg, den es
        wirklich gibt: ihre Quelle fährt die Quellen-Bahn der Box, die
        Arbiter-Brücke dorthin entsteht in Paket P5. RLS-gefenced wie jede
        /sites/**-Route (fremde Anlage bzw. unbekannte Komponente 404, nie 403).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SteuerartWunsch" }
      responses:
        "200":
          description: >
            Die Steuerart, wie sie JETZT gilt, plus das Ergebnis der
            Aktivierung. Eine abgelehnte Aktivierung ist KEIN Fehler, sondern
            ein benannter Ausgang (`aktiv: false` mit Grund und Satz) - der
            Entwurf bleibt gespeichert.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SteuerartErgebnis" }
        "400":
          description: >
            Die Wahl ist für diesen Typ unzulässig oder gesperrt - der Rumpf
            trägt den deutschen Grund in `message`, und es wurde NICHTS
            geschrieben.
        "422":
          description: >
            Diese Komponente lässt sich hier (noch) nicht steuern - der Satz
            nennt den Weg.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/sites/{siteId}/chargers:
    get:
      tags: [sites]
      summary: Die Ladepunkte der Anlage und das Budget, das sie sich teilen.
      description: >
        Das Standort-Ladebudget und jede OCPP-Ladesäule mit ihren Steckern, aus
        dem additiven `chargers`-Block des Geräte-Herzschlags (Lastmanagement
        Stufe 3). Jede Zahl und jeder deutsche Satz stammt aus der BOX und wird
        nur weitergereicht - dort wird entschieden, hier nur gezeigt (die
        Anschlussgrenze ist eine physische Grenze, ihr Wächter darf nicht am WAN
        hängen). READ-ONLY: es gibt bewusst keine Route, die eine Ladegrenze
        setzt. RLS-gefenced (fremde Anlage 404, Admins über den
        `X-Tenant-Id`-Umschalter); `budget: null` mit leerer Liste ist der
        ehrliche Zustand einer Anlage ohne Ladesäulen - nie ein Budget von 0.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Budget + Ladepunkte (beides leer ohne gemeldeten Block).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteCharging" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/ocpp/control:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [sites]
      summary: OCPP-Einrichtung und getrennte Bestätigungen der Boxen.
      description: Operatoren und Anlagenverwaltung lesen desired und observed; fremde Anlage 404.
      responses:
        "200":
          description: Gewünschte Konfiguration (null ohne Einstellung) und zeitgestempelte Meldungen je Box.
          content:
            application/json:
              schema:
                type: object
                properties:
                  desired: { type: object, nullable: true, additionalProperties: true }
                  observed: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
    put:
      tags: [sites]
      summary: OCPP-Freigabe, Anschlussdaten, Karten oder zeitlich begrenzte Ladegrenzen speichern.
      description: >-
        Anlagen-, Mandanten- oder Plattformverwaltung. Payload entspricht ocpp_control
        in mqtt-charging-config.schema.json, mit der zuvor gelesenen Revision (0 initial).
        Der Server erhöht die Revision und versendet erst nach Commit. Eine Speicherung
        ist keine Bestätigung der Box oder der physischen Wirkung. Grenzen sind rein
        begrenzend, maximal 24 Stunden; beaufsichtigte Tests dauern 3 x 60 Sekunden.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        "200": { description: Gespeichertes desired mit neuer Revision und getrenntem observed. }
        "400": { description: Ungültige Revision, Anschlussdaten, Karten oder Zeitgrenzen. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Keine Berechtigung zur Anlagenverwaltung. }
        "404": { description: Site not found for this tenant. }
        "409": { description: Revision inzwischen geändert; neu laden. }
  /api/v1/sites/{siteId}/ocpp/stations:
    get:
      tags: [sites]
      summary: OCPP-1.6-Stationen mit Boot-, Verbindungs-, Stecker- und Fähigkeitszustand.
      description: Read-only und RLS-gesichert; keine Live-Station wird angesprochen. Plattform-Admins wählen den Mandanten wie bei allen Kundenpfaden über X-Tenant-Id.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Stationen der Anlage.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OcppStation" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/ocpp/events:
    get:
      tags: [sites]
      summary: Redigiertes OCPP-Journal mit Call, CallResult, CallError und Verbindungsereignissen.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: action, in: query, schema: { type: string } }
        - { name: messageType, in: query, schema: { enum: [Call, CallResult, CallError, Event] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: Neueste Ereignisse zuerst; Geheimnisse bleiben auch im Payload redigiert.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OcppProtocolEvent" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/ocpp/gaps:
    get:
      tags: [sites]
      summary: Dauerhafte Nachweise unvollständiger OCPP-Journalbereiche.
      description: Aus action=JournalGap abgeleitet; meldet Überlauf sowie fehlgeschlagene Schreib-/Commitvorgänge mit monotonem Zähler und betroffenem Zeit-/Eventbereich. Read-only, RLS-gesichert und ohne Stationskontakt.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: Neueste Datenlücken zuerst; eine leere Liste bedeutet, dass keine Lücke gemeldet wurde, nicht dass Verlust physikalisch unmöglich war.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OcppDataGap" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/ocpp/transactions:
    get:
      tags: [sites]
      summary: OCPP-Ladevorgänge einschließlich Zählergrenzen, Stopgrund und maskierten Auth-Bezügen.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: Neueste Ladevorgänge zuerst.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OcppTransaction" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/ocpp/meter-values:
    get:
      tags: [sites]
      summary: Dimensionsgetreue OCPP MeterValues und StopTransaction.transactionData.
      description: Jede Zeile ist genau ein SampledValue; pointKey enthält measurand/context/format/phase/location/unit und verhindert dimensionsfremde Zusammenführung.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: pointKey, in: query, schema: { type: string } }
        - { name: transactionId, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 } }
      responses:
        "200":
          description: Einzelne SampledValues, neueste zuerst.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OcppMeterSample" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/ocpp/configuration:
    get:
      tags: [sites]
      summary: GetConfiguration-Inventar und SupportedFeatureProfiles.
      description: readonly, unknownKey, Standard-/Vendor-Key-Klassifikation und Redaktionsstatus. AuthorizationKey hat immer value=null.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: chargePointId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Konfigurationen der Stationen.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OcppConfiguration" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/ocpp/action-permissions:
    get:
      tags: [sites]
      summary: D4-Rollenmatrix des Station-Command-Gateways.
      description: Reine Policy-Auskunft; die schreibenden Endpunkte erzwingen dieselbe Matrix serverseitig.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Aktion -> für den angemeldeten Principal erlaubt.
          content: { application/json: { schema: { $ref: "#/components/schemas/OcppActionPermissions" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/ocpp/stations/{chargePointId}/action-intents:
    post:
      tags: [sites]
      summary: Serverseitigen Kurzzeit-Intent für Hard Reset, Full LocalList oder Firmware ausstellen.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: chargePointId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OcppActionIntentRequest" } } }
      responses:
        "201": { description: Intent, content: { application/json: { schema: { $ref: "#/components/schemas/OcppActionIntent" } } } }
        "403": { description: Serverseitig nicht erlaubt. }
        "404": { description: Station nicht bekannt. }
  /api/v1/sites/{siteId}/ocpp/stations/{chargePointId}/actions:
    post:
      tags: [sites]
      summary: Eine OCPP-1.6-Aktion vorbereiten und one-shot an die Edge senden.
      description: >
        Idempotent über Idempotency-Key. Die Antwort beschreibt nur den
        persistierten Transportzustand; Accepted wird erst durch CallResult
        und Wirkung beobachtet erst durch ein Folgeereignis.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: chargePointId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OcppActionRequest" } } }
      responses:
        "201": { description: Persistierte Aktion, content: { application/json: { schema: { $ref: "#/components/schemas/OcppAction" } } } }
        "403": { description: D4-Berechtigung fehlt. }
        "409": { description: Laufende Doppelaktion oder Intent-Konflikt. }
  /api/v1/sites/{siteId}/ocpp/actions:
    get:
      tags: [sites]
      summary: Persistierte OCPP-Aktionschoreografien.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: chargePointId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
      responses:
        "200": { description: Aktionen, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OcppAction" } } } } }
  /api/v1/sites/{siteId}/ocpp/actions/{actionId}:
    get:
      tags: [sites]
      summary: Eine OCPP-Aktion mit Antwort- und Wirkungsbeleg.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: actionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Aktion, content: { application/json: { schema: { $ref: "#/components/schemas/OcppAction" } } } }
    delete:
      tags: [sites]
      summary: Eine noch nicht an die Edge übergebene One-shot-Aktion abbrechen.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: actionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Abbruch protokolliert. }
        "409": { description: Bereits an die Edge übergeben; der physische Befehl kann nicht zurückgerufen werden. }
  /api/v1/sites/{siteId}/ocpp/actions/{actionId}/audit:
    get:
      tags: [sites]
      summary: Unveränderliche Zustands- und Wirkungs-Auditspur einer OCPP-Aktion.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: actionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Auditspur, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OcppActionAudit" } } } } }
  /api/v1/sites/{siteId}/supply-price:
    get:
      tags: [sites]
      summary: The structured supply-price sheet (Bezugspreis-Komponenten).
      description: >
        One Anlage's `site_supply_price` Preisblatt (report vp-nacht-bezug-e7
        Stufe 2): the volumetric grid-import components in ct/kWh NETTO plus the
        USt rate and the Preisblatt-Stand. `present` says whether a row exists;
        `hasComponents` is the activation gate - when true, the optimizer prices
        import as `(spot + Sum Komponenten) x (1+USt)` instead of bare spot. A
        site without a row reports an empty sheet so the portal can prefill the
        researched suggestion values. RLS-scoped (foreign site 404; admins via
        the `X-Tenant-Id` switcher).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The sheet (empty when no row exists).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplyPrice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
    put:
      tags: [sites]
      summary: Maintain the structured supply-price sheet.
      description: >
        Upsert the site's Preisblatt components. PATCH semantics (the
        site-update COALESCE pattern): a field ABSENT from the body keeps its
        stored value; a field present with a value is written, and an explicit
        `null` CLEARS that component to "unknown" (which suppresses the
        composition again once the last one is cleared). `ustPct` is NOT NULL - a
        present `null` there is ignored. This endpoint only makes a maintained
        sheet possible; the optimizer's behaviour changes when a component is
        actually saved (a maintained row activates the composition), never on its
        own. RLS-scoped (foreign site 404); the tenant is taken from the token,
        never the body.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Any subset of the component fields. All ct/kWh NETTO, all
                nullable (null clears to "unknown").
              properties:
                netzentgeltArbeitspreisCt: { type: number, nullable: true, minimum: 0 }
                stromsteuerCt: { type: number, nullable: true, minimum: 0 }
                konzessionsabgabeCt: { type: number, nullable: true, minimum: 0 }
                umlagenCt: { type: number, nullable: true, minimum: 0 }
                vertriebsaufschlagCt: { type: number, nullable: true, minimum: 0 }
                ustPct: { type: number, minimum: 0, maximum: 100 }
                komponentenStand: { type: string, format: date, nullable: true }
      responses:
        "200":
          description: The recomputed sheet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplyPrice" }
        "400": { description: A component/USt/date value is invalid (German message). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/topology:
    get:
      tags: [topology]
      summary: Anlagen-Topologie-Read-Model (the adaptive energy-flow graph).
      description: >
        The site as an entity graph aggregated into the role-grouped hub
        topology the adaptive energy-flow diagram (AE2) renders: entities with
        each capability's resolved role (stored override else the DefaultRole
        mapping) + maßgeblich flag + latest live value (from telemetry_v2), plus
        the server-derived `topology` (role nodes PV-Erzeugung / Speicher / Netz
        / Verbraucher with directed flows, the shared Go/TS/Java twin - see
        docs/contracts/v2/topology-read-model.md). A hybrid inverter maps to
        several roles at once; several entities aggregate into one role. A fresh
        site returns empty entities + empty topology. RLS-scoped by tenant.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's topology read-model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologyResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/topology-roles:
    put:
      tags: [topology]
      summary: Assign capabilities to roles (customer, "Rollen & Zuordnung").
      description: >
        The customer twin of the admin role-assignment (U2 "Rollen & Zuordnung",
        report §3.2): a Portal-User re-assigns a capability's role and picks the
        maßgebliche (primary) measurement for THEIR OWN site. Tenant-scoped (RLS;
        foreign site = 404, never 403); admins reach it via the `X-Tenant-Id`
        switcher. Safe by construction: a role is presentation-level and never
        widens control (guards/arbitration key on capabilities, not roles), so
        this shares the admin rule verbatim with no relaxed gate. A blank role
        reverts to the DefaultRole mapping; an unknown role is 400.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    required: [entityId, channel]
                    properties:
                      entityId: { type: string, format: uuid }
                      channel: { type: string, example: power_kw }
                      role:
                        type: string
                        description: pv | storage | grid | consumer; blank clears the override.
                        example: grid
                      primary: { type: boolean }
      responses:
        "200":
          description: The recomputed topology read-model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologyResponse" }
        "400": { description: Unknown role or missing entityId/channel. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or entity not found for this tenant. }
  /api/v1/sites/{siteId}/v2-entities/adopt:
    post:
      tags: [topology]
      summary: Adopt a reported source into a component (customer, Portal v3 M6 "Zuordnen").
      description: >
        The CUSTOMER twin of the adoption bridge (Portal v3 M6 "Neues Gerät
        gefunden … jetzt zuordnen", OPEN O3): a Portal-User assigns an
        edge-reported source of THEIR OWN site to a component in one move.
        Tenant-scoped (RLS; foreign site = 404, never 403); admins reach it via
        the `X-Tenant-Id` switcher. It delegates to the SAME adoption the admin
        route uses, but is CATALOG-GUARDED to the GUIDED types only — producer,
        grid-meter and consumer-category types (the set the guided suggestion
        derives). It is never a free type picker and never takes guard-config
        input: platform-managed composed types (battery-hybrid / house-load) and
        free installer types (modbus-generic) are refused (422). Idempotent per
        `sourceId` (a re-adopt returns the existing entity).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId, entityType]
              properties:
                sourceId: { type: string, description: The edge source id from local_setup. }
                entityType: { type: string, example: wallbox }
                label: { type: string }
                maxPowerKw: { type: number, description: Consumer rated power (bounds commands). }
                capacityKwp: { type: number, description: Producer nameplate (kWp). }
                registryUnitId: { type: string, description: MaStR SEE number of the source. }
      responses:
        "200":
          description: The adopted (or already-existing) entity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2Entity" }
        "400": { description: Missing sourceId/entityType or unknown type. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
        "422": { description: The type is not a guided type (battery-hybrid / house-load / free installer type). }
  /api/v1/sites/{siteId}/v2-entities/{entityId}/edge-source:
    post:
      tags: [topology]
      summary: Re-pin an entity to a currently reported edge source ("Wieder verbinden").
      description: >
        The repair lever for identity churn and crossed pins
        (vp-vier-erzeuger-p9): a source deleted + re-added on the device got a
        new id, the entity's pin went stale (orphanedPin on the entities
        surface) and the same physical device showed up as "Neues Gerät
        gefunden". Re-pinning RECONNECTS the existing component (label, kWp,
        history) instead of minting a duplicate. Customer-safe: it moves only
        the presentation-level source link of the caller's OWN site (RLS) -
        never guard config or control rights. The target source must be
        currently reported by the device and role-compatible with the entity's
        type; a source already pinned to another entity is refused (409); a
        stale de-entitied point holding the pin is released (kWp delta) so the
        pin can move. Idempotent for the same sourceId.


        swap=true (vp-bereinigung-ui-k3) turns the 409 into a guided EXCHANGE:
        both assignments move inside ONE transaction, so a customer whose plant
        is fully pinned to the WRONG components can straighten it out and can
        never strand half-swapped. The other component gets this entity's
        previous source only when that source is still reported - otherwise its
        pin is cleared (moving an orphan defect would be the worse outcome).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId]
              properties:
                sourceId: { type: string, description: The edge source id from local_setup. }
                swap:
                  type: boolean
                  default: false
                  description: >
                    Explicit consent to take a source another component holds -
                    both assignments are exchanged atomically. Absent/false
                    keeps the 409, so an older client can never steal one.
      responses:
        "200":
          description: The re-pinned entity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2Entity" }
        "400": { description: Missing sourceId. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or entity not found for this tenant. }
        "409": { description: The source is already pinned to another entity (and swap was not requested). }
        "422": { description: The source is not currently reported, its role does not fit the entity's type, or the component is platform-composed. }
  /api/v1/sites/{siteId}/v2-entities/{entityId}/label:
    put:
      tags: [topology]
      summary: Rename a component (the customer's own name / alias).
      description: >
        The customer twin of the admin label PUT (concept vp-entity-alias-k1).
        The name is what the CUSTOMER calls the thing ("Dach Süd"); since the
        Label-Hygiene migration (V20260812000000) a non-null label means
        human-given, so it wins the customer-facing name chain over the name the
        device carries on its own :8484 page.


        R1 - a name is PRESENTATION and never an intervention. Enforced by
        construction: this route accepts ONLY `label`. There is no type, role,
        pin or guard field in the request, so nothing can be smuggled through
        the rename door; assignment and control keep their own gated routes.


        EVERY component may be renamed, including the platform-composed
        battery-hybrid / grid-meter / house-load - re-pin and delete refuse
        those because they change what a component IS or whether it exists,
        while a name changes neither. Only their TYPE and ROLE stay ours.


        Semantics mirror the admin PUT so there is one label-writing rule: an
        absent/null label keeps the current name, an EMPTY one clears it - back
        to the derived name, never an empty label. Newlines/control characters
        collapse to single spaces and the value is trimmed. Duplicates are
        allowed on purpose (two arrays may both be called "Dach").
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 200
                  nullable: true
                  description: >
                    The customer's name. Empty string clears it (back to the
                    derived name); absent/null keeps the current one.
      responses:
        "200":
          description: The renamed entity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2Entity" }
        "400": { description: The label exceeds 200 characters. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or entity not found for this tenant. }
  /api/v1/sites/{siteId}/v2-entities/{entityId}:
    delete:
      tags: [topology]
      summary: Delete an adopted component (customer cleanup lever).
      description: >
        The customer twin of the admin purgePoint delete: it removes the
        measurement point outright, releases a producer's kWp from the
        aggregate asset.pv and frees the edge-source pin, so the device
        reappears as "Neues Gerät gefunden" and can be assigned to the right
        component. The registry is re-pushed, so the device drops the component
        too. Refused (422) for the platform-composed base components
        (battery-hybrid / house-load) and for any component without a device
        assignment - a grid meter or house load composed from the plant's own
        master data is its Grundausstattung, not a mis-adoption.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or entity not found for this tenant. }
        "422": { description: A platform-composed or unassigned component - not the customer's to remove. }
  /api/v1/sites/{siteId}/entity-strategies:
    get:
      tags: [topology]
      summary: Which active flows touch each entity (U2 strategy chips).
      description: >
        The entity→active-flow map the "Ihre Geräte" cards render as read-only
        strategy chips (a link into Steuerung), derived from each active flow
        document's D-13 claims. Keyed by entity id. Tenant-scoped (RLS; foreign
        site 404).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: entityId → list of {flowId, flowName}.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: object
                    properties:
                      flowId: { type: string, format: uuid }
                      flowName: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/admin/sites/{siteId}/topology-roles:
    put:
      tags: [topology, admin]
      summary: Assign capabilities to roles (platform-admin).
      description: >
        Re-assign a capability's role and pick the maßgebliche (primary)
        measurement per role. Platform-admin only, through the `X-Tenant-Id`
        switcher over the RLS path (foreign site = 404). A blank role reverts the
        capability to its DefaultRole mapping; an unknown role is 400. Returns
        the recomputed read-model.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    required: [entityId, channel]
                    properties:
                      entityId: { type: string, format: uuid }
                      channel: { type: string, example: power_kw }
                      role:
                        type: string
                        description: pv | storage | grid | consumer; blank clears the override.
                        example: grid
                      primary: { type: boolean }
      responses:
        "200":
          description: The recomputed topology read-model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologyResponse" }
        "400": { description: Unknown role or missing entityId/channel. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
        "404": { description: Site or entity not found for the selected tenant. }
  /api/v1/sites/{siteId}/profile:
    get:
      tags: [profile]
      summary: Nutzungsprofil / EMS-Modus read-model (AE7, the second adaptation axis).
      description: >
        The site's usage profile (arbitrage | peak | private) that steers the
        adaptive portal/edge EMPHASIS, DERIVED from its strategy nodes (active
        flows) + entity mix + money master data (plant_kind, Leistungspreis),
        with an explicit override. ONE truth - not a competing concept (see
        docs/contracts/v2/usage-profile.md). Returns the effective profile, the
        derived default, the override, the emphasis map (money/peak/flow/devices)
        and the raw signals. RLS-scoped (foreign site 404; admins via the
        `X-Tenant-Id` switcher).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The usage-profile read-model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
    put:
      tags: [profile]
      summary: Set or clear the usage-profile override.
      description: >
        Set the explicit usage-profile override (arbitrage | peak | private) or
        clear it (null/blank -> auto-derive). Customer or admin, RLS-scoped;
        returns the recomputed read-model. Also echoed on Site.usageProfileOverride.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                override:
                  type: string
                  nullable: true
                  enum: [arbitrage, peak, private]
                  description: null/blank clears the override (auto-derive).
      responses:
        "200":
          description: The recomputed usage-profile read-model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageProfile" }
        "400": { description: Override is not one of arbitrage, peak, private. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/anwendungs-preset:
    put:
      tags: [profile]
      summary: Set the site's application PRESET (Privat | Gewerbe).
      description: >
        The PROFILE of a plant (Anwendungs-Programm Stufe 2, Captain-Entscheid
        E3): preset + tonality + reset base, never a signal of the activation
        derivation. It changes NO switch - which applications run stays the
        Regal's business (PUT .../profiles), so a later "Profil aendern" can
        never rewrite the customer's own switches. The assistant flips the
        proposed switches individually through that same route, with the same
        server effects (open the gate, seed the starter).
        An absent/blank `profil` clears it back to "none chosen"; an unknown
        word is a 400 with a German reason, never a silent fallback to one of
        the two. Deliberately a narrow route rather than a field of the site
        master-data form: the assistant writes it from a step that never loaded
        the tariff/remuneration fields, and a full-representation
        PUT /api/v1/sites/{id} from there would be a clobber risk. The path is
        deliberately NOT `/profil` - that would sit ONE character next to the
        existing `/profile` (the AE7 usage profile).
        RLS-scoped (foreign site 404; admins via the `X-Tenant-Id` switcher).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                profil:
                  type: string
                  nullable: true
                  enum: [privat, gewerbe]
                  description: The preset, or null/absent to clear it.
      responses:
        "200":
          description: The updated site (its `profil` echoes the stored value).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400": { description: Unknown profil (German message). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/profiles:
    get:
      tags: [profile]
      summary: Betriebsmodell-Regal of the Anlage (Portal v3 M3 + Steuerung Stufe 0).
      description: >
        The plant's feature set, composed from the ONE application catalog
        (`anwendungen/catalog.json`) and returned as TWO lists.

        `profiles` is the SHELF the Steuerung page renders - since Steuerung
        Stufe 0 "Entwirrung" exactly the four BETRIEBSMODELLE (Marktoptimierung,
        Lastspitzenkappung, Atypische Netznutzung, Ladepark-Lastmanagement),
        server-filtered on the catalog field `regal`.

        `weitere` carries the applications that are NOT on the shelf - the two
        BASIS entries (Anlage beobachten, Speicher-Fahrplan; always on, `state`
        refused with 400) and the RULE applications (Ueberschuss nutzen,
        Verbraucher steuern, Eigene Auswertung; their switch is pure intent - no
        gate is opened, no starter seeded). Stufe 0 HIDES them, it does not
        delete them: their states are still answered here (surfaces outside the
        Steuerung read them - the cockpit gate "is Eigene Auswertung on?" and the
        intent overlay of the mode projection), and PUT still reaches them. The
        field is ADDITIVE: an older client reads only `profiles` and thereby sees
        exactly the shelf.

        Reserved catalog entries appear in NEITHER list - a switch that cannot do
        anything would be a promise nobody keeps.
        Every switchable application is a DIRECT customer toggle - there are exactly two states,
        `an` and `aus`, and no "angefragt" state anywhere. `state` is the STORED
        intent (null = no row = derived default, i.e. the pre-M3 behaviour);
        `derivedActive` is what the derivation alone says, `active` the effective
        result after the intent overlay. `blockedReason` is the honest German
        sentence for a profile that is switched on but cannot fully run yet
        (missing Leistungspreis, missing market access) - never a request prompt.
        RLS-scoped (foreign site 404; admins via the `X-Tenant-Id` switcher).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The shelf.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteProfiles" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
    put:
      tags: [profile]
      summary: Switch one Anwendung on or off.
      description: >
        What switching ON does depends on the application's CLASS in the catalog:
        a BUSINESS application enables exactly ITS gated node types for this site
        and seeds its starter flow (`FlowTemplateService.autoStart`); a RULE
        application stores the INTENT only - no gate is opened and no starter is
        seeded, because its content are the rules the customer builds. Switching
        OFF deactivates the application's flows (if it has a strategy node),
        disables those node types again and persists `aus` (so a re-derived
        signal cannot silently re-enable it). The gate is opened, never faked -
        the activation path still re-checks it, and the peak-shaving
        configuration gate, the edge guard chain and the section 14a/EEG
        protections are untouched. Marktoptimierung additionally requires real
        market access on the site (a dynamic tariff and/or Direktvermarktung):
        without it the toggle still flips, but the gated node stays closed and
        nothing trades. A toggle NEVER writes money/contract master data.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile, state]
              properties:
                profile:
                  type: string
                  example: marktvermarktung
                  description: >
                    A visible, switchable application id from
                    `anwendungen/catalog.json`. A BASIS application is always on
                    and refuses with 400; a reserved entry is indistinguishable
                    from an unknown one (it does not exist yet).
                state: { type: string, enum: [an, aus] }
      responses:
        "200":
          description: The recomputed shelf.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteProfiles" }
        "400": { description: "Unknown application, an always-on BASIS application, or an unknown state." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/cockpit-layout:
    get:
      tags: [profile]
      summary: The stored cockpit layout of one Anlage (Anwendungs-Programm Stufe 3).
      description: >
        Returns ALL layers SEPARATELY plus the Baustein catalog - never the
        resolved surface. The resolution (catalog -> preset -> Vorgabe -> Eigen)
        is a pure function in the portal (`cockpitLayout.ts layoutResolve`); the
        server holds catalog + intent, and there is deliberately no
        `GET /surface` (BUILD.md section 4.1). They must stay separate so the UI
        can say WHAT a "Zuruecksetzen" falls back to ("the Vorgabe of your
        operator" vs "the VoltPilot standard") - Captain decision E2.
        A site with no row answers with empty layers, i.e. the deterministic
        catalog default = the behaviour before this stage.
        RLS-scoped (foreign site 404, never 403; admins via the `X-Tenant-Id`
        switcher).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The layers + the Baustein catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CockpitLayout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
    put:
      tags: [profile]
      summary: Store one layer of the cockpit layout.
      description: >
        `layer=eigen` (default) is the CUSTOMER's arrangement and WINS over any
        Vorgabe; `layer=vorgabe` is the operator's default and may only be
        written by a platform-admin (403 otherwise) - a method check, not a
        second data path, so a future operator role plugs in at one place.
        The body stores INTENT only: `order` names Bausteine in their order
        (unnamed ones keep their canonical position, which is how a newly
        activated application appears where it belongs), `hidden`/`shown` are
        explicit statements (`shown` takes back a LOWER layer's `hidden`), and
        `lead` is the highlighted block.
        Form validation: an unknown Baustein, a Baustein of another surface, a
        MANDATORY Baustein in `hidden` (Status, Zustand - a catalog property, not
        an admin's will), a duplicate in `order` and a non-lead-capable `lead`
        are each a 400 with a German reason and write nothing. A Baustein this
        plant does not currently have is deliberately NOT refused - the
        preference has to survive switching an application off and on again.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: layer
          in: query
          required: false
          schema: { type: string, enum: [eigen, vorgabe], default: eigen }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CockpitLayoutDocument" }
      responses:
        "200":
          description: The recomputed layers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CockpitLayout" }
        "400": { description: "Unknown Baustein, mandatory Baustein hidden, invalid lead, or unknown layer." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Only a platform-admin may write the `vorgabe` layer. }
        "404": { description: Site not found for this tenant. }
    delete:
      tags: [profile]
      summary: Reset one layer - it falls back to the layer beneath.
      description: >
        The reset IS a delete of exactly that row, which is why the button can
        honestly announce its target. Deleting a layer that never existed is a
        harmless no-op, not a 404.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: layer
          in: query
          required: false
          schema: { type: string, enum: [eigen, vorgabe], default: eigen }
      responses:
        "200":
          description: The recomputed layers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CockpitLayout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Only a platform-admin may reset the `vorgabe` layer. }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/eigene-auswertung:
    get:
      tags: [profile]
      summary: The VALUES of one plant's own evaluations (Anwendungs-Programm Stufe 5).
      description: >
        One narrow read for every own Baustein of a plant - current value, day
        figure and, for a `chart`, the day's buckets. No new store and no new
        query: the DEFINITIONS live in the layout document
        (`cockpit_layout.document.custom`), the VALUES come from the same entity
        history path the Messwerte explorer draws its curves from (including the
        MIG-B2 splice that keeps a migrated plant's v1 history). One query per
        COMPONENT, however many tiles sit on it.
        The four figures: `jetzt` = the newest reported value (from the SAME
        series the chart draws, so tile and curve can never disagree),
        `tagesmax` = the day's maximum, `tagesmittel` = the SAMPLE-WEIGHTED mean,
        `tagessumme` = the ADVANCE (`max - min`), never a sum of the readings -
        a kWh channel reports a METER READING here. A negative advance (meter
        swap, reset) yields null, never a fabricated figure.
        `wert` is null wherever there is none - NEVER a 0; a tile without a
        measurement says so in `hinweis`.
        Read-only and RLS-scoped like every `/sites/**` route (foreign site 404,
        never 403; admins via the `X-Tenant-Id` switcher). It takes no
        definition: what a cockpit shows is decided by the layout document, and
        answering a submitted definition would be a second way past the write
        path's validation.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: at
          in: query
          required: false
          description: The anchor day (Europe/Berlin); default today.
          schema: { type: string, format: date }
      responses:
        "200":
          description: One row per stored evaluation (empty when the plant has none).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EigeneAuswertungWerte" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/tenant/cockpit-layout:
    get:
      tags: [profile]
      summary: The customer-wide cockpit Vorgabe ("for all my plants", Captain decision E1).
      description: >
        Same store, `scope_kind=tenant`: an operator with 20 plants maintains ONE
        Vorgabe instead of 20 layouts. A per-plant Vorgabe BEATS it, and the
        customer beats both. The tenant comes from the validated token / the
        `X-Tenant-Id` switcher, never from the path - a platform-admin without a
        selected customer gets 404. On `surface=portfolio` the response's
        `profil` is the fleet's MAJORITY plant profile (ties and "none set"
        yield null - never a guessed audience).
      parameters:
        - name: surface
          in: query
          required: false
          schema: { type: string, enum: [cockpit, portfolio], default: cockpit }
          description: >
            Which surface the layer belongs to. `cockpit` is the per-plant
            cockpit's customer-wide Vorgabe; `portfolio` is the customer's OWN
            portfolio cockpit (Anwendungs-Programm Stufe 4) - there the `eigen`
            layer is the customer's own arrangement, not a dead end. An unknown
            word is a 400 with a German reason, never a silent fallback.
      responses:
        "200":
          description: The layers + the Baustein catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CockpitLayout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No tenant selected. }
    put:
      tags: [profile]
      summary: Store the customer-wide Vorgabe.
      parameters:
        - name: surface
          in: query
          required: false
          schema: { type: string, enum: [cockpit, portfolio], default: cockpit }
          description: >
            Which surface the layer belongs to. `cockpit` is the per-plant
            cockpit's customer-wide Vorgabe; `portfolio` is the customer's OWN
            portfolio cockpit (Anwendungs-Programm Stufe 4) - there the `eigen`
            layer is the customer's own arrangement, not a dead end. An unknown
            word is a 400 with a German reason, never a silent fallback.
        - name: layer
          in: query
          required: false
          schema: { type: string, enum: [eigen, vorgabe], default: vorgabe }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CockpitLayoutDocument" }
      responses:
        "200":
          description: The recomputed layers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CockpitLayout" }
        "400": { description: "Unknown Baustein, a Baustein of the OTHER surface, mandatory Baustein hidden, invalid lead, unknown layer, or unknown surface." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Only a platform-admin may write the `vorgabe` layer. }
        "404": { description: No tenant selected. }
    delete:
      tags: [profile]
      summary: Remove the customer-wide Vorgabe.
      parameters:
        - name: surface
          in: query
          required: false
          schema: { type: string, enum: [cockpit, portfolio], default: cockpit }
          description: >
            Which surface the layer belongs to. `cockpit` is the per-plant
            cockpit's customer-wide Vorgabe; `portfolio` is the customer's OWN
            portfolio cockpit (Anwendungs-Programm Stufe 4) - there the `eigen`
            layer is the customer's own arrangement, not a dead end. An unknown
            word is a 400 with a German reason, never a silent fallback.
        - name: layer
          in: query
          required: false
          schema: { type: string, enum: [eigen, vorgabe], default: vorgabe }
      responses:
        "200":
          description: The recomputed layers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CockpitLayout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Only a platform-admin may reset the `vorgabe` layer. }
        "404": { description: No tenant selected. }
  /api/v1/sites/{siteId}/flows/auto-start:
    post:
      tags: [flows]
      summary: Seed this site's starter flow DRAFT (customer twin of the admin route).
      description: >
        Idempotent: a site that already has any flow is left untouched
        (`already_has_flow`), a site without a battery-hybrid entity reports
        `no_battery`. Creating a DRAFT controls nothing - the activation gate is
        unchanged, so a flow carrying a gated node still fails with
        `gated_node_not_enabled` until that node type is enabled for the site.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201": { description: Starter flow draft created. }
        "200": { description: Nothing seeded - the outcome carries the German reason. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/admin/sites/{siteId}/flow-node-governance:
    get:
      tags: [admin]
      summary: Gated strategy-node types and their per-site enablement (AE7 governance).
      description: >
        The gated (market-/grid-near) strategy node types from the catalog
        (Arbitrage, Peak-Shaving, atyp. NN) and whether each is enabled for this
        site. A flow carrying a gated node stays inactive until it is enabled
        here. Platform-admin only, via the `X-Tenant-Id` switcher.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The gated node types + enablement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowNodeGovernance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
        "404": { description: Site not found for the selected tenant. }
    put:
      tags: [admin]
      summary: Enable/disable gated strategy-node types for the site.
      description: Platform-admin only. An unknown/non-gated node type is 400.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enablements:
                  type: array
                  items:
                    type: object
                    required: [nodeType, enabled]
                    properties:
                      nodeType: { type: string, example: vp.strategy.market }
                      enabled: { type: boolean }
      responses:
        "200":
          description: The recomputed governance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowNodeGovernance" }
        "400": { description: Unknown or non-gated node type. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
        "404": { description: Site not found for the selected tenant. }
  /api/v1/admin/sites/{siteId}/flows/auto-start:
    post:
      tags: [admin]
      summary: Seed the site's profile-appropriate starter flow draft (AE7 auto-start).
      description: >
        Seed a starter flow DRAFT matching the site's derived usage profile
        (arbitrage -> market, peak -> peak-shaving, private -> self-consumption
        on the battery), so onboarding never dead-ends. Idempotent: a site with
        any flow is left untouched (created=false, reason already_has_flow); a
        site without a battery is skipped (reason no_battery). Platform-admin only.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: The starter flow draft was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoStartOutcome" }
        "200":
          description: No-op (already has a flow / no battery).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoStartOutcome" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
        "404": { description: Site not found for the selected tenant. }
  /api/v1/sites/{siteId}/history:
    get:
      tags: [history]
      summary: A site's history ("Historie") for one period, money lens first.
      description: >
        Bucketed pv/load/grid/SoC series (15-min for day, hourly for week,
        Europe/Berlin-daily for month/year; served from the telemetry rollup
        tables, day live from raw telemetry) with the matching day-ahead price
        and per-bucket import cost, plus period totals: consumption / PV /
        import / export kWh, grid cost EUR (import energy x matching 15-min
        price), battery savings EUR (persisted optimizer plans, latest run per
        slot, null where none exist), Autarkiegrad and Eigenverbrauchsquote.
        For range=day the response additionally carries the Tagesprotokoll
        (notable events in plain German) and the persisted plan trajectory for
        the plan-vs-actual overlay. Period boundaries are Europe/Berlin local
        time. RLS-scoped by tenant.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: range
          in: query
          required: false
          schema: { type: string, enum: [day, week, month, year], default: day }
        - name: at
          in: query
          required: false
          schema: { type: string, format: date }
          description: Any date inside the wanted period (default today, Europe/Berlin).
      responses:
        "200":
          description: The site's history for the period (empty buckets if no data).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/History" }
        "400": { description: Unknown range value. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/earnings:
    get:
      tags: [history]
      summary: One site's realized money for one period (the "Erlöse" world).
      description: >
        The Anlagen-scharfe twin of GET /api/v1/earnings (Historie concept
        vp-historie-konzept-t4 §4.2 Welt B / F1, performance measure P3): the
        SAME slot math, the SAME price truth, one site and one period instead
        of the whole tenant with strip and forward market value. Beyond the
        fleet fields it exposes the COMPOSITION the money card shows -
        stromkostenEur (the metered import at the site's real supply price -
        literally the import term of actualEur), the resulting nettoErgebnisEur
        = einspeiseErloesEur + eigenverbrauchsWertEur - stromkostenEur, the
        Marktprämie already contained in the feed-in revenue, the Ø Bezugspreis
        and a per-bucket series carrying the three parts (so the chart can
        stack them and its cumulative line lands on nettoErgebnisEur).
        savedEur stays an ATTRIBUTION inside the result, never a sibling
        summand. Ranges are the Historie vocabulary (week included);
        range=all reports the site's first covered Berlin day as `from`.
        RLS-scoped - a foreign site is 404; admins use the X-Tenant-Id
        switcher.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: range
          in: query
          schema: { type: string, enum: [day, week, month, year, all], default: month }
        - name: at
          in: query
          description: Any date inside the wanted period (default today, Europe/Berlin).
          schema: { type: string, format: date }
      responses:
        "200":
          description: The site's realized money for the period.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteEarnings" }
        "400": { description: Unknown range value. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/forecast-quality:
    get:
      tags: [forecast-quality]
      summary: Forecast-model quality ("Prognosequalität") for a site.
      description: >
        The shadow-mode forecasting transparency view (docs/forecasting.md):
        which forecast model is LIVE per kind (activeLoadModel/activePvModel,
        resolved server-side FOR THIS SITE with the SAME precedence the
        optimizer uses - the site's own choice wins, else the platform default,
        else the env default), the
        lifecycle of every model that has run on the site (challengers report
        "collecting: day X of N" while their self-gate is unmet; trained models
        carry trainedAt/trainRows and the top feature importances with
        plain-German labels), the per-model daily error series (MAE kW, nMAE %,
        bias, skill vs the ACTIVE model - positive = better) computed by the
        daily evaluation job, and the daily plan-vs-actual economics.
        Challenger promotion is NEVER automatic; it is a deliberate act on
        /api/v1/sites/{siteId}/forecast-models - by the customer, for their own
        plant - informed by this data. The platform-wide
        /api/v1/admin/forecast-models sets only the DEFAULT for plants without
        their own choice. All rows come from RLS-scoped tables - a foreign site is a
        404; a fresh site yields empty (but well-formed) lists.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 30, minimum: 1, maximum: 90 }
          description: How many trailing days of accuracy/plan series to return.
      responses:
        "200":
          description: The site's forecast-quality view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForecastQuality" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/forecast-models:
    get:
      tags: [forecast-quality]
      summary: Welches Prognosemodell plant DIESE Anlage (der Schalter-Zustand)?
      description: >
        Der Prognose-Schalter EINER Anlage (Captain-Auftrag 19.08.2026 - er
        revidiert die plattformweite Semantik von /api/v1/admin/forecast-models
        vom Vortag): je Prognoseart (load/pv) das Modell, das DIESE Anlage
        plant, WOHER die Wahl kommt (anlage = eine Zeile in
        site_forecast_model_choice, plattform = die Vorgabe von VoltPilot,
        env = das ausgelieferte Standardmodell), die Plattform-Vorgabe und der
        Umgebungs-Vorgabewert, wer wann umgestellt hat und die wählbare Menge -
        plus die append-only Umstellungs-Historie DIESER Anlage.
        Mandantenbezogen wie jede /sites/**-Route: KEIN platform-admin nötig,
        Authentifizierung + Postgres-RLS sind der Zaun, eine fremde Anlage ist
        404 (nie 403). Portal-Admins erreichen jede Anlage über den
        X-Tenant-Id-Umschalter auf demselben Pfad.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Der Schalter-Zustand dieser Anlage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteForecastModels" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant (RLS). }
    post:
      tags: [forecast-quality]
      summary: Kandidat übernehmen - für DIESE Anlage.
      description: >
        Stellt das aktive Modell EINER Prognoseart FÜR DIESE ANLAGE um. Ab dem
        nächsten Planungslauf konsumiert der Optimierer die Prognosereihen
        dieses Modells - nur für sie; alle anderen Anlagen bleiben unverändert.
        Das bisherige Modell rechnet im Schatten weiter und wird weiter täglich
        bewertet, der Rückweg ist derselbe Aufruf in die Gegenrichtung. Die
        Umstellung ist append-only protokolliert (von->zu, JWT-Subject,
        Zeitpunkt). Es wird nichts trainiert und kein Gerät erreicht.
        Ablehnungen tragen einen deutschen {message}-Körper: 400 = unbekannte
        Art / unbekanntes Modell / Modell einer anderen Art; 409 = das Modell
        plant diese Anlage bereits, ODER es sammelt für sie noch Daten, ODER es
        hat für sie noch keine Tagesbewertung (die zwei Sperren, die die
        Oberfläche vor dem Klick nennt, werden hier ein zweites Mal geprüft).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, model]
              properties:
                kind: { type: string, enum: [load, pv] }
                model:
                  type: string
                  enum: [load-persistence, load-xgb, pv-physical, pv-residual-xgb]
      responses:
        "200":
          description: Der neue Schalter-Zustand (inkl. der neuen Journal-Zeile).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteForecastModels" }
        "400": { description: Unbekannte Prognoseart bzw. unpassendes Modell. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant (RLS). }
        "409": { description: Plant bereits, sammelt noch, oder ohne Tagesbewertung. }
  /api/v1/sites/{siteId}/assets:
    get:
      tags: [registry]
      summary: The site's asset master data incl. registry provenance.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Asset rows (battery params for the optimizer, PV params for the forecast).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteAsset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant (RLS). }
  /api/v1/sites/{siteId}/measurement-points:
    get:
      tags: [registry]
      summary: The site's additional read-only measurement points (multi-source Anlage).
      description: >
        A site with a battery-hybrid inverter PLUS a separate AC-coupled PV
        records the second PV here as an Erzeuger source; its kWp sums into the
        aggregate `asset.pv` the forecast reads. A dedicated grid meter at the
        point of common coupling is recorded as a Netz source (`grid-meter`, at
        most one per site, no nameplate); it does not touch `asset.pv`. A
        Verbraucher (`consumer`, e.g. a go-e wallbox) is recorded here too - no
        nameplate, no count limit (a site may have several). NO second device
        claim - sources are read through the site's one connected edge, which
        folds a Netz meter into the authoritative site grid. Read-only by
        construction (control is always false).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's measurement points.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MeasurementPoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant (RLS). }
    post:
      tags: [registry]
      summary: Record an additional read-only source (Erzeuger PV, a single Netz grid meter, or a Consumer).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  description: >
                    'pv-generation' (Erzeuger, default), 'grid-meter' (Netz, at
                    most one per site; carries no nameplate) or 'consumer'
                    (Verbraucher, e.g. a wallbox; no nameplate, no count limit).
                  enum: [pv-generation, grid-meter, consumer]
                label: { type: string, maxLength: 120 }
                brand: { type: string, maxLength: 60 }
                model: { type: string, maxLength: 60 }
                capacityKwp:
                  type: number
                  description: Per-Erzeuger nameplate (kWp); sums into the aggregate asset.pv. Ignored for a Netz meter.
                registryUnitId:
                  type: string
                  description: The source's OWN MaStR SEE number (optional - never blocks adding).
      responses:
        "200":
          description: The site's measurement points after the add.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MeasurementPoint" }
        "400": { description: An unknown role or invalid values. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant (RLS). }
        "409": { description: The site already has a Netz (grid-meter) source. }
  /api/v1/sites/{siteId}/measurement-points/{pointId}:
    delete:
      tags: [registry]
      summary: Remove an additional source; its kWp is subtracted from the aggregate site PV.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: pointId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's remaining measurement points.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MeasurementPoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Measurement point or site not found for this tenant (RLS). }
  /api/v1/sites/{siteId}/mastr-lookup:
    post:
      tags: [registry]
      summary: Fetch one MaStR unit for confirmation (nothing persisted).
      description: >
        Looks the SEE unit number up in the Marktstammdatenregister (official
        SOAP webservice when credentials are configured, keyless public JSON
        backend otherwise) and returns the mapped preview: kWp, module count,
        orientation/tilt decoded from catalog values to degrees (nullable -
        e.g. Balkonkraftwerke carry none), commissioning date, storage kWh/kW,
        and the registry's PLZ/Ort for the customer's own plausibility check.
        Storage units are ALSO SEE-numbered; `kind` states what the registry
        says the unit is. Error bodies carry a customer-facing German
        `message`.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [einheitNummer]
              properties:
                einheitNummer:
                  type: string
                  description: SEE + 12 digits; lowercase/spaces are normalized.
                  example: SEE966831669444
      responses:
        "200":
          description: Mapped preview for confirmation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MastrPreview" }
        "400": { description: Invalid unit number (German hint in `message`, e.g. the SES/SSE/EEG prefix mix-ups). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant, or no unit with this number in the registry. }
        "502": { description: Registry currently unreachable. }
  /api/v1/sites/{siteId}/mastr-apply:
    post:
      tags: [registry]
      summary: Persist the confirmed registry values onto the site's assets.
      description: >
        Creates or updates the site's `pv` and/or `battery` asset rows with the
        values the customer confirmed in the preview, plus provenance (registry
        id, unit number, fetch timestamp). Battery values land in the columns
        the optimizer reads; PV values feed the forecast's PlantSpec. At least
        one of `pv`/`storage` is required.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MastrApplyRequest" }
      responses:
        "200":
          description: The site's asset rows after the apply.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteAsset" }
        "400": { description: Neither pv nor storage present, or values out of range. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant (RLS). }
  /api/v1/sites/{siteId}/battery:
    put:
      tags: [registry]
      summary: Maintain the site's battery master data and its controlling device.
      description: >
        Create or update the site's `battery` asset from customer-entered values
        (capacity/charge/discharge power and optional round-trip efficiency) -
        the manual path for plants not in the Marktstammdatenregister. The
        battery is controlled by the inverter, which is the edge device, so the
        request also maintains the device link: pass `deviceId` to pick the
        controlling device explicitly (validated to belong to this site), or omit
        it to auto-link the site's single device (the self-maintaining rule). A
        multi-device site with no explicit choice is left unlinked and the portal
        warns that the plan cannot be executed. Manual values leave the registry
        provenance untouched (a MaStR-linked battery keeps its provenance).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capacityKwh, maxChargeKw, maxDischargeKw]
              properties:
                capacityKwh: { type: number, description: "Usable battery capacity (kWh), > 0." }
                maxChargeKw: { type: number, description: "Max charge power (kW), > 0." }
                maxDischargeKw: { type: number, description: "Max discharge power (kW), > 0." }
                roundtripEfficiencyPct:
                  type: number
                  nullable: true
                  description: Round-trip efficiency in percent (1-100); platform default 92 when omitted.
                deviceId:
                  type: string
                  format: uuid
                  nullable: true
                  description: The controlling device; omit to auto-link the site's single device.
                speicherschonung:
                  type: string
                  enum: [aggressiv, ausgewogen, schonend]
                  nullable: true
                  description: >
                    The customer's "Umgang mit dem Speicher" preset, mapped
                    server-side onto the battery's wear cost (aggressiv 1 ct /
                    ausgewogen 4 ct / schonend 8 ct per kWh cycled) - the
                    optimizer reads it on its next 15-min cycle. Omit to keep
                    the stored value. The raw ct value stays admin-only
                    (optimizer-config); a preset pick overwrites an
                    admin-configured custom value.
      responses:
        "200":
          description: The site's asset rows after the save.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteAsset" }
        "400": { description: Missing/invalid battery values. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant (RLS), or the chosen device is not at this site. }
  /api/v1/sites/{siteId}/simulation:
    post:
      tags: [simulation]
      summary: Start an Ersparnis-Simulation for this Anlage (async job).
      description: >
        Submits a simulation over the reference year (default: the last full
        calendar year). Every input defaults from the site's master data
        (tariff, plant kind, anzulegender Wert, coordinates, battery asset
        incl. Speicherschonung, PV asset) and every body field OVERRIDES its
        default - the what-if instrument. Requires backfilled day-ahead
        prices for the reference year (`voltpilot-market-data backfill`).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulationRequest" }
      responses:
        "202":
          description: Job accepted; poll the status route.
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulationId: { type: string }
        "400": { description: Invalid inputs (German message), incl. missing coordinates/battery or a not-backfilled price year. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
        "429": { description: Too many concurrent simulations (German message). }
        "502": { description: Simulation service unreachable. }
  /api/v1/sites/{siteId}/simulation/{simulationId}:
    get:
      tags: [simulation]
      summary: Poll a running/finished simulation of this Anlage.
      description: >
        Relays the simulation service's job document
        `{status: queued|running|done|failed, progress, result?, error?}`.
        `result` grows progressively (scenarios (a)/(b) after seconds, the
        VoltPilot months as their chunks solve); jobs expire after ~1 h. Only
        jobs STARTED through this site's route are visible here.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: simulationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The job document (see SimulationResult for `result`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or simulation not found (also after expiry/api restart - simply start a new run; the input cache makes it instant). }
  /api/v1/admin/simulation:
    post:
      tags: [simulation]
      summary: Start a prospect simulation (Vertrieb "Ersparnis-Rechner").
      description: >
        Platform-admin only. All inputs explicit (plant incl. coordinates,
        consumption, battery are required by the simulation service); nothing
        about the prospect is persisted (V1 stateless). The Speicherschonung
        preset maps onto the wear cost server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulationRequest" }
      responses:
        "202":
          description: Job accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulationId: { type: string }
        "400": { description: Invalid/missing inputs (German message). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Caller is not a platform admin. }
        "429": { description: Too many concurrent simulations. }
        "502": { description: Simulation service unreachable. }
  /api/v1/admin/simulation/{simulationId}:
    get:
      tags: [simulation]
      summary: Poll a prospect simulation.
      parameters:
        - { name: simulationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The job document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Caller is not a platform admin. }
        "404": { description: Simulation not found (expired, or not an admin job). }
  /api/v1/sites/{siteId}/kpis:
    get:
      tags: [kpis]
      summary: Economic KPIs (self-consumption, savings) for a site.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: KPIs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteKpis" }
  /api/v1/admin/tenants:
    get:
      tags: [admin]
      summary: List all tenants (platform-wide).
      responses:
        "200":
          description: Every tenant on the platform.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Create a tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTenantRequest" }
      responses:
        "201":
          description: Tenant created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/tenants/{tenantId}:
    put:
      tags: [admin]
      summary: Update a tenant's master data (name/segment/betriebsart).
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTenantRequest" }
      responses:
        "200":
          description: Updated tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { description: Invalid input (blank name or bad segment). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant not found. }
  /api/v1/admin/tenants/{tenantId}/delete:
    post:
      tags: [admin]
      summary: Offboard a tenant (type-to-confirm full cascade).
      description: >
        The most destructive platform action. The body must carry the tenant's
        EXACT name (`confirmName`); a mismatch is refused (400) before anything
        is touched. The database cascade - all series data, sites, devices,
        assets and the tenant row - runs in ONE transaction. The tenant's
        retained MQTT topics and Keycloak users are then cleaned best-effort;
        users whose deletion failed are reported by name in `failedUsers` so a
        partial directory failure is never silent.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteTenantRequest" }
      responses:
        "200":
          description: Tenant offboarded; the report of what was removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantOffboardingReport" }
        "400": { description: confirmName does not match the tenant's name. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant not found. }
        "502": { description: Keycloak unreachable - refused before deleting anything (the tenant's logins could not be enumerated). }
  /api/v1/admin/tenants/{tenantId}/sites:
    get:
      tags: [admin]
      summary: List the sites of a tenant (platform-admin, cross-tenant).
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The tenant's sites.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Site" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant not found. }
    post:
      tags: [admin]
      summary: Create a site for a tenant (platform-admin, cross-tenant).
      description: >
        Creates a site for the tenant named in the PATH, using the BYPASSRLS admin
        datasource. The tenant is validated to exist first. The tenant is never
        taken from client-controlled body data, so this is a deliberate,
        role-gated cross-tenant write - customer site access stays RLS-scoped.
        This route does not read `standortId` (UEMS AP-02 IP-9): the site is
        created without a Standort assignment, as before.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSiteRequest" }
      responses:
        "201":
          description: Site created for the tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400": { description: Invalid input (blank name, out-of-range coordinates, or bad zone). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant not found. }
  /api/v1/admin/tenants/{tenantId}/users:
    get:
      tags: [admin]
      summary: List the customer users (Portal-Users) of a tenant.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Users carrying this tenant's `tenant_id` in Keycloak.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant not found. }
    post:
      tags: [admin]
      summary: Provision a customer user into a tenant.
      description: >
        Creates a Keycloak user with the `tenant_id` attribute and the customer
        (`operator`) realm role, so the account is tenant-scoped by the existing
        OIDC + RLS spine. An optional password is set (temporary for an invite
        flow). A duplicate username/email yields 409.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Customer user created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant not found. }
        "409": { description: A user with that username or email already exists. }
  /api/v1/admin/control-certifications:
    get:
      tags: [admin]
      summary: The PLATFORM register of control-certified inverter models.
      description: >
        "Model X is bench-certified for battery control" - entered ONCE and then
        valid fleet-wide. It is the platform's MEMORY of a bench run: before it,
        a certification landed either in the fleet-wide env allowlist (keyed on
        the register FAMILY, so one proof leaked onto untested siblings) or in a
        First-Light grant on ONE box, so the same model had to be certified again
        for every new customer.
        The key is brand+MODEL on purpose: a family covers several product lines,
        a bench run covers exactly one.
        The register ALONE controls nothing - a plant additionally needs its
        explicit activation (see `/control-activations`).
      responses:
        "200":
          description: The register, newest certification first.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ControlCertification" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
    post:
      tags: [admin]
      summary: Certify an inverter model (a bench run ends here).
      description: >
        Adds a model to the register and republishes it to the whole fleet, so
        every already-activated plant with that model is granted without anyone
        touching it. An already-registered model is a CONFLICT, not a silent
        update - two statements about one product could drift apart.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertifyControlModelRequest" }
      responses:
        "201":
          description: Certified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlCertification" }
        "400": { description: Missing/invalid fields (German `message`). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
        "409": { description: This model is already in the register (German `message`). }
    delete:
      tags: [admin]
      summary: Take a model out of the register.
      parameters:
        - { name: brand, in: query, required: true, schema: { type: string } }
        - { name: model, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed; the fleet gets the smaller register. }
        "400": { description: This model is not in the register. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
  /api/v1/admin/control-activations:
    get:
      tags: [admin]
      summary: The plants whose battery control is armed.
      responses:
        "200":
          description: One row per armed device.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ControlActivation" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
  /api/v1/admin/devices/{deviceId}/control-activation:
    post:
      tags: [admin]
      summary: "\"Steuerung aktivieren\" - the ONE deliberate click per plant."
      description: >
        Arms this plant so a register-certified model may actually be written.
        It stays an explicit, safety-relevant decision (it is WRITE access to a
        customer's inverter) - the register only removes the need to REPROVE the
        model. Idempotent; publishes the retained certification document to the
        device immediately.
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { note: { type: string, maxLength: 512 } }
      responses:
        "200":
          description: Armed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlActivation" }
        "400": { description: Unknown device (German `message`). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
    delete:
      tags: [admin]
      summary: Disarm a plant - it falls back to read-only.
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Disarmed; the device is told immediately. }
        "400": { description: Unknown device, or it was not armed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
  /api/v1/admin/forecast-models:
    get:
      tags: [admin]
      summary: Die PLATTFORM-VORGABE des Prognosemodells (der Schalter-Zustand).
      description: >
        Der Zustand des plattformweiten Prognose-Schalters (Captain-Auftrag
        18.08.2026): je Prognoseart (load/pv) das VORGABE-Modell, WOHER sie
        kommt (portal = eine Zeile in forecast_model_choice, env = die
        Umgebungsvariable bzw. der Registry-Default), der Umgebungs-Vorgabewert,
        wer wann umgestellt hat und die wählbare Menge - plus die append-only
        Umstellungs-Historie (von->zu). Seit dem 19.08.2026 ist das die VORGABE
        für jede Anlage OHNE eigene Wahl, nicht die Antwort auf „was plant
        Anlage X" - dafür ist /api/v1/sites/{siteId}/forecast-models da.
        Platform-admin only.
      responses:
        "200":
          description: Der Schalter-Zustand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForecastModelChoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Nur für Portal-Admins. }
    post:
      tags: [admin]
      summary: Die Plattform-Vorgabe einer Prognoseart umstellen.
      description: >
        Stellt die VORGABE einer Prognoseart um - sie gilt für jede Anlage OHNE
        eigene Wahl (eine Anlage mit eigener Zeile bleibt unberührt). Ab dem
        nächsten Planungslauf konsumiert der Optimierer dort die Prognosereihen
        dieses Modells; das bisherige Modell rechnet unverändert im Schatten weiter
        und wird weiter täglich bewertet, der Rückweg ist derselbe Aufruf in
        die Gegenrichtung. Die Umstellung ist append-only protokolliert
        (von->zu, JWT-Subject, Zeitpunkt). Es wird nichts trainiert und kein
        Gerät erreicht. Ablehnungen tragen einen deutschen {message}-Körper:
        400 = unbekannte Art / unbekanntes Modell / Modell einer anderen Art,
        409 = dieses Modell plant bereits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, model]
              properties:
                kind: { type: string, enum: [load, pv] }
                model:
                  type: string
                  enum: [load-persistence, load-xgb, pv-physical, pv-residual-xgb]
      responses:
        "200":
          description: Der neue Schalter-Zustand (inkl. der neuen Journal-Zeile).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForecastModelChoice" }
        "400": { description: Unbekannte Prognoseart bzw. unpassendes Modell. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Nur für Portal-Admins. }
        "409": { description: Dieses Modell plant bereits. }
  /api/v1/admin/edge-releases:
    get:
      tags: [admin]
      summary: The edge release register (OTA Stufe 0).
      description: >
        Every registered edge release, NEWEST FIRST. `releaseSeq` is THE
        ordering - a monotonic integer, never a string or SHA comparison
        (decision D5). Without this register "outdated" was not well-defined:
        the fleet view compared a reported version against the fleet MAXIMUM
        (so "all equally old" read as "all current") and compared 12-char hex
        SHAs as number blocks, which is a random ordering on SHAs.
        Platform-admin only (the narrow `edge-release-publisher` role does NOT
        reach this route: the list carries every manifest and the author of
        every entry - more than registering needs). Read-only from the customer
        side, and there is NO write path towards any device here.
      responses:
        "200":
          description: The register, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EdgeRelease" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Register an edge release.
      description: >
        `version` must follow the release tag schema `edge-YYYY.MM.N`
        (edge-images already stamps `<tag>-<sha>`); a bare commit SHA is
        refused because it is exactly the uncomparable value the register
        replaces. `releaseSeq` may be omitted - it then continues the register
        (max + 1); passing it explicitly requires it to be strictly greater
        than every existing entry, so the ordering stays monotonic by
        construction. Registering an existing version with DEVIATING bytes is a
        409, never a silent no-op: the register is the paper trail. A repeat
        with BYTE-IDENTICAL `manifest`/`signature`/`notes` answers 200 with the
        stored entry instead - a re-run CI job behind a successful registration
        must not go red, and identical bytes swallow nothing.
        Reachable by `platform-admin` AND by the narrow `edge-release-publisher`
        service role used by the `edge-*` tag pipeline; that role reaches
        nothing else in the admin tree (no rollout, no wave, no device target).
        Since OTA Stufe 1 the body may additionally carry the SIGNED release
        (`manifest` + `signature`, byte for byte). The api stores those bytes
        unchanged and checks only CONSISTENCY - it deliberately does NOT verify
        the signature: the only verifier that matters is the DEVICE with its
        baked-in root, and a register that "blessed" a manifest would create
        confidence where nothing can be guaranteed. See docs/ota-signing.md.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEdgeReleaseRequest" }
      responses:
        "201":
          description: Release registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeRelease" }
        "200":
          description: >
            Already registered with BYTE-IDENTICAL manifest/signature/notes -
            the stored entry, unchanged (an idempotent CI re-run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeRelease" }
        "400": { description: Version does not match edge-YYYY.MM.N, or releaseSeq is not strictly increasing. }
        "409": { description: This version is already registered with DIFFERENT bytes. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/edge-releases/next-seq:
    get:
      tags: [admin]
      summary: The next free release sequence number.
      description: >
        The ONE thing the release publisher must read. `release_seq` lives
        INSIDE the signed manifest and the signature covers exactly its bytes,
        so the ordering has to be fixed BEFORE signing - the api cannot hand it
        out at registration time (the manifest would already carry a different
        number) and CI must not guess it.
        Deliberately a separate, narrow route rather than publisher access to
        the full register listing.
        HONEST LIMIT: between this read and the registration lies the signing
        step, so there is a TOCTOU window. If a second release registers in
        between, the POST fails LOUDLY on the monotonicity check and the run is
        repeated with the new number - reserving instead would punch holes into
        the ordering whenever a run aborts.
        Reachable by `platform-admin` and by `edge-release-publisher`.
      responses:
        "200":
          description: The next number, plus the current head of the register.
          content:
            application/json:
              schema:
                type: object
                required: [nextSeq]
                properties:
                  nextSeq: { type: integer, format: int64, example: 13 }
                  currentSeq:
                    type: integer
                    format: int64
                    nullable: true
                    description: Highest assigned number; null on an empty register.
                  currentVersion:
                    type: string
                    nullable: true
                    example: edge-2026.08.0
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/edge/trust-set/trust-set.json:
    get:
      tags: [registry]
      summary: The current root-signed trust-set (raw bytes), for a box being INSTALLED.
      security: []
      description: >
        One of the two files that go into `<data>/ota/` on the device; its
        sibling is `trust-set.json.sig` below. Serves the install-time TOFU
        moment - see docs/ota-signing.md §6.
        RAW BYTES, verbatim - deliberately NOT wrapped in a JSON envelope: in an
        envelope the document would be an ESCAPED JSON string, and the consumer
        is a shell installer that would then have to decode it by hand. That is
        exactly where silent byte drift creeps in and the signature stops
        verifying. So the routes are NAMED like the target files and the
        installer simply writes what it downloads (`curl -o`).
        THE TRUST BOUNDARY, and it is the whole reason this route may exist:
        a box being INSTALLED trusts its installation channel by definition
        (it just pulled its images over it), so serving the CURRENT
        root-signed trust-set over the same channel adds NO new trust - the
        box still verifies the ROOT signature itself against its BAKED-IN
        root, the channel only transports public material. LATER replacement
        stays OUT-OF-BAND: a RUNNING box never fetches a trust-set over the
        network (that would let the revocation anchor travel the channel it
        revokes), so there is no downlink and no device-side fetch; the core
        does not know this route. `update.sh` may DETECT a missing set and
        say how to fix it - it never downloads one.
        UNAUTHENTICATED on purpose: a box being installed has no token yet
        (the enrollment endpoints are open for the same reason), and what is
        handed out is public key material that is readable in git anyway
        (edge-app/ota/trust-set.json) - that readability is exactly what makes
        the trusted release keys auditable.
      responses:
        "200":
          description: The trust-set document, byte for byte.
          content:
            application/json:
              schema: { type: string, description: The verbatim bytes of trust-set.json. }
        "404":
          description: >
            No trust-set uploaded yet. The installer degrades with a loud
            warning plus the manual path and the install still SUCCEEDS - a box
            without a trust-set works fully, it just cannot (yet) apply a
            release.
  /api/v1/edge/trust-set/trust-set.json.sig:
    get:
      tags: [registry]
      summary: The detached root signature over the trust-set (raw bytes).
      security: []
      description: >
        The second of the two files - the cold root's signature over exactly
        the bytes served by `trust-set.json`. Same trust boundary, same raw-byte
        rule (see the sibling route). A set without its signature is worthless
        (the device refuses fail-closed), so an installer fetches both or
        neither.
      responses:
        "200":
          description: The detached signature, byte for byte.
          content:
            application/json:
              schema: { type: string, description: The verbatim bytes of trust-set.json.sig. }
        "404": { description: No trust-set uploaded yet. }
  /api/v1/admin/edge-trust-set:
    get:
      tags: [admin]
      summary: The current trust-set with its operator metadata.
      description: >
        What is in force, who uploaded it when, which RELEASE key ids it
        trusts and which ROOT key signed it. Platform-admin only (the narrow
        `edge-release-publisher` role may upload but not inspect - uploading
        needs none of this).
      responses:
        "200":
          description: The current trust-set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeTrustSet" }
        "404": { description: No trust-set uploaded yet. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin]
      summary: Set or replace the current root-signed trust-set.
      description: >
        Upload the two files from the ceremony (docs/ota-signing.md §3.4).
        A rotation is exactly this: a new, freshly root-signed set (§7.1).
        PUT because there is a SINGLETON - "the current set" is a resource,
        not a history; re-uploading identical bytes is therefore idempotent
        (a re-run automation job must not go red), and the HISTORY lives where
        it belongs, as a reviewable commit in edge-app/ota/.
        Reachable by `platform-admin` AND by the narrow `edge-release-publisher`
        service role (the trust-set comes out of the same ceremony as a release
        key, and the automation should be able to keep it current without an
        admin token in CI); that role still reaches no rollout and no device.
        The api stores the bytes UNCHANGED and checks only the FORM - it
        deliberately does NOT verify the root signature: the only verifier that
        matters is the DEVICE with its baked-in root. The form checks are: both
        documents parse, `alg` is ed25519 (never a fallback - the JWT alg
        hole), the signature's `domain` is `trust-set` (else a RELEASE
        signature would pass as a trust-set signature), and the SIGNING (root)
        key must NOT appear in the set itself - the invariant `vp-ota
        trust-set` already enforces, because a set containing the root could
        EXTEND the root. Note the key ids of the two files must DIFFER, unlike
        the release case where manifest and signature name the same key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveEdgeTrustSetRequest" }
      responses:
        "200":
          description: Trust-set stored; it is now what a fresh install receives.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeTrustSet" }
        "400": { description: The set or its signature is malformed (German message). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/edge-updates:
    get:
      tags: [admin]
      summary: Everything the platform page "Edge-Updates" shows (OTA Stufe 2).
      description: >
        ONE server-side aggregate (the /admin/fleet discipline): the release
        register, the most recent updates with their device rows, the fleet
        matrix (Anlage · Mandant · Ist · Soll · Zustand · seit · Grund) and the
        append-only audit journal.
        HONESTY RULES, enforced server-side: "unbekannt" is never "veraltet"
        (a device that reports nothing says nothing about its age), "offline" is
        never "fehlgeschlagen" (the assignment waits retained on the broker and
        is picked up on reconnect), every non-green state carries its reason,
        and the KPI percentages count only the REACHABLE set.
        `rollouts` carries the newest updates whatever their state (a LIST since
        several updates may run side by side); one that just finished must not
        vanish from the page in the very moment it completed. Platform-admin
        only; there is deliberately NO customer-facing surface for updates.
      responses:
        "200":
          description: Releases, the recent updates, the fleet matrix, the journal and the KPI.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/devices:
    get:
      tags: [admin]
      summary: The device INVENTORY over the whole lifecycle (platform page "Geräte").
      description: >
        The UNION of the sticker registry and the real fleet, joined on the
        external reference - one row per device, whichever half exists.
        It closes the finding that the page called "Geräte-Registry" did not
        contain the real fleet at all: its table listed only `VP-` sticker IDs,
        while the shipped boxes connect through self-generated `edge-`
        references and appeared there with ZERO rows.
        `deviceId == null` is a printed sticker ID that no customer has
        connected yet; `provisioned == false` is a connected device whose
        reference never came from the registry (the normal case for the
        installed base). A row that is not yet a device carries NO state -
        deriving one would be a claim about a device that does not exist.
        The state fields are the SAME derivation as the fleet row
        (RolloutStates), so the two surfaces can never disagree.
        Platform-admin only.
      responses:
        "200":
          description: One row per device - registry half, fleet half, or both.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/rollouts:
    post:
      tags: [admin]
      summary: Update a set of devices to ONE signed release - in one step.
      description: >
        The WHOLE flow (Captain order 2026-08-26): pick a release, pick the
        devices, done. There are no waves, no canary ring, no bake criterion and
        no second button - every chosen device gets its assignment in this call,
        verifies the signed manifest itself against its baked-in root, and
        applies it. Nobody has to touch the device.


        Only a SIGNED release can be distributed (409 otherwise): without
        manifest bytes a device has nothing to check, and the downlink would be
        an instruction without evidence. That is the ONLY precondition left -
        and it is a property of the RELEASE, not of the device.


        Several updates may run SIDE BY SIDE - the former "at most one live
        rollout" bar was a gate that blocked a legitimate second order. What
        stays unique is what matters: exactly one assignment per DEVICE.


        Assigning publishes the signed manifest RETAINED on
        `ems/{t}/{s}/{d}/v2/update` (contract mqtt-ota-target.schema.json), so a
        device that is offline right now picks it up on its next connect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [releaseSeq, devices]
              properties:
                releaseSeq: { type: integer, format: int64 }
                devices:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
      responses:
        "201": { description: Started; every chosen device has its assignment. }
        "400": { description: No devices, or an unknown device. }
        "404": { description: The release is not registered. }
        "409": { description: The release is not signed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/devices/{deviceId}/update-target:
    post:
      tags: [admin]
      summary: Assign ONE device a release.
      description: >
        The single-device path (the device page). Only a signed release is
        assignable (409 otherwise); the device does the rest by itself.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [releaseSeq]
              properties:
                releaseSeq: { type: integer, format: int64 }
      responses:
        "204": { description: Assigned; the signed manifest went out retained. }
        "404": { description: Device or release not found. }
        "409": { description: The release is not signed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/devices/{deviceId}/update-target/revert:
    post:
      tags: [admin]
      summary: Withdraw a device's assignment.
      description: >
        The row goes AND the retained message is cleared - otherwise an
        instruction nobody owns any more would wait on the broker for the
        device to return.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Withdrawn. }
        "404": { description: Device not found. }
        "409": { description: This device has no assignment. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/provisioned-devices:
    get:
      tags: [admin]
      summary: List the manufacturing registry of sticker Geräte-IDs.
      description: >
        Platform-wide view of every provisioned (manufactured) device ID and its
        claim state - which tenant, if any, has connected it.
      responses:
        "200":
          description: All provisioned devices.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProvisionedDevice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Register a manufactured sticker Geräte-ID.
      description: >
        Registers a device ID (canonicalized like the claim path - trimmed,
        uppercased) so a customer can claim it. Only sticker-format IDs
        (prefix `VP-`) are accepted. Idempotent - re-registering an existing ID
        returns 200 with the unchanged entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProvisionDeviceRequest" }
      responses:
        "200":
          description: Already registered - the existing, unchanged entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisionedDevice" }
        "201":
          description: Geräte-ID registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisionedDevice" }
        "400": { description: Blank or non-sticker-format (missing VP- prefix) Geräte-ID. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/provisioned-devices/{externalRef}:
    delete:
      tags: [admin]
      summary: Remove a wrongly registered sticker Geräte-ID from the registry.
      description: >
        Refused (409) while a customer's claim references the ID - the device
        must be unclaimed first. The path ref is canonicalized like the claim
        path (trimmed, uppercased).
      parameters:
        - { name: externalRef, in: path, required: true, schema: { type: string }, example: VP-1234-ABCD }
      responses:
        "204": { description: Registry entry removed; the ID can no longer be claimed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No such registry entry. }
        "409": { description: The ID is claimed by a customer; unclaim the device first. }
  /api/v1/admin/enrollments/pending:
    get:
      tags: [admin]
      summary: List enrolled-but-unclaimed devices.
      description: >
        Operator view onto devices that uploaded an enrollment CSR but have no
        matching claimed device row (the ref was never claimed - e.g. a customer
        typed a different reference - or was unclaimed after issuance). Surfaces
        the otherwise-invisible half of a mistyped-reference dead-end. Read-only;
        the device-facing enrollment poll stays opaque (pending == unknown).
      responses:
        "200":
          description: Pending (enrolled-but-unclaimed) enrollments, newest CSR first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PendingEnrollment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/fleet:
    get:
      tags: [admin]
      summary: The ONE fleet aggregate behind the platform overview (Flotten-Puls).
      description: >
        One row per site across ALL tenants, server-side: the overview core
        fields (device liveness from each device's newest telemetry ARRIVAL,
        5-min window; worstStatus stale > waiting > online), the age of the
        newest optimizer run, the control/curtailment evidence, the reported
        edge version, the reported source health, and the SERVER-derived
        maintenance flags (B4: tariff, battery without device, kWp plausibility,
        fleet-wide forecast outliers). It replaces the platform overview's
        client-side loop over tenants; the surface stays the same.
        Platform-admin only (a customer token gets 403), read-only, and the
        cross-tenant read is confined to the dedicated BYPASSRLS admin
        datasource exactly like the other /api/v1/admin/** reads - customer
        endpoints stay on the RLS path untouched.
        Honesty is part of the contract: a block nobody measured is null and
        carries its reason - never a fabricated zero, never a guessed verdict.
      responses:
        "200":
          description: One row per site, tenant then site name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFleet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/sites/{siteId}/v2-entities:
    get:
      tags: [admin]
      summary: List a site's v2 entity registry rows (E1a pilot).
      description: >
        Platform-admin, through the RLS-scoped path via the X-Tenant-Id
        switcher (no or wrong tenant selected => 404). Entities are
        measurement_point rows with a non-null entityType; capabilities and
        guards carry the docs/contracts/v2/edge-entity.schema.json objects
        verbatim.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's v2 entities.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/V2Entity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
  /api/v1/admin/sites/{siteId}/v2-entities/adopt:
    post:
      tags: [admin]
      summary: Adopt an edge-reported source into a v2 entity (U2 "Vom Gerät gemeldet").
      description: >
        U2 adoption bridge (report §3.3, admin-only first increment): the
        customer's :8484 device reports a source (go-e wallbox, AC-coupled PV, a
        grid meter) in its heartbeat local_setup; this creates the matching
        entity in ONE step, prefilled from the report + the type catalog, and
        PINS it to the reporting source (`sourceId`) so the "Vom Gerät gemeldet"
        matcher is deterministic and re-adoption is idempotent (a re-adopt
        returns the existing entity). A non-composed consumer type is created
        like a v2-native entity; a composed producer/grid-meter is recorded as a
        read-only source measurement point (its kWp / MaStR SEE # are the
        customer-only master data captured here - the ErzeugerSourcesPanel job,
        §3.4). Platform-admin, through the RLS-scoped X-Tenant-Id switcher.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId, entityType]
              properties:
                sourceId: { type: string, description: The edge source id from local_setup. }
                entityType: { type: string, example: wallbox }
                label: { type: string }
                maxPowerKw: { type: number, description: Consumer rated power (bounds commands). }
                capacityKwp: { type: number, description: Producer nameplate (kWp). }
                registryUnitId: { type: string, description: MaStR SEE number of the source. }
      responses:
        "200":
          description: The adopted (or already-existing) entity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2Entity" }
        "400": { description: Missing sourceId/entityType or unknown type. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
        "422": { description: The type cannot be adopted as a source (e.g. battery-hybrid). }
  /api/v1/admin/sites/{siteId}/v2-entities/preview:
    get:
      tags: [admin]
      summary: Dry-run the v1->v2 conversion (MIG migration step 1) - writes nothing.
      description: >
        The migration runbook review step: reports EXACTLY what
        /v2-entities/bootstrap would create/refresh from the site's current v1
        master data - the entities, their derived topology roles, capabilities
        and guards, and the resolved gateway device - WITHOUT touching any
        table. `action` is `create` for a row that would newly become a v2
        entity and `refresh` for one already stamped (re-run). Idempotent + safe
        to call repeatedly while reviewing.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The conversion plan (nothing written).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2ConversionPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
  /api/v1/admin/sites/{siteId}/v2-entities/history-cutover:
    get:
      tags: [admin]
      summary: The site's v1->v2 history bridge cutover instant (null = un-migrated).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The current cutover (cutoverAt null when un-migrated).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2HistoryCutover" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
    put:
      tags: [admin]
      summary: Set the history cutover (portal Historie splices v1 before / v2 after).
      description: >
        MIG runbook: called when the site goes live on v2 so the portal Historie
        switches its data source at this instant (v1 5-channel telemetry before,
        v2 per-entity reconstruction after). Body `at` optional - defaults to now.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { at: { type: string, format: date-time } }
      responses:
        "200":
          description: The applied cutover instant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2HistoryCutover" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
    delete:
      tags: [admin]
      summary: Clear the history cutover (MIG rollback - Historie reverts to pure v1).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
  /api/v1/admin/sites/{siteId}/v2-entities/bootstrap:
    post:
      tags: [admin]
      summary: Create/refresh the three pilot entities from the site's v1 master data.
      description: >
        The E1a pilot-mapping utility (used by the E13a cutover; nothing
        converts automatically): battery asset -> battery-hybrid entity (creates
        the site's control measurement_point row when absent), pv-generation
        points -> producer entities, the grid-meter point -> grid-meter entity.
        Idempotent - re-running refreshes capabilities/guard config from the
        current master data. Afterwards the registry is pushed BEST-EFFORT as
        one retained message on ems/{t}/{s}/{d}/v2/entities (the response's
        push block reports whether it went out).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Resulting entities + skipped notes + push outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2EntityBootstrapResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
  /api/v1/admin/sites/{siteId}/v2-entities/adopt-from-device:
    post:
      tags: [admin]
      summary: Bestands-Übernahme jetzt versuchen (Einheitsmodell Stufe 2).
      description: >
        Die Übernahme läuft ohnehin AUTOMATISCH (getakteter Abgleich); diese
        Route stößt sie ohne Wartezeit an und - vor allem - nennt den GRUND,
        wenn eine Anlage noch box-verwaltet ist ("meldet noch nicht, wie ihre
        Geräte angebunden sind", "steht noch nicht in unserem
        Geräte-Verzeichnis", …). Sie ist ALLES ODER NICHTS: ein unvollständig
        gemeldetes Ist übernimmt gar nichts.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Ausgang der Prüfung (übernommen oder der Grund dagegen).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentAdoptionOutcome" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
  /api/v1/admin/sites/{siteId}/v2-entities/revert-to-device:
    post:
      tags: [admin]
      summary: Der RÜCKWEG - die Anlage wieder am Gerät verwalten lassen.
      description: >
        Nimmt AUSSCHLIESSLICH die Autorität zurück (component_authority ->
        box). Die gespeicherten Definitionen bleiben stehen - sie sind der
        Beleg, was übernommen wurde, und der Weg zurück nach vorn. Der folgende
        Registry-Push trägt das Autoritäts-Feld dann nicht mehr, womit der
        Applier auf der Box strukturell nichts mehr anwendet und :8484 wieder
        bedient. Der Übernahme-Stempel wird gelöscht, damit der getaktete
        Abgleich die Anlage erneut betrachtet.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Ausgang.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentAdoptionOutcome" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
  /api/v1/admin/sites/{siteId}/v2-entities/push:
    post:
      tags: [admin]
      summary: Re-push the stored v2 entity registry to the gateway device.
      description: >
        Composes the current registry push payload and publishes it retained
        (best-effort; e.g. after a broker outage or a device re-claim).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Current entities + push outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2EntityBootstrapResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
    post:
      tags: [admin]
      summary: Create a v2-native entity of an open catalog type (E1b).
      description: >
        Create an entity of an open catalog type (wallbox / heating-rod /
        generic-load / ...; the type catalog at GET
        /api/v1/admin/entity-type-catalog is the truth). capabilities and
        guards default from the catalog (bounded by maxPowerKw); explicit
        JSON overrides are validated against the contract shapes. A COMPOSED
        pilot type (battery-hybrid/producer/grid-meter) is refused (422) -
        those are maintained through their v1 master data + the bootstrap.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveV2EntityRequest" }
      responses:
        "200": { description: The created entity., content: { application/json: { schema: { $ref: "#/components/schemas/V2Entity" } } } }
        "400": { description: Unknown type / invalid capabilities or guards. }
        "422": { description: A composed pilot type cannot be created directly. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
  /api/v1/admin/sites/{siteId}/v2-entities/{pointId}:
    put:
      tags: [admin]
      summary: Edit a v2 entity (label; config only for non-composed types).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: pointId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveV2EntityRequest" }
      responses:
        "200": { description: The updated entity., content: { application/json: { schema: { $ref: "#/components/schemas/V2Entity" } } } }
        "400": { description: Invalid capabilities or guards. }
        "422": { description: A composed pilot type's config is not editable here. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Entity/site not found (or no tenant selected). }
    delete:
      tags: [admin]
      summary: Remove a v2 entity (v1-backed rows only lose their entity config).
      description: >
        purgePoint=true additionally deletes the measurement point outright -
        its kWp is released from the aggregate asset.pv and its edge-source pin
        is freed. The duplicate-cleanup lever (vp-vier-erzeuger-p9): without it
        a wrongly adopted duplicate keeps its pinned point and reappears as
        "Neues Gerät gefunden" forever.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: pointId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: purgePoint, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Entity/site not found (or no tenant selected). }
  /api/v1/admin/entity-type-catalog:
    get:
      tags: [admin]
      summary: The data-driven entity-type catalog the admin entity editor uses.
      description: >
        The one truth for known entity types (entitytypes/catalog.json):
        category (steers edge guard semantics), controllable, composed, and
        the default capabilities/guards/failsafe seeded on create. Adding a
        type is catalog data + an optional edge driver, never a schema release.
      responses:
        "200": { description: The catalog document., content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/sites/{siteId}/entities:
    get:
      tags: [sites]
      summary: The site's v2 entities with Soll/Ist drift + the edge-local commissioning view.
      description: >
        The customer "Geräte & Entitäten" surface: the composed registry Soll
        (revision) reconciled against the edge-reported observed Ist (health,
        last telemetry, applied revision) - drift is SURFACED via syncStatus
        (in_sync | pending | missing_on_device | unreported | never_pushed),
        never silently resolved. localSetup is the edge-authoritative
        commissioning view (:8484 inverter/sources); staleOnDevice lists
        entities the edge still reports that the registry no longer contains.
        Tenant-scoped (foreign site 404); admins read via the X-Tenant-Id
        switcher, WRITES stay under /admin/.../v2-entities.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The site's entity surface., content: { application/json: { schema: { $ref: "#/components/schemas/SiteEntities" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found. }
  /api/v1/sites/{siteId}/entities/{entityId}/history:
    get:
      tags: [sites]
      summary: Per-entity channel history over the v2 telemetry rollups.
      description: >
        Channel-keyed bucket series of one entity: day = live 15-min buckets
        from raw telemetry_v2, week = hourly rollup, month/year = Europe/Berlin
        daily rollup (the v1 history discipline). RLS-scoped.
        For a COMPOSED entity (battery-hybrid / grid-meter / house-load) the
        part of the window BEFORE the v2 era is reconstructed read-side from the
        site's v1 telemetry through the same channel map the writer's
        ComposedEntityFanout writes forward with, spliced at
        max(site.v2_history_cutover_at, the entity's first v2 sample in the
        window) - v1 owns buckets starting before it, v2 those at/after it, so
        the series is gap-free and overlap-free across the migration. Nothing is
        copied. A v2-native entity (wallbox, generic Modbus) is pure v2.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: range, in: query, required: false, schema: { type: string, enum: [day, week, month, year], default: day } }
        - { name: at, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200": { description: The channel series., content: { application/json: { schema: { $ref: "#/components/schemas/EntityHistory" } } } }
        "400": { description: Bad range. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Entity/site not found. }
  /api/v1/soc-curve-templates:
    get:
      tags: [components]
      summary: The OCV curve templates of the SoC derivation (P5b/P5d).
      description: >
        Fills the `curve_charge`/`curve_discharge` fields of a `soc_derivation`
        in the battery assistant. It exists so the portal does NOT rebuild the
        support points: a curve in the frontend would be a twin of
        `soccurves/catalog.json` and free to drift from it - and a drifted curve
        is a wrong state of charge with decimal places.


        Authenticated, NOT plant-scoped - a curve is a statement about a CELL
        CHEMISTRY, not about a plant. Every template carries its `chemistry` and
        its cell window visibly, so the surface can NAME them: the same voltage
        means a completely different state of charge on a LiFePO4 cell than on
        an NMC one.


        The list grows only with MEASURED tables; an invented "LiFePO4 generic"
        would not be a template but a trap with a seal of approval.
      responses:
        "200":
          description: All templates in catalog order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocCurveTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/component-templates:
    get:
      tags: [templates]
      summary: The component templates the later add-component assistant renders from.
      description: >
        Einheitsmodell Stufe 0a. Newest version per template_ref, sorted by
        brand then model. ONLY the public origins (`builtin` + `certified`) are
        served - a `custom` template (private per Anlage, Stufe 3) has no tenant
        fence on this global table and is therefore never returned.
        Authenticated, not admin-gated (a template is the device choice the
        customer sees, not internals). An EMPTY list means the register is empty
        (the startup mirror did not run), never "there are no devices".
      responses:
        "200":
          description: The public templates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ComponentTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/component-templates/{templateRef}:
    get:
      tags: [templates]
      summary: One component template (newest version).
      description: >
        Unknown AND non-public answer identically with 404, so the route never
        reveals whether a key exists (the enrollment "pending == unknown"
        discipline).
      parameters:
        - name: templateRef
          in: path
          required: true
          description: >
            The stable, OPAQUE template key (built-in templates use
            `builtin:<brand>:<model>`). Never parse it - brand/model ride as
            their own fields.
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9._:-]{0,127}$" }
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Unknown or non-public template. }
  /api/v1/sites/{siteId}/components:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [components]
      summary: The plant's components, with the authority + Soll/Ist state.
      description: >
        Einheitsmodell Stufe 1. `componentAuthority` says WHO owns this plant's
        device configuration (`box` | `portal`) - the portal offers the add
        assistant ONLY on a portal-managed plant, because a Soll saved on a
        box-managed one would never take effect. `appliedRevision` is what the
        BOX reported it really applied; `null` means UNKNOWN (older edge, no
        heartbeat yet), never "did not arrive". A refusal rides NEXT TO the
        applied revision, never in its place - what runs is still the last
        configuration that really worked.
      responses:
        "200":
          description: The components.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site (or component) not found for this tenant. }
    post:
      tags: [components]
      summary: Add a component (assistant step 4).
      description: >
        Brand/model/family/communication come from the TEMPLATE, never from the
        body - a client cannot save an inconsistent connection. Requires a
        PASSED connection test for exactly this plant + template + connection
        (422 otherwise): since this stage the stored Soll IS the plant's read
        path, and a typo in the IP makes it blind.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveComponentRequest" }
      responses:
        "200":
          description: The plant's components after the write.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "400": { description: Unknown template or role. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site (or component) not found for this tenant. }
        "409":
          description: >
            Box-managed plant, or the plant already has this component
            (at most one grid meter / one inverter). German `message`.
        "422": { description: No passed connection test for this connection. }
  /api/v1/sites/{siteId}/components/{entityId}:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - name: entityId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [components]
      summary: Edit an existing component in place - a NEW version.
      description: >
        The entity id and previous versions stay intact. `expectedRevision`
        prevents lost updates. A connection test is required only when the
        template or effective connection changes, and then for exactly that new
        pair. Secrets are returned masked and absent/masked values retain the
        old server-side secret. Compatible role/family changes are versioned;
        a family change records an effective marker and never reinterprets old samples.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveComponentRequest" }
      responses:
        "200":
          description: The plant's components after the write.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site (or component) not found for this tenant. }
        "409": { description: Box-managed plant, incompatible topology, or stale expectedRevision. }
        "422": { description: No passed connection test for this connection. }
  /api/v1/sites/{siteId}/components/{entityId}/versions:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - name: entityId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [components]
      summary: The component's definition versions, newest first.
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ComponentDefinition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site (or component) not found for this tenant. }
  /api/v1/sites/{siteId}/components/{entityId}/events:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - name: entityId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [components]
      summary: Effective edit, family-change and rollback markers for a stable component id.
      responses:
        "200":
          description: Append-only change markers, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ComponentChangeEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site (or component) not found for this tenant. }
  /api/v1/sites/{siteId}/components/{entityId}/versions/{version}/rollback:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - name: entityId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [components]
      summary: Roll a component back to an earlier version.
      description: >
        WRITES a new version carrying the old content instead of deleting one -
        "what ran last week" stays answerable, and the way back is the same way
        as any other change. No connection test is required: this connection was
        stored before and passed its test then; demanding a new one would block
        the way out of a mistake exactly when the device is not answering.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The plant's components after the rollback.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Unknown component or version. }
        "409": { description: Box-managed plant. }
  /api/v1/sites/{siteId}/component-test:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [components]
      summary: Connection test - the box reads the not-yet-saved device once.
      description: >
        Runs the assistant's connection test over the Probe-Kanal
        (docs/contracts/mqtt-probe.schema.json, op `test_connection`) - the SAME
        machinery the device's own `:8484` button has always used, generalized
        to every transport. A SUCCESS also records the receipt that unlocks
        saving (for exactly this plant + template + connection); a failure
        records nothing. A timeout is an honest OUTCOME (HTTP 200 with
        `errorCode: timeout`), not an error. Nothing is persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateRef, connection]
              properties:
                templateRef: { type: string }
                templateVersion:
                  type: integer
                  minimum: 1
                  description: Exact template definition tested; omitted only by legacy clients.
                role: { type: string, enum: [inverter, pv-generation, grid-meter, consumer] }
                connection:
                  type: object
                  additionalProperties: true
                  description: The template's transport_schema fields, passed through.
                deviceId:
                  type: string
                  format: uuid
                  description: >
                    Optional - the box to ask. Absent means "the plant's single
                    device"; a plant with several must name one.
                entityId:
                  type: string
                  format: uuid
                  description: Optional edited component whose stored secrets are merged server-side for this exact test.
      responses:
        "200":
          description: The device's answer (honest outcome, including a timeout).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeResult" }
        "400": { description: Unknown template / malformed request. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site (or component) not found for this tenant. }
        "409": { description: The plant has no device, or several and none was named. }
        "503": { description: The plant is not reachable right now. }
  /api/v1/sites/{siteId}/component-match:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [components]
      summary: "Does this device already have a component? (the suggestion BEFORE the click)"
      description: >
        Answers ONE question: would saving this device TAKE OVER an existing,
        orphaned component - and what is it called? It runs the very same rule
        `POST /components` runs afterwards (`ComponentTakeover`), so the
        assistant can say "this is probably your existing 'Fronius Anlage WR1'"
        instead of silently minting a nameless parallel component (Alias
        continuity, live case Herzogau 20.08.2026). It changes NOTHING - no
        write, no receipt, no message to the box. NO match is 204, never an
        error: "a new component is created" is a perfectly normal outcome.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateRef, role, connection]
              properties:
                templateRef: { type: string }
                role: { type: string, enum: [inverter, pv-generation, grid-meter, consumer] }
                connection:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: The component that would be taken over.
          content:
            application/json:
              schema:
                type: object
                required: [entityId, role, orphaned]
                properties:
                  entityId: { type: string, format: uuid }
                  label:
                    type: string
                    nullable: true
                    description: >
                      The customer's own name, or null - then the row carries no
                      human-given name and the surface derives one from brand +
                      model instead of inventing one.
                  role: { type: string }
                  brand: { type: string, nullable: true }
                  model: { type: string, nullable: true }
                  orphaned:
                    type: boolean
                    description: >
                      true = it HAD a binding that broke; false = it was never
                      assigned to a device.
        "204": { description: No match - saving would create a new component. }
        "400": { description: Unknown template / role. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/components/custom/read:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [components]
      summary: "\u201eJetzt lesen\u201c - read ONE channel of a self-built Modbus device, once."
      description: >
        The Einheitsmodell Stufe 3 live preview: the box reads the register over
        the Probe-Kanal and answers with the RAW and the SCALED value side by
        side - the moment a scaling mistake becomes visible. It is also the
        connection test of step 1: a SUCCESS records the receipt that unlocks
        saving (keyed on the CONNECTION, not the channel, so a changed scale
        needs no new read while a changed address does). Nothing is persisted;
        a timeout is an honest OUTCOME (HTTP 200 with `errorCode`), not an
        error. LAN-only is enforced here AND independently on the box.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelfBuildReadRequest" }
      responses:
        "200":
          description: The reading, or an honest classified failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelfBuildReadResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
        "409": { description: The plant has no device, or several and none was named. }
  /api/v1/sites/{siteId}/components/custom:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [components]
      summary: Create a SELF-BUILT Modbus device (Einheitsmodell Stufe 3).
      description: >
        Creates a normal v2 entity (`modbus-generic`, measure-only) with the
        customer's plain-text channels, stores the definition as version 1 and
        compiles + rolls out its generated READ flow through the existing
        flowc / `v2/flows` machinery. Requires a receipt from a successful
        `components/custom/read` for this plant + connection (422 otherwise).
        Only on a PORTAL-managed plant (409 on a box-managed one). This stage
        creates measuring devices only - switching is a later stage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveSelfBuildRequest" }
      responses:
        "200":
          description: The plant's components, including the new one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "400": { description: Channel/poll-budget/LAN rule violated - the reason is German. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
        "409": { description: The plant's devices are managed on the box. }
        "422": { description: No connection test on record for this connection. }
        "503": { description: The read plan could not be built or distributed. }
  /api/v1/sites/{siteId}/components/custom/{entityId}:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [components]
      summary: Change a self-built device - a NEW version, the old stays retrievable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveSelfBuildRequest" }
      responses:
        "200":
          description: The plant's components.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "400": { description: Channel/poll-budget/LAN rule violated. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or component not found for this tenant. }
        "422": { description: Not a self-built component, or no connection test on record. }
    delete:
      tags: [components]
      summary: Remove a self-built device - together with its generated read flow.
      description: >
        Recorded measurements stay in the history - they WERE measured, and
        removing a device does not un-measure its past.
      responses:
        "200":
          description: The plant's remaining components.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or component not found for this tenant. }
        "422": { description: Not a self-built component. }
  /api/v1/sites/{siteId}/components/battery:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [components]
      summary: Connect a SELF-BUILT battery - over a local MQTT broker or its HTTP/JSON endpoint (P5 Ebene 1).
      description: >
        Creates a normal v2 entity (`user-defined-battery`, measure-only) whose
        capabilities are exactly the MAPPED standard channels, stores the
        definition as version 1 and compiles + rolls out its generated READ flow
        through the existing flowc / `v2/flows` machinery - the same path a
        self-built Modbus device takes, one transport further. Only on a
        PORTAL-managed plant (409 on a box-managed one).


        `transport` picks the level-1 READ TYPE, and it is the only thing that
        differs: `mqtt_local` compiles ONE `vp.mqtt.read` under origin
        `mqtt-device`, `http_local` ONE `vp.http.read` under origin
        `http-device`. Everything behind the mapping is identical - the same
        standard channels, the same aggregates, the same SoC derivation (P5b) and
        the same feeder binding (P6).


        Unlike the Modbus Baukasten this path requires NO connection receipt: the
        preview is an OFFER, not a duty - a box that cannot run it yet would turn
        the duty into a dead end, and a duty without a door is not a safeguard.
        The LAN-only rule applies unchanged to both transports.


        ⚠ Rollout order: a box that does not yet know the `mqtt_local` /
        `http_local` communication refuses the pushed driver and drops the WHOLE
        registry push. The edge release has to reach a plant BEFORE the first
        such battery is created there.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveUserDefinedBatteryRequest" }
      responses:
        "200":
          description: The plant's components, including the new battery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "400": { description: Mapping/topic/LAN rule violated - the reason is German. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
        "409": { description: The plant's devices are managed on the box, or it has no connected device. }
        "503": { description: The read plan could not be built or distributed. }
  /api/v1/sites/{siteId}/components/battery/preview:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - name: entityId
        in: query
        required: false
        schema: { type: string, format: uuid }
        description: >
          When EDITING, the component - only then can the server re-insert a
          stored auth secret, so the preview does exactly what a save would do.
          Without it the customer would have to retype the BMS key for every
          preview, or it would have to come back into the browser so he does not
          have to. Both are the wrong answer.
    post:
      tags: [components]
      summary: Preview a battery field mapping - the box reads once and reports what it got (P5d).
      description: >
        The mapping assistant's live preview: the SAME checked definition a save
        would write travels to the box as the `connection` block of a
        `test_connection` op. For `mqtt_local` it carries a short listening
        window (`listen_s`) - MQTT is not polled, it arrives; for `http_local`
        there is NO window, because the box fetches exactly once. The answer
        carries one `samples` row per mapping with the RAW and the scaled value
        side by side - the moment a wrong topic, a wrong value path or a wrong
        scale becomes visible.


        It writes NOTHING: no entity, no version, no flow, no connection
        receipt. And unlike `POST /component-test` it is deliberately NOT a
        precondition of saving - a box that cannot listen yet would turn the
        duty into a dead end, and a duty without a door is not a safeguard.


        Every outcome is therefore a 200 with a NAMED class: `not_supported` is
        a statement about the BOX ("cannot listen yet"), `timeout` one about the
        connection. Neither is a verdict about the mapping, and the surface says
        exactly that.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveUserDefinedBatteryRequest" }
      responses:
        "200":
          description: The box's answer - `samples` per mapping, or a named class.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeResult" }
        "400": { description: Mapping/topic/LAN rule violated - the reason is German. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant, or it has no connected device. }
        "503": { description: The plant is not reachable right now. }
  /api/v1/sites/{siteId}/components/battery/{entityId}:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [components]
      summary: Change a self-connected battery - a NEW version, the old stays retrievable.
      description: >
        The mapping list IS the capability list: a removed target channel also
        disappears as a measurement, or the battery would promise a value nobody
        reads any more.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveUserDefinedBatteryRequest" }
      responses:
        "200":
          description: The plant's components.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "400": { description: Mapping/topic/LAN rule violated. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or component not found for this tenant. }
        "422": { description: Not a self-connected battery. }
    delete:
      tags: [components]
      summary: Remove a self-connected battery - together with its generated read flow.
      description: >
        Recorded measurements stay in the history - they WERE measured, and
        removing a device does not un-measure its past.
      responses:
        "200":
          description: The plant's remaining components.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or component not found for this tenant. }
        "422": { description: Not a self-connected battery. }
  /api/v1/sites/{siteId}/components/custom/{entityId}/switch-test:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [components]
      summary: The guided switch test - writes ONCE, bounded by an on-device auto-off.
      description: >
        Einheitsmodell Stufe 4. The box ARMS its automatic off BEFORE it writes,
        so a lost answer can never leave the device on. This is not a release
        yet: it records the receipt the release then requires, keyed to THIS
        exact switch definition - a changed address is a different register and
        invalidates it. A timeout is an honest OUTCOME (200 with errorCode),
        never an error: the write may have landed and only its answer got lost.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchTestRequest" }
      responses:
        "200":
          description: The outcome of the test - passed, or a named refusal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwitchTestResult" }
        "400": { description: The switch definition is impossible (German reason). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or component not found for this tenant. }
        "422": { description: Test value outside the released clamp, or not a self-built device. }
  /api/v1/sites/{siteId}/components/custom/{entityId}/switch-test/cancel:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [components]
      summary: Abort the running test - writes the off/safe value IMMEDIATELY.
      description: >
        Restates the register in full instead of relying on a remembered state
        on the box, so an abort works even after a restart.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchTestRequest" }
      responses:
        "200":
          description: The outcome of the abort.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwitchTestResult" }
        "400": { description: The switch definition is impossible (German reason). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or component not found for this tenant. }
  /api/v1/sites/{siteId}/components/custom/{entityId}/switch-release:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [components]
      summary: Release switching - only with a PASSED test AND the confirmed effect.
      description: >
        The test proves the register is reachable; the confirmation proves the
        RIGHT device reacted - neither alone carries both statements. On
        success the component becomes a switchable device (type, capability,
        consumer clamp) and the switch is compiled into its device flow. The
        device release REPLACES the type certification, which is structurally
        impossible for arbitrary self-built devices; it never replaces the
        operator emergency stop.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchReleaseRequest" }
      responses:
        "200":
          description: The plant's components, with this one now switchable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "400": { description: Switch or consumer data invalid (German reason). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or component not found for this tenant. }
        "422": { description: No passed test on THIS definition, or the effect was not confirmed. }
    delete:
      tags: [components]
      summary: Revoke the release - the device is a sensor again, immediately.
      description: >
        The switch node leaves the flow, the capability leaves the component,
        and the rules pointing at it stop. The DEFINITION stays stored - a
        revoke is not evidence destruction - but the test receipt falls, because
        it belonged to a state that no longer exists.
      responses:
        "200":
          description: The plant's components, with this one measuring only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or component not found for this tenant. }
        "422": { description: Not a self-built component. }
  /api/v1/sites/{siteId}/components/custom/{entityId}/duplicate:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [components]
      summary: "\u201eDuplizieren\u201c - turn a device into a PRIVATE template of this plant."
      description: >
        Captain scope 4 - templates are per plant and private, no catalog, no
        sharing. The ADDRESS deliberately does not travel: a template describes
        a device TYPE, not a specimen.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 200 }
      responses:
        "200":
          description: The plant's private templates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteComponentTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or component not found for this tenant. }
  /api/v1/sites/{siteId}/component-templates:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [components]
      summary: The PRIVATE device templates of this plant.
      description: >
        Tenant-scoped by RLS (own table `site_component_template`) - a private
        template is customer data and never appears on the public
        `/api/v1/component-templates` route, which serves product statements
        (builtin/certified) only.
      responses:
        "200":
          description: The plant's private templates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteComponentTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/component-templates/{templateRef}:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: templateRef, in: path, required: true, schema: { type: string } }
    put:
      tags: [components]
      summary: Rename a private template (Einheitsmodell Stufe 6).
      description: >
        FULL representation of name and note. A blank name is refused (a
        nameless template cannot be told apart in the picker); an ABSENT note
        CLEARS it - the semantics of the component alias. No new version is
        created: a template IS its read plan, and a name changes nothing about
        it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteComponentTemplateRequest" }
      responses:
        "200":
          description: The plant's private templates after the rename.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteComponentTemplate" }
        "400": { description: Blank name. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or template not found for this tenant. }
    delete:
      tags: [components]
      summary: Remove a private template. Devices created from it stay.
      responses:
        "200":
          description: The plant's remaining private templates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteComponentTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or template not found for this tenant. }
  /api/v1/admin/component-templates:
    get:
      tags: [admin]
      summary: EVERY template version, incl. the withdrawn ones (Stufe 6).
      description: >
        Einheitsmodell Stufe 6, platform-admin only. Unlike the customer-facing
        `/api/v1/component-templates` (newest SELECTABLE version per key) this
        answers the operator question: which versions exist, who entered them,
        and how many components of the fleet stand on that key
        (`usedByComponents`). Read through the BYPASSRLS admin role - the
        register is global (no tenant_id, no RLS), the endpoint is the fence.
      responses:
        "200":
          description: All versions, sorted by brand/model, newest version first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminComponentTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a Portal-Admin. }
    post:
      tags: [admin]
      summary: Enter a NEW checked template (version 1) - as DATA, not a release.
      description: >
        The key is DERIVED from brand + model (`certified:<brand>:<model>`) and
        deliberately NOT a request field - it is opaque by contract. `channels`
        and `writes` are absent = "this template does not explain it here"; an
        EMPTY array is REFUSED instead of silently nulled (it would claim
        "delivers no measurements" / "cannot switch anything"). A template that
        carries a write definition must be `certified`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveComponentTemplateRequest" }
      responses:
        "201":
          description: The stored version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminComponentTemplate" }
        "400": { description: Rejected, with a German reason naming every fault. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a Portal-Admin. }
        "409": { description: The key already exists - add a version instead. }
  /api/v1/admin/component-templates/{templateRef}/versions:
    parameters:
      - { name: templateRef, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      summary: Add a new VERSION of an existing checked template.
      description: >
        A version is never overwritten - "what ran last week" must stay
        answerable. Brand and model belong to the key and cannot change (409).
        BUILT-IN templates are refused (409): they belong to the startup mirror
        of the Go catalog and a hand edit would be gone at the next restart.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveComponentTemplateRequest" }
      responses:
        "201":
          description: The new version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminComponentTemplate" }
        "400": { description: Rejected, with a German reason. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a Portal-Admin. }
        "404": { description: Unknown template. }
        "409": { description: Built-in, or brand/model changed. }
  /api/v1/admin/component-templates/{templateRef}/versions/{version}/withdraw:
    parameters:
      - { name: templateRef, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    post:
      tags: [admin]
      summary: Take a version out of the assistant's choice (NOT a delete).
      description: >
        Withdrawing NEVER breaks a component: the version snapshot on
        `measurement_point` carries no foreign key, so a running component keeps
        its version and history. Only the CHOICE changes - and because the
        filter sits INSIDE the version pick, withdrawing version 2 falls BACK to
        version 1. Reversible via `/restore`. There is deliberately no delete.
      responses:
        "200":
          description: The withdrawn version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminComponentTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a Portal-Admin. }
        "404": { description: Unknown version. }
        "409": { description: Built-in templates are not editable here. }
  /api/v1/admin/component-templates/{templateRef}/versions/{version}/restore:
    parameters:
      - { name: templateRef, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    post:
      tags: [admin]
      summary: Put a withdrawn version back into the choice.
      responses:
        "200":
          description: The restored version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminComponentTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a Portal-Admin. }
        "404": { description: Unknown version. }
        "409": { description: Built-in templates are not editable here. }
  /api/v1/admin/component-fleet:
    get:
      tags: [admin]
      summary: The component world of the WHOLE fleet, one row per plant (Stufe 6).
      description: >
        Einheitsmodell Stufe 6, platform-admin only, READ-ONLY - it creates no
        new write path. It answers the three operating questions that were only
        answerable per plant before: where devices are maintained
        (`componentAuthority`), where the components come from (`sources`), and
        where Soll differs from Ist (`syncStatus`, the SAME derivation the
        customer surface uses). Where the box reported nothing the field is
        ABSENT - "unknown", never 0 and never "not arrived".
      responses:
        "200":
          description: One row per plant across every tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminComponentFleet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a Portal-Admin. }
  /api/v1/flow-catalog:
    get:
      tags: [flows]
      summary: The node catalog for the CUSTOMER flow editor (E3b).
      description: >
        E3b customer flow release. The SAME catalog served to the admin editor
        (services/api flowcatalog/catalog.json), but on an authenticated,
        non-admin-gated route so a Portal-User's editor palettes/validates
        against it. Tenant-agnostic (the catalog carries no tenant data); the
        `gated` flag per node lets the customer editor render a market-/grid-near
        strategy node "locked" (needs VoltPilot enablement).
      responses:
        "200":
          description: The catalog document ({catalog_version, types[]}).
          content: { application/json: { schema: { type: object } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/sites/{siteId}/flow-node-governance:
    get:
      tags: [flows]
      summary: READ-ONLY gated-node enablement for the customer editor (E3b).
      description: >
        Which gated strategy node types are enabled for THIS site, so the
        customer editor can render a not-enabled gated node "locked" with the
        Beratung hint. Read-only for customers - enabling a gated node stays a
        Portal-Admin action (PUT /api/v1/admin/sites/{siteId}/flow-node-governance).
        Tenant-scoped like every /sites route (foreign site => 404).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The gated node types + per-site enablement.
          content: { application/json: { schema: { $ref: "#/components/schemas/FlowNodeGovernance" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found (foreign tenant). }
  /api/v1/sites/{siteId}/flows/{flowId}/layout:
    get:
      tags: [flows]
      summary: The editor canvas layout of a flow (Portal v3 M5).
      description: >
        The saved node positions of a flow. Deliberately its OWN resource: the
        flow-graph schema carries no positions and flowc assigns the compiled
        artifact's x/y itself INSIDE content_hash, so a dragged position must
        never reach the document (a drag would otherwise re-deploy the device).
        Keyed on the flow, so a forked draft inherits the arrangement. Empty
        positions = never arranged (the client renders the auto-layout).
        Mirror on /api/v1/admin/sites/{siteId}/flows/{flowId}/layout.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The saved positions.
          content: { application/json: { schema: { $ref: "#/components/schemas/FlowLayout" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or flow not found (foreign tenant). }
    put:
      tags: [flows]
      summary: Persist the editor canvas layout (Portal v3 M5).
      description: >
        Replace the flow's node positions. Unknown node ids are DROPPED
        server-side; nothing here reaches the flow document, so content_hash
        cannot move.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FlowLayout" } } }
      responses:
        "200":
          description: The stored positions (unknown ids dropped).
          content: { application/json: { schema: { $ref: "#/components/schemas/FlowLayout" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or flow not found (foreign tenant). }
  /api/v1/sites/{siteId}/flow-node-status:
    get:
      tags: [flows]
      summary: What the DEVICE reports about this site's flows (Portal v3 M5).
      description: >
        The device's own view of the flows it runs: the deployment acks (which
        version really runs - the "Läuft auf dem Gerät" badge) plus, only when
        the edge sends the feature-flagged block, the per-node live states. An
        empty nodes list means the device does not report node states, and the
        editor then shows channel values only - never a guessed one. Read-only.
        Mirror on /api/v1/admin/sites/{siteId}/flow-node-status.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The device-reported acks + node states.
          content: { application/json: { schema: { $ref: "#/components/schemas/FlowLiveStatus" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found (foreign tenant). }
  /api/v1/sites/{siteId}/flows:
    get:
      tags: [flows]
      summary: List a customer's own site flows (E3b).
      description: >
        A Portal-User reads the flows of THEIR OWN site (tenant from the JWT,
        RLS-scoped; a Portal-Admin reaches any site via the X-Tenant-Id switcher).
        One summary per flow with its version spine; documents follow
        docs/contracts/v2/flow-graph.schema.json. Mirrors the admin list, minus
        the platform-admin gate.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's flows.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FlowSummary" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found (foreign tenant). }
    post:
      tags: [flows]
      summary: Create a flow (version 1, draft) on one's own site.
      description: >
        The server stamps ALL identity (flow_id, flow_version, site_id,
        tenant_id) into the document; the client only supplies the name and an
        optional starting document.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveFlowRequest" }
      responses:
        "201":
          description: The created draft version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowVersion" }
        "400": { description: Missing/over-long name. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found (foreign tenant). }
  /api/v1/sites/{siteId}/flows/{flowId}:
    delete:
      tags: [flows]
      summary: Delete a whole flow (all versions; draft cleanup).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted. }
        "409": { description: A version is active - deactivate first. }
        "404": { description: Flow/site not found. }
  /api/v1/sites/{siteId}/flows/{flowId}/deactivate:
    post:
      tags: [flows]
      summary: Stop a running flow (retire its active version + re-publish).
      description: >
        Retires the flow's active version and re-publishes the site's (now
        smaller) COMPLETE deployment set so the edge drops the retired flow.
        Never gated by the activation flag - stopping a flow is always allowed.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Deactivation outcome ({deactivated, published, lifecycle}).
          content: { application/json: { schema: { type: object } } }
        "409": { description: The flow has no active version. }
        "404": { description: Flow/site not found. }
  /api/v1/sites/{siteId}/flows/{flowId}/versions/{version}:
    get:
      tags: [flows]
      summary: One flow version (document + lifecycle + recorded dry-run).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The flow version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowVersion" }
        "404": { description: Flow/version/site not found. }
    put:
      tags: [flows]
      summary: Save a flow version (a simulated/active version yields a new draft).
      description: >
        A draft is updated in place; editing a simulated/active version creates a
        NEW draft version (flow-graph contract paragraph 5) - the response carries
        the resulting version.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveFlowRequest" }
      responses:
        "200":
          description: The saved (possibly new) version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowVersion" }
        "409": { description: The version is retired (read-only). }
        "404": { description: Flow/version/site not found. }
  /api/v1/sites/{siteId}/flows/{flowId}/versions/{version}/validate:
    post:
      tags: [flows]
      summary: Validate a flow version (V-1..V-8).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
