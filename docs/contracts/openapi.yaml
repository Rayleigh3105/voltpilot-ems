        rueckwirkung:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/OrtRueckwirkung" }]
    OrtZuordnung:
      type: object
      properties:
        elternId: { type: string, format: uuid }
        elternArt: { type: string, enum: [standort, gebaeude] }
        elternName: { type: string }
        gueltigAb: { type: string, format: date }
        gueltigBis: { type: string, format: date, nullable: true }
        zustand: { type: string, enum: [gueltig, geplant, beendet] }
    OrtFlaechenStand:
      type: object
      properties:
        m2: { type: integer, example: 3100 }
        gueltigAb: { type: string, format: date, example: "2026-10-01" }
        gueltigBis: { type: string, format: date, nullable: true, example: "2026-12-31" }
        zustand: { type: string, enum: [gueltig, geplant, beendet] }
    OrtRueckwirkung:
      type: object
      description: E2 - erlaubt, aber sichtbar; der Eintragstag in der Zeitzone des Standorts.
      properties:
        art: { type: string, enum: [rueckwirkend, ab_heute, geplant] }
        tage: { type: integer, description: Abstand zwischen "gilt ab" und Eintragstag. }
