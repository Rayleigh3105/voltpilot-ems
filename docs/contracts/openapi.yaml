        gueltigBis: { type: string, format: date, nullable: true, description: Einschließlich; null = offen. }
        flaecheM2: { type: integer, nullable: true, description: Die eigene Fläche am Stichtag - null, nie 0. }
        flaecheQuelle: { type: string, nullable: true, enum: [eigen] }
        messstellenZahl:
          type: integer
