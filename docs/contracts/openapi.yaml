        ort: { type: string, nullable: true }
        land: { type: string, nullable: true, enum: [DE, AT, CH] }
    StandortAnlage:
      type: object
      description: Eine Anlage am Standort mit dem am Stichtag gültigen Intervall (`gueltigBis` einschließlich).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        gueltigAb: { type: string, format: date }
        gueltigBis: { type: string, format: date, nullable: true }
    NochNichtZugeordnet:
      type: object
      properties:
        anlagenZahl: { type: integer }
        anlagen:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
    StandortBezug:
      type: object
      description: >
        Der Standort, dem eine Anlage heute zugeordnet ist (UEMS AP-02 IP-3);
        `gueltigAb` ist der Beginn der laufenden Zuordnung.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kurzzeichen: { type: string }
        gueltigAb: { type: string, format: date }
    SiteDetail:
      description: GET /api/v1/sites/{siteId} - the Site fields unchanged, plus `standort`.
      allOf:
        - { $ref: "#/components/schemas/Site" }
        - type: object
          properties:
            standort:
              nullable: true
              allOf: [{ $ref: "#/components/schemas/StandortBezug" }]
    CreateTenantRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        segment: { type: string, enum: [CI, B2C], description: "Defaults to 'CI'." }
    AdminUser:
      type: object
      properties:
        id: { type: string, description: Keycloak user id. }
        username: { type: string }
        email: { type: string, nullable: true }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        enabled: { type: boolean }
        tenantId: { type: string, format: uuid, nullable: true, description: From the user's tenant_id attribute. }
    CreateUserRequest:
      type: object
      required: [username]
      properties:
        username: { type: string }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        password: { type: string, description: Optional initial password. }
        temporaryPassword: { type: boolean, description: "If true, the user must change it at first login. Default false." }
    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8, maxLength: 128, description: The new password (same length rule as self-registration). }
        temporary: { type: boolean, description: "If true (default), the user must change it at next login." }
    UpdateTenantRequest:
      type: object
      required: [name]
      description: Same validation as CreateTenantRequest.
      properties:
        name: { type: string }
        segment: { type: string, enum: [CI, B2C], description: "Defaults to 'CI'." }
        betriebsart:
          type: string
          enum: [endkunde, betreiber]
          nullable: true
          description: >
            Full-representation U0 shell-frame override: 'endkunde'/'betreiber'
            set it, null (or omitted) clears it back to the automatic
            segment-derived default.
    DeleteTenantRequest:
      type: object
      required: [confirmName]
      properties:
        confirmName:
          type: string
          description: Must equal the tenant's exact name (type-to-confirm fat-finger protection).
    TenantOffboardingReport:
      type: object
      description: >
        What the offboarding removed. The database part is transactional
        (all-or-nothing); `failedUsers` lists Keycloak logins that could not be
        deleted and need manual cleanup.
      properties:
        tenantId: { type: string, format: uuid }
        tenantName: { type: string }
        deletedSites: { type: integer }
        deletedDevices: { type: integer }
        deletedTelemetryRows: { type: integer, format: int64 }
        deletedUsers:
          type: array
          items: { type: string }
        failedUsers:
          type: array
          items: { type: string }
    UpdateUserRequest:
      type: object
      description: Email/name only; the username is immutable.
      properties:
        email: { type: string, format: email, nullable: true }
        firstName: { type: string, nullable: true, maxLength: 120 }
        lastName: { type: string, nullable: true, maxLength: 120 }
    OptimizerDiagnostics:
      type: object
      description: >
        One persisted optimizer run with the per-slot euro decomposition (see
        the endpoint description). Run-level fields carry the "inputs at a
        glance" master data; `storedEnergyValueIsApproximation` is false when
        every rendered slot carries the optimizer-persisted EXACT
        stored-energy value (the run's SoC shadow price,
        schedule.stored_value_ct_kwh - Fahrplan-Warum), and true when any slot
        fell back to the forward best-use heuristic (pre-feature runs, explain
        layer off - the UI must label it then).
      properties:
        siteId: { type: string, format: uuid }
        planId: { type: string, format: uuid, nullable: true }
        generatedAt: { type: string, format: date-time, nullable: true, description: Null when the site has no plan yet. }
        slotMinutes: { type: integer, example: 15 }
        availableRuns:
          type: array
          items: { type: string, format: date-time }
          description: >
            The run timestamps (newest first) of ONE Europe/Berlin day - the
            `date` query param's day, else the shown run's day.
        availableRunsDate:
          type: string
          format: date
          nullable: true
          description: The Berlin day `availableRuns` covers; null without any plan.
        firstRunDate:
          type: string
          format: date
          nullable: true
          description: Berlin day of the site's OLDEST persisted run - lower bound for the date picker.
        lastRunDate:
          type: string
          format: date
          nullable: true
          description: Berlin day of the site's NEWEST persisted run - upper bound for the date picker.
        plantKind: { type: string, enum: [direktvermarktung, eigenverbrauch] }
        netzladenErlaubt: { type: boolean }
        tarifArt: { type: string, enum: [dynamisch, fest, ohne] }
        tarifParamCtKwh: { type: number, nullable: true }
        anzulegenderWertCtKwh: { type: number, nullable: true }
        backupReserveSocPct: { type: number, nullable: true }
        battery:
          type: object
          nullable: true
          description: Null for sites without a battery asset.
          properties:
            capacityKwh: { type: number, nullable: true }
            roundtripEfficiencyPct: { type: number, nullable: true }
            wearCostCtPerKwh: { type: number, description: The EFFECTIVE per-cycle wear rate. }
            wearCostSource: { type: string, enum: [asset, platform-default] }
            socMinPct: { type: number, description: Effective usable-band floor (override or 5). }
            socMaxPct: { type: number, description: Effective usable-band ceiling (override or 95). }
        activeLoadModel: { type: string }
        activePvModel: { type: string }
        storedEnergyValueIsApproximation: { type: boolean, example: false }
        pvAnchorRatio:
          type: number
          nullable: true
          example: 2.4
          description: >
            The PV nowcast anchor this RUN corrected its near-horizon PV
            forecast by - measured over predicted on the last completed slots
            (schedule.pv_anchor_ratio, Morgenprognose). Above 1 the active
            model was too low (the east-heavy-morning case), below 1 too high;
            the factor decays back to the untouched forecast over the following
            couple of hours, so the number describes the FIRST slot. Null =
            no anchor was established (too little evidence, the optimizer's
            OPTIMIZER_PV_ANCHOR_ENABLED kill switch off, or a run predating the
            column) - render nothing then, never "1,0", which is itself a real
            established statement ("belegt, und das Modell lag richtig").
        nightReserveKwh:
          type: number
          nullable: true
          example: 4.92
          description: >
            Nacht-Wertfunktion P3 (schedule.why_night_reserve_kwh): how much
            charge this RUN holds at SUNRISE, above the reserve floor, because
            the site's OWN night-error distribution makes a heavier night
            plausible. Priced against the night's price spread, so it is never a
            fixed reserve and moves with every run. Null = nothing was held back
            (too little night history, no price spread, no sunrise in the
            horizon, the OPTIMIZER_NIGHT_RESERVE_ENABLED kill switch off, or a
            run predating the column).
        nightReserveQ:
          type: number
          nullable: true
          example: 0.75
          description: >
            That amount's quantile - 0.75 means it is needed in 1 of 4 nights.
            Null exactly when nightReserveKwh is null.
        slots:
          type: array
          items: { $ref: "#/components/schemas/OptimizerDiagnosticsSlot" }
    OptimizerDiagnosticsSlot:
      type: object
      description: >
        One 15-min plan slot: the persisted schedule columns plus the computed
        ct/kWh decomposition. Every computed field is null when honestly not
        computable for this slot (no persisted spot price, pre-P2 row without
        wear, battery-less site) - never a fabricated 0.
      properties:
        time: { type: string, format: date-time }
        batteryKw: { type: number, nullable: true, description: +charge / -discharge. }
        gridKw: { type: number, nullable: true, description: +import / -export. }
        socPct: { type: number, nullable: true }
        loadKw: { type: number, nullable: true }
        pvKw: { type: number, nullable: true }
        curtailKw: { type: number, nullable: true }
        costEur: { type: number, nullable: true }
        baselineCostEur: { type: number, nullable: true }
        wearCostEur: { type: number, nullable: true, description: The persisted P2 wear this slot spends. }
        solverPriceCtKwh: { type: number, nullable: true, description: The bare day-ahead spot price (schedule.price_eur_mwh / 10). }
        importPriceCtKwh: { type: number, nullable: true, description: Real cost of an imported kWh per the site's tariff. }
        exportValueCtKwh: { type: number, nullable: true, description: Real value of an exported kWh per the plant's remuneration. }
        wearCostCtKwh: { type: number, nullable: true, description: Derived wear rate per kWh of throughput (null for idle slots). }
        valueOfStoredEnergyCtKwh: { type: number, nullable: true, description: "The value of a stored kWh: the persisted EXACT SoC shadow price (Fahrplan-Warum) where the run carries it, else the forward best-use approximation (the run-level flag marks which)." }
        decisionLabel: { type: string, enum: [solarladen, netzladen, entladen, ruhe] }
        whyText: { type: string, description: One composed German sentence explaining the decision. }
        slotRole:
          type: string
          nullable: true
          description: >-
            Optimizer-persisted Fahrplan-Warum role (schedule.slot_role;
            vocabulary: warten | pv_speichern | guenstig_laden |
            eigenverbrauch | verkaufen | spitze_kappen | reserve_halten |
            abregeln, additively extensible). Null on pre-feature runs -
            decisionLabel stays the fallback.
        slotFlags:
          type: array
          nullable: true
          items: { type: string }
          description: >-
            Binding-constraint codes of the slot (schedule.slot_flags CSV,
            split): soc_max, soc_floor, reserve_backup, reserve_peak,
            charge_cap, discharge_cap, solar_only, grid_limit_14a,
            feed_in_cap, peak_defining, curtailing. Null = no binding
            recorded / pre-feature run.
        limitDischargeToLoad:
          type: boolean
          nullable: true
          description: >-
            Netz-null-Reduzieren (2026-09-08): whether this slot's SHAPE grants
            the REDUCE-only right limit_discharge_to_load - a real planned
            DISCHARGE (batteryKw < -0.05) into a planned grid exchange of ~ 0
            (|gridKw| <= 0.05). The box may then LIMIT the commanded discharge
            to the measured deficit max(load - pv, 0), never raise it, floor at
            0 kW. DERIVED from this row's own batteryKw/gridKw, because the flag
            is deliberately not persisted and - unlike its three siblings - needs
            neither lambda nor a price. It therefore says "this slot qualified",
            NOT "the box received the flag": a run published with the
            OPTIMIZER_LIMIT_DISCHARGE_ENABLED switch off, or by an optimizer
            older than the field, has the same shape and reads the same. Null =
            the row carries no battery or grid power, so nothing is claimed.
    OptimizerConfig:
      type: object
      description: The optimizer knobs of one site (see the endpoint description).
      properties:
        siteId: { type: string, format: uuid }
        hasBattery: { type: boolean }
        defaults:
          type: object
          description: Platform-wide tunables (the optimizer's OPTIMIZER_* env; read-only).
          properties:
            wearCostCtPerKwh: { type: number, example: 4.0 }
            socMinPct: { type: number, example: 5 }
            socMaxPct: { type: number, example: 95 }
            terminalValueQuantile: { type: number, example: 0.3 }
            terminalValueCtPerKwh: { type: number, nullable: true, description: Null = derived per plan. }
        overrides:
          type: object
          description: The nullable per-site/per-asset columns (null = default applies).
          properties:
            wearCostCtPerKwh: { type: number, nullable: true }
            socMinPct: { type: number, nullable: true }
            socMaxPct: { type: number, nullable: true }
            backupReserveSocPct: { type: number, nullable: true }
        effective:
          type: object
          description: >
            What the optimizer resolves (override ?? default). Battery fields
            are null for battery-less sites; a null backupReserveSocPct means
            "no reserve" (the technical floor applies unchanged).
          properties:
            wearCostCtPerKwh: { type: number, nullable: true }
            socMinPct: { type: number, nullable: true }
            socMaxPct: { type: number, nullable: true }
            backupReserveSocPct: { type: number, nullable: true }
        peakShaving:
          type: object
          description: >
            The peak-shaving module (PS-1/PS-2, Lastspitzenkappung) - the ONE
            writable surface for it (captain decision: vertragsnahe Module
            richtet VoltPilot ein, nicht der Kunde). A non-null
            leistungspreisEurKw IS the module-active flag; the optimizer then
            prices the billing period's 15-min import peak economically
            (epigraph + peak_so_far anchor) and publishes the planned peak
            target to the edge. Echoed read-only on the customer Site.
          properties:
            leistungspreisEurKw:
              type: number
              nullable: true
              minimum: 0
              description: EUR per kW per billing period; null = module off.
            abrechnungLeistung:
              type: string
              enum: [jahr, monat]
              description: Billing period of the Leistungspreis (Europe/Berlin calendar).
            peakReserveSocPct:
              type: number
              nullable: true
              minimum: 0
              maximum: 100
              description: >
                Hard SoC floor reserved for out-of-horizon peaks; stacks with
                the backup reserve (highest absolute floor binds). null = none.
        site:
          type: object
          description: Read-only echo of the levers editable via PUT /api/v1/sites/{siteId}.
          properties:
            netzladenErlaubt: { type: boolean }
            plantKind: { type: string }
            tarifArt: { type: string }
            tarifParamCtKwh: { type: number, nullable: true }
            anzulegenderWertCtKwh: { type: number, nullable: true }
    UpdateOptimizerConfigRequest:
      type: object
      description: >
        Full-representation override write: a null/absent field clears that
        override back to the platform default. wearCostCtPerKwh/socMinPct/
        socMaxPct live on the battery asset (409 without one);
        backupReserveSocPct and the peak-shaving module fields on the site.
        A null/absent abrechnungLeistung resets to 'jahr' (the column default).
      properties:
        wearCostCtPerKwh: { type: number, nullable: true, minimum: 0 }
        socMinPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        socMaxPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        backupReserveSocPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        leistungspreisEurKw:
          type: number
          nullable: true
          minimum: 0
          description: PS-1 Leistungspreis (EUR/kW per billing period); null switches the module off.
        abrechnungLeistung:
          type: string
          nullable: true
          enum: [jahr, monat]
          description: Billing period; null resets to 'jahr'.
        peakReserveSocPct:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: PS-2 peak-shaving SoC reserve; null clears it.

    WhatIfRequest:
      type: object
      description: >
        The admin what-if knobs (§2.8/§4.3). Every field is OPTIONAL and absent
        means "leave this as the site has it" - never zero, which is what makes
        an empty body the meaningful "solve it as configured" baseline.
        `backupReserveSocPct: 0` IS "no reserve". Prices, forecasts, tariff,
        §14a and the feed-in cap are deliberately NOT overridable: they come
        from the real site, so a preview can never become a fantasy plant.
      properties:
        wearCostCtPerKwh: { type: number, nullable: true, minimum: 0, maximum: 100 }
        backupReserveSocPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        socMinPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        socMaxPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        netzladenErlaubt:
          type: boolean
          nullable: true
          description: Grid-charging posture to preview (EEG vs. merchant).
        horizonSlots:
          type: integer
          nullable: true
          minimum: 4
          maximum: 192
          description: Planning horizon in 15-min slots; absent = 96 (24 h).

    WhatIfResult:
      type: object
      description: >
        Two plans solved over ONE freshly gathered set of inputs, plus their
        delta. Nothing here was persisted or published.
      properties:
        siteId: { type: string, format: uuid }
        computedAt: { type: string, format: date-time }
        horizonSlots: { type: integer }
        slotMinutes: { type: integer, example: 15 }
        appliedOverrides:
          type: object
          description: Echo of the knobs that actually differed (untouched ones are absent).
          additionalProperties: true
        baseline: { $ref: "#/components/schemas/WhatIfPlan" }
        variant: { $ref: "#/components/schemas/WhatIfPlan" }
        delta:
          type: object
          description: >
            variant minus baseline per headline figure. A figure that is null
            on either side stays null - never read as a zero difference.
          additionalProperties: { type: number, nullable: true }

    WhatIfPlan:
      type: object
      description: >
        One ephemeral solve. Money follows the persisted schedule's discipline:
        savingsEur is GROSS of wear, wearCostEur is separate, netSavingsEur is
        the honest difference, and bankedValueEur prices what the plan carries
        into the next day at its own terminal value.
      properties:
        slotMinutes: { type: integer }
        costEur: { type: number, nullable: true }
        baselineCostEur: { type: number, nullable: true }
        savingsEur: { type: number, nullable: true }
        wearCostEur: { type: number, nullable: true }
        netSavingsEur: { type: number, nullable: true }
        terminalValueEurPerKwh: { type: number, nullable: true }
        bankedValueEur: { type: number, nullable: true }
        chargedKwh: { type: number, nullable: true }
        dischargedKwh: { type: number, nullable: true }
        gridImportKwh: { type: number, nullable: true }
        gridExportKwh: { type: number, nullable: true }
        curtailedKwh: { type: number, nullable: true }
        cycles: { type: number, nullable: true, description: Throughput / (2 x capacity). }
        socStartPct: { type: number, nullable: true }
        socEndPct: { type: number, nullable: true }
        peakTargetKw: { type: number, nullable: true }
        fallback14a:
          type: boolean
          description: True when the §14a cap had to be dropped as infeasible (advisory plan).
        knobs:
          type: object
          description: The knob values this solve actually used.
          properties:
            wearCostCtPerKwh: { type: number }
            backupReserveSocPct: { type: number, nullable: true }
            socMinPct: { type: number }
            socMaxPct: { type: number }
            netzladenErlaubt: { type: boolean }
        slots:
          type: array
          items:
            type: object
            properties:
              time: { type: string, format: date-time }
              batteryKw: { type: number, nullable: true, description: "+ charge / - discharge" }
              gridKw: { type: number, nullable: true, description: "+ import / - export" }
              socPct: { type: number, nullable: true }
              pvKw: { type: number, nullable: true }
              loadKw: { type: number, nullable: true }
              curtailKw: { type: number, nullable: true }
              priceEurMwh: { type: number, nullable: true }
              costEur: { type: number, nullable: true }
              baselineCostEur: { type: number, nullable: true }
              wearCostEur: { type: number, nullable: true }
              slotRole: { type: string, nullable: true }
    MeasurementSelectionState:
      type: object
      description: >
        Der gewünschte Pollplan eines Geräts (oder einer seiner Komponenten)
        samt seiner append-only Papier-Spur. Nichts hier behauptet eine
        Anwendung: `applyStatus` wird erst durch die Quittung der Box wahr.
      properties:
        deviceId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        entityId:
          type: string
          format: uuid
          nullable: true
          description: >
            Die Komponente, auf die diese Sicht zugeschnitten ist. null = das
            ganze Gerät (die Semantik vor Geräteseite Stufe 3b).
        desiredRevision:
          type: integer
          format: int64
          description: >
            Monotone Revision des einen veröffentlichten Plan-Dokuments. Sie ist
            GERÄTEWEIT, auch in einer Komponenten-Sicht, und ist das
            `expectedRevision` der nächsten Änderung.
        catalogVersion: { type: string }
        status:
          type: string
          enum: [no_selection, pending_edge, rejected, first_sample, applied]
        statusReason: { type: string, nullable: true }
        activationNotice: { type: string, nullable: true }
        disableNotice: { type: string, nullable: true }
        selections:
          type: array
          items: { $ref: "#/components/schemas/MeasurementSelectionPoint" }
        events:
          type: array
          items: { $ref: "#/components/schemas/MeasurementSelectionEvent" }
        volumeEstimate:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            Die Budget-/Volumen-Schätzung. Sie zählt IMMER das ganze Gerät - der
            Bus ist physisch einer, auch wenn die Sicht eine Komponente zeigt.
    MeasurementSelectionPoint:
      type: object
      properties:
        entityId:
          type: string
          format: uuid
          nullable: true
          description: Die Komponente, die diesen Punkt beobachtet; null = das Gerät.
        pointKey: { type: string }
        enabled: { type: boolean }
        cadenceS: { type: integer, nullable: true }
        desiredRevision: { type: integer, format: int64 }
        enabledAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Serverseitige No-Backfill-Grenze: aufgezeichnet wird ab hier,
            frühere Werte werden nie ergänzt.
        disabledAt: { type: string, format: date-time, nullable: true }
        catalogVersion: { type: string }
        changedBy: { type: string }
        changedByName: { type: string, nullable: true }
        changedAt: { type: string, format: date-time }
        applyStatus:
          type: string
          enum: [pending_edge, applied, rejected, first_sample]
        applyReason: { type: string, nullable: true }
        appliedAt: { type: string, format: date-time, nullable: true }
        customDefinition:
          nullable: true
          description: Bei einem freien Register die vollständige, nur lesbare Definition.
          allOf:
            - $ref: "#/components/schemas/CustomMeasurementDefinition"
        retentionClass: { type: string }
        rawRetentionDays: { type: integer }
        longTermCadenceS: { type: integer, nullable: true }
        longTermStrategy: { type: string }
        label: { type: string, nullable: true }
        family: { type: string, nullable: true }
        group: { type: string, nullable: true }
        semanticStatus: { type: string }
    MeasurementSelectionEvent:
      type: object
      description: >
        Eine unveränderliche Zeile der Papier-Spur. Spätere Zustandsübergänge
        derselben Revision werden ANGEHÄNGT, nie in die Anforderung gepatcht.
      properties:
        id: { type: integer, format: int64 }
        entityId:
          type: string
          format: uuid
          nullable: true
          description: >
            Zuordnungsnotiz der Anforderung. Ohne Fremdschlüssel, damit die
            Spur die Komponente überlebt, über die sie berichtet.
        pointKey: { type: string }
        desiredRevision: { type: integer, format: int64 }
        eventKind:
          type: string
          enum: [selection_requested, edge_ack, first_sample]
        idempotencyKey: { type: string, format: uuid, nullable: true }
        requestedAt: { type: string, format: date-time }
        requestedEnabled: { type: boolean }
        requestedCadenceS: { type: integer, nullable: true }
        enabledAt: { type: string, format: date-time, nullable: true }
        disabledAt: { type: string, format: date-time, nullable: true }
        catalogVersion: { type: string }
        actor: { type: string }
        actorName: { type: string, nullable: true }
        applyStatus: { type: string }
        applyReason: { type: string, nullable: true }
        appliedAt: { type: string, format: date-time, nullable: true }
        customDefinition:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CustomMeasurementDefinition"
        retentionClass: { type: string }
        rawRetentionDays: { type: integer }
        longTermCadenceS: { type: integer, nullable: true }
        longTermStrategy: { type: string }
    CustomMeasurementDefinition:
      type: object
      description: >
        Ein freies Modbus-Register als vollständige, NUR LESBARE Definition. Es
        gibt hier keinen Schreibweg: ein Schreibparameter im Rumpf ist 400, und
        `requestCostMs` setzt ausschließlich der Server konservativ.
      required: [label, sourceKind, address, selector, valueType, widthBits, signed,
        endian, scale, unit, cadenceS, retentionClass, readOnly]
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
        sourceKind: { type: string, enum: [modbus_holding, modbus_input] }
        address: { type: integer, minimum: 0, maximum: 65535 }
        selector: { type: string, minLength: 1, maxLength: 80 }
        valueType:
          type: string
          enum: [uint16, int16, uint32, int32, float32, float64]
        widthBits: { type: integer, enum: [16, 32, 64] }
        signed: { type: boolean }
        endian: { type: string, enum: [big, word_little_byte_big] }
        scale: { type: number }
        unit: { type: string, minLength: 1, maxLength: 32 }
        cadenceS: { type: integer, minimum: 1, maximum: 86400 }
        retentionClass: { type: string, minLength: 1 }
        readOnly: { type: boolean, enum: [true] }
        requestCostMs:
          type: integer
          readOnly: true
          description: Serverseitige, konservative Kostenannahme; im Request nicht erlaubt.
    MessGroesse:
      type: object
      description: >
        Eine Messgröße wie `$defs/groesse` in docs/contracts/v2/messstelle.schema.json.
        Nur zusammen mit dem Medium im Größen-Katalog gültig (Vertrag §2).
      additionalProperties: false
      required: [groesse, richtung, einheit, wertart]
      properties:
        groesse: { type: string, enum: [Wirkenergie, Wirkleistung, Blindenergie, Scheinleistung, Ladestand, Volumen] }
        richtung: { type: string, enum: [Bezug, Abgabe, Erzeugung, Laden, Entladen, "Laden / Entladen", richtungslos] }
        einheit: { type: string, enum: [kWh, kW, kvarh, kVA, "%", "m³"] }
        wertart: { type: string, enum: [Zählerstand, Intervallmenge, Momentanwert] }
    Messstelle:
      type: object
      description: >
        Eine Messstelle nach docs/contracts/v2/messstelle.schema.json (dieselben
        Feldnamen in snake_case) plus die vier Felder der Schnittstelle `id`, `fehlt`,
        `angehalten_ab`, `archiviert_am`. `orte` und `elektrische_stellung` tragen die
        wirksamen Zuordnungen nach Beginn (IP-7), `fuehrende_quelle` und
        `vergleichsquellen` (auch je Nebengröße) die Quellenbindungen nach Beginn,
        beendete eingeschlossen (IP-13); `kadenz_s` bleibt null (AP-07). `lebenszyklus` und `fehlt`
        leitet MessstelleRegeln.lebenszyklus aus den gespeicherten Eingängen ab (ohne
        Ort ist eine gemessene Messstelle ein Entwurf, eine berechnete ohne Formel
        ebenso; ein Ort, gleich ab wann, zählt als vorhanden); gespeichert ist nie
        die Stufe.
      required: [id, schema_version, kennzeichen, name, art, medium, hauptgroesse, fuehrende_quelle,
        vergleichsquellen, nebengroessen, orte, elektrische_stellung, kadenz_s, lebenszyklus, fehlt,
        notiz, angehalten_ab, archiviert_am]
      properties:
        id: { type: string, format: uuid }
        schema_version: { type: string, enum: ["1.0"] }
        kennzeichen: { type: string, pattern: "^[A-Z0-9./-]{2,16}$" }
        name: { type: string, nullable: true, description: "null = fehlt noch (Entwurf)." }
        art: { type: string, enum: [gemessen, berechnet] }
        medium: { type: string, enum: [Strom, Gas, Wärme, Kälte, Wasser, Druckluft] }
        hauptgroesse: { $ref: "#/components/schemas/MessGroesse" }
        fuehrende_quelle:
          type: array
          description: "Woher die Hauptgröße kommt, mit Gültigkeit (IP-13); leer = keine Datenquelle, nie 0."
          items: { $ref: "#/components/schemas/MessstelleQuellenbindung" }
        vergleichsquellen:
          type: array
          description: "Vergleichsquellen der Hauptgröße, jede mit Zweck (IP-13)."
          items: { $ref: "#/components/schemas/MessstelleVergleichsbindung" }
        nebengroessen:
          type: array
          items:
            type: object
            required: [groesse, richtung, einheit, wertart, lebenszyklus, fuehrende_quelle, vergleichsquellen]
            properties:
              groesse: { type: string }
              richtung: { type: string }
              einheit: { type: string }
              wertart: { type: string }
              lebenszyklus: { type: string, enum: [aktiv, archiviert], description: "archiviert auch mit der Messstelle." }
              fuehrende_quelle: { type: array, items: { $ref: "#/components/schemas/MessstelleQuellenbindung" } }
              vergleichsquellen: { type: array, items: { $ref: "#/components/schemas/MessstelleVergleichsbindung" } }
        orte:
          type: array
          description: "Wo die Messstelle sitzt, tagesgenau gültig - je Tag genau einer."
          items: { $ref: "#/components/schemas/MessstelleOrtZuordnung" }
        elektrische_stellung:
          type: array
          description: "Wo sie im elektrischen Baum einer Anlage steht, tagesgenau gültig."
          items: { $ref: "#/components/schemas/MessstelleStellungZuordnung" }
        kadenz_s: { type: integer, nullable: true }
        lebenszyklus: { type: string, enum: [entwurf, eingerichtet, aktiv, angehalten, archiviert] }
        fehlt:
          type: array
          items: { type: string, enum: [kennzeichen, name, hauptgroesse, ort, formel, eingaenge] }
        notiz: { type: string, nullable: true }
        angehalten_ab: { type: string, format: date-time, nullable: true, description: "Auf die Minute, Versatz Europe/Berlin." }
        archiviert_am: { type: string, format: date-time, nullable: true, description: "Auf die Minute, Versatz Europe/Berlin." }
    MessstelleListe:
      type: object
      description: >
        Die Liste als Objekt: `messstellen` die Vertrags-Form (IP-3), `register` die
        Zeilen zum Stichtag (IP-4) - dieselben Messstellen, dieselbe Reihenfolge.
        `stichtag` ist der Tag, an dem Ort und Stellung gelten, `zeitpunkt` der
        Augenblick, zu dem die Quelle gilt.
      required: [messstellen, register, stichtag, zeitpunkt, teilansicht, aggregat]
      properties:
        messstellen:
          type: array
          items: { $ref: "#/components/schemas/Messstelle" }
        register:
          type: array
          items: { $ref: "#/components/schemas/MessstelleRegisterZeile" }
        stichtag: { type: string, format: date }
        zeitpunkt: { type: string, format: date-time }
        teilansicht:
          type: boolean
          description: "Ob die Liste nur einen Teil der Messstellen des Unternehmens zeigt (AP-03); bis dahin immer false."
        aggregat: { $ref: "#/components/schemas/MessstelleRegisterAggregat" }
    MessstelleRegisterZeile:
      type: object
      description: >
        Eine Zeile des Registers (AP-04 §5.16) zum Stichtag. `lebenszyklus` und `fehlt`
        sind die der Messstellen-Antwort - der HEUTIGE Lebenszyklus (gespeichert ist nur
        der heutige Eingang); ein Stichtag verschiebt Ort, Stellung und Quelle, nicht ihn.
      required: [id, kennzeichen, name, art, medium, hauptgroesse, ort, elektrische_stellung, quelle,
        lebenszyklus, fehlt, angehalten_ab, archiviert_am, beobachtung, letzter_wert, nebengroessen]
      properties:
        id: { type: string, format: uuid }
        kennzeichen: { type: string }
        name: { type: string, nullable: true }
        art: { type: string, enum: [gemessen, berechnet] }
        medium: { type: string }
        hauptgroesse: { $ref: "#/components/schemas/MessGroesse" }
        ort: { $ref: "#/components/schemas/MessstelleRegisterOrt" }
        elektrische_stellung:
          nullable: true
          description: "Die Stellung, die am Stichtag gilt; null = keine."
          allOf: [{ $ref: "#/components/schemas/MessstelleRegisterStellung" }]
        quelle: { $ref: "#/components/schemas/MessstelleRegisterQuelle" }
        lebenszyklus: { type: string, enum: [entwurf, eingerichtet, aktiv, angehalten, archiviert] }
        fehlt: { type: array, items: { type: string } }
        angehalten_ab: { type: string, format: date-time, nullable: true }
        archiviert_am: { type: string, format: date-time, nullable: true }
        beobachtung:
          nullable: true
          description: >
            Die Beobachtung der HAUPTGRÖSSE über ihre führende Quelle (AP-04 IP-15). null nur
            bei einer BERECHNETEN Messstelle - ihre Vollständigkeit kommt mit AP-10; nie geraten.
          allOf: [{ $ref: "#/components/schemas/MessstelleRegisterBeobachtung" }]
        letzter_wert:
          nullable: true
          description: "Der letzte gute Wert der Hauptgröße mit Einheit und Zeitpunkt; null, solange es keinen gibt - nie eine 0."
          allOf: [{ $ref: "#/components/schemas/MessstelleRegisterWert" }]
        nebengroessen:
          type: array
          description: "Je Nebengröße dieselbe Beobachtung, über ihre EIGENE führende Quelle."
          items: { $ref: "#/components/schemas/MessstelleRegisterNebengroesse" }
    MessstelleRegisterOrt:
      type: object
      description: >
        Der Ort am Stichtag und der daraus abgeleitete Standort - die Verortung des
        Ortsbaum-Vertrags wie MessstelleStandortAm (`kennzeichen` = dessen `ort`).
        Ohne Ort an dem Tag sind alle Felder null und `grund` ist nicht_verortet.
      required: [id, kennzeichen, ort_art, name, gueltig_ab, gueltig_bis, pfad, standort, standort_id,
        standort_name, grund]
      properties:
        id: { type: string, format: uuid, nullable: true, description: "Die ID des Standorts, Gebäudes, Bereichs bzw. Unternehmens." }
        kennzeichen: { type: string, nullable: true, description: "Das Kurzzeichen des Orts; U = das Unternehmen.", example: B-1 }
        ort_art: { type: string, nullable: true, enum: [unternehmen, standort, gebaeude, bereich, null] }
        name: { type: string, nullable: true }
        gueltig_ab: { type: string, format: date, nullable: true, description: "Beginn des Intervalls, das am Stichtag gilt." }
        gueltig_bis: { type: string, format: date, nullable: true, description: "Letzter Tag; null = offen." }
        pfad: { type: array, items: { type: string }, example: [B-1, G-1, ST-1] }
        standort: { type: string, nullable: true }
        standort_id: { type: string, format: uuid, nullable: true }
        standort_name: { type: string, nullable: true }
        grund: { type: string, enum: [verortet, am_unternehmen, nicht_verortet, ort_nicht_im_baum] }
    MessstelleRegisterStellung:
      type: object
      required: [anlage, anlage_name, stellung, unterzaehler_von, gueltig_ab, gueltig_bis]
      properties:
        anlage: { type: string, format: uuid }
        anlage_name: { type: string, nullable: true }
        stellung: { type: string, enum: [Hauptzähler, Unterzähler, Erzeuger, Speicher, Abzweig, keine] }
        unterzaehler_von: { type: string, nullable: true, description: "Das heutige Kennzeichen der Bezug-Messstelle (nur bei Unterzähler)." }
        gueltig_ab: { type: string, format: date }
        gueltig_bis: { type: string, format: date, nullable: true }
    MessstelleRegisterQuelle:
      type: object
      description: >
        Die Quelle der Hauptgröße zum Zeitpunkt. `stand`: gebunden (eine führende Quelle
        gilt), berechnet (eine berechnete Messstelle hat keine - ihre Formel kommt mit
        AP-10) oder keine_datenquelle (gemessen, aber keine führende Quelle - nie eine 0).
      required: [stand, fuehrend, davor, vergleichsquellen]
      properties:
        stand: { type: string, enum: [gebunden, berechnet, keine_datenquelle] }
        fuehrend:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/MessstelleRegisterBindung" }]
        davor:
          nullable: true
          description: "Die führende Quelle, die vor der geltenden (bzw. vor dem Zeitpunkt) zuletzt endete - „davor Z-5a“."
          allOf: [{ $ref: "#/components/schemas/MessstelleRegisterBindung" }]
        vergleichsquellen: { type: integer, description: "Wie viele Vergleichsquellen der Hauptgröße zu dem Zeitpunkt laufen." }
    MessstelleRegisterBindung:
      type: object
      required: [id, komponente, komponente_name, kanal, kanal_name, geraet, gueltig_ab, gueltig_bis]
      properties:
        id: { type: string, format: uuid }
        komponente: { type: string, format: uuid }
        komponente_name: { type: string, nullable: true }
        kanal: { type: string, description: "Der Punkt des Messpunkt-Katalogs (point_key)." }
        kanal_name: { type: string, nullable: true, description: "Sein Anzeigename - aus der eigenen Definition (Selbstbau) oder dem Katalog." }
        geraet: { $ref: "#/components/schemas/MessstelleRegisterGeraet" }
        gueltig_ab: { type: string, format: date-time, description: "Das „seit“ der Zeile." }
        gueltig_bis: { type: string, format: date-time, nullable: true }
    MessstelleRegisterGeraet:
      type: object
      required: [id, geraet, einbau, bezeichnung]
      properties:
        id: { type: string, format: uuid, description: "Der Einbau - für GET /api/v1/geraete/{id}." }
        geraet: { type: string, example: GR-4 }
        einbau: { type: string, example: Z-5b }
        bezeichnung: { type: string, nullable: true, description: "Der Name des Geräts; null, solange niemand einen vergeben hat." }
    MessstelleRegisterBeobachtung:
      type: object
      description: >
        Die Beobachtung EINER Größe (AP-04 IP-15) - abgeleitet, nie gespeichert und nie geraten.
        `zustand` ist eines der vier Wörter des Zustandsvertrags, `text` der Kundensatz dazu;
        `seit` trägt nur liefert_nicht_seit (ein Satz ohne Zeitpunkt wäre eine halbe Aussage).
        `toleranz_s` ist das angewandte Fenster min(max(3 x kadenz_s, 300), 86400) - die Kante
        gehört zu „liefert“. ⚠ 3 x Kadenz ist die BEOBACHTUNG; 2 x Kadenz ist die LÜCKE, eine
        andere Aussage (AP-07 IP-9), die hier nicht vorkommt. Es gibt keinen Fehler- und keinen
        Störungszustand: Schweigen ist nie ein bewiesener Fehlschlag.
      required: [zustand, text, seit, toleranz_s, kadenz_s, geraet]
      properties:
        zustand: { type: string, enum: [liefert, liefert_nicht_seit, wartet_auf_erste_daten, keine_datenquelle] }
        text: { type: string, example: "Wartet auf erste Daten von Z-5b" }
        seit: { type: string, format: date-time, nullable: true, description: "Nur bei liefert_nicht_seit: der letzte gute Wert." }
        toleranz_s: { type: integer, format: int64, nullable: true, description: "null bei keine_datenquelle - ohne Kanal ist kein Fenster bekannt." }
        kadenz_s: { type: integer, format: int64, nullable: true, description: "Die erwartete Häufigkeit des Kanals (Mess-Selektion, sonst Katalog); null bei keine_datenquelle." }
        geraet: { type: string, nullable: true, description: "Der Einbau der führenden Quelle (Z-5b); null ohne Quelle.", example: Z-5b }
    MessstelleRegisterWert:
      type: object
      description: >
        Der letzte Wert mit Qualität „gut“ der führenden Quelle. Genau eines von `wert` und `text`
        ist gesetzt (die Wert-Regel der Messreihe); `einheit` ist die des Messkanals, ohne jede
        Umrechnung.
      required: [wert, text, einheit, zeitpunkt]
      properties:
        wert: { type: number, nullable: true }
        text: { type: string, nullable: true }
        einheit: { type: string, nullable: true, example: kWh }
        zeitpunkt: { type: string, format: date-time }
    MessstelleRegisterNebengroesse:
      type: object
      description: "Eine Nebengröße der Zeile mit ihrer eigenen Beobachtung über ihre eigene führende Quelle."
      required: [id, groesse, beobachtung, letzter_wert]
      properties:
        id: { type: string, format: uuid }
        groesse: { $ref: "#/components/schemas/MessGroesse" }
        beobachtung:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/MessstelleRegisterBeobachtung" }]
        letzter_wert:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/MessstelleRegisterWert" }]
    MessstelleRegisterAggregat:
      type: object
      description: >
        „x von y Messstellen liefern Daten“ (AP-04 IP-15) über die Ableitung aggregat des
        Zustandsvertrags: nur liefert zählt im Zähler, „keine Datenquelle“ steht im Nenner.
        Gezählt werden GENAU die Zeilen dieser Antwort (die Filter gelten also auch hier) mit
        einer Beobachtung - eine BERECHNETE Messstelle hat keine (AP-10) und steht in keinem
        Nenner. Eine Zeile ohne Standort an dem Tag zählt nur beim Unternehmen.
      required: [unternehmen, standorte]
      properties:
        unternehmen: { $ref: "#/components/schemas/MessstelleRegisterAbdeckung" }
        standorte:
          type: array
          items: { $ref: "#/components/schemas/MessstelleRegisterStandortAbdeckung" }
    MessstelleRegisterAbdeckung:
      type: object
      required: [erfuellt, gesamt, text]
      properties:
        erfuellt: { type: integer }
        gesamt: { type: integer }
        text: { type: string, example: "14 von 17 Messstellen liefern Daten" }
    MessstelleRegisterStandortAbdeckung:
      type: object
      required: [id, kurzzeichen, name, erfuellt, gesamt, text]
      properties:
        id: { type: string, format: uuid, nullable: true }
        kurzzeichen: { type: string, example: ST-1 }
        name: { type: string, nullable: true }
        erfuellt: { type: integer }
        gesamt: { type: integer }
        text: { type: string }
    MesskanalListe:
      type: object
      required: [site_id, komponente, inhaltsstand, messkanaele]
      properties:
        site_id: { type: string, format: uuid }
        komponente: { type: string, format: uuid }
        inhaltsstand: { type: string, description: "Der Stand des Messpunkt-Katalogs, aus dem Anzeigename, Einheit, Wertart, Größe und Richtung stammen." }
        messkanaele:
          type: array
          items: { $ref: "#/components/schemas/Messkanal" }
    Messkanal:
      type: object
      required: [kanal, anzeigename, einheit, wertart, groesse, richtung, quantity, direction, kadenz_s, aktiv, lesende_box, geraet, speist]
      properties:
        kanal: { type: string, description: "Der Kanalname: point_key des Katalogs oder des Selbstbaus." }
        anzeigename: { type: string, nullable: true }
        einheit: { type: string, nullable: true }
        wertart: { type: string, nullable: true, enum: [counter, gauge, state, bitfield, text, null], description: "Wertart der Quelle aus dem Katalog (AP-07 E12); null für Selbstbau und Punkte ohne Wertart." }
        groesse: { type: string, nullable: true, enum: [Wirkenergie, Wirkleistung, Blindenergie, Scheinleistung, Ladestand, null] }
        richtung: { type: string, nullable: true, enum: [Bezug, Abgabe, Erzeugung, Laden, Entladen, "Laden / Entladen", richtungslos, null] }
        quantity: { type: string, nullable: true, description: "Katalogwort der Größe (catalog.schema.json)." }
        direction: { type: string, nullable: true, description: "Katalogwort der Richtung (catalog.schema.json)." }
        kadenz_s: { type: integer, nullable: true, description: "Die gewünschte Kadenz der Mess-Selektion (AP-07 E9)." }
        aktiv: { type: boolean, description: "Ob die Box den Kanal gerade aufzeichnet; abgewählt bleibt er sichtbar." }
        lesende_box: { type: string, format: uuid, description: "Die Box, die den Kanal liest." }
        geraet:
          nullable: true
          description: "Das Gerät, das die Komponente jetzt speist (AP-04 IP-10); null ohne laufende Speisung - nie geraten."
          allOf: [{ $ref: "#/components/schemas/MesskanalGeraet" }]
        speist:
          type: array
          description: "Welche Messstellen der Kanal zum Stichtag (sonst jetzt) speist (AP-04 IP-13) - leer, wenn keine Quellenbindung läuft."
          items: { $ref: "#/components/schemas/MesskanalSpeist" }
    MesskanalSpeist:
      type: object
      description: >
        Eine Quellenbindung, die den Kanal zum Stichtag liest - genug für „speist
        MS-06 (führend)“: die Messstelle, die Größe, an der die Quelle hängt, und die Rolle.
      required: [messstelle_id, messstelle, groesse, richtung, rolle, zweck, gueltig_ab, gueltig_bis]
      properties:
        messstelle_id: { type: string, format: uuid }
        messstelle: { type: string, description: "Das Kennzeichen der Messstelle (MS-06)." }
        groesse: { type: string }
        richtung: { type: string }
        rolle: { type: string, enum: [fuehrend, vergleich] }
        zweck: { type: string, nullable: true, enum: [Plausibilität, Ersatz bei Ausfall, Abrechnungszähler, null] }
        gueltig_ab: { type: string, format: date-time }
        gueltig_bis: { type: string, format: date-time, nullable: true }
    MesskanalGeraet:
      type: object
      description: >
        Die Form von `geraet_einbau` des Herkunftsvertrags
        (docs/contracts/v2/messwert-herkunft.schema.json, Angabe 10) plus `id`:
        der Nachschlag je Wert (AP-07) und das Read-Model sagen dasselbe.
      required: [id, geraet, einbau, seriennummer]
      properties:
        id: { type: string, format: uuid, description: "Der Einbau - für GET /api/v1/geraete/{id}." }
        geraet: { type: string, description: "Das Gerät (GR-4), das über einen Wechsel an seiner Stelle bleibt." }
        einbau: { type: string, nullable: true, description: "Das konkret eingebaute Gerät (Z-5a); ohne Wechsel dasselbe wie `geraet`. Die Tabelle hält es NOT NULL; fehlte es, stünde hier null, nie ein geratenes." }
        seriennummer: { type: string, nullable: true, description: "Die Seriennummer des Einbaus; null = nicht erhoben." }
    MessstelleStand:
      type: object
      description: "Ein abgelesener Zählerstand (E2); `einheit` darf fehlen - dann gibt es den Hinweis ablesestand_pruefen."
      required: [wert]
      properties:
        wert: { type: number }
        einheit: { type: string, nullable: true }
    MessstelleQuellenbindung:
      type: object
      description: "Eine führende Quelle in der Form von $defs/quellenbindung des Messstellen-Vertrags."
      required: [komponente, kanal, geraet, einbau, kanal_wertart, gueltig_ab, gueltig_bis, anfangsstand, endstand]
      properties:
        komponente: { type: string, description: "Die Kennung der Komponente." }
        kanal: { type: string, description: "Der Kanalname (point_key)." }
        geraet: { type: string, description: "Das Gerät (GR-4)." }
        einbau: { type: string, description: "Der Einbau, der die Komponente in diesem Zeitraum speist (Z-5a)." }
        kanal_wertart: { type: string, enum: [counter, gauge] }
        gueltig_ab: { type: string, format: date-time }
        gueltig_bis: { type: string, format: date-time, nullable: true }
        anfangsstand: { nullable: true, allOf: [{ $ref: "#/components/schemas/MessstelleStand" }] }
        endstand: { nullable: true, allOf: [{ $ref: "#/components/schemas/MessstelleStand" }] }
    MessstelleVergleichsbindung:
      type: object
      description: "Eine Vergleichsquelle in der Form von $defs/vergleichsbindung des Messstellen-Vertrags."
      required: [komponente, kanal, geraet, einbau, kanal_wertart, zweck, gueltig_ab, gueltig_bis]
      properties:
        komponente: { type: string }
        kanal: { type: string }
        geraet: { type: string }
        einbau: { type: string }
        kanal_wertart: { type: string, enum: [counter, gauge] }
        zweck: { type: string, enum: [Plausibilität, Ersatz bei Ausfall, Abrechnungszähler] }
        gueltig_ab: { type: string, format: date-time }
        gueltig_bis: { type: string, format: date-time, nullable: true }
    MessstelleQuelleBinden:
      type: object
      additionalProperties: false
      description: >
        Eine Quelle binden (AP-04 IP-13). Das Gerät wählt nie der Kunde: es ist der
        Einbau, der die Komponente zu `gueltig_ab` speist.
      required: [komponente, kanal, rolle]
      properties:
        groesse:
          type: object
          nullable: true
          description: "Fehlend = die Hauptgröße; sonst Größe + Richtung einer Nebengröße."
          required: [groesse, richtung]
          properties:
            groesse: { type: string }
            richtung: { type: string }
        komponente: { type: string, format: uuid }
        kanal: { type: string, description: "Der Kanalname (point_key) - eine Zeile der Mess-Selektion der Komponente." }
        rolle: { type: string, enum: [fuehrend, vergleich] }
        zweck: { type: string, nullable: true, description: "Nur und immer bei vergleich: Plausibilität · Ersatz bei Ausfall · Abrechnungszähler." }
        gueltig_ab: { type: string, format: date-time, nullable: true, description: "Auf die Minute mit Versatz; fehlend = jetzt. Vergangenheit = rückwirkend, Zukunft = angekündigt." }
        gueltig_bis: { type: string, format: date-time, nullable: true, description: "Fehlend = bis auf Weiteres." }
        anfangsstand: { nullable: true, allOf: [{ $ref: "#/components/schemas/MessstelleStand" }] }
        endstand_vorgaenger: { nullable: true, allOf: [{ $ref: "#/components/schemas/MessstelleStand" }], description: "Nur, wenn die neue offene führende Quelle die laufende beendet (Regel 2)." }
        grund: { type: string, nullable: true, description: "Frei; steht im Änderungsprotokoll." }
    MessstelleQuelleBeenden:
      type: object
      additionalProperties: false
      properties:
        gueltig_bis: { type: string, format: date-time, nullable: true, description: "Auf die Minute; fehlend = jetzt." }
        endstand: { nullable: true, allOf: [{ $ref: "#/components/schemas/MessstelleStand" }] }
        grund: { type: string, nullable: true }
    MessstelleQuelleGeraet:
      type: object
      required: [id, geraet, einbau]
      properties:
        id: { type: string, format: uuid, description: "Der Einbau - für GET /api/v1/geraete/{id}." }
        geraet: { type: string }
        einbau: { type: string }
    MessstelleQuelle:
      type: object
      description: "Eine Quellenbindung, wie sie gespeichert ist; `status` gegen jetzt."
      required: [id, messstelle_id, groesse, richtung, rolle, zweck, komponente, komponente_name, anlage, kanal,
        kanal_wertart, herleitung, geraet, gueltig_ab, gueltig_bis, status, anfangsstand, endstand, rueckwirkend,
        herkunft, eingetragen_am, eingetragen_von]
      properties:
        id: { type: string, format: uuid }
        messstelle_id: { type: string, format: uuid }
        groesse: { type: string }
        richtung: { type: string }
        rolle: { type: string, enum: [fuehrend, vergleich] }
        zweck: { type: string, nullable: true }
        komponente: { type: string, format: uuid }
        komponente_name: { type: string, nullable: true }
        anlage: { type: string, format: uuid }
        kanal: { type: string }
        kanal_wertart: { type: string, enum: [counter, gauge] }
        herleitung: { type: string, enum: [zaehlerstand, differenzen, integration, momentanwert], description: "integration ist für AP-08 gekennzeichnet (Menge aus einer Leistung)." }
        geraet: { $ref: "#/components/schemas/MessstelleQuelleGeraet" }
        gueltig_ab: { type: string, format: date-time }
        gueltig_bis: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [geplant, gilt, beendet] }
        anfangsstand: { nullable: true, allOf: [{ $ref: "#/components/schemas/MessstelleStand" }] }
        endstand: { nullable: true, allOf: [{ $ref: "#/components/schemas/MessstelleStand" }] }
        rueckwirkend: { type: boolean, description: "Lag der Beginn beim Eintragen schon zurück (E2)?" }
        herkunft: { type: string, nullable: true, enum: [bestandsuebernahme, null], description: "Woher die Bindung stammt: leer = von Hand gebunden, `bestandsuebernahme` = aus der Vorschlagsliste des Standorts übernommen (IP-16, E6)." }
        eingetragen_am: { type: string, format: date-time }
        eingetragen_von: { type: string }
    MessstelleQuelleRueckwirkung:
      type: object
      description: "Wie weit das eingetragene „gültig ab“ bzw. „gültig bis“ von jetzt entfernt ist, auf die Minute (E2)."
      required: [art, minuten, abzeichen]
      properties:
        art: { type: string, enum: [rueckwirkend, ab_jetzt, angekuendigt] }
        minuten: { type: integer }
        abzeichen: { type: string, nullable: true, description: "Nur rückwirkend: „rückwirkend (25 min)“, „rückwirkend (2 h 5 min)“, „rückwirkend (933 Tage)“." }
    MessstelleQuelleVorgang:
      type: object
      description: "Die Antwort auf Binden und Beenden."
      required: [quelle, beendet, rueckwirkung, hinweise]
      properties:
        quelle: { $ref: "#/components/schemas/MessstelleQuelle" }
        beendet:
          nullable: true
          description: "Beim Binden: die laufende führende Quelle, die die neue genau zu ihrem Beginn beendet hat (Regel 2)."
          allOf: [{ $ref: "#/components/schemas/MessstelleQuelle" }]
        rueckwirkung: { $ref: "#/components/schemas/MessstelleQuelleRueckwirkung" }
        hinweise: { type: array, items: { type: string, enum: [ablesestand_pruefen] } }
    ZaehlerwechselNeuesGeraet:
      type: object
      additionalProperties: false
      description: >
        Das Kästchen, das kommt. Jedes Feld darf fehlen: `einbau_kennzeichen` vergibt dann
        der Server (GR-4.2, GR-4.3 …), Hersteller, Typ und Bezeichnung übernimmt er vom
        Vorgänger - die `seriennummer` NIE: sie ist die des alten Kästchens und wird nie
        erfunden (null heißt „nicht erhoben").
      properties:
        einbau_kennzeichen: { type: string, nullable: true, description: "1-32 Zeichen: Buchstaben, Ziffern, „-“, „.“, „/“, „′“. Belegt = 409 `kennzeichen_belegt`." }
        hersteller: { type: string, nullable: true }
        typ: { type: string, nullable: true }
        seriennummer: { type: string, nullable: true }
        bezeichnung: { type: string, nullable: true }
    ZaehlerwechselVerbindung:
      type: object
      additionalProperties: false
      description: >
        Wie das neue Gerät antwortet. Fehlt das Feld GANZ, bleibt die Verbindung des
        Vorgängers - „gleiche Datenquelle und Geräte-ID" (§5.5), und dann entsteht auch
        keine neue Komponenten-Fassung.
      properties:
        datenquelle: { type: string, format: uuid, nullable: true, description: "Die Datenquelle des neuen Geräts (AP-06); fehlend = die des Vorgängers." }
        geraete_id: { type: integer, nullable: true, description: "Die Geräte-ID hinter dem Weg (Modbus-Unit-ID); fehlend = die des Vorgängers. Eine geänderte schreibt eine neue Komponenten-Fassung." }
    Zaehlerwechsel:
      type: object
      additionalProperties: false
      description: >
        Der Zählerwechsel als EIN Vorgang (AP-04 IP-17) - dieselbe Anfrage an beiden
        Einstiegen.
      properties:
        zeitpunkt: { type: string, format: date-time, nullable: true, description: "Auf die Minute mit Versatz; fehlend = jetzt. Vergangenheit = rückwirkend, Zukunft = angekündigt (E2)." }
        neues_geraet: { nullable: true, allOf: [{ $ref: "#/components/schemas/ZaehlerwechselNeuesGeraet" }] }
        verbindung: { nullable: true, allOf: [{ $ref: "#/components/schemas/ZaehlerwechselVerbindung" }] }
        endstand_vorgaenger: { nullable: true, allOf: [{ $ref: "#/components/schemas/MessstelleStand" }], description: "Der abgelesene Endstand des alten Zählers; er landet an der Bindung, die endet." }
        anfangsstand: { nullable: true, allOf: [{ $ref: "#/components/schemas/MessstelleStand" }], description: "Der Anfangsstand des neuen Zählers; er landet an der Bindung, die beginnt." }
        einstellungen_uebernehmen: { type: boolean, nullable: true, description: "Fehlend = true: jede Fassung, die am alten Einbau zum Wechselzeitpunkt gilt, steht danach auch am neuen." }
        grund: { type: string, nullable: true, description: "Frei; steht im Änderungsprotokoll." }
    ZaehlerwechselEinbau:
      type: object
      required: [id, geraet, einbau, seriennummer, eingebaut_am, ausgebaut_am]
      properties:
        id: { type: string, format: uuid, description: "Der Einbau - für GET /api/v1/geraete/{id}." }
        geraet: { type: string, description: "Das Gerät an der Stelle (GR-4) - es bleibt über den Wechsel." }
        einbau: { type: string, description: "Das konkrete Kästchen (Z-5a bzw. Z-5b)." }
        seriennummer: { type: string, nullable: true, description: "null = nicht erhoben, nie erfunden." }
        eingebaut_am: { type: string, format: date-time }
        ausgebaut_am: { type: string, format: date-time, nullable: true }
    ZaehlerwechselGeraet:
      type: object
      required: [alt, neu, verbindung_neu]
      properties:
        alt: { $ref: "#/components/schemas/ZaehlerwechselEinbau" }
        neu: { $ref: "#/components/schemas/ZaehlerwechselEinbau" }
        verbindung_neu: { type: boolean, description: "Datenquelle oder Geräte-ID haben sich geändert - nur dann bekommt die Komponente eine neue Fassung." }
    ZaehlerwechselBindung:
      type: object
      required: [messstelle, kennzeichen, groesse, richtung, rolle, beendet, neu]
      properties:
        messstelle: { type: string, format: uuid }
        kennzeichen: { type: string }
        groesse: { type: string }
        richtung: { type: string }
        rolle: { type: string, enum: [fuehrend, vergleich] }
        beendet: { $ref: "#/components/schemas/MessstelleQuelle" }
        neu: { $ref: "#/components/schemas/MessstelleQuelle" }
    ZaehlerwechselEinstellung:
      type: object
      required: [id, art, komponente, kanal, anwendung]
      properties:
        id: { type: string, format: uuid }
        art: { type: string }
        komponente: { type: string, format: uuid, nullable: true }
        kanal: { type: string, nullable: true }
        anwendung: { type: string, enum: [angewendet, dokumentiert] }
    ZaehlerwechselVorgang:
      type: object
      description: "Die Antwort beider Einstiege (201)."
      required: [geraet, komponenten, bindungen, einstellungen, marken, rueckwirkung, hinweise]
      properties:
        geraet: { $ref: "#/components/schemas/ZaehlerwechselGeraet" }
        komponenten: { type: array, items: { type: string, format: uuid }, description: "Die Komponenten, deren Speisung mitgewandert ist." }
        bindungen: { type: array, items: { $ref: "#/components/schemas/ZaehlerwechselBindung" } }
        einstellungen: { type: array, items: { $ref: "#/components/schemas/ZaehlerwechselEinstellung" }, description: "Die Fassungen, die auf den neuen Einbau übernommen wurden." }
        marken: { type: integer, description: "In wie vielen Komponenten-Verläufen die Marke „Zähler gewechselt“ steht. Sie ist ein isolierter Zusatz und lässt den Wechsel nie scheitern - eine kleinere Zahl als `komponenten` ist ehrlich, kein Fehler des Vorgangs." }
        rueckwirkung: { $ref: "#/components/schemas/MessstelleQuelleRueckwirkung" }
        hinweise: { type: array, items: { type: string, enum: [ablesestand_pruefen] } }
    MessstelleQuelleAbschnitt:
      type: object
      required: [von, bis, quelle]
      properties:
        von: { type: string, format: date-time }
        bis: { type: string, format: date-time, nullable: true }
        quelle: { type: string, format: uuid, nullable: true, description: "null = eine sichtbare Lücke, nie aufgefüllt." }
    MessstelleQuelleGroesse:
      type: object
      required: [groesse, richtung, einheit, wertart, hauptgroesse, lebenszyklus, fuehrend, vergleich, zeitstrahl]
      properties:
        groesse: { type: string }
        richtung: { type: string }
        einheit: { type: string }
        wertart: { type: string }
        hauptgroesse: { type: boolean }
        lebenszyklus: { type: string, enum: [aktiv, archiviert] }
        fuehrend:
          nullable: true
          description: "Die führende Quelle zum Stichtag; null = keine Quelle, nie 0."
          allOf: [{ $ref: "#/components/schemas/MessstelleQuelle" }]
        vergleich: { type: array, items: { $ref: "#/components/schemas/MessstelleQuelle" } }
        zeitstrahl: { type: array, items: { $ref: "#/components/schemas/MessstelleQuelleAbschnitt" } }
    MessstelleQuellenListe:
      type: object
      required: [messstelle_id, kennzeichen, stichtag, groessen, quellen]
      properties:
        messstelle_id: { type: string, format: uuid }
        kennzeichen: { type: string }
        stichtag: { type: string, format: date-time }
        groessen: { type: array, items: { $ref: "#/components/schemas/MessstelleQuelleGroesse" }, description: "Hauptgröße zuerst, dann die Nebengrößen." }
        quellen: { type: array, items: { $ref: "#/components/schemas/MessstelleQuelle" }, description: "Die ganze Historie, beendete eingeschlossen." }
    MessstelleAnlegen:
      type: object
      additionalProperties: false
      required: [art, medium, hauptgroesse]
      properties:
        kennzeichen:
          type: string
          nullable: true
          pattern: "^[A-Z0-9./-]{2,16}$"
          description: "Fehlend oder null = das nächste automatische (MS-0001 …). Nichts wird umgewandelt: „ms-01“ ist 400."
        name: { type: string, nullable: true, description: "Fehlend, leer oder nur Leerzeichen = fehlt noch (Entwurf)." }
        art: { type: string, enum: [gemessen, berechnet] }
        medium: { type: string, enum: [Strom, Gas, Wärme, Kälte, Wasser, Druckluft] }
        hauptgroesse: { $ref: "#/components/schemas/MessGroesse" }
        nebengroessen:
          type: array
          description: "Je (Größe, Richtung) einmal und nie die Hauptgröße."
          items: { $ref: "#/components/schemas/MessGroesse" }
        notiz: { type: string, nullable: true }
    MessstelleBearbeiten:
      type: object
      additionalProperties: false
      required: [kennzeichen]
      properties:
        kennzeichen: { type: string, pattern: "^[A-Z0-9./-]{2,16}$" }
        name: { type: string, nullable: true }
        notiz: { type: string, nullable: true }
    MessstelleUebergang:
      type: object
      additionalProperties: false
      properties:
        zeitpunkt:
          type: string
          format: date-time
          description: "Auf die Minute mit Versatz (E2), fehlend = jetzt; vor jetzt = rückwirkend."
        grund: { type: string, nullable: true, description: "Steht im Änderungsprotokoll." }
    MessstelleOrtZuordnung:
      type: object
      description: "Ein Ort mit Gültigkeit wie `$defs/ortZuordnung` in messstelle.schema.json."
      additionalProperties: false
      required: [ort_art, kennzeichen, gueltig_ab, gueltig_bis]
      properties:
        ort_art: { type: string, enum: [unternehmen, standort, gebaeude, bereich] }
        kennzeichen: { type: string, description: "Das Kurzzeichen des Orts; U = das Unternehmen.", example: B-2 }
        gueltig_ab: { type: string, format: date }
        gueltig_bis: { type: string, format: date, nullable: true, description: "Der LETZTE gültige Tag, einschließlich; null = offen." }
    MessstelleStellungZuordnung:
      type: object
      description: "Die elektrische Stellung mit Gültigkeit wie `$defs/stellungZuordnung` in messstelle.schema.json."
      additionalProperties: false
      required: [anlage, stellung, unterzaehler_von, gueltig_ab, gueltig_bis]
      properties:
        anlage: { type: string, format: uuid, description: Die ID der Anlage. }
        stellung: { type: string, enum: [Hauptzähler, Unterzähler, Erzeuger, Speicher, Abzweig, keine] }
        unterzaehler_von: { type: string, nullable: true, description: "Das heutige Kennzeichen der Bezug-Messstelle - nur bei Unterzähler." }
        gueltig_ab: { type: string, format: date }
        gueltig_bis: { type: string, format: date, nullable: true, description: "Der LETZTE gültige Tag, einschließlich; null = offen." }
    MessstelleOrtAendern:
      type: object
      additionalProperties: false
      required: [kennzeichen, gueltig_ab]
      properties:
        kennzeichen: { type: string, description: "Das Kurzzeichen eines Standorts, Gebäudes oder Bereichs; U = das Unternehmen (nur berechnet)." }
        gueltig_ab: { type: string, format: date, description: "Ab welchem Tag (in der Zeitzone des Unternehmens)." }
        korrektur: { type: boolean, nullable: true, description: "true = das Intervall ersetzen, das an gueltig_ab beginnt." }
        grund: { type: string, nullable: true, description: Steht im Änderungsprotokoll. }
    MessstelleStellungAendern:
      type: object
      additionalProperties: false
      required: [anlage, stellung, gueltig_ab]
      properties:
        anlage: { type: string, format: uuid }
        stellung: { type: string, enum: [Hauptzähler, Unterzähler, Erzeuger, Speicher, Abzweig, keine] }
        unterzaehler_von: { type: string, nullable: true, description: "Das Kennzeichen der Bezug-Messstelle - genau bei Unterzähler." }
        gueltig_ab: { type: string, format: date }
        korrektur: { type: boolean, nullable: true, description: "true = das Intervall ersetzen, das an gueltig_ab beginnt." }
        grund: { type: string, nullable: true, description: Steht im Änderungsprotokoll. }
    MessstelleStandortAm:
      type: object
      description: >
        Der Stand der Zuordnungen einer Messstelle an einem Tag: die Verortung des
        Ortsbaum-Vertrags (`ort`, `pfad` vom Ort hinauf bis zum Standort,
        `standort`, `grund`) und die Stellung, die an dem Tag gilt.
      required: [am, ort, ort_art, pfad, standort, standort_id, grund, elektrische_stellung]
      properties:
        am: { type: string, format: date }
        ort: { type: string, nullable: true, description: "Das Kurzzeichen des Orts an dem Tag; U = das Unternehmen; null = keiner.", example: B-3 }
        ort_art: { type: string, nullable: true, enum: [unternehmen, standort, gebaeude, bereich, null] }
        pfad: { type: array, items: { type: string }, example: [B-3, G-2, ST-1] }
        standort: { type: string, nullable: true, description: "Das Kurzzeichen des abgeleiteten Standorts.", example: ST-1 }
        standort_id: { type: string, format: uuid, nullable: true }
        grund: { type: string, enum: [verortet, am_unternehmen, nicht_verortet, ort_nicht_im_baum] }
        elektrische_stellung:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/MessstelleStellungZuordnung" }]
    MessstelleVorschlagQuelle:
      type: object
      description: "Der Messwert hinter einer Größe des Vorschlags, mit der Herleitung aus Regel 7."
      required: [kanal, anzeigename, kanal_wertart, herleitung]
      properties:
        kanal: { type: string, description: "Der point_key der Mess-Selektion." }
        anzeigename: { type: string, nullable: true, description: "Der Name aus dem Katalog; fehlt er, spricht die Fläche vom Kanal." }
        kanal_wertart: { type: string, enum: [counter, gauge] }
        herleitung: { type: string, enum: [zaehlerstand, differenzen, integration, momentanwert] }
    MessstelleVorschlagNebengroesse:
      type: object
      description: "Eine Nebengröße des Vorschlags (der Ladestand am Speicher) mit ihrem Messwert."
      required: [groesse, quelle]
      properties:
        groesse: { $ref: "#/components/schemas/MessGroesse" }
        quelle: { $ref: "#/components/schemas/MessstelleVorschlagQuelle" }
    MessstelleVorschlagBezug:
      type: object
      description: "„Unterzähler von“: eine bestehende Messstelle oder ein Vorschlag DIESER Liste."
      required: [messstelle, bestehend, komponente, kanal]
      properties:
        messstelle: { type: string, description: "Das Kennzeichen des Hauptzählers (MS-0001 oder das bestehende)." }
        bestehend: { type: boolean, description: "true = eine schon vorhandene Messstelle; false = ein Vorschlag dieser Liste." }
        komponente: { type: string, format: uuid, nullable: true, description: "Nur beim Vorschlag: welche Zeile gemeint ist." }
        kanal: { type: string, nullable: true }
    MessstelleVorschlagHinweis:
      type: object
      description: "Was an einer Zeile hängt, ohne sie zu verhindern."
      required: [code, text]
      properties:
        code: { type: string, enum: [integration, ladestand_herkunft, geraet_gewechselt, standort_spaeter] }
        text: { type: string }
    MessstelleVorschlag:
      type: object
      description: >
        Eine Zeile der Vorschlagsliste: was aus diesem Messwert eine Messstelle machen
        würde. `kennzeichen` ist der automatische Vorschlag (E7) - vergeben wird es erst
        bei der Übernahme; `ab` der Beginn der Bindung, `stellung_ab` der Tag, ab dem die
        Stellung gilt (nie vor dem Tag, an dem ihr Hauptzähler einer ist).
      required: [kennzeichen, name, anlage, anlage_name, komponente, komponente_name, hauptgroesse, quelle,
        nebengroessen, stellung, unterzaehler_von, ort, ab, stellung_ab, hinweise]
      properties:
        kennzeichen: { type: string, example: "MS-0001" }
        name: { type: string, description: "Der Alias der Komponente; liest sie mehr als einen Fluss, nennt der Name ihn („Netzzähler Halle 1 · Bezug“)." }
        anlage: { type: string, format: uuid }
        anlage_name: { type: string, nullable: true }
        komponente: { type: string, format: uuid }
        komponente_name: { type: string, nullable: true }
        hauptgroesse: { $ref: "#/components/schemas/MessGroesse" }
        quelle: { $ref: "#/components/schemas/MessstelleVorschlagQuelle" }
        nebengroessen: { type: array, items: { $ref: "#/components/schemas/MessstelleVorschlagNebengroesse" } }
        stellung:
          type: string
          nullable: true
          enum: [Hauptzähler, Unterzähler, Erzeuger, Speicher, Abzweig, keine, null]
          description: "null = offen; sie wird nie geraten."
        unterzaehler_von:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/MessstelleVorschlagBezug" }]
        ort: { type: string, description: "Das Kurzzeichen des Standorts (Verfeinerung später, §5.15)." }
        ab: { type: string, format: date-time, description: "Der Beginn der Bindung - rückwirkend, Herkunft „Bestandsübernahme“." }
        stellung_ab: { type: string, format: date }
        hinweise: { type: array, items: { $ref: "#/components/schemas/MessstelleVorschlagHinweis" } }
    MessstelleVorschlagAusgelassen:
      type: object
      description: "Was nicht vorgeschlagen wird, mit Grund und Satz; `kanal` leer = die ganze Komponente."
      required: [anlage, komponente, komponente_name, kanal, grund, zu, text]
      properties:
        anlage: { type: string, format: uuid }
        komponente: { type: string, format: uuid }
        komponente_name: { type: string, nullable: true }
        kanal: { type: string, nullable: true }
        grund:
          type: string
          enum: [abgeleitet, ohne_messkanal, ohne_geraet, attribut_kanal, keine_messgroesse, ohne_richtung,
            weitere_groesse, vorzeichen_wert, vergleich_kandidat, gleicher_fluss, passt_nicht]
        zu: { type: string, nullable: true, description: "Die Messstelle, auf die der Grund zeigt (Vergleichsquelle, gleicher Fluss)." }
        text: { type: string }
    MessstelleVorschlagsliste:
      type: object
      description: "Die Vorschlagsliste eines Standorts; `leer` und `text` sind gesetzt, WENN es keinen Vorschlag gibt."
      required: [standort, standort_kennzeichen, standort_name, vorschlaege, ausgelassen, leer, text]
      properties:
        standort: { type: string, format: uuid }
        standort_kennzeichen: { type: string, example: "ST-1" }
        standort_name: { type: string }
        vorschlaege: { type: array, items: { $ref: "#/components/schemas/MessstelleVorschlag" } }
        ausgelassen: { type: array, items: { $ref: "#/components/schemas/MessstelleVorschlagAusgelassen" } }
        leer: { type: string, nullable: true, enum: [alle_zugeordnet, keine_komponente, null] }
        text: { type: string, nullable: true, description: "„Alle Komponenten von Werk Ahrenberg sind Messstellen zugeordnet.“" }
    MessstelleVorschlagBestaetigt:
      type: object
      description: >
        Eine bestätigte Zeile: die Felder, die das GET gezeigt hat. `name` darf
        überschrieben werden (leer = der vorgeschlagene); alles andere muss noch so sein,
        sonst 409 `vorschlag_geaendert`.
      required: [komponente, kanal, hauptgroesse, ab]
      properties:
        komponente: { type: string, format: uuid }
        kanal: { type: string }
        hauptgroesse: { $ref: "#/components/schemas/MessGroesse" }
        nebengroessen: { type: array, items: { $ref: "#/components/schemas/MessstelleVorschlagNebengroesse" } }
        stellung: { type: string, nullable: true }
        ab: { type: string, format: date-time }
        name: { type: string, nullable: true }
    MessstelleVorschlagUebernehmen:
      type: object
      required: [vorschlaege]
      properties:
        vorschlaege:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/MessstelleVorschlagBestaetigt" }
    MessstelleVorschlagUebernommen:
      type: object
      description: "Wie viele Messstellen neu entstanden sind, wie viele es schon gab, und sie selbst in der Reihenfolge der Anfrage."
      required: [neu, unveraendert, messstellen]
      properties:
        neu: { type: integer }
        unveraendert: { type: integer, description: "Zeilen, die schon übernommen waren - ein zweiter Aufruf legt nichts an." }
        messstellen: { type: array, items: { $ref: "#/components/schemas/Messstelle" } }
    MessstelleFehler:
      type: object
      description: >
        Die Ablehnung der Messstellen-Schnittstelle. Die Codes des Regel-Vertrags
        (docs/contracts/v2/messstelle.md §7) tragen dessen Status - aus dieser
        Schnittstelle heute `kennzeichen_format` 400, `kennzeichen_belegt` 409
        (`bestehend`), `groesse_ungueltig` 400 (`grund`, `feld`),
        `zeitpunkt_vor_vorgaenger` 422 (`vorgaenger` oder `beginn`); aus den
        Zuordnungs-Routen (IP-7) `ort_ungueltig` 422 (`grund`, `gueltig_ab`),
        `stellung_ungueltig` 422 (`grund`, `tag`, `bestehend`, `kette` oder
        `betroffen`) und `hauptzaehler_vorhanden` 409 (`bestehend`, `tag`); aus der
        Quellenbindung (IP-13) `medium_ohne_quelle` 422, `vergleich_ohne_zweck` 400,
        `quelle_passt_nicht` 422 (`grund` wertart · groesse · einheit · richtung, `kanal`),
        `zeitraum_ungueltig` 400, `kein_geraet_zum_zeitpunkt` 422 (`zeitpunkt`,
        `komponente`), `kanal_bereits_fuehrend` 409 (`bestehende_messstelle`),
        `bindung_ueberlappt` 409 (`bestehend`) und `bindung_bereits_beendet` 409
        (`gueltig_ab`, `gueltig_bis`); `anteile_summe` antworten die Kostenstellen-Anteile.
        Dazu die Codes der Schnittstelle: `anfrage_ungueltig` 400 (`feld` - fehlt,
        falsche Form, gibt es hier nicht), `zustand_passt_nicht` 409
        (`angehalten_ab`, `archiviert_am`), `zeitpunkt_in_zukunft` 422
        (`zeitpunkt`), `zuordnung_ueberlappt` 409 (an dem Tag beginnt schon eine
        Zuordnung - `grund: gleicher_tag`, `gueltig_ab`), `zuordnung_unveraendert` 400
        (schon genau so zugeordnet - `grund: ziel_ist_bisheriger_eltern`) und
        `zuordnung_ungueltig` 422 (`grund` des Ortsbaum-Vertrags:
        vor_dem_ersten_intervall · objekt_archiviert · kein_beginn_an_dem_tag) und
        `vorschlag_geaendert` 409 (die bestätigte Zeile der Vorschlagsliste gibt es
        so nicht mehr - `komponente`, `kanal`; IP-16). Den Satz baut die
        Fläche später aus den Fakten (IP-6); `message` ist der Wortlaut von AP-04
        §5.12, wo es ihn gibt.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [kennzeichen_format, kennzeichen_belegt, groesse_ungueltig, medium_ohne_quelle,
            vergleich_ohne_zweck, quelle_passt_nicht, kanal_bereits_fuehrend, zeitraum_ungueltig,
            zeitpunkt_vor_vorgaenger, bindung_ueberlappt, hauptzaehler_vorhanden, stellung_ungueltig,
            anteile_summe, ort_ungueltig, kein_geraet_zum_zeitpunkt, bindung_bereits_beendet,
            anfrage_ungueltig, zustand_passt_nicht, zeitpunkt_in_zukunft,
            zuordnung_ueberlappt, zuordnung_ungueltig, zuordnung_unveraendert, vorschlag_geaendert]
        message: { type: string }
        feld: { type: string, description: "anfrage_ungueltig, groesse_ungueltig: hauptgroesse, nebengroessen[1], zeitpunkt, gueltig_ab, anlage, stellung …" }
        grund:
          type: string
          enum: [groesse, medium, einheit, richtung, wertart,
            unbekannt, unternehmen_nur_berechnet, ziel_art_unzulaessig, ziel_gab_es_noch_nicht, ziel_archiviert,
            nicht_elektrisch, bezug_nur_bei_unterzaehler, bezug_fehlt, selbst, fremde_anlage, zyklus,
            vor_dem_ersten_intervall, objekt_archiviert, gleicher_tag, kein_beginn_an_dem_tag,
            ziel_ist_bisheriger_eltern]
          description: >
            groesse_ungueltig: das Merkmal; ort_ungueltig: unbekannt ·
            unternehmen_nur_berechnet · ziel_*; stellung_ungueltig: die Gründe von
            Vertrag §6; zuordnung_*: der Grund der Tages-Mechanik.
        bestehend:
          description: >
            kennzeichen_belegt: wer es trägt (frueher false) oder trug (frueher true).
            hauptzaehler_vorhanden, stellung_ungueltig (fremde_anlage): die bestehende
            Messstelle mit ihrer Anlage am Tag.
          oneOf:
            - type: object
              required: [kennzeichen, messstelle, name, archiviert, frueher]
              properties:
                kennzeichen: { type: string }
                messstelle: { type: string, description: "Das HEUTIGE Kennzeichen des Trägers." }
                name: { type: string, nullable: true }
                archiviert: { type: boolean }
                frueher: { type: boolean }
            - $ref: "#/components/schemas/MessstelleImBaum"
        betroffen:
          description: "stellung_ungueltig: die Messstelle, die Unterzähler der geänderten ist und dadurch in eine fremde Anlage zeigte."
          allOf: [{ $ref: "#/components/schemas/MessstelleImBaum" }]
        kette: { type: array, items: { type: string }, description: "stellung_ungueltig (zyklus): der Kreis, von der Messstelle zurück zu ihr." }
        tag: { type: string, format: date, description: "Der erste Tag, an dem Regel 8 verletzt wäre." }
        gueltig_ab: { type: string, format: date }
        beginn: { type: string, format: date-time, description: "zeitpunkt_vor_vorgaenger: der Beginn der Messstelle." }
        vorgaenger:
          type: object
          description: "zeitpunkt_vor_vorgaenger: der letzte Übergang, nach dem der neue liegen muss."
          properties:
            art: { type: string, enum: [angehalten, fortgesetzt] }
            gilt_ab: { type: string, format: date-time }
        zeitpunkt: { type: string, format: date-time }
        angehalten_ab: { type: string, format: date-time, nullable: true }
        archiviert_am: { type: string, format: date-time, nullable: true }
      example:
        code: kennzeichen_belegt
        message: "MS-13 ist bereits vergeben (Lager Halle 2 (Allgemein)). Kennzeichen sind je Unternehmen eindeutig — auch archivierte bleiben belegt."
        bestehend: { kennzeichen: MS-13, messstelle: MS-13, name: Lager Halle 2 (Allgemein), archiviert: true, frueher: false }
    MessstelleImBaum:
      type: object
      description: Eine Messstelle mit der Anlage, in der sie am Tag steht.
      required: [kennzeichen, name, anlage]
      properties:
        kennzeichen: { type: string, example: MS-01 }
        name: { type: string, nullable: true, example: Netzbezug Halle 1 }
        anlage: { type: string, format: uuid }
    DatenquelleBox:
      type: object
      description: Eine Box, wie ein Satz sie nennt - Kundenname, sonst die Geräte-ID vom Aufkleber; null bei einer entfernten Box.
      required: [id, name, heimat_anlage]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true }
        heimat_anlage: { type: string, format: uuid, nullable: true }
    DatenquelleZeitraum:
      type: object
      description: Box · ab · bis, halboffen auf die Minute; `effective_to` null = offen.
      required: [box, effective_from, effective_to]
      properties:
        box: { $ref: "#/components/schemas/DatenquelleBox" }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time, nullable: true }
    Datenquelle:
      type: object
      required: [id, kennzeichen, name, anlage, protokoll, adresse, geraete_ids, netz, mehrere_leser,
        steuerquelle, vergleichsquelle, kadenz_s, archiviert_am, zustaendige_box, zeitraeume]
      properties:
        id: { type: string, format: uuid }
        kennzeichen: { type: string, pattern: "^[A-Z0-9./-]{2,16}$", example: DQ-6 }
        name: { type: string, nullable: true }
        anlage: { type: string, format: uuid, description: "Die Anlage, in der die Geräte verdrahtet sind." }
        protokoll: { type: string, enum: [modbus_tcp, sunspec_modbus, mqtt, http, ocpp, solarman_v5] }
        adresse: { type: string, example: "192.168.30.10:502" }
        geraete_ids: { type: array, items: { type: integer, minimum: 0 } }
        netz: { type: string, nullable: true }
        mehrere_leser: { type: boolean }
        steuerquelle: { type: boolean }
        vergleichsquelle: { type: boolean, description: "Bestätigte Vergleichsquelle (Vertrag §6) - gekennzeichnet, ohne Bewertung." }
        kadenz_s: { type: integer, minimum: 1, maximum: 86400, nullable: true, description: "null = nicht erhoben (eine aus dem Bestand übernommene Quelle, deren Komponenten keinen Takt nennen, IP-4)." }
        archiviert_am: { type: string, format: date-time, nullable: true }
        zustaendige_box:
          allOf: [{ $ref: "#/components/schemas/DatenquelleBox" }]
          nullable: true
          description: Die Box, deren Zeitraum JETZT läuft; null ohne (Entwurf, Lücke, erst geplant).
        zeitraeume: { type: array, items: { $ref: "#/components/schemas/DatenquelleZeitraum" } }
    DatenquelleListe:
      type: object
      required: [datenquellen]
      properties:
        datenquellen: { type: array, items: { $ref: "#/components/schemas/Datenquelle" } }
    DatenquelleAnlegen:
      type: object
      required: [name, protokoll, adresse, kadenz_s]
      properties:
        name: { type: string, maxLength: 120 }
        protokoll: { type: string, enum: [modbus_tcp, sunspec_modbus, mqtt, http, ocpp, solarman_v5] }
        adresse: { type: string }
        geraete_ids: { type: array, items: { type: integer, minimum: 0 } }
        netz: { type: string, nullable: true }
        mehrere_leser: { type: boolean, default: false }
        steuerquelle: { type: boolean, default: false }
        kadenz_s: { type: integer, minimum: 1, maximum: 86400 }
        device_id: { type: string, format: uuid, description: "Die gewählte Box - prüft die Regeln vor der Prüfung schon beim Anlegen." }
        vergleich_bestaetigt: { type: boolean, default: false }
    DatenquelleBearbeiten:
      type: object
      description: Die volle Darstellung (fehlend = leer bzw. nein).
      required: [name, protokoll, adresse, kadenz_s]
      properties:
        name: { type: string, maxLength: 120 }
        protokoll: { type: string, enum: [modbus_tcp, sunspec_modbus, mqtt, http, ocpp, solarman_v5] }
        adresse: { type: string }
        geraete_ids: { type: array, items: { type: integer, minimum: 0 } }
        netz: { type: string, nullable: true }
        mehrere_leser: { type: boolean, default: false }
        steuerquelle: { type: boolean, default: false }
        kadenz_s: { type: integer, minimum: 1, maximum: 86400 }
    DatenquelleZuweisen:
      type: object
      required: [device_id]
      properties:
        device_id: { type: string, format: uuid }
        effective_from: { type: string, format: date-time, description: "Volle Minute mit Versatz; fehlend = jetzt (auf die Minute abgerundet)." }
        vergleich_bestaetigt: { type: boolean, default: false }
    DatenquelleZugewiesen:
      type: object
      required: [urteil, text, hinweis, vergleichsquelle, datenquelle]
      properties:
        urteil: { type: string, enum: [erlaubt] }
        text: { type: string, example: "Ab 10.04.2027 07:30 liest Box Halle 2 (neu)" }
        hinweis: { type: string, nullable: true, example: "Gleiche Adresse wie DQ-4 — anderes Netz" }
        vergleichsquelle: { type: boolean }
        datenquelle: { $ref: "#/components/schemas/Datenquelle" }
    DatenquellePruefen:
      type: object
      required: [device_id, unit_id]
      properties:
        device_id: { type: string, format: uuid }
        unit_id: { type: integer, minimum: 0, maximum: 255 }
        register: { type: integer, minimum: 0, maximum: 65535, description: "Bei Modbus TCP Pflicht, bei SunSpec-Modbus 40000." }
        register_kind: { type: string, enum: [holding, input], default: holding }
        data_type: { type: string, enum: [u16, s16, u32, s32, float32] }
        word_order: { type: string, enum: [big, little] }
    DatenquellePruefergebnis:
      type: object
      required: [box, adresse, ergebnis, gewertet, text, zeitpunkt, dauer_ms, antwort]
      properties:
        box: { $ref: "#/components/schemas/DatenquelleBox" }
        adresse: { type: string }
        ergebnis:
          type: string
          nullable: true
          description: "ok, eine Fehlerklasse der Box (unreachable, no_answer, invalid_response, implausible, fronius_api, timeout, layout_changed, budget), box_meldet_sich_nicht oder ein Wort des Prüf-Kanals."
        gewertet: { type: boolean, description: "Zählt für eine Zuständigkeit und steht im Protokoll." }
        text: { type: string, example: "Box Halle 2 (neu) erreicht 192.168.10.31:502 nicht — Netz/VLAN prüfen (Bogen D1/D2)" }
        zeitpunkt: { type: string, format: date-time }
        dauer_ms: { type: integer, minimum: 0 }
        antwort:
          allOf: [{ $ref: "#/components/schemas/ProbeResult" }]
          nullable: true
          description: Die rohe Antwort der Box; null, wenn sie nicht geantwortet hat.
    DatenquelleProtokollEintrag:
      type: object
      required: [id, art, box, ergebnis, alt, neu, gilt_ab, urheber, zeitpunkt]
      properties:
        id: { type: integer, format: int64 }
        art: { type: string, enum: [angelegt, bearbeitet, erreichbarkeit_geprueft, zustaendigkeit_begonnen, zustaendigkeit_gewechselt, aus_bestand_uebernommen] }
        box:
          allOf: [{ $ref: "#/components/schemas/DatenquelleBox" }]
          nullable: true
        ergebnis: { type: string, nullable: true }
        alt: { type: object, nullable: true, additionalProperties: true }
        neu: { type: object, nullable: true, additionalProperties: true }
        gilt_ab: { type: string, format: date-time }
        urheber:
          type: object
          required: [name, rolle, art]
          properties:
            name: { type: string }
            rolle: { type: string, nullable: true }
            art: { type: string, enum: [kunde, unterstuetzung, voltpilot, notfall] }
        zeitpunkt: { type: string, format: date-time }
    DatenquelleProtokoll:
      type: object
      required: [eintraege]
      properties:
        eintraege: { type: array, items: { $ref: "#/components/schemas/DatenquelleProtokollEintrag" } }
    DatenquelleVorschlagKomponente:
      type: object
      required: [id, name, art]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true, description: "Der Kundenname der Komponente; null = keiner vergeben." }
        art: { type: string, nullable: true, example: battery-hybrid }
    DatenquelleVorschlag:
      type: object
      description: >
        EINE Quelle, die `box` ab `ab` (dem Reihenbeginn) ohnehin liest. `kennzeichen`
        bekäme sie, wenn alles (oder der Anfang der Liste) bestätigt wird - vergeben wird
        es erst beim Speichern. `grund` null: übernehmbar; sonst der Grund des Vertrags
        (`adresse_an_box_vergeben`), `text` der Satz dazu.
      required: [kennzeichen, box, protokoll, adresse, geraete_ids, kadenz_s, steuerquelle, ab,
        komponenten, grund, text]
      properties:
        kennzeichen: { type: string, example: DQ-3 }
        box: { $ref: "#/components/schemas/DatenquelleBox" }
        protokoll: { type: string, enum: [modbus_tcp, sunspec_modbus, mqtt, http, ocpp, solarman_v5] }
        adresse: { type: string, example: "192.168.10.31:502" }
        geraete_ids: { type: array, items: { type: integer, minimum: 0 } }
        kadenz_s: { type: integer, nullable: true, description: "Der kleinste bekannte Lesetakt der Komponenten; null = von keiner erhoben." }
        steuerquelle: { type: boolean }
        ab: { type: string, format: date-time, description: "Reihenbeginn - der Beginn der Zuständigkeit, auf die Minute." }
        komponenten: { type: array, items: { $ref: "#/components/schemas/DatenquelleVorschlagKomponente" } }
        grund: { type: string, nullable: true, enum: [adresse_an_box_vergeben, null] }
        text: { type: string, example: "Ab 12.03.2024 00:00 liest Box Halle 1" }
    DatenquelleAusgelassen:
      type: object
      required: [komponente, grund, protokoll, anker, text]
      properties:
        komponente: { $ref: "#/components/schemas/DatenquelleVorschlagKomponente" }
        grund: { type: string, enum: [keine_box, keine_adresse, protokoll_unbekannt, anker_ohne_vorschlag] }
        protokoll: { type: string, nullable: true, description: "protokoll_unbekannt: das verworfene Wort - die Rückwand für einen Transport, den keine Vorlage und kein Treiber trägt (z. B. opc_ua)." }
        anker:
          allOf: [{ $ref: "#/components/schemas/DatenquelleVorschlagKomponente" }]
          nullable: true
          description: "anker_ohne_vorschlag: der Wechselrichter, über den gelesen wird."
        text: { type: string }
    DatenquelleVorschlagsliste:
      type: object
      required: [fuehrende_box, fuehrung, vorschlaege, ausgelassen]
      properties:
        fuehrende_box:
          allOf: [{ $ref: "#/components/schemas/DatenquelleBox" }]
          nullable: true
        fuehrung: { type: string, enum: [gespeichert, speicher, einzige, keine_wahl, keine_box, gespeichert_nicht_in_anlage] }
        vorschlaege: { type: array, items: { $ref: "#/components/schemas/DatenquelleVorschlag" } }
        ausgelassen: { type: array, items: { $ref: "#/components/schemas/DatenquelleAusgelassen" } }
    DatenquelleBestaetigt:
      type: object
      description: Ein bestätigter Vorschlag - genau so, wie das GET ihn zeigte.
      required: [device_id, protokoll, adresse, komponenten]
      properties:
        device_id: { type: string, format: uuid, description: "Die Box des Vorschlags (`box.id`)." }
        protokoll: { type: string }
        adresse: { type: string }
        komponenten: { type: array, minItems: 1, items: { type: string, format: uuid } }
    DatenquelleUebernehmen:
      type: object
      required: [vorschlaege]
      properties:
        vorschlaege: { type: array, minItems: 1, items: { $ref: "#/components/schemas/DatenquelleBestaetigt" } }
    DatenquelleUebernommen:
      type: object
      required: [neu, unveraendert, datenquellen]
      properties:
        neu: { type: integer, description: "Angelegte Quellen." }
        unveraendert: { type: integer, description: "Schon übernommene Vorschläge - ein zweiter Aufruf legt nichts an." }
        datenquellen: { type: array, items: { $ref: "#/components/schemas/Datenquelle" }, description: "In der Reihenfolge der Anfrage." }
    DatenquelleFehler:
      type: object
      description: >
        Die Ablehnung der Datenquellen-Schnittstelle. Die Gründe des Vertrags
        (docs/contracts/v2/data-source-assignment.md §4/§5) mit ihrem Satz und `urteil`;
        der Vertrag nennt keinen HTTP-Status, die Schnittstelle genau einen je Grund:
        400 `protokoll_unbekannt`; 422 `keine_volle_minute`, `rueckwirkend`,
        `leerer_zeitraum`; 409 `steuerquelle`, `spaeterer_wechsel_geplant`,
        `schon_zustaendig`, `ueberschneidung`, `adresse_an_box_vergeben`,
        `netzlage_fehlt`, `nur_ein_leser`, `vergleich_bestaetigen` (urteil
        `bestaetigung_noetig`), `pruefung_fehlt`, `pruefung_gescheitert`. Dazu die
        Codes der Schnittstelle: `anfrage_ungueltig` 400 (`feld`), `weg_fest` 409
        (`felder`), `quelle_archiviert` 409 (`kennzeichen`),
        `pruefung_nicht_moeglich` 422 (`protokoll`), `gleichzeitig_geaendert` 409
        (`grund`), und für die Bestands-Übernahme (IP-4) `komponente_hat_quelle` 409
        (`komponenten`, `datenquellen`) und `vorschlag_geaendert` 409 (`device_id`,
        `protokoll`, `adresse`).
      required: [code, message]
      properties:
        code:
          type: string
          enum: [protokoll_unbekannt, keine_volle_minute, leerer_zeitraum, rueckwirkend, steuerquelle,
            spaeterer_wechsel_geplant, schon_zustaendig, ueberschneidung, adresse_an_box_vergeben,
            netzlage_fehlt, nur_ein_leser, vergleich_bestaetigen, pruefung_fehlt, pruefung_gescheitert,
            anfrage_ungueltig, weg_fest, quelle_archiviert, pruefung_nicht_moeglich, gleichzeitig_geaendert,
            komponente_hat_quelle, vorschlag_geaendert]
        message: { type: string }
        urteil: { type: string, enum: [abgelehnt, bestaetigung_noetig] }
        feld: { type: string, description: "anfrage_ungueltig: device_id, adresse, register …" }
        felder: { type: array, items: { type: string }, description: "weg_fest: die festen Felder, die sich ändern sollten." }
        kennzeichen: { type: string }
        protokoll: { type: string }
        grund: { type: string, description: "gleichzeitig_geaendert: der Grund des Constraints, der gegriffen hat." }
        komponenten: { type: array, items: { type: string, format: uuid }, description: "komponente_hat_quelle: die Komponenten, die inzwischen eine Quelle haben." }
        datenquellen: { type: array, items: { type: string }, description: "komponente_hat_quelle: deren Kennzeichen." }
        device_id: { type: string, format: uuid, description: "vorschlag_geaendert / komponente_hat_quelle: die Box des bestätigten Vorschlags." }
        adresse: { type: string }
      example:
        code: steuerquelle
        message: "Diese Quelle steuert — ihre Box kann erst mit der gemeinsamen Steuerung wechseln"
        urteil: abgelehnt
    Geraet:
      type: object
      description: >
        Ein Einbau - das konkret eingebaute Gerät (AP-04 IP-10). Zeitpunkte auf die
        Minute mit dem Versatz von Europe/Berlin. `null` heißt nicht erhoben - nie
        geraten; `ausgebaut_am: null` heißt eingebaut.
      required: [id, site_id, kennzeichen, einbau_kennzeichen, geraeteart, hersteller, typ,
        seriennummer, bezeichnung, data_source_id, geraete_id, eingebaut_am, ausgebaut_am,
        aus_bestand, komponenten, teile, vorgaenger]
      properties:
        id: { type: string, format: uuid }
        site_id: { type: string, format: uuid, description: "Die Anlage, in der das Gerät verdrahtet ist." }
        kennzeichen: { type: string, description: "Das Gerät (GR-4) - bleibt über einen Wechsel an derselben Stelle." }
        einbau_kennzeichen: { type: string, description: "Das konkret eingebaute Gerät (Z-5a); ohne Wechsel = kennzeichen." }
        geraeteart:
          type: string
          enum: [zaehler, wechselrichter, controller, ladestation, speicher, sonstiges]
          description: "Die Energiekarte ist ein Teil des Controllers (teile), keine Geräteart."
        hersteller: { type: string, nullable: true }
        typ: { type: string, nullable: true }
        seriennummer: { type: string, nullable: true }
        bezeichnung: { type: string, nullable: true }
        data_source_id: { type: string, format: uuid, nullable: true, description: "Die Datenquelle, über die das Gerät antwortet (AP-06); null = noch keine angelegt." }
        geraete_id: { type: integer, minimum: 0, nullable: true, description: "Die Geräte-ID hinter der Quelle (Modbus-Unit-ID)." }
        eingebaut_am: { type: string, format: date-time }
        ausgebaut_am: { type: string, format: date-time, nullable: true }
        aus_bestand: { type: boolean, description: "Aus der Komponente abgeleitet (Bestand oder Anlege-Weg, dieselbe Regel): eingebaut_am ist der Beginn ihres Verlaufs in VoltPilot, nicht der Einbautag." }
        komponenten:
          type: array
          items: { $ref: "#/components/schemas/GeraetKomponente" }
        teile:
          type: array
          items: { $ref: "#/components/schemas/GeraetTeil" }
        vorgaenger:
          type: array
          description: "Die früheren Einbauten desselben Geräts, der jüngste zuerst."
          items: { $ref: "#/components/schemas/GeraetVorgaenger" }
    GeraetKomponente:
      type: object
      description: >
        Ein Zeitraum, in dem der Einbau die Komponente speist, halboffen [ab, bis);
        `gueltig_bis: null` heißt bis auf Weiteres. Über eine Karte (`teil_id`,
        `steckplatz`) oder direkt (null). Je Komponente und Zeitpunkt EIN Gerät.
      required: [entity_id, teil_id, steckplatz, gueltig_ab, gueltig_bis]
      properties:
        entity_id: { type: string, format: uuid, description: "Die Komponente." }
        teil_id: { type: string, format: uuid, nullable: true }
        steckplatz: { type: integer, nullable: true }
        gueltig_ab: { type: string, format: date-time }
        gueltig_bis: { type: string, format: date-time, nullable: true }
    GeraetTeil:
      type: object
      description: "Eine Energiekarte im Steckplatz eines Controllers (AP-05 E4: Identität = Gerät + Steckplatz)."
      required: [id, teilart, steckplatz, bezeichnung, typ, seriennummer, eingebaut_am, ausgebaut_am]
      properties:
        id: { type: string, format: uuid }
        teilart: { type: string, enum: [energiekarte] }
        steckplatz: { type: integer, minimum: 0, nullable: true, description: "null = nicht erhoben." }
        bezeichnung: { type: string, nullable: true }
        typ: { type: string, nullable: true }
        seriennummer: { type: string, nullable: true }
        eingebaut_am: { type: string, format: date-time }
        ausgebaut_am: { type: string, format: date-time, nullable: true }
    GeraetVorgaenger:
      type: object
      description: "Ein früherer Einbau desselben Geräts."
      required: [id, einbau_kennzeichen, hersteller, typ, seriennummer, eingebaut_am, ausgebaut_am]
      properties:
        id: { type: string, format: uuid }
        einbau_kennzeichen: { type: string }
        hersteller: { type: string, nullable: true }
        typ: { type: string, nullable: true }
        seriennummer: { type: string, nullable: true }
        eingebaut_am: { type: string, format: date-time }
        ausgebaut_am: { type: string, format: date-time, nullable: true }
    ProtokollUrheber:
      type: object
      description: >
        Wer den Eintrag geschrieben hat, im Akteur-Vokabular von AP-03. `rolle` und
        `art` sind null, wo das Journal sie nicht festhaelt (die Eintraege der
        Ortsstruktur, bis AP-03 IP-7 die Journale vereinheitlicht) - nie geraten.
      required: [name, rolle, art]
      properties:
        name: { type: string, example: "Ines Kaltenbach" }
        rolle: { type: string, nullable: true, enum: [kundenadministrator, energiemanager, bearbeiter, bedienberechtigt, leser, unterstuetzer, voltpilot_betrieb, null] }
        art: { type: string, nullable: true, enum: [kunde, unterstuetzung, voltpilot, notfall, null] }
    ProtokollBezug:
      type: object
      description: >
        Das Objekt, um das es geht. `kennzeichen` ist MS-06, DQ-1 oder das
        Kurzzeichen eines Ortes - null, wo die Art keins traegt. `name` ist null,
        wenn das Objekt geloescht wurde: das Protokoll ueberlebt es.
      required: [art, id, kennzeichen, name]
      properties:
        art: { type: string, enum: [messstelle, datenquelle, unternehmen, standort, gebaeude, bereich, anlage] }
        id: { type: string, format: uuid }
        kennzeichen: { type: string, nullable: true, example: MS-06 }
        name: { type: string, nullable: true, example: "Hauptzaehler Werk" }
    ProtokollEintrag:
      type: object
      description: >
        Ein Eintrag. `id` ist Herkunft und laufende Nummer zusammen
        ("messstelle:42") - die drei Journale zaehlen unabhaengig voneinander.
        `text` ist der Kundensatz "was wurde geaendert", gebaut allein aus
        `alt`/`neu`; `grund` ist die Begruendung, die der Schreiber mitgegeben hat
        (null = keine).
      required: [id, quelle, art, text, bezug, gilt_ab, eingetragen_am, zeitform, grund, urheber, alt, neu]
      properties:
        id: { type: string, example: "messstelle:42" }
        quelle: { type: string, enum: [messstelle, ort, datenquelle], description: "Aus welchem Journal der Eintrag stammt." }
        art: { type: string, example: zaehler_gewechselt, description: "Der Code des Eintrags in seinem Journal." }
        text: { type: string, example: "Zaehler gewechselt: Z-5a -> Z-5b" }
        bezug: { $ref: "#/components/schemas/ProtokollBezug" }
        gilt_ab: { type: string, format: date-time, description: "WANN die Aenderung gilt." }
        eingetragen_am: { type: string, format: date-time, description: "WANN sie eingetragen wurde." }
        zeitform: { type: string, enum: [rueckwirkend, angekuendigt, sofort], description: "Das Urteil ueber die beiden Zeitpunkte; `rueckwirkend` ist das gespeicherte Urteil des Schreibwegs." }
        grund: { type: string, nullable: true }
        urheber: { $ref: "#/components/schemas/ProtokollUrheber" }
        alt: { type: object, nullable: true, additionalProperties: true, description: "Der Stand davor - bei `bearbeitet` NUR die geaenderten Felder." }
        neu: { type: object, nullable: true, additionalProperties: true }
    Protokoll:
      type: object
      description: >
        Das Aenderungsprotokoll (UEMS AP-04 IP-21), juengster Eintrag zuerst.
        `achse` sagt, WELCHE Zeitachse gefiltert und sortiert hat - sie steht in der
        ANTWORT, damit sie niemand verwechselt. `von`/`bis` ist der Zeitraum,
        halboffen [von, bis); null heisst ohne Grenze. `weiter` ist der
        Fortsetzungszeiger fuer die naechste Seite - null, wenn es keine gibt.
      required: [eintraege, achse, von, bis, weiter]
      properties:
        eintraege:
          type: array
          items: { $ref: "#/components/schemas/ProtokollEintrag" }
        achse: { type: string, enum: [wirkung, eintrag] }
        von: { type: string, format: date-time, nullable: true }
        bis: { type: string, format: date-time, nullable: true }
        weiter: { type: string, nullable: true, example: "1763458800000:messstelle:42" }
    GeraetListe:
      type: object
      required: [geraete]
      properties:
        geraete:
          type: array
          items: { $ref: "#/components/schemas/Geraet" }
    Einstellungen:
      type: object
      description: >
        Die Einstellungen eines Einbaus (UEMS AP-04 IP-11). `geraet`/`einbau`
        sind die Kennzeichen des Geräts und des konkret eingebauten (GR-4 /
        Z-5b); `gueltig` je Quelle und Art die zum `stichtag` gültige Fassung.
      required: [geraet_id, geraet, einbau, stichtag, gueltig, historie]
      properties:
        geraet_id: { type: string, format: uuid }
        geraet: { type: string }
        einbau: { type: string }
        stichtag: { type: string, format: date-time }
        gueltig:
          type: array
          items: { $ref: "#/components/schemas/EinstellungFassung" }
        historie:
          type: array
          items: { $ref: "#/components/schemas/EinstellungFassung" }
    EinstellungFassung:
      type: object
      description: >
        Eine Fassung, halboffen [gueltig_ab, gueltig_bis) auf die Minute;
        `gueltig_bis` null = bis auf Weiteres. Quelle = der Einbau
        (`entity_id` null), eine Komponente, die er speist, oder ein Kanal dieser
        Komponente. `wert` je Art (quelle-einstellung.md §2): wandler_strom
        {primaer_a, sekundaer_a} · wandler_spannung {primaer_v, sekundaer_v} ·
        skalierung {faktor} oder {automatisch: true} · offset {wert, einheit} ·
        vorzeichen_umgekehrt {umgekehrt} · impulswertigkeit {impulse_je_kwh} ·
        zaehlerkonstante {je_kwh}. `zustellung`: verbindung (die Box wendet sie
        mit der Verbindung der Komponente an - Bestand und Hebel), ausstehend
        (angewendet eingetragen, Zustellung AP-06) oder null (im Gerät
        eingestellt, nur dokumentiert). `wert_text`/`anwendung_text` sind die
        Kundensätze des Vertrags („1.000/5 A", „angewendet - Zustellung
        ausstehend").
      required: [id, entity_id, kanal, art, art_kundenwort, wert, wert_text, anwendung, anwendung_text,
        zustellung, herkunft, gueltig_ab, gueltig_bis, status, tatsaechlich_ab, rueckwirkend,
        begruendung, eingetragen]
      properties:
        id: { type: string, format: uuid }
        entity_id: { type: string, format: uuid, nullable: true }
        kanal: { type: string, nullable: true }
        art:
          type: string
          enum: [wandler_strom, wandler_spannung, skalierung, offset, vorzeichen_umgekehrt,
            impulswertigkeit, zaehlerkonstante]
        art_kundenwort: { type: string }
        wert: { type: object, additionalProperties: true }
        wert_text: { type: string }
        anwendung: { type: string, enum: [angewendet, dokumentiert] }
        anwendung_text: { type: string }
        zustellung: { type: string, enum: [verbindung, ausstehend], nullable: true }
        herkunft: { type: string, enum: [bestand, verbindung, eintrag] }
        gueltig_ab: { type: string, format: date-time }
        gueltig_bis: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [geplant, gueltig, beendet] }
        tatsaechlich_ab: { type: string, format: date-time, nullable: true }
        rueckwirkend: { type: boolean }
        begruendung: { type: string, nullable: true }
        eingetragen: { $ref: "#/components/schemas/EinstellungEintrag" }
    EinstellungEintrag:
      type: object
      description: >
        Das Protokoll an der Quelle: wann, von wem (Anzeigename), mit welcher
        Rolle und welcher Art Urheber (AP-03: kunde · unterstuetzung ·
        voltpilot · notfall). Der Bestand ist VoltPilot selbst.
      required: [am, von, rolle, art]
      properties:
        am: { type: string, format: date-time }
        von: { type: string }
        rolle: { type: string, nullable: true }
        art: { type: string, enum: [kunde, unterstuetzung, voltpilot, notfall] }
    EinstellungNeu:
      type: object
      description: >
        Eine neue Fassung. Ohne `entity_id` gilt sie für den Einbau; `kanal` nur
        mit `entity_id`. `gueltig_ab` auf der vollen Minute (Sekunden werden nie
        gerundet). `tatsaechlich_ab`: wann die Änderung wirklich geschah, wenn
        früher - der Zeitraum dazwischen ist mit der vorigen Fassung erfasst
        (Folgen-Satz, Korrektur AP-08). Ein Feld, das es hier nicht gibt, ist 400.
      required: [art, wert, anwendung, gueltig_ab]
      additionalProperties: false
      properties:
        entity_id: { type: string, format: uuid, nullable: true }
        kanal: { type: string, nullable: true, maxLength: 240 }
        art:
          type: string
          enum: [wandler_strom, wandler_spannung, skalierung, offset, vorzeichen_umgekehrt,
            impulswertigkeit, zaehlerkonstante]
        wert: { type: object, additionalProperties: true }
        anwendung: { type: string, enum: [angewendet, dokumentiert] }
        gueltig_ab: { type: string, format: date-time }
        tatsaechlich_ab: { type: string, format: date-time, nullable: true }
        begruendung: { type: string, nullable: true, maxLength: 500 }
    EinstellungEingetragen:
      type: object
      description: >
        Die eingetragene Fassung, die Fassung, die sie beendet hat (null ohne
        Vorgänger), die Folgen-Sätze (AP-04 §5.7, A5) und die Kennzeichen der
        Messstellen, an denen sie protokolliert ist.
      required: [fassung, beendet, folgen, messstellen]
      properties:
        fassung: { $ref: "#/components/schemas/EinstellungFassung" }
        beendet:
          allOf: [{ $ref: "#/components/schemas/EinstellungFassung" }]
          nullable: true
        folgen:
          type: array
          items: { type: string }
        messstellen:
          type: array
          items: { type: string }
    EinstellungFehler:
      type: object
      description: >
        Die Ablehnung der Einstellungs-Schnittstelle. Die Codes des Vertrags
        (quelle-einstellung.md §4) mit ihrem Status: `wert_ungueltig` 400
        (`art`, `felder`), `zeitpunkt_ungueltig` 400, `vor_beginn` 422
        (`beginn`), `nach_ende` 422 (`ende`), `tatsaechlich_ungueltig` 422,
        `beginn_belegt` 409 (`bestehend`), `unveraendert` 400. Dazu die der
        Schnittstelle: `anfrage_ungueltig` 400 (`feld`) und `keine_speisung` 422
        (`entity_id` - die Komponente wird von diesem Einbau nie gespeist).
      required: [code, message]
      properties:
        code:
          type: string
          enum: [wert_ungueltig, zeitpunkt_ungueltig, vor_beginn, nach_ende, tatsaechlich_ungueltig,
            beginn_belegt, unveraendert, anfrage_ungueltig, keine_speisung]
        message: { type: string }
        feld: { type: string }
        art: { type: string }
        felder: { type: array, items: { type: string } }
        beginn: { type: string, format: date-time }
        ende: { type: string, format: date-time }
        entity_id: { type: string, format: uuid }
        bestehend:
          type: object
          properties:
            id: { type: string, format: uuid }
            wert_text: { type: string }
