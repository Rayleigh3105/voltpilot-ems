      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Findings + blocking verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowValidationResult" }
        "404": { description: Not found. }
  /api/v1/admin/sites/{siteId}/flows/{flowId}/versions/{version}/simulate:
    post:
      tags: [admin]
      summary: Start the flow dry-run (Ersparnis-Simulation mapping).
      description: >
        Compiles the flow to its deterministic simulation mapping (a market or
        peak-shaving strategy -> the voltpilot scenario incl. its
        Speicherschonung) and submits an
        Ersparnis-Simulation job over the site's real master data. 422 with a
        German reason for an invalid flow or one without a battery strategy.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
