        action: { type: string }
        connectorId: { type: integer, minimum: 0 }
        transactionId: { type: integer, nullable: true }
        request: { type: object, additionalProperties: true, description: "Exakte, aktionsspezifisch validierte und an den Intent gebundene Nutzlast." }
    OcppActionIntent:
      type: object
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        phrase: { type: string, description: "Kurzlebige Bestätigung; kein Geheimnis." }
