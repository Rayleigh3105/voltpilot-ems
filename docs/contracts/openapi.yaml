openapi: 3.1.0
info:
  title: Voltpilot-EMS Portal API
  version: 0.1.0-mvp
  description: >
    OpenAPI contract for the portal backend (Spring Boot). BINDING contract
    (architecture section 20 item 8). Covers the MVP portal surface: auth-guarded
    tenancy, device claiming, telemetry and schedule views, and economic KPIs
    (architecture section 4).


    Every non-system endpoint requires a Keycloak-issued Bearer JWT (realm
    `voltpilot`). The `tenant_id` claim scopes all data via Postgres
    Row-Level-Security - a caller only ever sees its own tenant's rows; another
    tenant's resources return 404 (not found) rather than 403. The
    sites/devices/telemetry/prices/weather/schedule and device-claim endpoints
    are implemented in services/api; KPIs remain a stub pending a later
    increment.
  contact:
    name: Voltpilot-EMS
servers:
  - url: http://localhost:8090
    description: Local dev (docker compose / `mvn spring-boot:run`)
security:
  - bearerAuth: []
tags:
  - name: system
  - name: registration
    description: >
      Public self-service registration: a new customer creates their own tenant
      and login in one step (no operator involved). Unauthenticated by design;
      can be disabled platform-wide via VOLTPILOT_REGISTRATION_ENABLED=false.
  - name: sites
  - name: devices
  - name: enrollment
    description: >
      First-boot device enrollment over HTTPS (the "kinderleicht" mTLS
      onboarding): a fresh edge device knows only its printed reference and the
      portal URL. It generates a keypair ON the device, uploads the CSR (the
      private key never travels), and polls for its certificate. Once the
      customer claims the reference in the portal, the poll returns a
      device-CA-signed client certificate - identity ENFORCED from the claim
      (CN=device_id, O=tenant_id, OU=site_id + SPIFFE URI SAN), never from the
      CSR - plus the CA and broker connection params for the mTLS listener
      (8883). Unauthenticated by design and strictly rate-limited; a pending
      reference answers exactly like an unknown one, so polling cannot
      enumerate refs. Polling etiquette for device agents: start at ~10 s
      intervals, back off to >= 60 s after the first minutes, and keep polling
      indefinitely (claiming may happen days after first boot); on 429 back
      off harder (>= 5 min). Disabled unless the deployment stages the device
      CA (VOLTPILOT_ENROLLMENT_ENABLED; see docker-compose.prod.yml).
  - name: telemetry
  - name: market
  - name: weather
  - name: schedules
  - name: history
  - name: registry
    description: >
      Optional MaStR "Anlage verknüpfen" step: look a unit up in the German
      Marktstammdatenregister (preview only), then persist the
      customer-confirmed values onto the site's assets. Tenant-scoped like all
      site endpoints (foreign site = 404 via RLS).
  - name: kpis
  - name: admin
    description: >
      Platform-admin API (Portal-Admins only). Every operation requires the
      `platform-admin` realm role and is refused with 403 for customer tokens
      (`operator`). These endpoints are cross-tenant by design and do NOT rely on
      the tenant_id claim / RLS; they use a dedicated admin database role and the
      Keycloak Admin API.
paths:
  /health:
    get:
      tags: [system]
      summary: Liveness/readiness (Spring Boot Actuator).
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: UP }
  /api/v1/registration:
    post:
      tags: [registration]
      summary: Self-register - create a tenant and its first login in one step.
      description: >
        The front door of customer onboarding. Creates a B2C tenant named after
        the customer and a Keycloak user (username = email, `tenant_id` attribute
        + customer role), so the standard OIDC + RLS spine isolates the new
        account exactly like operator-provisioned customers. If the user cannot
        be created (e.g. email already registered), the tenant is rolled back -
        no orphans. Implemented in services/api (RegistrationController).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationRequest" }
      responses:
        "201":
          description: Account created; the customer can now log in via OIDC.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationResponse" }
        "400": { description: Invalid input (blank name, invalid email, password shorter than 8 chars). }
        "409": { description: An account with this email already exists. }
        "429": { description: Too many registration attempts (sliding-window rate limit per client address plus a global cap; nothing was created). }
  /api/v1/enrollment/{ref}/csr:
    post:
      tags: [enrollment]
      summary: Upload the device-generated CSR for a reference (first boot).
      description: >
        Stores the pending CSR keyed by the canonical reference (trimmed;
        VP- sticker refs uppercased, exactly like the claim endpoint). The CSR
        must be a PEM PKCS#10 request, self-signed by the enclosed key (proof
        of possession), with an RSA >= 2048 or EC P-256/P-384 key; the subject
        it requests is irrelevant - issuance overrides it with the
        claim-derived identity. Sticker refs (VP-) must exist in the
        provisioned-device registry (422 otherwise). Idempotent per ref:
        re-POSTing replaces the pending CSR until a certificate is issued;
        afterwards the enrolled key is fixed (409) and re-keying goes through
        the operator (revoke + unclaim/re-claim). Implemented in services/api
        (EnrollmentController).
      security: []
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
          description: The device reference printed on the device (Edge-Referenz / sticker Geräte-ID).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentCsrRequest" }
      responses:
        "202":
          description: CSR stored; poll GET .../certificate until the ref is claimed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentPending" }
        "400": { description: Invalid reference, or the CSR is unparsable / badly signed / off key policy. }
        "409": { description: A certificate was already issued for this reference (the enrolled key is fixed). }
        "422": { description: Unknown sticker Geräte-ID (not in the provisioned-device registry). }
        "429": { description: Rate limit (per client address + global sliding window). Back off >= 5 min. }
  /api/v1/enrollment/{ref}/certificate:
    get:
      tags: [enrollment]
      summary: Poll for the issued device certificate (long-poll-friendly 404 while pending).
      description: >
        404 with body status=pending while the reference is unclaimed - and
        identically for a reference that was never enrolled (no enumeration).
        Once the reference is claimed in the portal, the response carries the
        CA-signed client certificate (subject CN=device_id, O=tenant_id,
        OU=site_id, SPIFFE URI SAN), the CA PEM to verify the broker, the
        broker host/port and the topic identity. The certificate stays
        retrievable for device retries (the private key is the secret and
        never left the device); the per-device broker ACL grant is written at
        issuance. Revocation stays the operator kill switch
        (tools/pki/voltpilot-ca.sh revoke - api-issued certs are recorded in
        the same CA database). After an unclaim the poll returns to pending;
        a re-claim re-issues against the stored CSR with the new identity.
      security: []
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Certificate issued (or re-fetched) - the device switches to mTLS operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentCertificate" }
        "400": { description: Invalid reference. }
        "404":
          description: Pending (unclaimed ref, unknown ref, or no CSR yet - deliberately indistinguishable). Keep polling with backoff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentPending" }
        "429": { description: Rate limit. Back off >= 5 min. }
  /api/v1/overview:
    get:
      tags: [sites]
      summary: Tenant-wide fleet overview for the adaptive Uebersicht.
      description: >
        One aggregate for the portal's fleet mode (customers with several
        sites): per site the device status (liveness from each device's newest
        telemetry ARRIVAL, the store-and-forward rule), the newest live
        telemetry snapshot, and today's planned battery savings (ex-ante, from
        the persisted optimizer plans, Europe/Berlin day, latest run per slot);
        plus fleet totals and the fleet-wide per-day savings of the last 14
        Berlin days for the hero mini chart. RLS-scoped: the fleet is exactly
        the caller's tenant. Admins read another tenant's fleet via the
        X-Tenant-Id switcher.
      responses:
        "200":
          description: The caller's fleet overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/earnings:
    get:
      tags: [sites]
      summary: Realized earnings - measured "mit VoltPilot vs. ungeregelte Anlage".
      description: >
        The measured money numbers behind the portal hero (fleet AND
        single-site), computed per 15-min slot from the telemetry rollups
        valued at the slot's day-ahead price in each site's own bidding zone
        (PT15M rows preferred, PT60M fallback): baseline = (load_kwh - pv_kwh)
        * price/1000 (the UNREGULATED plant - same generation and consumption,
        fed in immediately, battery idle), actual = (grid_import_kwh -
        grid_export_kwh) * price/1000, saved = baseline - actual. Both are
        signed COSTS (negative = revenue); with symmetric spot pricing, saved
        equals the battery's dispatch valued at spot, so round-trip losses
        debit VoltPilot automatically. Windows are Europe/Berlin calendar
        periods containing `at`; range=all starts at the fleet's first covered
        slot and the response's `from` says so. RLS-scoped like every customer
        endpoint; admins use the X-Tenant-Id switcher.
      parameters:
        - name: range
          in: query
          schema: { type: string, enum: [day, month, year, all], default: month }
        - name: at
          in: query
          description: The date whose period to report (default today, Europe/Berlin).
          schema: { type: string, format: date }
      responses:
        "200":
          description: The caller's realized earnings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Earnings" }
        "400": { description: Unknown range. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/sites:
    get:
      tags: [sites]
      summary: List sites for the caller's tenant (tenant_id from OIDC token).
      responses:
        "200":
          description: Sites (only the caller's tenant, via RLS).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Site" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [sites]
      summary: Create a site for the caller's own tenant (self-service onboarding).
      description: >
        Creates a site (Standort) for the CALLER's tenant. The tenant is taken from
        the OIDC `tenant_id` claim (via TenantContext) and enforced by RLS' WITH
        CHECK - never from the request body - so a customer can only ever create a
        site for themselves. This unblocks onboarding: a fresh customer creates a
        site, then claims devices into it. Implemented in services/api.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSiteRequest" }
      responses:
        "201":
          description: Site created (for the caller's tenant).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400": { description: Invalid input (blank name, out-of-range coordinates, or bad zone). }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/sites/{siteId}:
    put:
      tags: [sites]
      summary: Update a site (name/bidding zone/coordinates).
      description: >
        Validation mirrors create. RLS makes a foreign site a 404 and pins the
        row to its tenant, so a site can never be moved across tenants. Admins
        edit any tenant's sites through the same endpoint via the X-Tenant-Id
        tenant switcher.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSiteRequest" }
      responses:
        "200":
          description: Updated site.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400": { description: Invalid input (blank name, out-of-range coordinates, or bad zone). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
    delete:
      tags: [sites]
      summary: Delete a site (guarded; cascades assets + series data).
      description: >
        Refused (409) while the site still has devices - they must be removed
        first. On success the site's assets cascade by FK and its series data
        (telemetry, rollups, forecast, schedule, weather, forecast-quality rows)
        is deleted in the same transaction. Use the deletion-preview endpoint to
        show the concrete consequences before confirming.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Site and its recorded data deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
        "409": { description: The site still has devices; remove them first. }
  /api/v1/sites/{siteId}/deletion-preview:
    get:
      tags: [sites]
      summary: What deleting this site would remove (for the confirm dialog).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Device count and recorded-data extent/counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDeletionPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/devices:
    get:
      tags: [devices]
      summary: List devices for the caller's tenant.
      responses:
        "200":
          description: Devices (only the caller's tenant, via RLS).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/devices/{deviceId}:
    put:
      tags: [devices]
      summary: Update a device (type + label only; the ref is immutable).
      description: >
        Only `kind` and the optional customer-facing label `name` are editable.
        The `externalRef` is the device's identity (MQTT topics, registry
        gating, the printed sticker) and cannot be changed - a wrong ref is
        fixed by unclaiming and re-claiming.
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDeviceRequest" }
      responses:
        "200":
          description: Updated device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { description: Invalid kind or over-long label. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Device not found for this tenant. }
    delete:
      tags: [devices]
      summary: Unclaim (delete) a device incl. its telemetry + MQTT cleanup.
      description: >
        Removes the device row AND its telemetry, and clears the broker's
        retained `provision/{ref}/config` and schedule topics (best-effort,
        like the on-claim publish) so the physical device falls back to its
        watchdog default. The ref becomes claimable again; a sticker ID stays
        registered in the manufacturing registry.
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Device unclaimed; its telemetry deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Device not found for this tenant. }
  /api/v1/devices/{deviceId}/purge-data:
    post:
      tags: [devices]
      summary: Purge ALL recorded data of a device WITHOUT unclaiming it.
      description: >
        "Datenaufzeichnungen löschen": irreversibly deletes every recorded
        timeseries datapoint of this device - raw telemetry plus the site's
        derived rollups, which are rebuilt from the remaining devices - while
        the device itself stays claimed and fully operational (enrollment,
        certificates, config and the retained schedule are untouched). A purge
        watermark (`purgedBefore`) is stamped on the device: the ingest path
        refuses any sample OBSERVED at or before it, so a store-and-forward
        edge replaying old buffered samples can never resurrect the deleted
        history. The device is additionally told to wipe its local buffers via
        a retained MQTT `purge_data` command (contract:
        mqtt-data-purge.schema.json) - delivered on reconnect if it is offline.
        New data recorded after the purge flows and charts normally.
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Purge completed (cloud data is gone).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevicePurgeResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Device not found for this tenant. }
  /api/v1/devices/claim:
    post:
      tags: [devices]
      summary: Claim an edge device into a site (onboarding = one insert).
      description: >
        Claims an unclaimed edge device (identified by `externalRef`) into one of
        the caller's sites. `externalRef` is canonicalized before use: trimmed,
        and sticker Geräte-IDs (prefix `VP-`, case-insensitive) uppercased, so
        the typed case never creates a second device. Sticker IDs additionally
        validate against the provisioned-device registry (manufactured IDs,
        maintained via the admin API): an unknown sticker ID yields 422 instead
        of creating a ghost device, and the claimed device inherits the
        registry's `kind`. Non-sticker refs stay ungated. The claim is idempotent
        within the tenant: re-claiming a ref the caller already owns returns 200
        with the existing device (at its original site) instead of a conflict.
        `externalRef` is globally unique, so a device claimed by ANOTHER tenant -
        which RLS hides - yields 409. The target site must belong to the caller's
        tenant, else 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceClaimRequest" }
      responses:
        "200":
          description: Already claimed by the caller's own tenant - the existing device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "201":
          description: Device claimed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Target site not found for this tenant. }
        "409": { description: Device already claimed by another tenant. }
        "422": { description: Unknown sticker Geräte-ID (not in the provisioned-device registry). }
  /api/v1/sites/{siteId}/telemetry:
    get:
      tags: [telemetry]
      summary: Query telemetry timeseries for a site.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: >
            Telemetry points (tenant-scoped via RLS). `from`/`to` default to the
            last 24h. Windows longer than 3h are downsampled server-side to
            1-minute averages so the series stays complete AND current for chatty
            devices; when the row cap would bite, the oldest points are dropped,
            never the newest.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TelemetryPoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/prices:
    get:
      tags: [market]
      summary: Day-ahead spot prices (15-min slots) for a site's bidding zone.
      description: >
        Returns the day-ahead electricity spot prices for the site's bidding zone
        (DE-LU). Prices are market-wide PER ZONE (not per tenant), but the endpoint
        is site-scoped so the portal reads "the price for this site": the site is
        resolved via RLS (a foreign site is 404), then its zone's series is
        returned. Collected KEYLESS from energy-charts.info (Fraunhofer ISE), with
        ENTSO-E as an alternative source. `from`/`to` default to roughly
        today+tomorrow. Implemented in services/api.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Price series for the site's zone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceSeries" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/price-history:
    get:
      tags: [market]
      summary: Day-ahead prices aggregated over one range (Tag/Woche/Monat/Jahr).
      description: >
        Day-ahead spot prices for the site's bidding zone, aggregated over one
        historical period, mirroring the Historie period pattern. `at` picks the
        period containing that date; boundaries are Europe/Berlin. Aggregation
        happens in SQL (TimescaleDB time_bucket): 15-min buckets for the day,
        hourly for the week, Europe/Berlin-daily for month/year - so a year is
        ~365 rows, not ~35k slots. Each bucket carries avg/min/max (the band the
        chart draws), and the response includes range summary stats (avg/min/max,
        cheapest & most expensive slot, slot count, actual data coverage). The
        day range anchored on today extends `to` into tomorrow so the
        forward-looking day-ahead curve stays visible; past days show one day.
        Prices are market-wide per zone (no tenant); the site is resolved via RLS
        (foreign site => 404). Because the collector only fetches today+tomorrow,
        historical depth grows one day per collector day - empty/partial windows
        are expected and returned as empty bucket lists. Implemented in
        services/api.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: range
          in: query
          required: false
          schema: { type: string, enum: [day, week, month, year], default: day }
        - name: at
          in: query
          required: false
          description: Any ISO date (YYYY-MM-DD) inside the wanted period (Europe/Berlin); defaults to today.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Aggregated price series for the range (empty buckets if no data).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceHistory" }
        "400": { description: Invalid range value. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/weather:
    get:
      tags: [weather]
      summary: Latest weather forecast (hourly) for a site.
      description: >
        Returns the most recent weather-forecast run for the site (temperature,
        cloud cover and shortwave/GHI radiation useful for PV), hourly over the
        coming days. The `weather_forecast` table carries `tenant_id` and is
        RLS-scoped, and the site lookup is RLS-gated, so a foreign site is 404 and
        no other tenant's weather can leak. Collected KEYLESS from Open-Meteo
        (EU-hosted). Implemented in services/api.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Latest weather forecast (empty points array if none stored yet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherForecast" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/schedule:
    get:
      tags: [schedules]
      summary: Current 24h optimization schedule (15-min slots) for a site.
      description: >
        The latest optimizer run from the schedule hypertable (written by
        services/optimization): per-slot planned battery power (+charge /
        -discharge), projected grid power and SoC, the day-ahead price and the
        projected cost vs. the no-battery baseline, plus the headline savingsEur
        over the horizon. RLS-scoped by tenant. Empty slots array (null
        metadata) when no plan has been produced yet.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's current plan (empty slots array if none yet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/control-status:
    get:
      tags: [schedules]
      summary: Latest inverter-control confirmation for a site ("Steuerung").
      description: >
        What the schedule commanded vs. what the inverter read back for this
        site's device(s), ingested from the additive `control` block of the
        device status heartbeat (report §5). Feeds the portal's calm "Steuerung"
        strip ("Fahrplan-Sollwert X -> Wechselrichter bestätigt Y", healthy |
        mismatch | stale). RLS-scoped by tenant. 204 (no body) until a device has
        reported a control readback.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's latest control confirmation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlStatus" }
        "204": { description: No control readback reported yet for this site. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/history:
    get:
      tags: [history]
      summary: A site's history ("Historie") for one period, money lens first.
      description: >
        Bucketed pv/load/grid/SoC series (15-min for day, hourly for week,
        Europe/Berlin-daily for month/year; served from the telemetry rollup
        tables, day live from raw telemetry) with the matching day-ahead price
        and per-bucket import cost, plus period totals: consumption / PV /
        import / export kWh, grid cost EUR (import energy x matching 15-min
        price), battery savings EUR (persisted optimizer plans, latest run per
        slot, null where none exist), Autarkiegrad and Eigenverbrauchsquote.
        For range=day the response additionally carries the Tagesprotokoll
        (notable events in plain German) and the persisted plan trajectory for
        the plan-vs-actual overlay. Period boundaries are Europe/Berlin local
        time. RLS-scoped by tenant.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: range
          in: query
          required: false
          schema: { type: string, enum: [day, week, month, year], default: day }
        - name: at
          in: query
          required: false
          schema: { type: string, format: date }
          description: Any date inside the wanted period (default today, Europe/Berlin).
      responses:
        "200":
          description: The site's history for the period (empty buckets if no data).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/History" }
        "400": { description: Unknown range value. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/forecast-quality:
    get:
      tags: [forecast-quality]
      summary: Forecast-model quality ("Prognosequalität") for a site.
      description: >
        The shadow-mode forecasting transparency view (docs/forecasting.md):
        which forecast model is LIVE per kind (activeLoadModel/activePvModel,
        resolved from server config - the same env the optimizer reads), the
        lifecycle of every model that has run on the site (challengers report
        "collecting: day X of N" while their self-gate is unmet; trained models
        carry trainedAt/trainRows and the top feature importances with
        plain-German labels), the per-model daily error series (MAE kW, nMAE %,
        bias, skill vs the baseline - positive = better) computed by the daily
        evaluation job, and the daily plan-vs-actual economics. Challenger
        promotion is NEVER automatic; it is an operator env flip informed by
        this data. All rows come from RLS-scoped tables - a foreign site is a
        404; a fresh site yields empty (but well-formed) lists.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 30, minimum: 1, maximum: 90 }
          description: How many trailing days of accuracy/plan series to return.
      responses:
        "200":
          description: The site's forecast-quality view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForecastQuality" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/assets:
    get:
      tags: [registry]
      summary: The site's asset master data incl. registry provenance.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Asset rows (battery params for the optimizer, PV params for the forecast).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteAsset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant (RLS). }
  /api/v1/sites/{siteId}/measurement-points:
    get:
      tags: [registry]
      summary: The site's additional read-only measurement points (multi-source Anlage).
      description: >
        A site with a battery-hybrid inverter PLUS a separate AC-coupled PV
        records the second PV here as an Erzeuger source; its kWp sums into the
        aggregate `asset.pv` the forecast reads. A dedicated grid meter at the
        point of common coupling is recorded as a Netz source (`grid-meter`, at
        most one per site, no nameplate); it does not touch `asset.pv`. NO second
        device claim - sources are read through the site's one connected edge,
        which folds a Netz meter into the authoritative site grid. Read-only by
        construction (control is always false).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's measurement points.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MeasurementPoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant (RLS). }
    post:
      tags: [registry]
      summary: Record an additional read-only source (Erzeuger PV, or a single Netz grid meter).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  description: >
                    'pv-generation' (Erzeuger, default) or 'grid-meter' (Netz, at
                    most one per site; carries no nameplate).
                  enum: [pv-generation, grid-meter]
                label: { type: string, maxLength: 120 }
                brand: { type: string, maxLength: 60 }
                model: { type: string, maxLength: 60 }
                capacityKwp:
                  type: number
                  description: Per-Erzeuger nameplate (kWp); sums into the aggregate asset.pv. Ignored for a Netz meter.
                registryUnitId:
                  type: string
                  description: The source's OWN MaStR SEE number (optional - never blocks adding).
      responses:
        "200":
          description: The site's measurement points after the add.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MeasurementPoint" }
        "400": { description: An unknown role or invalid values. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant (RLS). }
        "409": { description: The site already has a Netz (grid-meter) source. }
  /api/v1/sites/{siteId}/measurement-points/{pointId}:
    delete:
      tags: [registry]
      summary: Remove an additional source; its kWp is subtracted from the aggregate site PV.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: pointId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's remaining measurement points.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MeasurementPoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Measurement point or site not found for this tenant (RLS). }
  /api/v1/sites/{siteId}/mastr-lookup:
    post:
      tags: [registry]
      summary: Fetch one MaStR unit for confirmation (nothing persisted).
      description: >
        Looks the SEE unit number up in the Marktstammdatenregister (official
        SOAP webservice when credentials are configured, keyless public JSON
        backend otherwise) and returns the mapped preview: kWp, module count,
        orientation/tilt decoded from catalog values to degrees (nullable -
        e.g. Balkonkraftwerke carry none), commissioning date, storage kWh/kW,
        and the registry's PLZ/Ort for the customer's own plausibility check.
        Storage units are ALSO SEE-numbered; `kind` states what the registry
        says the unit is. Error bodies carry a customer-facing German
        `message`.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [einheitNummer]
              properties:
                einheitNummer:
                  type: string
                  description: SEE + 12 digits; lowercase/spaces are normalized.
                  example: SEE966831669444
      responses:
        "200":
          description: Mapped preview for confirmation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MastrPreview" }
        "400": { description: Invalid unit number (German hint in `message`, e.g. the SES/SSE/EEG prefix mix-ups). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant, or no unit with this number in the registry. }
        "502": { description: Registry currently unreachable. }
  /api/v1/sites/{siteId}/mastr-apply:
    post:
      tags: [registry]
      summary: Persist the confirmed registry values onto the site's assets.
      description: >
        Creates or updates the site's `pv` and/or `battery` asset rows with the
        values the customer confirmed in the preview, plus provenance (registry
        id, unit number, fetch timestamp). Battery values land in the columns
        the optimizer reads; PV values feed the forecast's PlantSpec. At least
        one of `pv`/`storage` is required.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MastrApplyRequest" }
      responses:
        "200":
          description: The site's asset rows after the apply.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteAsset" }
        "400": { description: Neither pv nor storage present, or values out of range. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant (RLS). }
  /api/v1/sites/{siteId}/battery:
    put:
      tags: [registry]
      summary: Maintain the site's battery master data and its controlling device.
      description: >
        Create or update the site's `battery` asset from customer-entered values
        (capacity/charge/discharge power and optional round-trip efficiency) -
        the manual path for plants not in the Marktstammdatenregister. The
        battery is controlled by the inverter, which is the edge device, so the
        request also maintains the device link: pass `deviceId` to pick the
        controlling device explicitly (validated to belong to this site), or omit
        it to auto-link the site's single device (the self-maintaining rule). A
        multi-device site with no explicit choice is left unlinked and the portal
        warns that the plan cannot be executed. Manual values leave the registry
        provenance untouched (a MaStR-linked battery keeps its provenance).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capacityKwh, maxChargeKw, maxDischargeKw]
              properties:
                capacityKwh: { type: number, description: Usable battery capacity (kWh), > 0. }
                maxChargeKw: { type: number, description: Max charge power (kW), > 0. }
                maxDischargeKw: { type: number, description: Max discharge power (kW), > 0. }
                roundtripEfficiencyPct:
                  type: number
                  nullable: true
                  description: Round-trip efficiency in percent (1-100); platform default 92 when omitted.
                deviceId:
                  type: string
                  format: uuid
                  nullable: true
                  description: The controlling device; omit to auto-link the site's single device.
                speicherschonung:
                  type: string
                  enum: [aggressiv, ausgewogen, schonend]
                  nullable: true
                  description: >
                    The customer's "Umgang mit dem Speicher" preset, mapped
                    server-side onto the battery's wear cost (aggressiv 1 ct /
                    ausgewogen 4 ct / schonend 8 ct per kWh cycled) - the
                    optimizer reads it on its next 15-min cycle. Omit to keep
                    the stored value. The raw ct value stays admin-only
                    (optimizer-config); a preset pick overwrites an
                    admin-configured custom value.
      responses:
        "200":
          description: The site's asset rows after the save.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteAsset" }
        "400": { description: Missing/invalid battery values. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant (RLS), or the chosen device is not at this site. }
  /api/v1/sites/{siteId}/kpis:
    get:
      tags: [kpis]
      summary: Economic KPIs (self-consumption, savings) for a site.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: KPIs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteKpis" }
  /api/v1/admin/tenants:
    get:
      tags: [admin]
      summary: List all tenants (platform-wide).
      responses:
        "200":
          description: Every tenant on the platform.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Create a tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTenantRequest" }
      responses:
        "201":
          description: Tenant created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/tenants/{tenantId}:
    put:
      tags: [admin]
      summary: Update a tenant's master data (name/segment).
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTenantRequest" }
      responses:
        "200":
          description: Updated tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { description: Invalid input (blank name or bad segment). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant not found. }
  /api/v1/admin/tenants/{tenantId}/delete:
    post:
      tags: [admin]
      summary: Offboard a tenant (type-to-confirm full cascade).
      description: >
        The most destructive platform action. The body must carry the tenant's
        EXACT name (`confirmName`); a mismatch is refused (400) before anything
        is touched. The database cascade - all series data, sites, devices,
        assets and the tenant row - runs in ONE transaction. The tenant's
        retained MQTT topics and Keycloak users are then cleaned best-effort;
        users whose deletion failed are reported by name in `failedUsers` so a
        partial directory failure is never silent.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteTenantRequest" }
      responses:
        "200":
          description: Tenant offboarded; the report of what was removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantOffboardingReport" }
        "400": { description: confirmName does not match the tenant's name. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant not found. }
        "502": { description: Keycloak unreachable - refused before deleting anything (the tenant's logins could not be enumerated). }
  /api/v1/admin/tenants/{tenantId}/sites:
    get:
      tags: [admin]
      summary: List the sites of a tenant (platform-admin, cross-tenant).
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The tenant's sites.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Site" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant not found. }
    post:
      tags: [admin]
      summary: Create a site for a tenant (platform-admin, cross-tenant).
      description: >
        Creates a site for the tenant named in the PATH, using the BYPASSRLS admin
        datasource. The tenant is validated to exist first. The tenant is never
        taken from client-controlled body data, so this is a deliberate,
        role-gated cross-tenant write - customer site access stays RLS-scoped.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSiteRequest" }
      responses:
        "201":
          description: Site created for the tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400": { description: Invalid input (blank name, out-of-range coordinates, or bad zone). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant not found. }
  /api/v1/admin/tenants/{tenantId}/users:
    get:
      tags: [admin]
      summary: List the customer users (Portal-Users) of a tenant.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Users carrying this tenant's `tenant_id` in Keycloak.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant not found. }
    post:
      tags: [admin]
      summary: Provision a customer user into a tenant.
      description: >
        Creates a Keycloak user with the `tenant_id` attribute and the customer
        (`operator`) realm role, so the account is tenant-scoped by the existing
        OIDC + RLS spine. An optional password is set (temporary for an invite
        flow). A duplicate username/email yields 409.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Customer user created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant not found. }
        "409": { description: A user with that username or email already exists. }
  /api/v1/admin/provisioned-devices:
    get:
      tags: [admin]
      summary: List the manufacturing registry of sticker Geräte-IDs.
      description: >
        Platform-wide view of every provisioned (manufactured) device ID and its
        claim state - which tenant, if any, has connected it.
      responses:
        "200":
          description: All provisioned devices.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProvisionedDevice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Register a manufactured sticker Geräte-ID.
      description: >
        Registers a device ID (canonicalized like the claim path - trimmed,
        uppercased) so a customer can claim it. Only sticker-format IDs
        (prefix `VP-`) are accepted. Idempotent - re-registering an existing ID
        returns 200 with the unchanged entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProvisionDeviceRequest" }
      responses:
        "200":
          description: Already registered - the existing, unchanged entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisionedDevice" }
        "201":
          description: Geräte-ID registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisionedDevice" }
        "400": { description: Blank or non-sticker-format (missing VP- prefix) Geräte-ID. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/provisioned-devices/{externalRef}:
    delete:
      tags: [admin]
      summary: Remove a wrongly registered sticker Geräte-ID from the registry.
      description: >
        Refused (409) while a customer's claim references the ID - the device
        must be unclaimed first. The path ref is canonicalized like the claim
        path (trimmed, uppercased).
      parameters:
        - { name: externalRef, in: path, required: true, schema: { type: string }, example: VP-1234-ABCD }
      responses:
        "204": { description: Registry entry removed; the ID can no longer be claimed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No such registry entry. }
        "409": { description: The ID is claimed by a customer; unclaim the device first. }
  /api/v1/admin/enrollments/pending:
    get:
      tags: [admin]
      summary: List enrolled-but-unclaimed devices.
      description: >
        Operator view onto devices that uploaded an enrollment CSR but have no
        matching claimed device row (the ref was never claimed - e.g. a customer
        typed a different reference - or was unclaimed after issuance). Surfaces
        the otherwise-invisible half of a mistyped-reference dead-end. Read-only;
        the device-facing enrollment poll stays opaque (pending == unknown).
      responses:
        "200":
          description: Pending (enrolled-but-unclaimed) enrollments, newest CSR first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PendingEnrollment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/tenants/{tenantId}/users/{userId}:
    put:
      tags: [admin]
      summary: Update a customer user's profile (email/name).
      description: The username is the login identity and stays immutable.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { description: Invalid email or over-long name. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant or user not found (including a user outside this tenant). }
        "409": { description: A user with that email already exists. }
    delete:
      tags: [admin]
      summary: Permanently delete a customer user's login.
      description: >
        Admins can never delete their OWN account (409) - the guard fires
        before any tenant check.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: User deleted; their login stops working immediately. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant or user not found (including a user outside this tenant). }
        "409": { description: Attempt to delete one's own account. }
  /api/v1/admin/tenants/{tenantId}/users/{userId}/disable:
    post:
      tags: [admin]
      summary: Disable a customer user (blocks their logins).
      description: >
        Admins can never disable their OWN account (409) - the guard fires
        before any tenant check.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant or user not found (including a user outside this tenant). }
        "409": { description: Attempt to disable one's own account. }
  /api/v1/admin/tenants/{tenantId}/users/{userId}/enable:
    post:
      tags: [admin]
      summary: Re-enable a disabled customer user.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant or user not found (including a user outside this tenant). }
  /api/v1/admin/tenants/{tenantId}/users/{userId}/reset-password:
    post:
      tags: [admin]
      summary: Reset a customer user's password (support lever).
      description: >
        The platform has no SMTP and therefore no self-service password reset;
        this is how support recovers a customer who forgot their password or
        locked themselves out guessing. Sets the new password (`temporary`
        defaults to true: must be changed on next login) and lifts any
        brute-force lockout so the new password works immediately.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200":
          description: Password reset; any lockout lifted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { description: Invalid password (must be 8-128 characters). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant or user not found (including a user outside this tenant). }
  /api/v1/admin/sites/{siteId}/optimizer-diagnostics:
    get:
      tags: [admin]
      summary: Per-slot "why" view of one persisted optimizer run (Portal-Admin).
      description: >
        The plan's slots PLUS the per-slot euro decomposition the P1-P5 solver
        redesign actually optimized against: the bare spot price
        (`solverPriceCtKwh`), the real import price per the site's tariff
        (spot+Aufschlag / flat / spot), the real export value (spot + dynamic
        Marktprämie for Direktvermarktung incl. the §51 negative-price
        suspension; feste EEG-Einspeisevergütung incl. §51a for Eigenverbrauch;
        bare spot in merchant mode - mirrors the optimizer's pricing.py), the
        PERSISTED per-slot wear spend and its derived ct/kWh rate, an
        explicitly-APPROXIMATE stored-energy value (forward best-use price
        discounted by efficiency and wear - NOT a MILP shadow price), a
        decision label (the portal chargeKind twin) and one composed German
        rationale per slot. Fields that are honestly not computable for a slot
        (no persisted spot, pre-P2 rows without wear, battery-less site) are
        null, never a fabricated 0.

        Requires the `platform-admin` role AND the `X-Tenant-Id` tenant
        switcher: the read runs RLS-scoped over the selected tenant's own data
        (no BYPASSRLS); no tenant selected or the wrong tenant = 404. The §14a
        limit a run used is not persisted and therefore not returned;
        forecast-model lifecycle comes from GET /sites/{siteId}/forecast-quality.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: generatedAt
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: >
            Select a historical run by its exact generated_at; omitted = the
            latest run. An unknown timestamp is a 404 (never silently the
            latest); `availableRuns` in the response lists recent choices.
      responses:
        "200":
          description: >
            The run's diagnostics; a site without any plan yet returns an
            empty well-formed body (generatedAt null, no slots).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptimizerDiagnostics" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not visible for the selected tenant, or unknown generatedAt. }
  /api/v1/admin/sites/{siteId}/optimizer-config:
    get:
      tags: [admin]
      summary: The site's optimizer knobs - platform defaults, overrides, effective values.
      description: >
        Platform defaults mirror the optimizer's `OPTIMIZER_*` environment
        (the api receives the same variables - keep them in sync in compose);
        overrides are the nullable per-site/per-asset columns
        (`asset.wear_cost_ct_per_kwh`, `asset.soc_min_pct`/`soc_max_pct`,
        `site.backup_reserve_soc_pct`); effective = override ?? default. The
        pre-existing site levers (netzladen_erlaubt, plant_kind, tariff,
        anzulegender Wert) are echoed READ-ONLY - they stay editable via
        PUT /api/v1/sites/{siteId} (admins: with the X-Tenant-Id switcher).
        Terminal-value settings are env-level and read-only here. Same
        auth/tenancy as optimizer-diagnostics.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The merged config view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptimizerConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not visible for the selected tenant. }
    put:
      tags: [admin]
      summary: Write the per-site / per-asset optimizer overrides.
      description: >
        FULL-REPRESENTATION for the four override fields: the body IS the
        override state, a null/absent field CLEARS that override back to the
        platform default (matching the columns' NULL semantics). Battery
        fields (wear cost, SoC band) require a battery asset (409 otherwise);
        the EFFECTIVE SoC band (override ?? default per side) must stay a real
        window (400). Changes apply on the optimizer's next 15-min cycle - no
        re-solve is triggered here (the what-if endpoint is a deferred later
        increment, design §4.3).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOptimizerConfigRequest" }
      responses:
        "200":
          description: The updated merged config view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptimizerConfig" }
        "400": { description: Invalid value range or inconsistent effective SoC band. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not visible for the selected tenant. }
        "409": { description: Battery override on a site without a battery asset. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Keycloak-issued OIDC access token (realm `voltpilot`). Must carry a
        `tenant_id` claim; the API sets it as the Postgres `app.tenant_id`
        session variable to drive Row-Level-Security.

        Tenant switcher (Portal-Admins only): a token with the `platform-admin`
        realm role (which carries NO tenant_id) may select a tenant per request
        via the `X-Tenant-Id` header (UUID). The customer endpoints then serve
        that tenant's data through the same RLS scoping the customer gets. The
        header is IGNORED for every non-admin token, so it can never widen a
        customer's access; an admin without the header sees zero rows
        (default-deny).
  responses:
    Unauthorized:
      description: Missing, expired or invalid Bearer token.
    Forbidden:
      description: Authenticated, but lacking the required role (e.g. a customer calling an admin endpoint).
  schemas:
    RegistrationRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 200
          description: Person or company name; becomes the tenant's display name.
          example: Erika Kaiser
        email:
          type: string
          format: email
          maxLength: 254
          description: Login email (doubles as the username; lowercased).
        password:
          type: string
          minLength: 8
          maxLength: 128
    RegistrationResponse:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        tenantName: { type: string }
        username: { type: string, description: The login name (the lowercased email). }
    EnrollmentCsrRequest:
      type: object
      required: [csrPem]
      properties:
        csrPem:
          type: string
          maxLength: 20480
          description: PEM-encoded PKCS#10 CSR, generated on the device (RSA >= 2048 or EC P-256/P-384).
        deviceInfo:
          type: string
          maxLength: 500
          description: Optional free-form device metadata (model, firmware) for support.
    EnrollmentPending:
      type: object
      properties:
        status: { type: string, example: pending }
        ref: { type: string, description: The canonical reference (POST response only). }
        message: { type: string }
    EnrollmentCertificate:
      type: object
      properties:
        deviceCertPem: { type: string, description: The CA-signed client certificate (pair with the device-held key). }
        caPem: { type: string, description: The device CA certificate (verify the broker with this). }
        mqttHost: { type: string, example: mqtt.example.com }
        mqttPort: { type: integer, example: 8883 }
        tenantId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid, description: Also the certificate CN and the device's MQTT username/clientid. }
    Site:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        biddingZone: { type: string, example: DE-LU }
        latitude:
          type: number
          nullable: true
          description: WGS84 latitude; ties the site to its weather forecast.
          example: 52.52
        longitude:
          type: number
          nullable: true
          description: WGS84 longitude.
          example: 13.405
        plantKind:
          type: string
          enum: [direktvermarktung, eigenverbrauch]
          description: >
            Anlagentyp: steers the portal's money wording per site
            ("mehr verdient" for Direktvermarktung vs. "gespart" for
            Eigenverbrauch). Defaults to eigenverbrauch.
        anzulegenderWertCtKwh:
          type: number
          nullable: true
          minimum: 0
          example: 8.11
          description: >
            Optional anzulegender Wert (ct/kWh) - the plant's fixed EEG
            reference rate from the EEG award / Direktvermarktungsvertrag;
            null = not configured. Only relevant for plantKind =
            direktvermarktung. When set, GET /earnings includes the DYNAMIC
            monthly Marktprämie max(0, anzulegender Wert - Monatsmarktwert
            Solar) on exported energy (suspended in negative-price slots -
            the simplified §51-EEG rule).
        marktpraemieCtKwh:
          type: number
          nullable: true
          deprecated: true
          description: >
            DEPRECATED (2026-07-07): the former manually entered FIXED
            premium - wrong semantics (the premium is the dynamic monthly
            difference to the Monatsmarktwert; fixed is the anzulegender
            Wert). Echoed read-only for one release, no longer accepted on
            create/update and no longer used in any computation; the column
            and this property are removed next release.
        tarifArt:
          type: string
          enum: [dynamisch, fest, ohne]
          description: >
            The customer's electricity tariff art (REPLACES the fixed
            strompreisCtKwh). 'dynamisch' = spot-coupled (each self-consumed kWh
            valued at its 15-min Börsenpreis + the optional Aufschlag); 'fest' =
            a single fixed retail price; 'ohne' = no euro value (self-consumption
            shown in kWh only). Defaults to 'ohne'.
        tarifParamCtKwh:
          type: number
          nullable: true
          minimum: 0
          example: 18.0
          description: >
            The tariff parameter (ct/kWh, >= 0): the fixed retail price for
            'fest', the optional spot-price Aufschlag (grid fees, levies, margin)
            for 'dynamisch', null for 'ohne' / unset. Editable by the site owner
            and by Portal-Admins.
        netzladenErlaubt:
          type: boolean
          description: >
            Per-site grid-charging switch (default false). false = "Nur
            Solarladen (EEG)": the optimizer charges the battery ONLY from
            the site's own PV surplus (Ausschließlichkeitsprinzip). true =
            "Netzladen aktiv": grid arbitrage allowed. Editable by the site
            owner and by Portal-Admins (the portal form carries the
            Ausschließlichkeitsprinzip warning).
        maxFeedInKw:
          type: number
          nullable: true
          exclusiveMinimum: 0
          example: 75.0
          description: >
            Static feed-in cap at the grid connection point (Einspeisegrenze
            am Netzanschlusspunkt, kW; FK1). null = no connection-point
            limit. The optimizer enforces it as a hard cap on grid EXPORT
            ONLY - import is never limited by it (unlike the telemetry-driven
            §14a limit, which is symmetric); when both exist the tighter one
            wins on export.
        leistungspreisEurKw:
          type: number
          nullable: true
          minimum: 0
          example: 120.0
          readOnly: true
          description: >
            READ-ONLY echo of the peak-shaving module (PS-1, Lastspitzenkappung):
            the RLM Leistungspreis in EUR per kW per billing period. Non-null =
            the module is ACTIVE (there is no separate flag). Configured
            exclusively by Portal-Admins via
            PUT /api/v1/admin/sites/{siteId}/optimizer-config - never accepted
            on the customer site create/update requests.
        abrechnungLeistung:
          type: string
          enum: [jahr, monat]
          readOnly: true
          description: >
            READ-ONLY echo (PS-1): the Leistungspreis billing period -
            Jahres- vs. Monatsleistungspreis (Europe/Berlin calendar periods).
            Defaults to 'jahr'. Admin-configured via optimizer-config.
        peakReserveSocPct:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          readOnly: true
          description: >
            READ-ONLY echo (PS-2): the peak-shaving SoC reserve in percent -
            a HARD floor the dispatch never discharges below, held back for
            load peaks beyond the 24h planning horizon. Stacks with the
            backup reserve (the highest configured absolute floor binds).
            null = no peak reserve. Admin-configured via optimizer-config.
    SiteAsset:
      type: object
      description: One asset row incl. registry provenance; null = not set.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: battery, description: "'battery' | 'pv' (more later)" }
        deviceId:
          type: string
          format: uuid
          nullable: true
          description: >
            The device that controls this asset. A battery with a null deviceId
            has no control path - the optimizer plans it but cannot publish the
            plan to the edge, so the portal warns.
        capacityKwh: { type: number, nullable: true }
        maxChargeKw: { type: number, nullable: true }
        maxDischargeKw: { type: number, nullable: true }
        roundtripEfficiencyPct: { type: number, nullable: true, description: Round-trip efficiency percent; platform default 92. }
        speicherschonung:
          type: string
          enum: [aggressiv, ausgewogen, schonend, individuell]
          nullable: true
          description: >
            Battery only: the EFFECTIVE "Umgang mit dem Speicher" preset,
            derived server-side from the stored wear cost (NULL = platform
            default = ausgewogen; individuell = an admin configured a custom
            value via optimizer-config). Null for non-battery assets.
        pvCapacityKwp: { type: number, nullable: true }
        moduleCount: { type: integer, nullable: true }
        azimuthDeg: { type: number, nullable: true, description: Clockwise from North; 180 = South. }
        tiltDeg: { type: number, nullable: true }
        commissionedOn: { type: string, format: date, nullable: true }
        registry: { type: string, nullable: true, example: mastr }
        registryUnitId: { type: string, nullable: true, example: SEE966831669444 }
        registryFetchedAt: { type: string, format: date-time, nullable: true }
    MeasurementPoint:
      type: object
      description: >
        One additional read-only measurement point of a site (multi-source
        Anlage). Records Erzeuger (PV) sources whose kWp sums into the aggregate
        asset.pv, and an optional single Netz (grid-meter) source at the point of
        common coupling (no nameplate). Read-only by construction (control always
        false).
      properties:
        id: { type: string, format: uuid }
        role: { type: string, example: pv-generation, description: "'pv-generation' (Erzeuger) or 'grid-meter' (Netz)." }
        label: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        capacityKwp: { type: number, nullable: true, description: Per-source nameplate (kWp). }
        registryUnitId: { type: string, nullable: true, example: SEE900000000001 }
        control: { type: boolean, description: Always false for the roles recorded here. }
        createdAt: { type: string, format: date-time, nullable: true }
    MastrPreview:
      type: object
      description: >
        Mapped registry record for confirmation. Nullable = "nicht im Register
        hinterlegt". `warnings` are honest German notes (Ost-West/nachgeführt
        orientation, symmetric-charging assumption on the keyless source).
      properties:
        mastrNummer: { type: string, example: SEE966831669444 }
        kind: { type: string, enum: [pv, storage] }
        name: { type: string, nullable: true }
        status: { type: string, nullable: true, example: In Betrieb }
        plantType: { type: string, nullable: true, example: Gebäudesolaranlage }
        powerKw: { type: number, nullable: true, description: PV = kWp (Bruttoleistung); storage = discharge kW. }
        inverterPowerKw: { type: number, nullable: true }
        moduleCount: { type: integer, nullable: true }
        azimuthLabel: { type: string, nullable: true, example: Süd }
        azimuthDeg: { type: number, nullable: true, example: 180 }
        tiltLabel: { type: string, nullable: true, example: 21 - 40 Grad }
        tiltDeg: { type: number, nullable: true, example: 30 }
        commissionedOn: { type: string, format: date, nullable: true }
        storageCapacityKwh: { type: number, nullable: true }
        chargePowerKw: { type: number, nullable: true }
        batteryTechnology: { type: string, nullable: true, example: Lithium-Batterie }
        plz: { type: string, nullable: true }
        ort: { type: string, nullable: true }
        linkedUnitNumber: { type: string, nullable: true, description: Cross-linked sibling unit (SOAP source only). }
        warnings:
          type: array
          items: { type: string }
    MastrApplyRequest:
      type: object
      description: At least one of pv/storage is required.
      properties:
        pv:
          type: object
          required: [mastrNummer]
          properties:
            mastrNummer: { type: string, pattern: "SEE\\d{12}" }
            capacityKwp: { type: number, nullable: true }
            moduleCount: { type: integer, nullable: true }
            azimuthDeg: { type: number, nullable: true }
            tiltDeg: { type: number, nullable: true }
            commissionedOn: { type: string, format: date, nullable: true }
        storage:
          type: object
          required: [mastrNummer]
          properties:
            mastrNummer: { type: string, pattern: "SEE\\d{12}" }
            capacityKwh: { type: number, nullable: true }
            maxChargeKw: { type: number, nullable: true }
            maxDischargeKw: { type: number, nullable: true }
            commissionedOn: { type: string, format: date, nullable: true }
    Overview:
      type: object
      description: Tenant-wide fleet overview (see GET /api/v1/overview).
      properties:
        sites:
          type: array
          items: { $ref: "#/components/schemas/OverviewSite" }
        totals: { $ref: "#/components/schemas/OverviewTotals" }
        dailySavings:
          type: array
          description: >
            Fleet-wide ex-ante savings per Europe/Berlin day, last 14 days
            incl. today; days without any plan are absent.
          items:
            type: object
            properties:
              day: { type: string, format: date }
              savingsEur: { type: number }
    OverviewSite:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        plantKind: { type: string, enum: [direktvermarktung, eigenverbrauch] }
        netzladenErlaubt:
          type: boolean
          description: Per-site grid-charging switch (see Site.netzladenErlaubt).
        batteryWithoutDevice:
          type: boolean
          description: >
            The site has a battery asset with no controlling device: the
            optimizer plans it but cannot publish the plan to the edge. The
            portal warns and links to the fix.
        deviceCount: { type: integer }
        onlineCount:
          type: integer
          description: Devices whose newest telemetry ARRIVED within 5 minutes.
        waitingCount:
          type: integer
          description: Devices that never sent data ("wartet auf erste Daten").
        worstStatus:
          type: string
          nullable: true
          enum: [online, stale, waiting]
          description: >
            Worst device status of the site (stale beats waiting beats online);
            null for a site without devices.
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: Newest telemetry arrival over the site's devices.
        live:
          nullable: true
          description: The site's newest telemetry observation; null when none.
          allOf: [{ $ref: "#/components/schemas/OverviewLive" }]
        plannedSavingsTodayEur:
          type: number
          nullable: true
          description: >
            Ex-ante optimizer savings for today (Europe/Berlin), latest run per
            15-min slot; null when no plan covers today.
    OverviewLive:
      type: object
      properties:
        ts: { type: string, format: date-time, description: Observation time. }
        pvKw: { type: number, nullable: true }
        loadKw: { type: number, nullable: true }
        gridKw: { type: number, nullable: true, description: "+ import / - export" }
        socPct: { type: number, nullable: true }
    OverviewTotals:
      type: object
      properties:
        sites: { type: integer }
        devices: { type: integer }
        online: { type: integer }
        plannedSavingsTodayEur:
          type: number
          nullable: true
          description: Sum over the sites' non-null values; null when none has a plan.
        liveSitesCovered:
          type: integer
          description: Sites whose live snapshot is inside the 5-min freshness window.
    Earnings:
      type: object
      description: Realized earnings (see GET /api/v1/earnings).
      properties:
        range: { type: string, enum: [day, month, year, all] }
        from:
          type: string
          format: date-time
          description: >
            Window start. For range=all this is the fleet's first covered
            Berlin day - the honest "seit ..." of a Gesamt view.
        to: { type: string, format: date-time }
        sites:
          type: array
          items: { $ref: "#/components/schemas/EarningsSite" }
        totals: { $ref: "#/components/schemas/EarningsTotals" }
    EarningsSite:
      type: object
      description: >
        One site's realized earnings over the window. Money values are null
        when no slot is computable; `reason` then says why. Partial coverage
        is not an error - `coveredSlots` counts the slots in the sums.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        plantKind: { type: string, enum: [direktvermarktung, eigenverbrauch] }
        anzulegenderWertCtKwh:
          type: number
          nullable: true
          description: >
            The site's configured anzulegender Wert (ct/kWh), echoed here so
            the portal can state the numbers INCLUDE the dynamic monthly
            Marktprämie; null = not configured (numbers are pure spot, the
            fine print keeps the generic "zzgl. Marktprämie" for
            Direktvermarktung).
        realizedExportCtKwh:
          type: number
          nullable: true
          description: >
            Benchmark KPI - the export-weighted spot price (ct/kWh) the
            site's metered feed-in actually fetched over the window; null
            when the window has no exported energy.
        marketValueSolarCtKwh:
          type: number
          nullable: true
          description: >
            Benchmark KPI - the Monatsmarktwert Solar (ct/kWh) weighted with
            the SAME exports (a range spanning months compares like with
            like); null without exported energy or market-value coverage.
        marketValueProvisional:
          type: boolean
          nullable: true
          description: >
            True while any month contributing to marketValueSolarCtKwh still
            carries the provisional (not yet TSO-published) value; the
            portal labels the number "vorläufig".
        baselineEur:
          type: number
          nullable: true
          description: >
            Signed cost of the unregulated plant (negative = revenue), incl.
            the Marktprämie its immediate feed-in would earn when configured
            (suspended in negative-price slots).
        actualEur:
          type: number
          nullable: true
          description: >
            Signed measured cost with VoltPilot (negative = revenue), incl.
            the Marktprämie on metered export when configured (suspended in
            negative-price slots).
        savedEur:
          type: number
          nullable: true
          description: baseline - actual; negative when the battery ran at a loss.
        arbitrageEur:
          type: number
          nullable: true
          description: >
            The part of savedEur the grid-charging permission concretely
            earned ("davon Arbitrage-Gewinn"): revenue attributed to
            grid-charged battery content minus its purchase cost, via a
            deterministic storage-mix walk over the window's 15-min slots
            (grid share of a slot's charge = max(0, charge - PV surplus);
            discharge draws proportionally from the pv/grid content mix;
            pre-window content counts as solar, losses debit both parts
            proportionally). Null when the site may not grid-charge
            (netzladen_erlaubt = false) or the window contains no
            grid-charged energy - never a fake zero.
        pvShiftEur:
          type: number
          nullable: true
          description: >
            The solar time-shifting remainder savedEur - arbitrageEur (incl.
            any Marktprämie delta - grid-charged energy is never
            premium-eligible), so arbitrageEur + pvShiftEur == savedEur
            exactly. Null whenever arbitrageEur is null.
        coveredSlots: { type: integer }
        firstCoveredDate:
          type: string
          format: date
          nullable: true
          description: Europe/Berlin day of the first covered slot in the window.
        reason:
          type: string
          nullable: true
          enum: [no_data, missing_channels, no_prices]
          description: >
            Why nothing is computable (only set when savedEur is null):
            no_data = no measurements in the window; missing_channels =
            measurements lack the load/PV/grid channels (generation-only
            inverters); no_prices = no day-ahead price covers the slots yet.
        dailySaved:
          type: array
          description: >
            Realized savings per Europe/Berlin day, last 14 days incl. today,
            independent of `range` (spark bars + "Heute" teaser). Days without
            a computable slot are absent.
          items:
            type: object
            properties:
              day: { type: string, format: date }
              savedEur: { type: number }
        tarifArt:
          type: string
          enum: [dynamisch, fest, ohne]
          description: >
            The site's configured electricity tariff art, echoed so the
            money-centric view can render the provenance sentence ("... zum
            dynamischen Börsenpreis + Aufschlag" vs. "... zum festen Preis").
        tarifParamCtKwh:
          type: number
          nullable: true
          description: >
            The tariff parameter (ct/kWh): the fixed retail price for fest, the
            optional spot-price Aufschlag for dynamisch, null for ohne / unset.
        einspeiseErloesEur:
          type: number
          nullable: true
          description: >
            Feed-in revenue over the window (metered export valued at spot +
            Marktprämie); null when nothing is computable.
        eigenverbrauchsWertEur:
          type: number
          nullable: true
          description: >
            Value of self-consumed energy, computed slot-by-slot per the site's
            tariff (dynamisch: each self-consumed kWh at its 15-min Börsenpreis +
            Aufschlag; fest: at the fixed price); null for an 'ohne' tariff
            (never a fabricated euro) or when nothing is computable.
        gesamtertragEur:
          type: number
          nullable: true
          description: >
            Gesamtertrag = einspeiseErloesEur + eigenverbrauchsWertEur (feed-in
            revenue alone when strompreis is unset). The money-centric hero's
            big number; null when nothing is computable.
        selbstverbrauchKwh:
          type: number
          nullable: true
          description: Self-consumed energy over the window (kWh); null when nothing computable.
        eingespeistKwh:
          type: number
          nullable: true
          description: Grid-exported energy over the window (kWh).
        batterieBewegtKwh:
          type: number
          nullable: true
          description: Energy moved through the battery over the window (charged + discharged, kWh).
        expectedMarketValueSolarCtKwh:
          type: number
          nullable: true
          description: >
            Forward-looking expected Marktwert Solar (ct/kWh): the day-ahead
            price weighted with THIS site's own PV forecast over the coming
            horizon (Σ(price × pv) / Σ(pv)) - the forward companion to the
            realized marketValueSolarCtKwh. Range-independent (always the
            future). Null when there is no forward PV forecast or no forward
            day-ahead price coverage (the portal then hides the figure).
        expectedMarketValueFrom:
          type: string
          format: date-time
          nullable: true
          description: First covered forward slot of expectedMarketValueSolarCtKwh.
        expectedMarketValueTo:
          type: string
          format: date-time
          nullable: true
          description: Last covered forward slot of expectedMarketValueSolarCtKwh.
        expectedMarketValueSlots:
          type: integer
          nullable: true
          description: >
            Number of forward 15-min slots (price + forecast both present)
            behind expectedMarketValueSolarCtKwh - lets the portal state the
            horizon ("nächste N h").
        series:
          type: array
          description: >
            Gesamtertrag bucketed over the selected range (per Europe/Berlin
            hour for day, per day for month, per month for year/all) - the
            Ertrag chart. Only buckets with a computable slot are listed.
          items:
            type: object
            properties:
              start: { type: string, format: date-time, description: Berlin bucket start. }
              gesamtertragEur: { type: number }
        monthlyStrip:
          type: array
          description: >
            Gesamtertrag per Europe/Berlin month for the last 12 months
            (independent of `range`) - the tappable month strip. Months without
            a computable slot are absent.
          items:
            type: object
            properties:
              month: { type: string, format: date, description: First day of the Berlin month. }
              gesamtertragEur: { type: number }
    EarningsTotals:
      type: object
      description: >
        Fleet totals over the computable sites; null money values when no site
        has a computable slot (never a fake zero).
      properties:
        baselineEur: { type: number, nullable: true }
        actualEur: { type: number, nullable: true }
        savedEur: { type: number, nullable: true }
        arbitrageEur:
          type: number
          nullable: true
          description: >
            Sum of the sites' arbitrage attributions; null when no site
            grid-charged in the window.
        pvShiftEur:
          type: number
          nullable: true
          description: >
            savedEur - arbitrageEur over the WHOLE fleet (sites without a
            split cannot grid-charge, so their entire saved is PV-shift);
            arbitrageEur + pvShiftEur == savedEur. Null whenever
            arbitrageEur is null.
        coveredSlots: { type: integer }
        firstCoveredDate:
          type: string
          format: date
          nullable: true
          description: Earliest covered Berlin day across the fleet.
    CreateSiteRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, description: Site display name (required, non-blank). }
        biddingZone:
          type: string
          enum: [DE-LU, AT, CH]
          description: "Day-ahead bidding zone; defaults to 'DE-LU'."
        latitude:
          type: number
          nullable: true
          minimum: -90
          maximum: 90
          description: Optional WGS84 latitude; needed for the site's weather forecast.
        longitude:
          type: number
          nullable: true
          minimum: -180
          maximum: 180
          description: Optional WGS84 longitude.
        plantKind:
          type: string
          enum: [direktvermarktung, eigenverbrauch]
          description: "Anlagentyp; defaults to 'eigenverbrauch'."
        anzulegenderWertCtKwh:
          type: number
          nullable: true
          minimum: 0
          description: >
            Optional anzulegender Wert (ct/kWh, >= 0, at most 3 decimals) -
            the plant's fixed EEG reference rate; only meaningful for
            direktvermarktung sites. (The deprecated marktpraemieCtKwh is no
            longer accepted; old clients sending it are ignored.)
        tarifArt:
          type: string
          enum: [dynamisch, fest, ohne]
          description: >
            The customer's electricity tariff art (default 'ohne'). 'dynamisch'
            values self-consumption per 15-min slot at spot + Aufschlag, 'fest'
            at the fixed price, 'ohne' in kWh only.
        tarifParamCtKwh:
          type: number
          nullable: true
          minimum: 0
          description: >
            The tariff parameter (ct/kWh, >= 0, at most 3 decimals): fixed price
            for 'fest', optional Aufschlag for 'dynamisch', ignored (cleared)
            for 'ohne'. Omit/null = not configured.
        netzladenErlaubt:
          type: boolean
          nullable: true
          description: >
            Grid-charging switch, settable by the site owner and by
            Portal-Admins; omitted = the safe default false ("Nur
            Solarladen (EEG)").
        maxFeedInKw:
          type: number
          nullable: true
          exclusiveMinimum: 0
          description: >
            Optional static feed-in cap at the grid connection point (kW,
            strictly positive, at most 2 decimals); omit/null = no
            connection-point limit. Enforced export-only by the optimizer.
    UpdateSiteRequest:
      type: object
      required: [name]
      description: Same fields and validation as CreateSiteRequest.
      properties:
        name: { type: string, description: Site display name (required, non-blank). }
        biddingZone:
          type: string
          enum: [DE-LU, AT, CH]
          description: "Day-ahead bidding zone; defaults to 'DE-LU'."
        latitude: { type: number, nullable: true, minimum: -90, maximum: 90 }
        longitude: { type: number, nullable: true, minimum: -180, maximum: 180 }
        plantKind: { type: string, enum: [direktvermarktung, eigenverbrauch] }
        anzulegenderWertCtKwh: { type: number, nullable: true, minimum: 0 }
        tarifArt:
          type: string
          enum: [dynamisch, fest, ohne]
          description: >
            The customer's electricity tariff art (default 'ohne'; a
            full-representation field like plantKind, so an omitted value resets
            to 'ohne').
        tarifParamCtKwh:
          type: number
          nullable: true
          minimum: 0
          description: >
            The tariff parameter (ct/kWh): fixed price for 'fest', optional
            Aufschlag for 'dynamisch', cleared for 'ohne'.
        netzladenErlaubt:
          type: boolean
          nullable: true
          description: >
            Grid-charging switch, settable by the site owner and by
            Portal-Admins; null keeps the stored value (a form that omits
            the field never flips it).
        maxFeedInKw:
          type: number
          nullable: true
          exclusiveMinimum: 0
          description: >
            Static feed-in cap at the grid connection point (kW, strictly
            positive, at most 2 decimals); null keeps the stored value (a
            form that omits the field never clears the cap - the
            netzladenErlaubt pattern).
    SiteDeletionPreview:
      type: object
      description: What deleting a site would remove (drives the confirm dialog).
      properties:
        deviceCount: { type: integer, description: Devices still at the site; > 0 blocks the delete (409). }
        telemetryCount: { type: integer, format: int64 }
        telemetryFrom: { type: string, format: date-time, nullable: true }
        telemetryTo: { type: string, format: date-time, nullable: true }
        forecastCount: { type: integer, format: int64 }
        scheduleCount: { type: integer, format: int64 }
        weatherCount: { type: integer, format: int64 }
    UpdateDeviceRequest:
      type: object
      description: Only kind + label are editable; the externalRef is immutable.
      properties:
        kind: { type: string, enum: [inverter, battery, meter], nullable: true, description: Unchanged when omitted. }
        name: { type: string, nullable: true, maxLength: 120, description: Customer-facing label; blank/null removes it. }
    DeviceClaimRequest:
      type: object
      required: [siteId, externalRef]
      properties:
        siteId: { type: string, format: uuid }
        externalRef: { type: string, description: Edge device identifier (globally unique). }
        kind: { type: string, description: "Device kind; defaults to 'inverter'.", example: inverter }
    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        externalRef: { type: string }
        kind: { type: string, example: inverter }
        name:
          type: string
          nullable: true
          description: Optional customer-facing label (Bezeichnung); the immutable externalRef stays the identity.
        status: { type: string, example: claimed }
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Newest telemetry timestamp for the device; null until the first data
            arrives. The portal derives the onboarding state from it ("wartet auf
            erste Daten" -> online).
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the device was claimed. The portal escalates the "wartet auf
            erste Daten" copy to troubleshooting guidance once the wait since
            claiming exceeds a threshold.
    DevicePurgeResult:
      type: object
      properties:
        deviceId: { type: string, format: uuid }
        purgedRows:
          type: integer
          format: int64
          description: Raw telemetry rows removed (the derived rollups are rebuilt, not counted).
        purgedBefore:
          type: string
          format: date-time
          description: >
            The purge watermark. Samples observed at or before this instant are
            refused by the ingest path from now on; new data flows normally.
        deviceNotified:
          type: boolean
          description: >
            Whether the retained purge_data command reached the broker. When
            false (broker outage), the cloud data is still gone and replays are
            blocked; the device's local buffer is wiped once the command can be
            delivered.
    ProvisionDeviceRequest:
      type: object
      required: [externalRef]
      properties:
        externalRef:
          type: string
          description: Sticker Geräte-ID (prefix VP-, canonicalized to uppercase).
          example: VP-1234-ABCD
        kind: { type: string, description: "Device kind; defaults to 'inverter'.", example: inverter }
        note: { type: string, nullable: true, description: Free-form operator note (e.g. manufacturing batch). }
    ProvisionedDevice:
      type: object
      properties:
        externalRef: { type: string, example: VP-1234-ABCD }
        kind: { type: string, example: inverter }
        note: { type: string, nullable: true }
        provisionedAt: { type: string, format: date-time }
        claimed: { type: boolean, description: Whether any tenant has connected this device. }
        claimedByTenant:
          type: string
          nullable: true
          description: Name of the claiming tenant (null while unclaimed).
    PendingEnrollment:
      type: object
      description: A device that enrolled (uploaded a CSR) but has no claimed device row.
      properties:
        externalRef: { type: string, example: edge-k7m2xqp }
        deviceInfo: { type: string, nullable: true, description: Free-form device info from the CSR upload. }
        csrUpdatedAt: { type: string, format: date-time, description: When the pending CSR was last (re)uploaded. }
        everIssued:
          type: boolean
          description: >
            True when a certificate was once issued and the device was later
            unclaimed (a stale enrollment), false when never claimed at all.
        issuedAt: { type: string, format: date-time, nullable: true, description: When a certificate was issued (null if never). }
    TelemetryPoint:
      type: object
      properties:
        ts: { type: string, format: date-time }
        powerKw: { type: number }
        socPct: { type: number }
        pvPowerKw: { type: number }
        loadKw: { type: number }
        gridLimitKw:
          type: number
          description: Observed effective §14a power limit.
    PriceSeries:
      type: object
      description: Day-ahead spot prices for a bidding zone (market-wide, not per tenant).
      properties:
        biddingZone: { type: string, example: DE-LU }
        resolution:
          type: string
          nullable: true
          description: ISO-8601 slot resolution of the latest data.
          example: PT15M
        currency: { type: string, example: EUR }
        points:
          type: array
          items: { $ref: "#/components/schemas/PricePoint" }
    PricePoint:
      type: object
      properties:
        ts: { type: string, format: date-time, description: Slot start (UTC). }
        end: { type: string, format: date-time, description: Slot end (exclusive). }
        priceEurMwh: { type: number, description: Spot price in EUR/MWh. }
    PriceHistory:
      type: object
      description: Day-ahead prices aggregated over a historical range (market-wide per zone).
      properties:
        biddingZone: { type: string, example: DE-LU }
        currency: { type: string, example: EUR }
        bucket:
          type: string
          description: Aggregation granularity as ISO-8601 duration (PT15M day, PT1H week, P1D month/year).
          example: P1D
        from: { type: string, format: date-time, description: Window start (inclusive, UTC). }
        to: { type: string, format: date-time, description: Window end (exclusive, UTC). }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/PriceBucket" }
        summary: { $ref: "#/components/schemas/PriceRangeSummary" }
    PriceBucket:
      type: object
      properties:
        ts: { type: string, format: date-time, description: Bucket start (UTC). }
        avgEurMwh: { type: number, nullable: true, description: Mean price over the bucket (EUR/MWh). }
        minEurMwh: { type: number, nullable: true, description: Lowest slot price in the bucket (EUR/MWh). }
        maxEurMwh: { type: number, nullable: true, description: Highest slot price in the bucket (EUR/MWh). }
    PriceRangeSummary:
      type: object
      description: Headline stats over the raw slots in the range window.
      properties:
        avgEurMwh: { type: number, nullable: true }
        minEurMwh: { type: number, nullable: true }
        maxEurMwh: { type: number, nullable: true }
        cheapestTs: { type: string, format: date-time, nullable: true, description: Start of the cheapest slot. }
        mostExpensiveTs: { type: string, format: date-time, nullable: true, description: Start of the most expensive slot. }
        count: { type: integer, description: Number of raw price slots in the window. }
        coverageStart: { type: string, format: date-time, nullable: true, description: Earliest slot with data. }
        coverageEnd: { type: string, format: date-time, nullable: true, description: Latest slot with data. }
    WeatherForecast:
      type: object
      properties:
        runAt:
          type: string
          format: date-time
          nullable: true
          description: Issue time of the forecast run (null if none stored yet).
        points:
          type: array
          items: { $ref: "#/components/schemas/WeatherPoint" }
    WeatherPoint:
      type: object
      properties:
        ts: { type: string, format: date-time, description: Forecast target hour (UTC). }
        temperatureC: { type: number, nullable: true, description: 2 m air temperature. }
        cloudCoverPct: { type: number, nullable: true, description: Total cloud cover 0..100. }
        ghiWM2:
          type: number
          nullable: true
          description: Shortwave / global-horizontal irradiance (W/m²), PV-relevant.
        dniWM2: { type: number, nullable: true, description: Direct (beam) radiation (W/m²). }
        dhiWM2: { type: number, nullable: true, description: Diffuse radiation (W/m²). }
    Schedule:
      type: object
      properties:
        planId: { type: string, format: uuid, nullable: true }
        deviceId: { type: string, format: uuid, nullable: true, description: "Executing battery device (the MQTT schedule topic's device)." }
        generatedAt: { type: string, format: date-time, nullable: true }
        slotMinutes: { type: integer, example: 15 }
        savingsEur:
          type: number
          nullable: true
          description: Projected savings over the horizon vs. leaving the battery idle (the no-battery baseline).
        bankedValueEur:
          type: number
          nullable: true
          description: >-
            Value of the energy the plan banks into (positive) or draws out of
            (negative) the horizon: the run's persisted terminal value per
            stored kWh times the SoC swing (socEndPct - socStartPct). Makes
            savingsEur honest on bank days, where storing into the next day
            reads as negative savings. Null when not computable (runs predating
            the terminal-value column, no battery asset) - never a fabricated 0.
        socStartPct:
          type: number
          nullable: true
          description: Battery state of charge at the plan start (the SoC the banked value is measured from).
        socEndPct:
          type: number
          nullable: true
          description: Planned state of charge at the horizon end.
        slots:
          type: array
          items:
            type: object
            properties:
              start: { type: string, format: date-time }
              batteryKw: { type: number, description: "Planned battery power; + = charge, - = discharge." }
              gridKw: { type: number, description: "Projected net grid power; + = import, - = export." }
              socPct: { type: number, description: "Planned state of charge at slot end." }
              priceEurMwh: { type: number }
              costEur: { type: number, description: "Projected slot cost with the plan." }
              baselineCostEur: { type: number, description: "Projected slot cost with the battery idle." }
              curtailKw: { type: number, nullable: true, description: "Planned PV curtailment for the slot (kW held back, >= 0); the optimizer curtails feed-in at negative prices. Null on pre-curtailment runs." }
    ControlStatus:
      type: object
      description: Latest inverter-control confirmation for a site (report §5).
      properties:
        deviceId: { type: string, format: uuid }
        commandedKw: { type: number, nullable: true, description: "Commanded battery setpoint (Fahrplan-Sollwert)." }
        confirmedKw: { type: number, nullable: true, description: "Setpoint the inverter read back." }
        allMatch: { type: boolean, description: "True when every controlled register confirmed its commanded value." }
        controlEnabled: { type: boolean, description: "Whether the device's control kill-switch is on." }
        certified: { type: boolean, description: "Whether the model is bench-certified for control." }
        mismatchRoles: { type: string, nullable: true, description: "Comma-separated roles that did not confirm (e.g. \"battery_power\")." }
        slotStart: { type: string, format: date-time, nullable: true }
        checkedAt: { type: string, format: date-time, description: "When the readback was taken (\"geprüft vor X\")." }
    History:
      type: object
      properties:
        range: { type: string, enum: [day, week, month, year] }
        from: { type: string, format: date-time, description: Period start (inclusive). }
        to: { type: string, format: date-time, description: Period end (exclusive). }
        bucketMinutes: { type: integer, description: "15 (day), 60 (week) or 1440 (month/year)." }
        buckets:
          type: array
          items:
            type: object
            properties:
              start: { type: string, format: date-time }
              pvKwh: { type: number, nullable: true }
              loadKwh: { type: number, nullable: true }
              gridImportKwh: { type: number, nullable: true }
              gridExportKwh: { type: number, nullable: true }
              batteryChargeKwh: { type: number, nullable: true, description: Derived from the telemetry power balance. }
              batteryDischargeKwh: { type: number, nullable: true }
              socMinPct: { type: number, nullable: true }
              socMaxPct: { type: number, nullable: true }
              socLastPct: { type: number, nullable: true }
              priceEurMwh: { type: number, nullable: true, description: Day-ahead price of the slot (day range only). }
              costEur: { type: number, nullable: true, description: Import energy x matching day-ahead price. }
        totals:
          type: object
          properties:
            consumptionKwh: { type: number }
            pvGenerationKwh: { type: number }
            gridImportKwh: { type: number }
            gridExportKwh: { type: number }
            gridCostEur: { type: number, nullable: true, description: Null when no price data overlaps the period. }
            batterySavingsEur: { type: number, nullable: true, description: From persisted optimizer plans; null where none exist. }
            autarkiePct: { type: number, nullable: true, description: "(1 - grid import / consumption) x 100, clamped 0..100." }
            eigenverbrauchPct: { type: number, nullable: true, description: "(pv - grid export) / pv x 100, clamped 0..100." }
        protocol:
          type: array
          description: Tagesprotokoll (day range only, else empty).
          items:
            type: object
            properties:
              type: { type: string, enum: [batterie-laden, batterie-entladen, pv-spitze, preis-tief, preis-hoch] }
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
              text: { type: string, description: Plain-German event description. }
              energyKwh: { type: number, nullable: true }
              avgPriceEurMwh: { type: number, nullable: true }
              avoidedCostEur: { type: number, nullable: true }
              peakKw: { type: number, nullable: true }
        plan:
          type: array
          description: >
            Plan-vs-actual overlay (day range only, else empty): per 15-min slot
            the battery power/SoC of the latest persisted optimizer run.
          items:
            type: object
            properties:
              time: { type: string, format: date-time }
              batteryKw: { type: number, nullable: true, description: "+ = charge, - = discharge." }
              socPct: { type: number, nullable: true }
    ForecastQuality:
      type: object
      description: >
        Shadow-mode forecast transparency for one site. Model ids are the
        registry vocabulary: load-persistence / pv-physical (baselines),
        load-xgb / pv-residual-xgb (challengers).
      properties:
        activeLoadModel: { type: string, example: load-persistence, description: The model whose load forecasts the optimizer consumes. }
        activePvModel: { type: string, example: pv-physical }
        models:
          type: array
          description: Lifecycle of every model that has run on this site.
          items:
            type: object
            properties:
              model: { type: string, example: load-xgb }
              kind: { type: string, enum: [load, pv] }
              status:
                type: string
                enum: [collecting, ready]
                description: "'collecting' = self-gate unmet, the challenger emits NO predictions yet."
              active: { type: boolean, description: Whether the optimizer consumes this model. }
              daysCollected: { type: integer, nullable: true }
              daysRequired: { type: integer, nullable: true, description: Training-day gate (default 21). }
              trainedAt: { type: string, format: date-time, nullable: true }
              trainRows: { type: integer, nullable: true }
              featureImportance:
                type: array
                description: Top features of the last training run, most important first.
                items:
                  type: object
                  properties:
                    feature: { type: string, example: lag_1d_kw }
                    label: { type: string, example: Verbrauch gestern zur gleichen Zeit, description: Plain-German label. }
                    weight: { type: number, description: Normalized share of total gain, 0..1. }
              updatedAt: { type: string, format: date-time }
        accuracy:
          type: array
          description: Daily forecast-vs-actual metrics per model (Europe/Berlin days).
          items:
            type: object
            properties:
              day: { type: string, format: date }
              model: { type: string }
              kind: { type: string, enum: [load, pv] }
              maeKw: { type: number, description: Mean absolute error over the day's evaluated 15-min slots. }
              nmaePct: { type: number, nullable: true, description: MAE / mean absolute actual x 100; null on all-zero days. }
              biasKw: { type: number, nullable: true, description: Mean signed error (forecast - actual). }
              skillVsBaseline: { type: number, nullable: true, description: "1 - mae/mae_baseline; positive = better than the baseline; null for the baseline itself." }
              nSlots: { type: integer }
        planAccuracy:
          type: array
          description: Daily plan-vs-actual economics of the optimizer's persisted plans.
          items:
            type: object
            properties:
              day: { type: string, format: date }
              plannedCostEur: { type: number, nullable: true }
              baselineCostEur: { type: number, nullable: true, description: Projected cost with the battery idle. }
              realizedCostEur: { type: number, nullable: true, description: Actual signed grid cost (telemetry x price). }
              nSlots: { type: integer }
    SiteKpis:
      type: object
      properties:
        siteId: { type: string, format: uuid }
        selfConsumptionPct: { type: number }
        estimatedSavingsEur: { type: number }
        window: { type: string, example: last_30_days }
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        segment: { type: string, enum: [CI, B2C], example: CI }
        plan: { type: string, example: mvp }
        createdAt: { type: string, format: date-time }
    CreateTenantRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        segment: { type: string, enum: [CI, B2C], description: "Defaults to 'CI'." }
    AdminUser:
      type: object
      properties:
        id: { type: string, description: Keycloak user id. }
        username: { type: string }
        email: { type: string, nullable: true }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        enabled: { type: boolean }
        tenantId: { type: string, format: uuid, nullable: true, description: From the user's tenant_id attribute. }
    CreateUserRequest:
      type: object
      required: [username]
      properties:
        username: { type: string }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        password: { type: string, description: Optional initial password. }
        temporaryPassword: { type: boolean, description: "If true, the user must change it at first login. Default false." }
    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8, maxLength: 128, description: The new password (same length rule as self-registration). }
        temporary: { type: boolean, description: "If true (default), the user must change it at next login." }
    UpdateTenantRequest:
      type: object
      required: [name]
      description: Same validation as CreateTenantRequest.
      properties:
        name: { type: string }
        segment: { type: string, enum: [CI, B2C], description: "Defaults to 'CI'." }
    DeleteTenantRequest:
      type: object
      required: [confirmName]
      properties:
        confirmName:
          type: string
          description: Must equal the tenant's exact name (type-to-confirm fat-finger protection).
    TenantOffboardingReport:
      type: object
      description: >
        What the offboarding removed. The database part is transactional
        (all-or-nothing); `failedUsers` lists Keycloak logins that could not be
        deleted and need manual cleanup.
      properties:
        tenantId: { type: string, format: uuid }
        tenantName: { type: string }
        deletedSites: { type: integer }
        deletedDevices: { type: integer }
        deletedTelemetryRows: { type: integer, format: int64 }
        deletedUsers:
          type: array
          items: { type: string }
        failedUsers:
          type: array
          items: { type: string }
    UpdateUserRequest:
      type: object
      description: Email/name only; the username is immutable.
      properties:
        email: { type: string, format: email, nullable: true }
        firstName: { type: string, nullable: true, maxLength: 120 }
        lastName: { type: string, nullable: true, maxLength: 120 }
    OptimizerDiagnostics:
      type: object
      description: >
        One persisted optimizer run with the per-slot euro decomposition (see
        the endpoint description). Run-level fields carry the "inputs at a
        glance" master data; `storedEnergyValueIsApproximation` is always true
        (the stored-energy value is a forward best-use heuristic, not a MILP
        shadow price - the UI must label it).
      properties:
        siteId: { type: string, format: uuid }
        planId: { type: string, format: uuid, nullable: true }
        generatedAt: { type: string, format: date-time, nullable: true, description: Null when the site has no plan yet. }
        slotMinutes: { type: integer, example: 15 }
        availableRuns:
          type: array
          items: { type: string, format: date-time }
          description: Recent run timestamps (newest first) for the run picker.
        plantKind: { type: string, enum: [direktvermarktung, eigenverbrauch] }
        netzladenErlaubt: { type: boolean }
        tarifArt: { type: string, enum: [dynamisch, fest, ohne] }
        tarifParamCtKwh: { type: number, nullable: true }
        anzulegenderWertCtKwh: { type: number, nullable: true }
        backupReserveSocPct: { type: number, nullable: true }
        battery:
          type: object
          nullable: true
          description: Null for sites without a battery asset.
          properties:
            capacityKwh: { type: number, nullable: true }
            roundtripEfficiencyPct: { type: number, nullable: true }
            wearCostCtPerKwh: { type: number, description: The EFFECTIVE per-cycle wear rate. }
            wearCostSource: { type: string, enum: [asset, platform-default] }
            socMinPct: { type: number, description: Effective usable-band floor (override or 5). }
            socMaxPct: { type: number, description: Effective usable-band ceiling (override or 95). }
        activeLoadModel: { type: string }
        activePvModel: { type: string }
        storedEnergyValueIsApproximation: { type: boolean, example: true }
        slots:
          type: array
          items: { $ref: "#/components/schemas/OptimizerDiagnosticsSlot" }
    OptimizerDiagnosticsSlot:
      type: object
      description: >
        One 15-min plan slot: the persisted schedule columns plus the computed
        ct/kWh decomposition. Every computed field is null when honestly not
        computable for this slot (no persisted spot price, pre-P2 row without
        wear, battery-less site) - never a fabricated 0.
      properties:
        time: { type: string, format: date-time }
        batteryKw: { type: number, nullable: true, description: +charge / -discharge. }
        gridKw: { type: number, nullable: true, description: +import / -export. }
        socPct: { type: number, nullable: true }
        loadKw: { type: number, nullable: true }
        pvKw: { type: number, nullable: true }
        curtailKw: { type: number, nullable: true }
        costEur: { type: number, nullable: true }
        baselineCostEur: { type: number, nullable: true }
        wearCostEur: { type: number, nullable: true, description: The persisted P2 wear this slot spends. }
        solverPriceCtKwh: { type: number, nullable: true, description: The bare day-ahead spot price (schedule.price_eur_mwh / 10). }
        importPriceCtKwh: { type: number, nullable: true, description: Real cost of an imported kWh per the site's tariff. }
        exportValueCtKwh: { type: number, nullable: true, description: Real value of an exported kWh per the plant's remuneration. }
        wearCostCtKwh: { type: number, nullable: true, description: Derived wear rate per kWh of throughput (null for idle slots). }
        valueOfStoredEnergyCtKwh: { type: number, nullable: true, description: APPROXIMATION - forward best-use price x efficiency minus wear. }
        decisionLabel: { type: string, enum: [solarladen, netzladen, entladen, ruhe] }
        whyText: { type: string, description: One composed German sentence explaining the decision. }
    OptimizerConfig:
      type: object
      description: The optimizer knobs of one site (see the endpoint description).
      properties:
        siteId: { type: string, format: uuid }
        hasBattery: { type: boolean }
        defaults:
          type: object
          description: Platform-wide tunables (the optimizer's OPTIMIZER_* env; read-only).
          properties:
            wearCostCtPerKwh: { type: number, example: 4.0 }
            socMinPct: { type: number, example: 5 }
            socMaxPct: { type: number, example: 95 }
            terminalValueQuantile: { type: number, example: 0.3 }
            terminalValueCtPerKwh: { type: number, nullable: true, description: Null = derived per plan. }
        overrides:
          type: object
          description: The nullable per-site/per-asset columns (null = default applies).
          properties:
            wearCostCtPerKwh: { type: number, nullable: true }
            socMinPct: { type: number, nullable: true }
            socMaxPct: { type: number, nullable: true }
            backupReserveSocPct: { type: number, nullable: true }
        effective:
          type: object
          description: >
            What the optimizer resolves (override ?? default). Battery fields
            are null for battery-less sites; a null backupReserveSocPct means
            "no reserve" (the technical floor applies unchanged).
          properties:
            wearCostCtPerKwh: { type: number, nullable: true }
            socMinPct: { type: number, nullable: true }
            socMaxPct: { type: number, nullable: true }
            backupReserveSocPct: { type: number, nullable: true }
        peakShaving:
          type: object
          description: >
            The peak-shaving module (PS-1/PS-2, Lastspitzenkappung) - the ONE
            writable surface for it (captain decision: vertragsnahe Module
            richtet VoltPilot ein, nicht der Kunde). A non-null
            leistungspreisEurKw IS the module-active flag; the optimizer then
            prices the billing period's 15-min import peak economically
            (epigraph + peak_so_far anchor) and publishes the planned peak
            target to the edge. Echoed read-only on the customer Site.
          properties:
            leistungspreisEurKw:
              type: number
              nullable: true
              minimum: 0
              description: EUR per kW per billing period; null = module off.
            abrechnungLeistung:
              type: string
              enum: [jahr, monat]
              description: Billing period of the Leistungspreis (Europe/Berlin calendar).
            peakReserveSocPct:
              type: number
              nullable: true
              minimum: 0
              maximum: 100
              description: >
                Hard SoC floor reserved for out-of-horizon peaks; stacks with
                the backup reserve (highest absolute floor binds). null = none.
        site:
          type: object
          description: Read-only echo of the levers editable via PUT /api/v1/sites/{siteId}.
          properties:
            netzladenErlaubt: { type: boolean }
            plantKind: { type: string }
            tarifArt: { type: string }
            tarifParamCtKwh: { type: number, nullable: true }
            anzulegenderWertCtKwh: { type: number, nullable: true }
    UpdateOptimizerConfigRequest:
      type: object
      description: >
        Full-representation override write: a null/absent field clears that
        override back to the platform default. wearCostCtPerKwh/socMinPct/
        socMaxPct live on the battery asset (409 without one);
        backupReserveSocPct and the peak-shaving module fields on the site.
        A null/absent abrechnungLeistung resets to 'jahr' (the column default).
      properties:
        wearCostCtPerKwh: { type: number, nullable: true, minimum: 0 }
        socMinPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        socMaxPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        backupReserveSocPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        leistungspreisEurKw:
          type: number
          nullable: true
          minimum: 0
          description: PS-1 Leistungspreis (EUR/kW per billing period); null switches the module off.
        abrechnungLeistung:
          type: string
          nullable: true
          enum: [jahr, monat]
          description: Billing period; null resets to 'jahr'.
        peakReserveSocPct:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: PS-2 peak-shaving SoC reserve; null clears it.
