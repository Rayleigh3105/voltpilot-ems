        startAuthStatus: { type: string, nullable: true }
        stopAuthStatus: { type: string, nullable: true }
        parentIdTagRef: { type: string, nullable: true, pattern: '^tagref_[0-9a-f]+$' }
        transactionData: { type: array, description: Nach 90 Tagen leer; Einzelwerte stehen außerdem dimensionsgetreu im MeterValue-Endpunkt. }
