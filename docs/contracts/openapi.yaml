        transactionId: { type: integer, nullable: true }
        source: { enum: [MeterValues, TransactionData] }
        pointKey: { type: string, description: Kanonischer Schlüssel aller sechs OCPP-SampledValue-Dimensionen. }
        measurand: { type: string }
        context: { type: string }
        format: { type: string }
        phase: { type: string }
        location: { type: string }
        unit: { type: string }
