    OcppActionAudit:
      type: object
      properties:
        id: { type: integer, format: int64 }
        actor: { type: string }
        state: { type: string }
        reason: { type: string, nullable: true }
        deviceId: { type: string, format: uuid }
        chargePointId: { type: string }
        connectorId: { type: integer, nullable: true }
        transactionId: { type: integer, nullable: true }
        occurredAt: { type: string, format: date-time }
    RegisterWriteRequest:
      type: object
      description: >
        Was der Mensch im Register-Drawer eingetragen hat - ROH.
        Adresse und Wert sind absichtlich Zeichenketten: das Journal speichert
        sie VERBATIM, damit spaeter belegbar ist, was jemand wirklich getippt
        hat ("231" vs "0x00E7"), und nicht nur unsere Normalisierung.
      required: [address]
      properties:
        deviceId:
          type: string
          format: uuid
          description: >
            Das Ziel-Geraet. Ohne Angabe entscheidet das EINZIGE Geraet der
            Anlage; eine Anlage mit mehreren wird beim Namen genannt (409) -
            das Ziel wird nie geraten.
        lane:
          type: string
          enum: [primary, entity, lan]
          default: primary
          description: >
            WELCHES Ziel (Stufe 2). Die Asymmetrie ist die Sicherheit: bei
            `primary` nennt die Cloud NICHTS und die Box nimmt ihren eigenen
            Wechselrichter; bei `entity` reist NUR die Kennung, den Transport
            loest die Box aus IHRER angewandten Definition auf; nur bei `lan`
            reist der Endpunkt - und nur dort prueft die Box ihn selbst
            (LAN-Whitelist). Ein aelterer Client, der nichts schickt, arbeitet
            zeichengleich wie in Stufe 1 weiter.
        entityId:
          type: string
          format: uuid
          description: "Die Komponente - nur bei lane=entity, dann PFLICHT."
        host:
          type: string
          maxLength: 253
          description: >
            Die freie LAN-Adresse - nur bei lane=lan, dann PFLICHT. Ob sie
            belegbar privat ist, prueft die BOX; hier steht keine zweite
            Wahrheit ueber ein Netz, das die api nie gesehen hat.
        port: { type: integer, minimum: 1, maximum: 65535, default: 502 }
        unitId: { type: integer, minimum: 0, maximum: 255, default: 1 }
        registerKind: { type: string, enum: [holding, coil], default: holding }
        address:
          type: string
          maxLength: 16
          description: "Dezimal (231) oder hexadezimal (0x00E7). Ein nacktes E7 wird bewusst NICHT als Hex geraten."
        value:
          type: string
          maxLength: 16
          description: "Der ROHE Registerwert (kein kW). Nur beim Schreiben; dieselbe Schreibweise wie die Adresse."
        expectedBefore:
          type: integer
          minimum: 0
          maximum: 65535
          description: "Der Ist-Wert der Vorschau. Er wird AUF DEM GERAET verglichen, in derselben Socket-Sitzung, in der gelesen und geschrieben wird."
        writeFc:
          type: integer
          enum: [5, 6, 16]
          description: "Leer lassen: dann entscheidet die Box (Spule 5, Holding 16). FC16 ist die Vorauswahl, weil viele Firmwares einen FC6-Rahmen ANNEHMEN und nie uebernehmen."
        note:
          type: string
          maxLength: 500
          description: "Der Grund, verbatim ins Journal. PFLICHT bei Registerklasse netz_compliance (Captain-Entscheid D5), sonst freiwillig."
    RegisterWriteOutcome:
      type: object
      description: >
        Das Ergebnis EINES Schritts. Jedes Zahlenfeld darf fehlen, und ein
        fehlendes heisst "nicht gemessen", nie 0 - bei einer Einspeisegrenze
        waere 0 ein WERT ("gar keine Einspeisung erlaubt").
      properties:
        requestId: { type: string }
        mode: { type: string, enum: [lesen, schreiben] }
        ok: { type: boolean }
        outcome:
          type: string
          enum: [gelesen, uebernommen, nicht_uebernommen, abgelehnt, fehler, unbekannt]
          description: "`unbekannt` ist die ehrliche Antwort auf Schweigen und ausdruecklich NICHT 'nicht geschrieben'."
        beforeRaw: { type: integer, nullable: true }
        afterRaw: { type: integer, nullable: true }
        beforeScaled: { type: number, nullable: true, description: "Nur wo eine Skala bekannt ist - nie eine erfundene Einheit." }
        afterScaled: { type: number, nullable: true }
        adopted:
          type: boolean
          nullable: true
          description: "DREIWERTIG: null = keine Aussage (Vorschau, ausgebliebene Quittung), false = angenommen aber NICHT uebernommen, true = zurueckgelesen."
        errorCode: { type: string, nullable: true, description: "Eine der geschlossenen Klassen des Downlink-Kontrakts; ein unbekanntes Wort wird verworfen." }
        message: { type: string, nullable: true }
        targetLabel: { type: string, nullable: true, description: "WOHIN die Box geschrieben hat - ihr eigenes Echo." }
        address: { type: integer }
        addressHex: { type: string }
        registerLabel: { type: string, nullable: true, description: "null = VoltPilot kennt dieses Register nicht (nie ein erfundener Name)." }
        registerClass: { type: string, enum: [netz_compliance, bekannt, unbekannt] }
        scaleNote: { type: string, nullable: true }
        registerNote:
          type: string
          nullable: true
          description: >
            Der Betreiber-Hinweis des Register-Wissens ("gehoert zur laufenden
            Steuerung", "Skalierung haengt an der Bauart") - oder null.
        scaleUnit: { type: string, nullable: true, description: "Die Einheit des skalierten Werts; null = keine bekannte Skala." }
        noteRequired: { type: boolean }
        confirm: { type: string, nullable: true, description: "Der Bestaetigungs-Token, den dieser Schreibvorgang getragen hat." }
        writesToday:
          type: integer
          description: >
            Wie oft dieses Register auf diesem Geraet HEUTE schon angefordert
            wurde (Berliner Tag). EEPROM-Ehrlichkeit statt einer Sperre;
            gezaehlt werden ANFORDERUNGEN, nicht Quittungen - ein
            Schreibvorgang, dessen Antwort verloren ging, kann angekommen sein.
        lane: { type: string, enum: [primary, entity, lan] }
        at: { type: string, format: date-time }
    RegisterWriteTarget:
      type: object
      description: >
        Ein Ziel des Geraete-Pickers. Ein Geraet ohne Schreibweg steht MIT
        seinem Grund hier - genannt statt verschwiegen.
      properties:
        lane: { type: string, enum: [primary, entity, lan] }
        deviceId: { type: string, format: uuid }
        entityId: { type: string, format: uuid, nullable: true, description: "Nur bei lane=entity." }
        label: { type: string }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        family:
          type: string
          nullable: true
          description: >
            Die Register-Familie, aus der das Register-Wissen spricht. null =
            die Box hat sie (noch) nicht gemeldet - dann bleibt jedes Register
            dort ehrlich "unbekannt" statt mit einer fremden Bedeutung
            beschriftet zu werden.
        communication: { type: string, nullable: true }
        host: { type: string, nullable: true }
        port: { type: integer, nullable: true }
        unitId: { type: integer, nullable: true }
        writable: { type: boolean, description: "ANZEIGE-Hilfe, keine Zusage - die Box entscheidet." }
        reason: { type: string, nullable: true, description: "Warum nicht - immer gesetzt, wenn writable false ist." }
    RegisterKnowledgeFamily:
      type: object
      description: "Eine Register-Familie des kuratierten Verzeichnisses."
      properties:
        family: { type: string }
        brand: { type: string, nullable: true }
        label:
          type: string
          nullable: true
          description: >
            Der gemeinsame Komponenten-Anzeigename (`measurement_point.label`),
            sobald `entityId` gebunden ist; null = Portal fällt auf die
            ChargePointId zurück. Vor der Bindung darf vorübergehend das von
            der Box gemeldete Label stehen.
        registers:
          type: array
          items:
            type: object
            properties:
              address: { type: integer }
              addressHex: { type: string }
              label: { type: string }
              clazz: { type: string, enum: [netz_compliance, bekannt, unbekannt] }
              scale: { type: number, nullable: true }
              unit: { type: string, nullable: true, description: "Eine Skala kommt NUR mit ihrer Einheit." }
              note: { type: string, nullable: true }
    RegisterWriteEvent:
      type: object
      description: >
        EIN Vorgang aus dem append-only Journal, zu einer Zeile gefaltet.
        Die Herkunft steht an der Zeile: `kunde`/`voltpilot` sind ueber ein
        validiertes Token beweisbare Identitaeten, `geraet` ist der
        Wartungszugang an der Box - fuer den es cloud-seitig KEINE Identitaet
        gibt, und genau das sagt das Wort.
      properties:
        id: { type: integer, format: int64 }
        requestId: { type: string, description: "Der Kreuz-Schluessel zum persistenten Audit AUF der Box." }
        source: { type: string, enum: [portal, geraet] }
        deviceId: { type: string, nullable: true }
        deviceRef: { type: string, nullable: true }
        lane: { type: string, nullable: true }
        entityId:
          type: string
          format: uuid
          nullable: true
          description: >
            Die Komponente der Lane `komponente` (sonst null) - die einzige
            Zuordnung, mit der sich ein Vorgang einem Geraet HINTER der Box
            zuschreiben laesst. Primaere Lane und frei getippte Adresse gehoeren
            dem Schreibweg der BOX.
        targetLabel: { type: string, nullable: true }
        registerKind: { type: string, nullable: true }
        address: { type: integer, nullable: true }
        addressHex: { type: string, nullable: true }
        addressInput: { type: string, nullable: true, description: "VERBATIM, wie getippt." }
        valueInput: { type: string, nullable: true, description: "VERBATIM, wie getippt." }
        note: { type: string, nullable: true, description: "VERBATIM." }
        valueRaw: { type: integer, nullable: true }
        expectedBefore: { type: integer, nullable: true }
        registerLabel: { type: string, nullable: true }
        registerClass: { type: string, nullable: true }
        scaleNote: { type: string, nullable: true }
        origin: { type: string, enum: [kunde, voltpilot, geraet], nullable: true }
        actorName: { type: string, nullable: true, description: "Anzeige-Name, nie die Autoritaet." }
        actorRole: { type: string, nullable: true }
        viaTenantSwitcher: { type: boolean }
        requestedAt: { type: string, format: date-time }
        beforeRaw: { type: integer, nullable: true }
        afterRaw: { type: integer, nullable: true }
        adopted: { type: boolean, nullable: true }
        outcome: { type: string, nullable: true }
        reason: { type: string, nullable: true, description: "Der deutsche Satz der Box, verbatim." }
        answeredAt: { type: string, format: date-time, nullable: true }
    SelfBuildChannel:
      type: object
      description: >
        ONE measured value of a self-built Modbus device. The customer names it
        in PLAIN TEXT; the channel key is DERIVED server-side (the registry's
        open channel vocabulary) - a typed key would be a second truth about the
        same measurement.
      properties:
        label: { type: string, maxLength: 120, description: "Plain-text name, e.g. Wassertemperatur." }
        unit: { type: string, description: "One of the curated units; empty means honestly 'no unit'." }
        registerKind: { type: string, enum: [holding, input] }
        address:
          type: integer
          minimum: 0
          maximum: 65535
          description: "0-based protocol address (40001 in a manual is address 0)."
        dataType: { type: string, enum: [u16, s16, u32, s32, float32] }
        wordOrder: { type: string, enum: [big, little], description: "Only meaningful for 32-bit types." }
        scale: { type: number }
        offset: { type: number }
        minReadIntervalS:
          type: integer
          minimum: 5
          maximum: 3600
          default: 10
          description: "Poll budget - at most one read per channel per this many seconds."
    SelfBuildConnection:
      type: object
      description: Where the device sits in the customer's own network (LAN-only).
      properties:
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535, default: 502 }
        unitId: { type: integer, minimum: 0, maximum: 255, default: 1 }
    SaveSelfBuildRequest:
      type: object
      required: [connection, channels]
      properties:
        label: { type: string, maxLength: 200 }
        connection: { $ref: "#/components/schemas/SelfBuildConnection" }
        channels:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/SelfBuildChannel" }
        note: { type: string, maxLength: 200 }
    SocCurveTemplate:
      type: object
      required: [id, label, curveCharge]
      description: >
        ONE measured OCV->SoC table. A template is DATA, not code: it prefills
        the curve fields of a `soc_derivation`, nothing more - whoever has their
        own support points enters them and needs no template.
      properties:
        id: { type: string, description: kebab-case key, e.g. `diybms-176s-nmc`. }
        label: { type: string }
        description: { type: string }
        chemistry:
          type: string
          description: >
            nmc | lfp | ... - carried visibly BECAUSE the same voltage means a
            different state of charge on a different chemistry.
        cellsInSeries: { type: integer, nullable: true }
        refTempC: { type: number, nullable: true }
        cellMinV: { type: number, nullable: true }
        cellMaxV: { type: number, nullable: true }
        source: { type: string, description: Where the table was measured, verbatim. }
        curveCharge:
          type: array
          description: Support points `[cell voltage in V, state of charge in %]`, applied to the HIGHEST cell.
          items:
            type: array
            items: { type: number }
        curveDischarge:
          type: array
          nullable: true
          description: The discharge table, applied to the LOWEST cell. The conservative minimum of both wins.
          items:
            type: array
            items: { type: number }
    SaveUserDefinedBatteryRequest:
      type: object
      description: >
        The SELF-CONNECTED battery (P5 Ebene 1, `vp-deye-diybms-luecke-l5`
        §3.2b): a source in the customer LAN plus the user-defined field mapping
        onto the standard battery channels. The mapping vocabulary is CLOSED -
        the allowed target channels are exactly
        `user-defined-battery.default_measure` in the entity-type catalog, and a
        created battery declares only the channels actually mapped.


        `transport` picks which HALF must be filled: `mqtt_local` (the default
        when the field is absent - every connection made before P5-HTTP) needs
        `broker` and a `topic` per mapping; `http_local` needs `endpoint` (plus
        optional `auth`) and only a `path` per mapping - there without `staleS`,
        because an HTTP answer is ONE point in time. Sending both halves would be
        a connection with two addresses; the server takes the one that matches
        the transport and ignores the other.
      required: [mappings]
      properties:
        label: { type: string, maxLength: 200 }
        transport:
          type: string
          enum: [mqtt_local, http_local]
          default: mqtt_local
        broker: { $ref: "#/components/schemas/UserDefinedBatteryBroker" }
        endpoint: { $ref: "#/components/schemas/UserDefinedBatteryEndpoint" }
        auth: { $ref: "#/components/schemas/UserDefinedBatteryAuth" }
        mappings:
          type: array
          minItems: 1
          maxItems: 16
          items: { $ref: "#/components/schemas/UserDefinedBatteryMapping" }
        publishIntervalS:
          type: integer
          minimum: 5
          maximum: 3600
          default: 15
          description: >
            The cadence at which the box publishes ONE telemetry message with
            every channel that currently has a fresh value. It IS the flow's
            trigger interval - there is no second cadence concept.
        socDerivation: { $ref: "#/components/schemas/UserDefinedBatterySocDerivation" }
        binding: { $ref: "#/components/schemas/UserDefinedBatteryBinding" }
        note: { type: string, maxLength: 200 }
    UserDefinedBatteryEndpoint:
      type: object
      description: >
        The HTTP/JSON endpoint of the battery (P5-HTTP) - only with
        `transport: http_local`, and there mandatory. The box GETs exactly this
        address once per tick; it appends nothing and guesses nothing.


        The LAN-only rule is the same one every self-built connection follows,
        and `path` is a PATH, never a second address: it starts with `/`, carries
        no whitespace and must not begin with `//` (which would be a
        protocol-relative URL, i.e. a target other than the checked one).
      required: [host, path]
      properties:
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535, default: 80 }
        path:
          type: string
          maxLength: 200
          example: "/ha"
          description: The URL path written out, query string included.
        tls: { type: boolean, default: false }
        timeoutMs: { type: integer, minimum: 500, maximum: 30000, default: 5000 }
    UserDefinedBatteryAuth:
      type: object
      description: >
        How VoltPilot authenticates at that endpoint (P5-HTTP): `header` is the
        DIYBMS case (a freely named header key, typically `ApiKey`), `bearer` the
        usual `Authorization: Bearer …`, `basic` classic HTTP basic. `none` is the
        default, because most BMS in a home network demand nothing.


        ⚠ `secret` is the one value that never comes BACK: listings carry the
        fixed mask instead, and a save that sends the mask - or nothing - KEEPS
        the stored value; only a genuinely re-entered key replaces it. It is
        stored as the top-level `auth_secret` of the connection (so the secret
        heuristic masks it without needing a template) and reaches the box in the
        registry push. It is deliberately NOT part of the generated flow
        document, which the flow API hands to every portal user of the tenant.


        Creating with an auth mode but no secret is refused BY NAME: the box
        would not even ask, and the battery would silently read nothing.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [none, header, bearer, basic]
          default: none
        header:
          type: string
          maxLength: 64
          example: ApiKey
          description: The header name - only with `header`, and there mandatory. An RFC-7230 token.
        username:
          type: string
          maxLength: 64
          description: Only with `basic`, and there mandatory. Not a secret - it travels in the flow too.
        secret:
          type: string
          maxLength: 512
          description: Absent, empty or the mask means "unchanged". Never returned.
    UserDefinedBatteryBinding:
      type: object
      description: >
        The SPEISER-BINDUNG (P6, captain decision E6 (a) of 09.09.2026): what
        this battery IS in the plant. Absent = `unbound`, and that default is
        the point - a binding NEVER arises by itself, because the channel name
        `soc_pct` does not say WHOSE state of charge it is.


        `feeds_inverter` makes it the SoC / limit / permission source of the
        hybrid inverter's storage node while the battery POWER stays with the
        inverter, where it is measured; `standalone` makes it the storage node
        itself, power included. Only channels the battery actually delivers are
        fed (a derived soc_pct from P5b counts); a binding that could feed
        nothing is refused rather than promising an effect that never arrives.


        Stored in `connection_json.binding` and materialised as
        `entity_role_assignment` rows (role `storage`, primary), so the read
        model and the registry push carry it without a second mechanism - see
        `docs/contracts/v2/topology-read-model.md`.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [unbound, feeds_inverter, standalone]
          default: unbound
        inverterEntityId:
          type: string
          format: uuid
          description: >
            The hybrid inverter whose storage node this battery feeds. MANDATORY
            for `feeds_inverter` ("hangs on some inverter" is not an explicit
            binding), ignored otherwise. Must be an entity of this site in the
            `storage` category and not the battery itself - 404 when it does not
            belong to the site, 422 when it is not a storage inverter.
    UserDefinedBatteryBroker:
      type: object
      description: >
        The LOCAL MQTT broker. Same LAN-only rule as the Modbus Baukasten - only
        a provably private target is accepted. Credentials are deliberately NOT
        part of this contract: a password inside a retained, rolled-out flow
        document would be a cleartext secret; the secret path ships with the
        HTTP read type.
      required: [host]
      properties:
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535, default: 1883 }
    UserDefinedBatteryMapping:
      type: object
      description: >
        ONE source field onto ONE standard battery channel. A mapping may span
        MANY topics via a filter and fold them with an aggregate - that is what
        turns 11x16 DIYBMS cell topics (`emon/diybms/+/+`, `.voltage`) into
        `cell_min_mv`/`cell_max_mv`. Scale/offset are applied PER SAMPLE, then
        the aggregate runs, so "min over all cells in mV" means exactly that.
      required: [channel, topic]
      properties:
        channel:
          type: string
          maxLength: 64
          description: >
            A standard battery channel - `soc_pct`, `voltage_v`, `current_a`,
            `power_kw`, `cell_min_mv`, `cell_max_mv`, `temp_max_c`,
            `charge_allowed`, `discharge_allowed`, `charge_limit_a`,
            `discharge_limit_a`. Anything else is REFUSED, never guessed. Each
            channel has exactly one source. `soc_source_code` is deliberately
            NOT mappable: it is DERIVED in level 2 and no BMS publishes it -
            mapping it would pass a computation off as a measurement.
        topic:
          type: string
          maxLength: 200
          description: "MQTT topic filter; `+` is exactly one level, `#` only the last."
        path:
          type: string
          maxLength: 200
          description: >
            Dot-separated value path inside the JSON payload (`voltage`,
            `bms.soc`). Empty means the payload ITSELF is the value.
        aggregate:
          type: string
          enum: [last, min, max, sum, avg, count]
          default: last
          description: >
            Folded over every FRESH sample of every matching topic. A `bool`
            mapping accepts only `last`, `min` (the conservative AND - every
            source allows it) and `max` (OR): the SUM of permissions is not a
            permission, and an average of 0.5 would be a number no device ever
            reported.
        valueType:
          type: string
          enum: [number, bool]
          default: number
          description: >
            `bool` travels as 0/1 (telemetry channels are numbers) and knows no
            scaling - 0/1 IS the statement.
        scale: { type: number, default: 1, description: "Must not be 0." }
        offset: { type: number, default: 0 }
        sentinel:
          type: number
          description: >
            A RAW value that means "not measured" (a sensor reporting -40). Such
            a sample is absent, never a reading.
        staleS:
          type: integer
          minimum: 5
          maximum: 86400
          default: 300
          description: >
            How long ONE sample counts. A channel with no fresh sample is ABSENT
            from the telemetry - never 0.
        trueValues:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 32 }
          description: "Extra words meaning true; a word outside the vocabulary is DISCARDED."
        falseValues:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 32 }
    UserDefinedBatterySocDerivation:
      type: object
      description: >
        How the state of charge comes about (level 2, `vp-deye-diybms-luecke-l5`
        §3.2b, package P5b). All three methods exist. `direct` takes over a
        measured `soc_pct`; `ocv_curve` interpolates two OCV->SoC curves and
        takes the CONSERVATIVE minimum of the highest and the lowest cell;
        `coulomb` counts SoC(t) = SoC(t-1) + P*dt/E*100 from an anchor.

        THE ONE RULE UNDER ALL OF THEM: no state of charge without an INPUT.
        `direct` needs a mapped `soc_pct`; `ocv_curve` needs a cell voltage (or
        pack voltage plus cells in series) AND a charge curve; `coulomb` needs
        power (or current plus voltage), a usable capacity and an anchor - a
        count that starts from a guessed value is a claim with decimal places.
        Omitted on create: `direct` when `soc_pct` is mapped, otherwise no
        derivation at all, which is a legitimate state (the optimizer then
        plans no battery, P7).

        The derived value is published as ORDINARY telemetry - `soc_pct`
        together with `soc_source_code` (1 = measured, 2 = computed from the
        curve, 3 = counted from charge) - so cloud, optimizer and portal read it
        like any other state of charge AND the history keeps the source of the
        time. There is deliberately no code 0: an unknown state of charge is an
        ABSENT channel, never a reported zero.

        With `direct` the SAME channel carries the value twice in one second -
        once as the raw level-1 reading and once from the derivation that TAKES
        IT OVER. The second one therefore travels VERBATIM, neither rounded nor
        clamped: two different numbers for one state of charge in one second
        would be a truth that hangs on delivery order. Only what the derivation
        computed ITSELF is rounded and clamped.
      properties:
        method: { type: string, enum: [direct, ocv_curve, coulomb] }
        preferDirect:
          type: boolean
          default: true
          description: >
            The selection logic of §3.2b: a FRESH measured state of charge beats
            the computation, whatever method is configured. Only a comparison
            run turns this off.
        template:
          type: string
          maxLength: 64
          description: >
            A shipped curve TEMPLATE that fills `curveCharge`/`curveDischarge`
            (and cells in series / reference temperature) when they are absent -
            own points always win. Today: `diybms-176s-nmc`, the measured tables
            of a 176s NMC pack. An unknown name is refused, never ignored.
            ⚠ A curve belongs to a CHEMISTRY: the same voltage means a
            completely different state of charge on a LiFePO4 cell.
        holdS:
          type: integer
          minimum: 60
          maximum: 86400
          default: 900
          description: >
            How long a FROZEN value is still held. A frozen value is never
            republished with a fresh timestamp - it simply ages; after this
            window it is absent, and a charge count needs a new anchor (what a
            battery did while unobserved is unknown).
        inputs: { $ref: "#/components/schemas/UserDefinedBatterySocInputs" }
        params: { $ref: "#/components/schemas/UserDefinedBatterySocParams" }
    UserDefinedBatterySocInputs:
      type: object
      description: >
        Role -> channel. Every field is optional; an absent role uses the
        like-named standard channel. A channel outside the type catalog is
        REFUSED, never guessed.
      properties:
        soc: { type: string, maxLength: 64, default: soc_pct }
        cellMin: { type: string, maxLength: 64, default: cell_min_mv }
        cellMax: { type: string, maxLength: 64, default: cell_max_mv }
        voltage: { type: string, maxLength: 64, default: voltage_v }
        current: { type: string, maxLength: 64, default: current_a }
        power: { type: string, maxLength: 64, default: power_kw }
    UserDefinedBatterySocParams:
      type: object
      description: >
        The computing values. A curve is a list of [cell voltage in V, state of
        charge in %] pairs; outside its ends the result is CLAMPED, never
        extrapolated - an extrapolation beyond a measured curve would be an
        invented chemistry.
      properties:
        curveCharge:
          type: array
          minItems: 2
          maxItems: 64
          description: >
            Applied to the HIGHEST cell. A curve must RISE with voltage - one
            that falls describes no lithium cell and is refused.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
        curveDischarge:
          type: array
          minItems: 2
          maxItems: 64
          description: >
            Applied to the LOWEST cell. Absent, the charge curve serves both
            ends - an invented second curve would be worse than one honestly
            named single curve.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
        cellsInSeries:
          type: integer
          minimum: 1
          maximum: 1024
          description: >
            Only for the SIMPLIFIED variant (pack voltage / n). It cannot see
            the cell spread and is therefore never the first choice.
        conservativeMin:
          type: boolean
          default: true
          description: >
            The HA method: `min(f(vmax, charge), f(vmin, discharge))` - the pack
            can only give what its weakest cell holds. `false` is the explicitly
            chosen optimistic reading (the maximum); an AVERAGE is not offered
            because it would be an invented cell.
        roundPct: { type: number, default: 0.1, maximum: 5 }
        capacityKwh:
          type: number
          maximum: 10000
          description: "Usable capacity - required for `coulomb`."
        efficiencyPct:
          type: number
          maximum: 100
          description: >
            Damps the CHARGE side only. Absent means the count runs lossless,
            and the drift is the known price of the method.
        nominalVoltageV:
          type: number
          maximum: 1500
          description: "Used only when current is mapped but no voltage is."
        refTempC: { type: number, minimum: -40, maximum: 100 }
        anchor:
          type: object
          description: >
            The starting point of a charge count. A mapped measured `soc_pct` is
            the best anchor there is and counts as one.
          properties:
            socPct: { type: number, minimum: 0, maximum: 100 }
            at: { type: string, maxLength: 40 }
        recalibrate:
          type: object
          description: >
            Straightens the count at a voltage ENDPOINT - a measurement beats an
            integration. Each endpoint needs BOTH its voltage and its state of
            charge; half an endpoint would have left the box guessing.
          properties:
            fullCellMv: { type: number }
            fullSocPct: { type: number, minimum: 0, maximum: 100 }
            emptyCellMv: { type: number }
            emptySocPct: { type: number, minimum: 0, maximum: 100 }
    SwitchDefinition:
      type: object
      description: >
        ONE write register per device, with a FIXED kind. `on_off` may only ever
        write the two constants fixed here; `setpoint` only values inside the
        min/max clamp, plus a `safeValue` for silence and revocation. There is
        no value outside the released one, and no address at runtime.
      required: [kind, registerKind, address]
      properties:
        kind: { type: string, enum: [on_off, setpoint] }
        registerKind: { type: string, enum: [coil, holding] }
        address: { type: integer, minimum: 0, maximum: 65535, description: "0-based." }
        writeFc:
          type: integer
          enum: [5, 6, 16]
          description: >
            Derived when absent - 5 for a coil, otherwise 16. FC16 is the
            register default, NOT FC6: several real devices accept a
            single-register write and never adopt it (the Fronius/Deye lesson).
        onValue: { type: integer, minimum: 0, maximum: 65535 }
        offValue: { type: integer, minimum: 0, maximum: 65535 }
        minValue: { type: number }
        maxValue: { type: number }
        safeValue:
          type: number
          description: Written on withdrawal, staleness or revocation.
        scale: { type: number }
        offset: { type: number }
        unit: { type: string, maxLength: 16 }
        readbackAddress:
          type: integer
          minimum: 0
          maximum: 65535
          description: Optional - when present the write is read back and compared.
        watchdogAddress:
          type: integer
          minimum: 0
          maximum: 65535
          description: >
            Optional. A generic Modbus device has NO built-in deadman; if yours
            offers a watchdog register, the executor serves it on every tick.
            Empty by default - never coerced.
        watchdogValue: { type: integer, minimum: 0, maximum: 65535 }
    SwitchConsumer:
      type: object
      description: >
        The consumer facts the clamp and the cycle guard are built from - they
        bind BEFORE the executor. Only the rated power is required: a missing
        cycle axis is inactive, never an invented protection.
      required: [ratedPowerKw]
      properties:
        ratedPowerKw: { type: number, exclusiveMinimum: 0 }
        minOnSeconds: { type: integer, minimum: 0 }
        minOffSeconds: { type: integer, minimum: 0 }
        maxStartsPerDay: { type: integer, minimum: 1 }
        powerChannel: { type: string }
    SwitchTestRequest:
      type: object
      required: [switchDef]
      properties:
        switchDef: { $ref: "#/components/schemas/SwitchDefinition" }
        testValue:
          type: number
          description: >
            Required for `setpoint` and it MUST lie inside the clamp - it is
            never silently clamped, or the customer would confirm a different
            test than the one they ran. Ignored for `on_off`.
    SwitchTestResult:
      type: object
      required: [passed, ttlSeconds]
      properties:
        passed: { type: boolean }
        ttlSeconds:
          type: integer
          description: After this the device falls back BY ITSELF - the box armed it first.
        errorCode:
          type: string
          description: >
            A named class, never invented - `timeout` is an honest outcome, not
            a failure.
        message: { type: string }
        switched:
          type: object
          description: >
            Present only on a real write. A failed operation carries NO value.
          properties:
            written: { type: integer }
            offAfterS: { type: integer }
            readback: { type: integer }
            readbackMatches: { type: boolean }
    SwitchReleaseRequest:
      type: object
      required: [switchDef, consumer, physicallyConfirmed]
      properties:
        switchDef: { $ref: "#/components/schemas/SwitchDefinition" }
        consumer: { $ref: "#/components/schemas/SwitchConsumer" }
        physicallyConfirmed:
          type: boolean
          description: The customer saw the right device react. Anything but true refuses.
    SelfBuildReadRequest:
      type: object
      required: [connection, channel]
      properties:
        deviceId:
          type: string
          format: uuid
          description: >
            Optional - the box to ask. Absent means "the plant's single device";
            a plant with several must name one.
        connection: { $ref: "#/components/schemas/SelfBuildConnection" }
        channel: { $ref: "#/components/schemas/SelfBuildChannel" }
    SelfBuildReadResult:
      type: object
      description: >
        RAW and SCALED side by side, always - that pair is what makes a scaling
        mistake visible at a glance. Every number is OPTIONAL: a failed read
        carries NO value, never a 0 that reads like a measurement.
      required: [ok, receipt]
      properties:
        ok: { type: boolean }
        raw: { type: number, description: "The value as the register delivered it." }
        registers:
          type: array
          items: { type: integer }
          description: "The raw 16-bit words - a wrong word order becomes visible, not merely wrong."
        value: { type: number, description: "raw x scale + offset." }
        unit: { type: string }
        hint:
          type: string
          description: >
            A plausibility HINT, never a block - a register we consider
            implausible can be correct on the real device.
        errorCode:
          type: string
          enum: [unreachable, no_answer, invalid_response, implausible, invalid_request, not_supported, rate_limited, timeout]
        message: { type: string }
        receipt:
          type: boolean
          description: Whether this run unlocks saving (the connection-test duty).
    SiteComponentTemplate:
      type: object
      description: >
        A PRIVATE device template of one plant ("Duplizieren"). Deliberately not
        ComponentTemplate - that one describes a PRODUCT (global, builtin or
        certified); this one is the copy of ONE customer definition, and its
        channels are mandatory because the channel list IS the template.
      properties:
        templateRef: { type: string }
        version: { type: integer }
        label: { type: string }
        communication: { type: string }
        connection: { type: object, additionalProperties: true }
        channels: { type: array, items: { $ref: "#/components/schemas/SelfBuildChannel" } }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    SiteComponentTemplateRequest:
      type: object
      description: >
        Name and note of a PRIVATE template (Einheitsmodell Stufe 6). Both
        optional on duplicate (the derived "... (Vorlage)" fills in); the rename
        route requires a non-blank name.
      properties:
        label: { type: string, maxLength: 200 }
        note: { type: string, maxLength: 200 }
    SaveComponentTemplateRequest:
      type: object
      description: >
        A checked template VERSION (Einheitsmodell Stufe 6). There is
        deliberately NO templateRef field - the key is derived from brand +
        model and is opaque by contract.
      required: [brand, brandLabel, model, modelLabel, communication, transportSchema, certificationStatus]
      properties:
        brand: { type: string, maxLength: 64, pattern: "^[a-z][a-z0-9_]{0,63}$" }
        brandLabel: { type: string, maxLength: 120 }
        model: { type: string, maxLength: 64, pattern: "^[a-z][a-z0-9_]{0,63}$" }
        modelLabel: { type: string, maxLength: 120 }
        family: { type: string, maxLength: 64, description: "Decode-profile reference; absent for a template without one." }
        familyLabel: { type: string, maxLength: 120 }
        communication:
          type: string
          enum: [modbus_tcp, solarman_v5, fronius_solar_api, fronius_sunspec, goe_http_api, shelly_http]
        communicationLabel: { type: string, maxLength: 160 }
        transportSchema:
          type: array
          minItems: 1
          description: "The connection form fields {key,label,type,required,default,help,options}."
          items: { type: object, additionalProperties: true }
        channels:
          type: array
          description: >
            ABSENT = "this template does not explain it here". An EMPTY array is
            REFUSED - it would claim "delivers no measurements".
          items: { type: object, additionalProperties: true }
        writes:
          type: array
          description: >
            ABSENT = not explained here; an EMPTY array is REFUSED. Every entry
            needs its `safe_value` (what is written on silence or a revocation)
            and, per kind, the constants (`on_off`) or the clamp (`setpoint`).
            A template with writes must be `certified`.
          items: { type: object, additionalProperties: true }
        ratedKw: { type: number, minimum: 0, exclusiveMinimum: true, description: "Absent = unknown. Never 0." }
        controlTier: { type: integer, minimum: 0, maximum: 3 }
        certificationStatus:
          type: string
          enum: [certified, in_certification, not_certified]
          description: >
            `builtin` is deliberately NOT settable - that word says "ships with
            the edge software" and a hand-entered template never will.
        certificationNote: { type: string, maxLength: 500 }
        note: { type: string, maxLength: 500 }
    AdminComponentTemplate:
      allOf:
        - $ref: "#/components/schemas/ComponentTemplate"
        - type: object
          description: >
            The operator view of ONE template version. `withdrawnAt == null`
            means "selectable"; a withdrawn version is NOT deleted - the
            components using it run on unchanged.
          properties:
            createdAt: { type: string, format: date-time }
            createdBy: { type: string }
            withdrawnAt: { type: string, format: date-time, nullable: true }
            withdrawnBy: { type: string, nullable: true }
            usedByComponents:
              type: integer
              description: How many components of the whole fleet stand on this KEY.
    AdminComponentFleet:
      type: object
      required: [sites]
      properties:
        sites:
          type: array
          items:
            type: object
            required: [siteId, siteName, tenantId, tenantName, componentAuthority, componentCount, syncStatus]
            properties:
              siteId: { type: string, format: uuid }
              siteName: { type: string }
              tenantId: { type: string, format: uuid }
              tenantName: { type: string }
              componentAuthority: { type: string, enum: [box, portal] }
              componentsAdoptedAt:
                type: string
                format: date-time
                description: The RECEIPT of an automatic adoption - absent is not the same as box-managed.
              componentsAdoptedBy: { type: string }
              componentCount: { type: integer }
              sources:
                type: object
                description: "Origin of the connections. `unknown` = the row predates templates - no invented origin."
                properties:
                  builtin: { type: integer }
                  certified: { type: integer }
                  custom: { type: integer }
                  composed: { type: integer }
                  unknown: { type: integer }
              privateTemplates: { type: integer }
              syncStatus: { type: string, enum: [in_sync, pending, held, box_managed, unreported] }
              refusedRevision: { type: string }
              refusedReason: { type: string }
              appliedAt: { type: string, format: date-time }
              write:
                type: object
                description: The three release levels of the concept in ONE place.
                properties:
                  controlPoints: { type: integer }
                  platformActivated: { type: integer }
                  templateWrites: { type: integer }
                  certSource:
                    type: string
                    enum: [env, device, platform]
                    description: What the DEVICE reports. Absent = unknown, NEVER "not certified".
                  platformCertVerdict: { type: string }
                  platformCertModel: { type: string }
    SiteComponents:
      type: object
      description: >
        The plant's components plus WHO owns their configuration
        (Einheitsmodell Stufe 1).
      required: [componentAuthority, components]
      properties:
        componentAuthority:
          type: string
          enum: [box, portal]
          description: >
            `portal` = the stored Soll IS the plant's read path and the assistant
            is offered; `box` = the device's own `:8484` page still owns it
            (every plant that existed before this stage). The server always names
            an owner - it is never absent.
        sollRevision:
          type: string
          nullable: true
          description: The last composed registry-push revision. `null` = never pushed.
        appliedRevision:
          type: string
          nullable: true
          description: >
            The revision the BOX reported it really applied. `null` = the box has
            not said anything yet - UNKNOWN, never "did not arrive".
        appliedAt: { type: string, format: date-time, nullable: true }
        refusedRevision:
          type: string
          nullable: true
          description: >
            The box's LAST refusal, NEXT TO (never instead of) `appliedRevision` -
            what runs is still the last configuration that really worked.
        refusedReason: { type: string, nullable: true, description: German plain-text reason. }
        adoptedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Wann diese Anlage AUTOMATISCH vom Gerät übernommen wurde
            (Einheitsmodell Stufe 2). null = nie übernommen - ausdrücklich NICHT
            dasselbe wie box-verwaltet: eine neu angelegte Anlage ist
            portal-verwaltet, ohne je übernommen worden zu sein. Der Zustand
            steht allein in componentAuthority; dies ist der Beleg.
        components:
          type: array
          items:
            type: object
            required: [id, role, definitionVersion, syncStatus]
            properties:
              id: { type: string, format: uuid, description: The measurement point / v2 entity id. }
              role: { type: string, enum: [inverter, pv-generation, grid-meter, consumer] }
              entityType: { type: string, nullable: true }
              label: { type: string, nullable: true }
              brand: { type: string, nullable: true }
              model: { type: string, nullable: true }
              family: { type: string, nullable: true }
              communication: { type: string, nullable: true }
              connection:
                type: object
                nullable: true
                additionalProperties: true
                description: The template's transport_schema values, passed through verbatim.
              sourceKind: { type: string, nullable: true, enum: [builtin, certified, custom, composed] }
              templateRef: { type: string, nullable: true }
              templateVersion: { type: integer, nullable: true }
              definitionVersion: { type: integer, description: Bumped on every saved change; the rollback target. }
              capacityKwp: { type: number, nullable: true }
              edgeSourceId: { type: string, nullable: true }
              syncStatus:
                type: string
                enum: [in_sync, pending, held, box_managed, unreported, no_gateway_device]
                description: >
                  Derived from Soll vs. the box's reported Ist, never guessed.
                  `unreported` means the box has not reported - NEVER "the change
                  was lost". `held` is the box's deliberate hold (it saw the
                  revision and applied nothing). `box_managed` is its reported
                  RETURN of authority: it maintains its devices itself again, so
                  there is no Soll/Ist relation left at all - without it the row
                  claimed "change on its way to the box" forever after a
                  revert-to-device, because every push bumps the Soll revision
                  while the stale Ist row stood still. `no_gateway_device` is the
                  one case where the reason IS known: the site has several
                  claimed devices and none of them is set as the battery's
                  controlling device, so there is no receiver for the push at all
                  (it replaces `unreported` and `pending`, never `in_sync`). The
                  cross-tenant fleet view knows every value except
                  `no_gateway_device` - it does not know about receivers and must
                  not invent a reason.
    SaveComponentRequest:
      type: object
      required: [templateRef, role]
      properties:
        templateRef:
          type: string
          maxLength: 200
          description: >
            The OPAQUE template key. Brand, model, family and the communication
            method are taken FROM the template, never from the body - a client
            cannot save an inconsistent connection.
        templateVersion:
          type: integer
          minimum: 1
          nullable: true
          description: Exact template definition to preserve or apply; omitted only by legacy clients.
        role: { type: string, enum: [inverter, pv-generation, grid-meter, consumer] }
        label: { type: string, nullable: true, maxLength: 200 }
        connection:
          type: object
          additionalProperties: true
          description: The template's transport_schema fields (ip/port/serial/unit_id/...).
        capacityKwp: { type: number, nullable: true, description: Producer nameplate (kWp); ignored for other roles. }
        intervalS: { type: integer, nullable: true, description: Optional read interval; absent = the box default. }
        note: { type: string, nullable: true, maxLength: 200 }
        expectedRevision:
          type: integer
          minimum: 1
          nullable: true
          description: Required for PUT; the definitionVersion read by the editor.
        effectiveAt:
          type: string
          format: date-time
          nullable: true
          description: Effective marker; PUT currently activates atomically now.
    ComponentDefinition:
      type: object
      description: >
        ONE stored version of a component's connection (append-only). `null`
        everywhere means "this version says nothing about it", never a
        substitute value.
      required: [entityId, version, role, createdAt]
      properties:
        entityId: { type: string, format: uuid }
        version: { type: integer }
        role: { type: string }
        label: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        family: { type: string, nullable: true }
        communication: { type: string, nullable: true }
        connection: { type: object, nullable: true, additionalProperties: true }
        sourceKind: { type: string, nullable: true }
        templateRef: { type: string, nullable: true }
        templateVersion: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, nullable: true, description: The JWT subject that saved it. }
        note: { type: string, nullable: true }
    ComponentChangeEvent:
      type: object
      required: [revision, eventType, effectiveAt, createdAt]
      properties:
        revision: { type: integer, minimum: 1 }
        eventType: { type: string, enum: [edited, family_changed, rolled_back] }
        effectiveAt: { type: string, format: date-time }
        fromValue: { type: string, nullable: true }
        toValue: { type: string, nullable: true }
        createdBy: { type: string, nullable: true }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ComponentTemplate:
      type: object
      description: >
        ONE component template (Einheitsmodell Stufe 0a). Built-in templates are
        the cloud-side DATA rendering of the edge Go catalog
        (edge-app/core/internal/inverter DefaultCatalog()); the Go catalog stays
        the truth about what a box can actually read.
      properties:
        templateRef:
          type: string
          example: "builtin:deye:sun-30k-sg01hp3"
          description: Stable, OPAQUE key - never parse it.
        kind: { type: string, enum: [builtin, certified], description: Where the template comes from. }
        version:
          type: integer
          example: 1
          description: >
            Definition version. Built-in templates stay at 1 - their version IS
            the edge software release, not a separate count.
        brand: { type: string, example: deye }
        brandLabel: { type: string, example: Deye }
        model: { type: string, example: sun-30k-sg01hp3 }
        modelLabel: { type: string, example: SUN-30K-SG01HP3-EU }
        modelAliases:
          type: array
          nullable: true
          items: { type: string }
          example: ["SUN-30K-SG01HP3-EU-BM3", "SUN-30K-SG01HP3-EU-BM4"]
          description: >
            Further NAMEPLATE names of the SAME model - the variant labels a
            customer reads off the device (Deye ships this HV hybrid line as
            "...-EU-BM3" / "...-EU-BM4" while the catalog calls it
            "SUN-30K-SG01HP3-EU").

            An alias is ONLY a name: it carries no own key, no own template and
            no behaviour. It is searched and may be displayed; what gets picked
            is always the model itself - a second catalog entry would be an
            UNCERTIFIED model, because the control certification is keyed on
            brand+model.

            null/absent = this model has only its one name - never "it has no
            variants".
        deviceType:
          type: string
          nullable: true
          enum: [inverter, wallbox, switch, meter, charge_point, custom]
          example: inverter
          description: >
            The device-type dimension of the catalog - what KIND of device the
            template describes. It replaced the technical parentheses in brand
            names ("go-e (Wallbox)"). null = the template does not say; never a
            guessed type.
        supersededBy:
          type: string
          nullable: true
          example: "builtin:fronius:fronius-eco-27-3-s"
          description: >
            The templateRef that replaced THIS one. null = the template applies.
            A superseded template stays RESOLVABLE (an existing plant references
            its key, and the takeover looks it up by brand+model) but is no
            longer OFFERED - the customer list omits it, a lookup still finds it.
        family:
          type: string
          nullable: true
          example: hybrid_3p
          description: The decode-profile reference - the bridge to the code that executes it.
        familyLabel: { type: string, nullable: true }
        communication: { type: string, example: solarman_v5 }
        communicationLabel: { type: string, nullable: true }
        transportSchema:
          type: array
          description: >
            The connection form of this communication - the generic field
            vocabulary {key,label,type,required,default,help,options}.
          items: { type: object }
        channels:
          type: array
          nullable: true
          description: >
            Channel definitions (register -> plain-text measurement). NULL means
            "this template does not explain its channels HERE", never "it has
            none" - a built-in template's channels live in the edge decode
            profile, so it always carries null. `[]` would be the flat lie that a
            Deye delivers no measurements.
          items: { type: object }
        writes:
          type: array
          nullable: true
          description: >
            Write definitions (SCHEMA ONLY in this stage - nothing consumes
            them): register + constants (on_off) or the min/max clamp + safe
            value (setpoint). NULL by the same rule as `channels` - a built-in
            template's write path is the control adapter, released by the
            platform register inverter_control_certification.
          items: { type: object }
        ratedKw:
          type: number
          nullable: true
          example: 30
          description: Nameplate kW. NULL = unknown in the catalog, never 0.
        controlTier:
          type: integer
          minimum: 0
          maximum: 3
          description: >
            The brand's declared control PRIMITIVE. It AUTHORIZES NOTHING -
            kill-switch, certification register and per-plant arming decide
            whether a write ever goes out.
        certificationStatus:
          type: string
          enum: [builtin, certified, in_certification, not_certified]
          description: >
            What the platform vouches for - a DIFFERENT question from `kind`.
            `builtin` = ships with the edge software (deliberately not
            "certified", which belongs to the bench).
        certifiedAt: { type: string, format: date-time, nullable: true }
        certificationNote: { type: string, nullable: true }
        note: { type: string, nullable: true, description: Display text for the assistant. }
        updatedAt: { type: string, format: date-time, nullable: true }
    Consumer:
      type: object
      description: A controllable consumer's master data + control-activation state.
      properties:
        id: { type: string, format: uuid, description: The consumer entity id. }
        type: { type: string, example: wallbox, description: entity_type (catalog consumer type). }
        typeLabel: { type: string, example: Wallbox }
        name: { type: string, example: Wallbox Garage }
        controlKind: { type: string, enum: [on_off, stepped, continuous] }
        ratedPowerKw: { type: number, example: 11.0 }
        minPowerKw: { type: number, nullable: true }
        levelsKw: { type: array, nullable: true, items: { type: number } }
        resolutionKw: { type: number, nullable: true }
        powerRangesKw:
          type: array
          nullable: true
          description: D4 non-convex [min,max] ranges (continuous).
          items: { type: array, items: { type: number } }
        storageRelation: { type: string, enum: [consumer_first, storage_first] }
        defaultGridEnergyPolicy: { type: string, enum: [allow, avoid, forbid] }
        allowStorageDischarge: { type: boolean }
        failsafe: { type: string, enum: [off, release] }
        enabled: { type: boolean, description: The pausierbarer Gesamtschalter. }
        version: { type: integer, description: Optimistic-concurrency version of the master data. }
        connection:
          type: string
          enum: [connected, disconnected]
          description: disconnected = "Noch nicht verbunden".
        edgeSourceId: { type: string, nullable: true }
        controlActivation:
          type: string
          enum: [not_activated, active, paused]
          description: >
            Derived from the active policy (Inkrement 4): "active" = an active
            policy exists and the consumer is enabled; "paused" = active policy
            with the pause failsafe in force; else "not_activated" ("Steuerung
            noch nicht aktiviert").
        hasDraftPolicy: { type: boolean }
        draftPolicyVersion: { type: integer, nullable: true }
        minOnSeconds:
          type: integer
          nullable: true
          description: >
            Cycle-guard minimum on-time (Inkrement 3, §13.1) - enforced by the
            EDGE's stateful cycle guard; travels to the device in the entity
            registry push (guards.limits.min_on_seconds). Null = axis inactive.
        minOffSeconds: { type: integer, nullable: true, description: Cycle-guard minimum off-time. }
        maxStartsPerDay: { type: integer, nullable: true, description: Cycle-guard start budget per site-local day. }
        confirmationChannel:
          type: string
          nullable: true
          description: >
            The D3 confirmation channel derived at creation from the bound
            edge source (Bestätigungshierarchie §9.4): "power_kw" = proven
            power measurement (Stufe 2 - a metering Shelly 1PM / go-e),
            "relay_state" = relay readback only (Stufe 3, energy
            "angenommen"), null = unbound draft or created before this field
            existed.
    ProbeRequest:
      type: object
      required: [ops]
      properties:
        deviceId:
          type: string
          format: uuid
          description: >
            Which of the plant's devices to ask. Optional only while the plant
            has exactly one - several devices without a choice is a 409, because
            guessing which box sits on the right LAN segment is not something
            this api will invent.
        ops:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: "#/components/schemas/ProbeOp" }
      example:
        ops:
          - id: soc
            host: 192.168.0.28
            registerKind: holding
            address: 588
            dataType: u16
    ProbeOp:
      type: object
      required: [id, host, registerKind, address, dataType]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,31}$"
          description: >
            Maps the answer back onto this question, so it must be unique within
            the request (the box refuses a duplicate BY NAME).
        host:
          type: string
          maxLength: 253
          description: >
            The device's address in the customer's own network. The BOX enforces
            that it is private (RFC1918/loopback/link-local/ULA/.local) and
            refuses a public address with a plain-German reason - it does not
            take the cloud's word for where it may knock.
        port: { type: integer, minimum: 1, maximum: 65535, default: 502 }
        unitId: { type: integer, minimum: 0, maximum: 255, default: 1 }
        registerKind:
          type: string
          enum: [holding, input]
          description: holding = Modbus FC3, input = FC4.
        address:
          type: integer
          minimum: 0
          maximum: 65535
          description: >
            0-BASED. The 4xxxx notation of many manuals means 4-0001 + address;
            that conversion belongs to the surface, not to this contract.
        dataType:
          type: string
          enum: [u16, s16, u32, s32, float32]
          description: >
            Also decides HOW MANY register words are read (1 or 2) - there is
            deliberately no free quantity field, because a wrong word count
            returns half a number that looks perfectly plausible.
        wordOrder: { type: string, enum: [big, little], default: big }
        scale:
          type: number
          description: >
            DISPLAY only - value = raw * scale + offset. It never changes what is
            read; the answer carries raw and value side by side.
        offset: { type: number }
    ProbeResult:
      type: object
      required: [requestId, results]
      properties:
        requestId: { type: string }
        errorCode:
          type: string
          enum: [invalid_request, unreachable, no_answer, invalid_response, implausible, timeout, not_supported, rate_limited]
          description: >
            Set only when the WHOLE probe was refused (the plant did not answer
            in time, or its own rate limit bit); `results` is then empty and the
            reason is stated once.
        message: { type: string, description: The plain-German sentence. }
        results:
          type: array
          items: { $ref: "#/components/schemas/ProbeOpResult" }
    ProbeOpResult:
      type: object
      required: [id, ok]
      properties:
        id: { type: string }
        ok: { type: boolean }
        raw:
          type: number
          description: >
            The RAW register value before scaling - the number that makes a
            scaling mistake visible. Absent when the step failed.
        registers:
          type: array
          maxItems: 2
          items: { type: integer }
          description: The 16-bit words, so a wrong word order is visible and not merely wrong.
        value:
          type: number
          description: raw * scale + offset. Absent when the step failed - a failure never carries a value.
        errorCode:
          type: string
          enum: [invalid_request, unreachable, no_answer, invalid_response, implausible, timeout, not_supported, rate_limited]
        message: { type: string }
        samples:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/ProbeSample" }
          description: >
            Only for the SELF-CONNECTED battery preview (P5d): one row per field
            mapping - what really arrived during the listening window. ABSENT
            when the box cannot listen yet, which means "this box cannot do it",
            never "nothing arrived".
    ProbeSample:
      type: object
      required: [channel, count]
      description: >
        What ONE field mapping received during the listening window. Its own
        block, never `reading`: `reading` is the closed four-channel snapshot of
        a CATALOG device, while these rows are named by the customer.
      properties:
        channel:
          type: string
          description: The TARGET channel of this mapping (soc_pct, cell_min_mv, ...).
        topic:
          type: string
          description: The concrete topic the value came from. Absent when nothing arrived.
        raw:
          type: number
          description: The RAW value before scale/offset - the number a scaling mistake shows up in. Absent when count is 0.
        value:
          type: number
          description: raw * scale + offset, after the aggregate over all matched topics. Absent when count is 0.
        count:
          type: integer
          description: >
            How many messages hit this mapping in the window. 0 means "nothing
            received" and is an honest statement, not an error - and it travels
            WITHOUT raw/value rather than with a fabricated 0.
        at: { type: string, format: date-time, description: When the last of them arrived. Absent when count is 0. }
    CommandHistory:
      type: object
      description: >
        Der Kommando-Verlauf einer Anlage bzw. Komponente - EINE Antwort fuer
        Kopf, "Gerade jetzt", "Grenzen & Waechter", Tages-Film und Fussnote.
      properties:
        recordingSince:
          type: string
          format: date-time
          nullable: true
          description: >
            Ab wann fuer diese Anlage aufgezeichnet wird. null = noch gar nicht;
            davor wird NICHTS behauptet, auch nichts Entlastendes.
        accuracySeconds:
          type: integer
          description: Der Herzschlag-Takt; ein Wechsel-und-zurueck dazwischen ist unsichtbar.
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        entityId: { type: string, format: uuid, nullable: true }
        entityLabel: { type: string, nullable: true }
        deviceRef:
          type: string
          nullable: true
          description: >
            Echo des `device`-Filters; null = die ganze Anlage bzw. eine einzelne
            Komponente. Die Antwort traegt bewusst KEINEN Geraete-NAMEN - den
            bildet das Portal aus seiner einen Namensableitung.
        deviceIsBox:
          type: boolean
          nullable: true
          description: >
            true = die VoltPilot-Box (jede Zeile ihres Geraets), false = ein
            Geraet dahinter (nur die Zeilen seiner Komponenten), null = nicht
            gefiltert. Ein Server-Fakt, damit die Flaeche ihn nicht raten muss.
        writes:
          type: boolean
          description: >
            false = an diese Komponente bzw. dieses Geraet geht kein Befehl, es
            wird nur gelesen.
        truncated:
          type: boolean
          description: Der Deckel hat gegriffen - aeltere Zeilen fehlen.
        total:
          type: integer
          description: >
            Die Zeilen dieses Zeitraums OHNE Strukturfilter. Zusammen mit
            `matched` ist das der Treffer-Zaehler ("14 von 212 Zeilen"): ohne
            beide Zahlen waere ein scharfer Filter von einem leeren Zeitraum
            nicht zu unterscheiden.
        matched:
          type: integer
          description: >
            Die Zeilen dieses Zeitraums MIT den Strukturfiltern. Der FREITEXT
            ist darin nicht enthalten - er laeuft im Portal ueber die gezeigten
            Saetze und schrumpft nur, was hier schon steht.
        nextBefore:
          type: string
          format: date-time
          nullable: true
          description: >
            Der Seiten-Cursor nach hinten (der Beginn der aeltesten gelieferten
            Zeile), oder null, wenn das Fenster vollstaendig gezeigt ist - eine
            Flaeche darf "mehr laden" nie anbieten, wo es nichts mehr gibt.
        entries:
          type: array
          items: { $ref: "#/components/schemas/CommandEntry" }
        control:
          allOf: [{ $ref: "#/components/schemas/ControlStatus" }]
          nullable: true
        curtailment:
          allOf: [{ $ref: "#/components/schemas/CurtailmentStatus" }]
          nullable: true
    CommandEntry:
      type: object
      description: >
        Eine HALTEPERIODE (kind=periode) oder ein Punkt-Ereignis
        (kind=ereignis, dann traegt eventKind seine Art).
      properties:
        id: { type: integer, format: int64 }
        stream:
          type: string
          enum: [batterie, abregelung, verbraucher, waechter, register]
          description: >
            `register` ist der VIERTE Strom: die Einmal-Schreibvorgaenge auf
            Geraete-Register, zur Lesezeit aus dem append-only Journal
            register_write_event eingemischt (KEINE Doppel-Speicherung). Ein
            aelteres Portal kennt das Wort nicht und laesst die Zeile wortlos
            aus - die Unbekannt-bleibt-ohne-Behauptung-Regel.
        kind: { type: string, enum: [periode, ereignis] }
        eventKind:
          type: string
          nullable: true
          enum: [notaus_ein, notaus_aus, freigabe_erteilt, freigabe_widerrufen, luecke, verlauf_gedeckelt, register_geschrieben]
        startedAt: { type: string, format: date-time }
        endedAt:
          type: string
          format: date-time
          nullable: true
          description: null = die Periode laeuft noch.
        mode: { type: string, nullable: true }
        path: { type: string, nullable: true }
        whyKind: { type: string, nullable: true, enum: [fahrplan, sicherung] }
        whyRef: { type: string, nullable: true }
        commandedKwFirst: { type: number, nullable: true }
        commandedKwLast: { type: number, nullable: true }
        commandedKwMin: { type: number, nullable: true }
        commandedKwMax: { type: number, nullable: true }
        verdict:
          type: string
          nullable: true
          enum: [bestaetigt, abweichend, keine_antwort, prueft, unbestaetigt]
          description: >
            Das Ruecklese-Urteil. `keine_antwort` ist ausdruecklich NICHT
            `abweichend` - Schweigen ist eine Luecke, kein bewiesener Defekt.
            V1 schreibt nur bestaetigt|abweichend|unbestaetigt.
        cycles: { type: integer, nullable: true, description: In V1 IMMER null. }
        cyclesConfirmed: { type: integer, nullable: true }
        cyclesNoAnswer: { type: integer, nullable: true }
        cyclesMismatch: { type: integer, nullable: true }
        controlEnabled: { type: boolean, nullable: true }
        released: { type: boolean, nullable: true }
        foreignInfluence: { type: boolean, nullable: true }
        entityId: { type: string, format: uuid, nullable: true }
        source:
          type: string
          enum: [cloud_abgeleitet, geraet, portal]
          description: >
            Die Herkunft der Zeile. `portal` gehoert dem Strom `register`: der
            Schreibvorgang wurde ueber das Portal ausgeloest (gegenueber
            `geraet` = am Wartungszugang der Box).
        detail:
          type: object
          nullable: true
          description: Der Roh-Blick (V1 - Rollen, Zaehler, gemeldeter Zustand).
          properties:
            mismatchRoles: { type: string, nullable: true }
            certSource: { type: string, nullable: true }
            units: { type: integer, nullable: true }
            certifiedUnits: { type: integer, nullable: true }
            state: { type: string, nullable: true }
            reasonCode: { type: string, nullable: true }
        register:
          allOf: [{ $ref: "#/components/schemas/RegisterWriteEvent" }]
          nullable: true
          description: >
            NUR auf den Zeilen des Stroms `register` gesetzt: der gefaltete
            Vorgang aus dem Journal (Anforderung + Ergebnis).
    RuleEvents:
      type: object
      description: >
        Das Regel-Protokoll einer Anlage - EINE Antwort fuer die drei Flaechen,
        die es zeigen (Zaehler an der Karte, Ausschnitt im Detail-Einschub,
        kompaktes Gesamt-Protokoll).
      properties:
        recordingSince:
          type: string
          format: date-time
          nullable: true
          description: >
            Ab wann fuer diese Anlage aufgezeichnet wird. null = noch gar
            nicht. Ist er juenger als der heutige Berliner Tagesbeginn, sagt
            die Flaeche "seit HH:MM aufgezeichnet" statt einer 0.
        accuracySeconds:
          type: integer
          description: >
            Die Genauigkeit, die AN der Flaeche stehen muss: abgeleitet wird
            aus Wechseln im Herzschlag-Takt, ein Wechsel-und-zurueck dazwischen
            ist unsichtbar.
        countsToday:
          type: boolean
          description: >
            Ob der heutige Tag ueberhaupt zaehlbar ist. Er beantwortet den
            Fall, den `rules` nicht abbilden kann: eine Regel OHNE jedes
            Ereignis taucht dort gar nicht auf - ohne dieses Flag muesste die
            Flaeche den Berliner Tagesbeginn selbst nachrechnen und haette
            einen Zwilling der Server-Regel.
        rules:
          type: array
          items: { $ref: "#/components/schemas/RuleActivity" }
        events:
          type: array
          items: { $ref: "#/components/schemas/RuleEvent" }
    RuleActivity:
      type: object
      description: Die Zaehler EINER Regel.
      properties:
        ruleKind:
          type: string
          enum: [rezept, flow]
          description: >
            Der Schnappschuss der Zuordnung ueber den exklusiven Steuer-Anspruch
            (V-5), nie geraten.
        ruleRef:
          type: string
          description: Komponenten-Id (rezept) bzw. Flow-Id (flow).
        switchedToday:
          type: integer
          nullable: true
          description: >
            STARTS seit Berliner Mitternacht. NULL = nicht belastbar (der
            Speicher zeichnet erst seit heute auf) - nie eine erfundene 0.
        lastSwitchedAt:
          type: string
          format: date-time
          nullable: true
          description: Der juengste Schaltvorgang (Start ODER Stopp).
    RuleEvent:
      type: object
      description: Ein einzelner aufgezeichneter Wechsel.
      properties:
        id: { type: integer, format: int64 }
        ruleKind: { type: string, nullable: true, enum: [rezept, flow] }
        ruleRef:
          type: string
          nullable: true
          description: null = ehrlich keiner Regel zuzuordnen (nie eine geratene).
        entityId: { type: string, format: uuid, nullable: true }
        kind:
          type: string
          enum: [gestartet, gestoppt, zustand, ausgerollt, geraet_problem,
                 protokoll_gedeckelt]
        state: { type: string, nullable: true }
        previousState: { type: string, nullable: true }
        reasonCode: { type: string, nullable: true }
        actualKw:
          type: number
          nullable: true
          description: Der gemessene Wert im Moment des Wechsels; null = nicht gemessen.
        detail: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
    ConsumerRuntimeStatus:
      type: object
      description: >
        The edge-reported live state of one consumer entity (heartbeat
        consumers block, table consumer_runtime_status). confirmed is
        TRI-STATE - null means no readback evidence ("Ausführung nicht
        bestätigt" territory); actualKw null = not measured (never a
        fabricated 0).
      properties:
        entityId: { type: string, format: uuid }
        state:
          type: string
          enum: [disconnected, offline, ready, running_forced, running_optimized,
                 waiting, fulfilled, clamped, missed, unknown]
          description: §14.13 vocabulary; the edge claims only what it can know.
        reasonCode:
          type: string
          nullable: true
          description: >
            §15 vocabulary incl. the cycle-guard extension (guard_min_on,
            guard_min_off, guard_max_starts, guard_ramp, guard_rated_power,
            readback_mismatch, device_offline, plan_stale, ...). The portal
            maps it through a pure, tested table - never grep German text.
        actualKw: { type: number, nullable: true }
        confirmed: { type: boolean, nullable: true }
        runtimeSecondsToday: { type: integer, nullable: true }
        startsToday: { type: integer, nullable: true }
        reportedAt: { type: string, format: date-time }
    CreateConsumerRequest:
      type: object
      required: [type, ratedPowerKw]
      properties:
        type: { type: string, example: wallbox }
        name: { type: string }
        minOnSeconds: { type: integer, nullable: true }
        minOffSeconds: { type: integer, nullable: true }
        maxStartsPerDay: { type: integer, nullable: true }
        ratedPowerKw: { type: number, example: 11.0 }
        controlKind: { type: string, enum: [on_off, stepped, continuous] }
        levelsKw: { type: array, items: { type: number } }
        minPowerKw: { type: number }
        resolutionKw: { type: number }
        powerRangesKw: { type: array, items: { type: array, items: { type: number } } }
        storageRelation: { type: string, enum: [consumer_first, storage_first] }
        defaultGridEnergyPolicy: { type: string, enum: [allow, avoid, forbid] }
        allowStorageDischarge: { type: boolean }
        failsafe: { type: string, enum: [off, release] }
        edgeSourceId:
          type: string
          description: An edge-reported source id to bind ("verbunden"); omit for a draft.
    PatchConsumerRequest:
      type: object
      description: All fields optional; send `expectedVersion` for optimistic concurrency.
      properties:
        name: { type: string }
        ratedPowerKw: { type: number }
        controlKind: { type: string, enum: [on_off, stepped, continuous] }
        levelsKw: { type: array, items: { type: number } }
        minPowerKw: { type: number }
        resolutionKw: { type: number }
        powerRangesKw: { type: array, items: { type: array, items: { type: number } } }
        storageRelation: { type: string, enum: [consumer_first, storage_first] }
        defaultGridEnergyPolicy: { type: string, enum: [allow, avoid, forbid] }
        allowStorageDischarge: { type: boolean }
        failsafe: { type: string, enum: [off, release] }
        enabled: { type: boolean }
        expectedVersion: { type: integer }
        minOnSeconds: { type: integer, nullable: true, description: Cycle guard - 0 clears the bound. }
        minOffSeconds: { type: integer, nullable: true, description: Cycle guard - 0 clears the bound. }
        maxStartsPerDay: { type: integer, nullable: true, description: Cycle guard - 0 clears the bound. }
    ConsumerOptions:
      type: object
      description: Capability-/context-filtered inputs for the assistant question tree.
      properties:
        policyActivationEnabled:
          type: boolean
          description: >
            Whether this environment can REALLY activate a consumer rule (both
            Inkrement-4 feature flags on). false = the portal keeps the honest
            "Steuerung noch nicht aktiviert" draft wording.
        types:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              label: { type: string }
              controlKinds: { type: array, items: { type: string } }
              defaultFailsafe: { type: string }
              releaseAllowed: { type: boolean }
              intents: { type: array, items: { type: string } }
        signals:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              label: { type: string }
              signalClass: { type: string, enum: [cloud, local] }
              valueType: { type: string, enum: [number, boolean] }
        intents:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              title: { type: string }
              customerLine: { type: string }
        hasStorage: { type: boolean }
        reportedSources:
          type: array
          items:
            type: object
            properties:
              sourceId: { type: string }
              label: { type: string }
              brand: { type: string }
              role: { type: string }
              measuresPower:
                type: boolean
                description: >
                  The source PROVABLY measures power (its reported reading
                  carries load_kw). false = no proven measurement (a bare
                  relay, or not reported yet) - the wizard then names the
                  honest Stufe-3 consequence (energy "angenommen").
              health: { type: string, enum: [ok, stale, never] }
        defaultStorageRelation: { type: string }
        defaultGridEnergyPolicy: { type: string }
    ConsumerPolicyVersion:
      type: object
      properties:
        entityId: { type: string, format: uuid }
        version: { type: integer }
        lifecycle: { type: string, enum: [draft, active, retired] }
        document: { type: object, description: The consumer-policy document. }
        contentHash: { type: string, example: "sha256:..." }
        createdBy: { type: string, nullable: true }
    ConsumerSchedule:
      type: object
      description: >
        Consumer slots of the newest co-optimizer run (Verbrauchssteuerung
        Inkrement 2, read from site_plan_run + entity_plan_slot). Empty state:
        planId/generatedAt null + entities [] - never fabricated slots.
      properties:
        planId: { type: string, format: uuid, nullable: true }
        generatedAt: { type: string, format: date-time, nullable: true }
        slotMinutes: { type: integer, example: 15 }
        entities:
          type: array
          items:
            type: object
            properties:
              entityId: { type: string, description: mqtt-schedule-2.0 entity id (consumer = measurement_point UUID as string). }
              name: { type: string, nullable: true, description: Customer-facing label of the consumer. }
              slots:
                type: array
                items:
                  type: object
                  properties:
                    time: { type: string, format: date-time }
                    command: { type: string, enum: [on_off, setpoint_kw] }
                    targetValue: { type: number, nullable: true, description: "Planned power in kW (on_off: rated when on, 0 when off)." }
                    reasonCode:
                      type: string
                      nullable: true
                      description: >
                        §15 vocabulary (fixed_window | price_below_threshold |
                        optimizer_selected_low_cost | flex_deadline |
                        guard_grid_limit | no_permitted_energy); null on an off
                        slot. The portal maps it through a pure, tested table -
                        never by scanning German sentences.
                    requirementId: { type: string, nullable: true }
    SimulationRequest:
      type: object
      description: >
        Simulation inputs. On the customer route every field is optional
        (defaults from the site's master data); on the admin/prospect route
        plant (incl. pvKwp + coordinates), consumption.annualKwh and
        battery.capacityKwh are required by the simulation service.
      properties:
        year:
          type: integer
          nullable: true
          description: Reference calendar year; default = the last FULL year.
        zone:
          type: string
          nullable: true
          description: Bidding zone (admin route; customers get the site's). Default DE-LU.
        plant:
          type: object
          nullable: true
          properties:
            pvKwp: { type: number, nullable: true }
            latitude: { type: number, nullable: true }
            longitude: { type: number, nullable: true }
            azimuthDeg: { type: number, nullable: true, description: 180 = Süd (default). }
            tiltDeg: { type: number, nullable: true, description: Default 30. }
        consumption:
          type: object
          nullable: true
          properties:
            annualKwh: { type: number, nullable: true, description: Customer route defaults to 4500. }
            profile:
              type: string
              nullable: true
              description: Load profile id; v1 ships "haushalt" (synthetic typical household).
        tariff:
          type: object
          nullable: true
          properties:
            plantKind: { type: string, nullable: true, enum: [direktvermarktung, eigenverbrauch] }
            tarifArt: { type: string, nullable: true, enum: [dynamisch, fest, ohne] }
            tarifParamCtKwh: { type: number, nullable: true }
            anzulegenderWertCtKwh: { type: number, nullable: true }
            commissionedOn: { type: string, format: date, nullable: true }
            netzladenErlaubt: { type: boolean, nullable: true }
        battery:
          type: object
          nullable: true
          properties:
            capacityKwh: { type: number, nullable: true }
            maxChargeKw: { type: number, nullable: true, description: Default capacity/2. }
            maxDischargeKw: { type: number, nullable: true, description: Default capacity/2. }
            roundtripEfficiencyPct: { type: number, nullable: true, description: Default 92. }
            speicherschonung:
              type: string
              nullable: true
              enum: [aggressiv, ausgewogen, schonend]
              description: Mapped server-side onto the wear ct/kWh (1/4/8).
        sizeSweep:
          type: array
          nullable: true
          items: { type: number }
          description: >
            Battery capacities (kWh) for the Kaufberatungs-Kurve; omitted =
            0.5/1/1.5/2 x the base capacity, [] = base size only. The base
            size is always included.
    SimulationStatus:
      type: object
      description: >
        Async job document. `result` is present while running (progressive:
        scenarios ohneSpeicher/standardSpeicher appear after seconds, the
        voltpilot months fill as their chunks solve) and final when status is
        `done`; German keys per the design contract - scenarios
        (ohneSpeicher/standardSpeicher/voltpilot with kostenEur/wearEur/
        vollzyklen/monatlich), headline (gesamtVorteilEur incl. -Netto,
        speicherVorteilEur, voltpilotVorteilEur incl. -Netto), sizeSweep,
        netzladenVariante (null when the site already grid-charges),
        beispielTage (typisch/bester with per-slot dispatch of BOTH batteries)
        and annahmen (preisjahr/zone/wetter/profil/hinweis). Nothing
        computable is ever a fabricated 0 - absent/null with a reason instead.
      properties:
        status: { type: string, enum: [queued, running, done, failed] }
        progress: { type: number, minimum: 0, maximum: 1 }
        result:
          type: object
          nullable: true
          additionalProperties: true
        error: { type: string, nullable: true, description: German failure reason. }
    RegistrationRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 200
          description: Person or company name; becomes the tenant's display name.
          example: Erika Kaiser
        email:
          type: string
          format: email
          maxLength: 254
          description: Login email (doubles as the username; lowercased).
        password:
          type: string
          minLength: 8
          maxLength: 128
    RegistrationResponse:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        tenantName: { type: string }
        username: { type: string, description: The login name (the lowercased email). }
    EnrollmentCsrRequest:
      type: object
      required: [csrPem]
      properties:
        csrPem:
          type: string
          maxLength: 20480
          description: PEM-encoded PKCS#10 CSR, generated on the device (RSA >= 2048 or EC P-256/P-384).
        deviceInfo:
          type: string
          maxLength: 500
          description: Optional free-form device metadata (model, firmware) for support.
    EnrollmentPending:
      type: object
      properties:
        status: { type: string, example: pending }
        ref: { type: string, description: The canonical reference (POST response only). }
        message: { type: string }
    EnrollmentCertificate:
      type: object
      properties:
        deviceCertPem: { type: string, description: The CA-signed client certificate (pair with the device-held key). }
        caPem: { type: string, description: The device CA certificate (verify the broker with this). }
        mqttHost: { type: string, example: mqtt.example.com }
        mqttPort: { type: integer, example: 8883 }
        tenantId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid, description: Also the certificate CN and the device's MQTT username/clientid. }
    Site:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        biddingZone: { type: string, example: DE-LU }
        latitude:
          type: number
          nullable: true
          description: WGS84 latitude; ties the site to its weather forecast.
          example: 52.52
        longitude:
          type: number
          nullable: true
          description: WGS84 longitude.
          example: 13.405
        plantKind:
          type: string
          enum: [direktvermarktung, eigenverbrauch]
          description: >
            Anlagentyp: steers the portal's money wording per site
            ("mehr verdient" for Direktvermarktung vs. "gespart" for
            Eigenverbrauch). Defaults to eigenverbrauch.
        anzulegenderWertCtKwh:
          type: number
          nullable: true
          minimum: 0
          example: 8.11
          description: >
            Optional anzulegender Wert (ct/kWh) - the plant's fixed EEG
            reference rate from the EEG award / Direktvermarktungsvertrag;
            null = not configured. Only relevant for plantKind =
            direktvermarktung. When set, GET /earnings includes the DYNAMIC
            monthly Marktprämie max(0, anzulegender Wert - Monatsmarktwert
            Solar) on exported energy (suspended in negative-price slots -
            the simplified §51-EEG rule).
        marktpraemieCtKwh:
          type: number
          nullable: true
          deprecated: true
          description: >
            DEPRECATED (2026-07-07): the former manually entered FIXED
            premium - wrong semantics (the premium is the dynamic monthly
            difference to the Monatsmarktwert; fixed is the anzulegender
            Wert). Echoed read-only for one release, no longer accepted on
            create/update and no longer used in any computation; the column
            and this property are removed next release.
        tarifArt:
          type: string
          enum: [dynamisch, fest, ohne]
          description: >
            The customer's electricity tariff art (REPLACES the fixed
            strompreisCtKwh). 'dynamisch' = spot-coupled (each self-consumed kWh
            valued at its 15-min Börsenpreis + the optional Aufschlag); 'fest' =
            a single fixed retail price; 'ohne' = no euro value (self-consumption
            shown in kWh only). Defaults to 'ohne'.
        tarifParamCtKwh:
          type: number
          nullable: true
          minimum: 0
          example: 18.0
          description: >
            The tariff parameter (ct/kWh, >= 0): the fixed retail price for
            'fest', the optional spot-price Aufschlag (grid fees, levies, margin)
            for 'dynamisch', null for 'ohne' / unset. Editable by the site owner
            and by Portal-Admins.
        netzladenErlaubt:
          type: boolean
          description: >
            Per-site grid-charging switch (default false). false = "Nur
            Solarladen (EEG)": the optimizer charges the battery ONLY from
            the site's own PV surplus (Ausschließlichkeitsprinzip). true =
            "Netzladen aktiv": grid arbitrage allowed. Editable by the site
            owner and by Portal-Admins (the portal form carries the
            Ausschließlichkeitsprinzip warning).
        maxFeedInKw:
          type: number
          nullable: true
          exclusiveMinimum: 0
          example: 75.0
          description: >
            Static feed-in cap at the grid connection point (Einspeisegrenze
            am Netzanschlusspunkt, kW; FK1). null = no connection-point
            limit. The optimizer enforces it as a hard cap on grid EXPORT
            ONLY - import is never limited by it (unlike the telemetry-driven
            §14a limit, which is symmetric); when both exist the tighter one
            wins on export.
        leistungspreisEurKw:
          type: number
          nullable: true
          minimum: 0
          example: 120.0
          readOnly: true
          description: >
            READ-ONLY echo of the peak-shaving module (PS-1, Lastspitzenkappung):
            the RLM Leistungspreis in EUR per kW per billing period. Non-null =
            the module is ACTIVE (there is no separate flag). Configured
            exclusively by Portal-Admins via
            PUT /api/v1/admin/sites/{siteId}/optimizer-config - never accepted
            on the customer site create/update requests.
        abrechnungLeistung:
          type: string
          enum: [jahr, monat]
          readOnly: true
          description: >
            READ-ONLY echo (PS-1): the Leistungspreis billing period -
            Jahres- vs. Monatsleistungspreis (Europe/Berlin calendar periods).
            Defaults to 'jahr'. Admin-configured via optimizer-config.
        peakReserveSocPct:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          readOnly: true
          description: >
            READ-ONLY echo (PS-2): the peak-shaving SoC reserve in percent -
            a HARD floor the dispatch never discharges below, held back for
            load peaks beyond the 24h planning horizon. Stacks with the
            backup reserve (the highest configured absolute floor binds).
            null = no peak reserve. Admin-configured via optimizer-config.
        usageProfileOverride:
          type: string
          nullable: true
          enum: [arbitrage, peak, private]
          description: >
            AE7 Nutzungsprofil override (arbitrage | peak | private) or null to
            auto-derive. Set via PUT /api/v1/sites/{id}/profile; the effective +
            derived profile and the emphasis map are served by
            GET /api/v1/sites/{id}/profile (see docs/contracts/v2/usage-profile.md).
        profil:
          type: string
          nullable: true
          enum: [privat, gewerbe]
          description: >
            The site's application PRESET (Anwendungs-Programm Stufe 2,
            migration V20260838000000); null = none chosen, the state of every
            pre-Stufe-2 site. It has exactly three effects and none of them is a
            branch in the data truth: the pre-selection in the Anwendungs-Regal
            (which applications the assistant proposes - the list itself lives
            per application in `anwendungen/catalog.json` as `preset`), the
            TONALITY of the money wording (privat spart, gewerbe verdient;
            without it the wording falls back byte-identically to the plant_kind
            rule) and the reset base for the cockpit layout. It is NEVER a
            signal of the activation derivation. Written exclusively by
            PUT /api/v1/sites/{siteId}/anwendungs-preset.
    SiteAsset:
      type: object
      description: One asset row incl. registry provenance; null = not set.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: battery, description: "'battery' | 'pv' (more later)" }
        deviceId:
          type: string
          format: uuid
          nullable: true
          description: >
            The device that controls this asset. A battery with a null deviceId
            has no control path - the optimizer plans it but cannot publish the
            plan to the edge, so the portal warns.
        capacityKwh: { type: number, nullable: true }
        maxChargeKw: { type: number, nullable: true }
        maxDischargeKw: { type: number, nullable: true }
        roundtripEfficiencyPct: { type: number, nullable: true, description: Round-trip efficiency percent; platform default 92. }
        speicherschonung:
          type: string
          enum: [aggressiv, ausgewogen, schonend, individuell]
          nullable: true
          description: >
            Battery only: the EFFECTIVE "Umgang mit dem Speicher" preset,
            derived server-side from the stored wear cost (NULL = platform
            default = ausgewogen; individuell = an admin configured a custom
            value via optimizer-config). Null for non-battery assets.
        pvCapacityKwp: { type: number, nullable: true }
        moduleCount: { type: integer, nullable: true }
        azimuthDeg: { type: number, nullable: true, description: Clockwise from North; 180 = South. }
        tiltDeg: { type: number, nullable: true }
        commissionedOn: { type: string, format: date, nullable: true }
        registry: { type: string, nullable: true, example: mastr }
        registryUnitId: { type: string, nullable: true, example: SEE966831669444 }
        registryFetchedAt: { type: string, format: date-time, nullable: true }
    MeasurementPoint:
      type: object
      description: >
        One additional read-only measurement point of a site (multi-source
        Anlage). Records Erzeuger (PV) sources whose kWp sums into the aggregate
        asset.pv, and an optional single Netz (grid-meter) source at the point of
        common coupling (no nameplate). Read-only by construction (control always
        false).
      properties:
        id: { type: string, format: uuid }
        role: { type: string, example: pv-generation, description: "'pv-generation' (Erzeuger), 'grid-meter' (Netz) or 'consumer' (Verbraucher)." }
        label: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        capacityKwp: { type: number, nullable: true, description: Per-source nameplate (kWp). }
        registryUnitId: { type: string, nullable: true, example: SEE900000000001 }
        control: { type: boolean, description: Always false for the roles recorded here. }
        createdAt: { type: string, format: date-time, nullable: true }
        entityType:
          type: string
          nullable: true
          enum: [battery-hybrid, producer, grid-meter, null]
          description: >
            v2 entity registry (E1a): the pilot domain type when this row is a
            v2 entity, else null. Set by the admin bootstrap only.
    V2Entity:
      type: object
      description: >
        One v2 entity-registry row (E1a). capabilities/guards are the
        docs/contracts/v2/edge-entity.schema.json $defs objects verbatim.
      properties:
        id: { type: string, format: uuid }
        entityType: { type: string, description: "Open kebab-case vocabulary (E1b); the type catalog is the truth.", example: wallbox }
        role: { type: string, example: battery-hybrid }
        label: { type: string, nullable: true }
        deviceId: { type: string, format: uuid, nullable: true }
        capabilities: { type: object, nullable: true }
        guards: { type: object, nullable: true }
    SaveV2EntityRequest:
      type: object
      description: Create/edit an entity. capabilities/guards are optional JSON overrides.
      properties:
        entityType: { type: string, description: "Catalog type (create only; open kebab-case).", example: wallbox }
        label: { type: string, nullable: true, maxLength: 200 }
        maxPowerKw: { type: number, nullable: true, description: "Rated power; bounds numeric commands + consumer max_consumption_kw." }
        capabilities: { type: object, nullable: true }
        guards: { type: object, nullable: true }
    SiteEntities:
      type: object
      description: The customer entity surface with Soll/Ist reconciliation (E1b).
      properties:
        registry:
          type: object
          nullable: true
          description: The composed registry Soll + the edge's reported revision (null = never pushed).
          properties:
            revision: { type: string }
            composedAt: { type: string, format: date-time }
            deviceId: { type: string, format: uuid, nullable: true }
            reportedRevision: { type: string, nullable: true }
            reportedAt: { type: string, format: date-time, nullable: true }
        entities:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/V2Entity"
              - type: object
                properties:
                  typeLabel: { type: string }
                  control: { type: boolean }
                  syncStatus: { type: string, enum: [in_sync, pending, missing_on_device, unreported, never_pushed] }
                  edgeSourceId: { type: string, nullable: true, description: The edge source this entity was adopted from (U2 pin). }
                  orphanedPin:
                    type: boolean
                    nullable: true
                    description: >
                      true = the pinned edge source is no longer among the
                      device's reported sources (identity churn - offer
                      re-pin via /v2-entities/{entityId}/edge-source); false =
                      pinned + reported; null = no pin, or no local view
                      reported yet (never an unprovable orphan claim).
                  capacityKwp:
                    type: number
                    nullable: true
                    description: >
                      The adopted producer's nameplate, which sums into the
                      plant total - the delete dialog names exactly what gets
                      subtracted instead of warning vaguely.
                  observed:
                    type: object
                    nullable: true
                    properties:
                      health: { type: string, enum: [ok, stale, never] }
                      lastTelemetryAt: { type: string, format: date-time, nullable: true }
                      channels: { type: array, items: { type: string }, nullable: true }
                      appliedType: { type: string, nullable: true }
                      reportedAt: { type: string, format: date-time }
        localSetup:
          type: array
          description: The edge-authoritative commissioning view (inverter/sources; never auto-imported).
          items:
            type: object
            properties:
              id: { type: string }
              kind: { type: string, example: inverter }
              role: { type: string, nullable: true, example: pv-generation }
              brand: { type: string, nullable: true }
              model: { type: string, nullable: true }
              label:
                type: string
                nullable: true
                description: The operator-given name only - never a brand/model/role concatenation.
              reportedAt: { type: string, format: date-time }
              adoptedEntityId: { type: string, nullable: true }
              communication:
                type: string
                nullable: true
                example: solarman_v5
                description: >
                  WIE die Box dieses Gerät erreicht (Anlagen-Zentrale Stufe 2).
                  null = diese Box meldet (noch) keine Verbindungen - NIE
                  "dieses Gerät hat keine"; ein älterer Box-Stand lässt die
                  Felder weg, und daraus darf nur "Weg unbekannt" folgen.
              family: { type: string, nullable: true, example: hybrid_3p }
              host: { type: string, nullable: true, example: 192.168.254.210 }
              port: { type: integer, nullable: true, example: 8899 }
              unitId:
                type: integer
                nullable: true
                description: >
                  Die Modbus-Adresse, wie der jeweilige Transport sie nennt
                  (unit_id bzw. beim Solarman-Weg mb_slave_id) - EIN Feld, weil
                  es dieselbe Sache ist.
              serial:
                type: string
                nullable: true
                example: "2985159064"
                description: >
                  Die Logger-Nummer des Solarman-Wegs; auf einer box-verwalteten
                  Anlage liegt sie nirgendwo sonst vor.
              intervalS: { type: integer, nullable: true, example: 5 }
        staleOnDevice:
          type: array
          items: { type: string }
          description: Entities the edge still reports that the registry no longer contains.
    EntityHistory:
      type: object
      properties:
        range: { type: string, enum: [day, week, month, year] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        bucketMinutes: { type: integer }
        channels:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                start: { type: string, format: date-time }
                avg: { type: number, nullable: true }
                min: { type: number, nullable: true }
                max: { type: number, nullable: true }
                last: { type: number, nullable: true }
                n: { type: integer }
    ComponentAdoptionOutcome:
      type: object
      description: >
        Der Ausgang eines Übernahme-Versuchs (Einheitsmodell Stufe 2).
        `verdict` ist maschinenlesbar, `reason` der deutsche Klartext - beide
        stehen NEBENEINANDER, damit keine Oberfläche einen Satz nach
        Stichworten durchsuchen muss.
      properties:
        verdict:
          type: string
          enum: [ADOPTABLE, ALREADY_PORTAL, NO_REPORT, INCOMPLETE_REPORT, UNKNOWN_DEVICE, UNMAPPABLE_ROLE, AMBIGUOUS_INVERTER]
          description: >
            ADOPTABLE = übernommen · ALREADY_PORTAL = schon portal-verwaltet ·
            NO_REPORT = die Box hat sich nie geäußert · INCOMPLETE_REPORT = ein
            älterer Box-Stand ohne Verbindungsfelder · UNKNOWN_DEVICE = ein
            gemeldetes Gerät steht nicht im Vorlagen-Register ·
            UNMAPPABLE_ROLE = eine Rolle ohne eindeutige Geräteart ·
            AMBIGUOUS_INVERTER = zwei gemeldete Wechselrichter.
        reason:
          type: string
          nullable: true
          description: Der deutsche Grund; null bei Erfolg.
        components:
          type: integer
          description: Wie viele Komponenten übernommen wurden (0 wenn nicht).
    V2EntityBootstrapResult:
      type: object
      properties:
        entities:
          type: array
          items: { $ref: "#/components/schemas/V2Entity" }
        skipped:
          type: array
          items: { type: string }
          description: Honest notes about entity types that could not be created (e.g. no battery asset).
        push:
          type: object
          description: Outcome of the best-effort retained registry publish.
          properties:
            attempted: { type: boolean }
            published: { type: boolean }
            reason: { type: string, nullable: true, enum: [mqtt_not_configured, no_gateway_device, publish_failed, null] }
            deviceId: { type: string, format: uuid, nullable: true }
    V2ConversionPreview:
      type: object
      description: A read-only dry-run of the v1->v2 conversion (MIG). Writes nothing.
      properties:
        alreadyConverted: { type: boolean, description: The site already has v2 entities. }
        gatewayDevice: { type: string, format: uuid, nullable: true, description: "The resolved gateway device - the site's lead box (LeadDeviceService, UEMS AP-06 IP-5); null when none leads." }
        gatewayReason: { type: string, nullable: true, enum: [no_claimed_device, multiple_devices_no_battery_link, no_gateway_device, null], description: "Why no box leads (null when one does): no_claimed_device = the site has no box; multiple_devices_no_battery_link = several boxes, none linked to the battery and none chosen; no_gateway_device = the stored lead box is not (or no longer) registered in this site." }
        plan:
          type: array
          items:
            type: object
            properties:
              pointId: { type: string, format: uuid, nullable: true, description: Existing measurement_point id, or null when it would be created. }
              action: { type: string, enum: [create, refresh] }
              entityType: { type: string, example: battery-hybrid }
              label: { type: string, nullable: true }
              roles:
                type: array
                items: { type: string, enum: [pv, storage, consumer, grid] }
                description: The topology roles this entity's measure channels resolve to (AE1 DefaultRole).
              capabilities: { type: object, description: The capabilities bootstrap would write. }
              guards: { type: object, description: The guard config bootstrap would write. }
        skipped:
          type: array
          items: { type: string }
    V2HistoryCutover:
      type: object
      description: The site's v1->v2 history bridge cutover instant.
      properties:
        cutoverAt: { type: string, format: date-time, nullable: true, description: null = un-migrated (pure v1 history). }
    MastrPreview:
      type: object
      description: >
        Mapped registry record for confirmation. Nullable = "nicht im Register
        hinterlegt". `warnings` are honest German notes (Ost-West/nachgeführt
        orientation, symmetric-charging assumption on the keyless source).
      properties:
        mastrNummer: { type: string, example: SEE966831669444 }
        kind: { type: string, enum: [pv, storage] }
        name: { type: string, nullable: true }
        status: { type: string, nullable: true, example: In Betrieb }
        plantType: { type: string, nullable: true, example: Gebäudesolaranlage }
        powerKw: { type: number, nullable: true, description: PV = kWp (Bruttoleistung); storage = discharge kW. }
        inverterPowerKw: { type: number, nullable: true }
        moduleCount: { type: integer, nullable: true }
        azimuthLabel: { type: string, nullable: true, example: Süd }
        azimuthDeg: { type: number, nullable: true, example: 180 }
        tiltLabel: { type: string, nullable: true, example: 21 - 40 Grad }
        tiltDeg: { type: number, nullable: true, example: 30 }
        commissionedOn: { type: string, format: date, nullable: true }
        storageCapacityKwh: { type: number, nullable: true }
        chargePowerKw: { type: number, nullable: true }
        batteryTechnology: { type: string, nullable: true, example: Lithium-Batterie }
        plz: { type: string, nullable: true }
        ort: { type: string, nullable: true }
        linkedUnitNumber: { type: string, nullable: true, description: Cross-linked sibling unit (SOAP source only). }
        warnings:
          type: array
          items: { type: string }
    MastrApplyRequest:
      type: object
      description: At least one of pv/storage is required.
      properties:
        pv:
          type: object
          required: [mastrNummer]
          properties:
            mastrNummer: { type: string, pattern: "SEE\\d{12}" }
            capacityKwp: { type: number, nullable: true }
            moduleCount: { type: integer, nullable: true }
            azimuthDeg: { type: number, nullable: true }
            tiltDeg: { type: number, nullable: true }
            commissionedOn: { type: string, format: date, nullable: true }
        storage:
          type: object
          required: [mastrNummer]
          properties:
            mastrNummer: { type: string, pattern: "SEE\\d{12}" }
            capacityKwh: { type: number, nullable: true }
            maxChargeKw: { type: number, nullable: true }
            maxDischargeKw: { type: number, nullable: true }
            commissionedOn: { type: string, format: date, nullable: true }
    Overview:
      type: object
      description: Tenant-wide fleet overview (see GET /api/v1/overview).
      properties:
        sites:
          type: array
          items: { $ref: "#/components/schemas/OverviewSite" }
        totals: { $ref: "#/components/schemas/OverviewTotals" }
        dailySavings:
          type: array
          description: >
            Fleet-wide ex-ante savings per Europe/Berlin day, last 14 days
            incl. today; days without any plan are absent.
          items:
            type: object
            properties:
              day: { type: string, format: date }
              savingsEur: { type: number }
    OverviewSite:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        plantKind: { type: string, enum: [direktvermarktung, eigenverbrauch] }
        netzladenErlaubt:
          type: boolean
          description: Per-site grid-charging switch (see Site.netzladenErlaubt).
        batteryWithoutDevice:
          type: boolean
          description: >
            The site has a battery asset with no controlling device: the
            optimizer plans it but cannot publish the plan to the edge. The
            portal warns and links to the fix.
        deviceCount: { type: integer }
        onlineCount:
          type: integer
          description: Devices whose newest telemetry ARRIVED within 5 minutes.
        waitingCount:
          type: integer
          description: Devices that never sent data ("wartet auf erste Daten").
        worstStatus:
          type: string
          nullable: true
          enum: [online, stale, waiting]
          description: >
            Worst device status of the site (stale beats waiting beats online);
            null for a site without devices.
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: Newest telemetry arrival over the site's devices.
        live:
          nullable: true
          description: The site's newest telemetry observation; null when none.
          allOf: [{ $ref: "#/components/schemas/OverviewLive" }]
        plannedSavingsTodayEur:
          type: number
          nullable: true
          description: >
            Ex-ante optimizer savings for today (Europe/Berlin), latest run per
            15-min slot; null when no plan covers today.
        roleCounts:
          $ref: "#/components/schemas/OverviewRoleCounts"
        usageProfile:
          type: string
          enum: [arbitrage, peak, private]
          description: >
            The site's effective AE7 usage profile (the portfolio Profil-Chip),
            same derivation as GET /sites/{id}/profile.
        lastPlanGeneratedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the optimizer last RAN for this site (max generated_at over the
            persisted plans) - the "Plan" column of the platform overview. The
            optimizer re-plans every 15 minutes, so the age is the statement.
            null = no run inside the lookback window (7 days), never a
            fabricated age.
        storageCapacityKwh:
          type: number
          nullable: true
          description: >
            This site's battery capacity (kWh) - the WEIGHT of the portfolio's
            average state of charge (Anwendungs-Programm Stufe 4). Without it a
            fleet average would weigh a 10-kWh house like a 120-kWh plant.
            null = no battery, never a fake zero.
        energyToday:
          nullable: true
          description: >
            Energy sums of the running Europe/Berlin day from
            telemetry_rollup_15m. Energy MAY be summed across plants (unlike a
            percentage). Every field is individually null when no quarter hour
            carried that channel; the rollups lag their refresh job by up to 15
            minutes, which is correct for a day total and wrong for a live
            value (that one comes from `live`).
          allOf: [{ $ref: "#/components/schemas/OverviewEnergyToday" }]
        chargePointCount:
          type: integer
          description: >
            Number of ev-charger entities (roleCounts folds them into
            `consumer` and therefore cannot answer this).
        anwendungen:
          type: array
          items: { type: string }
          description: >
            The site's ACTIVE applications - the stored customer intent over the
            derivation, exactly the rule GET /sites/{id}/profiles applies. The
            portfolio cockpit composes its Bausteine from the UNION over the
            plants; without this it would have to guess, and a switched-off
            marktvermarktung would stay visible.
        standort:
          nullable: true
          description: >
            UEMS AP-02 IP-3 (additive): the Standort this site is assigned to
            today, or null while it is not assigned (today every existing site).
          allOf: [{ $ref: "#/components/schemas/StandortBezug" }]
    OverviewEnergyToday:
      type: object
      description: >
        One day's energy sums (kWh). Every field individually nullable - a
        generation-only plant without a grid meter reports no fabricated 0.
      properties:
        pvKwh: { type: number, nullable: true }
        loadKwh: { type: number, nullable: true }
        gridImportKwh: { type: number, nullable: true }
        gridExportKwh: { type: number, nullable: true }
    AdminFleet:
      type: object
      description: The platform-wide fleet aggregate (see GET /api/v1/admin/fleet).
      properties:
        sites:
          type: array
          items: { $ref: "#/components/schemas/AdminFleetSite" }
        releases:
          type: array
          description: >
            The edge release register, NEWEST FIRST - the first entry is the
            fleet-wide TARGET (Soll). It rides along because "outdated" is only
            a statement against this ordering: a site's reported version is
            LOOKED UP here, and a version the register does not know (an
            existing build is stamped with a bare commit SHA) is "not
            registered" - explicitly NOT "outdated". Empty = no yardstick, so
            nothing is claimed outdated.
          items: { $ref: "#/components/schemas/AdminFleetRelease" }
    AdminFleetSite:
      type: object
      description: >
        One site of the platform fleet. The device fields carry exactly the
        OverviewSite semantics; control/curtailment are the SAME rows the
        per-site customer routes serve, so the platform overview and a site page
        can never claim different things.
      properties:
        siteId: { type: string, format: uuid }
        siteName: { type: string }
        tenantId: { type: string, format: uuid }
        tenantName: { type: string }
        plantKind: { type: string, enum: [direktvermarktung, eigenverbrauch] }
        netzladenErlaubt: { type: boolean }
        tarifArt: { type: string, enum: [dynamisch, fest, ohne] }
        deviceCount: { type: integer }
        onlineCount: { type: integer, description: "Devices whose newest telemetry ARRIVED within 5 minutes." }
        waitingCount: { type: integer, description: "Devices that never sent data." }
        worstStatus:
          type: string
          nullable: true
          enum: [online, stale, waiting]
          description: stale beats waiting beats online; null without devices.
        lastSeenAt: { type: string, format: date-time, nullable: true }
        lastPlanGeneratedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Newest optimizer run; null = no run inside the 7-day lookback
            window, never a fabricated age.
        hasStorage: { type: boolean, description: "The site owns a battery asset (the control matrix's row set)." }
        batteryWithoutDevice: { type: boolean }
        sources:
          nullable: true
          description: >
            The device-reported measurement points counted by health; null = the
            device reported none - which is NOT "0 healthy".
          allOf: [{ $ref: "#/components/schemas/AdminFleetSources" }]
        edge:
          nullable: true
          description: >
            The reported edge software version; null means UNKNOWN (the edge
            only builds the heartbeat's flows block after its first deployment
            set), never "outdated".
          allOf: [{ $ref: "#/components/schemas/AdminFleetEdge" }]
        update:
          nullable: true
          description: >
            The reported OTA state (Stufe 0); null means UNKNOWN, never
            "outdated". It sits NEXT TO `edge`, not inside it: the version
            rides TOP-LEVEL in the heartbeat and is therefore independent of
            the `flows` block an edge only builds after its first flow
            deployment - which is exactly why this block also covers the
            devices `edge` knows nothing about. Both carry their OWN
            reportedAt.
          allOf: [{ $ref: "#/components/schemas/AdminFleetUpdate" }]
        control:
          nullable: true
          description: Latest control evidence; null = the device never read back.
          allOf: [{ $ref: "#/components/schemas/ControlStatus" }]
        curtailment:
          nullable: true
          description: Latest curtailment evidence; null = no evidence.
          allOf: [{ $ref: "#/components/schemas/CurtailmentStatus" }]
        kwp: { $ref: "#/components/schemas/AdminFleetKwp" }
        forecast:
          type: array
          description: >
            Forecast quality per kind (load/pv) over the evaluation window;
            empty when the site has no evaluated day at all.
          items: { $ref: "#/components/schemas/AdminFleetForecast" }
        pflege:
          type: array
          description: >
            The SERVER-derived maintenance items (one truth - the portal renders
            them, it does not re-derive them). Empty = nothing open; "not
            checked" is never an item, it is the reason inside kwp/forecast.
          items: { $ref: "#/components/schemas/AdminFleetPflege" }
    AdminFleetSources:
      type: object
      properties:
        total: { type: integer }
        ok: { type: integer }
        stale: { type: integer, description: "Reported but without current values." }
        never: { type: integer, description: "Has never delivered." }
    AdminFleetEdge:
      type: object
      properties:
        coreVersion: { type: string, nullable: true }
        paletteVersion: { type: string, nullable: true }
        reportedAt: { type: string, format: date-time }
    AdminFleetUpdate:
      type: object
      description: >
        What the device says about the build it runs and what it is doing about
        it (OTA Stufe 0). Everything the box cannot honestly know stays null -
        in Stufe 0 there is no release register and no target on the device, so
        target/lastKnownGood are empty and a sequence number is never guessed.
      properties:
        version:
          type: string
          nullable: true
          description: >
            The build stamp VERBATIM as reported. An existing build carries a
            bare 12-char commit SHA; the portal then renders it honestly as
            "not registered", never as outdated.
        backend:
          type: string
          nullable: true
          description: "The apply backend, e.g. compose. The contract is runtime-agnostic."
        current: { type: string, nullable: true }
        target:
          type: string
          nullable: true
          description: "Empty in Stufe 0 - there is no target assignment on the device yet."
        state:
          type: string
          nullable: true
          enum: [idle, verifying, deferred, downloading, applying, self_test, succeeded, failed, rolled_back]
          description: >
            null = the device reported a version but no update block. A state
            outside this vocabulary is DROPPED on ingest rather than stored - a
            word the cloud does not understand must not become a portal
            sentence.
        reason:
          type: string
          nullable: true
          description: "German; mandatory on the device side for deferred/failed/rolled_back."
        lastKnownGood: { type: string, nullable: true }
        reportedAt: { type: string, format: date-time }
    AdminFleetRelease:
      type: object
      description: >
        One entry of the edge release register. releaseSeq is THE ordering - a
        monotonic integer, never a string or SHA comparison (decision D5).
      properties:
        releaseSeq: { type: integer, format: int64 }
        version: { type: string, description: "The release tag edge-YYYY.MM.N." }
    AdminFleetKwp:
      type: object
      description: >
        kWp plausibility (B4): the measured PV peak (max quarter-hour mean power
        over the lookback window) against the maintained nameplate. `unbekannt`
        is a full verdict - without a nameplate or without enough measured
        quarter-hours nothing is judged, and `reason` says why.
      properties:
        configuredKwp: { type: number, nullable: true }
        observedPeakKw: { type: number, nullable: true }
        buckets: { type: integer, description: "Quarter-hours WITH a PV value in the window." }
        verdict: { type: string, enum: [ok, zu_hoch, zu_niedrig, unbekannt] }
        reason: { type: string, description: "One German sentence - also (and especially) for `unbekannt`." }
    AdminFleetForecast:
      type: object
      description: >
        The site's mean normalized forecast error for one kind, plus the FLEET
        median as the yardstick. Normalized because only that is comparable
        across plant sizes. `outlier` is only ever claimed when a yardstick
        exists (enough evaluated sites) - the same discipline as the edge
        version ("without a reference nothing is outdated").
      properties:
        kind: { type: string, enum: [load, pv] }
        nmaePct: { type: number }
        days: { type: integer, description: "Evaluated days inside the window." }
        fleetMedianPct: { type: number, nullable: true, description: "null = no fleet yardstick." }
        outlier: { type: boolean }
        reason: { type: string }
    AdminFleetPflege:
      type: object
      properties:
        code:
          type: string
          description: >
            Machine-readable id (tarif-fehlt | speicher-ohne-geraet |
            kwp-unplausibel | prognose-ausreisser-{kind}).
        label: { type: string, description: "Short German chip label." }
        detail: { type: string, nullable: true, description: "The reason, where the check has one." }
    EdgeVersion:
      type: object
      description: >
        One device's reported software version. The core version prefers the
        top-level status-heartbeat build (available without any flow deployment)
        and falls back to the historical flows acknowledgement. The palette
        version still comes from that flows acknowledgement and can be absent
        while Node-RED's admin API is not configured.
      properties:
        deviceId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        coreVersion:
          type: string
          nullable: true
          description: The running vp-edge-core version.
        paletteVersion:
          type: string
          nullable: true
          description: The installed @voltpilot/node-red-vp-palette version.
        reportedAt: { type: string, format: date-time }
        newestRelease:
          type: string
          nullable: true
          description: >
            The release register's newest entry - the SOLL this device should
            run (Geräteseiten Stufe 1 R2a). null = the register is empty, i.e.
            there is no yardstick at all. Only the judgement travels; the
            register itself stays behind /api/v1/admin/**.
        upToDate:
          type: boolean
          nullable: true
          description: >
            THREE-VALUED: true = the device runs the newest registered release
            (matched by the house prefix rule, so a tag build's
            `<tag>-<shortsha>` counts), false = outdated, null = NOT judgeable
            (nothing reported, or the reported stamp is not in the register - a
            gap in the REGISTER, never an age claim about the device).
    OverviewRoleCounts:
      type: object
      description: >
        U5 portfolio "Entitäten" badge: Σ v2 entities per topology role. An
        entity's role is its entity_type's catalog category (storage→storage,
        producer→pv, meter→grid, consumer→consumer); each entity counts once (a
        battery-hybrid is one storage entity). All zero for a registry-less site.
      properties:
        pv: { type: integer }
        storage: { type: integer }
        consumer: { type: integer }
        grid: { type: integer }
    OverviewLive:
      type: object
      properties:
        ts: { type: string, format: date-time, description: Observation time. }
        pvKw: { type: number, nullable: true }
        loadKw: { type: number, nullable: true }
        gridKw: { type: number, nullable: true, description: "+ import / - export" }
        socPct: { type: number, nullable: true }
    OverviewTotals:
      type: object
      properties:
        sites: { type: integer }
        devices: { type: integer }
        online: { type: integer }
        plannedSavingsTodayEur:
          type: number
          nullable: true
          description: Sum over the sites' non-null values; null when none has a plan.
        liveSitesCovered:
          type: integer
          description: Sites whose live snapshot is inside the 5-min freshness window.
        storageCapacityKwh:
          type: number
          nullable: true
          description: >
            U5 portfolio KPI: Σ battery capacity (kWh) over the fleet's v1 asset
            rows; null when the fleet has no battery.
        storagePowerKw:
          type: number
          nullable: true
          description: Σ battery discharge power (kW) over the fleet; null when none.
    Earnings:
      type: object
      description: Realized earnings (see GET /api/v1/earnings).
      properties:
        range: { type: string, enum: [day, month, year, all] }
        from:
          type: string
          format: date-time
          description: >
            Window start. For range=all this is the fleet's first covered
            Berlin day - the honest "seit ..." of a Gesamt view.
        to: { type: string, format: date-time }
        sites:
          type: array
          items: { $ref: "#/components/schemas/EarningsSite" }
        totals: { $ref: "#/components/schemas/EarningsTotals" }
        vergleich:
          allOf: [{ $ref: "#/components/schemas/EarningsVergleich" }]
          nullable: true
          description: >
            Die Einordnung der Flotten-Zahl (Konzept vp-erloese-lesbar-konzept-u3
            §3.7 Befund B13, Entscheid E3). Absent/null, sobald es nichts
            ehrlich zu vergleichen gibt - dann bleibt die Zeile weg, NIE ein
            Prozentsatz eines laufenden Tages gegen einen vollen Vortag.
            Nur fuer range=day belegt; Monat/Jahr/Gesamt holt das Portal ueber
            seinen zweiten Abruf mit verschobenem Anker (dort waere ein Prozent
            per E3 ohnehin verboten, und eine zweite Monats-Aggregation auf
            jedem Aufruf ist die Verschwendung, die Audit vp-portal-perf-a4 B5
            abgestellt hat).
    EarningsVergleich:
      type: object
      description: >
        Zwei Betraege derselben Groesse ueber gleich lange Grundlagen - das
        Netto der Flotte (Summe von eigenverbrauchsWertEur - actualEur ueber die
        Anlagen mit bewerteten Viertelstunden), aus DERSELBEN Preiskomposition
        wie die Zeilen (EarningsRepository.aggregate; kein zweites SQL).
      properties:
        modus:
          type: string
          enum: [gleicher_zeitpunkt, ganze_periode]
          description: >
            gleicher_zeitpunkt = ein LAUFENDER Tag, beide Seiten bis bisStunde
            summiert (die laufende Stunde bleibt bei BEIDEN draussen) - nur hier
            darf ein Prozentsatz stehen. ganze_periode = ein abgeschlossener
            Tag, beide Seiten vollstaendig.
        bisStunde:
          type: integer
          nullable: true
          minimum: 1
          maximum: 23
          description: >
            Die Berliner WANDUHR-Stunde, BIS zu der beide Seiten summiert sind;
            null bei modus=ganze_periode.
        jetztEur: { type: number, format: double }
        vorherEur: { type: number, format: double }
      required: [modus, jetztEur, vorherEur]
    EarningsSite:
      type: object
      description: >
        One site's realized earnings over the window. Money values are null
        when no slot is computable; `reason` then says why. Partial coverage
        is not an error - `coveredSlots` counts the slots in the sums.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        plantKind: { type: string, enum: [direktvermarktung, eigenverbrauch] }
        anzulegenderWertCtKwh:
          type: number
          nullable: true
          description: >
            The site's configured anzulegender Wert (ct/kWh), echoed here so
            the portal can state the numbers INCLUDE the dynamic monthly
            Marktprämie; null = not configured (numbers are pure spot, the
            fine print keeps the generic "zzgl. Marktprämie" for
            Direktvermarktung).
        realizedExportCtKwh:
          type: number
          nullable: true
          description: >
            Benchmark KPI - the export-weighted spot price (ct/kWh) the
            site's metered feed-in actually fetched over the window; null
            when the window has no exported energy.
        marketValueSolarCtKwh:
          type: number
          nullable: true
          description: >
            Benchmark KPI - the Monatsmarktwert Solar (ct/kWh) weighted with
            the SAME exports (a range spanning months compares like with
            like); null without exported energy or market-value coverage.
        marketValueProvisional:
          type: boolean
          nullable: true
          description: >
            True while any month contributing to marketValueSolarCtKwh still
            carries the provisional (not yet TSO-published) value; the
            portal labels the number "vorläufig".
        baselineEur:
          type: number
          nullable: true
          description: >
            Signed cost of the unregulated plant (negative = revenue): its
            per-slot import (greatest(load - pv, 0)) valued at the site's real
            supply price - the SAME composition the optimizer plans with (flat
            tariff / spot + Aufschlag / (spot + Preisblatt-Komponenten) x
            (1+USt); bare spot without any price data) - its export
            (greatest(pv - load, 0)) at spot, incl. the Marktprämie its
            immediate feed-in would earn when configured (suspended in
            negative-price slots). Every slot is valued at the CURRENTLY
            maintained tariff/Preisblatt (no price-sheet history).
        actualEur:
          type: number
          nullable: true
          description: >
            Signed measured cost with VoltPilot (negative = revenue): metered
            import at the site's real supply price (same composition as
            baselineEur), metered export at spot incl. the Marktprämie when
            configured (suspended in negative-price slots).
        savedEur:
          type: number
          nullable: true
          description: >
            baseline - actual; negative when the battery ran at a loss. Since
            the structured Bezugspreis, avoided import counts at the tariff
            (not bare spot), so load-shifting is credited fully while pure
            spot churning loses its phantom contribution.
        arbitrageEur:
          type: number
          nullable: true
          description: >
            The part of savedEur the grid-charging permission concretely
            earned ("davon Arbitrage-Gewinn"): revenue attributed to
            grid-charged battery content minus its purchase cost, via a
            deterministic storage-mix walk over the window's 15-min slots
            (grid share of a slot's charge = max(0, charge - PV surplus);
            discharge draws proportionally from the pv/grid content mix;
            pre-window content counts as solar, losses debit both parts
            proportionally). Null when the site may not grid-charge
            (netzladen_erlaubt = false) or the window contains no
            grid-charged energy - never a fake zero.
        pvShiftEur:
          type: number
          nullable: true
          description: >
            The solar time-shifting remainder savedEur - arbitrageEur (incl.
            any Marktprämie delta - grid-charged energy is never
            premium-eligible), so arbitrageEur + pvShiftEur == savedEur
            exactly. Null whenever arbitrageEur is null.
        savedSpeicherEur:
          type: number
          nullable: true
          description: >
            Der Speicher-Anteil der Dreiteilung savedEur = savedSpeicherEur +
            savedSteuerungEur (Audit vp-geldzahlen-audit-x7 §2.5, B1): was ein
            STUR arbeitender Standard-Speicher - das Greedy-Referenzmodell der
            Ersparnis-Simulation (gleiche Physik: Kapazität, Lade-/
            Entladeleistung, sqrt(eta)-Split, SoC-Band inkl. Reserven; lädt
            jeden PV-Überschuss, deckt jedes Defizit, lädt nie aus dem Netz,
            null Preisbewusstsein) - gegenüber der speicherlosen Anlage
            erwirtschaftet hätte. Per-Slot-Zustands-Walk über dieselben
            covered Slots, bewertet mit denselben Preis-Kompositionen wie
            savedEur (je Slot discharge × Bezugspreis − charge × Exportwert).
            Null when savedEur itself is null OR the plant has no maintained
            battery master data (steuerungSplitReason says so) - never a
            guessed reference battery.
        savedSteuerungEur:
          type: number
          nullable: true
          description: >
            savedEur - savedSpeicherEur, the EXACT remainder: der Mehrwert
            der INTELLIGENTEN Steuerung gegenüber dem stur arbeitenden
            Speicher (Preisfenster, Netzladen-Arbitrage, Abregelung), so
            savedSpeicherEur + savedSteuerungEur == savedEur per
            construction. Null whenever savedSpeicherEur is null.
        steuerungSplitReason:
          type: string
          nullable: true
          enum: [no_battery_data]
          description: >
            Why the Speicher/Steuerung split is absent although savedEur is
            computable: no_battery_data = the site has no primary battery
            asset with maintained capacity and charge/discharge power, so the
            greedy reference cannot be simulated (honestly null, never
            guessed). Null when the split is present, or when savedEur itself
            is null (reason explains that case).
        coveredSlots: { type: integer }
        firstCoveredDate:
          type: string
          format: date
          nullable: true
          description: Europe/Berlin day of the first covered slot in the window.
        reason:
          type: string
          nullable: true
          enum: [no_data, missing_channels, no_prices]
          description: >
            Why nothing is computable (only set when savedEur is null):
            no_data = no measurements in the window; missing_channels =
            measurements lack the load/PV/grid channels (generation-only
            inverters); no_prices = no day-ahead price covers the slots yet.
        dailySaved:
          type: array
          description: >
            Realized savings per Europe/Berlin day, last 14 days incl. today,
            independent of `range` (spark bars + "Heute" teaser). Days without
            a computable slot are absent.

            `savedEur` measures against a plant WITHOUT a battery and is an
            ADMIN number since the Messlatte decision (2026-09-04);
            `savedSteuerungEur` measures the intelligent control against the
            SAME plant with a stubborn (price-blind) battery and is the only
            storage figure a customer surface renders. The latter is null when
            the site has no maintained battery master data (see
            steuerungSplitReason) - the total is never a stand-in.
          items:
            type: object
            properties:
              day: { type: string, format: date }
              savedEur: { type: number }
              savedSteuerungEur: { type: number, nullable: true }
        tarifArt:
          type: string
          enum: [dynamisch, fest, ohne]
          description: >
            The site's configured electricity tariff art, echoed so the
            money-centric view can render the provenance sentence ("... zum
            dynamischen Börsenpreis + Aufschlag" vs. "... zum festen Preis").
        tarifParamCtKwh:
          type: number
          nullable: true
          description: >
            The tariff parameter (ct/kWh): the fixed retail price for fest, the
            optional spot-price Aufschlag for dynamisch, null for ohne / unset.
        tarifPriced:
          type: boolean
          nullable: true
          description: >
            Whether savedEur's import side is valued beyond bare spot (a
            tariff parameter, a maintained site_supply_price Preisblatt, or
            the platform default-components flag). Drives the honest
            "bewertet zu Ihrem Stromtarif" provenance copy - a bare tarifArt
            echo cannot tell an 'ohne' site with a maintained Preisblatt from
            one without.
        exportVerguetungPriced:
          type: boolean
          nullable: true
          description: >
            The EXPORT-side sibling of tarifPriced (audit vp-geldzahlen-audit-x7,
            B2 fix): whether the feed-in terms are valued at the plant's feste
            EEG-Einspeisevergütung instead of bare spot (a non-grid-charging
            eigenverbrauch plant with a known, unexpired commissioning date).
            False for Direktvermarktung (its spot + Marktprämie valuation is
            explained by the premium fields) and for plants whose remuneration
            cannot be determined - those honestly stay at spot.
        einspeiseErloesEur:
          type: number
          nullable: true
          description: >
            Feed-in revenue over the window: the metered export valued per the
            plant's remuneration - spot + Marktprämie for Direktvermarktung, the
            feste EEG-Vergütung (§51a-aware per slot) for an unexpired
            eigenverbrauch plant, bare spot otherwise. Null when nothing is
            computable.
        eigenverbrauchsWertEur:
          type: number
          nullable: true
          description: >
            Value of self-consumed energy, computed slot-by-slot per the site's
            tariff (dynamisch: each self-consumed kWh at its 15-min Börsenpreis +
            Aufschlag; fest: at the fixed price); null for an 'ohne' tariff
            (never a fabricated euro) or when nothing is computable.
        gesamtertragEur:
          type: number
          nullable: true
          description: >
            Gesamtertrag = einspeiseErloesEur + eigenverbrauchsWertEur (feed-in
            revenue alone when strompreis is unset). The money-centric hero's
            big number; null when nothing is computable.
        selbstverbrauchKwh:
          type: number
          nullable: true
          description: Self-consumed energy over the window (kWh); null when nothing computable.
        eingespeistKwh:
          type: number
          nullable: true
          description: Grid-exported energy over the window (kWh).
        batterieBewegtKwh:
          type: number
          nullable: true
          description: Energy moved through the battery over the window (charged + discharged, kWh).
        expectedMarketValueSolarCtKwh:
          type: number
          nullable: true
          description: >
            Forward-looking expected Marktwert Solar (ct/kWh): the day-ahead
            price weighted with THIS site's own PV forecast over the coming
            horizon (Σ(price × pv) / Σ(pv)) - the forward companion to the
            realized marketValueSolarCtKwh. Range-independent (always the
            future). Null when there is no forward PV forecast or no forward
            day-ahead price coverage (the portal then hides the figure).
        expectedMarketValueFrom:
          type: string
          format: date-time
          nullable: true
          description: First covered forward slot of expectedMarketValueSolarCtKwh.
        expectedMarketValueTo:
          type: string
          format: date-time
          nullable: true
          description: Last covered forward slot of expectedMarketValueSolarCtKwh.
        expectedMarketValueSlots:
          type: integer
          nullable: true
          description: >
            Number of forward 15-min slots (price + forecast both present)
            behind expectedMarketValueSolarCtKwh - lets the portal state the
            horizon ("nächste N h").
        series:
          type: array
          description: >
            Gesamtertrag bucketed over the selected range (per Europe/Berlin
            hour for day, per day for month, per month for year/all) - the
            Ertrag chart. Only buckets with a computable slot are listed.
          items:
            type: object
            properties:
              start: { type: string, format: date-time, description: Berlin bucket start. }
              gesamtertragEur: { type: number }
        monthlyStrip:
          type: array
          description: >
            Gesamtertrag per Europe/Berlin month for the last 12 months
            (independent of `range`) - the tappable month strip. Months without
            a computable slot are absent. OPT-IN (audit vp-portal-perf-a4,
            finding B5): [] unless the request carries `strip=true`.
          items:
            type: object
            properties:
              month: { type: string, format: date, description: First day of the Berlin month. }
              gesamtertragEur: { type: number }
        peakShaving:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PeakShaving" }]
          description: >
            The Lastspitzenkappung proof (PS-4) - present exactly when the
            site's peak-shaving module is active (non-null
            site.leistungspreis_eur_kw); null otherwise. Range-independent:
            always describes the RUNNING Europe/Berlin billing period.
    SiteEarnings:
      type: object
      description: >
        One Anlage's MEASURED money over one period (see GET
        /api/v1/sites/{siteId}/earnings). Every money/energy field is null when
        it is not computable - never a fabricated 0 - and `reason` says why.
        Two identities hold by construction: nettoErgebnisEur =
        einspeiseErloesEur + eigenverbrauchsWertEur - stromkostenEur, and
        stromkostenEur - einspeiseErloesEur = actualEur.
      properties:
        siteId: { type: string, format: uuid }
        name: { type: string }
        range: { type: string, enum: [day, week, month, year, all] }
        from:
          type: string
          format: date-time
          description: Window start; for range=all the site's first covered Berlin day.
        to: { type: string, format: date-time }
        plantKind: { type: string, enum: [direktvermarktung, eigenverbrauch] }
        tarifArt: { type: string, enum: [dynamisch, fest, ohne] }
        tarifParamCtKwh: { type: number, nullable: true }
        tarifPriced:
          type: boolean
          description: >
            Whether the import side is valued beyond bare spot (tariff
            parameter, maintained Preisblatt, or the platform default
            components) - the "bewertet zu Ihrem Stromtarif" vs "zu
            Börsenpreisen" switch of the surface copy.
        exportVerguetungPriced:
          type: boolean
          description: >
            The EXPORT-side sibling of tarifPriced (audit vp-geldzahlen-audit-x7,
            B2 fix): whether the feed-in is valued at the plant's feste
            EEG-Einspeisevergütung instead of bare spot. False for
            Direktvermarktung and for plants whose remuneration cannot be
            determined (no commissioned pv asset) - those honestly stay at spot.
        anzulegenderWertCtKwh: { type: number, nullable: true }
        coveredSlots: { type: integer, format: int64 }
        firstCoveredDate: { type: string, format: date, nullable: true }
        reason:
          type: string
          nullable: true
          enum: [no_data, missing_channels, no_prices]
          description: Why nothing is computable; null when coveredSlots > 0.
        einspeiseErloesEur:
          type: number
          nullable: true
          description: >
            Metered feed-in valued per the plant's remuneration: spot PLUS the
            Marktprämie for Direktvermarktung, the feste EEG-Vergütung
            (§51a-aware per slot) for an unexpired eigenverbrauch plant, bare
            spot otherwise.
        eigenverbrauchsWertEur:
          type: number
          nullable: true
          description: >
            Self-consumed energy valued per the site's tariff, slot by slot;
            null for an "ohne" tariff without a maintained Preisblatt (the
            quantity then lives in selbstverbrauchKwh alone).
        stromkostenEur:
          type: number
          nullable: true
          description: >
            The metered grid import valued at the site's real supply price -
            the import term of actualEur, exposed so the card's composition
            reconciles with the result it shows.
        nettoErgebnisEur:
          type: number
          nullable: true
          description: einspeiseErloesEur + eigenverbrauchsWertEur - stromkostenEur.
        savedEur:
          type: number
          nullable: true
          description: >
            baselineEur - actualEur, i.e. what VoltPilot's steering contributed
            against an unregulated plant. It sits INSIDE nettoErgebnisEur and
            is rendered as an attribution line, never as another summand.
        arbitrageEur: { type: number, nullable: true }
        pvShiftEur: { type: number, nullable: true }
        savedSpeicherEur:
          type: number
          nullable: true
          description: >
            Der Speicher-Anteil der Dreiteilung savedEur = savedSpeicherEur +
            savedSteuerungEur: was der stur arbeitende Standard-Speicher (das
            Greedy-Referenzmodell der Ersparnis-Simulation) gegenüber der
            speicherlosen Anlage erwirtschaftet hätte - same semantics as the
            fleet endpoint's field. Null when savedEur is null or the battery
            master data is missing (steuerungSplitReason).
        savedSteuerungEur:
          type: number
          nullable: true
          description: >
            savedEur - savedSpeicherEur (exact remainder): der Mehrwert der
            intelligenten Steuerung gegenüber dem sturen Speicher;
            savedSpeicherEur + savedSteuerungEur == savedEur per construction.
        steuerungSplitReason:
          type: string
          nullable: true
          enum: [no_battery_data]
          description: >
            Why the split is absent although savedEur is computable
            (no_battery_data = no primary battery asset with maintained
            capacity + charge/discharge power); null when the split is present
            or savedEur itself is null.
        baselineEur: { type: number, nullable: true }
        actualEur: { type: number, nullable: true }
        marktpraemieEur:
          type: number
          nullable: true
          description: >
            The Marktprämie already CONTAINED in einspeiseErloesEur (shown as
            provenance, never added again); null without an anzulegender Wert
            or without a published Monatsmarktwert.
        bezugspreisCtKwh:
          type: number
          nullable: true
          description: stromkostenEur / bezogenKwh in ct/kWh; null without imported energy.
        realizedExportCtKwh: { type: number, nullable: true }
        marketValueSolarCtKwh: { type: number, nullable: true }
        marketValueProvisional: { type: boolean, nullable: true }
        bezogenKwh: { type: number, nullable: true }
        eingespeistKwh: { type: number, nullable: true }
        selbstverbrauchKwh: { type: number, nullable: true }
        batterieBewegtKwh: { type: number, nullable: true }
        gesamtertragEur:
          type: number
          nullable: true
          description: >
            Money-centric total = einspeiseErloesEur + eigenverbrauchsWertEur
            (the feed-in revenue alone for an "ohne" tariff) - the ONE number
            the cockpit money hero reads. Parity with the fleet twin so the
            cockpit renders from this cheaper site endpoint (audit
            vp-portal-perf-a4, finding B2).
        expectedMarketValueSolarCtKwh:
          type: number
          nullable: true
          description: >
            Forward expected Marktwert Solar (day-ahead price weighted with this
            site's own PV forecast over the coming horizon) - range-independent;
            null without forward PV/price coverage.
        expectedMarketValueFrom: { type: string, format: date-time, nullable: true }
        expectedMarketValueTo: { type: string, format: date-time, nullable: true }
        expectedMarketValueSlots:
          type: integer
          format: int64
          nullable: true
          description: Covered forward slot count behind expectedMarketValueSolarCtKwh.
        speicherDeltaKwh:
          type: number
          nullable: true
          description: >
            Das BESTANDSKONTO des Zeitraums: wie viel Energie am Ende MEHR (+)
            oder weniger (-) im Speicher steckt als am Anfang (Delta-Ladestand x
            Kapazitaet). Der gemessene Gegenpol zu savedEur, das als reine
            Zahlungsbilanz eine eingelagerte kWh nur als entgangenen
            Einspeise-Erloes kennt (Diagnose vp-tagesbild-minus-f3). Null ohne
            primaeren Speicher oder ohne gemessenen Ladestand - nie eine 0.
        speicherWertCtKwh:
          type: number
          nullable: true
          description: >
            Lambda - der vom Optimierer persistierte Wert einer GESPEICHERTEN
            kWh (Verluste und Verschleiss sind darin enthalten), womit
            speicherDeltaKwh bewertet wird.
        speicherWertEur:
          type: number
          nullable: true
          description: >
            speicherDeltaKwh x speicherWertCtKwh / 100. Ausdruecklich KEIN
            Summand von savedEur, sondern der zweite, als "nach dem Plan
            bewertet" beschriftete Posten daneben; beide Vorzeichen sind
            legitim (+ in den Folgetag gespeichert, - aus dem Vortag entnommen).
        speicherWertBasis:
          type: string
          nullable: true
          enum: [plan, terminal]
          description: >
            Womit bewertet wurde: "plan" = Lambda des massgeblichen Slots,
            "terminal" = der Terminalwert des Laufs (der FK2-Rueckfall).
        series:
          type: array
          description: >
            Money per Europe/Berlin bucket (hour for a day, day for week and
            month, month for year/all) - only computable buckets are listed.
          items:
            type: object
            properties:
              start: { type: string, format: date-time }
              einspeiseErloesEur: { type: number, nullable: true }
              eigenverbrauchsWertEur: { type: number, nullable: true }
              stromkostenEur: { type: number, nullable: true }
              nettoEur: { type: number, nullable: true }
        peakShaving:
          allOf: [{ $ref: "#/components/schemas/PeakShaving" }]
          nullable: true
          description: >
            The running billing period's peak-shaving proof; null unless the
            module is active. Range-INDEPENDENT, so the surface must label its
            own period and never add it into the period result.
    PeakShaving:
      type: object
      description: >
        Peak-shaving proof of a module-active site: the running billing
        period's measured grid-import peak vs. the counterfactual no-battery
        peak (both the max 15-min mean import from the telemetry rollups; the
        counterfactual re-adds the battery's dispatch per bucket -
        "dieselbe Anlage ohne Speichereinsatz"). avoidedKw =
        max(0, baselinePeakKw - peakKw); avoidedEur = avoidedKw ×
        leistungspreisEurKw, NOT pro-rated - the Leistungspreis bills the
        period's single highest 15-min mean, so mid-period the number is the
        current standing (final only once the period closes).
      properties:
        leistungspreisEurKw:
          type: number
          description: The configured Leistungspreis (EUR per kW per billing period).
        abrechnung:
          type: string
          enum: [jahr, monat]
          description: Billing period kind (Europe/Berlin calendar year or month).
        periodStart:
          type: string
          format: date
          description: First Berlin day of the running billing period.
        peakKw:
          type: number
          nullable: true
          description: >
            Measured peak of the running period (max 15-min mean grid import,
            kW). Null while the period has no measured import bucket yet.
        baselinePeakKw:
          type: number
          nullable: true
          description: Counterfactual no-battery peak of the running period (kW).
        avoidedKw:
          type: number
          nullable: true
          description: max(0, baselinePeakKw - peakKw).
        avoidedEur:
          type: number
          nullable: true
          description: avoidedKw × leistungspreisEurKw (the period's standing saving).
        history:
          type: array
          description: >
            The last 12 billing periods with measured import data (ascending,
            incl. the running one); the current contract price is applied to
            past periods too.
          items:
            type: object
            properties:
              periodStart: { type: string, format: date }
              peakKw: { type: number }
              baselinePeakKw: { type: number }
              avoidedKw: { type: number }
              avoidedEur: { type: number }
    EarningsTotals:
      type: object
      description: >
        Fleet totals over the computable sites; null money values when no site
        has a computable slot (never a fake zero).
      properties:
        baselineEur: { type: number, nullable: true }
        actualEur: { type: number, nullable: true }
        savedEur: { type: number, nullable: true }
        arbitrageEur:
          type: number
          nullable: true
          description: >
            Sum of the sites' arbitrage attributions; null when no site
            grid-charged in the window.
        pvShiftEur:
          type: number
          nullable: true
          description: >
            savedEur - arbitrageEur over the WHOLE fleet (sites without a
            split cannot grid-charge, so their entire saved is PV-shift);
            arbitrageEur + pvShiftEur == savedEur. Null whenever
            arbitrageEur is null.
        coveredSlots: { type: integer }
        firstCoveredDate:
          type: string
          format: date
          nullable: true
          description: Earliest covered Berlin day across the fleet.
    CreateSiteRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, description: Site display name (required, non-blank). }
        biddingZone:
          type: string
          enum: [DE-LU, AT, CH]
          description: "Day-ahead bidding zone; defaults to 'DE-LU'."
        latitude:
          type: number
          nullable: true
          minimum: -90
          maximum: 90
          description: Optional WGS84 latitude; needed for the site's weather forecast.
        longitude:
          type: number
          nullable: true
          minimum: -180
          maximum: 180
          description: Optional WGS84 longitude.
        plantKind:
          type: string
          enum: [direktvermarktung, eigenverbrauch]
          description: "Anlagentyp; defaults to 'eigenverbrauch'."
        anzulegenderWertCtKwh:
          type: number
          nullable: true
          minimum: 0
          description: >
            Optional anzulegender Wert (ct/kWh, >= 0, at most 3 decimals) -
            the plant's fixed EEG reference rate; only meaningful for
            direktvermarktung sites. (The deprecated marktpraemieCtKwh is no
            longer accepted; old clients sending it are ignored.)
        tarifArt:
          type: string
          enum: [dynamisch, fest, ohne]
          description: >
            The customer's electricity tariff art (default 'ohne'). 'dynamisch'
            values self-consumption per 15-min slot at spot + Aufschlag, 'fest'
            at the fixed price, 'ohne' in kWh only.
        tarifParamCtKwh:
          type: number
          nullable: true
          minimum: 0
          description: >
            The tariff parameter (ct/kWh, >= 0, at most 3 decimals): fixed price
            for 'fest', optional Aufschlag for 'dynamisch', ignored (cleared)
            for 'ohne'. Omit/null = not configured.
        netzladenErlaubt:
          type: boolean
          nullable: true
          description: >
            Grid-charging switch, settable by the site owner and by
            Portal-Admins; omitted = the safe default false ("Nur
            Solarladen (EEG)").
        maxFeedInKw:
          type: number
          nullable: true
          exclusiveMinimum: 0
          description: >
            Optional static feed-in cap at the grid connection point (kW,
            strictly positive, at most 2 decimals); omit/null = no
            connection-point limit. Enforced export-only by the optimizer.
        standortId:
          type: string
          format: uuid
          nullable: true
          description: >
            Additiv (UEMS AP-02 IP-9): the Standort the new site belongs to; it is
            assigned from the day of its creation. Omitted: pre-selected when the
            Kundenbereich has exactly one Standort, no assignment when it has
            none, required (422 `standort_waehlen`) when it has several. Only
            `POST /api/v1/sites` reads it.
    UpdateSiteRequest:
      type: object
      required: [name]
      description: Same fields and validation as CreateSiteRequest.
      properties:
        name: { type: string, description: Site display name (required, non-blank). }
        biddingZone:
          type: string
          enum: [DE-LU, AT, CH]
          description: "Day-ahead bidding zone; defaults to 'DE-LU'."
        latitude: { type: number, nullable: true, minimum: -90, maximum: 90 }
        longitude: { type: number, nullable: true, minimum: -180, maximum: 180 }
        plantKind: { type: string, enum: [direktvermarktung, eigenverbrauch] }
        anzulegenderWertCtKwh: { type: number, nullable: true, minimum: 0 }
        tarifArt:
          type: string
          enum: [dynamisch, fest, ohne]
          description: >
            The customer's electricity tariff art (default 'ohne'; a
            full-representation field like plantKind, so an omitted value resets
            to 'ohne').
        tarifParamCtKwh:
          type: number
          nullable: true
          minimum: 0
          description: >
            The tariff parameter (ct/kWh): fixed price for 'fest', optional
            Aufschlag for 'dynamisch', cleared for 'ohne'.
        netzladenErlaubt:
          type: boolean
          nullable: true
          description: >
            Grid-charging switch, settable by the site owner and by
            Portal-Admins; null keeps the stored value (a form that omits
            the field never flips it).
        maxFeedInKw:
          type: number
          nullable: true
          exclusiveMinimum: 0
          description: >
            Static feed-in cap at the grid connection point (kW, strictly
            positive, at most 2 decimals); null keeps the stored value (a
            form that omits the field never clears the cap - the
            netzladenErlaubt pattern).
    SiteDeletionPreview:
      type: object
      description: What deleting a site would remove (drives the confirm dialog).
      properties:
        deviceCount: { type: integer, description: Devices still at the site; > 0 blocks the delete (409). }
        telemetryCount: { type: integer, format: int64 }
        telemetryFrom: { type: string, format: date-time, nullable: true }
        telemetryTo: { type: string, format: date-time, nullable: true }
        forecastCount: { type: integer, format: int64 }
        scheduleCount: { type: integer, format: int64 }
        weatherCount: { type: integer, format: int64 }
    UpdateDeviceRequest:
      type: object
      description: Only kind + label are editable; the externalRef is immutable.
      properties:
        kind: { type: string, enum: [inverter, battery, meter], nullable: true, description: Unchanged when omitted. }
        name: { type: string, nullable: true, maxLength: 120, description: Customer-facing label; blank/null removes it. }
    DeviceClaimRequest:
      type: object
      required: [siteId, externalRef]
      properties:
        siteId: { type: string, format: uuid }
        externalRef: { type: string, description: Edge device identifier (globally unique). }
        kind: { type: string, description: "Device kind; defaults to 'inverter'.", example: inverter }
    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        externalRef: { type: string }
        kind: { type: string, example: inverter }
        name:
          type: string
          nullable: true
          description: Optional customer-facing label (Bezeichnung); the immutable externalRef stays the identity.
        status: { type: string, example: claimed }
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Newest telemetry timestamp for the device; null until the first data
            arrives. The portal derives the onboarding state from it ("wartet auf
            erste Daten" -> online).
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the device was claimed. The portal escalates the "wartet auf
            erste Daten" copy to troubleshooting guidance once the wait since
            claiming exceeds a threshold.
        lanHost:
          type: string
          nullable: true
          example: "192.168.254.51:8484"
          description: >
            Die eigene Erreichbarkeit der Box im Kundennetz (Anlagen-Zentrale
            Stufe 2, D5) - NUR Anzeige, verbatim inklusive Port. null = die Box
            meldet sie (noch) nicht; NIE "nicht erreichbar".
        lanSeenAt:
          type: string
          format: date-time
          nullable: true
          description: Der Frische-Anker dieser Aussage; er reist immer MIT lanHost.
        lanSource:
          type: string
          nullable: true
          enum: [erreicht, schnittstelle]
          description: >
            Herkunft des Belegs - `schnittstelle` = der vom Docker-Host
            erkannte/konfigurierte Kundennetz-Endpunkt (oder die eigene
            Schnittstelle ohne Container); `erreicht` = kompatibler Fallback
            aus einem Browser-Aufruf, der auch über ein Service-VPN erfolgt
            sein kann.
    DevicePurgeResult:
      type: object
      properties:
        deviceId: { type: string, format: uuid }
        purgedRows:
          type: integer
          format: int64
          description: Raw telemetry rows removed (the derived rollups are rebuilt, not counted).
        purgedBefore:
          type: string
          format: date-time
          description: >
            The purge watermark. Samples observed at or before this instant are
            refused by the ingest path from now on; new data flows normally.
        deviceNotified:
          type: boolean
          description: >
            Whether the retained purge_data command reached the broker. When
            false (broker outage), the cloud data is still gone and replays are
            blocked; the device's local buffer is wiped once the command can be
            delivered.
    ProvisionDeviceRequest:
      type: object
      required: [externalRef]
      properties:
        externalRef:
          type: string
          description: Sticker Geräte-ID (prefix VP-, canonicalized to uppercase).
          example: VP-1234-ABCD
        kind: { type: string, description: "Device kind; defaults to 'inverter'.", example: inverter }
        note: { type: string, nullable: true, description: Free-form operator note (e.g. manufacturing batch). }
    EdgeRelease:
      type: object
      description: >
        One entry of the edge release register (OTA Stufe 0, decision D5;
        signature fields added in Stufe 1).
      properties:
        releaseSeq:
          type: integer
          format: int64
          description: THE ordering - a monotonic integer, never a string/SHA comparison.
        version: { type: string, example: edge-2026.08.0 }
        targetCommit: { type: string, nullable: true, description: The commit it was built from - the paper trail into the repo. }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, nullable: true, description: The registering platform-admin's subject. }
        manifest:
          type: string
          nullable: true
          description: >
            The EXACT bytes of the signed release.json, verbatim (OTA Stufe 1).
            Stored as text and never re-serialized: the signature is over these
            bytes, so any normalisation (a jsonb column, a formatter, a copy out
            of a log) makes it silently unverifiable. Null on a Stufe-0 hand
            entry, which then honestly reads as "not signed".
        signature:
          type: string
          nullable: true
          description: The detached signature file (release.json.sig), verbatim.
        signingKeyId:
          type: string
          nullable: true
          description: The release key that signed the manifest, e.g. rel-2026-a.
    EdgeTrustSet:
      type: object
      description: The current trust-set plus the operator metadata (admin view).
      properties:
        trustSet: { type: string }
        signature: { type: string }
        keyIds:
          type: string
          example: rel-2026-a,rel-2026-b
          description: >
            DERIVED, display only: the RELEASE key ids this set trusts, sorted
            and comma-separated. The truth stays the raw bytes.
        signingKeyId:
          type: string
          example: root-2026-a
          description: The ROOT key that signed the set - never one of keyIds (see the PUT).
        generatedAt:
          type: string
          nullable: true
          description: What the DOCUMENT claims about itself (optional in the contract).
        uploadedAt: { type: string, format: date-time }
        uploadedBy: { type: string, nullable: true }
    SaveEdgeTrustSetRequest:
      type: object
      required: [trustSet, signature]
      properties:
        trustSet:
          type: string
          description: The exact bytes of trust-set.json.
        signature:
          type: string
          description: The exact bytes of trust-set.json.sig.
    CreateEdgeReleaseRequest:
      type: object
      required: [version]
      properties:
        version: { type: string, example: edge-2026.08.0, description: "Must match edge-YYYY.MM.N." }
        releaseSeq:
          type: integer
          format: int64
          nullable: true
          description: >
            Omit to continue the register (max + 1). If given, it must be
            strictly greater than every existing entry.
        targetCommit: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        manifest:
          type: string
          nullable: true
          description: >
            The signed release.json, byte for byte (OTA Stufe 1). When present,
            ITS values win: version, releaseSeq and targetCommit are taken from
            it, and a contradicting value in this body is a 400 rather than a
            silent divergence - the register must never claim something other
            than what was signed. Requires `signature`.
        signature:
          type: string
          nullable: true
          description: >
            The detached signature file (release.json.sig), byte for byte.
            Manifest and signature belong together - sending only one is a 400.
        signingKeyId:
          type: string
          nullable: true
          description: >
            Optional cross-check; must equal the key named by the manifest and
            by the signature file.
    ProvisionedDevice:
      type: object
      properties:
        externalRef: { type: string, example: VP-1234-ABCD }
        kind: { type: string, example: inverter }
        note: { type: string, nullable: true }
        provisionedAt: { type: string, format: date-time }
        claimed: { type: boolean, description: Whether any tenant has connected this device. }
        claimedByTenant:
          type: string
          nullable: true
          description: Name of the claiming tenant (null while unclaimed).
    PendingEnrollment:
      type: object
      description: A device that enrolled (uploaded a CSR) but has no claimed device row.
      properties:
        externalRef: { type: string, example: edge-k7m2xqp }
        deviceInfo: { type: string, nullable: true, description: Free-form device info from the CSR upload. }
        csrUpdatedAt: { type: string, format: date-time, description: When the pending CSR was last (re)uploaded. }
        everIssued:
          type: boolean
          description: >
            True when a certificate was once issued and the device was later
            unclaimed (a stale enrollment), false when never claimed at all.
        issuedAt: { type: string, format: date-time, nullable: true, description: When a certificate was issued (null if never). }
    TelemetryPoint:
      type: object
      properties:
        ts: { type: string, format: date-time }
        powerKw: { type: number }
        socPct: { type: number }
        pvPowerKw: { type: number }
        loadKw: { type: number }
        gridLimitKw:
          type: number
          description: Observed effective §14a power limit.
    PriceSeries:
      type: object
      description: Day-ahead spot prices for a bidding zone (market-wide, not per tenant).
      properties:
        biddingZone: { type: string, example: DE-LU }
        resolution:
          type: string
          nullable: true
          description: ISO-8601 slot resolution of the latest data.
          example: PT15M
        currency: { type: string, example: EUR }
        points:
          type: array
          items: { $ref: "#/components/schemas/PricePoint" }
    PricePoint:
      type: object
      properties:
        ts: { type: string, format: date-time, description: Slot start (UTC). }
        end: { type: string, format: date-time, description: Slot end (exclusive). }
        priceEurMwh: { type: number, description: Spot price in EUR/MWh. }
    PriceHistory:
      type: object
      description: Day-ahead prices aggregated over a historical range (market-wide per zone).
      properties:
        biddingZone: { type: string, example: DE-LU }
        currency: { type: string, example: EUR }
        bucket:
          type: string
          description: Aggregation granularity as ISO-8601 duration (PT15M day, PT1H week, P1D month/year).
          example: P1D
        from: { type: string, format: date-time, description: Window start (inclusive, UTC). }
        to: { type: string, format: date-time, description: Window end (exclusive, UTC). }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/PriceBucket" }
        summary: { $ref: "#/components/schemas/PriceRangeSummary" }
    PriceBucket:
      type: object
      properties:
        ts: { type: string, format: date-time, description: Bucket start (UTC). }
        avgEurMwh: { type: number, nullable: true, description: Mean price over the bucket (EUR/MWh). }
        minEurMwh: { type: number, nullable: true, description: Lowest slot price in the bucket (EUR/MWh). }
        maxEurMwh: { type: number, nullable: true, description: Highest slot price in the bucket (EUR/MWh). }
    PriceRangeSummary:
      type: object
      description: Headline stats over the raw slots in the range window.
      properties:
        avgEurMwh: { type: number, nullable: true }
        minEurMwh: { type: number, nullable: true }
        maxEurMwh: { type: number, nullable: true }
        cheapestTs: { type: string, format: date-time, nullable: true, description: Start of the cheapest slot. }
        mostExpensiveTs: { type: string, format: date-time, nullable: true, description: Start of the most expensive slot. }
        count: { type: integer, description: Number of raw price slots in the window. }
        coverageStart: { type: string, format: date-time, nullable: true, description: Earliest slot with data. }
        coverageEnd: { type: string, format: date-time, nullable: true, description: Latest slot with data. }
    WeatherForecast:
      type: object
      properties:
        runAt:
          type: string
          format: date-time
          nullable: true
          description: Issue time of the forecast run (null if none stored yet).
        points:
          type: array
          items: { $ref: "#/components/schemas/WeatherPoint" }
    WeatherPoint:
      type: object
      properties:
        ts: { type: string, format: date-time, description: Forecast target hour (UTC). }
        temperatureC: { type: number, nullable: true, description: 2 m air temperature. }
        cloudCoverPct: { type: number, nullable: true, description: Total cloud cover 0..100. }
        ghiWM2:
          type: number
          nullable: true
          description: Shortwave / global-horizontal irradiance (W/m²), PV-relevant.
        dniWM2: { type: number, nullable: true, description: Direct (beam) radiation (W/m²). }
        dhiWM2: { type: number, nullable: true, description: Diffuse radiation (W/m²). }
    Schedule:
      type: object
      properties:
        planId: { type: string, format: uuid, nullable: true }
        deviceId: { type: string, format: uuid, nullable: true, description: "Executing battery device (the MQTT schedule topic's device)." }
        generatedAt: { type: string, format: date-time, nullable: true }
        slotMinutes: { type: integer, example: 15 }
        savingsEur:
          type: number
          nullable: true
          description: >-
            Projected savings over the horizon vs. leaving the battery idle
            (the no-battery baseline). Null when the run makes no such
            statement - since P7 that is any run whose socSource is
            `unbekannt`: no measured start SoC means no battery was planned, so
            there is no baseline to measure a saving against. Null is "nothing
            planned", never a claimed 0,00 EUR.
        bankedValueEur:
          type: number
          nullable: true
          description: >-
            Value of the energy the plan banks into (positive) or draws out of
            (negative) the horizon: the run's persisted terminal value per
            stored kWh times the SoC swing (socEndPct - socStartPct). Makes
            savingsEur honest on bank days, where storing into the next day
            reads as negative savings. Null when not computable (runs predating
            the terminal-value column, no battery asset) - never a fabricated 0.
        socStartPct:
          type: number
          nullable: true
          description: Battery state of charge at the plan start (the SoC the banked value is measured from).
        socEndPct:
          type: number
          nullable: true
          description: Planned state of charge at the horizon end.
        peakTargetKw:
          type: number
          nullable: true
          description: >-
            The run's planned billing-period grid-import peak target (PS-1,
            schedule.peak_target_kw) - the "Ziel" a Lastspitzen (peak-shaving)
            Anlage defends. Null when the site runs no peak-shaving module or on
            a run that predates the column.
        effectiveFloorSocPct:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: "Full floor for corrective idle-slot discharge: max(technical minimum, backup reserve, peak reserve). Null on pre-feature runs."
        fallback14a:
          type: boolean
          nullable: true
          description: >-
            Fahrplan-Warum (schedule.fallback_14a): true = this run is the
            advisory build without the infeasible §14a grid-limit constraint
            (edge guards + grid operator enforce the physical limit) - the
            §14a copy switches to the fallback wording. Null on pre-feature
            runs or runs whose explain layer was off.
        whyTerminalAnchor:
          type: string
          nullable: true
          description: >-
            Erklaerbarkeit Stufe 1 (schedule.why_terminal_anchor, migration
            V20260824000000): WHICH branch anchored the value of stored energy -
            einspeisewert (a surplus slot's forgone feed-in) | bezugspreis (a
            deficit slot's avoided grid import - the trueb-horizon case) |
            marktpreis (cheapest refill where grid charging is allowed) |
            vorgabe (env-pinned, nothing derived). Additively extensible; a
            consumer that does not know a word IGNORES it rather than guessing.
            Null when the explain layer was off or on pre-feature runs - the
            surfaces then stay observational.
        whyRefillFreePct:
          type: number
          nullable: true
          description: >-
            Erklaerbarkeit Stufe 1 (schedule.why_refill_free_pct): how much of
            the battery's USABLE band the horizon refills for FREE (surplus in
            slots whose export value is <= 0), 0-100 - the summer statement
            "morgen fuellt Ihr Ueberschuss den Speicher ohnehin". Null when not
            evaluable (no usable band) - never a fabricated 0, which would read
            as "the horizon offers nothing".
        whyNightReserveKwh:
          type: number
          nullable: true
          description: >-
            Nacht-Wertfunktion P3 (schedule.why_night_reserve_kwh, migration
            V20260868000000): how much charge this run holds at SUNRISE, above
            the reserve floor, because the site's OWN night-error history makes
            a heavier night than the forecast plausible (kWh). NOT a fixed
            reserve - the plan holds exactly as much as price spread times error
            probability justifies, so it moves with every run. Null when nothing
            was held back (too little night history, no price spread, a winter
            horizon without a sunrise, the OPTIMIZER_NIGHT_RESERVE_ENABLED
            switch off, or a pre-feature run) - never a fabricated 0.
        whyNightReserveQ:
          type: number
          nullable: true
          description: >-
            The quantile of that amount (0.75 = it is needed in 1 of 4 nights) -
            the SECOND half of one statement. Without it the kWh figure stands
            without its frequency, and the customer sentence is omitted. Null
            exactly when whyNightReserveKwh is null.
        socSource:
          type: string
          nullable: true
          enum: [gemessen, berechnet, unbekannt]
          description: >-
            P7 (Scout vp-deye-diybms-luecke-l5 §3.3, schedule.soc_source,
            migration V20260910000000): WHERE this run's start state of charge
            came from - `gemessen` (real soc_pct telemetry inside the freshness
            window), `berechnet` (a DERIVED state of charge; the generic SoC
            building block ships in its own package - it may feed planning, but
            it never passes itself off as a measurement) or `unbekannt`.
            On `unbekannt` the optimizer planned NO battery at all: every slot's
            batteryKw is 0, socPct and baselineCostEur are null, savingsEur is
            null, and the Fahrplan page says why ("ohne Ladestand keine
            Speicherplanung") instead of drawing a flat 50 % line nobody
            measured. Null = a run predating the column, read as `gemessen`
            (pre-P7 behaviour), NEVER as `unbekannt`; the day splice carries
            null too, because it is stitched from many runs and has no single
            origin. Additively extensible; a consumer that does not know a word
            IGNORES it rather than guessing.
        slots:
          type: array
          items:
            type: object
            properties:
              start: { type: string, format: date-time }
              batteryKw: { type: number, description: "Planned battery power; + = charge, - = discharge." }
              gridKw: { type: number, description: "Projected net grid power; + = import, - = export." }
              socPct:
                type: number
                nullable: true
                description: >-
                  Planned state of charge at slot end. Null on a run without a
                  start SoC (socSource `unbekannt`, P7): the solver needs some
                  start value to stay solvable, but that value is a model
                  placeholder and never leaves it.
              priceEurMwh: { type: number }
              costEur: { type: number, description: "Projected slot cost with the plan." }
              baselineCostEur:
                type: number
                nullable: true
                description: >-
                  Projected slot cost with the battery idle - the reference the
                  planned saving is measured against. Null on a run without a
                  start SoC (socSource `unbekannt`, P7): no battery was planned,
                  so there is nothing to compare, and a 0,00 EUR would claim
                  "planned and worth nothing" instead of "not planned".
              curtailKw: { type: number, nullable: true, description: "Planned PV curtailment for the slot (kW held back, >= 0); the optimizer curtails feed-in at negative prices. Null on pre-curtailment runs." }
              pvKw: { type: number, nullable: true, description: "PV forecast the slot planned with (kW, schedule.pv_kw). Feeds the pv-aware 'Laden aus dem Netz' derivation: grid-charging = charge beyond the slot's available PV (FK3 PV-bus semantics), not merely charging while importing. Null on rows without a persisted PV input." }
              loadKw: { type: number, nullable: true, description: "Load (consumption) forecast the slot planned with (kW, schedule.load_kw). Rendered with pvKw as the two forecast lines over the Fahrplan bars, so the plan explains itself. Null on rows without a persisted load input - the line is absent then, never a fabricated 0." }
              slotRole: { type: string, nullable: true, description: "Fahrplan-Warum role id (schedule.slot_role): warten | pv_speichern | guenstig_laden | eigenverbrauch | verkaufen | spitze_kappen | reserve_halten | abregeln (additively extensible). Null on pre-feature rows - the portal renders its chargeKind fallback then, never a fabricated explanation." }
              slotFlags: { type: array, nullable: true, items: { type: string }, description: "Binding-constraint codes (schedule.slot_flags CSV, split): soc_max, soc_floor, reserve_backup, reserve_peak, charge_cap, discharge_cap, solar_only, grid_limit_14a, feed_in_cap, peak_defining, curtailing. Null = no binding recorded / pre-feature row." }
              storedValueCtKwh: { type: number, nullable: true, description: "The EXACT value of a stored kWh at slot end (the run's SoC shadow price, ct/kWh, rounded 0.1 ct - schedule.stored_value_ct_kwh). Customer copy calls it 'Wert gespeicherter Energie'. Null on pre-feature rows." }
              gridValueCtKwh: { type: number, nullable: true, description: "Effective per-kWh energy value at the grid connection point (ct/kWh, schedule.grid_value_ct_kwh); deviates from the tariff exactly when §14a or the peak module deforms the slot's economics. Null on pre-feature rows." }
              peakPressureEurKw: { type: number, nullable: true, description: "The Leistungspreis allocation on this slot (EUR/kW, schedule.peak_pressure_eur_kw; sums to Leistungspreis + ratchet over the horizon). Null when the site runs no peak-shaving module or on pre-feature rows." }
              importPriceCtKwh: { type: number, nullable: true, description: "P0 Textwahrheit: what one IMPORTED kWh really costs the site in this slot (ct/kWh) - the price the optimizer decided with, not the bare spot in priceEurMwh. Recomposed (not persisted) by the api from spot + the site's tariff/Preisblatt via optimizer/SlotEconomics, the pricing.py twin. Null when the slot has no persisted spot price (a flat 'fest' tariff needs none); the portal degrades to a number-free sentence then and never labels spot as 'Netzstrom'." }
              exportValueCtKwh: { type: number, nullable: true, description: "P0 Textwahrheit: what one EXPORTED kWh really earns in this slot (ct/kWh) - spot + dynamic Marktprämie (Direktvermarktung) or the feste Vergütung (Eigenverbrauch), merchant mode bare spot. Recomposed like importPriceCtKwh; null when not computable." }
              importPriceSource: { type: string, nullable: true, description: "Which rule priced the import: fest | preisblatt | sammelaufschlag | default-flag | spot. A SITE-level fact, identical on every slot of a run; drives the sentence's price breakdown ('Börsenpreis X + Netzentgelte/Abgaben Y')." }
              measuredLoadKw: { type: number, nullable: true, description: "P3 Ist-Last: the MEASURED house consumption of this slot (kW) - the quarter-hour MEAN of telemetry.load_kw, i.e. the same quantity loadKw forecasts. Present only for slots that already happened; the RUNNING slot carries the mean of the samples measured so far. Null for future slots, slots without telemetry and sites reporting no load channel - the portal's solid Ist line is then absent, never a fabricated 0." }
              measuredPvKw: { type: number, nullable: true, description: "Ist-PV (the mirror of measuredLoadKw): the MEASURED PV production of this slot (kW) - the quarter-hour MEAN of telemetry.pv_power_kw, aggregated in the same pass/window as the measured load, i.e. the same quantity pvKw forecasts. It makes the PV forecast error visible and the EEG solar-charging rule ('Laden <= gemessene PV') checkable in the chart. Null for future slots, slots without telemetry and sites whose device reports no PV channel - the line is then absent, never a fabricated 0." }
              coverLoadFromBattery: { type: boolean, nullable: true, description: "Duty-Vorschau (schedule.cover_load_from_battery, migration V20260802010000): true = in THIS slot the device TRACKS the measured house deficit max(load - pv, 0) instead of executing the slot's forecast-derived watt value rigidly, i.e. the plan's batteryKw is a FORECAST here, not a command. Same boolean the frozen MQTT schedule contract carries; served so the Fahrplan can say it BEFORE the slot runs. TRI-STATE: null = not evaluated (pre-feature run / duty switch off), false = evaluated and no duty - the portal marks a phase only on an explicit true." }
              unplannedLoadDischarge: { type: boolean, nullable: true, description: "Additive idle-slot authority: true permits fresh measured load coverage to START from a 0-kW plan slot when full marginal economics favor discharge. It never redefines coverLoadFromBattery and never applies to a planned charge or sale. Null = pre-feature/not evaluated; false = evaluated and intentionally held." }
              whyNextBest: { type: string, nullable: true, description: "Erklaerbarkeit Stufe 1 (schedule.why_next_best, migration V20260824000000): the best action this RESTING slot REJECTED - decken | verkaufen | solar_speichern | netzladen. Only physically ADMISSIBLE alternatives are named (charging needs SoC headroom and, in EEG mode, real PV surplus; netzladen needs the grid-charge permission), so a margin never describes an impossible action. Null on ACTIVE slots (the chosen action's marginal benefit is 0 at the optimum), when nothing else was possible, and on runs whose explain layer was off." }
              whyNextBestMarginCt: { type: number, nullable: true, description: "Erklaerbarkeit Stufe 1 (schedule.why_next_best_margin_ct): how much WORSE that rejected alternative would have been, in ct/kWh - always <= 0. |margin| <= 0.05 is a TIE and the surface must say so ('beides waere gerade fast gleich gut') instead of dressing an abwaegung up as certainty; on 17.08.2026 it was algebraically exactly 0,000 ct/kWh. Null exactly where whyNextBest is null - name and margin are ONE statement." }
              chargeFromSurplusOnly: { type: boolean, nullable: true, description: "Duty-Vorschau, charge-side mirror (schedule.charge_from_surplus_only, migration V20260802010000): true = in THIS slot the device clamps the commanded CHARGE to the measured solar surplus max(pv - load, 0) because buying the shortfall would be uneconomic - the plan's batteryKw is a forecast here too. Same tri-state discipline as coverLoadFromBattery." }
    ControlStatus:
      type: object
      description: Latest inverter-control confirmation for a site (report §5).
      properties:
        deviceId: { type: string, format: uuid }
        commandedKw: { type: number, nullable: true, description: "What the DEVICE regulates on. Since the in-slot duties this is the CORRECTED value, not the plan's watt value - executionMode/-Direction say why it differs." }
        confirmedKw: { type: number, nullable: true, description: "Setpoint the inverter read back." }
        allMatch: { type: boolean, description: "True when every controlled register confirmed its commanded value." }
        controlEnabled: { type: boolean, description: "Whether the device's control kill-switch is on." }
        certified: { type: boolean, description: "Whether the model is bench-certified for control." }
        mismatchRoles: { type: string, nullable: true, description: "Comma-separated roles that did not confirm (e.g. \"battery_power\")." }
        slotStart: { type: string, format: date-time, nullable: true }
        checkedAt: { type: string, format: date-time, description: "When the readback was taken (\"geprüft vor X\")." }
        controlSource: { type: string, nullable: true, enum: [schedule, default], description: "The device's COARSE truth: is a fresh plan driving it at all. It collapses every non-schedule mode (self-consumption fallback, a v2 desired holding the battery, calibration) into `default`, so it must never be rendered as \"the built-in safety rule is running\" - executionMode is the precise signal. Null for a pre-PR-3 row." }
        executionMode: { type: string, nullable: true, enum: [plan, follow, trim, absorb, fallback, idle_follow, high_soc_follow, high_soc_charge, autonomous_discharge], description: "Diagnostic execution path. idle_follow is the economically authorized portable exact-setpoint correction; high_soc_follow and high_soc_charge are the bounded discharge/refill halves of the full-battery top band; autonomous_discharge is the separately exact-model/firmware-certified native charge-block path. Customer UI translates these to German and never exposes the codes." }
        executionDirection: { type: string, nullable: true, enum: [deepen, reduce], description: "Only for executionMode `follow`: the discharge was RAISED to cover the house (`deepen`) or LIMITED to what it needs (`reduce`). The idle path is already unambiguous and does not expose this detail. Null otherwise." }
        executionPlannedKw: { type: number, nullable: true, description: "The setpoint BEFORE an in-slot correction, so plan and execution can stand side by side instead of being two contradicting numbers under one word." }
        executionTargetKw: { type: number, nullable: true, description: "The MEASURED value the correction tracks - the house deficit for follower modes, the PV surplus for trim/absorb; which one follows unambiguously from executionMode. Null when the device could not measure it (it never regulates blind, and never reports blind either) - never a fabricated 0." }
        executionFloorSocPct: { type: number, nullable: true, minimum: 0, maximum: 100, description: "Full technical/backup/peak reserve floor applied by idle correction." }
        executionMeasurementsFresh: { type: boolean, nullable: true, description: "True only when the idle correction started from fresh known SOC/load/PV. Null for other paths or older edges." }
        certSource: { type: string, nullable: true, enum: [env, device, platform], description: "WHICH source granted the certification: `env` = the fleet-wide allowlist, `device` = a First-Light grant on that box, `platform` = the model register. Null = not certified, or an older edge - so an absent value must never be read as a claim about the source." }
        platformCertVerdict: { type: string, nullable: true, enum: [granted, covered_not_activated, not_covered, unknown], description: "What the PLATFORM model register says about this device's selected inverter. `covered_not_activated` = the model IS certified and one deliberate click is missing; `not_covered` = a bench run is genuinely needed. NULL is \"we do not know\" (an older edge, or one that never received a cloud document) and must NEVER be collapsed into `not_covered` - that would send a customer to a bench they do not need." }
        platformCertModel: { type: string, nullable: true, description: "The register entry that matched, so a surface can name WHICH model is covered/waiting." }
        platformCertReason: { type: string, nullable: true, description: "Plain-German cause where a covered-looking model still gets nothing (today: a contradicted bench write-sign convention)." }
    ControlCertification:
      type: object
      description: One bench-certified inverter model in the platform register.
      properties:
        brand: { type: string, description: "Catalog brand, stored lower-case." }
        model: { type: string, description: "Catalog model - the KEY, together with brand. A family is not a model: one bench run must never certify untested siblings." }
        family: { type: string, description: "The model's register family. CHECKED by the device, not derived - the same model under another register map is not what was proven." }
        controlPath: { type: string, nullable: true, enum: [remote, tou], description: "The control surface the bench run drove; it seeds Layer 1's sticky path decision. Null = the run states none." }
        invertControlSign: { type: boolean, nullable: true, description: "The bench-proven WRITE sign convention, which is firmware-dependent - so the DEVICE checks it against its own setting and fails closed on a contradiction. NULL and false are different statements: null = the bench did not answer the question (nothing is checked), false = it did." }
        certifiedAt: { type: string, format: date-time, description: "When the bench run happened (the substantive truth), separate from createdAt." }
        firmwareNote: { type: string, nullable: true, description: "The firmware it was proven on, as PLAIN TEXT for the operator - deliberately NOT a machine gate: the box cannot read a firmware version from the inverter, so a firmware window would be a promise nobody can check." }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
    CertifyControlModelRequest:
      type: object
      required: [brand, model, family]
      properties:
        brand: { type: string, maxLength: 64 }
        model: { type: string, maxLength: 128 }
        family: { type: string, maxLength: 64 }
        controlPath: { type: string, enum: [remote, tou] }
        invertControlSign: { type: boolean, nullable: true, description: "Omit when the bench run did not answer the sign question - omitted means the device checks nothing, false means it was proven not-inverted." }
        certifiedAt: { type: string, format: date-time, description: "Defaults to now when omitted." }
        firmwareNote: { type: string, maxLength: 512 }
        note: { type: string, maxLength: 512 }
    ControlActivation:
      type: object
      description: A plant whose battery control has been deliberately armed.
      properties:
        deviceId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        siteName: { type: string }
        tenantName: { type: string }
        externalRef: { type: string }
        activatedAt: { type: string, format: date-time }
        activatedBy: { type: string, description: "The JWT subject that clicked - the paper trail." }
        note: { type: string, nullable: true }
    CurtailmentStatus:
      type: object
      description: >
        Latest FEED-IN CURTAILMENT truth a site's device(s) reported (the
        additive `curtailment` heartbeat block). It is what turns the Fahrplan's
        "Abregeln" slot from a claim into a verifiable statement: the optimizer
        plans the PV cap, but whether the plant throttles depends on a manual
        per-unit release of the curtailment actor. Absent (204) = an older edge
        or a plant without a curtailment actor - consumers keep their PLAN
        wording then, never a fabricated execution claim.
      properties:
        deviceId: { type: string, format: uuid }
        units: { type: integer, description: "Curtailment-capable units the device has configured." }
        certifiedUnits: { type: integer, description: "Units carrying a per-unit First-Light release. certifiedUnits < units is THE actionable cause the portal names (\"0 von 2 Wechselrichtern freigegeben\")." }
        controlEnabled: { type: boolean, description: "The device's control kill-switch." }
        active: { type: boolean, description: "At least one unit currently APPLIES a cap." }
        appliedCapKw: { type: number, nullable: true, description: "Summed applied caps; null = none applied (never a fabricated 0)." }
        allMatch: { type: boolean, nullable: true, description: "Over the APPLYING units' readbacks; null = nothing applied. Only true is a confirmation - null must never be read as a disagreement." }
        possibleOverride: { type: boolean, description: "A unit's MEASURED power exceeds its cap after the settle window, so a foreign controller may be overriding the limit (Modbus has the lowest priority on Fronius)." }
        checkedAt: { type: string, format: date-time, description: "Newest per-unit readback timestamp - the freshness anchor. A stale block is NO evidence; the portal falls back to its plan wording." }
        exportGuard: { allOf: [{ $ref: "#/components/schemas/ExportGuard" }], nullable: true, description: "„Grenzen & Wächter\" Stufe 0: the live feed-in watchdog. null = not reported (older edge, or no feed-in limit configured) - never a fabricated \"no limit\"." }
        deviceExportLimit: { allOf: [{ $ref: "#/components/schemas/DeviceExportLimit" }], nullable: true, description: "The feed-in limit the INVERTER ITSELF holds. null = not reported (older edge, a family without a trustworthy register, or not read yet)." }
        perUnit:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/CurtailmentUnit" }
          description: >
            The per-unit breakdown (Geräteseiten Stufe 1 / R4a, Captain-Entscheid
            E2). THREE-valued, and the two empty cases say different things:
            null/absent = not loaded on this path (an older backend, or the fleet
            aggregate which renders no per-unit list), [] = the device reported
            none (an older edge - the block predates the list). Only a non-empty
            list is an attribution. It may be SHORTER than `units`: an entry
            without a source id is dropped at ingest rather than attributed to
            nothing, so `units` stays THE count and must never be derived from
            this list's length.
    CurtailmentUnit:
      type: object
      description: >
        One curtailment-capable unit as the BOX reported it. Deriving this in
        the cloud was rejected (E2): only the box knows which unit it wrote to
        and what came back, so a heuristic would be a fabricated attribution.
      properties:
        sourceId: { type: string, description: "The JOIN KEY to the reported sources (/sources.sourceId) - how a unit becomes a device NAME. No name travels over the wire; the portal names devices through its one name builder." }
        certified: { type: boolean, description: "This unit carries a persisted per-unit First-Light release. The edge sources it from its CORE, never from the readback's own stamp, so it can never disagree with certifiedUnits." }
        appliedCapKw: { type: number, nullable: true, description: "The cap THIS unit applies; null = none applied (a release lifted the limit) - never a fabricated 0." }
        match: { type: boolean, nullable: true, description: "This unit's readback verdict; null = observed-only, nothing was commanded. Only true is a confirmation - \"nothing applied\" must never read as \"the readback disagreed\"." }
    ExportGuard:
      type: object
      description: >
        The live feed-in watchdog ("dynamische Einspeisebegrenzung") as the
        device reports it in every heartbeat. The box has been sending this
        block since it was built and the cloud read none of it, so the question
        "which feed-in limit does the box hold, and does it reach any device at
        all?" was only answerable through a maintenance tunnel - it cost two
        investigation rounds at Anlage Herzogau. `effective` is the field the
        block exists for: a watchdog that computes a perfect cap and writes it
        NOWHERE must say so instead of letting a plant believe in a protection
        it does not have.
      properties:
        limitKw: { type: number, description: "The feed-in limit at the grid connection point AS THE BOX KNOWS IT." }
        state: { type: string, enum: [ueberwacht, regelt, haelt, zieht_zusammen, sicherheitskappe], description: "The machine-readable word NEXT TO the German sentence; a word outside this vocabulary is dropped at ingest together with its whole block." }
        reason: { type: string, nullable: true, description: "The device's own German sentence for exactly that state - written ONCE on the device, so the :8484 card and the portal can never word the same verdict differently." }
        capKw: { type: number, nullable: true, description: "The plant-level PV cap the watchdog currently commands; null = none (never a fabricated 0)." }
        limiting: { type: boolean, description: "The cap is actually holding the producers back right now." }
        blind: { type: boolean, description: "The verdict was NOT formed from a fresh connection-point measurement (hold / contract / safe cap)." }
        effective: { type: boolean, description: "false = the cap can reach NO device at all." }
        reach: { type: string, nullable: true, description: "Names the gap in German; null when the cap reaches every unit." }
    DeviceExportLimit:
      type: object
      description: >
        The feed-in limit the INVERTER ITSELF holds - a foreign truth inside the
        customer's device, READ (never written) by the box. At Anlage Herzogau
        the Deye held an installer cap of 33,0 kW in register 0x00E7 while 70 kW
        were configured in the portal; the discrepancy was invisible for two
        investigation rounds because nobody read the register.
      properties:
        limitKw: { type: number, description: "The limit the device currently holds." }
        register: { type: string, description: "WHERE it came from (\"0x00e7\") - a number without its origin is not evidence." }
        readAt: { type: string, format: date-time, description: "Its OWN freshness anchor: the register is read at most once a day (one socket, no extra poll cadence), so it must never borrow checkedAt." }
    SiteSource:
      type: object
      description: >
        One measurement point of a site as the edge reports it. Absent
        measurements stay null (never a fabricated 0); a point that is stale or
        has never delivered says so via `health` instead of vanishing.
      properties:
        deviceId: { type: string, format: uuid, description: "The edge device that reported this point." }
        sourceId: { type: string, description: "Edge-local id (\"inverter\" for the primary)." }
        kind: { type: string, enum: [primary, source] }
        role: { type: string, nullable: true, description: "pv-generation | grid-meter | consumer; null for the primary." }
        label: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        pvKw: { type: number, nullable: true, description: "This point's OWN PV generation." }
        powerKw: { type: number, nullable: true, description: "Signed grid power, + import / - export." }
        loadKw: { type: number, nullable: true }
        health: { type: string, enum: [ok, stale, never] }
        readAt: { type: string, format: date-time, nullable: true }
        reportedAt: { type: string, format: date-time }
    ChargingConfig:
      type: object
      description: >
        Die im Portal gepflegte Lastmanagement-Konfiguration einer Anlage.
      properties:
        gridLimitKw: { type: number, nullable: true, description: "Die Anschlussgrenze in kW; null = noch nicht gepflegt (dann lädt nichts)." }
        priorityChargePointIds:
          type: array
          description: "Die Vorrang-Säulen; leer = keine."
          items: { type: string }
        surplusPolicy: { type: string, nullable: true, enum: [nur_sonne, sonne_zuerst, schnell], description: "Die Überschuss-Priorität; null = nicht gewählt (die Box behält ihre eigene)." }
        storagePriority: { type: string, nullable: true, enum: [speicher_vor_auto, auto_vor_speicher], description: "Wer den Überschuss zuerst bekommt; null = nicht gewählt." }
        chargePoints:
          type: array
          description: >
            Die ALLOWLIST: die Kennungen, unter denen die Box eine Säule
            überhaupt annimmt. Sie FÜGT NUR HINZU - die Box übernimmt jeden
            Eintrag, den sie noch nicht kennt, und überschreibt keinen
            bestehenden; eine Kennung hier WEGZULASSEN ist kein Löschen (das
            sagt `removedChargePointIds` ausdrücklich). Eine leere Liste ist
            hier deshalb - anders als beim Vorrang - keine Aussage „keine
            Säule".
          items: { $ref: "#/components/schemas/AllowedChargePoint" }
        removedChargePointIds:
          type: array
          description: >
            Die ZURÜCKGENOMMENEN Kennungen - die GRABSTEIN-Liste. Sie reist in
            JEDEM folgenden Dokument an die Box mit, nicht einmal: das retained
            Dokument wird als Ganzes ersetzt, also hätte eine nur einmal
            genannte Löschung eine gerade offline gewesene Box nie erreicht.
            Eine Kennung steht nie zugleich in `chargePoints` - ein erneutes
            Eintragen belebt sie wieder und nimmt sie hier heraus.
          items: { type: string }
        frame:
          allOf:
            - $ref: "#/components/schemas/LadeparkRahmen"
          nullable: true
          description: >
            Der Ladepark-RAHMEN (P5/E10) - die Auslegungs-Zahlen, die bis dahin
            nur `:8484` kannte. null = dazu ist nichts gepflegt und die Box
            rechnet mit ihren eigenen; GESCHRIEBEN wird er ausschliesslich über
            `PUT /api/v1/admin/sites/{siteId}/charging-frame`.
        storageRank:
          type: integer
          nullable: true
          description: >
            Die Position des SPEICHERS in der Rangliste des Kunden (P6). Sie
            steht NEBEN `storagePriority`, nicht an ihrer Stelle: es ist EINE
            Menge, zweimal gelesen. null = der Kunde hat nie eine Reihenfolge
            gezogen, und dann entscheidet allein `storagePriority`, wer in den
            ganzen Überschuss greifen darf - nie 0.
        updatedAt: { type: string, format: date-time, nullable: true }
        updatedBy: { type: string, nullable: true, description: "Wer sie zuletzt gesetzt hat (JWT-Subject)." }
    LadeparkRahmen:
      type: object
      description: >
        Der Ladepark-RAHMEN einer Anlage (Verbrauchsmanagement v1 / P5, E10).
        Jedes Feld einzeln optional: null heisst „das Portal äußert sich dazu
        nicht" und die Box behält ihre eigene Zahl - nie 0.
      properties:
        houseReserveKw: { type: number, nullable: true, description: "Die gepflegte Hausreserve; sie gilt nur, solange der Netzanschluss nicht gemessen wird." }
        marginPct: { type: number, nullable: true, description: "Der Sicherheitsabstand zur Anschlussgrenze in Prozent - er wird an der GRENZE genommen, nicht am Rest." }
        minPowerKw: { type: number, nullable: true, description: "Die Mindestleistung, unter der pausiert statt ausgehungert wird. Sie wird auf die Steckdose geklemmt: 30 kW machen eine 11-kW-Wallbox nicht unbedienbar." }
        rotationMinutes: { type: integer, nullable: true, description: "Der Takt, in dem Wartende wechseln." }
        maxHouseLoadKw: { type: number, nullable: true, description: "Die höchste bekannte Gebäudelast - die Grundlage des Ausfall-Profils, NICHT dieselbe Zahl wie die Mindestleistung." }
        staticBudget: { type: boolean, nullable: true, description: "true = rechne STATISCH, auch wenn eine Messung vorliegt. Negativ formuliert wie auf der Box, damit der Nullwert die gewollte Vorgabe ist." }
    AllowedChargePoint:
      type: object
      description: >
        Eine im Portal eingetragene Ladesäule. Alles außer der Kennung ist das,
        was der Betreiber zufällig schon weiß - null heißt „unbekannt", nie 0:
        die Box entscheidet dann aus dem, was die Säule selbst meldet.
      properties:
        chargePointId: { type: string, description: "Die OCPP-ChargePointId, zeichengleich wie in der Säule eingetragen." }
        label: { type: string, nullable: true, description: "Der Name, unter dem der Kunde sie wiedererkennt; null = die Box nimmt die Kennung." }
        ratedKw: { type: number, nullable: true, description: "Nennleistung je Stecker; null = unbekannt." }
        connectors: { type: integer, nullable: true, description: "Erklärte Steckerzahl; null = unbekannt." }
        source: { type: string, nullable: true, enum: [nur_sonne, sonne_zuerst, schnell], description: "Die STEUERART dieser Säule (P5) - woher IHR Ladestrom kommen soll. null = für sie ist nichts gewählt und es gilt der ANLAGEN-STANDARD (surplusPolicy); nie \"schnell\"." }
        minKw: { type: number, nullable: true, description: "Ab welcher Leistung diese Säule überhaupt anfängt; null = unbekannt, nie 0." }
        connection: { type: string, nullable: true, enum: [haus, eigen], description: "WO die Säule hängt (Cockpit Phase 1 / C1) - das SOLL des Kunden: \"haus\" = hinter dem Hausanschluss (ihre Leistung steckt in der Netzmessung der Anlage, das Budget-Gesetz der Box gilt für sie), \"eigen\" = eigener Netzanschluss/Zähler. null = der Kunde hat nichts gesagt und die Box behält, was sie hat - NIE \"eigen\", denn das nähme eine reale Ladeleistung aus ihrer Bilanz." }
        rank:
          type: integer
          nullable: true
          description: >
            Die Position dieser Säule in der Rangliste des Kunden (P6). null =
            sie steht in keiner, und dann entscheidet allein die Vorrang-MENGE
            (`priorityChargePointIds`) - also exakt wie vor P6.


            ⚠ GLEICHE ZAHLEN SIND GLEICHRANGIG: alle Säulen EINER Seite des
            Speichers tragen dieselbe, weil die Fläche sie als EINE Zeile zeigt
            und der Kunde zwischen ihnen gar keine Reihenfolge gewählt hat. Die
            Box wechselt zwischen ihnen weiter im Takt ab (Rotation).
        addedAt: { type: string, format: date-time, nullable: true }
        addedBy: { type: string, nullable: true, description: "Wer sie eingetragen hat (JWT-Subject)." }
    Steuerart:
      type: object
      description: >
        Genau EINE Quelle, höchstens EIN Ziel. Jedes Feld ist nullable und
        `null` heißt "diese Steuerart kennt diesen Wert nicht" - nie 0.
      properties:
        quelle:
          type: string
          enum: [sofort, ueberschuss, guenstig, feste_zeiten, eigene_regel]
          description: >
            `eigene_regel` = die Policy ist nicht eindeutig auf eine Steuerart
            abbildbar (§7.1 Regel 9); sie bleibt unverändert stehen und die
            Fläche verlinkt den Baukasten.
        herkunft:
          type: string
          enum: [policy, standard, ohne]
          description: >
            `standard` = dieser Ladepunkt folgt dem Anlagen-Standard;
            `policy` = er hat eine eigene Steuerart (die Zeile liest
            "abweichend"); `ohne` = es gibt keine Policy.
        schwelleKw: { type: number, nullable: true }
        preisgrenzeCtKwh: { type: number, nullable: true }
        ueberschussModus:
          type: string
          nullable: true
          enum: [pausieren, mindestleistung, null]
        mindestleistungKw: { type: number, nullable: true }
        fenster: { $ref: "#/components/schemas/SteuerartFenster" }
        ziel:
          type: string
          nullable: true
          enum: [bis_uhrzeit, laufzeit_bis, null]
        zielFenster: { $ref: "#/components/schemas/SteuerartFenster" }
        zielEnergieKwh: { type: number, nullable: true }
        zielLaufzeitMinuten: { type: integer, nullable: true }
        zielAmStueck: { type: boolean, nullable: true }
    SteuerartFenster:
      type: object
      nullable: true
      properties:
        tage: { type: string, enum: [daily, weekdays, weekend] }
        von: { type: string, example: "13:00" }
        bis: { type: string, example: "15:00" }
    SteuerartWahl:
      type: object
      description: >
        Eine anbietbare Wahl. Gesperrt heisst SICHTBAR mit Grund, nie versteckt -
        eine fehlende Karte erklärt nichts.
      properties:
        id: { type: string, example: ueberschuss }
        gesperrt: { type: boolean }
        grund:
          type: string
          nullable: true
          description: Bei einer gesperrten Wahl IMMER gesetzt.
    SteuerartWunsch:
      type: object
      description: >
        Die GEWÜNSCHTE Steuerart - die Spiegelform von `Steuerart` ohne
        `herkunft` (die entscheidet der Server). Jedes Feld ausser `quelle` ist
        optional; null heisst "dazu sagt der Kunde nichts", dann gilt die
        Vorgabe aus `optionen.vorgaben`. Was die gewählte Quelle nicht fragt,
        wird nicht gesendet.
      required: [quelle]
      properties:
        quelle:
          type: string
          enum: [sofort, ueberschuss, guenstig, feste_zeiten, freigabe_ueberschuss, freigabe_guenstig]
        schwelleKw: { type: number, nullable: true }
        preisgrenzeCtKwh: { type: number, nullable: true }
        mindestlaufzeitMinuten:
          type: integer
          nullable: true
          description: >
            Profil-Feld (`min_on_seconds`), kein Dokument-Feld - der
            Zyklen-Wächter der Box liest es aus dem Registry-Push.
        sperrzeitMinuten:
          type: integer
          nullable: true
          description: Profil-Feld (`min_off_seconds`); nur die SG-Ready-Freigabe fragt danach.
        fenster: { $ref: "#/components/schemas/SteuerartFenster" }
        ziel:
          type: string
          nullable: true
          enum: [bis_uhrzeit, laufzeit_bis, null]
        zielFenster:
          allOf: [{ $ref: "#/components/schemas/SteuerartFenster" }]
          description: >
            `von` darf FEHLEN - dann setzt der Server ihn auf `bis` minus
            `optionen.vorgaben.zielFensterStunden`.
        zielEnergieKwh: { type: number, nullable: true }
        zielLaufzeitMinuten: { type: integer, nullable: true }
        zielAmStueck: { type: boolean, nullable: true }
    SteuerartErgebnis:
      type: object
      properties:
        steuerart: { $ref: "#/components/schemas/Steuerart" }
        aktiv:
          type: boolean
          description: >
            Ob die Steuerart jetzt WIRKLICH läuft. false = sie ist gespeichert,
            aber die Aktivierung wurde benannt abgelehnt (Flag aus, Compiler
            weg, fremder Anspruch) - der Entwurf bleibt stehen.
        grund: { type: string, nullable: true }
        nachricht: { type: string, nullable: true }
        verteilt:
          type: boolean
          description: Ob das Artefakt an das Gerät verteilt werden konnte.
        policyVersion: { type: integer, nullable: true }
    Fahrzeuge:
      type: object
      description: >
        Die Ladekarten einer Anlage (Paket P7). Der Schlüssel ist ein Pseudonym
        der BOX - der Klartext-IdTag kommt hier nie vor.
      properties:
        fahrzeuge:
          type: array
          items:
            type: object
            required: [tagRef]
            properties:
              tagRef:
                type: string
                pattern: "^tagref_[0-9a-f]{8,64}$"
                description: Der Pseudonym der Box, NIE der Bezug des OCPP-Journals.
              name:
                type: string
                nullable: true
                description: null = gesehen, aber noch nicht benannt.
              steuerart:
                nullable: true
                description: null = kein Profil - die Karte lädt wie ihr Ladepunkt.
                allOf: [{ $ref: "#/components/schemas/Steuerart" }]
              mindestleistungKw: { type: number, nullable: true }
              ersteSichtungAm: { type: string, format: date-time, nullable: true }
              letzteSichtungAm: { type: string, format: date-time, nullable: true }
              letzterLadepunkt:
                type: string
                nullable: true
                description: Die Kennung der Säule, an der sie zuletzt geladen hat.
              laedt:
                type: boolean
                description: >
                  Aus dem Herzschlag, nie aus der Sichtungszeit geraten -
                  "vor zwei Minuten gesehen" ist keine laufende Ladung.
    Verbraucher:
      type: object
      description: Die Zone "Verbraucher" einer Anlage (lesend).
      properties:
        verbraucher:
          type: array
          items:
            type: object
            properties:
              entityId: { type: string, format: uuid }
              name:
                type: string
                nullable: true
                description: >
                  Der Anzeigename: der vergebene Name, sonst die OCPP-Kennung,
                  sonst null.
              typ: { type: string, example: ev-charger }
              typLabel: { type: string, example: Ladepunkt }
              ladepunkt:
                type: boolean
                description: >
                  true = für den Kunden ein "Ladepunkt" (OCPP-Säule ODER
                  go-e/Modbus-Wallbox - ein Modell, dieselben Steuerart-Wörter).
              chargePointId: { type: string, nullable: true }
              steuerart: { $ref: "#/components/schemas/Steuerart" }
              regeln:
                type: integer
                description: >
                  Wie viele AKTIVE Wenn/Dann-Flows diese Komponente
                  beanspruchen - die Regeln, die NICHT die Steuerart bilden.
              fortschritt:
                nullable: true
                description: >
                  Der Ziel-Fortschritt aus dem Erfüllungs-Ledger (dieselbe Form
                  wie `/consumers/{id}/fulfillment`), null ohne Beleg.
              aktiv: { type: boolean, nullable: true }
              optionen:
                type: object
                description: >
                  Was hier WÄHLBAR ist (P2). Aus der reinen SteuerartSatz -
                  derselben Klasse, mit der der Schreibweg die Wahl ein zweites
                  Mal prüft; der Dialog rendert damit nur, was der Server auch
                  annehmen würde. Eine gesperrte Wahl bleibt SICHTBAR und trägt
                  ihren Grund.
                properties:
                  schreibbar:
                    type: boolean
                    description: >
                      false = die Steuerart lässt sich hier (noch) nicht setzen
                      (heute: die OCPP-Säule bis Paket P5).
                  nichtSchreibbarGrund: { type: string, nullable: true }
                  quellen:
                    type: array
                    items: { $ref: "#/components/schemas/SteuerartWahl" }
                  ziele:
                    type: array
                    description: Leer = dieser Typ kennt gar kein Ziel.
                    items: { $ref: "#/components/schemas/SteuerartWahl" }
                  vorgaben:
                    type: object
                    description: >
                      Die Startwerte der Folgefragen (§3.2). Ein Feld, das nicht
                      BELEGT ist, bleibt null und das Formular startet leer -
                      nie eine erfundene Zahl.
                    properties:
                      schwelleKw: { type: number, nullable: true }
                      preisgrenzeCtKwh: { type: number, nullable: true }
                      mindestlaufzeitMinuten: { type: integer, nullable: true }
                      sperrzeitMinuten: { type: integer, nullable: true }
                      fenster: { $ref: "#/components/schemas/SteuerartFenster" }
                      zielUhrzeit: { type: string, nullable: true, example: "06:00" }
                      zielTage: { type: string, nullable: true, example: daily }
                      zielEnergieKwh: { type: number, nullable: true }
                      zielLaufzeitMinuten: { type: integer, nullable: true }
                      zielFensterStunden:
                        type: integer
                        description: >
                          Wie lang das Ziel-Fenster VOR der Frist ist (§3.2
                          fragt nur nach der Frist, den Beginn setzt der
                          Server) - die Fläche zeigt das entstehende Fenster
                          wörtlich, statt es zu verschweigen.
        ladepunkte:
          type: object
          properties:
            standard:
              allOf: [{ $ref: "#/components/schemas/Steuerart" }]
              nullable: true
              description: null nur, wenn die Anlage gar keinen Ladepunkt hat.
            standardFolger: { type: integer }
            gesamt: { type: integer }
            rahmen:
              type: object
              nullable: true
              description: >
                Der Ladepark-Rahmen (§4.2) - eine AUSWAHL aus dem Budget-Block
                der Box plus die im Portal gepflegte Anschlussgrenze. Jede Zahl
                nullable; `hinweis` ist der Satz der Box, wörtlich.
              properties:
                netzanschlussKw: { type: number, nullable: true }
                gepflegteGrenzeKw: { type: number, nullable: true }
                effektivGrenzeKw: { type: number, nullable: true }
                hausLastKw: { type: number, nullable: true }
                hoechsteHausLastKw: { type: number, nullable: true }
                verteiltKw: { type: number, nullable: true }
                budgetKw: { type: number, nullable: true }
                sicherheitsabstandPct: { type: number, nullable: true }
                mindestleistungKw: { type: number, nullable: true }
                modus: { type: string, nullable: true }
                blind: { type: boolean }
                hinweis: { type: string, nullable: true }
                steckerAnzahl: { type: integer }
                gemeldetAm: { type: string, format: date-time, nullable: true }
        rangliste:
          type: array
          description: >
            Die Reihenfolge bei knapper Leistung (§5/§7.3), Speicher als
            Eintrag. Gespeichert wird sie über PUT /rangliste - als PROJEKTION
            auf consumer_profile.default_service_rank + storage_relation und die
            Speicher-Frage des Ladeparks, nie als eigene Tabelle. Gleichrangige
            Ladepunkte (OCPP-Säulen ohne consumer_profile) stehen als EINE Zeile
            mit mehreren `mitglieder` - der Ganzzahl-Rang je Säule ist Paket P6.
          items:
            type: object
            properties:
              position:
                type: integer
                description: >
                  1-basiert über die GERÄTE: eine Gruppe aus drei Säulen auf
                  Platz 6 belegt 6, 7 und 8, die nächste Zeile steht auf 9.
              art: { type: string, enum: [speicher, ladepunkt, verbraucher] }
              entityId:
                type: string
                format: uuid
                nullable: true
                description: null beim Speicher UND bei einer Gruppe.
              name:
                type: string
                nullable: true
                description: null bei einer Gruppe - die Fläche nennt ihre Mitglieder.
              mitglieder:
                type: array
                description: Leer beim Speicher, sonst mindestens eine Komponente.
                items:
                  type: object
                  properties:
                    entityId: { type: string, format: uuid }
                    name: { type: string }
    SiteCharging:
      type: object
      description: >
        Die Ladepunkt-Sicht EINER Anlage: das geteilte Budget + die Säulen.
      properties:
        budget: { allOf: [{ $ref: "#/components/schemas/ChargingBudget" }], nullable: true }
        chargers:
          type: array
          items: { $ref: "#/components/schemas/ChargePoint" }
    ChargingBudget:
      type: object
      description: >
        Das Standort-Budget, wie die Box es gerechnet hat. Alle Messwert-Felder
        sind nullable - kein Messwert ist NIE eine 0.
      properties:
        deviceId: { type: string, format: uuid }
        enabled: { type: boolean, description: "Der OCPP-Server der Box läuft." }
        controlEnabled: { type: boolean, description: "Die LEBENDE Zuteilung darf geschrieben werden; ohne sie fährt die Anlage auf n x Sicherheitsprofil." }
        controlNote: { type: string, nullable: true, description: "Warum nicht - eine Verweigerung, die niemand sieht, ist ein Rätsel." }
        gridLimitKw: { type: number, nullable: true, description: "Die gepflegte Anschlussgrenze." }
        marginPct: { type: number, nullable: true, description: "Sicherheitsabstand, genommen VON der Anschlussgrenze." }
        minPowerKw: { type: number, nullable: true, description: "Unter dieser Leistung wird pausiert statt ausgehungert." }
        budgetKw: { type: number, nullable: true }
        allocatedKw: { type: number, nullable: true }
        reservedKw: { type: number, nullable: true, description: "Zurückgehalten für nicht erreichbare Ladepunkte oder noch nicht abgeglichene Sitzungen beim Wiederanlauf." }
        measuredKw: { type: number, nullable: true, description: "Was die Säulen wirklich ziehen." }
        siteLoadKw: { type: number, nullable: true }
        siteGridKw: { type: number, nullable: true }
        budgetMode: { type: string, nullable: true, enum: [statisch, gemessen, haelt, zieht_zusammen, sicherheitsbudget] }
        budgetNote: { type: string, nullable: true, description: "Der deutsche Satz der Box, unverändert." }
        budgetBlind: { type: boolean }
        effLimitKw: { type: number, nullable: true, description: "Die wirksame Grenze (gepflegt oder §14a, die engere)." }
        safeDefaultKw: { type: number, nullable: true, description: "Das Ausfall-Profil je Stecker." }
        safeDefaultNote: { type: string, nullable: true }
        safeDefaultHolds: { type: boolean, nullable: true, description: "Stecker x Ausfall-Profil + höchste Gebäudelast bleibt unter der Grenze. null = nicht gemeldet." }
        safeWorstCaseKw: { type: number, nullable: true }
        maxHouseLoadKw: { type: number, nullable: true }
        connectorCount: { type: integer }
        ocppPort:
          type: integer
          nullable: true
          description: >
            Der Port, unter dem der OCPP-Server der Box lauscht - zusammen mit
            der LAN-Adresse des Geräts der Endpunkt, den eine Säule anwählt.
            null heißt „eine ältere Box meldet es nicht" ODER „der Server
            lauscht gerade nicht", nie Port 0: eine Adresse, auf der niemand
            antwortet, ist die schlechtere Auskunft als gar keine.
        ocppUrlPath: { type: string, nullable: true, description: "Der Pfad des OCPP-Servers (z. B. `/ocpp`); null wie oben." }
        reportedAt: { type: string, format: date-time }
    ChargePoint:
      type: object
      description: >
        Eine Ladesäule. Hersteller/Modell/Firmware sind SELBSTAUSKUNFT der
        Station und ausschließlich zur Anzeige (herstellerneutral: kein
        Mechanismus verzweigt auf sie).
      properties:
        deviceId: { type: string, format: uuid }
        chargePointId: { type: string, description: "Die OCPP-ChargePointId - DIE Identität." }
        label: { type: string, nullable: true }
        priority: { type: boolean, description: "Vorrang-Säule: lädt zuerst voll, der Rest teilt fair." }
        connected: { type: boolean }
        vendor: { type: string, nullable: true }
        model: { type: string, nullable: true }
        firmware: { type: string, nullable: true }
        ready: { type: boolean, description: "Die zwei dauerhaften Schutzprofile sind hinterlegt." }
        note: { type: string, nullable: true, description: "Warum nicht bereit - nie ein unerklärtes Nein." }
        lastSeen: { type: string, format: date-time, nullable: true }
        connection: { type: string, nullable: true, enum: [haus, eigen], description: "WO die Säule laut BOX hängt (Cockpit Phase 1 / C1) - das IST. null = eine ältere Box meldet es nicht; das ist weder \"haus\" noch \"eigen\", denn erst eine Meldung belegt, dass die Unterscheidung dort angekommen ist. Was der KUNDE gewählt hat, steht in der Allowlist (charging-config) - Soll und Ist sind zwei Aussagen." }
        entityId: { type: string, format: uuid, nullable: true, description: "Die Komponente, die die Plattform für diese Säule komponiert hat." }
        reportedAt: { type: string, format: date-time }
        connectors:
          type: array
          items: { $ref: "#/components/schemas/ChargeConnector" }
    ChargeConnector:
      type: object
      description: >
        Ein Stecker: ein Fahrzeug, ein Anspruch auf das Budget. Ein nicht
        gemeldeter Messwert bleibt null, nie 0; ein Zustandswort außerhalb des
        OCPP-1.6-Vokabulars wird beim Ingest verworfen statt gespeichert.
      properties:
        connectorId: { type: integer }
        status: { type: string, nullable: true, enum: [Available, Preparing, Charging, SuspendedEVSE, SuspendedEV, Finishing, Reserved, Unavailable, Faulted] }
        charging: { type: boolean }
        allocatedKw: { type: number, nullable: true, description: "Was das Lastmanagement zugeteilt hat (0 = pausiert); null = nicht Teil der Entscheidung." }
        reason: { type: string, nullable: true, description: "Das Maschinenwort des Verteilers." }
        reasonText: { type: string, nullable: true, description: "Sein deutscher Satz, unverändert." }
        nextTurn: { type: string, format: date-time, nullable: true, description: "Geschätzter Termin des Wartenden; null = nichts behaupten." }
        powerKw: { type: number, nullable: true }
        energyKwh: { type: number, nullable: true }
        socPct: { type: number, nullable: true, description: "Der Fahrzeug-Ladestand, wenn die Säule ihn meldet (DC meist, AC praktisch nie)." }
        commandStatus: { type: string, nullable: true, description: "Die Antwort der Säule auf die letzte Grenze." }
        readback: { type: string, nullable: true, enum: [ok, abweichend, unbekannt], description: "Ein angenommener Befehl ist kein Befehl in Kraft." }
        readbackNote: { type: string, nullable: true }
        sessionSince: { type: string, format: date-time, nullable: true }
        sessionKwh: { type: number, nullable: true, description: "Die Bilanz DIESES Ladevorgangs (Cockpit Phase 1 / E2). energyKwh daneben ist ein KUMULATIVES Register - was in der laufenden Sitzung geflossen ist, weiss nur die Box (nur sie kennt den Registerstand bei StartTransaction). null = kein Ladevorgang / kein Register / ein rueckwaerts gesprungenes Register, nie eine erfundene 0." }
        meteredAt: { type: string, format: date-time, nullable: true, description: "Wann die Saeule zuletzt MeterValues gemeldet hat - das ALTER von powerKw/energyKwh/socPct. null = nie gemessen bzw. ein aelterer Edge-Stand; die Flaeche darf die Werte dann NICHT als aktuell ausgeben." }
    SupplyPrice:
      type: object
      description: >
        One Anlage's structured supply-price sheet (site_supply_price, report
        vp-nacht-bezug-e7 §3.1). Components ct/kWh NETTO, all nullable (null =
        unknown, contributes nothing).
      properties:
        present: { type: boolean, description: "A row exists (false => portal prefills suggestions)." }
        hasComponents: { type: boolean, description: "At least one component maintained (the activation gate)." }
        netzentgeltArbeitspreisCt: { type: number, nullable: true }
        stromsteuerCt: { type: number, nullable: true }
        konzessionsabgabeCt: { type: number, nullable: true }
        umlagenCt: { type: number, nullable: true, description: "KWKG + Offshore + section 19 StromNEV as ONE sum." }
        vertriebsaufschlagCt: { type: number, nullable: true }
        ustPct: { type: number, nullable: true, description: "USt on everything incl. spot; 0 for Vorsteuer-Abzug (C&I)." }
        komponentenStand: { type: string, format: date, nullable: true, description: "Preisblatt gültig ab." }
        updatedAt: { type: string, format: date-time, nullable: true }
    UsageProfile:
      type: object
      description: >
        AE7 Nutzungsprofil read-model (docs/contracts/v2/usage-profile.md): the
        effective usage profile, the derived default, the override, the emphasis
        map and the signals it was derived from.
      properties:
        usageProfile:
          type: string
          enum: [arbitrage, peak, private]
          description: The EFFECTIVE profile (override when set, else the derived default).
        derivedProfile:
          type: string
          enum: [arbitrage, peak, private]
          description: The derived default, ignoring any override.
        override:
          type: string
          nullable: true
          enum: [arbitrage, peak, private]
        emphasis:
          type: object
          description: Which surfaces are prominent | secondary | minimal | hidden.
          properties:
            money: { type: string, enum: [prominent, secondary, minimal, hidden] }
            peak: { type: string, enum: [prominent, secondary, minimal, hidden] }
            flow: { type: string, enum: [prominent, secondary, minimal, hidden] }
            devices: { type: string, enum: [prominent, secondary, minimal, hidden] }
        signals:
          type: object
          properties:
            hasStorage: { type: boolean }
            hasPv: { type: boolean }
            hasControllableConsumer: { type: boolean }
            activeStrategyNodeTypes:
              type: array
              items: { type: string, example: vp.strategy.market }
            plantKind: { type: string, nullable: true }
            hasLeistungspreis: { type: boolean }
    CockpitLayoutDocument:
      type: object
      description: >
        A layout document - INTENT only, never the rendered surface. Which
        Bausteine a plant actually has stays applications x capabilities and is
        derived on every render, which is why a document may name a Baustein
        that is currently absent: it is skipped silently and the preference
        survives switching the application back on.
      properties:
        version: { type: integer, example: 1 }
        order:
          type: array
          items: { type: string }
          description: >
            Bausteine in their order. UNNAMED Bausteine keep their CANONICAL
            position (not appended) - that is how a newly activated
            application's Baustein appears where it belongs.
        hidden:
          type: array
          items: { type: string }
          description: >
            Explicitly hidden. MANDATORY Bausteine (Status, Zustand) ignore it -
            a catalog property, not an admin's will (E2).
        shown:
          type: array
          items: { type: string }
          description: >
            Explicitly shown - takes back a LOWER layer's `hidden`, which is why
            it is not the same as "absent from hidden". Without it a customer
            could never undo their operator's Vorgabe.
        lead:
          type: string
          nullable: true
          description: The highlighted CockpitBlockId (peak-band, erloes-komposition, energiefluss, lade-budget).
        custom:
          type: array
          description: >
            The customer's OWN evaluations (Anwendungs-Programm Stufe 5). They
            are the only Bausteine a document DEFINES rather than merely names:
            each carries its key (`eigen:<id>`), which additionally appears in
            `order`/`hidden`. Only the `cockpit` surface of ONE plant may carry
            them (the portfolio hangs off the customer and has no single
            component to validate a channel against); at most 12 per plant.
            Server-side validation: the component must belong to this plant
            (RLS), it must actually report that channel, and the aggregate must
            be HONEST for that channel - `tagessumme` only on an energy channel
            (a kWh channel reports a METER READING, so its day figure is the
            ADVANCE), and `tagesmax`/`tagesmittel` never on one (the maximum of
            a counter is its closing reading, its mean is no statement). Each
            refusal is a 400 with a German reason and writes nothing. The rule
            lives in `cockpit/EigeneAuswertung` and is pinned against the portal
            twin by `docs/contracts/v2/eigene-auswertung-vectors.json`.
          items: { $ref: "#/components/schemas/EigeneAuswertungDefinition" }
    EigeneAuswertungDefinition:
      type: object
      required: [id, titel, darstellung, entityId, channel, aggregat]
      properties:
        id:
          type: string
          example: "eigen:a1b2c3"
          description: The Baustein key - `eigen:` plus lowercase letters, digits and hyphens.
        titel: { type: string, maxLength: 60, example: "Wärmepumpe heute" }
        darstellung:
          type: string
          enum: [kachel, chart]
          description: One number, or the day's curve with that number as its headline.
        entityId: { type: string, format: uuid, description: A component of THIS plant. }
        channel: { type: string, example: power_kw, description: A measure channel that component reports. }
        aggregat:
          type: string
          enum: [jetzt, tagessumme, tagesmax, tagesmittel]
    CockpitLayout:
      type: object
      description: >
        All layers separately + the Baustein catalog. The resolution
        (catalog -> preset -> Vorgabe -> Eigen) is a pure portal function.
      properties:
        surface: { type: string, enum: [cockpit, portfolio] }
        profil:
          type: string
          nullable: true
          enum: [privat, gewerbe]
          description: The plant's application preset - the base of the preset layer.
        presetLayout:
          allOf: [{ $ref: "#/components/schemas/CockpitLayoutDocument" }]
          nullable: true
          description: The preset layer straight from the catalog (never null in practice, possibly empty).
        tenantVorgabe:
          allOf: [{ $ref: "#/components/schemas/CockpitLayoutLayer" }]
          nullable: true
          description: The customer-wide Vorgabe (E1); a per-plant Vorgabe beats it.
        siteVorgabe:
          allOf: [{ $ref: "#/components/schemas/CockpitLayoutLayer" }]
          nullable: true
        eigen:
          allOf: [{ $ref: "#/components/schemas/CockpitLayoutLayer" }]
          nullable: true
          description: The customer's own arrangement - it WINS (E2).
        darfVorgabe:
          type: boolean
          description: True = this caller may write the `vorgabe` layer (platform-admin).
        bausteine:
          type: array
          description: The Baustein catalog of this surface - labels, the mandatory rule, lead capability.
          items:
            type: object
            properties:
              id: { type: string, example: kacheln }
              label: { type: string, example: Kennzahlen }
              pflicht: { type: boolean, description: "True = never hideable (Status, Zustand)." }
              beweglich: { type: boolean, description: "False = stays at its canonical position (head, stage)." }
              leadBlock:
                type: string
                nullable: true
                description: The block this Baustein's star sets as lead; null = no star.
              beigesteuertVon:
                type: array
                items: { type: string }
                description: >
                  The applications contributing this Baustein - DERIVED from the
                  catalog, never a second list. Empty = base equipment.
        vorlagen:
          type: array
          description: >
            The KINDS of own evaluation this surface knows (Anwendungs-Programm
            Stufe 5) - catalog data, empty where there are none. A Vorlage is not
            renderable; only its instance in `document.custom` is.
          items:
            type: object
            properties:
              id: { type: string, example: eigene-kachel }
              label: { type: string, example: Eigene Kachel }
              satz: { type: string, nullable: true, description: ONE sentence - what this kind shows. }
              darstellung: { type: string, enum: [kachel, chart] }
              anwendung: { type: string, example: eigene-auswertung }
              nach:
                type: string
                nullable: true
                description: The Baustein an instance is canonically sorted behind.
    EigeneAuswertungWerte:
      type: object
      properties:
        at: { type: string, format: date }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        bucketMinutes: { type: integer, example: 15 }
        werte:
          type: array
          items:
            type: object
            properties:
              id: { type: string, example: "eigen:a1b2c3" }
              titel: { type: string }
              darstellung: { type: string, enum: [kachel, chart] }
              entityId: { type: string, format: uuid }
              channel: { type: string }
              aggregat: { type: string, enum: [jetzt, tagessumme, tagesmax, tagesmittel] }
              wert:
                type: number
                nullable: true
                description: The figure - null where there is none, NEVER a 0.
              kanalart:
                type: string
                nullable: true
                enum: [energie, leistung, anteil, messwert]
                description: >
                  What the channel measures - it tells the surface which unit and
                  which time reference are meant without parsing the channel name.
              komponente: { type: string, nullable: true, description: The component's name. }
              entityType: { type: string, nullable: true }
              hinweis:
                type: string
                nullable: true
                description: The honest German sentence when there is nothing to show.
              verlauf:
                type: array
                description: The day's buckets - filled for `chart` only (a tile shows ONE number).
                items:
                  type: object
                  properties:
                    start: { type: string, format: date-time }
                    avg: { type: number, nullable: true }
                    min: { type: number, nullable: true }
                    max: { type: number, nullable: true }
                    last: { type: number, nullable: true }
                    n: { type: integer }
    CockpitLayoutLayer:
      type: object
      properties:
        document: { $ref: "#/components/schemas/CockpitLayoutDocument" }
        updatedBy: { type: string, nullable: true, description: The writer's JWT subject (the paper trail). }
        updatedAt: { type: string, format: date-time, nullable: true }
    SiteProfiles:
      type: object
      description: >
        TWO lists over ONE computation: `profiles` is the shelf (the four
        Betriebsmodelle), `weitere` the applications hidden from it since
        Steuerung Stufe 0. Both carry the same card shape. `weitere` is
        ADDITIVE - an older client reads only `profiles`.
      properties:
        weitere:
          type: array
          description: >
            The applications that are NOT on the shelf (classes basis and
            regel). Hidden, never deleted: their states are still answered
            because surfaces outside the Steuerung read them. Same item shape as
            `profiles`.
          items:
            type: object
        profiles:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: marktvermarktung
                description: >
                  The application id - an OPEN vocabulary whose truth is the
                  data-driven catalog `anwendungen/catalog.json` (byte-identical
                  in the portal), NOT this schema: adding an application is
                  catalog data, never a contract release (the
                  `entitytypes/catalog.json` precedent). Today's SHELF is
                  marktvermarktung, lastspitzenkappung, atypische-netznutzung,
                  lastmanagement (catalog field `regal`); monitoring,
                  speicher-fahrplan, ueberschuss, verbraucher and
                  eigene-auswertung ride in `weitere`; reserved catalog entries
                  are never served.
              label: { type: string, description: Customer-facing German name. }
              state:
                type: string
                nullable: true
                enum: [an, aus]
                description: The STORED customer intent; null = derived default.
              derivedActive: { type: boolean, description: What the derivation alone says. }
              active: { type: boolean, description: Effective state after the intent overlay. }
              unlocks:
                type: object
                properties:
                  views: { type: array, items: { type: string } }
                  widgets: { type: array, items: { type: string } }
                  moneyStream: { type: string, nullable: true }
              requirements:
                type: array
                items:
                  type: object
                  properties:
                    label: { type: string }
                    met: { type: boolean }
                    art:
                      type: string
                      enum: [hardware, einstellung]
                      description: >
                        Steuerung Stufe 5, ADDITIVE. `hardware` = what the plant
                        must physically have; a missing one means the operating
                        model cannot run HERE at all (the surface files the card
                        under "Nicht moeglich auf dieser Anlage", with the
                        reason). `einstellung` = a value somebody enters - the
                        card stays, and the traffic light shows the WAY.
                    behebung:
                      type: object
                      nullable: true
                      description: >
                        Where the customer has to go for it; null = there is
                        nothing a click could solve, and no way is claimed.
                      properties:
                        ziel:
                          type: string
                          enum: [einstellungen, modell, ladepark, voltpilot]
                        label:
                          type: string
                          nullable: true
                          description: >
                            null for `voltpilot` - an admin-conditional value has
                            no button the customer could press; VoltPilot enters
                            it (concept 3.4).
              blockedReason:
                type: string
                nullable: true
                description: >
                  Honest German sentence for a switched-on profile that cannot
                  fully run yet. Never a request prompt.
              origin: { type: string, nullable: true, enum: [masterdata, flow] }
              flowRef:
                type: object
                nullable: true
                properties:
                  flowId: { type: string, format: uuid }
                  name: { type: string }
              gatedNodeTypes: { type: array, items: { type: string } }
              gatedNodesEnabled: { type: boolean }
              exklusivGruppe:
                type: string
                nullable: true
                example: speicher
                description: >
                  Steuerung Stufe 5, ADDITIVE. Two operating models of the SAME
                  group are never on together - the switch is a RADIO, and the
                  server enforces it on write (switching one on ends every other
                  of its group in the same transaction). Today's only group is
                  `speicher`: the three models with a `vp.strategy.*` node that
                  compete for the SAME battery. Ladepark-Lastmanagement has NO
                  group on purpose - it is protection, not market participation,
                  keeps guarding the connection on the box whatever a card says,
                  and is derived-active from a connected charge point. There is
                  deliberately NO DB check: an existing plant with two active
                  models keeps them until the customer chooses (Multi-Use is its
                  own concept).
              seit:
                type: string
                format: date-time
                nullable: true
                description: >
                  Since when it runs ("laeuft seit ..."), Steuerung Stufe 5,
                  ADDITIVE. Only ever PROVEN: it is the `site_profile_state`
                  row's `updated_at`, and that row exists only for an explicit
                  customer decision. null for a DERIVED-active model (no row -
                  every existing plant) and for a switched-off one; the surface
                  then says "laeuft" without a date instead of inventing one.
    FlowNodeGovernance:
      type: object
      description: AE7 node governance - the gated strategy node types + per-site enablement.
      properties:
        gatedNodes:
          type: array
          items:
            type: object
            properties:
              type: { type: string, example: vp.strategy.market }
              label: { type: string, example: Marktoptimierung }
              gated: { type: boolean }
              enabled: { type: boolean, description: Enabled for THIS site. }
    FlowLayout:
      type: object
      description: >
        Portal v3 M5 - the editor canvas positions of a flow, stored OUTSIDE the
        hashed flow document (a dragged position must never change content_hash).
      properties:
        positions:
          type: object
          additionalProperties:
            type: object
            properties:
              x: { type: number }
              y: { type: number }
          description: node id -> {x, y} in canvas coordinates.
    FlowLiveStatus:
      type: object
      description: >
        Portal v3 M5 - what the DEVICE reports about a site's flows. Read-only.
      properties:
        acks:
          type: array
          description: One deployment ack per flow the device runs.
          items:
            type: object
            properties:
              flowId: { type: string, format: uuid }
              flowVersion: { type: integer }
              contentHash: { type: string, nullable: true }
              state: { type: string, enum: [active, error, unsupported] }
              detail: { type: string, nullable: true }
              reportedAt: { type: string, format: date-time, nullable: true }
        nodes:
          type: array
          description: >
            The per-node live states. EMPTY when the device does not send the
            feature-flagged block - the editor then shows channel values only,
            never a guessed node state.
          items:
            type: object
            properties:
              flowId: { type: string, format: uuid }
              nodeId: { type: string }
              state: { type: string, enum: [active, idle, error] }
              text: { type: string, nullable: true }
              since: { type: string, format: date-time, nullable: true }
    AutoStartOutcome:
      type: object
      description: Result of an AE7 auto-start seeding attempt.
      properties:
        created: { type: boolean }
        reason:
          type: string
          nullable: true
          description: null on success; already_has_flow | no_battery | not_found otherwise.
        profile: { type: string, nullable: true, enum: [arbitrage, peak, private] }
        flowId: { type: string, format: uuid, nullable: true }
        version: { type: integer, nullable: true }
        name: { type: string, nullable: true }
        message: { type: string }
    TopologyResponse:
      type: object
      description: >
        Anlagen-Topologie-Read-Model (AE1): the entity graph + the server-derived
        hub topology. See docs/contracts/v2/topology-read-model.md.
      properties:
        schemaVersion: { type: string, example: "1.0" }
        entities:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              entityType: { type: string, example: battery-hybrid }
              typeLabel: { type: string, example: "Batteriespeicher (Hybrid)" }
              label: { type: string, nullable: true }
              category: { type: string, example: storage, description: storage | producer | meter | consumer }
              health: { type: string, enum: [ok, stale, never] }
              capabilities:
                type: array
                items:
                  type: object
                  properties:
                    channel: { type: string, example: pv_power_kw }
                    unit: { type: string, nullable: true, example: kW }
                    role: { type: string, nullable: true, description: "pv | storage | grid | consumer; null = informational." }
                    primary: { type: boolean, description: The maßgebliche member of its role. }
                    value: { type: number, nullable: true, description: "Latest live value; null = unknown (never a fabricated 0)." }
        topology:
          type: object
          description: The role-grouped hub topology (the shared Go/TS/Java derivation output).
          properties:
            schema_version: { type: string, example: "1.0" }
            nodes:
              type: array
              items:
                type: object
                properties:
                  role: { type: string, enum: [pv, storage, consumer, grid] }
                  value_kw: { type: number, description: "Display magnitude (>=0); omitted when unknown." }
                  soc_pct: { type: number, description: "Storage only; omitted otherwise/when unknown." }
                  soc_source:
                    type: object
                    description: >
                      WHICH entity supplied `soc_pct` (P6 Speiser-Bindung).
                      Present whenever `soc_pct` is. It need not be the device
                      whose kilowatts the node carries: an explicitly bound
                      self-connected battery supplies the state of charge while
                      the hybrid inverter keeps measuring the power - which is
                      what lets a surface say "Ladestand von: <Batterie>"
                      instead of printing a percentage nobody stands behind.
                    properties:
                      entity_id: { type: string }
                      label: { type: string }
                  limits:
                    type: object
                    description: >
                      What the storage node's BMS currently permits (P6).
                      Omitted when nobody reports a limit - true for every
                      battery read through a catalogue driver. Every field is
                      optional: an unmapped or silent channel is ABSENT, never a
                      fabricated 0 (which on a limit would read as "charging
                      forbidden") and never a fabricated true. All fields come
                      from the ONE entity named in `source`.
                    properties:
                      source:
                        type: object
                        properties:
                          entity_id: { type: string }
                          label: { type: string }
                      charge_limit_a: { type: number }
                      discharge_limit_a: { type: number }
                      charge_allowed: { type: boolean }
                      discharge_allowed: { type: boolean }
                  flow_active: { type: boolean }
                  direction: { type: string, enum: [in, out], description: "node->hub (in) / hub->node (out); omitted when idle." }
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        entity_id: { type: string }
                        label: { type: string }
                        primary: { type: boolean }
                        value_kw: { type: number, description: "Raw signed contribution; omitted when unknown." }
    History:
      type: object
      properties:
        range: { type: string, enum: [day, week, month, year] }
        from: { type: string, format: date-time, description: Period start (inclusive). }
        to: { type: string, format: date-time, description: Period end (exclusive). }
        bucketMinutes: { type: integer, description: "15 (day), 60 (week) or 1440 (month/year)." }
        buckets:
          type: array
          items:
            type: object
            properties:
              start: { type: string, format: date-time }
              pvKwh: { type: number, nullable: true }
              loadKwh: { type: number, nullable: true }
              gridImportKwh: { type: number, nullable: true }
              gridExportKwh: { type: number, nullable: true }
              batteryChargeKwh: { type: number, nullable: true, description: Derived from the telemetry power balance. }
              batteryDischargeKwh: { type: number, nullable: true }
              socMinPct: { type: number, nullable: true }
              socMaxPct: { type: number, nullable: true }
              socLastPct: { type: number, nullable: true }
              priceEurMwh: { type: number, nullable: true, description: Day-ahead price of the slot (day range only). }
              costEur: { type: number, nullable: true, description: Import energy x matching day-ahead price. }
        totals:
          type: object
          properties:
            consumptionKwh: { type: number, nullable: true, description: Null when no bucket carried the channel (0-bucket period) - never a fabricated 0. }
            pvGenerationKwh: { type: number, nullable: true, description: Null when no bucket carried the channel. }
            gridImportKwh: { type: number, nullable: true, description: Null when no bucket carried the channel. }
            gridExportKwh: { type: number, nullable: true, description: Null when no bucket carried the channel. }
            gridCostEur: { type: number, nullable: true, description: "Import energy x the slot's real supply price - the SAME composition the optimizer plans with (flat tariff / spot + Aufschlag / (spot + Preisblatt-Komponenten) x (1+USt); bare spot without any price data, byte-identical to before). Valued at the CURRENTLY maintained tariff (no price-sheet history). Null when nothing is computable in the period. See tarifArt/tarifPriced for the labeling context." }
            tarifArt: { type: string, nullable: true, enum: [dynamisch, fest, ohne], description: "The site's configured tariff kind - labeling context for gridCostEur." }
            tarifPriced: { type: boolean, nullable: true, description: "Whether gridCostEur is valued beyond bare spot (tariff parameter, maintained Preisblatt, or the platform default-components flag): true = label 'bewertet zu Ihrem Stromtarif', false = 'zu Börsenpreisen'." }
            batterySavingsPlannedEur: { type: number, nullable: true, description: "EX-ANTE PLANNED savings from the persisted optimizer plans (latest run per slot); null where no plan exists. NOT measured money - the measured counterpart is savedEur on /earnings. Surfaces must say 'geplant'." }
            batterySavingsEur: { type: number, nullable: true, deprecated: true, description: Deprecated alias of batterySavingsPlannedEur (same value); kept one release. }
            steuerungPlannedEur: { type: number, nullable: true, description: "EX-ANTE PLANNED savings of the STEERING: sum(stur_cost_eur - cost_eur) over the same plan slots - what the plan earns against THE SAME BATTERY WITHOUT smart control (the stur self-consumption reference; measured twin: savedSteuerungEur on /sites/{id}/earnings). This is the customer-facing planned figure (Captain 04.09.2026); batterySavingsPlannedEur keeps answering the operator question. Null when even ONE covered slot carries no Messlatte (a run predating migration V20260867000000, or a site without battery master data) - a partial sum would describe a window nobody computed. By construction <= batterySavingsPlannedEur. Surfaces must say 'geplant'." }
            autarkiePct: { type: number, nullable: true, description: "(1 - grid import / consumption) x 100, clamped 0..100." }
            eigenverbrauchPct: { type: number, nullable: true, description: "(pv - grid export) / pv x 100, clamped 0..100." }
        protocol:
          type: array
          description: Tagesprotokoll (day range only, else empty).
          items:
            type: object
            properties:
              type: { type: string, enum: [batterie-laden, batterie-entladen, pv-spitze, preis-tief, preis-hoch] }
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
              text: { type: string, description: Plain-German event description. }
              energyKwh: { type: number, nullable: true }
              avgPriceEurMwh: { type: number, nullable: true }
              avoidedCostEur: { type: number, nullable: true }
              peakKw: { type: number, nullable: true }
        plan:
          type: array
          description: >
            Plan-vs-actual overlay (day range only, else empty): per 15-min slot
            the battery power/SoC of the latest persisted optimizer run.
          items:
            type: object
            properties:
              time: { type: string, format: date-time }
              batteryKw: { type: number, nullable: true, description: "+ = charge, - = discharge." }
              socPct: { type: number, nullable: true }
        coverage:
          nullable: true
          type: object
          description: >
            How completely the period is MEASURED (F4/P7) - from its own cheap
            min/max/count query on telemetry_rollup_15m, independent of the
            series. Counts QUARTER-HOURS (resolutionMinutes), not display
            buckets. Null when the site never measured a single quarter-hour
            (incl. a purely v2-native plant with no v1 rollup) - a surface must
            then claim no coverage at all. No percentage is served: the counts
            are the fact, the wording belongs to the client.
          properties:
            firstDataAt: { type: string, format: date-time, nullable: true, description: The site's earliest ever measured quarter-hour ("Daten ab …"). }
            lastDataAt: { type: string, format: date-time, nullable: true, description: The site's latest ever measured quarter-hour. }
            expectedFrom:
              type: string
              format: date-time
              description: >
                Start of the span the counters refer to - never before
                firstDataAt, so a calendar year of a plant commissioned in June
                is not reported as 45 % incomplete.
            expectedTo:
              type: string
              format: date-time
              description: >
                End (exclusive) of that span - never inside the running
                quarter-hour, and one rollup cadence (15 min) behind now, so a
                just-finished quarter is not reported as a gap.
            expectedBuckets: { type: integer, format: int64, description: Quarter-hours the span could have carried. }
            measuredBuckets: { type: integer, format: int64, description: Quarter-hours actually measured (capped at expectedBuckets - never over 100 %). }
            gaps: { type: integer, description: Contiguous missing runs inside the span, incl. its leading/trailing edge (0 = continuous). }
            resolutionMinutes: { type: integer, example: 15, description: Length of one counted unit. }
        events:
          type: array
          description: >
            The event track of the series (F6) - the NOTABLE things that explain
            an outlier, present in EVERY range (unlike `protocol`, which stays
            the day's ordinary events as a list). Windows are merged runs of
            quarter-hours; at most 20 windows per type (the longest first), and
            the coverage block still reports the true gap count. `text` carries
            the statement WITHOUT a time - the client puts the range-appropriate
            time in front. `end` is exclusive.

            netzgrenze is evaluated for day and week only (grid_limit_kw lives in
            the RAW telemetry, which the rollup cascade does not carry) - a
            client must SAY so rather than let a missing marker read as "no grid
            limit". abregelung comes from the persisted plans
            (`schedule.curtail_kw`), so its text says "eingeplant".
            abendverkauf is emitted for range=day only: the plan SOLD energy in
            the evening, told together with the night that followed (forecast vs
            measured load, an empty battery, the night's grid import). Every
            sentence is a persisted fact - a fact that is missing DROPS ITS
            SENTENCE instead of being estimated.
          items:
            type: object
            properties:
              type:
                type: string
                enum: [negativpreis, abregelung, netzgrenze, netzladen, abendverkauf, datenluecke, geraet-still]
              start: { type: string, format: date-time }
              end: { type: string, format: date-time, description: Exclusive. }
              text: { type: string, description: Plain-German statement without a time. }
    ForecastModelChoice:
      type: object
      description: >
        Der Zustand des PLATTFORMWEITEN Prognose-Schalters - die Vorgabe für
        jede Anlage ohne eigene Wahl (die anlagenbezogene Antwort ist
        SiteForecastModels). Die Tabelle dahinter ist append-only und damit
        zugleich das Audit-Journal.
      properties:
        kinds:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [load, pv] }
              activeModel: { type: string, example: load-xgb, description: Das Modell, dessen Prognosen der Optimierer konsumiert. }
              source:
                type: string
                enum: [portal, env]
                description: >
                  portal = jemand hat entschieden (eine Zeile in
                  forecast_model_choice); env = der ausgelieferte Vorgabewert.
                  Der Unterschied wird nie geraten.
              envDefault: { type: string, description: Was ohne Portal-Wahl gälte. }
              setByName: { type: string, nullable: true, description: "Anzeige-Name des Umstellers; null = nicht im Token (die Fläche sagt dann „von einem Portal-Admin\")." }
              setAt: { type: string, format: date-time, nullable: true, description: "null = nie umgestellt (Quelle env)." }
              selectable:
                type: array
                items: { type: string }
                description: Alle Modelle dieser Art - die wählbare Menge.
        history:
          type: array
          description: Die Umstellungen, NEUESTE zuerst (append-only).
          items:
            type: object
            properties:
              kind: { type: string, enum: [load, pv] }
              model: { type: string }
              previousModel: { type: string, nullable: true, description: "null = die erste Umstellung dieser Art." }
              setByName: { type: string, nullable: true }
              setAt: { type: string, format: date-time }
    SiteForecastModels:
      type: object
      description: >
        Der Zustand des Prognose-Schalters EINER Anlage (Migration
        V20260826000000). Die Tabelle dahinter ist append-only und damit
        zugleich das Audit-Journal dieser Anlage.
      properties:
        siteId: { type: string, format: uuid }
        kinds:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [load, pv] }
              activeModel: { type: string, example: load-xgb, description: Das Modell, dessen Prognosen der Optimierer FÜR DIESE ANLAGE konsumiert. }
              source:
                type: string
                enum: [anlage, plattform, env]
                description: >
                  anlage = jemand hat das für DIESE Anlage entschieden (eine
                  Zeile in site_forecast_model_choice); plattform = sie folgt
                  der Vorgabe von VoltPilot; env = dem ausgelieferten
                  Standardmodell. Der Unterschied wird nie geraten.
              platformDefault: { type: string, description: Was ohne eigene Wahl DIESER Anlage gälte. }
              envDefault: { type: string, description: Was ohne jede Portal-Wahl gälte. }
              setByName: { type: string, nullable: true, description: "Anzeige-Name des Umstellers; null = nicht im Token (die Fläche sagt dann „im Portal umgestellt\")." }
              setAt: { type: string, format: date-time, nullable: true, description: "null = für diese Anlage nie umgestellt." }
              selectable:
                type: array
                items: { type: string }
                description: Alle Modelle dieser Art - die wählbare Menge.
        history:
          type: array
          description: Die Umstellungen DIESER Anlage, NEUESTE zuerst (append-only).
          items:
            type: object
            properties:
              kind: { type: string, enum: [load, pv] }
              model: { type: string }
              previousModel: { type: string, nullable: true, description: "null = die erste Umstellung dieser Anlage und Art." }
              setByName: { type: string, nullable: true }
              setAt: { type: string, format: date-time }
    ForecastQuality:
      type: object
      description: >
        Shadow-mode forecast transparency for one site. Model ids are the
        registry vocabulary: load-persistence / pv-physical (baselines),
        load-xgb / pv-residual-xgb (challengers).
      properties:
        activeLoadModel: { type: string, example: load-persistence, description: The model whose load forecasts the optimizer consumes. }
        activePvModel: { type: string, example: pv-physical }
        models:
          type: array
          description: Lifecycle of every model that has run on this site.
          items:
            type: object
            properties:
              model: { type: string, example: load-xgb }
              kind: { type: string, enum: [load, pv] }
              status:
                type: string
                enum: [collecting, ready]
                description: "'collecting' = self-gate unmet, the challenger emits NO predictions yet."
              active: { type: boolean, description: Whether the optimizer consumes this model. }
              daysCollected: { type: integer, nullable: true }
              daysRequired: { type: integer, nullable: true, description: Training-day gate (default 21). }
              trainedAt: { type: string, format: date-time, nullable: true }
              trainRows: { type: integer, nullable: true }
              featureImportance:
                type: array
                description: Top features of the last training run, most important first.
                items:
                  type: object
                  properties:
                    feature: { type: string, example: lag_1d_kw }
                    label: { type: string, example: Verbrauch gestern zur gleichen Zeit, description: Plain-German label. }
                    weight: { type: number, description: Normalized share of total gain, 0..1. }
              updatedAt: { type: string, format: date-time }
        accuracy:
          type: array
          description: Daily forecast-vs-actual metrics per model (Europe/Berlin days).
          items:
            type: object
            properties:
              day: { type: string, format: date }
              model: { type: string }
              kind: { type: string, enum: [load, pv] }
              maeKw: { type: number, description: Mean absolute error over the day's evaluated 15-min slots. }
              nmaePct: { type: number, nullable: true, description: MAE / mean absolute actual x 100; null on all-zero days. }
              biasKw: { type: number, nullable: true, description: Mean signed error (forecast - actual). }
              skillVsBaseline: { type: number, nullable: true, description: "1 - mae/mae_reference; positive = better than the ACTIVE model of that kind; null for the reference itself. (While nothing is promoted the active model IS the baseline, so the numbers are unchanged; after a promotion the roles swap.)" }
              nSlots: { type: integer }
        planAccuracy:
          type: array
          description: Daily plan-vs-actual economics of the optimizer's persisted plans.
          items:
            type: object
            properties:
              day: { type: string, format: date }
              plannedCostEur: { type: number, nullable: true }
              baselineCostEur: { type: number, nullable: true, description: Projected cost with the battery idle. }
              realizedCostEur: { type: number, nullable: true, description: Actual signed grid cost (telemetry x price). }
              nSlots: { type: integer }
    SiteKpis:
      type: object
      properties:
        siteId: { type: string, format: uuid }
        selfConsumptionPct: { type: number }
        estimatedSavingsEur: { type: number }
        window: { type: string, example: last_30_days }
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        segment: { type: string, enum: [CI, B2C], example: CI }
        plan: { type: string, example: mvp }
        betriebsart:
          type: string
          enum: [endkunde, betreiber]
          nullable: true
          description: >
            The explicit U0 shell-frame override; null = automatic (the portal
            derives the shell from the site count).
        betriebsartEffective:
          type: string
          enum: [endkunde, betreiber]
          nullable: true
          description: >
            The resolved Betriebsart the portal shell keys on - the override
            when set, else null = unknown (never segment-derived).
        createdAt: { type: string, format: date-time }
    TenantContext:
      type: object
      description: >
        The caller's tenant as the portal's login bootstrap reads it.
        `betriebsart` is the EFFECTIVE shell frame (the override when set, else
        null = unknown) - resolved server-side in the one authoritative place.
      properties:
        tenantId: { type: string, format: uuid }
        name: { type: string }
        segment: { type: string, enum: [CI, B2C] }
        betriebsart: { type: string, enum: [endkunde, betreiber], nullable: true }
    Unternehmen:
      type: object
      description: >
        GET /api/v1/unternehmen (UEMS AP-02 IP-3). Zahlen gelten heute.
        `zustand` = `nicht_angelegt` für einen Kundenbereich ohne Unternehmen-Zeile:
        dann sind id, name, kurzname und zeitzone null (nie erfunden).
      required: [zustand, standortZahl, anlagenZahl, nochNichtZugeordnetZahl]
      properties:
        zustand: { type: string, enum: [angelegt, nicht_angelegt] }
        id: { type: string, format: uuid, nullable: true }
        name: { type: string, nullable: true, example: Kunststoffwerk Ahrenberg GmbH }
        kurzname: { type: string, nullable: true, example: Ahrenberg }
        zeitzone:
          type: string
          nullable: true
          enum: [Europe/Berlin, Europe/Vienna, Europe/Zurich]
        standortZahl:
          type: integer
          description: Standorte, die es heute gibt (archivierte zählen nicht).
        anlagenZahl: { type: integer, description: Anlagen des Kundenbereichs. }
        nochNichtZugeordnetZahl:
          type: integer
          description: Anlagen, die heute keinem Standort zugeordnet sind.
        sitz:
          nullable: true
          description: Der Sitz (additiv, IP-4) - null, wenn kein Feld angegeben ist; nur Anzeige und Berichtskopf.
          allOf: [{ $ref: "#/components/schemas/StandortAdresse" }]
        rechtsform: { type: string, nullable: true, example: GmbH, description: "Additiv (IP-4)." }
    UnternehmenBearbeiten:
      type: object
      description: >
        PUT /api/v1/unternehmen (UEMS AP-02 IP-4) - die ganze Menge; ein
        fehlendes Feld ist leer. Eine PLZ braucht ihr Land (DE fünf-, AT/CH
        vierstellig).
      required: [name, zeitzone]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kurzname: { type: string, nullable: true, maxLength: 24 }
        zeitzone: { type: string, enum: [Europe/Berlin, Europe/Vienna, Europe/Zurich] }
        sitz:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/StandortAdresse" }]
        rechtsform: { type: string, nullable: true, maxLength: 40 }
    StandortStammdaten:
      type: object
      description: >
        POST und PUT /api/v1/standorte (UEMS AP-02 IP-4) - die Stammdaten (§4.1).
        POST: `kurzzeichen` optional (fehlt: automatisch ST-n), `zeitzone`
        optional (fehlt: die Vorgabe des Unternehmens), die Adresse Pflicht
        (Straße, Ort, Land; PLZ optional). PUT: die ganze Menge, `kurzzeichen`
        und `zeitzone` Pflicht, die Adresse nur außerhalb des Entwurfs.
        `nutzung` sind Codes des geschlossenen Vokabulars (E4), jede höchstens
        einmal, die erste ist die Hauptnutzung. Die Bezugsfläche (IP-5) und die
        Anlagen-Zuordnung (IP-11) haben eigene Routen - hier sind sie 400.
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120, example: Werk Ahrenberg }
        kurzzeichen: { type: string, nullable: true, maxLength: 24, example: ST-1 }
        adresse:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/StandortAdresse" }]
        zeitzone: { type: string, nullable: true, enum: [Europe/Berlin, Europe/Vienna, Europe/Zurich] }
        nutzung:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/Nutzung" }
        notiz: { type: string, nullable: true, maxLength: 500 }
        lage:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/StandortLage" }]
    StandortWiederherstellen:
      type: object
      description: Optional ein neuer Name - das Umbenennen im selben Dialog, wenn der alte inzwischen vergeben ist.
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    StandortKurzzeichenVorschlag:
      type: object
      properties:
        kurzzeichen: { type: string, example: ST-3 }
    Nutzung:
      type: string
      description: AP-02 E4 - Code = Kundenwort in Kleinbuchstaben, ä→ae, ö→oe, ü→ue, ß→ss.
      enum: [produktion, montage, lager, logistik, buero, technik, aussenflaeche, werkstatt, labor,
             verkauf, sozialraeume, sonstiges]
    StandortLage:
      type: object
      description: Die Lage auf der Karte - beide Koordinaten oder keine (W4).
      properties:
        breitengrad: { type: number, minimum: -90, maximum: 90, example: 48.25 }
        laengengrad: { type: number, minimum: -180, maximum: 180, example: 11.43 }
    OrtFehler:
      type: object
      description: >
        Die Ablehnung der Ortsstruktur-Schreibrouten (UEMS AP-02 IP-4). Fakten
        je Code: `anfrage_ungueltig` → `feld`; `name_belegt` und
        `kurzzeichen_belegt` → `verweis` (der Träger - bei Kurzzeichen auch
        `archiviert`, `frueher`, `heute`); `archiviert` → `archiviert_am`;
        `archivieren_gesperrt` → `gruende`; `wiederherstellen_gesperrt` →
        `grund` (nicht_archiviert | eltern_archiviert | name_belegt) und bei
        name_belegt `verweis`. Gebäude/Bereich (IP-5): die Gründe des
        Ortsbaum-Vertrags mit seinem Satz - `ziel_art_unzulaessig` (400),
        `ziel_gab_es_noch_nicht` (422), `ziel_archiviert` (409) → `feld`
        (elternId); `flaeche_ungueltig` und `gleiche_flaeche` (400),
        `gab_es_noch_nicht` (422), `archiviert` (409) an der Fläche → `feld`.
        Anlegen einer Anlage (`POST /api/v1/sites`, IP-9): `standort_waehlen`
        (422) → `feld` (standortId) und `standorte` (die Auswahl);
        `ziel_archiviert` (409) und `anfrage_ungueltig` (400) → `feld`.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [anfrage_ungueltig, nicht_gefunden, name_belegt, kurzzeichen_belegt, archiviert,
                 archivieren_gesperrt, wiederherstellen_gesperrt, ziel_art_unzulaessig,
                 ziel_gab_es_noch_nicht, ziel_archiviert, flaeche_ungueltig, gab_es_noch_nicht,
                 gleiche_flaeche, standort_waehlen]
        message: { type: string }
        feld: { type: string }
        verweis:
          type: object
          properties:
            objekt_art: { type: string, enum: [standort, gebaeude, bereich] }
            id: { type: string, format: uuid, nullable: true }
            kurzzeichen: { type: string }
            name: { type: string, nullable: true }
            heute: { type: string, nullable: true, description: Das heutige Kurzzeichen des Trägers. }
            archiviert: { type: boolean }
            frueher: { type: boolean }
        archiviert_am: { type: string, format: date-time, nullable: true }
        grund: { type: string, enum: [nicht_archiviert, eltern_archiviert, name_belegt] }
        gruende:
          type: array
          items: { $ref: "#/components/schemas/ArchivSperrgrund" }
        standorte:
          type: array
          description: Nur bei `standort_waehlen` - die nicht archivierten Standorte zur Wahl.
          items:
            type: object
            required: [id, kurzzeichen, name]
            properties:
              id: { type: string, format: uuid }
              kurzzeichen: { type: string }
              name: { type: string }
    ArchivSperrgrund:
      type: object
      description: >
        Ein Sperrgrund beim Archivieren, in der festen Reihenfolge des Vertrags
        (docs/contracts/v2/ortsbaum-vectors.json `gruende_archivieren`).
        `kennzeichen` ist das Kurzzeichen eines Orts bzw. das Kennzeichen einer
        Messstelle; eine Anlage nennt ihre `id`. `weg` ist der Weg als Code.
      properties:
        art:
          type: string
          enum: [gab_es_noch_nicht, archiviert, anlage_aktiv, messstelle_aktiv, geplante_zuordnung]
        objekt: { type: string, enum: [anlage, messstelle, standort, gebaeude, bereich] }
        id: { type: string, format: uuid, nullable: true }
        kennzeichen: { type: string, nullable: true }
        name: { type: string }
        ab: { type: string, format: date, description: Nur bei geplante_zuordnung. }
        eltern: { type: string, description: Nur bei geplante_zuordnung - wohin. }
        weg:
          type: string
          nullable: true
          enum: [anlage_zuordnen, messstelle_umziehen, zuordnung_aufheben, null]
    StandorteAmStichtag:
      type: object
      description: >
        GET /api/v1/standorte (UEMS AP-02 IP-3). Additiv vorgesehen:
        `teilansicht {sichtbar, gesamt}` (AP-03 IP-10).
      required: [stichtag, standorte, nichtGezeigt]
      properties:
        stichtag: { type: string, format: date }
        standorte:
          type: array
          description: Die Standorte, die es am Stichtag gab, in der Reihenfolge des Anlegens.
          items: { $ref: "#/components/schemas/StandortAmStichtag" }
        nichtGezeigt:
          type: array
          description: >
            Standorte, die es am Stichtag noch nicht gab oder die archiviert
            waren - mit `bestand` und `bestandText`
            ("Am 15.09.2026 gab es Werk Ahrenberg im Portal noch nicht.").
          items: { $ref: "#/components/schemas/StandortAmStichtag" }
        nochNichtZugeordnet:
          nullable: true
          description: >
            Die Gruppe "Noch nicht zugeordnet" - null, sobald jede Anlage am
            Stichtag einem Standort zugeordnet ist (kein "0 nicht zugeordnet", A15).
          allOf: [{ $ref: "#/components/schemas/NochNichtZugeordnet" }]
    StandortAmStichtag:
      type: object
      description: >
        Ein Standort zum Stichtag. Zeitgültig sind `bestand`, `anlagen`,
        die Zahlen und die Fläche; Name, Adresse, Zeitzone, Zustand und
        `esFehlt` sind einfache Felder und stehen wie heute. Ohne Bestand am
        Stichtag: `anlagen` leer, Zahlen und Fläche null - nie eine 0.
      properties:
        id: { type: string, format: uuid }
        kurzzeichen: { type: string, example: ST-1 }
        name: { type: string, example: Werk Ahrenberg }
        adresse:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/StandortAdresse" }]
        zeitzone: { type: string, enum: [Europe/Berlin, Europe/Vienna, Europe/Zurich] }
        zustand: { type: string, enum: [entwurf, eingerichtet, aktiv, archiviert] }
        esFehlt:
          type: array
          description: >
            Was einem Entwurf zum Einrichten fehlt ("Noch nicht eingerichtet -
            es fehlt: Adresse"); leer außerhalb des Entwurfs.
          items: { type: string, enum: [adresse] }
        bestand: { type: string, enum: [vorhanden, gab_es_noch_nicht, archiviert] }
        bestandText:
          type: string
          nullable: true
          description: Der Satz zum Bestand, nur wenn nicht `vorhanden`.
        anlagen:
          type: array
          items: { $ref: "#/components/schemas/StandortAnlage" }
        anlagenZahl: { type: integer, nullable: true }
        gebaeudeZahl: { type: integer, nullable: true }
        bereichZahl: { type: integer, nullable: true }
        flaecheM2:
          type: integer
          nullable: true
          description: >
            Die eigene Bezugsfläche des Standorts, sonst die Summe seiner
            Gebäude - nur, wenn jedes Gebäude eine hat; null, wenn keine da
            ist (nie 0; Bereiche werden nie addiert).
        flaecheQuelle:
          type: string
          nullable: true
          enum: [eigen, aus_gebaeuden_summiert]
        nutzung:
          type: array
          nullable: true
          description: Additiv (IP-4) - Codes, die erste ist die Hauptnutzung; null = nichts gewählt.
          items: { $ref: "#/components/schemas/Nutzung" }
        notiz: { type: string, nullable: true, description: "Additiv (IP-4)." }
        lage:
          nullable: true
          description: Additiv (IP-4).
          allOf: [{ $ref: "#/components/schemas/StandortLage" }]
        archiviertAm:
          type: string
          format: date-time
          nullable: true
          description: Additiv (IP-4) - wann er archiviert wurde; null, solange er es nicht ist.
    OrtsbaumAmStichtag:
      type: object
      description: >
        GET /api/v1/standorte/{id}/orte (UEMS AP-02 IP-5). Additiv vorgesehen:
        `teilansicht` (AP-03 IP-10).
      required: [stichtag, standort, gebaeudeOhneFlaeche, gebaeude]
      properties:
        stichtag: { type: string, format: date }
        standort: { $ref: "#/components/schemas/StandortAmStichtag" }
