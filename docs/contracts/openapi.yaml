          items:
            type: object
            properties:
              flowId: { type: string, format: uuid }
              nodeId: { type: string }
              state: { type: string, enum: [active, idle, error] }
              text: { type: string, nullable: true }
              since: { type: string, format: date-time, nullable: true }
    AutoStartOutcome:
      type: object
      description: Result of an AE7 auto-start seeding attempt.
      properties:
        created: { type: boolean }
        reason:
          type: string
          nullable: true
          description: null on success; already_has_flow | no_battery | not_found otherwise.
        profile: { type: string, nullable: true, enum: [arbitrage, peak, private] }
        flowId: { type: string, format: uuid, nullable: true }
        version: { type: integer, nullable: true }
        name: { type: string, nullable: true }
        message: { type: string }
    TopologyResponse:
      type: object
      description: >
        Anlagen-Topologie-Read-Model (AE1): the entity graph + the server-derived
        hub topology. See docs/contracts/v2/topology-read-model.md.
      properties:
        schemaVersion: { type: string, example: "1.0" }
        entities:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              entityType: { type: string, example: battery-hybrid }
              typeLabel: { type: string, example: "Batteriespeicher (Hybrid)" }
              label: { type: string, nullable: true }
              category: { type: string, example: storage, description: storage | producer | meter | consumer }
              health: { type: string, enum: [ok, stale, never] }
              capabilities:
                type: array
                items:
                  type: object
                  properties:
                    channel: { type: string, example: pv_power_kw }
                    unit: { type: string, nullable: true, example: kW }
                    role: { type: string, nullable: true, description: "pv | storage | grid | consumer; null = informational." }
                    primary: { type: boolean, description: The maßgebliche member of its role. }
                    value: { type: number, nullable: true, description: "Latest live value; null = unknown (never a fabricated 0)." }
        topology:
          type: object
          description: The role-grouped hub topology (the shared Go/TS/Java derivation output).
          properties:
            schema_version: { type: string, example: "1.0" }
            nodes:
              type: array
              items:
                type: object
                properties:
                  role: { type: string, enum: [pv, storage, consumer, grid] }
                  value_kw: { type: number, description: "Display magnitude (>=0); omitted when unknown." }
                  soc_pct: { type: number, description: "Storage only; omitted otherwise/when unknown." }
                  flow_active: { type: boolean }
                  direction: { type: string, enum: [in, out], description: "node->hub (in) / hub->node (out); omitted when idle." }
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        entity_id: { type: string }
                        label: { type: string }
                        primary: { type: boolean }
                        value_kw: { type: number, description: "Raw signed contribution; omitted when unknown." }
    History:
      type: object
      properties:
        range: { type: string, enum: [day, week, month, year] }
        from: { type: string, format: date-time, description: Period start (inclusive). }
        to: { type: string, format: date-time, description: Period end (exclusive). }
        bucketMinutes: { type: integer, description: "15 (day), 60 (week) or 1440 (month/year)." }
        buckets:
          type: array
          items:
            type: object
            properties:
              start: { type: string, format: date-time }
              pvKwh: { type: number, nullable: true }
              loadKwh: { type: number, nullable: true }
              gridImportKwh: { type: number, nullable: true }
              gridExportKwh: { type: number, nullable: true }
              batteryChargeKwh: { type: number, nullable: true, description: Derived from the telemetry power balance. }
              batteryDischargeKwh: { type: number, nullable: true }
              socMinPct: { type: number, nullable: true }
              socMaxPct: { type: number, nullable: true }
              socLastPct: { type: number, nullable: true }
              priceEurMwh: { type: number, nullable: true, description: Day-ahead price of the slot (day range only). }
              costEur: { type: number, nullable: true, description: Import energy x matching day-ahead price. }
        totals:
          type: object
          properties:
            consumptionKwh: { type: number, nullable: true, description: Null when no bucket carried the channel (0-bucket period) - never a fabricated 0. }
            pvGenerationKwh: { type: number, nullable: true, description: Null when no bucket carried the channel. }
            gridImportKwh: { type: number, nullable: true, description: Null when no bucket carried the channel. }
            gridExportKwh: { type: number, nullable: true, description: Null when no bucket carried the channel. }
            gridCostEur: { type: number, nullable: true, description: "Import energy x the slot's real supply price - the SAME composition the optimizer plans with (flat tariff / spot + Aufschlag / (spot + Preisblatt-Komponenten) x (1+USt); bare spot without any price data, byte-identical to before). Valued at the CURRENTLY maintained tariff (no price-sheet history). Null when nothing is computable in the period. See tarifArt/tarifPriced for the labeling context." }
            tarifArt: { type: string, nullable: true, enum: [dynamisch, fest, ohne], description: "The site's configured tariff kind - labeling context for gridCostEur." }
            tarifPriced: { type: boolean, nullable: true, description: "Whether gridCostEur is valued beyond bare spot (tariff parameter, maintained Preisblatt, or the platform default-components flag): true = label 'bewertet zu Ihrem Stromtarif', false = 'zu Börsenpreisen'." }
            batterySavingsPlannedEur: { type: number, nullable: true, description: "EX-ANTE PLANNED savings from the persisted optimizer plans (latest run per slot); null where no plan exists. NOT measured money - the measured counterpart is savedEur on /earnings. Surfaces must say 'geplant'." }
            batterySavingsEur: { type: number, nullable: true, deprecated: true, description: Deprecated alias of batterySavingsPlannedEur (same value); kept one release. }
            autarkiePct: { type: number, nullable: true, description: "(1 - grid import / consumption) x 100, clamped 0..100." }
            eigenverbrauchPct: { type: number, nullable: true, description: "(pv - grid export) / pv x 100, clamped 0..100." }
        protocol:
          type: array
          description: Tagesprotokoll (day range only, else empty).
          items:
            type: object
            properties:
              type: { type: string, enum: [batterie-laden, batterie-entladen, pv-spitze, preis-tief, preis-hoch] }
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
              text: { type: string, description: Plain-German event description. }
              energyKwh: { type: number, nullable: true }
              avgPriceEurMwh: { type: number, nullable: true }
              avoidedCostEur: { type: number, nullable: true }
              peakKw: { type: number, nullable: true }
        plan:
          type: array
          description: >
            Plan-vs-actual overlay (day range only, else empty): per 15-min slot
            the battery power/SoC of the latest persisted optimizer run.
          items:
            type: object
            properties:
              time: { type: string, format: date-time }
              batteryKw: { type: number, nullable: true, description: "+ = charge, - = discharge." }
              socPct: { type: number, nullable: true }
        coverage:
          nullable: true
          type: object
          description: >
            How completely the period is MEASURED (F4/P7) - from its own cheap
            min/max/count query on telemetry_rollup_15m, independent of the
            series. Counts QUARTER-HOURS (resolutionMinutes), not display
            buckets. Null when the site never measured a single quarter-hour
            (incl. a purely v2-native plant with no v1 rollup) - a surface must
            then claim no coverage at all. No percentage is served: the counts
            are the fact, the wording belongs to the client.
          properties:
            firstDataAt: { type: string, format: date-time, nullable: true, description: The site's earliest ever measured quarter-hour ("Daten ab …"). }
            lastDataAt: { type: string, format: date-time, nullable: true, description: The site's latest ever measured quarter-hour. }
            expectedFrom:
              type: string
              format: date-time
              description: >
                Start of the span the counters refer to - never before
                firstDataAt, so a calendar year of a plant commissioned in June
                is not reported as 45 % incomplete.
            expectedTo:
              type: string
              format: date-time
              description: >
                End (exclusive) of that span - never inside the running
                quarter-hour, and one rollup cadence (15 min) behind now, so a
                just-finished quarter is not reported as a gap.
            expectedBuckets: { type: integer, format: int64, description: Quarter-hours the span could have carried. }
            measuredBuckets: { type: integer, format: int64, description: Quarter-hours actually measured (capped at expectedBuckets - never over 100 %). }
            gaps: { type: integer, description: Contiguous missing runs inside the span, incl. its leading/trailing edge (0 = continuous). }
            resolutionMinutes: { type: integer, example: 15, description: Length of one counted unit. }
        events:
          type: array
          description: >
            The event track of the series (F6) - the NOTABLE things that explain
            an outlier, present in EVERY range (unlike `protocol`, which stays
            the day's ordinary events as a list). Windows are merged runs of
            quarter-hours; at most 20 windows per type (the longest first), and
            the coverage block still reports the true gap count. `text` carries
            the statement WITHOUT a time - the client puts the range-appropriate
            time in front. `end` is exclusive.

            netzgrenze is evaluated for day and week only (grid_limit_kw lives in
            the RAW telemetry, which the rollup cascade does not carry) - a
            client must SAY so rather than let a missing marker read as "no grid
            limit". abregelung comes from the persisted plans
            (`schedule.curtail_kw`), so its text says "eingeplant".
          items:
            type: object
            properties:
              type:
                type: string
                enum: [negativpreis, abregelung, netzgrenze, netzladen, datenluecke, geraet-still]
              start: { type: string, format: date-time }
              end: { type: string, format: date-time, description: Exclusive. }
              text: { type: string, description: Plain-German statement without a time. }
    ForecastQuality:
      type: object
      description: >
        Shadow-mode forecast transparency for one site. Model ids are the
        registry vocabulary: load-persistence / pv-physical (baselines),
        load-xgb / pv-residual-xgb (challengers).
      properties:
        activeLoadModel: { type: string, example: load-persistence, description: The model whose load forecasts the optimizer consumes. }
        activePvModel: { type: string, example: pv-physical }
        models:
          type: array
          description: Lifecycle of every model that has run on this site.
          items:
            type: object
            properties:
              model: { type: string, example: load-xgb }
              kind: { type: string, enum: [load, pv] }
              status:
                type: string
                enum: [collecting, ready]
                description: "'collecting' = self-gate unmet, the challenger emits NO predictions yet."
              active: { type: boolean, description: Whether the optimizer consumes this model. }
              daysCollected: { type: integer, nullable: true }
              daysRequired: { type: integer, nullable: true, description: Training-day gate (default 21). }
              trainedAt: { type: string, format: date-time, nullable: true }
              trainRows: { type: integer, nullable: true }
              featureImportance:
                type: array
                description: Top features of the last training run, most important first.
                items:
                  type: object
                  properties:
                    feature: { type: string, example: lag_1d_kw }
                    label: { type: string, example: Verbrauch gestern zur gleichen Zeit, description: Plain-German label. }
                    weight: { type: number, description: Normalized share of total gain, 0..1. }
              updatedAt: { type: string, format: date-time }
        accuracy:
          type: array
          description: Daily forecast-vs-actual metrics per model (Europe/Berlin days).
          items:
            type: object
            properties:
              day: { type: string, format: date }
              model: { type: string }
              kind: { type: string, enum: [load, pv] }
              maeKw: { type: number, description: Mean absolute error over the day's evaluated 15-min slots. }
              nmaePct: { type: number, nullable: true, description: MAE / mean absolute actual x 100; null on all-zero days. }
              biasKw: { type: number, nullable: true, description: Mean signed error (forecast - actual). }
              skillVsBaseline: { type: number, nullable: true, description: "1 - mae/mae_baseline; positive = better than the baseline; null for the baseline itself." }
              nSlots: { type: integer }
        planAccuracy:
          type: array
          description: Daily plan-vs-actual economics of the optimizer's persisted plans.
          items:
            type: object
            properties:
              day: { type: string, format: date }
              plannedCostEur: { type: number, nullable: true }
              baselineCostEur: { type: number, nullable: true, description: Projected cost with the battery idle. }
              realizedCostEur: { type: number, nullable: true, description: Actual signed grid cost (telemetry x price). }
              nSlots: { type: integer }
    SiteKpis:
      type: object
      properties:
        siteId: { type: string, format: uuid }
        selfConsumptionPct: { type: number }
        estimatedSavingsEur: { type: number }
        window: { type: string, example: last_30_days }
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        segment: { type: string, enum: [CI, B2C], example: CI }
        plan: { type: string, example: mvp }
        betriebsart:
          type: string
          enum: [endkunde, betreiber]
          nullable: true
          description: >
            The explicit U0 shell-frame override; null = automatic (the portal
            derives the shell from the site count).
        betriebsartEffective:
          type: string
          enum: [endkunde, betreiber]
          nullable: true
          description: >
            The resolved Betriebsart the portal shell keys on - the override
            when set, else null = unknown (never segment-derived).
        createdAt: { type: string, format: date-time }
    TenantContext:
      type: object
      description: >
        The caller's tenant as the portal's login bootstrap reads it.
        `betriebsart` is the EFFECTIVE shell frame (the override when set, else
        null = unknown) - resolved server-side in the one authoritative place.
      properties:
        tenantId: { type: string, format: uuid }
        name: { type: string }
        segment: { type: string, enum: [CI, B2C] }
        betriebsart: { type: string, enum: [endkunde, betreiber], nullable: true }
    CreateTenantRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        segment: { type: string, enum: [CI, B2C], description: "Defaults to 'CI'." }
    AdminUser:
      type: object
      properties:
        id: { type: string, description: Keycloak user id. }
        username: { type: string }
        email: { type: string, nullable: true }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        enabled: { type: boolean }
        tenantId: { type: string, format: uuid, nullable: true, description: From the user's tenant_id attribute. }
    CreateUserRequest:
      type: object
      required: [username]
      properties:
        username: { type: string }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        password: { type: string, description: Optional initial password. }
        temporaryPassword: { type: boolean, description: "If true, the user must change it at first login. Default false." }
    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8, maxLength: 128, description: The new password (same length rule as self-registration). }
        temporary: { type: boolean, description: "If true (default), the user must change it at next login." }
    UpdateTenantRequest:
      type: object
      required: [name]
      description: Same validation as CreateTenantRequest.
      properties:
        name: { type: string }
        segment: { type: string, enum: [CI, B2C], description: "Defaults to 'CI'." }
        betriebsart:
          type: string
          enum: [endkunde, betreiber]
          nullable: true
          description: >
            Full-representation U0 shell-frame override: 'endkunde'/'betreiber'
            set it, null (or omitted) clears it back to the automatic
            segment-derived default.
    DeleteTenantRequest:
      type: object
      required: [confirmName]
      properties:
        confirmName:
          type: string
          description: Must equal the tenant's exact name (type-to-confirm fat-finger protection).
    TenantOffboardingReport:
      type: object
      description: >
        What the offboarding removed. The database part is transactional
        (all-or-nothing); `failedUsers` lists Keycloak logins that could not be
        deleted and need manual cleanup.
      properties:
        tenantId: { type: string, format: uuid }
        tenantName: { type: string }
        deletedSites: { type: integer }
        deletedDevices: { type: integer }
        deletedTelemetryRows: { type: integer, format: int64 }
        deletedUsers:
          type: array
          items: { type: string }
        failedUsers:
          type: array
          items: { type: string }
    UpdateUserRequest:
      type: object
      description: Email/name only; the username is immutable.
      properties:
        email: { type: string, format: email, nullable: true }
        firstName: { type: string, nullable: true, maxLength: 120 }
        lastName: { type: string, nullable: true, maxLength: 120 }
    OptimizerDiagnostics:
      type: object
      description: >
        One persisted optimizer run with the per-slot euro decomposition (see
        the endpoint description). Run-level fields carry the "inputs at a
        glance" master data; `storedEnergyValueIsApproximation` is false when
        every rendered slot carries the optimizer-persisted EXACT
        stored-energy value (the run's SoC shadow price,
        schedule.stored_value_ct_kwh - Fahrplan-Warum), and true when any slot
        fell back to the forward best-use heuristic (pre-feature runs, explain
        layer off - the UI must label it then).
      properties:
        siteId: { type: string, format: uuid }
        planId: { type: string, format: uuid, nullable: true }
        generatedAt: { type: string, format: date-time, nullable: true, description: Null when the site has no plan yet. }
        slotMinutes: { type: integer, example: 15 }
        availableRuns:
          type: array
          items: { type: string, format: date-time }
          description: >
            The run timestamps (newest first) of ONE Europe/Berlin day - the
            `date` query param's day, else the shown run's day.
        availableRunsDate:
          type: string
          format: date
          nullable: true
          description: The Berlin day `availableRuns` covers; null without any plan.
        firstRunDate:
          type: string
          format: date
          nullable: true
          description: Berlin day of the site's OLDEST persisted run - lower bound for the date picker.
        lastRunDate:
          type: string
          format: date
          nullable: true
          description: Berlin day of the site's NEWEST persisted run - upper bound for the date picker.
        plantKind: { type: string, enum: [direktvermarktung, eigenverbrauch] }
        netzladenErlaubt: { type: boolean }
        tarifArt: { type: string, enum: [dynamisch, fest, ohne] }
        tarifParamCtKwh: { type: number, nullable: true }
        anzulegenderWertCtKwh: { type: number, nullable: true }
        backupReserveSocPct: { type: number, nullable: true }
        battery:
          type: object
          nullable: true
          description: Null for sites without a battery asset.
          properties:
            capacityKwh: { type: number, nullable: true }
            roundtripEfficiencyPct: { type: number, nullable: true }
            wearCostCtPerKwh: { type: number, description: The EFFECTIVE per-cycle wear rate. }
            wearCostSource: { type: string, enum: [asset, platform-default] }
            socMinPct: { type: number, description: Effective usable-band floor (override or 5). }
            socMaxPct: { type: number, description: Effective usable-band ceiling (override or 95). }
        activeLoadModel: { type: string }
        activePvModel: { type: string }
        storedEnergyValueIsApproximation: { type: boolean, example: false }
        slots:
          type: array
          items: { $ref: "#/components/schemas/OptimizerDiagnosticsSlot" }
    OptimizerDiagnosticsSlot:
      type: object
      description: >
        One 15-min plan slot: the persisted schedule columns plus the computed
        ct/kWh decomposition. Every computed field is null when honestly not
        computable for this slot (no persisted spot price, pre-P2 row without
        wear, battery-less site) - never a fabricated 0.
      properties:
        time: { type: string, format: date-time }
        batteryKw: { type: number, nullable: true, description: +charge / -discharge. }
        gridKw: { type: number, nullable: true, description: +import / -export. }
        socPct: { type: number, nullable: true }
        loadKw: { type: number, nullable: true }
        pvKw: { type: number, nullable: true }
        curtailKw: { type: number, nullable: true }
        costEur: { type: number, nullable: true }
        baselineCostEur: { type: number, nullable: true }
        wearCostEur: { type: number, nullable: true, description: The persisted P2 wear this slot spends. }
        solverPriceCtKwh: { type: number, nullable: true, description: The bare day-ahead spot price (schedule.price_eur_mwh / 10). }
        importPriceCtKwh: { type: number, nullable: true, description: Real cost of an imported kWh per the site's tariff. }
        exportValueCtKwh: { type: number, nullable: true, description: Real value of an exported kWh per the plant's remuneration. }
        wearCostCtKwh: { type: number, nullable: true, description: Derived wear rate per kWh of throughput (null for idle slots). }
        valueOfStoredEnergyCtKwh: { type: number, nullable: true, description: "The value of a stored kWh: the persisted EXACT SoC shadow price (Fahrplan-Warum) where the run carries it, else the forward best-use approximation (the run-level flag marks which)." }
        decisionLabel: { type: string, enum: [solarladen, netzladen, entladen, ruhe] }
        whyText: { type: string, description: One composed German sentence explaining the decision. }
        slotRole:
          type: string
          nullable: true
          description: >-
            Optimizer-persisted Fahrplan-Warum role (schedule.slot_role;
            vocabulary: warten | pv_speichern | guenstig_laden |
            eigenverbrauch | verkaufen | spitze_kappen | reserve_halten |
            abregeln, additively extensible). Null on pre-feature runs -
            decisionLabel stays the fallback.
        slotFlags:
          type: array
          nullable: true
          items: { type: string }
          description: >-
            Binding-constraint codes of the slot (schedule.slot_flags CSV,
            split): soc_max, soc_floor, reserve_backup, reserve_peak,
            charge_cap, discharge_cap, solar_only, grid_limit_14a,
            feed_in_cap, peak_defining, curtailing. Null = no binding
            recorded / pre-feature run.
    OptimizerConfig:
      type: object
      description: The optimizer knobs of one site (see the endpoint description).
      properties:
        siteId: { type: string, format: uuid }
        hasBattery: { type: boolean }
        defaults:
          type: object
          description: Platform-wide tunables (the optimizer's OPTIMIZER_* env; read-only).
          properties:
            wearCostCtPerKwh: { type: number, example: 4.0 }
            socMinPct: { type: number, example: 5 }
            socMaxPct: { type: number, example: 95 }
            terminalValueQuantile: { type: number, example: 0.3 }
            terminalValueCtPerKwh: { type: number, nullable: true, description: Null = derived per plan. }
        overrides:
          type: object
          description: The nullable per-site/per-asset columns (null = default applies).
          properties:
            wearCostCtPerKwh: { type: number, nullable: true }
            socMinPct: { type: number, nullable: true }
            socMaxPct: { type: number, nullable: true }
            backupReserveSocPct: { type: number, nullable: true }
        effective:
          type: object
          description: >
            What the optimizer resolves (override ?? default). Battery fields
            are null for battery-less sites; a null backupReserveSocPct means
            "no reserve" (the technical floor applies unchanged).
          properties:
            wearCostCtPerKwh: { type: number, nullable: true }
            socMinPct: { type: number, nullable: true }
            socMaxPct: { type: number, nullable: true }
            backupReserveSocPct: { type: number, nullable: true }
        peakShaving:
          type: object
          description: >
            The peak-shaving module (PS-1/PS-2, Lastspitzenkappung) - the ONE
            writable surface for it (captain decision: vertragsnahe Module
            richtet VoltPilot ein, nicht der Kunde). A non-null
            leistungspreisEurKw IS the module-active flag; the optimizer then
            prices the billing period's 15-min import peak economically
            (epigraph + peak_so_far anchor) and publishes the planned peak
            target to the edge. Echoed read-only on the customer Site.
          properties:
            leistungspreisEurKw:
              type: number
              nullable: true
              minimum: 0
              description: EUR per kW per billing period; null = module off.
            abrechnungLeistung:
              type: string
              enum: [jahr, monat]
              description: Billing period of the Leistungspreis (Europe/Berlin calendar).
            peakReserveSocPct:
              type: number
              nullable: true
              minimum: 0
              maximum: 100
              description: >
                Hard SoC floor reserved for out-of-horizon peaks; stacks with
                the backup reserve (highest absolute floor binds). null = none.
        site:
          type: object
          description: Read-only echo of the levers editable via PUT /api/v1/sites/{siteId}.
          properties:
            netzladenErlaubt: { type: boolean }
            plantKind: { type: string }
            tarifArt: { type: string }
            tarifParamCtKwh: { type: number, nullable: true }
            anzulegenderWertCtKwh: { type: number, nullable: true }
    UpdateOptimizerConfigRequest:
      type: object
      description: >
        Full-representation override write: a null/absent field clears that
        override back to the platform default. wearCostCtPerKwh/socMinPct/
        socMaxPct live on the battery asset (409 without one);
        backupReserveSocPct and the peak-shaving module fields on the site.
        A null/absent abrechnungLeistung resets to 'jahr' (the column default).
      properties:
        wearCostCtPerKwh: { type: number, nullable: true, minimum: 0 }
        socMinPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        socMaxPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        backupReserveSocPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        leistungspreisEurKw:
          type: number
          nullable: true
          minimum: 0
          description: PS-1 Leistungspreis (EUR/kW per billing period); null switches the module off.
        abrechnungLeistung:
          type: string
          nullable: true
          enum: [jahr, monat]
          description: Billing period; null resets to 'jahr'.
        peakReserveSocPct:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: PS-2 peak-shaving SoC reserve; null clears it.

    WhatIfRequest:
      type: object
      description: >
        The admin what-if knobs (§2.8/§4.3). Every field is OPTIONAL and absent
        means "leave this as the site has it" - never zero, which is what makes
        an empty body the meaningful "solve it as configured" baseline.
        `backupReserveSocPct: 0` IS "no reserve". Prices, forecasts, tariff,
        §14a and the feed-in cap are deliberately NOT overridable: they come
        from the real site, so a preview can never become a fantasy plant.
      properties:
        wearCostCtPerKwh: { type: number, nullable: true, minimum: 0, maximum: 100 }
        backupReserveSocPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        socMinPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        socMaxPct: { type: number, nullable: true, minimum: 0, maximum: 100 }
        netzladenErlaubt:
          type: boolean
          nullable: true
          description: Grid-charging posture to preview (EEG vs. merchant).
        horizonSlots:
          type: integer
          nullable: true
          minimum: 4
          maximum: 192
          description: Planning horizon in 15-min slots; absent = 96 (24 h).

    WhatIfResult:
      type: object
      description: >
        Two plans solved over ONE freshly gathered set of inputs, plus their
        delta. Nothing here was persisted or published.
      properties:
        siteId: { type: string, format: uuid }
        computedAt: { type: string, format: date-time }
        horizonSlots: { type: integer }
        slotMinutes: { type: integer, example: 15 }
        appliedOverrides:
          type: object
          description: Echo of the knobs that actually differed (untouched ones are absent).
          additionalProperties: true
        baseline: { $ref: "#/components/schemas/WhatIfPlan" }
        variant: { $ref: "#/components/schemas/WhatIfPlan" }
        delta:
          type: object
          description: >
            variant minus baseline per headline figure. A figure that is null
            on either side stays null - never read as a zero difference.
          additionalProperties: { type: number, nullable: true }

    WhatIfPlan:
      type: object
      description: >
        One ephemeral solve. Money follows the persisted schedule's discipline:
        savingsEur is GROSS of wear, wearCostEur is separate, netSavingsEur is
        the honest difference, and bankedValueEur prices what the plan carries
        into the next day at its own terminal value.
      properties:
        slotMinutes: { type: integer }
        costEur: { type: number, nullable: true }
        baselineCostEur: { type: number, nullable: true }
        savingsEur: { type: number, nullable: true }
        wearCostEur: { type: number, nullable: true }
        netSavingsEur: { type: number, nullable: true }
        terminalValueEurPerKwh: { type: number, nullable: true }
        bankedValueEur: { type: number, nullable: true }
        chargedKwh: { type: number, nullable: true }
        dischargedKwh: { type: number, nullable: true }
        gridImportKwh: { type: number, nullable: true }
        gridExportKwh: { type: number, nullable: true }
        curtailedKwh: { type: number, nullable: true }
        cycles: { type: number, nullable: true, description: Throughput / (2 x capacity). }
        socStartPct: { type: number, nullable: true }
        socEndPct: { type: number, nullable: true }
        peakTargetKw: { type: number, nullable: true }
        fallback14a:
          type: boolean
          description: True when the §14a cap had to be dropped as infeasible (advisory plan).
        knobs:
          type: object
          description: The knob values this solve actually used.
          properties:
            wearCostCtPerKwh: { type: number }
            backupReserveSocPct: { type: number, nullable: true }
            socMinPct: { type: number }
            socMaxPct: { type: number }
            netzladenErlaubt: { type: boolean }
        slots:
          type: array
          items:
            type: object
            properties:
              time: { type: string, format: date-time }
              batteryKw: { type: number, nullable: true, description: "+ charge / - discharge" }
              gridKw: { type: number, nullable: true, description: "+ import / - export" }
              socPct: { type: number, nullable: true }
              pvKw: { type: number, nullable: true }
              loadKw: { type: number, nullable: true }
              curtailKw: { type: number, nullable: true }
              priceEurMwh: { type: number, nullable: true }
              costEur: { type: number, nullable: true }
              baselineCostEur: { type: number, nullable: true }
              wearCostEur: { type: number, nullable: true }
              slotRole: { type: string, nullable: true }
