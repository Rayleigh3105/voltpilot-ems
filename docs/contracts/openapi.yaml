          items: { type: string, format: uuid }
        gebaeude:
          type: array
          description: Die Gebäude am Standort, in der Reihenfolge des Anlegens.
          items: { $ref: "#/components/schemas/OrtsbaumGebaeude" }
        direktAmStandort:
          nullable: true
          description: Was ohne Gebäude am Standort hängt - null, wenn es den Standort am Stichtag nicht gab.
          allOf: [{ $ref: "#/components/schemas/OrtsbaumDirektAmStandort" }]
    OrtsbaumGebaeude:
      type: object
      properties:
        id: { type: string, format: uuid }
        kurzzeichen: { type: string, example: G-2 }
