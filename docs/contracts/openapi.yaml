        art: { type: string, enum: [gebaeude, bereich] }
        kurzzeichen: { type: string, example: G-2 }
        name: { type: string, example: Halle 2 }
        nutzung: { type: array, nullable: true, description: "E4 - das erste Wort ist die Hauptnutzung; null = keine gewählt.", items: { $ref: "#/components/schemas/Nutzung" } }
        baujahr: { type: integer, nullable: true }
        notiz: { type: string, nullable: true }
        zustand: { type: string, enum: [entwurf, eingerichtet, aktiv, archiviert] }
        standortId: { type: string, format: uuid, nullable: true }
        zuordnungen:
          type: array
          items: { $ref: "#/components/schemas/OrtZuordnung" }
        flaechen:
          type: array
