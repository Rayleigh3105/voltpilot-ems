openapi: 3.1.0
info:
  title: Voltpilot-EMS Portal API
  version: 0.1.0-mvp
  description: >
    OpenAPI contract for the portal backend (Spring Boot). BINDING contract
    (architecture section 20 item 8). Covers the MVP portal surface: auth-guarded
    tenancy, device claiming, telemetry and schedule views, and economic KPIs
    (architecture section 4).


    Every non-system endpoint requires a Keycloak-issued Bearer JWT (realm
    `voltpilot`). The `tenant_id` claim scopes all data via Postgres
    Row-Level-Security - a caller only ever sees its own tenant's rows; another
    tenant's resources return 404 (not found) rather than 403. The
    sites/devices/telemetry/prices/weather/schedule and device-claim endpoints
    are implemented in services/api; KPIs remain a stub pending a later
    increment.
  contact:
    name: Voltpilot-EMS
servers:
  - url: http://localhost:8090
    description: Local dev (docker compose / `mvn spring-boot:run`)
security:
  - bearerAuth: []
tags:
  - name: system
  - name: registration
    description: >
      Public self-service registration: a new customer creates their own tenant
      and login in one step (no operator involved). Unauthenticated by design;
      can be disabled platform-wide via VOLTPILOT_REGISTRATION_ENABLED=false.
  - name: sites
  - name: devices
  - name: enrollment
    description: >
      First-boot device enrollment over HTTPS (the "kinderleicht" mTLS
      onboarding): a fresh edge device knows only its printed reference and the
      portal URL. It generates a keypair ON the device, uploads the CSR (the
      private key never travels), and polls for its certificate. Once the
      customer claims the reference in the portal, the poll returns a
      device-CA-signed client certificate - identity ENFORCED from the claim
      (CN=device_id, O=tenant_id, OU=site_id + SPIFFE URI SAN), never from the
      CSR - plus the CA and broker connection params for the mTLS listener
      (8883). Unauthenticated by design and strictly rate-limited; a pending
      reference answers exactly like an unknown one, so polling cannot
      enumerate refs. Polling etiquette for device agents: start at ~10 s
      intervals, back off to >= 60 s after the first minutes, and keep polling
      indefinitely (claiming may happen days after first boot); on 429 back
      off harder (>= 5 min). Disabled unless the deployment stages the device
      CA (VOLTPILOT_ENROLLMENT_ENABLED; see docker-compose.prod.yml).
  - name: telemetry
  - name: market
  - name: weather
  - name: schedules
  - name: history
  - name: registry
    description: >
      Optional MaStR "Anlage verknüpfen" step: look a unit up in the German
      Marktstammdatenregister (preview only), then persist the
      customer-confirmed values onto the site's assets. Tenant-scoped like all
      site endpoints (foreign site = 404 via RLS).
  - name: kpis
  - name: rules
    description: >
      Das Regel-Protokoll (Einheitsmodell Stufe 5b): der Verlaufsspeicher der
      Regeln einer Anlage. Die drei Momentaufnahmen-Tabellen des Herzschlags
      werden je Takt ersetzt - dieser Speicher haelt die WECHSEL fest und
      beantwortet damit "diese Regel hat heute 3x geschaltet". Kundendaten,
      also mandantenbezogen (RLS) und unter /sites/**, nicht unter /admin/**.
  - name: topology
    description: >
      Anlagen-Topologie-Read-Model (AE1, adaptive EMS-UI): the site as an
      entity graph aggregated into the role-grouped hub topology
      (PV-Erzeugung / Speicher / Netz / Verbraucher) + directed flows the
      adaptive energy-flow diagram renders. Each capability is assignable to a
      role (customer/admin); the maßgebliche grid measurement is markable.
      Tenant-scoped like every site endpoint (foreign site = 404 via RLS); the
      shared derivation is the Go/TS/Java twin
      (docs/contracts/v2/topology-read-model.md). Role ASSIGNMENT is
      platform-admin-only.
  - name: components
    description: >
      Der EINE Anlege-Weg (Einheitsmodell Stufe 1): a component is a TEMPLATE
      plus its connection plus a role, saved versioned on the customer's own
      plant. Tenant-fenced by RLS like every /sites/** route (foreign site =>
      404, never 403); admins reach any plant through the X-Tenant-Id switcher.
  - name: templates
    description: >
      Komponenten-VORLAGEN (Einheitsmodell Stufe 0a, "Vorlagen werden Daten"):
      the device catalog the LATER one-assistant renders its brand/model choice
      from. Read-only in this stage and consumed by NOTHING yet - the surfaces
      still render the edge-side Go catalog. Authenticated + tenant-agnostic
      (the register is global platform data like edge_release /
      provisioned_device, no tenant_id, no RLS); the fence is the ORIGIN filter -
      only `builtin` + `certified` are served, never a `custom` (private
      per-Anlage) template, which has no tenant fence until Stufe 3. Managing
      templates (create/version) is Stufe 6 and does not exist here.
  - name: profile
    description: >
      Nutzungsprofil / EMS-Modus (AE7, the second adaptation axis): the usage
      profile (arbitrage | peak | private) DERIVED from the site's strategy nodes
      + entity mix + money master data, driving the adaptive portal/edge EMPHASIS
      (money/peak/flow/devices). Explicitly overridable; ONE truth - not a
      competing concept (docs/contracts/v2/usage-profile.md). Tenant-scoped.
  - name: simulation
    description: >
      Ersparnis-Simulation: asynchronous what-if jobs over a full historical
      reference year (3 scenarios - ohne Speicher / Standard-Speicher /
      VoltPilot - plus a battery-size sweep and the Netzladen variant),
      computed by the internal simulation service with the UNCHANGED
      production optimizer. The customer route is tenant-scoped like every
      site endpoint (defaults from the site's master data, body fields
      override them, foreign site = 404 via RLS); the prospect route is
      platform-admin-only with explicit inputs and persists nothing (V1 is
      stateless - results live in the service's job cache for ~1 h).
  - name: consumer
    description: >
      Steuerbare Verbraucher (docs/verbrauchssteuerung.md): a Portal-User models,
      names and rule-configures a controllable consumer (Wallbox / Heizstab /
      Pumpe / generische Last) of THEIR OWN site. A consumer STAYS a v2 entity;
      these routes carry the extra master data (consumer_profile) + the
      declarative operating requirements (consumer_policy, contract
      docs/contracts/v2/consumer-policy.schema.json). Tenant-scoped like every
      site endpoint (foreign site = 404 via RLS; a body tenant_id/site_id is
      never trusted; the requested control kind is mapped onto the INTERSECTION
      of the device's reported capabilities, never widened). Increment 1 ships
      consumer-options + CRUD + policy GET/PUT only; a policy is stored as a
      DRAFT (no compiler / optimizer / edge command yet, so every surface reports
      "Steuerung noch nicht aktiviert").
  - name: probe
    description: >
      Probe-Kanal (Einheitsmodell Stufe 0b): a one-shot "read these registers on
      my plant, once" - the groundwork every live preview and connection test of
      the later component assistant will run on. The route publishes a
      NON-retained request on the device's own v2/probe topic (contract
      docs/contracts/mqtt-probe.schema.json), waits a few seconds for the
      answer on v2/probe-result and persists NOTHING. Tenant-scoped like every
      site endpoint (foreign site = 404 via RLS). It is a READ: the contract's
      reserved switch_test op belongs to the later release wizard and is
      refused by the box itself with an honest not_supported. Every rule that
      can stop a device from being touched - private target, expiry, rate
      limit - lives ON THE BOX, which is the only party that knows its own LAN.
  - name: flows
    description: >
      Customer flow editor (E3b "Kunden-Freigabe"): a Portal-User builds,
      validates, simulates, activates and deactivates the flows of THEIR OWN
      sites (tenant from the JWT, RLS-scoped; a Portal-Admin reaches any site via
      the X-Tenant-Id switcher). The lifecycle + gates are identical to the admin
      flow API (draft -> simulated -> active -> retired) and never relaxed for a
      customer: a flow carrying a GATED strategy node activates only after a
      Portal-Admin enables that node type for the site. Governance WRITE and the
      auto-start seed stay platform-admin-only (the admin flow API).
  - name: admin
    description: >
      Platform-admin API (Portal-Admins only). Every operation requires the
      `platform-admin` realm role and is refused with 403 for customer tokens
      (`operator`). These endpoints are cross-tenant by design and do NOT rely on
      the tenant_id claim / RLS; they use a dedicated admin database role and the
      Keycloak Admin API.
paths:
  /health:
    get:
      tags: [system]
      summary: Liveness/readiness (Spring Boot Actuator).
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: UP }
  /api/v1/registration:
    post:
      tags: [registration]
      summary: Self-register - create a tenant and its first login in one step.
      description: >
        The front door of customer onboarding. Creates a B2C tenant named after
        the customer and a Keycloak user (username = email, `tenant_id` attribute
        + customer role), so the standard OIDC + RLS spine isolates the new
        account exactly like operator-provisioned customers. If the user cannot
        be created (e.g. email already registered), the tenant is rolled back -
        no orphans. Implemented in services/api (RegistrationController).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationRequest" }
      responses:
        "201":
          description: Account created; the customer can now log in via OIDC.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationResponse" }
        "400": { description: Invalid input (blank name, invalid email, password shorter than 8 chars). }
        "409": { description: An account with this email already exists. }
        "429": { description: Too many registration attempts (sliding-window rate limit per client address plus a global cap; nothing was created). }
  /api/v1/enrollment/{ref}/csr:
    post:
      tags: [enrollment]
      summary: Upload the device-generated CSR for a reference (first boot).
      description: >
        Stores the pending CSR keyed by the canonical reference (trimmed;
        VP- sticker refs uppercased, exactly like the claim endpoint). The CSR
        must be a PEM PKCS#10 request, self-signed by the enclosed key (proof
        of possession), with an RSA >= 2048 or EC P-256/P-384 key; the subject
        it requests is irrelevant - issuance overrides it with the
        claim-derived identity. Sticker refs (VP-) must exist in the
        provisioned-device registry (422 otherwise). Idempotent per ref:
        re-POSTing replaces the pending CSR until a certificate is issued;
        afterwards the enrolled key is fixed (409) and re-keying goes through
        the operator (revoke + unclaim/re-claim). Implemented in services/api
        (EnrollmentController).
      security: []
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
          description: The device reference printed on the device (Edge-Referenz / sticker Geräte-ID).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentCsrRequest" }
      responses:
        "202":
          description: CSR stored; poll GET .../certificate until the ref is claimed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentPending" }
        "400": { description: Invalid reference, or the CSR is unparsable / badly signed / off key policy. }
        "409": { description: A certificate was already issued for this reference (the enrolled key is fixed). }
        "422": { description: Unknown sticker Geräte-ID (not in the provisioned-device registry). }
        "429": { description: Rate limit (per client address + global sliding window). Back off >= 5 min. }
  /api/v1/enrollment/{ref}/certificate:
    get:
      tags: [enrollment]
      summary: Poll for the issued device certificate (long-poll-friendly 404 while pending).
      description: >
        404 with body status=pending while the reference is unclaimed - and
        identically for a reference that was never enrolled (no enumeration).
        Once the reference is claimed in the portal, the response carries the
        CA-signed client certificate (subject CN=device_id, O=tenant_id,
        OU=site_id, SPIFFE URI SAN), the CA PEM to verify the broker, the
        broker host/port and the topic identity. The certificate stays
        retrievable for device retries (the private key is the secret and
        never left the device); the per-device broker ACL grant is written at
        issuance. Revocation stays the operator kill switch
        (tools/pki/voltpilot-ca.sh revoke - api-issued certs are recorded in
        the same CA database). After an unclaim the poll returns to pending;
        a re-claim re-issues against the stored CSR with the new identity.
      security: []
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Certificate issued (or re-fetched) - the device switches to mTLS operation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentCertificate" }
        "400": { description: Invalid reference. }
        "404":
          description: Pending (unclaimed ref, unknown ref, or no CSR yet - deliberately indistinguishable). Keep polling with backoff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentPending" }
        "429": { description: Rate limit. Back off >= 5 min. }
  /api/v1/tenant-context:
    get:
      tags: [sites]
      summary: The caller's tenant context (U0 login bootstrap).
      description: >
        The tenant half of the portal's login bootstrap (composition-driven UI
        overhaul, U0): the caller's tenant row with the EFFECTIVE Betriebsart
        ('endkunde' | 'betreiber') that picks the navigation shell - the
        explicit tenant.betriebsart override when set, else null = unknown
        (the portal then falls back to its site-count heuristic; the segment is
        deliberately NOT used). Derived in the api only; the portal never
        re-derives. RLS-scoped: a customer gets exactly their
        own tenant; a Portal-Admin gets the tenant selected via the X-Tenant-Id
        switcher, and without a selected tenant is default-deny -> 404.
      responses:
        "200":
          description: The caller's tenant context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantContext" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No tenant context (admin without a selected tenant). }
  /api/v1/overview:
    get:
      tags: [sites]
      summary: Tenant-wide fleet overview for the adaptive Uebersicht.
      description: >
        One aggregate for the portal's fleet mode (customers with several
        sites): per site the device status (liveness from each device's newest
        telemetry ARRIVAL, the store-and-forward rule), the newest live
        telemetry snapshot, and today's planned battery savings (ex-ante, from
        the persisted optimizer plans, Europe/Berlin day, latest run per slot);
        plus fleet totals and the fleet-wide per-day savings of the last 14
        Berlin days for the hero mini chart. RLS-scoped: the fleet is exactly
        the caller's tenant. Admins read another tenant's fleet via the
        X-Tenant-Id switcher.
      responses:
        "200":
          description: The caller's fleet overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/edge-versions:
    get:
      tags: [sites]
      summary: Reported edge software version per device (tenant-wide).
      description: >
        The `core_version` / `palette_version` each device reports in the
        `flows` block of its status heartbeat, persisted by the flow-status
        listener - the data behind the platform overview's "Edge-Stand" column.
        RLS-scoped like /overview (admins read another tenant's devices via the
        X-Tenant-Id switcher). A device is ABSENT until it reports: the edge
        only builds the `flows` block once it has seen a flow deployment set, so
        a device without a rolled-out automation reports no version at all.
        Absent therefore means "unknown", never "outdated".
      responses:
        "200":
          description: One entry per device that reported a version.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EdgeVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/earnings:
    get:
      tags: [sites]
      summary: Realized earnings - measured "mit VoltPilot vs. ungeregelte Anlage".
      description: >
        The measured money numbers behind the portal hero (fleet AND
        single-site), computed per 15-min slot from the telemetry rollups
        valued at the slot's day-ahead price in each site's own bidding zone
        (PT15M rows preferred, PT60M fallback): baseline = (load_kwh - pv_kwh)
        * price/1000 (the UNREGULATED plant - same generation and consumption,
        fed in immediately, battery idle), actual = (grid_import_kwh -
        grid_export_kwh) * price/1000, saved = baseline - actual. Both are
        signed COSTS (negative = revenue); with symmetric spot pricing, saved
        equals the battery's dispatch valued at spot, so round-trip losses
        debit VoltPilot automatically. Windows are Europe/Berlin calendar
        periods containing `at`; range=all starts at the fleet's first covered
        slot and the response's `from` says so. RLS-scoped like every customer
        endpoint; admins use the X-Tenant-Id switcher.
      parameters:
        - name: range
          in: query
          schema: { type: string, enum: [day, month, year, all], default: month }
        - name: at
          in: query
          description: The date whose period to report (default today, Europe/Berlin).
          schema: { type: string, format: date }
        - name: strip
          in: query
          description: >
            Opt in to the tappable 12-month strip (`monthlyStrip`). It is a fixed
            ~173 ms 12-month scan and no portal surface renders the fleet strip's
            values today, so it is computed ONLY on demand (audit
            vp-portal-perf-a4, finding B5); `monthlyStrip` is [] when omitted.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The caller's realized earnings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Earnings" }
        "400": { description: Unknown range. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/sites:
    get:
      tags: [sites]
      summary: List sites for the caller's tenant (tenant_id from OIDC token).
      responses:
        "200":
          description: Sites (only the caller's tenant, via RLS).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Site" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [sites]
      summary: Create a site for the caller's own tenant (self-service onboarding).
      description: >
        Creates a site (Standort) for the CALLER's tenant. The tenant is taken from
        the OIDC `tenant_id` claim (via TenantContext) and enforced by RLS' WITH
        CHECK - never from the request body - so a customer can only ever create a
        site for themselves. This unblocks onboarding: a fresh customer creates a
        site, then claims devices into it. Implemented in services/api.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSiteRequest" }
      responses:
        "201":
          description: Site created (for the caller's tenant).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400": { description: Invalid input (blank name, out-of-range coordinates, or bad zone). }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/sites/{siteId}:
    put:
      tags: [sites]
      summary: Update a site (name/bidding zone/coordinates).
      description: >
        Validation mirrors create. RLS makes a foreign site a 404 and pins the
        row to its tenant, so a site can never be moved across tenants. Admins
        edit any tenant's sites through the same endpoint via the X-Tenant-Id
        tenant switcher.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSiteRequest" }
      responses:
        "200":
          description: Updated site.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400": { description: Invalid input (blank name, out-of-range coordinates, or bad zone). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
    delete:
      tags: [sites]
      summary: Delete a site (guarded; cascades assets + series data).
      description: >
        Refused (409) while the site still has devices - they must be removed
        first. On success the site's assets cascade by FK and its series data
        (telemetry, rollups, forecast, schedule, weather, forecast-quality rows)
        is deleted in the same transaction. Use the deletion-preview endpoint to
        show the concrete consequences before confirming.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Site and its recorded data deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
        "409": { description: The site still has devices; remove them first. }
  /api/v1/sites/{siteId}/deletion-preview:
    get:
      tags: [sites]
      summary: What deleting this site would remove (for the confirm dialog).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Device count and recorded-data extent/counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDeletionPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/devices:
    get:
      tags: [devices]
      summary: List devices for the caller's tenant.
      responses:
        "200":
          description: Devices (only the caller's tenant, via RLS).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/devices/{deviceId}:
    put:
      tags: [devices]
      summary: Update a device (type + label only; the ref is immutable).
      description: >
        Only `kind` and the optional customer-facing label `name` are editable.
        The `externalRef` is the device's identity (MQTT topics, registry
        gating, the printed sticker) and cannot be changed - a wrong ref is
        fixed by unclaiming and re-claiming.
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDeviceRequest" }
      responses:
        "200":
          description: Updated device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { description: Invalid kind or over-long label. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Device not found for this tenant. }
    delete:
      tags: [devices]
      summary: Unclaim (delete) a device incl. its telemetry + MQTT cleanup.
      description: >
        Removes the device row AND its telemetry, and clears the broker's
        retained `provision/{ref}/config` and schedule topics (best-effort,
        like the on-claim publish) so the physical device falls back to its
        watchdog default. The ref becomes claimable again; a sticker ID stays
        registered in the manufacturing registry.
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Device unclaimed; its telemetry deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Device not found for this tenant. }
  /api/v1/devices/{deviceId}/purge-data:
    post:
      tags: [devices]
      summary: Purge ALL recorded data of a device WITHOUT unclaiming it.
      description: >
        "Datenaufzeichnungen löschen": irreversibly deletes every recorded
        timeseries datapoint of this device - raw telemetry plus the site's
        derived rollups, which are rebuilt from the remaining devices - while
        the device itself stays claimed and fully operational (enrollment,
        certificates, config and the retained schedule are untouched). A purge
        watermark (`purgedBefore`) is stamped on the device: the ingest path
        refuses any sample OBSERVED at or before it, so a store-and-forward
        edge replaying old buffered samples can never resurrect the deleted
        history. The device is additionally told to wipe its local buffers via
        a retained MQTT `purge_data` command (contract:
        mqtt-data-purge.schema.json) - delivered on reconnect if it is offline.
        New data recorded after the purge flows and charts normally.
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Purge completed (cloud data is gone).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevicePurgeResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Device not found for this tenant. }
  /api/v1/devices/claim:
    post:
      tags: [devices]
      summary: Claim an edge device into a site (onboarding = one insert).
      description: >
        Claims an unclaimed edge device (identified by `externalRef`) into one of
        the caller's sites. `externalRef` is canonicalized before use: trimmed,
        and sticker Geräte-IDs (prefix `VP-`, case-insensitive) uppercased, so
        the typed case never creates a second device. Sticker IDs additionally
        validate against the provisioned-device registry (manufactured IDs,
        maintained via the admin API): an unknown sticker ID yields 422 instead
        of creating a ghost device, and the claimed device inherits the
        registry's `kind`. Non-sticker refs stay ungated. The claim is idempotent
        within the tenant: re-claiming a ref the caller already owns returns 200
        with the existing device (at its original site) instead of a conflict.
        `externalRef` is globally unique, so a device claimed by ANOTHER tenant -
        which RLS hides - yields 409. The target site must belong to the caller's
        tenant, else 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceClaimRequest" }
      responses:
        "200":
          description: Already claimed by the caller's own tenant - the existing device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "201":
          description: Device claimed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Target site not found for this tenant. }
        "409": { description: Device already claimed by another tenant. }
        "422": { description: Unknown sticker Geräte-ID (not in the provisioned-device registry). }
  /api/v1/sites/{siteId}/telemetry:
    get:
      tags: [telemetry]
      summary: Query telemetry timeseries for a site.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: >
            Telemetry points (tenant-scoped via RLS). `from`/`to` default to the
            last 24h. Windows longer than 3h are downsampled server-side to
            1-minute averages so the series stays complete AND current for chatty
            devices; when the row cap would bite, the oldest points are dropped,
            never the newest.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TelemetryPoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/prices:
    get:
      tags: [market]
      summary: Day-ahead spot prices (15-min slots) for a site's bidding zone.
      description: >
        Returns the day-ahead electricity spot prices for the site's bidding zone
        (DE-LU). Prices are market-wide PER ZONE (not per tenant), but the endpoint
        is site-scoped so the portal reads "the price for this site": the site is
        resolved via RLS (a foreign site is 404), then its zone's series is
        returned. Collected KEYLESS from energy-charts.info (Fraunhofer ISE), with
        ENTSO-E as an alternative source. `from`/`to` default to roughly
        today+tomorrow. Implemented in services/api.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Price series for the site's zone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceSeries" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/price-history:
    get:
      tags: [market]
      summary: Day-ahead prices aggregated over one range (Tag/Woche/Monat/Jahr).
      description: >
        Day-ahead spot prices for the site's bidding zone, aggregated over one
        historical period, mirroring the Historie period pattern. `at` picks the
        period containing that date; boundaries are Europe/Berlin. Aggregation
        happens in SQL (TimescaleDB time_bucket): 15-min buckets for the day,
        hourly for the week, Europe/Berlin-daily for month/year - so a year is
        ~365 rows, not ~35k slots. Each bucket carries avg/min/max (the band the
        chart draws), and the response includes range summary stats (avg/min/max,
        cheapest & most expensive slot, slot count, actual data coverage). The
        day range anchored on today extends `to` into tomorrow so the
        forward-looking day-ahead curve stays visible; past days show one day.
        Prices are market-wide per zone (no tenant); the site is resolved via RLS
        (foreign site => 404). Because the collector only fetches today+tomorrow,
        historical depth grows one day per collector day - empty/partial windows
        are expected and returned as empty bucket lists. Implemented in
        services/api.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: range
          in: query
          required: false
          schema: { type: string, enum: [day, week, month, year], default: day }
        - name: at
          in: query
          required: false
          description: Any ISO date (YYYY-MM-DD) inside the wanted period (Europe/Berlin); defaults to today.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Aggregated price series for the range (empty buckets if no data).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceHistory" }
        "400": { description: Invalid range value. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/weather:
    get:
      tags: [weather]
      summary: Latest weather forecast (hourly) for a site.
      description: >
        Returns the most recent weather-forecast run for the site (temperature,
        cloud cover and shortwave/GHI radiation useful for PV), hourly over the
        coming days. The `weather_forecast` table carries `tenant_id` and is
        RLS-scoped, and the site lookup is RLS-gated, so a foreign site is 404 and
        no other tenant's weather can leak. Collected KEYLESS from Open-Meteo
        (EU-hosted). Implemented in services/api.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Latest weather forecast (empty points array if none stored yet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherForecast" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/schedule:
    get:
      tags: [schedules]
      summary: Current 24h optimization schedule (15-min slots) for a site.
      description: >
        Two readings of the same hypertable, selected by `mode`.


        `mode=latest` (DEFAULT, unchanged): the latest optimizer run - what the
        device is executing right now. Per-slot planned battery power (+charge /
        -discharge), projected grid power and SoC, the day-ahead price and the
        projected cost vs. the no-battery baseline, plus the headline savingsEur
        over the horizon. Empty slots array (null metadata) when no plan has
        been produced yet.


        `mode=day` ("wie der Tag geplant war", Tages-Splice): per 15-min slot of
        the Europe/Berlin day the value from the NEWEST run that planned the
        slot BEFORE it began - the plan that was in force when the quarter hour
        started. The per-slot winner uses the same DISTINCT-ON splice the
        savings math has always used. Slots that had not started yet resolve to
        the newest run, so the tail of the response IS the current plan
        (including its slots on the following day). A slot no run planned
        ex-ante simply has no row, so a day whose optimizer only started at noon
        honestly begins at noon. Run-level facts describe ONE run and are
        therefore null on a spliced day (planId, bankedValueEur, socStartPct,
        socEndPct, peakTargetKw, fallback14a); generatedAt/deviceId name the
        newest run that contributed a slot, and savingsEur sums the spliced
        slots. Feeds the portal's "Film des Tages", which ticks off the elapsed
        phases as PLANNED (never as measured).


        Both modes are RLS-scoped by tenant and carry the recomposed decision
        prices (importPriceCtKwh / exportValueCtKwh / importPriceSource).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: mode
          in: query
          required: false
          description: Which reading of the plan; unknown values are rejected (400).
          schema: { type: string, enum: [latest, day], default: latest }
      responses:
        "200":
          description: The site's current plan (empty slots array if none yet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { description: Unknown mode. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/control-status:
    get:
      tags: [schedules]
      summary: Latest inverter-control confirmation for a site ("Steuerung").
      description: >
        What the schedule commanded vs. what the inverter read back for this
        site's device(s), ingested from the additive `control` block of the
        device status heartbeat (report §5). Feeds the portal's calm "Steuerung"
        strip ("Fahrplan-Sollwert X -> Wechselrichter bestätigt Y", healthy |
        mismatch | stale). RLS-scoped by tenant. 204 (no body) until a device has
        reported a control readback.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's latest control confirmation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlStatus" }
        "204": { description: No control readback reported yet for this site. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/curtailment-status:
    get:
      tags: [schedules]
      summary: Latest feed-in curtailment ("Abregeln") truth for a site.
      description: >
        Does the plant actually throttle its PV in a planned "Abregeln" slot, or
        is the plan a plan because the curtailment actor is not released yet?
        Ingested from the additive `curtailment` block of the device status
        heartbeat. Deliberately its OWN read next to `control-status` rather than
        extra fields there: the two heartbeat blocks arrive independently (a
        device may report either alone) and each carries its own freshness
        anchor. RLS-scoped by tenant. 204 (no body) until a device has reported
        the block - the portal then keeps its plan wording, which is exactly the
        honest fallback.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's latest curtailment truth.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurtailmentStatus" }
        "204": { description: No curtailment block reported yet for this site. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/sources:
    get:
      tags: [sites]
      summary: The site's measurement points as the edge reports them.
      description: >
        The primary inverter plus every configured additional source
        (Erzeuger/Netz-Zähler/Verbraucher) with its OWN latest reading and
        freshness, ingested from the additive `sources` block of the device
        status heartbeat. It makes a multi-inverter site's composite PV
        explainable in the portal ("39,0 kW = Deye 8,3 + Fronius 21,3 + …")
        instead of one opaque number. Display-only - the composite telemetry
        path is untouched. RLS-scoped by tenant; an empty list means no device
        has reported the block yet.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's reported measurement points (primary first).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteSource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/supply-price:
    get:
      tags: [sites]
      summary: The structured supply-price sheet (Bezugspreis-Komponenten).
      description: >
        One Anlage's `site_supply_price` Preisblatt (report vp-nacht-bezug-e7
        Stufe 2): the volumetric grid-import components in ct/kWh NETTO plus the
        USt rate and the Preisblatt-Stand. `present` says whether a row exists;
        `hasComponents` is the activation gate - when true, the optimizer prices
        import as `(spot + Sum Komponenten) x (1+USt)` instead of bare spot. A
        site without a row reports an empty sheet so the portal can prefill the
        researched suggestion values. RLS-scoped (foreign site 404; admins via
        the `X-Tenant-Id` switcher).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The sheet (empty when no row exists).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplyPrice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
    put:
      tags: [sites]
      summary: Maintain the structured supply-price sheet.
      description: >
        Upsert the site's Preisblatt components. PATCH semantics (the
        site-update COALESCE pattern): a field ABSENT from the body keeps its
        stored value; a field present with a value is written, and an explicit
        `null` CLEARS that component to "unknown" (which suppresses the
        composition again once the last one is cleared). `ustPct` is NOT NULL - a
        present `null` there is ignored. This endpoint only makes a maintained
        sheet possible; the optimizer's behaviour changes when a component is
        actually saved (a maintained row activates the composition), never on its
        own. RLS-scoped (foreign site 404); the tenant is taken from the token,
        never the body.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Any subset of the component fields. All ct/kWh NETTO, all
                nullable (null clears to "unknown").
              properties:
                netzentgeltArbeitspreisCt: { type: number, nullable: true, minimum: 0 }
                stromsteuerCt: { type: number, nullable: true, minimum: 0 }
                konzessionsabgabeCt: { type: number, nullable: true, minimum: 0 }
                umlagenCt: { type: number, nullable: true, minimum: 0 }
                vertriebsaufschlagCt: { type: number, nullable: true, minimum: 0 }
                ustPct: { type: number, minimum: 0, maximum: 100 }
                komponentenStand: { type: string, format: date, nullable: true }
      responses:
        "200":
          description: The recomputed sheet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplyPrice" }
        "400": { description: A component/USt/date value is invalid (German message). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/topology:
    get:
      tags: [topology]
      summary: Anlagen-Topologie-Read-Model (the adaptive energy-flow graph).
      description: >
        The site as an entity graph aggregated into the role-grouped hub
        topology the adaptive energy-flow diagram (AE2) renders: entities with
        each capability's resolved role (stored override else the DefaultRole
        mapping) + maßgeblich flag + latest live value (from telemetry_v2), plus
        the server-derived `topology` (role nodes PV-Erzeugung / Speicher / Netz
        / Verbraucher with directed flows, the shared Go/TS/Java twin - see
        docs/contracts/v2/topology-read-model.md). A hybrid inverter maps to
        several roles at once; several entities aggregate into one role. A fresh
        site returns empty entities + empty topology. RLS-scoped by tenant.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's topology read-model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologyResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/topology-roles:
    put:
      tags: [topology]
      summary: Assign capabilities to roles (customer, "Rollen & Zuordnung").
      description: >
        The customer twin of the admin role-assignment (U2 "Rollen & Zuordnung",
        report §3.2): a Portal-User re-assigns a capability's role and picks the
        maßgebliche (primary) measurement for THEIR OWN site. Tenant-scoped (RLS;
        foreign site = 404, never 403); admins reach it via the `X-Tenant-Id`
        switcher. Safe by construction: a role is presentation-level and never
        widens control (guards/arbitration key on capabilities, not roles), so
        this shares the admin rule verbatim with no relaxed gate. A blank role
        reverts to the DefaultRole mapping; an unknown role is 400.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    required: [entityId, channel]
                    properties:
                      entityId: { type: string, format: uuid }
                      channel: { type: string, example: power_kw }
                      role:
                        type: string
                        description: pv | storage | grid | consumer; blank clears the override.
                        example: grid
                      primary: { type: boolean }
      responses:
        "200":
          description: The recomputed topology read-model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologyResponse" }
        "400": { description: Unknown role or missing entityId/channel. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or entity not found for this tenant. }
  /api/v1/sites/{siteId}/v2-entities/adopt:
    post:
      tags: [topology]
      summary: Adopt a reported source into a component (customer, Portal v3 M6 "Zuordnen").
      description: >
        The CUSTOMER twin of the adoption bridge (Portal v3 M6 "Neues Gerät
        gefunden … jetzt zuordnen", OPEN O3): a Portal-User assigns an
        edge-reported source of THEIR OWN site to a component in one move.
        Tenant-scoped (RLS; foreign site = 404, never 403); admins reach it via
        the `X-Tenant-Id` switcher. It delegates to the SAME adoption the admin
        route uses, but is CATALOG-GUARDED to the GUIDED types only — producer,
        grid-meter and consumer-category types (the set the guided suggestion
        derives). It is never a free type picker and never takes guard-config
        input: platform-managed composed types (battery-hybrid / house-load) and
        free installer types (modbus-generic) are refused (422). Idempotent per
        `sourceId` (a re-adopt returns the existing entity).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId, entityType]
              properties:
                sourceId: { type: string, description: The edge source id from local_setup. }
                entityType: { type: string, example: wallbox }
                label: { type: string }
                maxPowerKw: { type: number, description: Consumer rated power (bounds commands). }
                capacityKwp: { type: number, description: Producer nameplate (kWp). }
                registryUnitId: { type: string, description: MaStR SEE number of the source. }
      responses:
        "200":
          description: The adopted (or already-existing) entity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2Entity" }
        "400": { description: Missing sourceId/entityType or unknown type. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
        "422": { description: The type is not a guided type (battery-hybrid / house-load / free installer type). }
  /api/v1/sites/{siteId}/v2-entities/{entityId}/edge-source:
    post:
      tags: [topology]
      summary: Re-pin an entity to a currently reported edge source ("Wieder verbinden").
      description: >
        The repair lever for identity churn and crossed pins
        (vp-vier-erzeuger-p9): a source deleted + re-added on the device got a
        new id, the entity's pin went stale (orphanedPin on the entities
        surface) and the same physical device showed up as "Neues Gerät
        gefunden". Re-pinning RECONNECTS the existing component (label, kWp,
        history) instead of minting a duplicate. Customer-safe: it moves only
        the presentation-level source link of the caller's OWN site (RLS) -
        never guard config or control rights. The target source must be
        currently reported by the device and role-compatible with the entity's
        type; a source already pinned to another entity is refused (409); a
        stale de-entitied point holding the pin is released (kWp delta) so the
        pin can move. Idempotent for the same sourceId.


        swap=true (vp-bereinigung-ui-k3) turns the 409 into a guided EXCHANGE:
        both assignments move inside ONE transaction, so a customer whose plant
        is fully pinned to the WRONG components can straighten it out and can
        never strand half-swapped. The other component gets this entity's
        previous source only when that source is still reported - otherwise its
        pin is cleared (moving an orphan defect would be the worse outcome).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId]
              properties:
                sourceId: { type: string, description: The edge source id from local_setup. }
                swap:
                  type: boolean
                  default: false
                  description: >
                    Explicit consent to take a source another component holds -
                    both assignments are exchanged atomically. Absent/false
                    keeps the 409, so an older client can never steal one.
      responses:
        "200":
          description: The re-pinned entity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2Entity" }
        "400": { description: Missing sourceId. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or entity not found for this tenant. }
        "409": { description: The source is already pinned to another entity (and swap was not requested). }
        "422": { description: The source is not currently reported, its role does not fit the entity's type, or the component is platform-composed. }
  /api/v1/sites/{siteId}/v2-entities/{entityId}/label:
    put:
      tags: [topology]
      summary: Rename a component (the customer's own name / alias).
      description: >
        The customer twin of the admin label PUT (concept vp-entity-alias-k1).
        The name is what the CUSTOMER calls the thing ("Dach Süd"); since the
        Label-Hygiene migration (V20260812000000) a non-null label means
        human-given, so it wins the customer-facing name chain over the name the
        device carries on its own :8484 page.


        R1 - a name is PRESENTATION and never an intervention. Enforced by
        construction: this route accepts ONLY `label`. There is no type, role,
        pin or guard field in the request, so nothing can be smuggled through
        the rename door; assignment and control keep their own gated routes.


        EVERY component may be renamed, including the platform-composed
        battery-hybrid / grid-meter / house-load - re-pin and delete refuse
        those because they change what a component IS or whether it exists,
        while a name changes neither. Only their TYPE and ROLE stay ours.


        Semantics mirror the admin PUT so there is one label-writing rule: an
        absent/null label keeps the current name, an EMPTY one clears it - back
        to the derived name, never an empty label. Newlines/control characters
        collapse to single spaces and the value is trimmed. Duplicates are
        allowed on purpose (two arrays may both be called "Dach").
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 200
                  nullable: true
                  description: >
                    The customer's name. Empty string clears it (back to the
                    derived name); absent/null keeps the current one.
      responses:
        "200":
          description: The renamed entity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2Entity" }
        "400": { description: The label exceeds 200 characters. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or entity not found for this tenant. }
  /api/v1/sites/{siteId}/v2-entities/{entityId}:
    delete:
      tags: [topology]
      summary: Delete an adopted component (customer cleanup lever).
      description: >
        The customer twin of the admin purgePoint delete: it removes the
        measurement point outright, releases a producer's kWp from the
        aggregate asset.pv and frees the edge-source pin, so the device
        reappears as "Neues Gerät gefunden" and can be assigned to the right
        component. The registry is re-pushed, so the device drops the component
        too. Refused (422) for the platform-composed base components
        (battery-hybrid / house-load) and for any component without a device
        assignment - a grid meter or house load composed from the plant's own
        master data is its Grundausstattung, not a mis-adoption.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or entity not found for this tenant. }
        "422": { description: A platform-composed or unassigned component - not the customer's to remove. }
  /api/v1/sites/{siteId}/entity-strategies:
    get:
      tags: [topology]
      summary: Which active flows touch each entity (U2 strategy chips).
      description: >
        The entity→active-flow map the "Ihre Geräte" cards render as read-only
        strategy chips (a link into Steuerung), derived from each active flow
        document's D-13 claims. Keyed by entity id. Tenant-scoped (RLS; foreign
        site 404).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: entityId → list of {flowId, flowName}.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: object
                    properties:
                      flowId: { type: string, format: uuid }
                      flowName: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/admin/sites/{siteId}/topology-roles:
    put:
      tags: [topology, admin]
      summary: Assign capabilities to roles (platform-admin).
      description: >
        Re-assign a capability's role and pick the maßgebliche (primary)
        measurement per role. Platform-admin only, through the `X-Tenant-Id`
        switcher over the RLS path (foreign site = 404). A blank role reverts the
        capability to its DefaultRole mapping; an unknown role is 400. Returns
        the recomputed read-model.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    required: [entityId, channel]
                    properties:
                      entityId: { type: string, format: uuid }
                      channel: { type: string, example: power_kw }
                      role:
                        type: string
                        description: pv | storage | grid | consumer; blank clears the override.
                        example: grid
                      primary: { type: boolean }
      responses:
        "200":
          description: The recomputed topology read-model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologyResponse" }
        "400": { description: Unknown role or missing entityId/channel. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
        "404": { description: Site or entity not found for the selected tenant. }
  /api/v1/sites/{siteId}/profile:
    get:
      tags: [profile]
      summary: Nutzungsprofil / EMS-Modus read-model (AE7, the second adaptation axis).
      description: >
        The site's usage profile (arbitrage | peak | private) that steers the
        adaptive portal/edge EMPHASIS, DERIVED from its strategy nodes (active
        flows) + entity mix + money master data (plant_kind, Leistungspreis),
        with an explicit override. ONE truth - not a competing concept (see
        docs/contracts/v2/usage-profile.md). Returns the effective profile, the
        derived default, the override, the emphasis map (money/peak/flow/devices)
        and the raw signals. RLS-scoped (foreign site 404; admins via the
        `X-Tenant-Id` switcher).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The usage-profile read-model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
    put:
      tags: [profile]
      summary: Set or clear the usage-profile override.
      description: >
        Set the explicit usage-profile override (arbitrage | peak | private) or
        clear it (null/blank -> auto-derive). Customer or admin, RLS-scoped;
        returns the recomputed read-model. Also echoed on Site.usageProfileOverride.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                override:
                  type: string
                  nullable: true
                  enum: [arbitrage, peak, private]
                  description: null/blank clears the override (auto-derive).
      responses:
        "200":
          description: The recomputed usage-profile read-model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageProfile" }
        "400": { description: Override is not one of arbitrage, peak, private. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/profiles:
    get:
      tags: [profile]
      summary: Modus-Profile shelf of the Anlage (Portal v3 M3).
      description: >
        The plant's feature set as a shelf with switches: Eigenverbrauch,
        Marktoptimierung, Gewerbe (Lastspitzenkappung), Atypische Netznutzung.
        Every profile is a DIRECT customer toggle - there are exactly two states,
        `an` and `aus`, and no "angefragt" state anywhere. `state` is the STORED
        intent (null = no row = derived default, i.e. the pre-M3 behaviour);
        `derivedActive` is what the derivation alone says, `active` the effective
        result after the intent overlay. `blockedReason` is the honest German
        sentence for a profile that is switched on but cannot fully run yet
        (missing Leistungspreis, missing market access) - never a request prompt.
        RLS-scoped (foreign site 404; admins via the `X-Tenant-Id` switcher).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The shelf.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteProfiles" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
    put:
      tags: [profile]
      summary: Switch one Modus-Profil on or off.
      description: >
        Switching a profile ON makes the SERVER enable exactly that profile's
        gated node types for this site and seed its starter flow
        (`FlowTemplateService.autoStart`); switching it OFF deactivates the
        profile's flows, disables those node types again and persists `aus` (so a
        re-derived signal cannot silently re-enable it). The gate is opened, never
        faked - the activation path still re-checks it, and the peak-shaving
        configuration gate, the edge guard chain and the section 14a/EEG
        protections are untouched. Marktoptimierung additionally requires real
        market access on the site (a dynamic tariff and/or Direktvermarktung):
        without it the toggle still flips, but the gated node stays closed and
        nothing trades. A profile toggle NEVER writes money/contract master data.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile, state]
              properties:
                profile:
                  type: string
                  enum: [eigenverbrauch, marktvermarktung, lastspitzenkappung, atypische-netznutzung]
                state: { type: string, enum: [an, aus] }
      responses:
        "200":
          description: The recomputed shelf.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteProfiles" }
        "400": { description: Unknown profile or state. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/flows/auto-start:
    post:
      tags: [flows]
      summary: Seed this site's starter flow DRAFT (customer twin of the admin route).
      description: >
        Idempotent: a site that already has any flow is left untouched
        (`already_has_flow`), a site without a battery-hybrid entity reports
        `no_battery`. Creating a DRAFT controls nothing - the activation gate is
        unchanged, so a flow carrying a gated node still fails with
        `gated_node_not_enabled` until that node type is enabled for the site.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201": { description: Starter flow draft created. }
        "200": { description: Nothing seeded - the outcome carries the German reason. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/admin/sites/{siteId}/flow-node-governance:
    get:
      tags: [admin]
      summary: Gated strategy-node types and their per-site enablement (AE7 governance).
      description: >
        The gated (market-/grid-near) strategy node types from the catalog
        (Arbitrage, Peak-Shaving, atyp. NN) and whether each is enabled for this
        site. A flow carrying a gated node stays inactive until it is enabled
        here. Platform-admin only, via the `X-Tenant-Id` switcher.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The gated node types + enablement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowNodeGovernance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
        "404": { description: Site not found for the selected tenant. }
    put:
      tags: [admin]
      summary: Enable/disable gated strategy-node types for the site.
      description: Platform-admin only. An unknown/non-gated node type is 400.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enablements:
                  type: array
                  items:
                    type: object
                    required: [nodeType, enabled]
                    properties:
                      nodeType: { type: string, example: vp.strategy.market }
                      enabled: { type: boolean }
      responses:
        "200":
          description: The recomputed governance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowNodeGovernance" }
        "400": { description: Unknown or non-gated node type. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
        "404": { description: Site not found for the selected tenant. }
  /api/v1/admin/sites/{siteId}/flows/auto-start:
    post:
      tags: [admin]
      summary: Seed the site's profile-appropriate starter flow draft (AE7 auto-start).
      description: >
        Seed a starter flow DRAFT matching the site's derived usage profile
        (arbitrage -> market, peak -> peak-shaving, private -> self-consumption
        on the battery), so onboarding never dead-ends. Idempotent: a site with
        any flow is left untouched (created=false, reason already_has_flow); a
        site without a battery is skipped (reason no_battery). Platform-admin only.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: The starter flow draft was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoStartOutcome" }
        "200":
          description: No-op (already has a flow / no battery).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoStartOutcome" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
        "404": { description: Site not found for the selected tenant. }
  /api/v1/sites/{siteId}/history:
    get:
      tags: [history]
      summary: A site's history ("Historie") for one period, money lens first.
      description: >
        Bucketed pv/load/grid/SoC series (15-min for day, hourly for week,
        Europe/Berlin-daily for month/year; served from the telemetry rollup
        tables, day live from raw telemetry) with the matching day-ahead price
        and per-bucket import cost, plus period totals: consumption / PV /
        import / export kWh, grid cost EUR (import energy x matching 15-min
        price), battery savings EUR (persisted optimizer plans, latest run per
        slot, null where none exist), Autarkiegrad and Eigenverbrauchsquote.
        For range=day the response additionally carries the Tagesprotokoll
        (notable events in plain German) and the persisted plan trajectory for
        the plan-vs-actual overlay. Period boundaries are Europe/Berlin local
        time. RLS-scoped by tenant.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: range
          in: query
          required: false
          schema: { type: string, enum: [day, week, month, year], default: day }
        - name: at
          in: query
          required: false
          schema: { type: string, format: date }
          description: Any date inside the wanted period (default today, Europe/Berlin).
      responses:
        "200":
          description: The site's history for the period (empty buckets if no data).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/History" }
        "400": { description: Unknown range value. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/earnings:
    get:
      tags: [history]
      summary: One site's realized money for one period (the "Erlöse" world).
      description: >
        The Anlagen-scharfe twin of GET /api/v1/earnings (Historie concept
        vp-historie-konzept-t4 §4.2 Welt B / F1, performance measure P3): the
        SAME slot math, the SAME price truth, one site and one period instead
        of the whole tenant with strip and forward market value. Beyond the
        fleet fields it exposes the COMPOSITION the money card shows -
        stromkostenEur (the metered import at the site's real supply price -
        literally the import term of actualEur), the resulting nettoErgebnisEur
        = einspeiseErloesEur + eigenverbrauchsWertEur - stromkostenEur, the
        Marktprämie already contained in the feed-in revenue, the Ø Bezugspreis
        and a per-bucket series carrying the three parts (so the chart can
        stack them and its cumulative line lands on nettoErgebnisEur).
        savedEur stays an ATTRIBUTION inside the result, never a sibling
        summand. Ranges are the Historie vocabulary (week included);
        range=all reports the site's first covered Berlin day as `from`.
        RLS-scoped - a foreign site is 404; admins use the X-Tenant-Id
        switcher.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: range
          in: query
          schema: { type: string, enum: [day, week, month, year, all], default: month }
        - name: at
          in: query
          description: Any date inside the wanted period (default today, Europe/Berlin).
          schema: { type: string, format: date }
      responses:
        "200":
          description: The site's realized money for the period.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteEarnings" }
        "400": { description: Unknown range value. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/forecast-quality:
    get:
      tags: [forecast-quality]
      summary: Forecast-model quality ("Prognosequalität") for a site.
      description: >
        The shadow-mode forecasting transparency view (docs/forecasting.md):
        which forecast model is LIVE per kind (activeLoadModel/activePvModel,
        resolved from server config - the same env the optimizer reads), the
        lifecycle of every model that has run on the site (challengers report
        "collecting: day X of N" while their self-gate is unmet; trained models
        carry trainedAt/trainRows and the top feature importances with
        plain-German labels), the per-model daily error series (MAE kW, nMAE %,
        bias, skill vs the baseline - positive = better) computed by the daily
        evaluation job, and the daily plan-vs-actual economics. Challenger
        promotion is NEVER automatic; it is an operator env flip informed by
        this data. All rows come from RLS-scoped tables - a foreign site is a
        404; a fresh site yields empty (but well-formed) lists.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 30, minimum: 1, maximum: 90 }
          description: How many trailing days of accuracy/plan series to return.
      responses:
        "200":
          description: The site's forecast-quality view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForecastQuality" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/assets:
    get:
      tags: [registry]
      summary: The site's asset master data incl. registry provenance.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Asset rows (battery params for the optimizer, PV params for the forecast).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteAsset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant (RLS). }
  /api/v1/sites/{siteId}/measurement-points:
    get:
      tags: [registry]
      summary: The site's additional read-only measurement points (multi-source Anlage).
      description: >
        A site with a battery-hybrid inverter PLUS a separate AC-coupled PV
        records the second PV here as an Erzeuger source; its kWp sums into the
        aggregate `asset.pv` the forecast reads. A dedicated grid meter at the
        point of common coupling is recorded as a Netz source (`grid-meter`, at
        most one per site, no nameplate); it does not touch `asset.pv`. A
        Verbraucher (`consumer`, e.g. a go-e wallbox) is recorded here too - no
        nameplate, no count limit (a site may have several). NO second device
        claim - sources are read through the site's one connected edge, which
        folds a Netz meter into the authoritative site grid. Read-only by
        construction (control is always false).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's measurement points.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MeasurementPoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant (RLS). }
    post:
      tags: [registry]
      summary: Record an additional read-only source (Erzeuger PV, a single Netz grid meter, or a Consumer).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  description: >
                    'pv-generation' (Erzeuger, default), 'grid-meter' (Netz, at
                    most one per site; carries no nameplate) or 'consumer'
                    (Verbraucher, e.g. a wallbox; no nameplate, no count limit).
                  enum: [pv-generation, grid-meter, consumer]
                label: { type: string, maxLength: 120 }
                brand: { type: string, maxLength: 60 }
                model: { type: string, maxLength: 60 }
                capacityKwp:
                  type: number
                  description: Per-Erzeuger nameplate (kWp); sums into the aggregate asset.pv. Ignored for a Netz meter.
                registryUnitId:
                  type: string
                  description: The source's OWN MaStR SEE number (optional - never blocks adding).
      responses:
        "200":
          description: The site's measurement points after the add.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MeasurementPoint" }
        "400": { description: An unknown role or invalid values. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant (RLS). }
        "409": { description: The site already has a Netz (grid-meter) source. }
  /api/v1/sites/{siteId}/measurement-points/{pointId}:
    delete:
      tags: [registry]
      summary: Remove an additional source; its kWp is subtracted from the aggregate site PV.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: pointId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's remaining measurement points.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MeasurementPoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Measurement point or site not found for this tenant (RLS). }
  /api/v1/sites/{siteId}/mastr-lookup:
    post:
      tags: [registry]
      summary: Fetch one MaStR unit for confirmation (nothing persisted).
      description: >
        Looks the SEE unit number up in the Marktstammdatenregister (official
        SOAP webservice when credentials are configured, keyless public JSON
        backend otherwise) and returns the mapped preview: kWp, module count,
        orientation/tilt decoded from catalog values to degrees (nullable -
        e.g. Balkonkraftwerke carry none), commissioning date, storage kWh/kW,
        and the registry's PLZ/Ort for the customer's own plausibility check.
        Storage units are ALSO SEE-numbered; `kind` states what the registry
        says the unit is. Error bodies carry a customer-facing German
        `message`.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [einheitNummer]
              properties:
                einheitNummer:
                  type: string
                  description: SEE + 12 digits; lowercase/spaces are normalized.
                  example: SEE966831669444
      responses:
        "200":
          description: Mapped preview for confirmation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MastrPreview" }
        "400": { description: Invalid unit number (German hint in `message`, e.g. the SES/SSE/EEG prefix mix-ups). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant, or no unit with this number in the registry. }
        "502": { description: Registry currently unreachable. }
  /api/v1/sites/{siteId}/mastr-apply:
    post:
      tags: [registry]
      summary: Persist the confirmed registry values onto the site's assets.
      description: >
        Creates or updates the site's `pv` and/or `battery` asset rows with the
        values the customer confirmed in the preview, plus provenance (registry
        id, unit number, fetch timestamp). Battery values land in the columns
        the optimizer reads; PV values feed the forecast's PlantSpec. At least
        one of `pv`/`storage` is required.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MastrApplyRequest" }
      responses:
        "200":
          description: The site's asset rows after the apply.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteAsset" }
        "400": { description: Neither pv nor storage present, or values out of range. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant (RLS). }
  /api/v1/sites/{siteId}/battery:
    put:
      tags: [registry]
      summary: Maintain the site's battery master data and its controlling device.
      description: >
        Create or update the site's `battery` asset from customer-entered values
        (capacity/charge/discharge power and optional round-trip efficiency) -
        the manual path for plants not in the Marktstammdatenregister. The
        battery is controlled by the inverter, which is the edge device, so the
        request also maintains the device link: pass `deviceId` to pick the
        controlling device explicitly (validated to belong to this site), or omit
        it to auto-link the site's single device (the self-maintaining rule). A
        multi-device site with no explicit choice is left unlinked and the portal
        warns that the plan cannot be executed. Manual values leave the registry
        provenance untouched (a MaStR-linked battery keeps its provenance).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capacityKwh, maxChargeKw, maxDischargeKw]
              properties:
                capacityKwh: { type: number, description: "Usable battery capacity (kWh), > 0." }
                maxChargeKw: { type: number, description: "Max charge power (kW), > 0." }
                maxDischargeKw: { type: number, description: "Max discharge power (kW), > 0." }
                roundtripEfficiencyPct:
                  type: number
                  nullable: true
                  description: Round-trip efficiency in percent (1-100); platform default 92 when omitted.
                deviceId:
                  type: string
                  format: uuid
                  nullable: true
                  description: The controlling device; omit to auto-link the site's single device.
                speicherschonung:
                  type: string
                  enum: [aggressiv, ausgewogen, schonend]
                  nullable: true
                  description: >
                    The customer's "Umgang mit dem Speicher" preset, mapped
                    server-side onto the battery's wear cost (aggressiv 1 ct /
                    ausgewogen 4 ct / schonend 8 ct per kWh cycled) - the
                    optimizer reads it on its next 15-min cycle. Omit to keep
                    the stored value. The raw ct value stays admin-only
                    (optimizer-config); a preset pick overwrites an
                    admin-configured custom value.
      responses:
        "200":
          description: The site's asset rows after the save.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteAsset" }
        "400": { description: Missing/invalid battery values. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant (RLS), or the chosen device is not at this site. }
  /api/v1/sites/{siteId}/simulation:
    post:
      tags: [simulation]
      summary: Start an Ersparnis-Simulation for this Anlage (async job).
      description: >
        Submits a simulation over the reference year (default: the last full
        calendar year). Every input defaults from the site's master data
        (tariff, plant kind, anzulegender Wert, coordinates, battery asset
        incl. Speicherschonung, PV asset) and every body field OVERRIDES its
        default - the what-if instrument. Requires backfilled day-ahead
        prices for the reference year (`voltpilot-market-data backfill`).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulationRequest" }
      responses:
        "202":
          description: Job accepted; poll the status route.
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulationId: { type: string }
        "400": { description: Invalid inputs (German message), incl. missing coordinates/battery or a not-backfilled price year. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
        "429": { description: Too many concurrent simulations (German message). }
        "502": { description: Simulation service unreachable. }
  /api/v1/sites/{siteId}/simulation/{simulationId}:
    get:
      tags: [simulation]
      summary: Poll a running/finished simulation of this Anlage.
      description: >
        Relays the simulation service's job document
        `{status: queued|running|done|failed, progress, result?, error?}`.
        `result` grows progressively (scenarios (a)/(b) after seconds, the
        VoltPilot months as their chunks solve); jobs expire after ~1 h. Only
        jobs STARTED through this site's route are visible here.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: simulationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The job document (see SimulationResult for `result`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or simulation not found (also after expiry/api restart - simply start a new run; the input cache makes it instant). }
  /api/v1/admin/simulation:
    post:
      tags: [simulation]
      summary: Start a prospect simulation (Vertrieb "Ersparnis-Rechner").
      description: >
        Platform-admin only. All inputs explicit (plant incl. coordinates,
        consumption, battery are required by the simulation service); nothing
        about the prospect is persisted (V1 stateless). The Speicherschonung
        preset maps onto the wear cost server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimulationRequest" }
      responses:
        "202":
          description: Job accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulationId: { type: string }
        "400": { description: Invalid/missing inputs (German message). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Caller is not a platform admin. }
        "429": { description: Too many concurrent simulations. }
        "502": { description: Simulation service unreachable. }
  /api/v1/admin/simulation/{simulationId}:
    get:
      tags: [simulation]
      summary: Poll a prospect simulation.
      parameters:
        - { name: simulationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The job document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Caller is not a platform admin. }
        "404": { description: Simulation not found (expired, or not an admin job). }
  /api/v1/sites/{siteId}/kpis:
    get:
      tags: [kpis]
      summary: Economic KPIs (self-consumption, savings) for a site.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: KPIs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteKpis" }
  /api/v1/admin/tenants:
    get:
      tags: [admin]
      summary: List all tenants (platform-wide).
      responses:
        "200":
          description: Every tenant on the platform.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Create a tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTenantRequest" }
      responses:
        "201":
          description: Tenant created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/tenants/{tenantId}:
    put:
      tags: [admin]
      summary: Update a tenant's master data (name/segment/betriebsart).
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTenantRequest" }
      responses:
        "200":
          description: Updated tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { description: Invalid input (blank name or bad segment). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant not found. }
  /api/v1/admin/tenants/{tenantId}/delete:
    post:
      tags: [admin]
      summary: Offboard a tenant (type-to-confirm full cascade).
      description: >
        The most destructive platform action. The body must carry the tenant's
        EXACT name (`confirmName`); a mismatch is refused (400) before anything
        is touched. The database cascade - all series data, sites, devices,
        assets and the tenant row - runs in ONE transaction. The tenant's
        retained MQTT topics and Keycloak users are then cleaned best-effort;
        users whose deletion failed are reported by name in `failedUsers` so a
        partial directory failure is never silent.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteTenantRequest" }
      responses:
        "200":
          description: Tenant offboarded; the report of what was removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantOffboardingReport" }
        "400": { description: confirmName does not match the tenant's name. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant not found. }
        "502": { description: Keycloak unreachable - refused before deleting anything (the tenant's logins could not be enumerated). }
  /api/v1/admin/tenants/{tenantId}/sites:
    get:
      tags: [admin]
      summary: List the sites of a tenant (platform-admin, cross-tenant).
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The tenant's sites.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Site" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant not found. }
    post:
      tags: [admin]
      summary: Create a site for a tenant (platform-admin, cross-tenant).
      description: >
        Creates a site for the tenant named in the PATH, using the BYPASSRLS admin
        datasource. The tenant is validated to exist first. The tenant is never
        taken from client-controlled body data, so this is a deliberate,
        role-gated cross-tenant write - customer site access stays RLS-scoped.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSiteRequest" }
      responses:
        "201":
          description: Site created for the tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400": { description: Invalid input (blank name, out-of-range coordinates, or bad zone). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant not found. }
  /api/v1/admin/tenants/{tenantId}/users:
    get:
      tags: [admin]
      summary: List the customer users (Portal-Users) of a tenant.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Users carrying this tenant's `tenant_id` in Keycloak.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant not found. }
    post:
      tags: [admin]
      summary: Provision a customer user into a tenant.
      description: >
        Creates a Keycloak user with the `tenant_id` attribute and the customer
        (`operator`) realm role, so the account is tenant-scoped by the existing
        OIDC + RLS spine. An optional password is set (temporary for an invite
        flow). A duplicate username/email yields 409.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Customer user created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant not found. }
        "409": { description: A user with that username or email already exists. }
  /api/v1/admin/control-certifications:
    get:
      tags: [admin]
      summary: The PLATFORM register of control-certified inverter models.
      description: >
        "Model X is bench-certified for battery control" - entered ONCE and then
        valid fleet-wide. It is the platform's MEMORY of a bench run: before it,
        a certification landed either in the fleet-wide env allowlist (keyed on
        the register FAMILY, so one proof leaked onto untested siblings) or in a
        First-Light grant on ONE box, so the same model had to be certified again
        for every new customer.
        The key is brand+MODEL on purpose: a family covers several product lines,
        a bench run covers exactly one.
        The register ALONE controls nothing - a plant additionally needs its
        explicit activation (see `/control-activations`).
      responses:
        "200":
          description: The register, newest certification first.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ControlCertification" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
    post:
      tags: [admin]
      summary: Certify an inverter model (a bench run ends here).
      description: >
        Adds a model to the register and republishes it to the whole fleet, so
        every already-activated plant with that model is granted without anyone
        touching it. An already-registered model is a CONFLICT, not a silent
        update - two statements about one product could drift apart.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CertifyControlModelRequest" }
      responses:
        "201":
          description: Certified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlCertification" }
        "400": { description: Missing/invalid fields (German `message`). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
        "409": { description: This model is already in the register (German `message`). }
    delete:
      tags: [admin]
      summary: Take a model out of the register.
      parameters:
        - { name: brand, in: query, required: true, schema: { type: string } }
        - { name: model, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed; the fleet gets the smaller register. }
        "400": { description: This model is not in the register. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
  /api/v1/admin/control-activations:
    get:
      tags: [admin]
      summary: The plants whose battery control is armed.
      responses:
        "200":
          description: One row per armed device.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ControlActivation" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
  /api/v1/admin/devices/{deviceId}/control-activation:
    post:
      tags: [admin]
      summary: "\"Steuerung aktivieren\" - the ONE deliberate click per plant."
      description: >
        Arms this plant so a register-certified model may actually be written.
        It stays an explicit, safety-relevant decision (it is WRITE access to a
        customer's inverter) - the register only removes the need to REPROVE the
        model. Idempotent; publishes the retained certification document to the
        device immediately.
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { note: { type: string, maxLength: 512 } }
      responses:
        "200":
          description: Armed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlActivation" }
        "400": { description: Unknown device (German `message`). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
    delete:
      tags: [admin]
      summary: Disarm a plant - it falls back to read-only.
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Disarmed; the device is told immediately. }
        "400": { description: Unknown device, or it was not armed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a platform-admin. }
  /api/v1/admin/edge-releases:
    get:
      tags: [admin]
      summary: The edge release register (OTA Stufe 0).
      description: >
        Every registered edge release, NEWEST FIRST. `releaseSeq` is THE
        ordering - a monotonic integer, never a string or SHA comparison
        (decision D5). Without this register "outdated" was not well-defined:
        the fleet view compared a reported version against the fleet MAXIMUM
        (so "all equally old" read as "all current") and compared 12-char hex
        SHAs as number blocks, which is a random ordering on SHAs.
        Platform-admin only (the narrow `edge-release-publisher` role does NOT
        reach this route: the list carries every manifest and the author of
        every entry - more than registering needs). Read-only from the customer
        side, and there is NO write path towards any device here.
      responses:
        "200":
          description: The register, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EdgeRelease" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Register an edge release.
      description: >
        `version` must follow the release tag schema `edge-YYYY.MM.N`
        (edge-images already stamps `<tag>-<sha>`); a bare commit SHA is
        refused because it is exactly the uncomparable value the register
        replaces. `releaseSeq` may be omitted - it then continues the register
        (max + 1); passing it explicitly requires it to be strictly greater
        than every existing entry, so the ordering stays monotonic by
        construction. Registering an existing version with DEVIATING bytes is a
        409, never a silent no-op: the register is the paper trail. A repeat
        with BYTE-IDENTICAL `manifest`/`signature`/`notes` answers 200 with the
        stored entry instead - a re-run CI job behind a successful registration
        must not go red, and identical bytes swallow nothing.
        Reachable by `platform-admin` AND by the narrow `edge-release-publisher`
        service role used by the `edge-*` tag pipeline; that role reaches
        nothing else in the admin tree (no rollout, no wave, no device target).
        Since OTA Stufe 1 the body may additionally carry the SIGNED release
        (`manifest` + `signature`, byte for byte). The api stores those bytes
        unchanged and checks only CONSISTENCY - it deliberately does NOT verify
        the signature: the only verifier that matters is the DEVICE with its
        baked-in root, and a register that "blessed" a manifest would create
        confidence where nothing can be guaranteed. See docs/ota-signing.md.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEdgeReleaseRequest" }
      responses:
        "201":
          description: Release registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeRelease" }
        "200":
          description: >
            Already registered with BYTE-IDENTICAL manifest/signature/notes -
            the stored entry, unchanged (an idempotent CI re-run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeRelease" }
        "400": { description: Version does not match edge-YYYY.MM.N, or releaseSeq is not strictly increasing. }
        "409": { description: This version is already registered with DIFFERENT bytes. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/edge-releases/next-seq:
    get:
      tags: [admin]
      summary: The next free release sequence number.
      description: >
        The ONE thing the release publisher must read. `release_seq` lives
        INSIDE the signed manifest and the signature covers exactly its bytes,
        so the ordering has to be fixed BEFORE signing - the api cannot hand it
        out at registration time (the manifest would already carry a different
        number) and CI must not guess it.
        Deliberately a separate, narrow route rather than publisher access to
        the full register listing.
        HONEST LIMIT: between this read and the registration lies the signing
        step, so there is a TOCTOU window. If a second release registers in
        between, the POST fails LOUDLY on the monotonicity check and the run is
        repeated with the new number - reserving instead would punch holes into
        the ordering whenever a run aborts.
        Reachable by `platform-admin` and by `edge-release-publisher`.
      responses:
        "200":
          description: The next number, plus the current head of the register.
          content:
            application/json:
              schema:
                type: object
                required: [nextSeq]
                properties:
                  nextSeq: { type: integer, format: int64, example: 13 }
                  currentSeq:
                    type: integer
                    format: int64
                    nullable: true
                    description: Highest assigned number; null on an empty register.
                  currentVersion:
                    type: string
                    nullable: true
                    example: edge-2026.08.0
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/edge/trust-set/trust-set.json:
    get:
      tags: [registry]
      summary: The current root-signed trust-set (raw bytes), for a box being INSTALLED.
      security: []
      description: >
        One of the two files that go into `<data>/ota/` on the device; its
        sibling is `trust-set.json.sig` below. Serves the install-time TOFU
        moment - see docs/ota-signing.md §6.
        RAW BYTES, verbatim - deliberately NOT wrapped in a JSON envelope: in an
        envelope the document would be an ESCAPED JSON string, and the consumer
        is a shell installer that would then have to decode it by hand. That is
        exactly where silent byte drift creeps in and the signature stops
        verifying. So the routes are NAMED like the target files and the
        installer simply writes what it downloads (`curl -o`).
        THE TRUST BOUNDARY, and it is the whole reason this route may exist:
        a box being INSTALLED trusts its installation channel by definition
        (it just pulled its images over it), so serving the CURRENT
        root-signed trust-set over the same channel adds NO new trust - the
        box still verifies the ROOT signature itself against its BAKED-IN
        root, the channel only transports public material. LATER replacement
        stays OUT-OF-BAND: a RUNNING box never fetches a trust-set over the
        network (that would let the revocation anchor travel the channel it
        revokes), so there is no downlink and no device-side fetch; the core
        does not know this route. `update.sh` may DETECT a missing set and
        say how to fix it - it never downloads one.
        UNAUTHENTICATED on purpose: a box being installed has no token yet
        (the enrollment endpoints are open for the same reason), and what is
        handed out is public key material that is readable in git anyway
        (edge-app/ota/trust-set.json) - that readability is exactly what makes
        the trusted release keys auditable.
      responses:
        "200":
          description: The trust-set document, byte for byte.
          content:
            application/json:
              schema: { type: string, description: The verbatim bytes of trust-set.json. }
        "404":
          description: >
            No trust-set uploaded yet. The installer degrades with a loud
            warning plus the manual path and the install still SUCCEEDS - a box
            without a trust-set works fully, it just cannot (yet) apply a
            release.
  /api/v1/edge/trust-set/trust-set.json.sig:
    get:
      tags: [registry]
      summary: The detached root signature over the trust-set (raw bytes).
      security: []
      description: >
        The second of the two files - the cold root's signature over exactly
        the bytes served by `trust-set.json`. Same trust boundary, same raw-byte
        rule (see the sibling route). A set without its signature is worthless
        (the device refuses fail-closed), so an installer fetches both or
        neither.
      responses:
        "200":
          description: The detached signature, byte for byte.
          content:
            application/json:
              schema: { type: string, description: The verbatim bytes of trust-set.json.sig. }
        "404": { description: No trust-set uploaded yet. }
  /api/v1/admin/edge-trust-set:
    get:
      tags: [admin]
      summary: The current trust-set with its operator metadata.
      description: >
        What is in force, who uploaded it when, which RELEASE key ids it
        trusts and which ROOT key signed it. Platform-admin only (the narrow
        `edge-release-publisher` role may upload but not inspect - uploading
        needs none of this).
      responses:
        "200":
          description: The current trust-set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeTrustSet" }
        "404": { description: No trust-set uploaded yet. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin]
      summary: Set or replace the current root-signed trust-set.
      description: >
        Upload the two files from the ceremony (docs/ota-signing.md §3.4).
        A rotation is exactly this: a new, freshly root-signed set (§7.1).
        PUT because there is a SINGLETON - "the current set" is a resource,
        not a history; re-uploading identical bytes is therefore idempotent
        (a re-run automation job must not go red), and the HISTORY lives where
        it belongs, as a reviewable commit in edge-app/ota/.
        Reachable by `platform-admin` AND by the narrow `edge-release-publisher`
        service role (the trust-set comes out of the same ceremony as a release
        key, and the automation should be able to keep it current without an
        admin token in CI); that role still reaches no rollout and no device.
        The api stores the bytes UNCHANGED and checks only the FORM - it
        deliberately does NOT verify the root signature: the only verifier that
        matters is the DEVICE with its baked-in root. The form checks are: both
        documents parse, `alg` is ed25519 (never a fallback - the JWT alg
        hole), the signature's `domain` is `trust-set` (else a RELEASE
        signature would pass as a trust-set signature), and the SIGNING (root)
        key must NOT appear in the set itself - the invariant `vp-ota
        trust-set` already enforces, because a set containing the root could
        EXTEND the root. Note the key ids of the two files must DIFFER, unlike
        the release case where manifest and signature name the same key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveEdgeTrustSetRequest" }
      responses:
        "200":
          description: Trust-set stored; it is now what a fresh install receives.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeTrustSet" }
        "400": { description: The set or its signature is malformed (German message). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/edge-updates:
    get:
      tags: [admin]
      summary: Everything the platform page "Edge-Updates" shows (OTA Stufe 2).
      description: >
        ONE server-side aggregate (the /admin/fleet discipline): the release
        register, the newest rollout with its wave board, the fleet matrix
        (Anlage · Mandant · Ist · Soll · Zustand · seit · Grund) and the
        append-only audit journal.
        HONESTY RULES, enforced server-side: "unbekannt" is never "veraltet"
        (a device that reports nothing says nothing about its age), "offline" is
        never "fehlgeschlagen" (the assignment waits retained on the broker and
        is picked up on reconnect), every non-green state carries its reason,
        and the KPI percentages count only the REACHABLE set.
        The rollout shown is the NEWEST one whatever its state - a rollout that
        just auto-halted must not vanish from the page in the very moment
        something went wrong. Platform-admin only; there is deliberately NO
        customer-facing surface for updates.
      responses:
        "200":
          description: Releases, the newest rollout, the fleet matrix, the journal and the KPI.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/devices:
    get:
      tags: [admin]
      summary: The device INVENTORY over the whole lifecycle (platform page "Geräte").
      description: >
        The UNION of the sticker registry and the real fleet, joined on the
        external reference - one row per device, whichever half exists.
        It closes the finding that the page called "Geräte-Registry" did not
        contain the real fleet at all: its table listed only `VP-` sticker IDs,
        while the shipped boxes connect through self-generated `edge-`
        references and appeared there with ZERO rows.
        `deviceId == null` is a printed sticker ID that no customer has
        connected yet; `provisioned == false` is a connected device whose
        reference never came from the registry (the normal case for the
        installed base). A row that is not yet a device carries NO state -
        deriving one would be a claim about a device that does not exist.
        The state fields are the SAME derivation as the fleet row
        (RolloutStates), so the two surfaces can never disagree.
        Platform-admin only.
      responses:
        "200":
          description: One row per device - registry half, fleet half, or both.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/rollouts:
    post:
      tags: [admin]
      summary: Start a rollout of a SIGNED release in waves (OTA Stufe 2).
      description: >
        Only a SIGNED release can be rolled out (409 otherwise): without
        manifest bytes a device has nothing to check against its baked-in root,
        and the downlink would be an instruction without evidence.
        The FIRST wave is assigned immediately; every further wave is
        hand-advanced (decision D4) unless `autoAdvance` is true (OTA Stufe 4) -
        which changes only WHO presses "next wave": the same bake criterion, the
        same automatic halt on any failure, the same final emergency stop. At most ONE rollout may be live (active or
        paused) - two concurrent distributions could assign the same device two
        targets, and an auto-halt would no longer be attributable.
        Assigning publishes the signed manifest RETAINED on
        `ems/{t}/{s}/{d}/v2/update` (contract mqtt-ota-target.schema.json). It
        applies NOTHING: the device verifies, and a human at the device applies
        (`update.sh --from-target`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [releaseSeq, waves]
              properties:
                releaseSeq: { type: integer, format: int64 }
                channel: { type: string, enum: [canary, stable] }
                autoAdvance:
                  type: boolean
                  default: false
                  description: >
                    OTA Stufe 4: release the next wave automatically once the
                    bake criterion is met. ABSENT = hand-advanced, which stays
                    the default (D4).
                waves:
                  type: array
                  items:
                    type: object
                    required: [devices]
                    properties:
                      name: { type: string }
                      devices:
                        type: array
                        items: { type: string, format: uuid }
      responses:
        "201": { description: Rollout created; the first wave is assigned. }
        "400": { description: No waves, an empty wave, an unknown device, or a device in two waves. }
        "404": { description: The release is not registered. }
        "409": { description: The release is not signed, or a rollout is already live. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/rollouts/{rolloutId}/promote:
    post:
      tags: [admin]
      summary: Release the next wave - gated by the bake criterion.
      description: >
        REFUSED (409, with the reason) while the running wave is not fully
        confirmed. The criterion is decision D4: 24 h healthy AND at least one
        real control cycle per device. The cycle half is THREE-valued - on a
        plant where VoltPilot does not (yet) control, that evidence cannot
        exist, so it reports "nicht_pruefbar" and is visibly excluded rather
        than silently assumed. The gate lives on the server, not only in a
        greyed-out button.
      parameters:
        - name: rolloutId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: The next wave is assigned. }
        "404": { description: Rollout not found. }
        "409": { description: Bake criterion still open, all waves released, or the rollout is not active. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/rollouts/{rolloutId}/auto-advance:
    post:
      tags: [admin]
      summary: Switch the wave advance between automatic and by hand (OTA Stufe 4).
      description: >
        Loosens NOTHING - the same bake criterion, the same automatic halt, the
        same final emergency stop; it only replaces the click on "next wave"
        once the criterion is met anyway. Reversible while the rollout is active
        or paused; a HALTED or DONE rollout refuses (409) because continuing is
        a new, deliberate rollout.
      parameters:
        - name: rolloutId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "204": { description: Switched (idempotent). }
        "404": { description: Rollout not found. }
        "409": { description: The rollout is halted or done. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/rollout-journal.md:
    get:
      tags: [admin]
      summary: The append-only audit journal as Markdown (OTA Stufe 4, optional gitops mirror).
      description: >
        An EXPORT, not a deploy. The api holds no gitops write token; committing
        the file is done outside by an operator or cron
        (`tools/deploy/mirror-rollout-journal.sh`, see docs/deploy.md) - a write
        credential in the api would be a new attack surface for something that,
        per decision D2, must not be in the acting path at all. The authority
        over the fleet's desired state remains the portal DB plus the retained
        MQTT message; nothing is ever read back from the mirror.
        The output is DETERMINISTIC - the same state yields the same bytes, so a
        repeated mirror run produces no commit.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 1000, maximum: 5000 }
      responses:
        "200":
          description: The journal.
          content:
            text/markdown:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/rollouts/{rolloutId}/pause:
    post:
      tags: [admin]
      summary: Pause a rollout (reversible).
      parameters:
        - name: rolloutId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Paused - nothing further is assigned. }
        "409": { description: Only a running rollout can be paused. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/rollouts/{rolloutId}/resume:
    post:
      tags: [admin]
      summary: Resume a paused rollout.
      parameters:
        - name: rolloutId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Running again. }
        "409": { description: Only a paused rollout can be resumed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/rollouts/{rolloutId}/halt:
    post:
      tags: [admin]
      summary: Not-Aus - freeze a rollout (deliberately final).
      description: >
        Nothing further is distributed. Assignments already made REMAIN -
        withdrawing them would send a half-updated fleet to a third state; what
        stops is the rolling on. "Continue" after a freeze is a new, deliberate
        rollout, not a click that skips the cause.
        The watcher triggers the same transition automatically on any device
        reporting failed / rolled_back / gone silent while applying (D4).
      parameters:
        - name: rolloutId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "204": { description: Frozen. }
        "404": { description: Rollout not found. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/devices/{deviceId}/update-target:
    post:
      tags: [admin]
      summary: Assign ONE device a release (channel + pin).
      description: >
        The single-device path behind "Jetzt aktualisieren" and the channel/pin
        controls of the device registry page. `pinned` is the statement "this
        device stays where it is" - a rollout does not overwrite a pinned
        assignment, it visibly SKIPS the device. Only a signed release is
        assignable (409 otherwise).
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [releaseSeq]
              properties:
                releaseSeq: { type: integer, format: int64 }
                channel: { type: string, enum: [canary, stable] }
                pinned: { type: boolean }
      responses:
        "204": { description: Assigned; the signed manifest went out retained. }
        "404": { description: Device or release not found. }
        "409": { description: The release is not signed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/devices/{deviceId}/apply:
    post:
      tags: [admin]
      summary: Approve applying the assigned release ONCE ("Jetzt anwenden").
      description: >
        The one-shot apply approval (OTA Portal-Apply, concept
        `vp-admin-geraete-ux-k2` §6/E3). It is WORD FOR WORD the approval the
        operator used to give at the device's own `:8484` page behind the device
        password - only the transport changed: it travels NON-RETAINED on
        `ems/{t}/{s}/{d}/v2/apply` (contract
        `docs/contracts/mqtt-ota-apply.schema.json`) and the device consumes it
        through the very same code path its own button uses.


        The security posture is therefore UNCHANGED: the approval opens ONLY the
        first gate of the device's apply decision, for exactly ONE release (the
        one the operator saw) and exactly ONE operation, and it expires after 15
        minutes. Device autonomy stays OFF, and every later gate - signature
        chain against the baked root, anti-rollback floor, the neutral-time rule
        of a CONTROLLING plant, interlock, disk guard, self-test, LKG rollback,
        the rollout's auto-halt - applies unchanged. It is a POINT-IN-TIME
        authorization, never a content authorization.


        NON-retained is load-bearing: a retained message is redelivered on every
        reconnect, so a one-shot approval placed there would not be one. A box
        that is offline right now therefore does NOT get the approval delivered
        later - deliberately, because a consent from three hours ago is not a
        consent for now. The portal shows that as the approval state
        `verfallen` ("nicht abgeholt") instead of waiting silently; the state
        rides the additive `apply` block of the fleet/device rows.


        Platform-admin ONLY - the narrow `edge-release-publisher` account never
        reaches a device.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202": { description: The approval went out to the device. }
        "404": { description: Device not found. }
        "409":
          description: >
            Nothing to apply (no assignment), the device REJECTED the assigned
            release (broken chain), the device reports it cannot apply right now
            (no updater running), or an approval is already open. The German
            reason is in the `message` body.
        "503":
          description: >
            The approval could NOT be sent (broker unreachable). Nothing was
            approved and nothing recorded - the approval IS the message.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/devices/{deviceId}/update-target/revert:
    post:
      tags: [admin]
      summary: Withdraw a device's assignment.
      description: >
        The row goes AND the retained message is cleared - otherwise an
        instruction nobody owns any more would wait on the broker for the
        device to return.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Withdrawn. }
        "404": { description: Device not found. }
        "409": { description: This device has no assignment. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/provisioned-devices:
    get:
      tags: [admin]
      summary: List the manufacturing registry of sticker Geräte-IDs.
      description: >
        Platform-wide view of every provisioned (manufactured) device ID and its
        claim state - which tenant, if any, has connected it.
      responses:
        "200":
          description: All provisioned devices.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProvisionedDevice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Register a manufactured sticker Geräte-ID.
      description: >
        Registers a device ID (canonicalized like the claim path - trimmed,
        uppercased) so a customer can claim it. Only sticker-format IDs
        (prefix `VP-`) are accepted. Idempotent - re-registering an existing ID
        returns 200 with the unchanged entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProvisionDeviceRequest" }
      responses:
        "200":
          description: Already registered - the existing, unchanged entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisionedDevice" }
        "201":
          description: Geräte-ID registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisionedDevice" }
        "400": { description: Blank or non-sticker-format (missing VP- prefix) Geräte-ID. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/provisioned-devices/{externalRef}:
    delete:
      tags: [admin]
      summary: Remove a wrongly registered sticker Geräte-ID from the registry.
      description: >
        Refused (409) while a customer's claim references the ID - the device
        must be unclaimed first. The path ref is canonicalized like the claim
        path (trimmed, uppercased).
      parameters:
        - { name: externalRef, in: path, required: true, schema: { type: string }, example: VP-1234-ABCD }
      responses:
        "204": { description: Registry entry removed; the ID can no longer be claimed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No such registry entry. }
        "409": { description: The ID is claimed by a customer; unclaim the device first. }
  /api/v1/admin/enrollments/pending:
    get:
      tags: [admin]
      summary: List enrolled-but-unclaimed devices.
      description: >
        Operator view onto devices that uploaded an enrollment CSR but have no
        matching claimed device row (the ref was never claimed - e.g. a customer
        typed a different reference - or was unclaimed after issuance). Surfaces
        the otherwise-invisible half of a mistyped-reference dead-end. Read-only;
        the device-facing enrollment poll stays opaque (pending == unknown).
      responses:
        "200":
          description: Pending (enrolled-but-unclaimed) enrollments, newest CSR first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PendingEnrollment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/fleet:
    get:
      tags: [admin]
      summary: The ONE fleet aggregate behind the platform overview (Flotten-Puls).
      description: >
        One row per site across ALL tenants, server-side: the overview core
        fields (device liveness from each device's newest telemetry ARRIVAL,
        5-min window; worstStatus stale > waiting > online), the age of the
        newest optimizer run, the control/curtailment evidence, the reported
        edge version, the reported source health, and the SERVER-derived
        maintenance flags (B4: tariff, battery without device, kWp plausibility,
        fleet-wide forecast outliers). It replaces the platform overview's
        client-side loop over tenants; the surface stays the same.
        Platform-admin only (a customer token gets 403), read-only, and the
        cross-tenant read is confined to the dedicated BYPASSRLS admin
        datasource exactly like the other /api/v1/admin/** reads - customer
        endpoints stay on the RLS path untouched.
        Honesty is part of the contract: a block nobody measured is null and
        carries its reason - never a fabricated zero, never a guessed verdict.
      responses:
        "200":
          description: One row per site, tenant then site name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFleet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/sites/{siteId}/v2-entities:
    get:
      tags: [admin]
      summary: List a site's v2 entity registry rows (E1a pilot).
      description: >
        Platform-admin, through the RLS-scoped path via the X-Tenant-Id
        switcher (no or wrong tenant selected => 404). Entities are
        measurement_point rows with a non-null entityType; capabilities and
        guards carry the docs/contracts/v2/edge-entity.schema.json objects
        verbatim.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's v2 entities.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/V2Entity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
  /api/v1/admin/sites/{siteId}/v2-entities/adopt:
    post:
      tags: [admin]
      summary: Adopt an edge-reported source into a v2 entity (U2 "Vom Gerät gemeldet").
      description: >
        U2 adoption bridge (report §3.3, admin-only first increment): the
        customer's :8484 device reports a source (go-e wallbox, AC-coupled PV, a
        grid meter) in its heartbeat local_setup; this creates the matching
        entity in ONE step, prefilled from the report + the type catalog, and
        PINS it to the reporting source (`sourceId`) so the "Vom Gerät gemeldet"
        matcher is deterministic and re-adoption is idempotent (a re-adopt
        returns the existing entity). A non-composed consumer type is created
        like a v2-native entity; a composed producer/grid-meter is recorded as a
        read-only source measurement point (its kWp / MaStR SEE # are the
        customer-only master data captured here - the ErzeugerSourcesPanel job,
        §3.4). Platform-admin, through the RLS-scoped X-Tenant-Id switcher.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId, entityType]
              properties:
                sourceId: { type: string, description: The edge source id from local_setup. }
                entityType: { type: string, example: wallbox }
                label: { type: string }
                maxPowerKw: { type: number, description: Consumer rated power (bounds commands). }
                capacityKwp: { type: number, description: Producer nameplate (kWp). }
                registryUnitId: { type: string, description: MaStR SEE number of the source. }
      responses:
        "200":
          description: The adopted (or already-existing) entity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2Entity" }
        "400": { description: Missing sourceId/entityType or unknown type. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
        "422": { description: The type cannot be adopted as a source (e.g. battery-hybrid). }
  /api/v1/admin/sites/{siteId}/v2-entities/preview:
    get:
      tags: [admin]
      summary: Dry-run the v1->v2 conversion (MIG migration step 1) - writes nothing.
      description: >
        The migration runbook review step: reports EXACTLY what
        /v2-entities/bootstrap would create/refresh from the site's current v1
        master data - the entities, their derived topology roles, capabilities
        and guards, and the resolved gateway device - WITHOUT touching any
        table. `action` is `create` for a row that would newly become a v2
        entity and `refresh` for one already stamped (re-run). Idempotent + safe
        to call repeatedly while reviewing.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The conversion plan (nothing written).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2ConversionPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
  /api/v1/admin/sites/{siteId}/v2-entities/history-cutover:
    get:
      tags: [admin]
      summary: The site's v1->v2 history bridge cutover instant (null = un-migrated).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The current cutover (cutoverAt null when un-migrated).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2HistoryCutover" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
    put:
      tags: [admin]
      summary: Set the history cutover (portal Historie splices v1 before / v2 after).
      description: >
        MIG runbook: called when the site goes live on v2 so the portal Historie
        switches its data source at this instant (v1 5-channel telemetry before,
        v2 per-entity reconstruction after). Body `at` optional - defaults to now.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { at: { type: string, format: date-time } }
      responses:
        "200":
          description: The applied cutover instant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2HistoryCutover" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
    delete:
      tags: [admin]
      summary: Clear the history cutover (MIG rollback - Historie reverts to pure v1).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
  /api/v1/admin/sites/{siteId}/v2-entities/bootstrap:
    post:
      tags: [admin]
      summary: Create/refresh the three pilot entities from the site's v1 master data.
      description: >
        The E1a pilot-mapping utility (used by the E13a cutover; nothing
        converts automatically): battery asset -> battery-hybrid entity (creates
        the site's control measurement_point row when absent), pv-generation
        points -> producer entities, the grid-meter point -> grid-meter entity.
        Idempotent - re-running refreshes capabilities/guard config from the
        current master data. Afterwards the registry is pushed BEST-EFFORT as
        one retained message on ems/{t}/{s}/{d}/v2/entities (the response's
        push block reports whether it went out).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Resulting entities + skipped notes + push outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2EntityBootstrapResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
  /api/v1/admin/sites/{siteId}/v2-entities/adopt-from-device:
    post:
      tags: [admin]
      summary: Bestands-Übernahme jetzt versuchen (Einheitsmodell Stufe 2).
      description: >
        Die Übernahme läuft ohnehin AUTOMATISCH (getakteter Abgleich); diese
        Route stößt sie ohne Wartezeit an und - vor allem - nennt den GRUND,
        wenn eine Anlage noch box-verwaltet ist ("meldet noch nicht, wie ihre
        Geräte angebunden sind", "steht noch nicht in unserem
        Geräte-Verzeichnis", …). Sie ist ALLES ODER NICHTS: ein unvollständig
        gemeldetes Ist übernimmt gar nichts.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Ausgang der Prüfung (übernommen oder der Grund dagegen).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentAdoptionOutcome" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
  /api/v1/admin/sites/{siteId}/v2-entities/revert-to-device:
    post:
      tags: [admin]
      summary: Der RÜCKWEG - die Anlage wieder am Gerät verwalten lassen.
      description: >
        Nimmt AUSSCHLIESSLICH die Autorität zurück (component_authority ->
        box). Die gespeicherten Definitionen bleiben stehen - sie sind der
        Beleg, was übernommen wurde, und der Weg zurück nach vorn. Der folgende
        Registry-Push trägt das Autoritäts-Feld dann nicht mehr, womit der
        Applier auf der Box strukturell nichts mehr anwendet und :8484 wieder
        bedient. Der Übernahme-Stempel wird gelöscht, damit der getaktete
        Abgleich die Anlage erneut betrachtet.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Ausgang.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentAdoptionOutcome" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
  /api/v1/admin/sites/{siteId}/v2-entities/push:
    post:
      tags: [admin]
      summary: Re-push the stored v2 entity registry to the gateway device.
      description: >
        Composes the current registry push payload and publishes it retained
        (best-effort; e.g. after a broker outage or a device re-claim).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Current entities + push outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2EntityBootstrapResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
    post:
      tags: [admin]
      summary: Create a v2-native entity of an open catalog type (E1b).
      description: >
        Create an entity of an open catalog type (wallbox / heating-rod /
        generic-load / ...; the type catalog at GET
        /api/v1/admin/entity-type-catalog is the truth). capabilities and
        guards default from the catalog (bounded by maxPowerKw); explicit
        JSON overrides are validated against the contract shapes. A COMPOSED
        pilot type (battery-hybrid/producer/grid-meter) is refused (422) -
        those are maintained through their v1 master data + the bootstrap.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveV2EntityRequest" }
      responses:
        "200": { description: The created entity., content: { application/json: { schema: { $ref: "#/components/schemas/V2Entity" } } } }
        "400": { description: Unknown type / invalid capabilities or guards. }
        "422": { description: A composed pilot type cannot be created directly. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
  /api/v1/admin/sites/{siteId}/v2-entities/{pointId}:
    put:
      tags: [admin]
      summary: Edit a v2 entity (label; config only for non-composed types).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: pointId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveV2EntityRequest" }
      responses:
        "200": { description: The updated entity., content: { application/json: { schema: { $ref: "#/components/schemas/V2Entity" } } } }
        "400": { description: Invalid capabilities or guards. }
        "422": { description: A composed pilot type's config is not editable here. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Entity/site not found (or no tenant selected). }
    delete:
      tags: [admin]
      summary: Remove a v2 entity (v1-backed rows only lose their entity config).
      description: >
        purgePoint=true additionally deletes the measurement point outright -
        its kWp is released from the aggregate asset.pv and its edge-source pin
        is freed. The duplicate-cleanup lever (vp-vier-erzeuger-p9): without it
        a wrongly adopted duplicate keeps its pinned point and reappears as
        "Neues Gerät gefunden" forever.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: pointId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: purgePoint, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Entity/site not found (or no tenant selected). }
  /api/v1/admin/entity-type-catalog:
    get:
      tags: [admin]
      summary: The data-driven entity-type catalog the admin entity editor uses.
      description: >
        The one truth for known entity types (entitytypes/catalog.json):
        category (steers edge guard semantics), controllable, composed, and
        the default capabilities/guards/failsafe seeded on create. Adding a
        type is catalog data + an optional edge driver, never a schema release.
      responses:
        "200": { description: The catalog document., content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/sites/{siteId}/entities:
    get:
      tags: [sites]
      summary: The site's v2 entities with Soll/Ist drift + the edge-local commissioning view.
      description: >
        The customer "Geräte & Entitäten" surface: the composed registry Soll
        (revision) reconciled against the edge-reported observed Ist (health,
        last telemetry, applied revision) - drift is SURFACED via syncStatus
        (in_sync | pending | missing_on_device | unreported | never_pushed),
        never silently resolved. localSetup is the edge-authoritative
        commissioning view (:8484 inverter/sources); staleOnDevice lists
        entities the edge still reports that the registry no longer contains.
        Tenant-scoped (foreign site 404); admins read via the X-Tenant-Id
        switcher, WRITES stay under /admin/.../v2-entities.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The site's entity surface., content: { application/json: { schema: { $ref: "#/components/schemas/SiteEntities" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found. }
  /api/v1/sites/{siteId}/entities/{entityId}/history:
    get:
      tags: [sites]
      summary: Per-entity channel history over the v2 telemetry rollups.
      description: >
        Channel-keyed bucket series of one entity: day = live 15-min buckets
        from raw telemetry_v2, week = hourly rollup, month/year = Europe/Berlin
        daily rollup (the v1 history discipline). RLS-scoped.
        For a COMPOSED entity (battery-hybrid / grid-meter / house-load) the
        part of the window BEFORE the v2 era is reconstructed read-side from the
        site's v1 telemetry through the same channel map the writer's
        ComposedEntityFanout writes forward with, spliced at
        max(site.v2_history_cutover_at, the entity's first v2 sample in the
        window) - v1 owns buckets starting before it, v2 those at/after it, so
        the series is gap-free and overlap-free across the migration. Nothing is
        copied. A v2-native entity (wallbox, generic Modbus) is pure v2.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: range, in: query, required: false, schema: { type: string, enum: [day, week, month, year], default: day } }
        - { name: at, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200": { description: The channel series., content: { application/json: { schema: { $ref: "#/components/schemas/EntityHistory" } } } }
        "400": { description: Bad range. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Entity/site not found. }
  /api/v1/component-templates:
    get:
      tags: [templates]
      summary: The component templates the later add-component assistant renders from.
      description: >
        Einheitsmodell Stufe 0a. Newest version per template_ref, sorted by
        brand then model. ONLY the public origins (`builtin` + `certified`) are
        served - a `custom` template (private per Anlage, Stufe 3) has no tenant
        fence on this global table and is therefore never returned.
        Authenticated, not admin-gated (a template is the device choice the
        customer sees, not internals). An EMPTY list means the register is empty
        (the startup mirror did not run), never "there are no devices".
      responses:
        "200":
          description: The public templates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ComponentTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/component-templates/{templateRef}:
    get:
      tags: [templates]
      summary: One component template (newest version).
      description: >
        Unknown AND non-public answer identically with 404, so the route never
        reveals whether a key exists (the enrollment "pending == unknown"
        discipline).
      parameters:
        - name: templateRef
          in: path
          required: true
          description: >
            The stable, OPAQUE template key (built-in templates use
            `builtin:<brand>:<model>`). Never parse it - brand/model ride as
            their own fields.
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9._:-]{0,127}$" }
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Unknown or non-public template. }
  /api/v1/sites/{siteId}/components:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [components]
      summary: The plant's components, with the authority + Soll/Ist state.
      description: >
        Einheitsmodell Stufe 1. `componentAuthority` says WHO owns this plant's
        device configuration (`box` | `portal`) - the portal offers the add
        assistant ONLY on a portal-managed plant, because a Soll saved on a
        box-managed one would never take effect. `appliedRevision` is what the
        BOX reported it really applied; `null` means UNKNOWN (older edge, no
        heartbeat yet), never "did not arrive". A refusal rides NEXT TO the
        applied revision, never in its place - what runs is still the last
        configuration that really worked.
      responses:
        "200":
          description: The components.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site (or component) not found for this tenant. }
    post:
      tags: [components]
      summary: Add a component (assistant step 4).
      description: >
        Brand/model/family/communication come from the TEMPLATE, never from the
        body - a client cannot save an inconsistent connection. Requires a
        PASSED connection test for exactly this plant + template + connection
        (422 otherwise): since this stage the stored Soll IS the plant's read
        path, and a typo in the IP makes it blind.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveComponentRequest" }
      responses:
        "200":
          description: The plant's components after the write.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "400": { description: Unknown template or role. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site (or component) not found for this tenant. }
        "409":
          description: >
            Box-managed plant, or the plant already has this component
            (at most one grid meter / one inverter). German `message`.
        "422": { description: No passed connection test for this connection. }
  /api/v1/sites/{siteId}/components/{entityId}:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - name: entityId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [components]
      summary: Change a component's connection - a NEW version.
      description: >
        The previous version stays retrievable. The connection test is required
        here too: a change can blind a running plant exactly like a first setup.
        The component's ROLE cannot change (that is a delete plus an add).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveComponentRequest" }
      responses:
        "200":
          description: The plant's components after the write.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site (or component) not found for this tenant. }
        "409": { description: Box-managed plant, or a role change was attempted. }
        "422": { description: No passed connection test for this connection. }
  /api/v1/sites/{siteId}/components/{entityId}/versions:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - name: entityId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [components]
      summary: The component's definition versions, newest first.
      responses:
        "200":
          description: The versions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ComponentDefinition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site (or component) not found for this tenant. }
  /api/v1/sites/{siteId}/components/{entityId}/versions/{version}/rollback:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - name: entityId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      tags: [components]
      summary: Roll a component back to an earlier version.
      description: >
        WRITES a new version carrying the old content instead of deleting one -
        "what ran last week" stays answerable, and the way back is the same way
        as any other change. No connection test is required: this connection was
        stored before and passed its test then; demanding a new one would block
        the way out of a mistake exactly when the device is not answering.
      responses:
        "200":
          description: The plant's components after the rollback.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Unknown component or version. }
        "409": { description: Box-managed plant. }
  /api/v1/sites/{siteId}/component-test:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [components]
      summary: Connection test - the box reads the not-yet-saved device once.
      description: >
        Runs the assistant's connection test over the Probe-Kanal
        (docs/contracts/mqtt-probe.schema.json, op `test_connection`) - the SAME
        machinery the device's own `:8484` button has always used, generalized
        to every transport. A SUCCESS also records the receipt that unlocks
        saving (for exactly this plant + template + connection); a failure
        records nothing. A timeout is an honest OUTCOME (HTTP 200 with
        `errorCode: timeout`), not an error. Nothing is persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateRef, connection]
              properties:
                templateRef: { type: string }
                role: { type: string, enum: [inverter, pv-generation, grid-meter, consumer] }
                connection:
                  type: object
                  additionalProperties: true
                  description: The template's transport_schema fields, passed through.
                deviceId:
                  type: string
                  format: uuid
                  description: >
                    Optional - the box to ask. Absent means "the plant's single
                    device"; a plant with several must name one.
      responses:
        "200":
          description: The device's answer (honest outcome, including a timeout).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeResult" }
        "400": { description: Unknown template / malformed request. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site (or component) not found for this tenant. }
        "409": { description: The plant has no device, or several and none was named. }
        "503": { description: The plant is not reachable right now. }
  /api/v1/sites/{siteId}/components/custom/read:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [components]
      summary: "\u201eJetzt lesen\u201c - read ONE channel of a self-built Modbus device, once."
      description: >
        The Einheitsmodell Stufe 3 live preview: the box reads the register over
        the Probe-Kanal and answers with the RAW and the SCALED value side by
        side - the moment a scaling mistake becomes visible. It is also the
        connection test of step 1: a SUCCESS records the receipt that unlocks
        saving (keyed on the CONNECTION, not the channel, so a changed scale
        needs no new read while a changed address does). Nothing is persisted;
        a timeout is an honest OUTCOME (HTTP 200 with `errorCode`), not an
        error. LAN-only is enforced here AND independently on the box.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelfBuildReadRequest" }
      responses:
        "200":
          description: The reading, or an honest classified failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelfBuildReadResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
        "409": { description: The plant has no device, or several and none was named. }
  /api/v1/sites/{siteId}/components/custom:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [components]
      summary: Create a SELF-BUILT Modbus device (Einheitsmodell Stufe 3).
      description: >
        Creates a normal v2 entity (`modbus-generic`, measure-only) with the
        customer's plain-text channels, stores the definition as version 1 and
        compiles + rolls out its generated READ flow through the existing
        flowc / `v2/flows` machinery. Requires a receipt from a successful
        `components/custom/read` for this plant + connection (422 otherwise).
        Only on a PORTAL-managed plant (409 on a box-managed one). This stage
        creates measuring devices only - switching is a later stage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveSelfBuildRequest" }
      responses:
        "200":
          description: The plant's components, including the new one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "400": { description: Channel/poll-budget/LAN rule violated - the reason is German. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
        "409": { description: The plant's devices are managed on the box. }
        "422": { description: No connection test on record for this connection. }
        "503": { description: The read plan could not be built or distributed. }
  /api/v1/sites/{siteId}/components/custom/{entityId}:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [components]
      summary: Change a self-built device - a NEW version, the old stays retrievable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveSelfBuildRequest" }
      responses:
        "200":
          description: The plant's components.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "400": { description: Channel/poll-budget/LAN rule violated. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or component not found for this tenant. }
        "422": { description: Not a self-built component, or no connection test on record. }
    delete:
      tags: [components]
      summary: Remove a self-built device - together with its generated read flow.
      description: >
        Recorded measurements stay in the history - they WERE measured, and
        removing a device does not un-measure its past.
      responses:
        "200":
          description: The plant's remaining components.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or component not found for this tenant. }
        "422": { description: Not a self-built component. }
  /api/v1/sites/{siteId}/components/custom/{entityId}/switch-test:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [components]
      summary: The guided switch test - writes ONCE, bounded by an on-device auto-off.
      description: >
        Einheitsmodell Stufe 4. The box ARMS its automatic off BEFORE it writes,
        so a lost answer can never leave the device on. This is not a release
        yet: it records the receipt the release then requires, keyed to THIS
        exact switch definition - a changed address is a different register and
        invalidates it. A timeout is an honest OUTCOME (200 with errorCode),
        never an error: the write may have landed and only its answer got lost.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchTestRequest" }
      responses:
        "200":
          description: The outcome of the test - passed, or a named refusal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwitchTestResult" }
        "400": { description: The switch definition is impossible (German reason). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or component not found for this tenant. }
        "422": { description: Test value outside the released clamp, or not a self-built device. }
  /api/v1/sites/{siteId}/components/custom/{entityId}/switch-test/cancel:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [components]
      summary: Abort the running test - writes the off/safe value IMMEDIATELY.
      description: >
        Restates the register in full instead of relying on a remembered state
        on the box, so an abort works even after a restart.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchTestRequest" }
      responses:
        "200":
          description: The outcome of the abort.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwitchTestResult" }
        "400": { description: The switch definition is impossible (German reason). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or component not found for this tenant. }
  /api/v1/sites/{siteId}/components/custom/{entityId}/switch-release:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [components]
      summary: Release switching - only with a PASSED test AND the confirmed effect.
      description: >
        The test proves the register is reachable; the confirmation proves the
        RIGHT device reacted - neither alone carries both statements. On
        success the component becomes a switchable device (type, capability,
        consumer clamp) and the switch is compiled into its device flow. The
        device release REPLACES the type certification, which is structurally
        impossible for arbitrary self-built devices; it never replaces the
        operator emergency stop.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchReleaseRequest" }
      responses:
        "200":
          description: The plant's components, with this one now switchable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "400": { description: Switch or consumer data invalid (German reason). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or component not found for this tenant. }
        "422": { description: No passed test on THIS definition, or the effect was not confirmed. }
    delete:
      tags: [components]
      summary: Revoke the release - the device is a sensor again, immediately.
      description: >
        The switch node leaves the flow, the capability leaves the component,
        and the rules pointing at it stop. The DEFINITION stays stored - a
        revoke is not evidence destruction - but the test receipt falls, because
        it belonged to a state that no longer exists.
      responses:
        "200":
          description: The plant's components, with this one measuring only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteComponents" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or component not found for this tenant. }
        "422": { description: Not a self-built component. }
  /api/v1/sites/{siteId}/components/custom/{entityId}/duplicate:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [components]
      summary: "\u201eDuplizieren\u201c - turn a device into a PRIVATE template of this plant."
      description: >
        Captain scope 4 - templates are per plant and private, no catalog, no
        sharing. The ADDRESS deliberately does not travel: a template describes
        a device TYPE, not a specimen.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 200 }
      responses:
        "200":
          description: The plant's private templates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteComponentTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or component not found for this tenant. }
  /api/v1/sites/{siteId}/component-templates:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [components]
      summary: The PRIVATE device templates of this plant.
      description: >
        Tenant-scoped by RLS (own table `site_component_template`) - a private
        template is customer data and never appears on the public
        `/api/v1/component-templates` route, which serves product statements
        (builtin/certified) only.
      responses:
        "200":
          description: The plant's private templates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteComponentTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/component-templates/{templateRef}:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: templateRef, in: path, required: true, schema: { type: string } }
    put:
      tags: [components]
      summary: Rename a private template (Einheitsmodell Stufe 6).
      description: >
        FULL representation of name and note. A blank name is refused (a
        nameless template cannot be told apart in the picker); an ABSENT note
        CLEARS it - the semantics of the component alias. No new version is
        created: a template IS its read plan, and a name changes nothing about
        it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteComponentTemplateRequest" }
      responses:
        "200":
          description: The plant's private templates after the rename.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteComponentTemplate" }
        "400": { description: Blank name. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or template not found for this tenant. }
    delete:
      tags: [components]
      summary: Remove a private template. Devices created from it stay.
      responses:
        "200":
          description: The plant's remaining private templates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SiteComponentTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or template not found for this tenant. }
  /api/v1/admin/component-templates:
    get:
      tags: [admin]
      summary: EVERY template version, incl. the withdrawn ones (Stufe 6).
      description: >
        Einheitsmodell Stufe 6, platform-admin only. Unlike the customer-facing
        `/api/v1/component-templates` (newest SELECTABLE version per key) this
        answers the operator question: which versions exist, who entered them,
        and how many components of the fleet stand on that key
        (`usedByComponents`). Read through the BYPASSRLS admin role - the
        register is global (no tenant_id, no RLS), the endpoint is the fence.
      responses:
        "200":
          description: All versions, sorted by brand/model, newest version first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminComponentTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a Portal-Admin. }
    post:
      tags: [admin]
      summary: Enter a NEW checked template (version 1) - as DATA, not a release.
      description: >
        The key is DERIVED from brand + model (`certified:<brand>:<model>`) and
        deliberately NOT a request field - it is opaque by contract. `channels`
        and `writes` are absent = "this template does not explain it here"; an
        EMPTY array is REFUSED instead of silently nulled (it would claim
        "delivers no measurements" / "cannot switch anything"). A template that
        carries a write definition must be `certified`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveComponentTemplateRequest" }
      responses:
        "201":
          description: The stored version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminComponentTemplate" }
        "400": { description: Rejected, with a German reason naming every fault. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a Portal-Admin. }
        "409": { description: The key already exists - add a version instead. }
  /api/v1/admin/component-templates/{templateRef}/versions:
    parameters:
      - { name: templateRef, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      summary: Add a new VERSION of an existing checked template.
      description: >
        A version is never overwritten - "what ran last week" must stay
        answerable. Brand and model belong to the key and cannot change (409).
        BUILT-IN templates are refused (409): they belong to the startup mirror
        of the Go catalog and a hand edit would be gone at the next restart.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveComponentTemplateRequest" }
      responses:
        "201":
          description: The new version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminComponentTemplate" }
        "400": { description: Rejected, with a German reason. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a Portal-Admin. }
        "404": { description: Unknown template. }
        "409": { description: Built-in, or brand/model changed. }
  /api/v1/admin/component-templates/{templateRef}/versions/{version}/withdraw:
    parameters:
      - { name: templateRef, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    post:
      tags: [admin]
      summary: Take a version out of the assistant's choice (NOT a delete).
      description: >
        Withdrawing NEVER breaks a component: the version snapshot on
        `measurement_point` carries no foreign key, so a running component keeps
        its version and history. Only the CHOICE changes - and because the
        filter sits INSIDE the version pick, withdrawing version 2 falls BACK to
        version 1. Reversible via `/restore`. There is deliberately no delete.
      responses:
        "200":
          description: The withdrawn version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminComponentTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a Portal-Admin. }
        "404": { description: Unknown version. }
        "409": { description: Built-in templates are not editable here. }
  /api/v1/admin/component-templates/{templateRef}/versions/{version}/restore:
    parameters:
      - { name: templateRef, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    post:
      tags: [admin]
      summary: Put a withdrawn version back into the choice.
      responses:
        "200":
          description: The restored version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminComponentTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a Portal-Admin. }
        "404": { description: Unknown version. }
        "409": { description: Built-in templates are not editable here. }
  /api/v1/admin/component-fleet:
    get:
      tags: [admin]
      summary: The component world of the WHOLE fleet, one row per plant (Stufe 6).
      description: >
        Einheitsmodell Stufe 6, platform-admin only, READ-ONLY - it creates no
        new write path. It answers the three operating questions that were only
        answerable per plant before: where devices are maintained
        (`componentAuthority`), where the components come from (`sources`), and
        where Soll differs from Ist (`syncStatus`, the SAME derivation the
        customer surface uses). Where the box reported nothing the field is
        ABSENT - "unknown", never 0 and never "not arrived".
      responses:
        "200":
          description: One row per plant across every tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminComponentFleet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Not a Portal-Admin. }
  /api/v1/flow-catalog:
    get:
      tags: [flows]
      summary: The node catalog for the CUSTOMER flow editor (E3b).
      description: >
        E3b customer flow release. The SAME catalog served to the admin editor
        (services/api flowcatalog/catalog.json), but on an authenticated,
        non-admin-gated route so a Portal-User's editor palettes/validates
        against it. Tenant-agnostic (the catalog carries no tenant data); the
        `gated` flag per node lets the customer editor render a market-/grid-near
        strategy node "locked" (needs VoltPilot enablement).
      responses:
        "200":
          description: The catalog document ({catalog_version, types[]}).
          content: { application/json: { schema: { type: object } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/sites/{siteId}/flow-node-governance:
    get:
      tags: [flows]
      summary: READ-ONLY gated-node enablement for the customer editor (E3b).
      description: >
        Which gated strategy node types are enabled for THIS site, so the
        customer editor can render a not-enabled gated node "locked" with the
        Beratung hint. Read-only for customers - enabling a gated node stays a
        Portal-Admin action (PUT /api/v1/admin/sites/{siteId}/flow-node-governance).
        Tenant-scoped like every /sites route (foreign site => 404).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The gated node types + per-site enablement.
          content: { application/json: { schema: { $ref: "#/components/schemas/FlowNodeGovernance" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found (foreign tenant). }
  /api/v1/sites/{siteId}/flows/{flowId}/layout:
    get:
      tags: [flows]
      summary: The editor canvas layout of a flow (Portal v3 M5).
      description: >
        The saved node positions of a flow. Deliberately its OWN resource: the
        flow-graph schema carries no positions and flowc assigns the compiled
        artifact's x/y itself INSIDE content_hash, so a dragged position must
        never reach the document (a drag would otherwise re-deploy the device).
        Keyed on the flow, so a forked draft inherits the arrangement. Empty
        positions = never arranged (the client renders the auto-layout).
        Mirror on /api/v1/admin/sites/{siteId}/flows/{flowId}/layout.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The saved positions.
          content: { application/json: { schema: { $ref: "#/components/schemas/FlowLayout" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or flow not found (foreign tenant). }
    put:
      tags: [flows]
      summary: Persist the editor canvas layout (Portal v3 M5).
      description: >
        Replace the flow's node positions. Unknown node ids are DROPPED
        server-side; nothing here reaches the flow document, so content_hash
        cannot move.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FlowLayout" } } }
      responses:
        "200":
          description: The stored positions (unknown ids dropped).
          content: { application/json: { schema: { $ref: "#/components/schemas/FlowLayout" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or flow not found (foreign tenant). }
  /api/v1/sites/{siteId}/flow-node-status:
    get:
      tags: [flows]
      summary: What the DEVICE reports about this site's flows (Portal v3 M5).
      description: >
        The device's own view of the flows it runs: the deployment acks (which
        version really runs - the "Läuft auf dem Gerät" badge) plus, only when
        the edge sends the feature-flagged block, the per-node live states. An
        empty nodes list means the device does not report node states, and the
        editor then shows channel values only - never a guessed one. Read-only.
        Mirror on /api/v1/admin/sites/{siteId}/flow-node-status.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The device-reported acks + node states.
          content: { application/json: { schema: { $ref: "#/components/schemas/FlowLiveStatus" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found (foreign tenant). }
  /api/v1/sites/{siteId}/flows:
    get:
      tags: [flows]
      summary: List a customer's own site flows (E3b).
      description: >
        A Portal-User reads the flows of THEIR OWN site (tenant from the JWT,
        RLS-scoped; a Portal-Admin reaches any site via the X-Tenant-Id switcher).
        One summary per flow with its version spine; documents follow
        docs/contracts/v2/flow-graph.schema.json. Mirrors the admin list, minus
        the platform-admin gate.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's flows.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FlowSummary" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found (foreign tenant). }
    post:
      tags: [flows]
      summary: Create a flow (version 1, draft) on one's own site.
      description: >
        The server stamps ALL identity (flow_id, flow_version, site_id,
        tenant_id) into the document; the client only supplies the name and an
        optional starting document.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveFlowRequest" }
      responses:
        "201":
          description: The created draft version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowVersion" }
        "400": { description: Missing/over-long name. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found (foreign tenant). }
  /api/v1/sites/{siteId}/flows/{flowId}:
    delete:
      tags: [flows]
      summary: Delete a whole flow (all versions; draft cleanup).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted. }
        "409": { description: A version is active - deactivate first. }
        "404": { description: Flow/site not found. }
  /api/v1/sites/{siteId}/flows/{flowId}/deactivate:
    post:
      tags: [flows]
      summary: Stop a running flow (retire its active version + re-publish).
      description: >
        Retires the flow's active version and re-publishes the site's (now
        smaller) COMPLETE deployment set so the edge drops the retired flow.
        Never gated by the activation flag - stopping a flow is always allowed.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Deactivation outcome ({deactivated, published, lifecycle}).
          content: { application/json: { schema: { type: object } } }
        "409": { description: The flow has no active version. }
        "404": { description: Flow/site not found. }
  /api/v1/sites/{siteId}/flows/{flowId}/versions/{version}:
    get:
      tags: [flows]
      summary: One flow version (document + lifecycle + recorded dry-run).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The flow version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowVersion" }
        "404": { description: Flow/version/site not found. }
    put:
      tags: [flows]
      summary: Save a flow version (a simulated/active version yields a new draft).
      description: >
        A draft is updated in place; editing a simulated/active version creates a
        NEW draft version (flow-graph contract paragraph 5) - the response carries
        the resulting version.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveFlowRequest" }
      responses:
        "200":
          description: The saved (possibly new) version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowVersion" }
        "409": { description: The version is retired (read-only). }
        "404": { description: Flow/version/site not found. }
  /api/v1/sites/{siteId}/flows/{flowId}/versions/{version}/validate:
    post:
      tags: [flows]
      summary: Validate a flow version (V-1..V-8).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Findings + the blocking verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowValidationResult" }
  /api/v1/sites/{siteId}/flows/{flowId}/versions/{version}/simulate:
    post:
      tags: [flows]
      summary: Start the flow dry-run (Ersparnis-Simulation mapping).
      description: >
        Compiles the flow to its deterministic simulation mapping and submits a
        job over the site's real master data. 422 for an invalid flow or one
        without a simulierbar battery strategy.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "202":
          description: The dry-run was submitted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulationId: { type: string }
                  flowScenario: { type: string, enum: [voltpilot, standardSpeicher] }
        "422": { description: Invalid flow / no simulierbar strategy (German message). }
  /api/v1/sites/{siteId}/flows/{flowId}/versions/{version}/simulation/{simulationId}:
    get:
      tags: [flows]
      summary: Poll the flow dry-run; completion flips draft -> simulated.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
        - { name: simulationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The job status (+ flowScenario).
          content: { application/json: { schema: { type: object } } }
        "404": { description: Job/version not found. }
  /api/v1/sites/{siteId}/flows/{flowId}/versions/{version}/activate:
    post:
      tags: [flows]
      summary: Activate a simulated version (governance-gated; E3b customer path).
      description: >
        The SAME lifecycle + gates as the admin activate, never relaxed for a
        customer: strict validation, the D1 safety gate (simulate first), the AE7
        node-governance gate (activated=false, reason=gated_node_not_enabled when
        a gated strategy node is not yet enabled by a Portal-Admin for the site),
        the peak-shaving precondition, then compile + rollout - gated by
        VOLTPILOT_FLOWS_ACTIVATION_ENABLED (default OFF -> reason=activation_disabled).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Activation outcome (activated, reason, message, published).
          content: { application/json: { schema: { type: object } } }
        "409": { description: Already active / draft not simulated yet. }
        "422": { description: Validation errors (message + findings). }
        "404": { description: Not found. }
  /api/v1/admin/flow-catalog:
    get:
      tags: [admin]
      summary: The VoltPilot node catalog the flow editor palettes/validates against.
      description: >
        E3a flow editor. ONE catalog truth (services/api flowcatalog/catalog.json,
        mirrored as the portal's synced copy): typed port signatures, parameter
        specs, runtime support and D-13 claim templates per node type. Adding a
        node type is additive.
      responses:
        "200":
          description: The catalog document ({catalog_version, types[]}).
          content: { application/json: { schema: { type: object } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/sites/{siteId}/flows:
    get:
      tags: [admin]
      summary: List a site's flows (E3a flow editor).
      description: >
        Platform-admin via the X-Tenant-Id switcher over the RLS path (no or
        wrong tenant => 404). One summary per flow with its version spine;
        documents follow docs/contracts/v2/flow-graph.schema.json.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The site's flows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FlowSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
    post:
      tags: [admin]
      summary: Create a flow (version 1, draft).
      description: >
        The server stamps ALL identity (flow_id, flow_version, site_id,
        tenant_id) into the stored document - clients never pick ids. Without a
        document a skeleton with one slot-boundary trigger is created.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveFlowRequest" }
      responses:
        "201":
          description: The created draft version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowVersion" }
        "400": { description: Missing/overlong name. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not found (or no tenant selected). }
  /api/v1/admin/sites/{siteId}/flows/{flowId}:
    delete:
      tags: [admin]
      summary: Delete a whole flow (all versions; draft cleanup).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted. }
        "409": { description: A version is active - retire first. }
        "404": { description: Flow/site not found. }
  /api/v1/admin/sites/{siteId}/flows/{flowId}/versions/{version}:
    get:
      tags: [admin]
      summary: One flow version (document + lifecycle + recorded dry-run).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowVersion" }
        "404": { description: Not found. }
    put:
      tags: [admin]
      summary: Save a flow version.
      description: >
        A DRAFT is updated in place; saving onto a simulated/active version
        creates a NEW draft version (flow-graph contract paragraph 5 - the
        response carries the resulting version). Retired versions are
        read-only (409).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveFlowRequest" }
      responses:
        "200":
          description: The saved (possibly NEW) version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowVersion" }
        "409": { description: Version is retired. }
        "404": { description: Not found. }
  /api/v1/admin/sites/{siteId}/flows/{flowId}/versions/{version}/validate:
    post:
      tags: [admin]
      summary: Validate a version against the platform validator (V-1..V-8).
      description: >
        Machine-readable findings per docs/contracts/v2/flow-graph.md paragraph
        4 - rule id, offending node/edge ids, German message. Includes the
        cross-flow exclusive-resource check against the site's ACTIVE flows and
        the capability match against the v2 entity registry.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Findings + blocking verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlowValidationResult" }
        "404": { description: Not found. }
  /api/v1/admin/sites/{siteId}/flows/{flowId}/versions/{version}/simulate:
    post:
      tags: [admin]
      summary: Start the flow dry-run (Ersparnis-Simulation mapping).
      description: >
        Compiles the flow to its deterministic simulation mapping (a market or
        peak-shaving strategy -> the voltpilot scenario incl. its
        Speicherschonung) and submits an
        Ersparnis-Simulation job over the site's real master data. 422 with a
        German reason for an invalid flow or one without a battery strategy.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "202":
          description: Job accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulationId: { type: string }
                  flowScenario: { type: string, enum: [voltpilot, standardSpeicher] }
        "422": { description: Invalid or not simulierbar (German message). }
        "404": { description: Not found. }
  /api/v1/admin/sites/{siteId}/flows/{flowId}/versions/{version}/simulation/{simulationId}:
    get:
      tags: [admin]
      summary: Poll the flow dry-run; completion flips draft -> simulated.
      description: >
        Relays the simulation job document plus flowScenario. When the job
        reports done, the version's lifecycle flips draft -> simulated and the
        summary (scenario, headline, price year) is recorded on the version.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
        - { name: simulationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The job status (+ flowScenario).
          content: { application/json: { schema: { type: object } } }
        "404": { description: Job/version not found (api restart forgets jobs). }
  /api/v1/admin/sites/{siteId}/flows/{flowId}/versions/{version}/activate:
    post:
      tags: [admin]
      summary: Activate a simulated version (compile + D-11 rollout).
      description: >
        Strict validation, the D1 safety gate (a draft must be simulated
        first), then compile + retire-previous + mark-active + publish the
        COMPLETE retained deployment set on ems/{t}/{s}/{d}/v2/flows
        (docs/contracts/v2/flow-artifact.md). Until the E2 compiler module
        lands the activation answers HONESTLY with activated=false,
        reason=compiler_missing ("Compiler folgt") and publishes nothing; with
        a compiler present the feature flag
        VOLTPILOT_FLOWS_ACTIVATION_ENABLED (default OFF, simulator-rig only)
        still gates the rollout.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Activation outcome (activated, reason, message, published).
          content: { application/json: { schema: { type: object } } }
        "409": { description: Already active / draft not simulated yet. }
        "422": { description: Validation errors (message + findings). }
        "404": { description: Not found. }
  /api/v1/admin/tenants/{tenantId}/users/{userId}:
    put:
      tags: [admin]
      summary: Update a customer user's profile (email/name).
      description: The username is the login identity and stays immutable.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { description: Invalid email or over-long name. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant or user not found (including a user outside this tenant). }
        "409": { description: A user with that email already exists. }
    delete:
      tags: [admin]
      summary: Permanently delete a customer user's login.
      description: >
        Admins can never delete their OWN account (409) - the guard fires
        before any tenant check.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: User deleted; their login stops working immediately. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant or user not found (including a user outside this tenant). }
        "409": { description: Attempt to delete one's own account. }
  /api/v1/admin/tenants/{tenantId}/users/{userId}/disable:
    post:
      tags: [admin]
      summary: Disable a customer user (blocks their logins).
      description: >
        Admins can never disable their OWN account (409) - the guard fires
        before any tenant check.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant or user not found (including a user outside this tenant). }
        "409": { description: Attempt to disable one's own account. }
  /api/v1/admin/tenants/{tenantId}/users/{userId}/enable:
    post:
      tags: [admin]
      summary: Re-enable a disabled customer user.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant or user not found (including a user outside this tenant). }
  /api/v1/admin/tenants/{tenantId}/users/{userId}/reset-password:
    post:
      tags: [admin]
      summary: Reset a customer user's password (support lever).
      description: >
        The platform has no SMTP and therefore no self-service password reset;
        this is how support recovers a customer who forgot their password or
        locked themselves out guessing. Sets the new password (`temporary`
        defaults to true: must be changed on next login) and lifts any
        brute-force lockout so the new password works immediately.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200":
          description: Password reset; any lockout lifted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { description: Invalid password (must be 8-128 characters). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant or user not found (including a user outside this tenant). }
  /api/v1/admin/sites/{siteId}/optimizer-diagnostics:
    get:
      tags: [admin]
      summary: Per-slot "why" view of one persisted optimizer run (Portal-Admin).
      description: >
        The plan's slots PLUS the per-slot euro decomposition the P1-P5 solver
        redesign actually optimized against: the bare spot price
        (`solverPriceCtKwh`), the real import price per the site's tariff
        (spot+Aufschlag / flat / spot), the real export value (spot + dynamic
        Marktprämie for Direktvermarktung incl. the §51 negative-price
        suspension; feste EEG-Einspeisevergütung incl. §51a for Eigenverbrauch;
        bare spot in merchant mode - mirrors the optimizer's pricing.py), the
        PERSISTED per-slot wear spend and its derived ct/kWh rate, an
        explicitly-APPROXIMATE stored-energy value (forward best-use price
        discounted by efficiency and wear - NOT a MILP shadow price), a
        decision label (the portal chargeKind twin) and one composed German
        rationale per slot. Fields that are honestly not computable for a slot
        (no persisted spot, pre-P2 rows without wear, battery-less site) are
        null, never a fabricated 0.

        Requires the `platform-admin` role AND the `X-Tenant-Id` tenant
        switcher: the read runs RLS-scoped over the selected tenant's own data
        (no BYPASSRLS); no tenant selected or the wrong tenant = 404. The §14a
        limit a run used is not persisted and therefore not returned;
        forecast-model lifecycle comes from GET /sites/{siteId}/forecast-quality.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: generatedAt
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: >
            Select a historical run by its exact generated_at; omitted = the
            latest run (or, with `date`, that day's newest run). An unknown
            timestamp is a 404 (never silently the latest); `availableRuns`
            in the response lists the day's choices.
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: >
            A Europe/Berlin calendar day: scopes `availableRuns` to that day's
            runs (the schedule hypertable keeps every run, so navigation is
            per day) and, without an explicit `generatedAt`, shows the day's
            newest run. A day without runs returns an empty well-formed body
            (not 404 - gaps inside the covered range are possible). Omitted =
            the shown run's day. `firstRunDate`/`lastRunDate` in the response
            bound the picker.
      responses:
        "200":
          description: >
            The run's diagnostics; a site without any plan yet returns an
            empty well-formed body (generatedAt null, no slots).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptimizerDiagnostics" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not visible for the selected tenant, or unknown generatedAt. }
  /api/v1/admin/sites/{siteId}/optimizer-config:
    get:
      tags: [admin]
      summary: The site's optimizer knobs - platform defaults, overrides, effective values.
      description: >
        Platform defaults mirror the optimizer's `OPTIMIZER_*` environment
        (the api receives the same variables - keep them in sync in compose);
        overrides are the nullable per-site/per-asset columns
        (`asset.wear_cost_ct_per_kwh`, `asset.soc_min_pct`/`soc_max_pct`,
        `site.backup_reserve_soc_pct`); effective = override ?? default. The
        pre-existing site levers (netzladen_erlaubt, plant_kind, tariff,
        anzulegender Wert) are echoed READ-ONLY - they stay editable via
        PUT /api/v1/sites/{siteId} (admins: with the X-Tenant-Id switcher).
        Terminal-value settings are env-level and read-only here. Same
        auth/tenancy as optimizer-diagnostics.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The merged config view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptimizerConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not visible for the selected tenant. }
    put:
      tags: [admin]
      summary: Write the per-site / per-asset optimizer overrides.
      description: >
        FULL-REPRESENTATION for the four override fields: the body IS the
        override state, a null/absent field CLEARS that override back to the
        platform default (matching the columns' NULL semantics). Battery
        fields (wear cost, SoC band) require a battery asset (409 otherwise);
        the EFFECTIVE SoC band (override ?? default per side) must stay a real
        window (400). Changes apply on the optimizer's next 15-min cycle - no
        re-solve is triggered here; use POST optimizer-what-if (design §4.3)
        to preview a knob change before saving it.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOptimizerConfigRequest" }
      responses:
        "200":
          description: The updated merged config view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptimizerConfig" }
        "400": { description: Invalid value range or inconsistent effective SoC band. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not visible for the selected tenant. }
        "409": { description: Battery override on a site without a battery asset. }

  /api/v1/admin/sites/{siteId}/optimizer-what-if:
    post:
      tags: [admin]
      summary: Preview a knob change - solve this site twice, persist nothing.
      description: >
        The on-demand what-if re-optimize (design vp-admin-optimizer-ui-design
        §4.3). The api resolves the site through the RLS-scoped datasource
        (X-Tenant-Id switcher; a site the selected tenant cannot see is 404 and
        is never forwarded) and then asks the optimization service's internal
        synchronous solve surface to gather ONE fresh set of inputs
        (prices/forecasts/SoC/§14a/tariff of the real plant) and solve it
        TWICE: `baseline` as the site is configured, `variant` with the posted
        knobs. The delta is variant minus baseline.


        EPHEMERAL BY CONSTRUCTION: no plan is persisted to `schedule`, no MQTT
        schedule is published, the site's stored settings are untouched and the
        run currently in force stays in force. The comparison deliberately does
        NOT use the site's persisted run - that was generated at another time
        over another horizon with another price vintage, so a delta against it
        would attribute the passage of time to the knob.


        Every override field is OPTIONAL; absent means "leave as configured"
        (never zero), so an empty body simply re-solves the site as it stands.
        `backupReserveSocPct: 0` IS "no reserve" - a 0 % floor and no floor are
        the same constraint. Solves take well under a second, hence a plain
        synchronous response and no job id; concurrent runs are bounded, so a
        saturated service answers 429.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhatIfRequest" }
      responses:
        "200":
          description: Both freshly solved plans plus their delta. Nothing was committed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatIfResult" }
        "400":
          description: >
            Invalid knobs (range, inverted SoC band) or a site that honestly
            cannot be planned right now (no price coverage). Body carries a
            German `message`.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not visible for the selected tenant. }
        "409": { description: The site has no battery asset - nothing to re-plan. }
        "429": { description: Too many concurrent re-optimizes; retry shortly. }
        "502": { description: The solve service is unreachable; the stored plan is unchanged. }
  /api/v1/sites/{siteId}/consumer-options:
    get:
      tags: [consumer]
      summary: The Anlagen-Modell assistant's capability-/context-filtered inputs.
      description: >
        The consumer types the site may create (catalog category=consumer,
        controllable, non-composed - each with its allowed control kinds, default
        failsafe and per-type intent suggestions), the condition SIGNAL catalog
        (name/label/class/valueType; cloud signals are compiled to windows and
        carry no hysteresis, D1), the four intent cards, whether the site has a
        storage (steers the storage questions, E3), the edge-reported sources
        that can back a consumer, and the master-data defaults. Tenant-scoped (RLS
        foreign site = 404).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The assistant inputs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/consumers:
    get:
      tags: [consumer]
      summary: List the site's controllable consumers.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The consumers with their master data + control-activation state.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Consumer" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
    post:
      tags: [consumer]
      summary: Create a consumer (connected to a reported source, or as a draft).
      description: >
        Creates the consumer as a v2 entity + its consumer_profile. `edgeSourceId`
        binds a reported source ("verbunden"); omitting it creates an unconnected
        DRAFT ("Noch nicht verbunden"). The requested `controlKind` is refused
        (422) when the device type cannot execute it (§16 - never widened by a
        customer value). No real command is issued in Increment 1.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConsumerRequest" }
      responses:
        "201":
          description: The created consumer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consumer" }
        "400": { description: Unknown type / invalid master data. Body carries a German `message`. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
        "409": { description: The chosen reported source is already assigned to a consumer. }
        "422": { description: The device type cannot execute the requested control kind. }
  /api/v1/sites/{siteId}/consumers/{id}:
    get:
      tags: [consumer]
      summary: Read one consumer's master data + state.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The consumer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consumer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Consumer/site not found for this tenant. }
    patch:
      tags: [consumer]
      summary: Edit a consumer's master data (optimistic via version).
      description: >
        Optimistic concurrency: send `expectedVersion`; a stale value is refused
        with 409. The control kind is again mapped onto the device capabilities
        (§16). `name` updates the entity label.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchConsumerRequest" }
      responses:
        "200":
          description: The updated consumer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consumer" }
        "400": { description: Invalid master data. Body carries a German `message`. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Consumer/site not found for this tenant. }
        "409": { description: Version conflict (someone else changed it first). }
        "422": { description: The device type cannot execute the requested control kind. }
    delete:
      tags: [consumer]
      summary: Fachlich stilllegen (409 while still connected).
      description: >
        Removes an UNCONNECTED consumer (returning the site to its pre-consumer
        state - Increment 1 holds no audit/fulfilment data). A consumer still
        bound to a device/source is refused (409): disconnect first (physische
        Registry-Bereinigung erst nach Deaktivierung, §11).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Consumer/site not found for this tenant. }
        "409": { description: Still connected to a device/source; disconnect first. }
  /api/v1/sites/{siteId}/consumers/{id}/policy:
    get:
      tags: [consumer]
      summary: Read the consumer's latest policy (204 when none).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The latest policy version (draft in Increment 1).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerPolicyVersion" }
        "204": { description: No policy authored yet. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Consumer/site not found for this tenant. }
    put:
      tags: [consumer]
      summary: Save a new DRAFT policy version.
      description: >
        Validates the policy document against consumer-policy.schema.json + the
        semantic ConsumerPolicyValidator (kind/enforcement coherence, must_run⇒grid
        allow, condition-tree limits, cloud-vs-local hysteresis, catalog signals,
        D4 power ranges, 24:00 normalisation) and stores it as the next DRAFT
        version. The document's `entity_id` is stamped from the path (a body can
        never target another entity). content_hash is derived from canonical JSON.
        Activation does not exist yet (Increment 1).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document:
                  type: object
                  description: A consumer-policy document (consumer-policy.schema.json).
      responses:
        "200":
          description: The stored draft version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerPolicyVersion" }
        "400": { description: The policy is invalid. Body carries a German `message`. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Consumer/site not found for this tenant. }
  /api/v1/sites/{siteId}/consumers/{id}/policy/activate:
    post:
      tags: [consumer]
      summary: Validate, compile and atomically activate the latest policy version (Inkrement 4).
      description: >
        Verbrauchssteuerung §11/§13.2 (D-19): validates the LATEST policy
        version, compiles its reactive-with-local requirements into at most ONE
        generated flow artifact (precomputed UTC price windows per D1, local
        signals with freshness + hysteresis, must_run → the bounded D-5
        override) and activates atomically - previous active version retired,
        the artifact rolled out over the EXISTING retained flow-deployment set.
        Flag-gated (VOLTPILOT_CONSUMER_CONTROL_ENABLED +
        VOLTPILOT_CONSUMER_POLICY_COMPILER_ENABLED, both default OFF): with a
        flag off the response is 200 with activated:false and a reason
        (activation_disabled / compiler_disabled) - the rule stays a draft. A
        compiler or rollout failure is 503 and the previously active version
        stays UNCHANGED. An entity already claimed by another active automation
        is 409 naming it (V-5).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Outcome envelope (activated true/false + reason + published).
          content:
            application/json:
              schema:
                type: object
                properties:
                  activated: { type: boolean }
                  reason: { type: string, nullable: true, description: "activation_disabled | compiler_disabled | null" }
                  message: { type: string }
                  published: { type: boolean }
                  policyVersion: { type: integer, nullable: true }
        "400": { description: No policy yet / the stored policy is invalid. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Consumer/site not found for this tenant. }
        "409": { description: The entity is already controlled by another active automation (named in `message`). }
        "422": { description: The consumer is not connected yet (E11). }
        "503": { description: Compiler/rollout unavailable - the previously active version is unchanged. }
  /api/v1/sites/{siteId}/consumers/{id}/policy/deactivate:
    post:
      tags: [consumer]
      summary: The real stop path - retire the active policy AND retract the retained artifact.
      description: >
        §16: works INDEPENDENTLY of the activation feature flags (a disabled
        flag must never leave a deployed rule looking stopped). Retires the
        active policy version and re-publishes the site's retained deployment
        set WITHOUT the generated artifact.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Stopped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  published: { type: boolean }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Consumer/site not found for this tenant. }
        "409": { description: No active policy. }
  /api/v1/sites/{siteId}/consumers/{id}/pause:
    post:
      tags: [consumer]
      summary: Pause the consumer (Gesamtschalter off, device failsafe applies).
      description: >
        §11/§16: flips the consumer's enable switch off, retracts the generated
        artifact from the retained deployment set and lets the desired TTLs
        expire - the entity falls to its registry failsafe. Works with the
        activation flags OFF (stop paths are never flag-gated).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Paused.
          content:
            application/json:
              schema:
                type: object
                properties:
                  published: { type: boolean }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Consumer/site not found for this tenant. }
  /api/v1/sites/{siteId}/consumers/{id}/resume:
    post:
      tags: [consumer]
      summary: Resume after a pause (re-enable + re-deploy the stored artifact, no compile).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Outcome envelope (the activate shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  activated: { type: boolean }
                  reason: { type: string, nullable: true }
                  message: { type: string }
                  published: { type: boolean }
                  policyVersion: { type: integer, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Consumer/site not found for this tenant. }
        "409": { description: No active policy to resume. }
        "503": { description: Rollout unavailable. }
  /api/v1/sites/{siteId}/consumer-schedule:
    get:
      tags: [consumer]
      summary: Consumer slots of the newest co-optimizer run (Fahrplan view).
      description: >
        Verbrauchssteuerung Inkrement 2 (§14.11): the planned consumer slots of
        the site's newest co-optimized run, one entity per consumer with its
        FULL slot grid (command on_off|setpoint_kw, target value, §15
        reason_code, served requirement). SHADOW semantics: rows exist only for
        sites the optimizer co-plans (VOLTPILOT_V2_PLAN_SITES) with active
        policies - nothing controls a device. Without a stored run the body is
        well-formed and empty (planId/generatedAt null, entities []); the
        Fahrplan then renders byte-identical to the pre-consumer view.
        Tenant-scoped via RLS (foreign site = 404).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The newest run's consumer slots (possibly empty).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerSchedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/modbus-probe:
    post:
      tags: [probe]
      summary: Read registers on this plant's device ONCE and show what came back.
      description: >
        Einheitsmodell Stufe 0b. The api publishes a NON-retained probe on
        ems/{tenant}/{site}/{device}/v2/probe (contract
        docs/contracts/mqtt-probe.schema.json) and waits ~5 s for the device's
        answer; nothing is stored on either side.


        Honesty rules the response carries: a successful line has raw AND value
        side by side (the pair that makes a scaling mistake visible) plus the
        raw 16-bit register words; a failed line carries a NAMED German class
        and no value at all - never a fabricated 0. A device that does not
        answer in time yields errorCode `timeout` with HTTP 200: that is an
        honest outcome the assistant renders, not an error.


        Which device is asked is never guessed - `deviceId` is optional only
        while the plant has exactly one device; several devices without a
        choice is a named 409.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProbeRequest" }
      responses:
        "200":
          description: >
            The device's answer, or the honest timeout/rate-limit outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeResult" }
        "400": { description: The request form is not readable (validation). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or device not found for this tenant. }
        "409": { description: The plant has no device, or several and none was chosen. }
        "503": { description: The plant could not be reached to ask at all. }
  /api/v1/sites/{siteId}/consumer-status:
    get:
      tags: [consumer]
      summary: Edge-reported live states of the site's consumers.
      description: >
        Verbrauchssteuerung Inkrement 3 (D9/§15.1, a §11 status excerpt): the
        device heartbeat's additive consumers block, ingested by its own
        sibling listener into consumer_runtime_status (one row per entity,
        replaced wholesale per heartbeat; unknown state/reason words are
        discarded at ingest, never stored). An EMPTY list is the honest
        no-evidence state ("Zustand nicht bestätigt") - the portal then
        renders byte-identical to before. Tenant-scoped via RLS (foreign
        site = 404).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Reported consumer states (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsumerRuntimeStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/consumers/{id}/status:
    get:
      tags: [consumer]
      summary: One consumer's edge-reported live state.
      description: >
        The single-entity form of consumer-status. 204 without evidence -
        never a fabricated live state.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The reported state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerRuntimeStatus" }
        "204": { description: No reported state yet ("Zustand nicht bestätigt"). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/rule-events:
    get:
      tags: [rules]
      summary: Das Regel-Protokoll der Anlage (Zähler, Verlauf je Regel, Gesamt-Protokoll).
      description: >
        Einheitsmodell Stufe 5b (Konzept vp-komponenten-einheit-h2 Teil 5b.6):
        der Verlaufsspeicher, den die Momentaufnahmen-Tabellen
        (consumer_runtime_status, flow_device_ack) je Herzschlag wegwerfen.
        Geschrieben wird AUSSCHLIESSLICH aus WECHSELN im bestehenden
        Herzschlag-Strom - keine Edge-Änderung, kein neues Topic.
        Ehrlichkeitsregeln, die jede Fläche kennen muss: `switchedToday` ist
        NULLABLE (null = der Speicher hat den heutigen Tag nicht ganz gesehen,
        die Fläche sagt dann "seit HH:MM aufgezeichnet" statt einer 0),
        `recordingSince` null = für diese Anlage wurde noch gar nicht
        aufgezeichnet, und `accuracySeconds` nennt die Genauigkeit (der
        Herzschlag-Takt; ein Wechsel-und-zurück dazwischen ist unsichtbar).
        Mandantenbezogen über RLS (fremde Anlage = 404).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Das Protokoll (leer, solange nichts aufgezeichnet wurde).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleEvents" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Keycloak-issued OIDC access token (realm `voltpilot`). Must carry a
        `tenant_id` claim; the API sets it as the Postgres `app.tenant_id`
        session variable to drive Row-Level-Security.

        Tenant switcher (Portal-Admins only): a token with the `platform-admin`
        realm role (which carries NO tenant_id) may select a tenant per request
        via the `X-Tenant-Id` header (UUID). The customer endpoints then serve
        that tenant's data through the same RLS scoping the customer gets. The
        header is IGNORED for every non-admin token, so it can never widen a
        customer's access; an admin without the header sees zero rows
        (default-deny).
  responses:
    Unauthorized:
      description: Missing, expired or invalid Bearer token.
    Forbidden:
      description: Authenticated, but lacking the required role (e.g. a customer calling an admin endpoint).
  schemas:
    SelfBuildChannel:
      type: object
      description: >
        ONE measured value of a self-built Modbus device. The customer names it
        in PLAIN TEXT; the channel key is DERIVED server-side (the registry's
        open channel vocabulary) - a typed key would be a second truth about the
        same measurement.
      properties:
        label: { type: string, maxLength: 120, description: "Plain-text name, e.g. Wassertemperatur." }
        unit: { type: string, description: "One of the curated units; empty means honestly 'no unit'." }
        registerKind: { type: string, enum: [holding, input] }
        address:
          type: integer
          minimum: 0
          maximum: 65535
          description: "0-based protocol address (40001 in a manual is address 0)."
        dataType: { type: string, enum: [u16, s16, u32, s32, float32] }
        wordOrder: { type: string, enum: [big, little], description: "Only meaningful for 32-bit types." }
        scale: { type: number }
        offset: { type: number }
        minReadIntervalS:
          type: integer
          minimum: 5
          maximum: 3600
          default: 10
          description: "Poll budget - at most one read per channel per this many seconds."
    SelfBuildConnection:
      type: object
      description: Where the device sits in the customer's own network (LAN-only).
      properties:
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535, default: 502 }
        unitId: { type: integer, minimum: 0, maximum: 255, default: 1 }
    SaveSelfBuildRequest:
      type: object
      required: [connection, channels]
      properties:
        label: { type: string, maxLength: 200 }
        connection: { $ref: "#/components/schemas/SelfBuildConnection" }
        channels:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/SelfBuildChannel" }
        note: { type: string, maxLength: 200 }
    SwitchDefinition:
      type: object
      description: >
        ONE write register per device, with a FIXED kind. `on_off` may only ever
        write the two constants fixed here; `setpoint` only values inside the
        min/max clamp, plus a `safeValue` for silence and revocation. There is
        no value outside the released one, and no address at runtime.
      required: [kind, registerKind, address]
      properties:
        kind: { type: string, enum: [on_off, setpoint] }
        registerKind: { type: string, enum: [coil, holding] }
        address: { type: integer, minimum: 0, maximum: 65535, description: "0-based." }
        writeFc:
          type: integer
          enum: [5, 6, 16]
          description: >
            Derived when absent - 5 for a coil, otherwise 16. FC16 is the
            register default, NOT FC6: several real devices accept a
            single-register write and never adopt it (the Fronius/Deye lesson).
        onValue: { type: integer, minimum: 0, maximum: 65535 }
        offValue: { type: integer, minimum: 0, maximum: 65535 }
        minValue: { type: number }
        maxValue: { type: number }
        safeValue:
          type: number
          description: Written on withdrawal, staleness or revocation.
        scale: { type: number }
        offset: { type: number }
        unit: { type: string, maxLength: 16 }
        readbackAddress:
          type: integer
          minimum: 0
          maximum: 65535
          description: Optional - when present the write is read back and compared.
        watchdogAddress:
          type: integer
          minimum: 0
          maximum: 65535
          description: >
            Optional. A generic Modbus device has NO built-in deadman; if yours
            offers a watchdog register, the executor serves it on every tick.
            Empty by default - never coerced.
        watchdogValue: { type: integer, minimum: 0, maximum: 65535 }
    SwitchConsumer:
      type: object
      description: >
        The consumer facts the clamp and the cycle guard are built from - they
        bind BEFORE the executor. Only the rated power is required: a missing
        cycle axis is inactive, never an invented protection.
      required: [ratedPowerKw]
      properties:
        ratedPowerKw: { type: number, exclusiveMinimum: 0 }
        minOnSeconds: { type: integer, minimum: 0 }
        minOffSeconds: { type: integer, minimum: 0 }
        maxStartsPerDay: { type: integer, minimum: 1 }
        powerChannel: { type: string }
    SwitchTestRequest:
      type: object
      required: [switchDef]
      properties:
        switchDef: { $ref: "#/components/schemas/SwitchDefinition" }
        testValue:
          type: number
          description: >
            Required for `setpoint` and it MUST lie inside the clamp - it is
            never silently clamped, or the customer would confirm a different
            test than the one they ran. Ignored for `on_off`.
    SwitchTestResult:
      type: object
      required: [passed, ttlSeconds]
      properties:
        passed: { type: boolean }
        ttlSeconds:
          type: integer
          description: After this the device falls back BY ITSELF - the box armed it first.
        errorCode:
          type: string
          description: >
            A named class, never invented - `timeout` is an honest outcome, not
            a failure.
        message: { type: string }
        switched:
          type: object
          description: >
            Present only on a real write. A failed operation carries NO value.
          properties:
            written: { type: integer }
            offAfterS: { type: integer }
            readback: { type: integer }
            readbackMatches: { type: boolean }
    SwitchReleaseRequest:
      type: object
      required: [switchDef, consumer, physicallyConfirmed]
      properties:
        switchDef: { $ref: "#/components/schemas/SwitchDefinition" }
        consumer: { $ref: "#/components/schemas/SwitchConsumer" }
        physicallyConfirmed:
          type: boolean
          description: The customer saw the right device react. Anything but true refuses.
    SelfBuildReadRequest:
      type: object
      required: [connection, channel]
      properties:
        deviceId:
          type: string
          format: uuid
          description: >
            Optional - the box to ask. Absent means "the plant's single device";
            a plant with several must name one.
        connection: { $ref: "#/components/schemas/SelfBuildConnection" }
        channel: { $ref: "#/components/schemas/SelfBuildChannel" }
    SelfBuildReadResult:
      type: object
      description: >
        RAW and SCALED side by side, always - that pair is what makes a scaling
        mistake visible at a glance. Every number is OPTIONAL: a failed read
        carries NO value, never a 0 that reads like a measurement.
      required: [ok, receipt]
      properties:
        ok: { type: boolean }
        raw: { type: number, description: "The value as the register delivered it." }
        registers:
          type: array
          items: { type: integer }
          description: "The raw 16-bit words - a wrong word order becomes visible, not merely wrong."
        value: { type: number, description: "raw x scale + offset." }
        unit: { type: string }
        hint:
          type: string
          description: >
            A plausibility HINT, never a block - a register we consider
            implausible can be correct on the real device.
        errorCode:
          type: string
          enum: [unreachable, no_answer, invalid_response, implausible, invalid_request, not_supported, rate_limited, timeout]
        message: { type: string }
        receipt:
          type: boolean
          description: Whether this run unlocks saving (the connection-test duty).
    SiteComponentTemplate:
      type: object
      description: >
        A PRIVATE device template of one plant ("Duplizieren"). Deliberately not
        ComponentTemplate - that one describes a PRODUCT (global, builtin or
        certified); this one is the copy of ONE customer definition, and its
        channels are mandatory because the channel list IS the template.
      properties:
        templateRef: { type: string }
        version: { type: integer }
        label: { type: string }
        communication: { type: string }
        connection: { type: object, additionalProperties: true }
        channels: { type: array, items: { $ref: "#/components/schemas/SelfBuildChannel" } }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    SiteComponentTemplateRequest:
      type: object
      description: >
        Name and note of a PRIVATE template (Einheitsmodell Stufe 6). Both
        optional on duplicate (the derived "... (Vorlage)" fills in); the rename
        route requires a non-blank name.
      properties:
        label: { type: string, maxLength: 200 }
        note: { type: string, maxLength: 200 }
    SaveComponentTemplateRequest:
      type: object
      description: >
        A checked template VERSION (Einheitsmodell Stufe 6). There is
        deliberately NO templateRef field - the key is derived from brand +
        model and is opaque by contract.
      required: [brand, brandLabel, model, modelLabel, communication, transportSchema, certificationStatus]
      properties:
        brand: { type: string, maxLength: 64, pattern: "^[a-z][a-z0-9_]{0,63}$" }
        brandLabel: { type: string, maxLength: 120 }
        model: { type: string, maxLength: 64, pattern: "^[a-z][a-z0-9_]{0,63}$" }
        modelLabel: { type: string, maxLength: 120 }
        family: { type: string, maxLength: 64, description: "Decode-profile reference; absent for a template without one." }
        familyLabel: { type: string, maxLength: 120 }
        communication:
          type: string
          enum: [modbus_tcp, solarman_v5, fronius_solar_api, fronius_sunspec, goe_http_api, shelly_http]
        communicationLabel: { type: string, maxLength: 160 }
        transportSchema:
          type: array
          minItems: 1
          description: "The connection form fields {key,label,type,required,default,help,options}."
          items: { type: object, additionalProperties: true }
        channels:
          type: array
          description: >
            ABSENT = "this template does not explain it here". An EMPTY array is
            REFUSED - it would claim "delivers no measurements".
          items: { type: object, additionalProperties: true }
        writes:
          type: array
          description: >
            ABSENT = not explained here; an EMPTY array is REFUSED. Every entry
            needs its `safe_value` (what is written on silence or a revocation)
            and, per kind, the constants (`on_off`) or the clamp (`setpoint`).
            A template with writes must be `certified`.
          items: { type: object, additionalProperties: true }
        ratedKw: { type: number, minimum: 0, exclusiveMinimum: true, description: "Absent = unknown. Never 0." }
        controlTier: { type: integer, minimum: 0, maximum: 3 }
        certificationStatus:
          type: string
          enum: [certified, in_certification, not_certified]
          description: >
            `builtin` is deliberately NOT settable - that word says "ships with
            the edge software" and a hand-entered template never will.
        certificationNote: { type: string, maxLength: 500 }
        note: { type: string, maxLength: 500 }
    AdminComponentTemplate:
      allOf:
        - $ref: "#/components/schemas/ComponentTemplate"
        - type: object
          description: >
            The operator view of ONE template version. `withdrawnAt == null`
            means "selectable"; a withdrawn version is NOT deleted - the
            components using it run on unchanged.
          properties:
            createdAt: { type: string, format: date-time }
            createdBy: { type: string }
            withdrawnAt: { type: string, format: date-time, nullable: true }
            withdrawnBy: { type: string, nullable: true }
            usedByComponents:
              type: integer
              description: How many components of the whole fleet stand on this KEY.
    AdminComponentFleet:
      type: object
      required: [sites]
      properties:
        sites:
          type: array
          items:
            type: object
            required: [siteId, siteName, tenantId, tenantName, componentAuthority, componentCount, syncStatus]
            properties:
              siteId: { type: string, format: uuid }
              siteName: { type: string }
              tenantId: { type: string, format: uuid }
              tenantName: { type: string }
              componentAuthority: { type: string, enum: [box, portal] }
              componentsAdoptedAt:
                type: string
                format: date-time
                description: The RECEIPT of an automatic adoption - absent is not the same as box-managed.
              componentsAdoptedBy: { type: string }
              componentCount: { type: integer }
              sources:
                type: object
                description: "Origin of the connections. `unknown` = the row predates templates - no invented origin."
                properties:
                  builtin: { type: integer }
                  certified: { type: integer }
                  custom: { type: integer }
                  composed: { type: integer }
                  unknown: { type: integer }
              privateTemplates: { type: integer }
              syncStatus: { type: string, enum: [in_sync, pending, unreported] }
              refusedRevision: { type: string }
              refusedReason: { type: string }
              appliedAt: { type: string, format: date-time }
              write:
                type: object
                description: The three release levels of the concept in ONE place.
                properties:
                  controlPoints: { type: integer }
                  platformActivated: { type: integer }
                  templateWrites: { type: integer }
                  certSource:
                    type: string
                    enum: [env, device, platform]
                    description: What the DEVICE reports. Absent = unknown, NEVER "not certified".
                  platformCertVerdict: { type: string }
                  platformCertModel: { type: string }
    SiteComponents:
      type: object
      description: >
        The plant's components plus WHO owns their configuration
        (Einheitsmodell Stufe 1).
      required: [componentAuthority, components]
      properties:
        componentAuthority:
          type: string
          enum: [box, portal]
          description: >
            `portal` = the stored Soll IS the plant's read path and the assistant
            is offered; `box` = the device's own `:8484` page still owns it
            (every plant that existed before this stage). The server always names
            an owner - it is never absent.
        sollRevision:
          type: string
          nullable: true
          description: The last composed registry-push revision. `null` = never pushed.
        appliedRevision:
          type: string
          nullable: true
          description: >
            The revision the BOX reported it really applied. `null` = the box has
            not said anything yet - UNKNOWN, never "did not arrive".
        appliedAt: { type: string, format: date-time, nullable: true }
        refusedRevision:
          type: string
          nullable: true
          description: >
            The box's LAST refusal, NEXT TO (never instead of) `appliedRevision` -
            what runs is still the last configuration that really worked.
        refusedReason: { type: string, nullable: true, description: German plain-text reason. }
        adoptedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Wann diese Anlage AUTOMATISCH vom Gerät übernommen wurde
            (Einheitsmodell Stufe 2). null = nie übernommen - ausdrücklich NICHT
            dasselbe wie box-verwaltet: eine neu angelegte Anlage ist
            portal-verwaltet, ohne je übernommen worden zu sein. Der Zustand
            steht allein in componentAuthority; dies ist der Beleg.
        components:
          type: array
          items:
            type: object
            required: [id, role, definitionVersion, syncStatus]
            properties:
              id: { type: string, format: uuid, description: The measurement point / v2 entity id. }
              role: { type: string, enum: [inverter, pv-generation, grid-meter, consumer] }
              entityType: { type: string, nullable: true }
              label: { type: string, nullable: true }
              brand: { type: string, nullable: true }
              model: { type: string, nullable: true }
              family: { type: string, nullable: true }
              communication: { type: string, nullable: true }
              connection:
                type: object
                nullable: true
                additionalProperties: true
                description: The template's transport_schema values, passed through verbatim.
              sourceKind: { type: string, nullable: true, enum: [builtin, certified, custom, composed] }
              templateRef: { type: string, nullable: true }
              templateVersion: { type: integer, nullable: true }
              definitionVersion: { type: integer, description: Bumped on every saved change; the rollback target. }
              capacityKwp: { type: number, nullable: true }
              edgeSourceId: { type: string, nullable: true }
              syncStatus:
                type: string
                enum: [in_sync, pending, unreported]
                description: >
                  Derived from Soll vs. the box's reported Ist, never guessed.
                  `unreported` means the box has not reported - NEVER "the change
                  was lost".
    SaveComponentRequest:
      type: object
      required: [templateRef, role]
      properties:
        templateRef:
          type: string
          maxLength: 200
          description: >
            The OPAQUE template key. Brand, model, family and the communication
            method are taken FROM the template, never from the body - a client
            cannot save an inconsistent connection.
        role: { type: string, enum: [inverter, pv-generation, grid-meter, consumer] }
        label: { type: string, nullable: true, maxLength: 200 }
        connection:
          type: object
          additionalProperties: true
          description: The template's transport_schema fields (ip/port/serial/unit_id/...).
        capacityKwp: { type: number, nullable: true, description: Producer nameplate (kWp); ignored for other roles. }
        intervalS: { type: integer, nullable: true, description: Optional read interval; absent = the box default. }
        note: { type: string, nullable: true, maxLength: 200 }
    ComponentDefinition:
      type: object
      description: >
        ONE stored version of a component's connection (append-only). `null`
        everywhere means "this version says nothing about it", never a
        substitute value.
      required: [entityId, version, role, createdAt]
      properties:
        entityId: { type: string, format: uuid }
        version: { type: integer }
        role: { type: string }
        label: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        family: { type: string, nullable: true }
        communication: { type: string, nullable: true }
        connection: { type: object, nullable: true, additionalProperties: true }
        sourceKind: { type: string, nullable: true }
        templateRef: { type: string, nullable: true }
        templateVersion: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, nullable: true, description: The JWT subject that saved it. }
        note: { type: string, nullable: true }
    ComponentTemplate:
      type: object
      description: >
        ONE component template (Einheitsmodell Stufe 0a). Built-in templates are
        the cloud-side DATA rendering of the edge Go catalog
        (edge-app/core/internal/inverter DefaultCatalog()); the Go catalog stays
        the truth about what a box can actually read.
      properties:
        templateRef:
          type: string
          example: "builtin:deye:sun-30k-sg01hp3"
          description: Stable, OPAQUE key - never parse it.
        kind: { type: string, enum: [builtin, certified], description: Where the template comes from. }
        version:
          type: integer
          example: 1
          description: >
            Definition version. Built-in templates stay at 1 - their version IS
            the edge software release, not a separate count.
        brand: { type: string, example: deye }
        brandLabel: { type: string, example: Deye }
        model: { type: string, example: sun-30k-sg01hp3 }
        modelLabel: { type: string, example: SUN-30K-SG01HP3-EU }
        family:
          type: string
          nullable: true
          example: hybrid_3p
          description: The decode-profile reference - the bridge to the code that executes it.
        familyLabel: { type: string, nullable: true }
        communication: { type: string, example: solarman_v5 }
        communicationLabel: { type: string, nullable: true }
        transportSchema:
          type: array
          description: >
            The connection form of this communication - the generic field
            vocabulary {key,label,type,required,default,help,options}.
          items: { type: object }
        channels:
          type: array
          nullable: true
          description: >
            Channel definitions (register -> plain-text measurement). NULL means
            "this template does not explain its channels HERE", never "it has
            none" - a built-in template's channels live in the edge decode
            profile, so it always carries null. `[]` would be the flat lie that a
            Deye delivers no measurements.
          items: { type: object }
        writes:
          type: array
          nullable: true
          description: >
            Write definitions (SCHEMA ONLY in this stage - nothing consumes
            them): register + constants (on_off) or the min/max clamp + safe
            value (setpoint). NULL by the same rule as `channels` - a built-in
            template's write path is the control adapter, released by the
            platform register inverter_control_certification.
          items: { type: object }
        ratedKw:
          type: number
          nullable: true
          example: 30
          description: Nameplate kW. NULL = unknown in the catalog, never 0.
        controlTier:
          type: integer
          minimum: 0
          maximum: 3
          description: >
            The brand's declared control PRIMITIVE. It AUTHORIZES NOTHING -
            kill-switch, certification register and per-plant arming decide
            whether a write ever goes out.
        certificationStatus:
          type: string
          enum: [builtin, certified, in_certification, not_certified]
          description: >
            What the platform vouches for - a DIFFERENT question from `kind`.
            `builtin` = ships with the edge software (deliberately not
            "certified", which belongs to the bench).
        certifiedAt: { type: string, format: date-time, nullable: true }
        certificationNote: { type: string, nullable: true }
        note: { type: string, nullable: true, description: Display text for the assistant. }
        updatedAt: { type: string, format: date-time, nullable: true }
    Consumer:
      type: object
      description: A controllable consumer's master data + control-activation state.
      properties:
        id: { type: string, format: uuid, description: The consumer entity id. }
        type: { type: string, example: wallbox, description: entity_type (catalog consumer type). }
        typeLabel: { type: string, example: Wallbox }
        name: { type: string, example: Wallbox Garage }
        controlKind: { type: string, enum: [on_off, stepped, continuous] }
        ratedPowerKw: { type: number, example: 11.0 }
        minPowerKw: { type: number, nullable: true }
        levelsKw: { type: array, nullable: true, items: { type: number } }
        resolutionKw: { type: number, nullable: true }
        powerRangesKw:
          type: array
          nullable: true
          description: D4 non-convex [min,max] ranges (continuous).
          items: { type: array, items: { type: number } }
        storageRelation: { type: string, enum: [consumer_first, storage_first] }
        defaultGridEnergyPolicy: { type: string, enum: [allow, avoid, forbid] }
        allowStorageDischarge: { type: boolean }
        failsafe: { type: string, enum: [off, release] }
        enabled: { type: boolean, description: The pausierbarer Gesamtschalter. }
        version: { type: integer, description: Optimistic-concurrency version of the master data. }
        connection:
          type: string
          enum: [connected, disconnected]
          description: disconnected = "Noch nicht verbunden".
        edgeSourceId: { type: string, nullable: true }
        controlActivation:
          type: string
          enum: [not_activated, active, paused]
          description: >
            Derived from the active policy (Inkrement 4): "active" = an active
            policy exists and the consumer is enabled; "paused" = active policy
            with the pause failsafe in force; else "not_activated" ("Steuerung
            noch nicht aktiviert").
        hasDraftPolicy: { type: boolean }
        draftPolicyVersion: { type: integer, nullable: true }
        minOnSeconds:
          type: integer
          nullable: true
          description: >
            Cycle-guard minimum on-time (Inkrement 3, §13.1) - enforced by the
            EDGE's stateful cycle guard; travels to the device in the entity
            registry push (guards.limits.min_on_seconds). Null = axis inactive.
        minOffSeconds: { type: integer, nullable: true, description: Cycle-guard minimum off-time. }
        maxStartsPerDay: { type: integer, nullable: true, description: Cycle-guard start budget per site-local day. }
        confirmationChannel:
          type: string
          nullable: true
          description: >
            The D3 confirmation channel derived at creation from the bound
            edge source (Bestätigungshierarchie §9.4): "power_kw" = proven
            power measurement (Stufe 2 - a metering Shelly 1PM / go-e),
            "relay_state" = relay readback only (Stufe 3, energy
            "angenommen"), null = unbound draft or created before this field
            existed.
    ProbeRequest:
      type: object
      required: [ops]
      properties:
        deviceId:
          type: string
          format: uuid
          description: >
            Which of the plant's devices to ask. Optional only while the plant
            has exactly one - several devices without a choice is a 409, because
            guessing which box sits on the right LAN segment is not something
            this api will invent.
        ops:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: "#/components/schemas/ProbeOp" }
      example:
        ops:
          - id: soc
            host: 192.168.0.28
            registerKind: holding
            address: 588
            dataType: u16
    ProbeOp:
      type: object
      required: [id, host, registerKind, address, dataType]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,31}$"
          description: >
            Maps the answer back onto this question, so it must be unique within
            the request (the box refuses a duplicate BY NAME).
        host:
          type: string
          maxLength: 253
          description: >
            The device's address in the customer's own network. The BOX enforces
            that it is private (RFC1918/loopback/link-local/ULA/.local) and
            refuses a public address with a plain-German reason - it does not
            take the cloud's word for where it may knock.
        port: { type: integer, minimum: 1, maximum: 65535, default: 502 }
        unitId: { type: integer, minimum: 0, maximum: 255, default: 1 }
        registerKind:
          type: string
          enum: [holding, input]
          description: holding = Modbus FC3, input = FC4.
        address:
          type: integer
          minimum: 0
          maximum: 65535
          description: >
            0-BASED. The 4xxxx notation of many manuals means 4-0001 + address;
            that conversion belongs to the surface, not to this contract.
        dataType:
          type: string
          enum: [u16, s16, u32, s32, float32]
          description: >
            Also decides HOW MANY register words are read (1 or 2) - there is
            deliberately no free quantity field, because a wrong word count
            returns half a number that looks perfectly plausible.
        wordOrder: { type: string, enum: [big, little], default: big }
        scale:
          type: number
          description: >
            DISPLAY only - value = raw * scale + offset. It never changes what is
            read; the answer carries raw and value side by side.
        offset: { type: number }
    ProbeResult:
      type: object
      required: [requestId, results]
      properties:
        requestId: { type: string }
        errorCode:
          type: string
          enum: [invalid_request, unreachable, no_answer, invalid_response, implausible, timeout, not_supported, rate_limited]
          description: >
            Set only when the WHOLE probe was refused (the plant did not answer
            in time, or its own rate limit bit); `results` is then empty and the
            reason is stated once.
        message: { type: string, description: The plain-German sentence. }
        results:
          type: array
          items: { $ref: "#/components/schemas/ProbeOpResult" }
    ProbeOpResult:
      type: object
      required: [id, ok]
      properties:
        id: { type: string }
        ok: { type: boolean }
        raw:
          type: number
          description: >
            The RAW register value before scaling - the number that makes a
            scaling mistake visible. Absent when the step failed.
        registers:
          type: array
          maxItems: 2
          items: { type: integer }
          description: The 16-bit words, so a wrong word order is visible and not merely wrong.
        value:
          type: number
          description: raw * scale + offset. Absent when the step failed - a failure never carries a value.
        errorCode:
          type: string
          enum: [invalid_request, unreachable, no_answer, invalid_response, implausible, timeout, not_supported, rate_limited]
        message: { type: string }
    RuleEvents:
      type: object
      description: >
        Das Regel-Protokoll einer Anlage - EINE Antwort fuer die drei Flaechen,
        die es zeigen (Zaehler an der Karte, Ausschnitt im Detail-Einschub,
        kompaktes Gesamt-Protokoll).
      properties:
        recordingSince:
          type: string
          format: date-time
          nullable: true
          description: >
            Ab wann fuer diese Anlage aufgezeichnet wird. null = noch gar
            nicht. Ist er juenger als der heutige Berliner Tagesbeginn, sagt
            die Flaeche "seit HH:MM aufgezeichnet" statt einer 0.
        accuracySeconds:
          type: integer
          description: >
            Die Genauigkeit, die AN der Flaeche stehen muss: abgeleitet wird
            aus Wechseln im Herzschlag-Takt, ein Wechsel-und-zurueck dazwischen
            ist unsichtbar.
        countsToday:
          type: boolean
          description: >
            Ob der heutige Tag ueberhaupt zaehlbar ist. Er beantwortet den
            Fall, den `rules` nicht abbilden kann: eine Regel OHNE jedes
            Ereignis taucht dort gar nicht auf - ohne dieses Flag muesste die
            Flaeche den Berliner Tagesbeginn selbst nachrechnen und haette
            einen Zwilling der Server-Regel.
        rules:
          type: array
          items: { $ref: "#/components/schemas/RuleActivity" }
        events:
          type: array
          items: { $ref: "#/components/schemas/RuleEvent" }
    RuleActivity:
      type: object
      description: Die Zaehler EINER Regel.
      properties:
        ruleKind:
          type: string
          enum: [rezept, flow]
          description: >
            Der Schnappschuss der Zuordnung ueber den exklusiven Steuer-Anspruch
            (V-5), nie geraten.
        ruleRef:
          type: string
          description: Komponenten-Id (rezept) bzw. Flow-Id (flow).
        switchedToday:
          type: integer
          nullable: true
          description: >
            STARTS seit Berliner Mitternacht. NULL = nicht belastbar (der
            Speicher zeichnet erst seit heute auf) - nie eine erfundene 0.
        lastSwitchedAt:
          type: string
          format: date-time
          nullable: true
          description: Der juengste Schaltvorgang (Start ODER Stopp).
    RuleEvent:
      type: object
      description: Ein einzelner aufgezeichneter Wechsel.
      properties:
        id: { type: integer, format: int64 }
        ruleKind: { type: string, nullable: true, enum: [rezept, flow] }
        ruleRef:
          type: string
          nullable: true
          description: null = ehrlich keiner Regel zuzuordnen (nie eine geratene).
        entityId: { type: string, format: uuid, nullable: true }
        kind:
          type: string
          enum: [gestartet, gestoppt, zustand, ausgerollt, geraet_problem,
                 protokoll_gedeckelt]
        state: { type: string, nullable: true }
        previousState: { type: string, nullable: true }
        reasonCode: { type: string, nullable: true }
        actualKw:
          type: number
          nullable: true
          description: Der gemessene Wert im Moment des Wechsels; null = nicht gemessen.
        detail: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
    ConsumerRuntimeStatus:
      type: object
      description: >
        The edge-reported live state of one consumer entity (heartbeat
        consumers block, table consumer_runtime_status). confirmed is
        TRI-STATE - null means no readback evidence ("Ausführung nicht
        bestätigt" territory); actualKw null = not measured (never a
        fabricated 0).
      properties:
        entityId: { type: string, format: uuid }
        state:
          type: string
          enum: [disconnected, offline, ready, running_forced, running_optimized,
                 waiting, fulfilled, clamped, missed, unknown]
          description: §14.13 vocabulary; the edge claims only what it can know.
        reasonCode:
          type: string
          nullable: true
          description: >
            §15 vocabulary incl. the cycle-guard extension (guard_min_on,
            guard_min_off, guard_max_starts, guard_ramp, guard_rated_power,
            readback_mismatch, device_offline, plan_stale, ...). The portal
            maps it through a pure, tested table - never grep German text.
        actualKw: { type: number, nullable: true }
        confirmed: { type: boolean, nullable: true }
        runtimeSecondsToday: { type: integer, nullable: true }
        startsToday: { type: integer, nullable: true }
        reportedAt: { type: string, format: date-time }
    CreateConsumerRequest:
      type: object
      required: [type, ratedPowerKw]
      properties:
        type: { type: string, example: wallbox }
        name: { type: string }
        minOnSeconds: { type: integer, nullable: true }
        minOffSeconds: { type: integer, nullable: true }
        maxStartsPerDay: { type: integer, nullable: true }
        ratedPowerKw: { type: number, example: 11.0 }
        controlKind: { type: string, enum: [on_off, stepped, continuous] }
        levelsKw: { type: array, items: { type: number } }
        minPowerKw: { type: number }
        resolutionKw: { type: number }
        powerRangesKw: { type: array, items: { type: array, items: { type: number } } }
        storageRelation: { type: string, enum: [consumer_first, storage_first] }
        defaultGridEnergyPolicy: { type: string, enum: [allow, avoid, forbid] }
        allowStorageDischarge: { type: boolean }
        failsafe: { type: string, enum: [off, release] }
        edgeSourceId:
          type: string
          description: An edge-reported source id to bind ("verbunden"); omit for a draft.
    PatchConsumerRequest:
      type: object
      description: All fields optional; send `expectedVersion` for optimistic concurrency.
      properties:
        name: { type: string }
        ratedPowerKw: { type: number }
        controlKind: { type: string, enum: [on_off, stepped, continuous] }
        levelsKw: { type: array, items: { type: number } }
        minPowerKw: { type: number }
        resolutionKw: { type: number }
        powerRangesKw: { type: array, items: { type: array, items: { type: number } } }
        storageRelation: { type: string, enum: [consumer_first, storage_first] }
        defaultGridEnergyPolicy: { type: string, enum: [allow, avoid, forbid] }
        allowStorageDischarge: { type: boolean }
        failsafe: { type: string, enum: [off, release] }
        enabled: { type: boolean }
        expectedVersion: { type: integer }
        minOnSeconds: { type: integer, nullable: true, description: Cycle guard - 0 clears the bound. }
        minOffSeconds: { type: integer, nullable: true, description: Cycle guard - 0 clears the bound. }
        maxStartsPerDay: { type: integer, nullable: true, description: Cycle guard - 0 clears the bound. }
    ConsumerOptions:
      type: object
      description: Capability-/context-filtered inputs for the assistant question tree.
      properties:
        policyActivationEnabled:
          type: boolean
          description: >
            Whether this environment can REALLY activate a consumer rule (both
            Inkrement-4 feature flags on). false = the portal keeps the honest
            "Steuerung noch nicht aktiviert" draft wording.
        types:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              label: { type: string }
              controlKinds: { type: array, items: { type: string } }
              defaultFailsafe: { type: string }
              releaseAllowed: { type: boolean }
              intents: { type: array, items: { type: string } }
        signals:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              label: { type: string }
              signalClass: { type: string, enum: [cloud, local] }
              valueType: { type: string, enum: [number, boolean] }
        intents:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              title: { type: string }
              customerLine: { type: string }
        hasStorage: { type: boolean }
        reportedSources:
          type: array
          items:
            type: object
            properties:
              sourceId: { type: string }
              label: { type: string }
              brand: { type: string }
              role: { type: string }
              measuresPower:
                type: boolean
                description: >
                  The source PROVABLY measures power (its reported reading
                  carries load_kw). false = no proven measurement (a bare
                  relay, or not reported yet) - the wizard then names the
                  honest Stufe-3 consequence (energy "angenommen").
              health: { type: string, enum: [ok, stale, never] }
        defaultStorageRelation: { type: string }
        defaultGridEnergyPolicy: { type: string }
    ConsumerPolicyVersion:
      type: object
      properties:
        entityId: { type: string, format: uuid }
        version: { type: integer }
        lifecycle: { type: string, enum: [draft, active, retired] }
        document: { type: object, description: The consumer-policy document. }
        contentHash: { type: string, example: "sha256:..." }
        createdBy: { type: string, nullable: true }
    ConsumerSchedule:
      type: object
      description: >
        Consumer slots of the newest co-optimizer run (Verbrauchssteuerung
        Inkrement 2, read from site_plan_run + entity_plan_slot). Empty state:
        planId/generatedAt null + entities [] - never fabricated slots.
      properties:
        planId: { type: string, format: uuid, nullable: true }
        generatedAt: { type: string, format: date-time, nullable: true }
        slotMinutes: { type: integer, example: 15 }
        entities:
          type: array
          items:
            type: object
            properties:
              entityId: { type: string, description: mqtt-schedule-2.0 entity id (consumer = measurement_point UUID as string). }
              name: { type: string, nullable: true, description: Customer-facing label of the consumer. }
              slots:
                type: array
                items:
                  type: object
                  properties:
                    time: { type: string, format: date-time }
                    command: { type: string, enum: [on_off, setpoint_kw] }
                    targetValue: { type: number, nullable: true, description: "Planned power in kW (on_off: rated when on, 0 when off)." }
                    reasonCode:
                      type: string
                      nullable: true
                      description: >
                        §15 vocabulary (fixed_window | price_below_threshold |
                        optimizer_selected_low_cost | flex_deadline |
                        guard_grid_limit | no_permitted_energy); null on an off
                        slot. The portal maps it through a pure, tested table -
                        never by scanning German sentences.
                    requirementId: { type: string, nullable: true }
    SimulationRequest:
      type: object
      description: >
        Simulation inputs. On the customer route every field is optional
        (defaults from the site's master data); on the admin/prospect route
        plant (incl. pvKwp + coordinates), consumption.annualKwh and
        battery.capacityKwh are required by the simulation service.
      properties:
        year:
          type: integer
          nullable: true
          description: Reference calendar year; default = the last FULL year.
        zone:
          type: string
          nullable: true
          description: Bidding zone (admin route; customers get the site's). Default DE-LU.
        plant:
          type: object
          nullable: true
          properties:
            pvKwp: { type: number, nullable: true }
            latitude: { type: number, nullable: true }
            longitude: { type: number, nullable: true }
            azimuthDeg: { type: number, nullable: true, description: 180 = Süd (default). }
            tiltDeg: { type: number, nullable: true, description: Default 30. }
        consumption:
          type: object
          nullable: true
          properties:
            annualKwh: { type: number, nullable: true, description: Customer route defaults to 4500. }
            profile:
              type: string
              nullable: true
              description: Load profile id; v1 ships "haushalt" (synthetic typical household).
        tariff:
          type: object
          nullable: true
          properties:
            plantKind: { type: string, nullable: true, enum: [direktvermarktung, eigenverbrauch] }
            tarifArt: { type: string, nullable: true, enum: [dynamisch, fest, ohne] }
            tarifParamCtKwh: { type: number, nullable: true }
            anzulegenderWertCtKwh: { type: number, nullable: true }
            commissionedOn: { type: string, format: date, nullable: true }
            netzladenErlaubt: { type: boolean, nullable: true }
        battery:
          type: object
          nullable: true
          properties:
            capacityKwh: { type: number, nullable: true }
            maxChargeKw: { type: number, nullable: true, description: Default capacity/2. }
            maxDischargeKw: { type: number, nullable: true, description: Default capacity/2. }
            roundtripEfficiencyPct: { type: number, nullable: true, description: Default 92. }
            speicherschonung:
              type: string
              nullable: true
              enum: [aggressiv, ausgewogen, schonend]
              description: Mapped server-side onto the wear ct/kWh (1/4/8).
        sizeSweep:
          type: array
          nullable: true
          items: { type: number }
          description: >
            Battery capacities (kWh) for the Kaufberatungs-Kurve; omitted =
            0.5/1/1.5/2 x the base capacity, [] = base size only. The base
            size is always included.
    SimulationStatus:
      type: object
      description: >
        Async job document. `result` is present while running (progressive:
        scenarios ohneSpeicher/standardSpeicher appear after seconds, the
        voltpilot months fill as their chunks solve) and final when status is
        `done`; German keys per the design contract - scenarios
        (ohneSpeicher/standardSpeicher/voltpilot with kostenEur/wearEur/
        vollzyklen/monatlich), headline (gesamtVorteilEur incl. -Netto,
        speicherVorteilEur, voltpilotVorteilEur incl. -Netto), sizeSweep,
        netzladenVariante (null when the site already grid-charges),
        beispielTage (typisch/bester with per-slot dispatch of BOTH batteries)
        and annahmen (preisjahr/zone/wetter/profil/hinweis). Nothing
        computable is ever a fabricated 0 - absent/null with a reason instead.
      properties:
        status: { type: string, enum: [queued, running, done, failed] }
        progress: { type: number, minimum: 0, maximum: 1 }
        result:
          type: object
          nullable: true
          additionalProperties: true
        error: { type: string, nullable: true, description: German failure reason. }
    RegistrationRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 200
          description: Person or company name; becomes the tenant's display name.
          example: Erika Kaiser
        email:
          type: string
          format: email
          maxLength: 254
          description: Login email (doubles as the username; lowercased).
        password:
          type: string
          minLength: 8
          maxLength: 128
    RegistrationResponse:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        tenantName: { type: string }
        username: { type: string, description: The login name (the lowercased email). }
    EnrollmentCsrRequest:
      type: object
      required: [csrPem]
      properties:
        csrPem:
          type: string
          maxLength: 20480
          description: PEM-encoded PKCS#10 CSR, generated on the device (RSA >= 2048 or EC P-256/P-384).
        deviceInfo:
          type: string
          maxLength: 500
          description: Optional free-form device metadata (model, firmware) for support.
    EnrollmentPending:
      type: object
      properties:
        status: { type: string, example: pending }
        ref: { type: string, description: The canonical reference (POST response only). }
        message: { type: string }
    EnrollmentCertificate:
      type: object
      properties:
        deviceCertPem: { type: string, description: The CA-signed client certificate (pair with the device-held key). }
        caPem: { type: string, description: The device CA certificate (verify the broker with this). }
        mqttHost: { type: string, example: mqtt.example.com }
        mqttPort: { type: integer, example: 8883 }
        tenantId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid, description: Also the certificate CN and the device's MQTT username/clientid. }
    Site:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        biddingZone: { type: string, example: DE-LU }
        latitude:
          type: number
          nullable: true
          description: WGS84 latitude; ties the site to its weather forecast.
          example: 52.52
        longitude:
          type: number
          nullable: true
          description: WGS84 longitude.
          example: 13.405
        plantKind:
          type: string
          enum: [direktvermarktung, eigenverbrauch]
          description: >
            Anlagentyp: steers the portal's money wording per site
            ("mehr verdient" for Direktvermarktung vs. "gespart" for
            Eigenverbrauch). Defaults to eigenverbrauch.
        anzulegenderWertCtKwh:
          type: number
          nullable: true
          minimum: 0
          example: 8.11
          description: >
            Optional anzulegender Wert (ct/kWh) - the plant's fixed EEG
            reference rate from the EEG award / Direktvermarktungsvertrag;
            null = not configured. Only relevant for plantKind =
            direktvermarktung. When set, GET /earnings includes the DYNAMIC
            monthly Marktprämie max(0, anzulegender Wert - Monatsmarktwert
            Solar) on exported energy (suspended in negative-price slots -
            the simplified §51-EEG rule).
        marktpraemieCtKwh:
          type: number
          nullable: true
          deprecated: true
          description: >
            DEPRECATED (2026-07-07): the former manually entered FIXED
            premium - wrong semantics (the premium is the dynamic monthly
            difference to the Monatsmarktwert; fixed is the anzulegender
            Wert). Echoed read-only for one release, no longer accepted on
            create/update and no longer used in any computation; the column
            and this property are removed next release.
        tarifArt:
          type: string
          enum: [dynamisch, fest, ohne]
          description: >
            The customer's electricity tariff art (REPLACES the fixed
            strompreisCtKwh). 'dynamisch' = spot-coupled (each self-consumed kWh
            valued at its 15-min Börsenpreis + the optional Aufschlag); 'fest' =
            a single fixed retail price; 'ohne' = no euro value (self-consumption
            shown in kWh only). Defaults to 'ohne'.
        tarifParamCtKwh:
          type: number
          nullable: true
          minimum: 0
          example: 18.0
          description: >
            The tariff parameter (ct/kWh, >= 0): the fixed retail price for
            'fest', the optional spot-price Aufschlag (grid fees, levies, margin)
            for 'dynamisch', null for 'ohne' / unset. Editable by the site owner
            and by Portal-Admins.
        netzladenErlaubt:
          type: boolean
          description: >
            Per-site grid-charging switch (default false). false = "Nur
            Solarladen (EEG)": the optimizer charges the battery ONLY from
            the site's own PV surplus (Ausschließlichkeitsprinzip). true =
            "Netzladen aktiv": grid arbitrage allowed. Editable by the site
            owner and by Portal-Admins (the portal form carries the
            Ausschließlichkeitsprinzip warning).
        maxFeedInKw:
          type: number
          nullable: true
          exclusiveMinimum: 0
          example: 75.0
          description: >
            Static feed-in cap at the grid connection point (Einspeisegrenze
            am Netzanschlusspunkt, kW; FK1). null = no connection-point
            limit. The optimizer enforces it as a hard cap on grid EXPORT
            ONLY - import is never limited by it (unlike the telemetry-driven
            §14a limit, which is symmetric); when both exist the tighter one
            wins on export.
        leistungspreisEurKw:
          type: number
          nullable: true
          minimum: 0
          example: 120.0
          readOnly: true
          description: >
            READ-ONLY echo of the peak-shaving module (PS-1, Lastspitzenkappung):
            the RLM Leistungspreis in EUR per kW per billing period. Non-null =
            the module is ACTIVE (there is no separate flag). Configured
            exclusively by Portal-Admins via
            PUT /api/v1/admin/sites/{siteId}/optimizer-config - never accepted
            on the customer site create/update requests.
        abrechnungLeistung:
          type: string
          enum: [jahr, monat]
          readOnly: true
          description: >
            READ-ONLY echo (PS-1): the Leistungspreis billing period -
            Jahres- vs. Monatsleistungspreis (Europe/Berlin calendar periods).
            Defaults to 'jahr'. Admin-configured via optimizer-config.
        peakReserveSocPct:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          readOnly: true
          description: >
            READ-ONLY echo (PS-2): the peak-shaving SoC reserve in percent -
            a HARD floor the dispatch never discharges below, held back for
            load peaks beyond the 24h planning horizon. Stacks with the
            backup reserve (the highest configured absolute floor binds).
            null = no peak reserve. Admin-configured via optimizer-config.
        usageProfileOverride:
          type: string
          nullable: true
          enum: [arbitrage, peak, private]
          description: >
            AE7 Nutzungsprofil override (arbitrage | peak | private) or null to
            auto-derive. Set via PUT /api/v1/sites/{id}/profile; the effective +
            derived profile and the emphasis map are served by
            GET /api/v1/sites/{id}/profile (see docs/contracts/v2/usage-profile.md).
    SiteAsset:
      type: object
      description: One asset row incl. registry provenance; null = not set.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: battery, description: "'battery' | 'pv' (more later)" }
        deviceId:
          type: string
          format: uuid
          nullable: true
          description: >
            The device that controls this asset. A battery with a null deviceId
            has no control path - the optimizer plans it but cannot publish the
            plan to the edge, so the portal warns.
        capacityKwh: { type: number, nullable: true }
        maxChargeKw: { type: number, nullable: true }
        maxDischargeKw: { type: number, nullable: true }
        roundtripEfficiencyPct: { type: number, nullable: true, description: Round-trip efficiency percent; platform default 92. }
        speicherschonung:
          type: string
          enum: [aggressiv, ausgewogen, schonend, individuell]
          nullable: true
          description: >
            Battery only: the EFFECTIVE "Umgang mit dem Speicher" preset,
            derived server-side from the stored wear cost (NULL = platform
            default = ausgewogen; individuell = an admin configured a custom
            value via optimizer-config). Null for non-battery assets.
        pvCapacityKwp: { type: number, nullable: true }
        moduleCount: { type: integer, nullable: true }
        azimuthDeg: { type: number, nullable: true, description: Clockwise from North; 180 = South. }
        tiltDeg: { type: number, nullable: true }
        commissionedOn: { type: string, format: date, nullable: true }
        registry: { type: string, nullable: true, example: mastr }
        registryUnitId: { type: string, nullable: true, example: SEE966831669444 }
        registryFetchedAt: { type: string, format: date-time, nullable: true }
    MeasurementPoint:
      type: object
      description: >
        One additional read-only measurement point of a site (multi-source
        Anlage). Records Erzeuger (PV) sources whose kWp sums into the aggregate
        asset.pv, and an optional single Netz (grid-meter) source at the point of
        common coupling (no nameplate). Read-only by construction (control always
        false).
      properties:
        id: { type: string, format: uuid }
        role: { type: string, example: pv-generation, description: "'pv-generation' (Erzeuger), 'grid-meter' (Netz) or 'consumer' (Verbraucher)." }
        label: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        capacityKwp: { type: number, nullable: true, description: Per-source nameplate (kWp). }
        registryUnitId: { type: string, nullable: true, example: SEE900000000001 }
        control: { type: boolean, description: Always false for the roles recorded here. }
        createdAt: { type: string, format: date-time, nullable: true }
        entityType:
          type: string
          nullable: true
          enum: [battery-hybrid, producer, grid-meter, null]
          description: >
            v2 entity registry (E1a): the pilot domain type when this row is a
            v2 entity, else null. Set by the admin bootstrap only.
    V2Entity:
      type: object
      description: >
        One v2 entity-registry row (E1a). capabilities/guards are the
        docs/contracts/v2/edge-entity.schema.json $defs objects verbatim.
      properties:
        id: { type: string, format: uuid }
        entityType: { type: string, description: "Open kebab-case vocabulary (E1b); the type catalog is the truth.", example: wallbox }
        role: { type: string, example: battery-hybrid }
        label: { type: string, nullable: true }
        deviceId: { type: string, format: uuid, nullable: true }
        capabilities: { type: object, nullable: true }
        guards: { type: object, nullable: true }
    SaveV2EntityRequest:
      type: object
      description: Create/edit an entity. capabilities/guards are optional JSON overrides.
      properties:
        entityType: { type: string, description: "Catalog type (create only; open kebab-case).", example: wallbox }
        label: { type: string, nullable: true, maxLength: 200 }
        maxPowerKw: { type: number, nullable: true, description: "Rated power; bounds numeric commands + consumer max_consumption_kw." }
        capabilities: { type: object, nullable: true }
        guards: { type: object, nullable: true }
    SiteEntities:
      type: object
      description: The customer entity surface with Soll/Ist reconciliation (E1b).
      properties:
        registry:
          type: object
          nullable: true
          description: The composed registry Soll + the edge's reported revision (null = never pushed).
          properties:
            revision: { type: string }
            composedAt: { type: string, format: date-time }
            deviceId: { type: string, format: uuid, nullable: true }
            reportedRevision: { type: string, nullable: true }
            reportedAt: { type: string, format: date-time, nullable: true }
        entities:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/V2Entity"
              - type: object
                properties:
                  typeLabel: { type: string }
                  control: { type: boolean }
                  syncStatus: { type: string, enum: [in_sync, pending, missing_on_device, unreported, never_pushed] }
                  edgeSourceId: { type: string, nullable: true, description: The edge source this entity was adopted from (U2 pin). }
                  orphanedPin:
                    type: boolean
                    nullable: true
                    description: >
                      true = the pinned edge source is no longer among the
                      device's reported sources (identity churn - offer
                      re-pin via /v2-entities/{entityId}/edge-source); false =
                      pinned + reported; null = no pin, or no local view
                      reported yet (never an unprovable orphan claim).
                  capacityKwp:
                    type: number
                    nullable: true
                    description: >
                      The adopted producer's nameplate, which sums into the
                      plant total - the delete dialog names exactly what gets
                      subtracted instead of warning vaguely.
                  observed:
                    type: object
                    nullable: true
                    properties:
                      health: { type: string, enum: [ok, stale, never] }
                      lastTelemetryAt: { type: string, format: date-time, nullable: true }
                      channels: { type: array, items: { type: string }, nullable: true }
                      appliedType: { type: string, nullable: true }
                      reportedAt: { type: string, format: date-time }
        localSetup:
          type: array
          description: The edge-authoritative commissioning view (inverter/sources; never auto-imported).
          items:
            type: object
            properties:
              id: { type: string }
              kind: { type: string, example: inverter }
              role: { type: string, nullable: true, example: pv-generation }
              brand: { type: string, nullable: true }
              model: { type: string, nullable: true }
              label:
                type: string
                nullable: true
                description: The operator-given name only - never a brand/model/role concatenation.
              reportedAt: { type: string, format: date-time }
              adoptedEntityId: { type: string, nullable: true }
        staleOnDevice:
          type: array
          items: { type: string }
          description: Entities the edge still reports that the registry no longer contains.
    EntityHistory:
      type: object
      properties:
        range: { type: string, enum: [day, week, month, year] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        bucketMinutes: { type: integer }
        channels:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                start: { type: string, format: date-time }
                avg: { type: number, nullable: true }
                min: { type: number, nullable: true }
                max: { type: number, nullable: true }
                last: { type: number, nullable: true }
                n: { type: integer }
    ComponentAdoptionOutcome:
      type: object
      description: >
        Der Ausgang eines Übernahme-Versuchs (Einheitsmodell Stufe 2).
        `verdict` ist maschinenlesbar, `reason` der deutsche Klartext - beide
        stehen NEBENEINANDER, damit keine Oberfläche einen Satz nach
        Stichworten durchsuchen muss.
      properties:
        verdict:
          type: string
          enum: [ADOPTABLE, ALREADY_PORTAL, NO_REPORT, INCOMPLETE_REPORT, UNKNOWN_DEVICE, UNMAPPABLE_ROLE, AMBIGUOUS_INVERTER]
          description: >
            ADOPTABLE = übernommen · ALREADY_PORTAL = schon portal-verwaltet ·
            NO_REPORT = die Box hat sich nie geäußert · INCOMPLETE_REPORT = ein
            älterer Box-Stand ohne Verbindungsfelder · UNKNOWN_DEVICE = ein
            gemeldetes Gerät steht nicht im Vorlagen-Register ·
            UNMAPPABLE_ROLE = eine Rolle ohne eindeutige Geräteart ·
            AMBIGUOUS_INVERTER = zwei gemeldete Wechselrichter.
        reason:
          type: string
          nullable: true
          description: Der deutsche Grund; null bei Erfolg.
        components:
          type: integer
          description: Wie viele Komponenten übernommen wurden (0 wenn nicht).
    V2EntityBootstrapResult:
      type: object
      properties:
        entities:
          type: array
          items: { $ref: "#/components/schemas/V2Entity" }
        skipped:
          type: array
          items: { type: string }
          description: Honest notes about entity types that could not be created (e.g. no battery asset).
        push:
          type: object
          description: Outcome of the best-effort retained registry publish.
          properties:
            attempted: { type: boolean }
            published: { type: boolean }
            reason: { type: string, nullable: true, enum: [mqtt_not_configured, no_gateway_device, publish_failed, null] }
            deviceId: { type: string, format: uuid, nullable: true }
    V2ConversionPreview:
      type: object
      description: A read-only dry-run of the v1->v2 conversion (MIG). Writes nothing.
      properties:
        alreadyConverted: { type: boolean, description: The site already has v2 entities. }
        gatewayDevice: { type: string, format: uuid, nullable: true, description: The resolved gateway device (null when ambiguous/none). }
        gatewayReason: { type: string, nullable: true, enum: [no_claimed_device, multiple_devices_no_battery_link, no_gateway_device, null] }
        plan:
          type: array
          items:
            type: object
            properties:
              pointId: { type: string, format: uuid, nullable: true, description: Existing measurement_point id, or null when it would be created. }
              action: { type: string, enum: [create, refresh] }
              entityType: { type: string, example: battery-hybrid }
              label: { type: string, nullable: true }
              roles:
                type: array
                items: { type: string, enum: [pv, storage, consumer, grid] }
                description: The topology roles this entity's measure channels resolve to (AE1 DefaultRole).
              capabilities: { type: object, description: The capabilities bootstrap would write. }
              guards: { type: object, description: The guard config bootstrap would write. }
        skipped:
          type: array
          items: { type: string }
    V2HistoryCutover:
      type: object
      description: The site's v1->v2 history bridge cutover instant.
      properties:
        cutoverAt: { type: string, format: date-time, nullable: true, description: null = un-migrated (pure v1 history). }
    MastrPreview:
      type: object
      description: >
        Mapped registry record for confirmation. Nullable = "nicht im Register
        hinterlegt". `warnings` are honest German notes (Ost-West/nachgeführt
        orientation, symmetric-charging assumption on the keyless source).
      properties:
        mastrNummer: { type: string, example: SEE966831669444 }
        kind: { type: string, enum: [pv, storage] }
        name: { type: string, nullable: true }
        status: { type: string, nullable: true, example: In Betrieb }
        plantType: { type: string, nullable: true, example: Gebäudesolaranlage }
        powerKw: { type: number, nullable: true, description: PV = kWp (Bruttoleistung); storage = discharge kW. }
        inverterPowerKw: { type: number, nullable: true }
        moduleCount: { type: integer, nullable: true }
        azimuthLabel: { type: string, nullable: true, example: Süd }
        azimuthDeg: { type: number, nullable: true, example: 180 }
        tiltLabel: { type: string, nullable: true, example: 21 - 40 Grad }
        tiltDeg: { type: number, nullable: true, example: 30 }
        commissionedOn: { type: string, format: date, nullable: true }
        storageCapacityKwh: { type: number, nullable: true }
        chargePowerKw: { type: number, nullable: true }
        batteryTechnology: { type: string, nullable: true, example: Lithium-Batterie }
        plz: { type: string, nullable: true }
        ort: { type: string, nullable: true }
        linkedUnitNumber: { type: string, nullable: true, description: Cross-linked sibling unit (SOAP source only). }
        warnings:
          type: array
          items: { type: string }
    MastrApplyRequest:
      type: object
      description: At least one of pv/storage is required.
      properties:
        pv:
          type: object
          required: [mastrNummer]
          properties:
            mastrNummer: { type: string, pattern: "SEE\\d{12}" }
            capacityKwp: { type: number, nullable: true }
            moduleCount: { type: integer, nullable: true }
            azimuthDeg: { type: number, nullable: true }
            tiltDeg: { type: number, nullable: true }
            commissionedOn: { type: string, format: date, nullable: true }
        storage:
          type: object
          required: [mastrNummer]
          properties:
            mastrNummer: { type: string, pattern: "SEE\\d{12}" }
            capacityKwh: { type: number, nullable: true }
            maxChargeKw: { type: number, nullable: true }
            maxDischargeKw: { type: number, nullable: true }
            commissionedOn: { type: string, format: date, nullable: true }
    Overview:
      type: object
      description: Tenant-wide fleet overview (see GET /api/v1/overview).
      properties:
        sites:
          type: array
          items: { $ref: "#/components/schemas/OverviewSite" }
        totals: { $ref: "#/components/schemas/OverviewTotals" }
        dailySavings:
          type: array
          description: >
            Fleet-wide ex-ante savings per Europe/Berlin day, last 14 days
            incl. today; days without any plan are absent.
          items:
            type: object
            properties:
              day: { type: string, format: date }
              savingsEur: { type: number }
    OverviewSite:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        plantKind: { type: string, enum: [direktvermarktung, eigenverbrauch] }
        netzladenErlaubt:
          type: boolean
          description: Per-site grid-charging switch (see Site.netzladenErlaubt).
        batteryWithoutDevice:
          type: boolean
          description: >
            The site has a battery asset with no controlling device: the
            optimizer plans it but cannot publish the plan to the edge. The
            portal warns and links to the fix.
        deviceCount: { type: integer }
        onlineCount:
          type: integer
          description: Devices whose newest telemetry ARRIVED within 5 minutes.
        waitingCount:
          type: integer
          description: Devices that never sent data ("wartet auf erste Daten").
        worstStatus:
          type: string
          nullable: true
          enum: [online, stale, waiting]
          description: >
            Worst device status of the site (stale beats waiting beats online);
            null for a site without devices.
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: Newest telemetry arrival over the site's devices.
        live:
          nullable: true
          description: The site's newest telemetry observation; null when none.
          allOf: [{ $ref: "#/components/schemas/OverviewLive" }]
        plannedSavingsTodayEur:
          type: number
          nullable: true
          description: >
            Ex-ante optimizer savings for today (Europe/Berlin), latest run per
            15-min slot; null when no plan covers today.
        roleCounts:
          $ref: "#/components/schemas/OverviewRoleCounts"
        usageProfile:
          type: string
          enum: [arbitrage, peak, private]
          description: >
            The site's effective AE7 usage profile (the portfolio Profil-Chip),
            same derivation as GET /sites/{id}/profile.
        lastPlanGeneratedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the optimizer last RAN for this site (max generated_at over the
            persisted plans) - the "Plan" column of the platform overview. The
            optimizer re-plans every 15 minutes, so the age is the statement.
            null = no run inside the lookback window (7 days), never a
            fabricated age.
    AdminFleet:
      type: object
      description: The platform-wide fleet aggregate (see GET /api/v1/admin/fleet).
      properties:
        sites:
          type: array
          items: { $ref: "#/components/schemas/AdminFleetSite" }
        releases:
          type: array
          description: >
            The edge release register, NEWEST FIRST - the first entry is the
            fleet-wide TARGET (Soll). It rides along because "outdated" is only
            a statement against this ordering: a site's reported version is
            LOOKED UP here, and a version the register does not know (an
            existing build is stamped with a bare commit SHA) is "not
            registered" - explicitly NOT "outdated". Empty = no yardstick, so
            nothing is claimed outdated.
          items: { $ref: "#/components/schemas/AdminFleetRelease" }
    AdminFleetSite:
      type: object
      description: >
        One site of the platform fleet. The device fields carry exactly the
        OverviewSite semantics; control/curtailment are the SAME rows the
        per-site customer routes serve, so the platform overview and a site page
        can never claim different things.
      properties:
        siteId: { type: string, format: uuid }
        siteName: { type: string }
        tenantId: { type: string, format: uuid }
        tenantName: { type: string }
        plantKind: { type: string, enum: [direktvermarktung, eigenverbrauch] }
        netzladenErlaubt: { type: boolean }
        tarifArt: { type: string, enum: [dynamisch, fest, ohne] }
        deviceCount: { type: integer }
        onlineCount: { type: integer, description: "Devices whose newest telemetry ARRIVED within 5 minutes." }
        waitingCount: { type: integer, description: "Devices that never sent data." }
        worstStatus:
          type: string
          nullable: true
          enum: [online, stale, waiting]
          description: stale beats waiting beats online; null without devices.
        lastSeenAt: { type: string, format: date-time, nullable: true }
        lastPlanGeneratedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Newest optimizer run; null = no run inside the 7-day lookback
            window, never a fabricated age.
        hasStorage: { type: boolean, description: "The site owns a battery asset (the control matrix's row set)." }
        batteryWithoutDevice: { type: boolean }
        sources:
          nullable: true
          description: >
            The device-reported measurement points counted by health; null = the
            device reported none - which is NOT "0 healthy".
          allOf: [{ $ref: "#/components/schemas/AdminFleetSources" }]
        edge:
          nullable: true
          description: >
            The reported edge software version; null means UNKNOWN (the edge
            only builds the heartbeat's flows block after its first deployment
            set), never "outdated".
          allOf: [{ $ref: "#/components/schemas/AdminFleetEdge" }]
        update:
          nullable: true
          description: >
            The reported OTA state (Stufe 0); null means UNKNOWN, never
            "outdated". It sits NEXT TO `edge`, not inside it: the version
            rides TOP-LEVEL in the heartbeat and is therefore independent of
            the `flows` block an edge only builds after its first flow
            deployment - which is exactly why this block also covers the
            devices `edge` knows nothing about. Both carry their OWN
            reportedAt.
          allOf: [{ $ref: "#/components/schemas/AdminFleetUpdate" }]
        control:
          nullable: true
          description: Latest control evidence; null = the device never read back.
          allOf: [{ $ref: "#/components/schemas/ControlStatus" }]
        curtailment:
          nullable: true
          description: Latest curtailment evidence; null = no evidence.
          allOf: [{ $ref: "#/components/schemas/CurtailmentStatus" }]
        kwp: { $ref: "#/components/schemas/AdminFleetKwp" }
        forecast:
          type: array
          description: >
            Forecast quality per kind (load/pv) over the evaluation window;
            empty when the site has no evaluated day at all.
          items: { $ref: "#/components/schemas/AdminFleetForecast" }
        pflege:
          type: array
          description: >
            The SERVER-derived maintenance items (one truth - the portal renders
            them, it does not re-derive them). Empty = nothing open; "not
            checked" is never an item, it is the reason inside kwp/forecast.
          items: { $ref: "#/components/schemas/AdminFleetPflege" }
    AdminFleetSources:
      type: object
      properties:
        total: { type: integer }
        ok: { type: integer }
        stale: { type: integer, description: "Reported but without current values." }
        never: { type: integer, description: "Has never delivered." }
    AdminFleetEdge:
      type: object
      properties:
        coreVersion: { type: string, nullable: true }
        paletteVersion: { type: string, nullable: true }
        reportedAt: { type: string, format: date-time }
    AdminFleetUpdate:
      type: object
      description: >
        What the device says about the build it runs and what it is doing about
        it (OTA Stufe 0). Everything the box cannot honestly know stays null -
        in Stufe 0 there is no release register and no target on the device, so
        target/lastKnownGood are empty and a sequence number is never guessed.
      properties:
        version:
          type: string
          nullable: true
          description: >
            The build stamp VERBATIM as reported. An existing build carries a
            bare 12-char commit SHA; the portal then renders it honestly as
            "not registered", never as outdated.
        backend:
          type: string
          nullable: true
          description: "The apply backend, e.g. compose. The contract is runtime-agnostic."
        current: { type: string, nullable: true }
        target:
          type: string
          nullable: true
          description: "Empty in Stufe 0 - there is no target assignment on the device yet."
        state:
          type: string
          nullable: true
          enum: [idle, verifying, deferred, downloading, applying, self_test, succeeded, failed, rolled_back]
          description: >
            null = the device reported a version but no update block. A state
            outside this vocabulary is DROPPED on ingest rather than stored - a
            word the cloud does not understand must not become a portal
            sentence.
        reason:
          type: string
          nullable: true
          description: "German; mandatory on the device side for deferred/failed/rolled_back."
        lastKnownGood: { type: string, nullable: true }
        reportedAt: { type: string, format: date-time }
    AdminFleetRelease:
      type: object
      description: >
        One entry of the edge release register. releaseSeq is THE ordering - a
        monotonic integer, never a string or SHA comparison (decision D5).
      properties:
        releaseSeq: { type: integer, format: int64 }
        version: { type: string, description: "The release tag edge-YYYY.MM.N." }
    AdminFleetKwp:
      type: object
      description: >
        kWp plausibility (B4): the measured PV peak (max quarter-hour mean power
        over the lookback window) against the maintained nameplate. `unbekannt`
        is a full verdict - without a nameplate or without enough measured
        quarter-hours nothing is judged, and `reason` says why.
      properties:
        configuredKwp: { type: number, nullable: true }
        observedPeakKw: { type: number, nullable: true }
        buckets: { type: integer, description: "Quarter-hours WITH a PV value in the window." }
        verdict: { type: string, enum: [ok, zu_hoch, zu_niedrig, unbekannt] }
        reason: { type: string, description: "One German sentence - also (and especially) for `unbekannt`." }
    AdminFleetForecast:
      type: object
      description: >
        The site's mean normalized forecast error for one kind, plus the FLEET
        median as the yardstick. Normalized because only that is comparable
        across plant sizes. `outlier` is only ever claimed when a yardstick
        exists (enough evaluated sites) - the same discipline as the edge
        version ("without a reference nothing is outdated").
      properties:
        kind: { type: string, enum: [load, pv] }
        nmaePct: { type: number }
        days: { type: integer, description: "Evaluated days inside the window." }
        fleetMedianPct: { type: number, nullable: true, description: "null = no fleet yardstick." }
        outlier: { type: boolean }
        reason: { type: string }
    AdminFleetPflege:
      type: object
      properties:
        code:
          type: string
          description: >
            Machine-readable id (tarif-fehlt | speicher-ohne-geraet |
            kwp-unplausibel | prognose-ausreisser-{kind}).
        label: { type: string, description: "Short German chip label." }
        detail: { type: string, nullable: true, description: "The reason, where the check has one." }
    EdgeVersion:
      type: object
      description: >
        One device's reported software version. Both version fields are
        individually nullable - the edge omits an empty one (the palette version
        is absent while Node-RED's admin API is not configured).
      properties:
        deviceId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        coreVersion:
          type: string
          nullable: true
          description: The running vp-edge-core version.
        paletteVersion:
          type: string
          nullable: true
          description: The installed @voltpilot/node-red-vp-palette version.
        reportedAt: { type: string, format: date-time }
    OverviewRoleCounts:
      type: object
      description: >
        U5 portfolio "Entitäten" badge: Σ v2 entities per topology role. An
        entity's role is its entity_type's catalog category (storage→storage,
        producer→pv, meter→grid, consumer→consumer); each entity counts once (a
        battery-hybrid is one storage entity). All zero for a registry-less site.
      properties:
        pv: { type: integer }
        storage: { type: integer }
        consumer: { type: integer }
        grid: { type: integer }
    OverviewLive:
      type: object
      properties:
        ts: { type: string, format: date-time, description: Observation time. }
        pvKw: { type: number, nullable: true }
        loadKw: { type: number, nullable: true }
        gridKw: { type: number, nullable: true, description: "+ import / - export" }
        socPct: { type: number, nullable: true }
    OverviewTotals:
      type: object
      properties:
        sites: { type: integer }
        devices: { type: integer }
        online: { type: integer }
        plannedSavingsTodayEur:
          type: number
          nullable: true
          description: Sum over the sites' non-null values; null when none has a plan.
        liveSitesCovered:
          type: integer
          description: Sites whose live snapshot is inside the 5-min freshness window.
        storageCapacityKwh:
          type: number
          nullable: true
          description: >
            U5 portfolio KPI: Σ battery capacity (kWh) over the fleet's v1 asset
            rows; null when the fleet has no battery.
        storagePowerKw:
          type: number
          nullable: true
          description: Σ battery discharge power (kW) over the fleet; null when none.
    Earnings:
      type: object
      description: Realized earnings (see GET /api/v1/earnings).
      properties:
        range: { type: string, enum: [day, month, year, all] }
        from:
          type: string
          format: date-time
          description: >
            Window start. For range=all this is the fleet's first covered
            Berlin day - the honest "seit ..." of a Gesamt view.
        to: { type: string, format: date-time }
        sites:
          type: array
          items: { $ref: "#/components/schemas/EarningsSite" }
        totals: { $ref: "#/components/schemas/EarningsTotals" }
    EarningsSite:
      type: object
      description: >
        One site's realized earnings over the window. Money values are null
        when no slot is computable; `reason` then says why. Partial coverage
        is not an error - `coveredSlots` counts the slots in the sums.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        plantKind: { type: string, enum: [direktvermarktung, eigenverbrauch] }
        anzulegenderWertCtKwh:
          type: number
          nullable: true
          description: >
            The site's configured anzulegender Wert (ct/kWh), echoed here so
            the portal can state the numbers INCLUDE the dynamic monthly
            Marktprämie; null = not configured (numbers are pure spot, the
            fine print keeps the generic "zzgl. Marktprämie" for
            Direktvermarktung).
        realizedExportCtKwh:
          type: number
          nullable: true
          description: >
            Benchmark KPI - the export-weighted spot price (ct/kWh) the
            site's metered feed-in actually fetched over the window; null
            when the window has no exported energy.
        marketValueSolarCtKwh:
          type: number
          nullable: true
          description: >
            Benchmark KPI - the Monatsmarktwert Solar (ct/kWh) weighted with
            the SAME exports (a range spanning months compares like with
            like); null without exported energy or market-value coverage.
        marketValueProvisional:
          type: boolean
          nullable: true
          description: >
            True while any month contributing to marketValueSolarCtKwh still
            carries the provisional (not yet TSO-published) value; the
            portal labels the number "vorläufig".
        baselineEur:
          type: number
          nullable: true
          description: >
            Signed cost of the unregulated plant (negative = revenue): its
            per-slot import (greatest(load - pv, 0)) valued at the site's real
            supply price - the SAME composition the optimizer plans with (flat
            tariff / spot + Aufschlag / (spot + Preisblatt-Komponenten) x
            (1+USt); bare spot without any price data) - its export
            (greatest(pv - load, 0)) at spot, incl. the Marktprämie its
            immediate feed-in would earn when configured (suspended in
            negative-price slots). Every slot is valued at the CURRENTLY
            maintained tariff/Preisblatt (no price-sheet history).
        actualEur:
          type: number
          nullable: true
          description: >
            Signed measured cost with VoltPilot (negative = revenue): metered
            import at the site's real supply price (same composition as
            baselineEur), metered export at spot incl. the Marktprämie when
            configured (suspended in negative-price slots).
        savedEur:
          type: number
          nullable: true
          description: >
            baseline - actual; negative when the battery ran at a loss. Since
            the structured Bezugspreis, avoided import counts at the tariff
            (not bare spot), so load-shifting is credited fully while pure
            spot churning loses its phantom contribution.
        arbitrageEur:
          type: number
          nullable: true
          description: >
            The part of savedEur the grid-charging permission concretely
            earned ("davon Arbitrage-Gewinn"): revenue attributed to
            grid-charged battery content minus its purchase cost, via a
            deterministic storage-mix walk over the window's 15-min slots
            (grid share of a slot's charge = max(0, charge - PV surplus);
            discharge draws proportionally from the pv/grid content mix;
            pre-window content counts as solar, losses debit both parts
            proportionally). Null when the site may not grid-charge
            (netzladen_erlaubt = false) or the window contains no
            grid-charged energy - never a fake zero.
        pvShiftEur:
          type: number
          nullable: true
          description: >
            The solar time-shifting remainder savedEur - arbitrageEur (incl.
            any Marktprämie delta - grid-charged energy is never
            premium-eligible), so arbitrageEur + pvShiftEur == savedEur
            exactly. Null whenever arbitrageEur is null.
        coveredSlots: { type: integer }
        firstCoveredDate:
          type: string
          format: date
          nullable: true
          description: Europe/Berlin day of the first covered slot in the window.
        reason:
          type: string
          nullable: true
          enum: [no_data, missing_channels, no_prices]
          description: >
            Why nothing is computable (only set when savedEur is null):
            no_data = no measurements in the window; missing_channels =
            measurements lack the load/PV/grid channels (generation-only
            inverters); no_prices = no day-ahead price covers the slots yet.
        dailySaved:
          type: array
          description: >
            Realized savings per Europe/Berlin day, last 14 days incl. today,
            independent of `range` (spark bars + "Heute" teaser). Days without
            a computable slot are absent.
          items:
            type: object
            properties:
              day: { type: string, format: date }
              savedEur: { type: number }
        tarifArt:
          type: string
          enum: [dynamisch, fest, ohne]
          description: >
            The site's configured electricity tariff art, echoed so the
            money-centric view can render the provenance sentence ("... zum
            dynamischen Börsenpreis + Aufschlag" vs. "... zum festen Preis").
        tarifParamCtKwh:
          type: number
          nullable: true
          description: >
            The tariff parameter (ct/kWh): the fixed retail price for fest, the
            optional spot-price Aufschlag for dynamisch, null for ohne / unset.
        tarifPriced:
          type: boolean
          nullable: true
          description: >
            Whether savedEur's import side is valued beyond bare spot (a
            tariff parameter, a maintained site_supply_price Preisblatt, or
            the platform default-components flag). Drives the honest
            "bewertet zu Ihrem Stromtarif" provenance copy - a bare tarifArt
            echo cannot tell an 'ohne' site with a maintained Preisblatt from
            one without.
        einspeiseErloesEur:
          type: number
          nullable: true
          description: >
            Feed-in revenue over the window (metered export valued at spot +
            Marktprämie); null when nothing is computable.
        eigenverbrauchsWertEur:
          type: number
          nullable: true
          description: >
            Value of self-consumed energy, computed slot-by-slot per the site's
            tariff (dynamisch: each self-consumed kWh at its 15-min Börsenpreis +
            Aufschlag; fest: at the fixed price); null for an 'ohne' tariff
            (never a fabricated euro) or when nothing is computable.
        gesamtertragEur:
          type: number
          nullable: true
          description: >
            Gesamtertrag = einspeiseErloesEur + eigenverbrauchsWertEur (feed-in
            revenue alone when strompreis is unset). The money-centric hero's
            big number; null when nothing is computable.
        selbstverbrauchKwh:
          type: number
          nullable: true
          description: Self-consumed energy over the window (kWh); null when nothing computable.
        eingespeistKwh:
          type: number
          nullable: true
          description: Grid-exported energy over the window (kWh).
        batterieBewegtKwh:
          type: number
          nullable: true
          description: Energy moved through the battery over the window (charged + discharged, kWh).
        expectedMarketValueSolarCtKwh:
          type: number
          nullable: true
          description: >
            Forward-looking expected Marktwert Solar (ct/kWh): the day-ahead
            price weighted with THIS site's own PV forecast over the coming
            horizon (Σ(price × pv) / Σ(pv)) - the forward companion to the
            realized marketValueSolarCtKwh. Range-independent (always the
            future). Null when there is no forward PV forecast or no forward
            day-ahead price coverage (the portal then hides the figure).
        expectedMarketValueFrom:
          type: string
          format: date-time
          nullable: true
          description: First covered forward slot of expectedMarketValueSolarCtKwh.
        expectedMarketValueTo:
          type: string
          format: date-time
          nullable: true
          description: Last covered forward slot of expectedMarketValueSolarCtKwh.
        expectedMarketValueSlots:
          type: integer
          nullable: true
          description: >
            Number of forward 15-min slots (price + forecast both present)
            behind expectedMarketValueSolarCtKwh - lets the portal state the
            horizon ("nächste N h").
        series:
          type: array
          description: >
            Gesamtertrag bucketed over the selected range (per Europe/Berlin
            hour for day, per day for month, per month for year/all) - the
            Ertrag chart. Only buckets with a computable slot are listed.
          items:
            type: object
            properties:
              start: { type: string, format: date-time, description: Berlin bucket start. }
              gesamtertragEur: { type: number }
        monthlyStrip:
          type: array
          description: >
            Gesamtertrag per Europe/Berlin month for the last 12 months
            (independent of `range`) - the tappable month strip. Months without
            a computable slot are absent. OPT-IN (audit vp-portal-perf-a4,
            finding B5): [] unless the request carries `strip=true`.
          items:
            type: object
            properties:
              month: { type: string, format: date, description: First day of the Berlin month. }
              gesamtertragEur: { type: number }
        peakShaving:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PeakShaving" }]
          description: >
            The Lastspitzenkappung proof (PS-4) - present exactly when the
            site's peak-shaving module is active (non-null
            site.leistungspreis_eur_kw); null otherwise. Range-independent:
            always describes the RUNNING Europe/Berlin billing period.
    SiteEarnings:
      type: object
      description: >
        One Anlage's MEASURED money over one period (see GET
        /api/v1/sites/{siteId}/earnings). Every money/energy field is null when
        it is not computable - never a fabricated 0 - and `reason` says why.
        Two identities hold by construction: nettoErgebnisEur =
        einspeiseErloesEur + eigenverbrauchsWertEur - stromkostenEur, and
        stromkostenEur - einspeiseErloesEur = actualEur.
      properties:
        siteId: { type: string, format: uuid }
        name: { type: string }
        range: { type: string, enum: [day, week, month, year, all] }
        from:
          type: string
          format: date-time
          description: Window start; for range=all the site's first covered Berlin day.
        to: { type: string, format: date-time }
        plantKind: { type: string, enum: [direktvermarktung, eigenverbrauch] }
        tarifArt: { type: string, enum: [dynamisch, fest, ohne] }
        tarifParamCtKwh: { type: number, nullable: true }
        tarifPriced:
          type: boolean
          description: >
            Whether the import side is valued beyond bare spot (tariff
            parameter, maintained Preisblatt, or the platform default
            components) - the "bewertet zu Ihrem Stromtarif" vs "zu
            Börsenpreisen" switch of the surface copy.
        anzulegenderWertCtKwh: { type: number, nullable: true }
        coveredSlots: { type: integer, format: int64 }
        firstCoveredDate: { type: string, format: date, nullable: true }
        reason:
          type: string
          nullable: true
          enum: [no_data, missing_channels, no_prices]
          description: Why nothing is computable; null when coveredSlots > 0.
        einspeiseErloesEur:
          type: number
          nullable: true
          description: Metered feed-in valued at spot PLUS the Marktprämie.
        eigenverbrauchsWertEur:
          type: number
          nullable: true
          description: >
            Self-consumed energy valued per the site's tariff, slot by slot;
            null for an "ohne" tariff without a maintained Preisblatt (the
            quantity then lives in selbstverbrauchKwh alone).
        stromkostenEur:
          type: number
          nullable: true
          description: >
            The metered grid import valued at the site's real supply price -
            the import term of actualEur, exposed so the card's composition
            reconciles with the result it shows.
        nettoErgebnisEur:
          type: number
          nullable: true
          description: einspeiseErloesEur + eigenverbrauchsWertEur - stromkostenEur.
        savedEur:
          type: number
          nullable: true
          description: >
            baselineEur - actualEur, i.e. what VoltPilot's steering contributed
            against an unregulated plant. It sits INSIDE nettoErgebnisEur and
            is rendered as an attribution line, never as another summand.
        arbitrageEur: { type: number, nullable: true }
        pvShiftEur: { type: number, nullable: true }
        baselineEur: { type: number, nullable: true }
        actualEur: { type: number, nullable: true }
        marktpraemieEur:
          type: number
          nullable: true
          description: >
            The Marktprämie already CONTAINED in einspeiseErloesEur (shown as
            provenance, never added again); null without an anzulegender Wert
            or without a published Monatsmarktwert.
        bezugspreisCtKwh:
          type: number
          nullable: true
          description: stromkostenEur / bezogenKwh in ct/kWh; null without imported energy.
        realizedExportCtKwh: { type: number, nullable: true }
        marketValueSolarCtKwh: { type: number, nullable: true }
        marketValueProvisional: { type: boolean, nullable: true }
        bezogenKwh: { type: number, nullable: true }
        eingespeistKwh: { type: number, nullable: true }
        selbstverbrauchKwh: { type: number, nullable: true }
        batterieBewegtKwh: { type: number, nullable: true }
        gesamtertragEur:
          type: number
          nullable: true
          description: >
            Money-centric total = einspeiseErloesEur + eigenverbrauchsWertEur
            (the feed-in revenue alone for an "ohne" tariff) - the ONE number
            the cockpit money hero reads. Parity with the fleet twin so the
            cockpit renders from this cheaper site endpoint (audit
            vp-portal-perf-a4, finding B2).
        expectedMarketValueSolarCtKwh:
          type: number
          nullable: true
          description: >
            Forward expected Marktwert Solar (day-ahead price weighted with this
            site's own PV forecast over the coming horizon) - range-independent;
            null without forward PV/price coverage.
        expectedMarketValueFrom: { type: string, format: date-time, nullable: true }
        expectedMarketValueTo: { type: string, format: date-time, nullable: true }
        expectedMarketValueSlots:
          type: integer
          format: int64
          nullable: true
          description: Covered forward slot count behind expectedMarketValueSolarCtKwh.
        series:
          type: array
          description: >
            Money per Europe/Berlin bucket (hour for a day, day for week and
            month, month for year/all) - only computable buckets are listed.
          items:
            type: object
            properties:
              start: { type: string, format: date-time }
              einspeiseErloesEur: { type: number, nullable: true }
              eigenverbrauchsWertEur: { type: number, nullable: true }
              stromkostenEur: { type: number, nullable: true }
              nettoEur: { type: number, nullable: true }
        peakShaving:
          allOf: [{ $ref: "#/components/schemas/PeakShaving" }]
          nullable: true
          description: >
            The running billing period's peak-shaving proof; null unless the
            module is active. Range-INDEPENDENT, so the surface must label its
            own period and never add it into the period result.
    PeakShaving:
      type: object
      description: >
        Peak-shaving proof of a module-active site: the running billing
        period's measured grid-import peak vs. the counterfactual no-battery
        peak (both the max 15-min mean import from the telemetry rollups; the
        counterfactual re-adds the battery's dispatch per bucket -
        "dieselbe Anlage ohne Speichereinsatz"). avoidedKw =
        max(0, baselinePeakKw - peakKw); avoidedEur = avoidedKw ×
        leistungspreisEurKw, NOT pro-rated - the Leistungspreis bills the
        period's single highest 15-min mean, so mid-period the number is the
        current standing (final only once the period closes).
      properties:
        leistungspreisEurKw:
          type: number
          description: The configured Leistungspreis (EUR per kW per billing period).
        abrechnung:
          type: string
          enum: [jahr, monat]
          description: Billing period kind (Europe/Berlin calendar year or month).
        periodStart:
          type: string
          format: date
          description: First Berlin day of the running billing period.
        peakKw:
          type: number
          nullable: true
          description: >
            Measured peak of the running period (max 15-min mean grid import,
            kW). Null while the period has no measured import bucket yet.
        baselinePeakKw:
          type: number
          nullable: true
          description: Counterfactual no-battery peak of the running period (kW).
        avoidedKw:
          type: number
          nullable: true
          description: max(0, baselinePeakKw - peakKw).
        avoidedEur:
          type: number
          nullable: true
          description: avoidedKw × leistungspreisEurKw (the period's standing saving).
        history:
          type: array
          description: >
            The last 12 billing periods with measured import data (ascending,
            incl. the running one); the current contract price is applied to
            past periods too.
          items:
            type: object
            properties:
              periodStart: { type: string, format: date }
              peakKw: { type: number }
              baselinePeakKw: { type: number }
              avoidedKw: { type: number }
              avoidedEur: { type: number }
    EarningsTotals:
      type: object
      description: >
        Fleet totals over the computable sites; null money values when no site
        has a computable slot (never a fake zero).
      properties:
        baselineEur: { type: number, nullable: true }
        actualEur: { type: number, nullable: true }
        savedEur: { type: number, nullable: true }
        arbitrageEur:
          type: number
          nullable: true
          description: >
            Sum of the sites' arbitrage attributions; null when no site
            grid-charged in the window.
        pvShiftEur:
          type: number
          nullable: true
          description: >
            savedEur - arbitrageEur over the WHOLE fleet (sites without a
            split cannot grid-charge, so their entire saved is PV-shift);
            arbitrageEur + pvShiftEur == savedEur. Null whenever
            arbitrageEur is null.
        coveredSlots: { type: integer }
        firstCoveredDate:
          type: string
          format: date
          nullable: true
          description: Earliest covered Berlin day across the fleet.
    CreateSiteRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, description: Site display name (required, non-blank). }
        biddingZone:
          type: string
          enum: [DE-LU, AT, CH]
          description: "Day-ahead bidding zone; defaults to 'DE-LU'."
        latitude:
          type: number
          nullable: true
          minimum: -90
          maximum: 90
          description: Optional WGS84 latitude; needed for the site's weather forecast.
        longitude:
          type: number
          nullable: true
          minimum: -180
          maximum: 180
          description: Optional WGS84 longitude.
        plantKind:
          type: string
          enum: [direktvermarktung, eigenverbrauch]
          description: "Anlagentyp; defaults to 'eigenverbrauch'."
        anzulegenderWertCtKwh:
          type: number
          nullable: true
          minimum: 0
          description: >
            Optional anzulegender Wert (ct/kWh, >= 0, at most 3 decimals) -
            the plant's fixed EEG reference rate; only meaningful for
            direktvermarktung sites. (The deprecated marktpraemieCtKwh is no
            longer accepted; old clients sending it are ignored.)
        tarifArt:
          type: string
          enum: [dynamisch, fest, ohne]
          description: >
            The customer's electricity tariff art (default 'ohne'). 'dynamisch'
            values self-consumption per 15-min slot at spot + Aufschlag, 'fest'
            at the fixed price, 'ohne' in kWh only.
        tarifParamCtKwh:
          type: number
          nullable: true
          minimum: 0
          description: >
            The tariff parameter (ct/kWh, >= 0, at most 3 decimals): fixed price
            for 'fest', optional Aufschlag for 'dynamisch', ignored (cleared)
            for 'ohne'. Omit/null = not configured.
        netzladenErlaubt:
          type: boolean
          nullable: true
          description: >
            Grid-charging switch, settable by the site owner and by
            Portal-Admins; omitted = the safe default false ("Nur
            Solarladen (EEG)").
        maxFeedInKw:
          type: number
          nullable: true
          exclusiveMinimum: 0
          description: >
            Optional static feed-in cap at the grid connection point (kW,
            strictly positive, at most 2 decimals); omit/null = no
            connection-point limit. Enforced export-only by the optimizer.
    UpdateSiteRequest:
      type: object
      required: [name]
      description: Same fields and validation as CreateSiteRequest.
      properties:
        name: { type: string, description: Site display name (required, non-blank). }
        biddingZone:
          type: string
          enum: [DE-LU, AT, CH]
          description: "Day-ahead bidding zone; defaults to 'DE-LU'."
        latitude: { type: number, nullable: true, minimum: -90, maximum: 90 }
        longitude: { type: number, nullable: true, minimum: -180, maximum: 180 }
        plantKind: { type: string, enum: [direktvermarktung, eigenverbrauch] }
        anzulegenderWertCtKwh: { type: number, nullable: true, minimum: 0 }
        tarifArt:
          type: string
          enum: [dynamisch, fest, ohne]
          description: >
            The customer's electricity tariff art (default 'ohne'; a
            full-representation field like plantKind, so an omitted value resets
            to 'ohne').
        tarifParamCtKwh:
          type: number
          nullable: true
          minimum: 0
          description: >
            The tariff parameter (ct/kWh): fixed price for 'fest', optional
            Aufschlag for 'dynamisch', cleared for 'ohne'.
        netzladenErlaubt:
          type: boolean
          nullable: true
          description: >
            Grid-charging switch, settable by the site owner and by
            Portal-Admins; null keeps the stored value (a form that omits
            the field never flips it).
        maxFeedInKw:
          type: number
          nullable: true
          exclusiveMinimum: 0
          description: >
            Static feed-in cap at the grid connection point (kW, strictly
            positive, at most 2 decimals); null keeps the stored value (a
            form that omits the field never clears the cap - the
            netzladenErlaubt pattern).
    SiteDeletionPreview:
      type: object
      description: What deleting a site would remove (drives the confirm dialog).
      properties:
        deviceCount: { type: integer, description: Devices still at the site; > 0 blocks the delete (409). }
        telemetryCount: { type: integer, format: int64 }
        telemetryFrom: { type: string, format: date-time, nullable: true }
        telemetryTo: { type: string, format: date-time, nullable: true }
        forecastCount: { type: integer, format: int64 }
        scheduleCount: { type: integer, format: int64 }
        weatherCount: { type: integer, format: int64 }
    UpdateDeviceRequest:
      type: object
      description: Only kind + label are editable; the externalRef is immutable.
      properties:
        kind: { type: string, enum: [inverter, battery, meter], nullable: true, description: Unchanged when omitted. }
        name: { type: string, nullable: true, maxLength: 120, description: Customer-facing label; blank/null removes it. }
    DeviceClaimRequest:
      type: object
      required: [siteId, externalRef]
      properties:
        siteId: { type: string, format: uuid }
        externalRef: { type: string, description: Edge device identifier (globally unique). }
        kind: { type: string, description: "Device kind; defaults to 'inverter'.", example: inverter }
    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        externalRef: { type: string }
        kind: { type: string, example: inverter }
        name:
          type: string
          nullable: true
          description: Optional customer-facing label (Bezeichnung); the immutable externalRef stays the identity.
        status: { type: string, example: claimed }
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Newest telemetry timestamp for the device; null until the first data
            arrives. The portal derives the onboarding state from it ("wartet auf
            erste Daten" -> online).
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the device was claimed. The portal escalates the "wartet auf
            erste Daten" copy to troubleshooting guidance once the wait since
            claiming exceeds a threshold.
    DevicePurgeResult:
      type: object
      properties:
        deviceId: { type: string, format: uuid }
        purgedRows:
          type: integer
          format: int64
          description: Raw telemetry rows removed (the derived rollups are rebuilt, not counted).
        purgedBefore:
          type: string
          format: date-time
          description: >
            The purge watermark. Samples observed at or before this instant are
            refused by the ingest path from now on; new data flows normally.
        deviceNotified:
          type: boolean
          description: >
            Whether the retained purge_data command reached the broker. When
            false (broker outage), the cloud data is still gone and replays are
            blocked; the device's local buffer is wiped once the command can be
            delivered.
    ProvisionDeviceRequest:
      type: object
      required: [externalRef]
      properties:
        externalRef:
          type: string
          description: Sticker Geräte-ID (prefix VP-, canonicalized to uppercase).
          example: VP-1234-ABCD
        kind: { type: string, description: "Device kind; defaults to 'inverter'.", example: inverter }
        note: { type: string, nullable: true, description: Free-form operator note (e.g. manufacturing batch). }
    EdgeRelease:
      type: object
      description: >
        One entry of the edge release register (OTA Stufe 0, decision D5;
        signature fields added in Stufe 1).
      properties:
        releaseSeq:
          type: integer
          format: int64
          description: THE ordering - a monotonic integer, never a string/SHA comparison.
        version: { type: string, example: edge-2026.08.0 }
        targetCommit: { type: string, nullable: true, description: The commit it was built from - the paper trail into the repo. }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, nullable: true, description: The registering platform-admin's subject. }
        manifest:
          type: string
          nullable: true
          description: >
            The EXACT bytes of the signed release.json, verbatim (OTA Stufe 1).
            Stored as text and never re-serialized: the signature is over these
            bytes, so any normalisation (a jsonb column, a formatter, a copy out
            of a log) makes it silently unverifiable. Null on a Stufe-0 hand
            entry, which then honestly reads as "not signed".
        signature:
          type: string
          nullable: true
          description: The detached signature file (release.json.sig), verbatim.
        signingKeyId:
          type: string
          nullable: true
          description: The release key that signed the manifest, e.g. rel-2026-a.
    EdgeTrustSet:
      type: object
      description: The current trust-set plus the operator metadata (admin view).
      properties:
        trustSet: { type: string }
        signature: { type: string }
        keyIds:
          type: string
          example: rel-2026-a,rel-2026-b
          description: >
            DERIVED, display only: the RELEASE key ids this set trusts, sorted
            and comma-separated. The truth stays the raw bytes.
        signingKeyId:
          type: string
          example: root-2026-a
          description: The ROOT key that signed the set - never one of keyIds (see the PUT).
        generatedAt:
          type: string
          nullable: true
          description: What the DOCUMENT claims about itself (optional in the contract).
        uploadedAt: { type: string, format: date-time }
        uploadedBy: { type: string, nullable: true }
    SaveEdgeTrustSetRequest:
      type: object
      required: [trustSet, signature]
      properties:
        trustSet:
          type: string
          description: The exact bytes of trust-set.json.
        signature:
          type: string
          description: The exact bytes of trust-set.json.sig.
    CreateEdgeReleaseRequest:
      type: object
      required: [version]
      properties:
        version: { type: string, example: edge-2026.08.0, description: "Must match edge-YYYY.MM.N." }
        releaseSeq:
          type: integer
          format: int64
          nullable: true
          description: >
            Omit to continue the register (max + 1). If given, it must be
            strictly greater than every existing entry.
        targetCommit: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        manifest:
          type: string
          nullable: true
          description: >
            The signed release.json, byte for byte (OTA Stufe 1). When present,
            ITS values win: version, releaseSeq and targetCommit are taken from
            it, and a contradicting value in this body is a 400 rather than a
            silent divergence - the register must never claim something other
            than what was signed. Requires `signature`.
        signature:
          type: string
          nullable: true
          description: >
            The detached signature file (release.json.sig), byte for byte.
            Manifest and signature belong together - sending only one is a 400.
        signingKeyId:
          type: string
          nullable: true
          description: >
            Optional cross-check; must equal the key named by the manifest and
            by the signature file.
    ProvisionedDevice:
      type: object
      properties:
        externalRef: { type: string, example: VP-1234-ABCD }
        kind: { type: string, example: inverter }
        note: { type: string, nullable: true }
        provisionedAt: { type: string, format: date-time }
        claimed: { type: boolean, description: Whether any tenant has connected this device. }
        claimedByTenant:
          type: string
          nullable: true
          description: Name of the claiming tenant (null while unclaimed).
    PendingEnrollment:
      type: object
      description: A device that enrolled (uploaded a CSR) but has no claimed device row.
      properties:
        externalRef: { type: string, example: edge-k7m2xqp }
        deviceInfo: { type: string, nullable: true, description: Free-form device info from the CSR upload. }
        csrUpdatedAt: { type: string, format: date-time, description: When the pending CSR was last (re)uploaded. }
        everIssued:
          type: boolean
          description: >
            True when a certificate was once issued and the device was later
            unclaimed (a stale enrollment), false when never claimed at all.
        issuedAt: { type: string, format: date-time, nullable: true, description: When a certificate was issued (null if never). }
    TelemetryPoint:
      type: object
      properties:
        ts: { type: string, format: date-time }
        powerKw: { type: number }
        socPct: { type: number }
        pvPowerKw: { type: number }
        loadKw: { type: number }
        gridLimitKw:
          type: number
          description: Observed effective §14a power limit.
    PriceSeries:
      type: object
      description: Day-ahead spot prices for a bidding zone (market-wide, not per tenant).
      properties:
        biddingZone: { type: string, example: DE-LU }
        resolution:
          type: string
          nullable: true
          description: ISO-8601 slot resolution of the latest data.
          example: PT15M
        currency: { type: string, example: EUR }
        points:
          type: array
          items: { $ref: "#/components/schemas/PricePoint" }
    PricePoint:
      type: object
      properties:
        ts: { type: string, format: date-time, description: Slot start (UTC). }
        end: { type: string, format: date-time, description: Slot end (exclusive). }
        priceEurMwh: { type: number, description: Spot price in EUR/MWh. }
    PriceHistory:
      type: object
      description: Day-ahead prices aggregated over a historical range (market-wide per zone).
      properties:
        biddingZone: { type: string, example: DE-LU }
        currency: { type: string, example: EUR }
        bucket:
          type: string
          description: Aggregation granularity as ISO-8601 duration (PT15M day, PT1H week, P1D month/year).
          example: P1D
        from: { type: string, format: date-time, description: Window start (inclusive, UTC). }
        to: { type: string, format: date-time, description: Window end (exclusive, UTC). }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/PriceBucket" }
        summary: { $ref: "#/components/schemas/PriceRangeSummary" }
    PriceBucket:
      type: object
      properties:
        ts: { type: string, format: date-time, description: Bucket start (UTC). }
        avgEurMwh: { type: number, nullable: true, description: Mean price over the bucket (EUR/MWh). }
        minEurMwh: { type: number, nullable: true, description: Lowest slot price in the bucket (EUR/MWh). }
        maxEurMwh: { type: number, nullable: true, description: Highest slot price in the bucket (EUR/MWh). }
    PriceRangeSummary:
      type: object
      description: Headline stats over the raw slots in the range window.
      properties:
        avgEurMwh: { type: number, nullable: true }
        minEurMwh: { type: number, nullable: true }
        maxEurMwh: { type: number, nullable: true }
        cheapestTs: { type: string, format: date-time, nullable: true, description: Start of the cheapest slot. }
        mostExpensiveTs: { type: string, format: date-time, nullable: true, description: Start of the most expensive slot. }
        count: { type: integer, description: Number of raw price slots in the window. }
        coverageStart: { type: string, format: date-time, nullable: true, description: Earliest slot with data. }
        coverageEnd: { type: string, format: date-time, nullable: true, description: Latest slot with data. }
    WeatherForecast:
      type: object
      properties:
        runAt:
          type: string
          format: date-time
          nullable: true
          description: Issue time of the forecast run (null if none stored yet).
        points:
          type: array
          items: { $ref: "#/components/schemas/WeatherPoint" }
    WeatherPoint:
      type: object
      properties:
        ts: { type: string, format: date-time, description: Forecast target hour (UTC). }
        temperatureC: { type: number, nullable: true, description: 2 m air temperature. }
        cloudCoverPct: { type: number, nullable: true, description: Total cloud cover 0..100. }
        ghiWM2:
          type: number
          nullable: true
          description: Shortwave / global-horizontal irradiance (W/m²), PV-relevant.
        dniWM2: { type: number, nullable: true, description: Direct (beam) radiation (W/m²). }
        dhiWM2: { type: number, nullable: true, description: Diffuse radiation (W/m²). }
    Schedule:
      type: object
      properties:
        planId: { type: string, format: uuid, nullable: true }
        deviceId: { type: string, format: uuid, nullable: true, description: "Executing battery device (the MQTT schedule topic's device)." }
        generatedAt: { type: string, format: date-time, nullable: true }
        slotMinutes: { type: integer, example: 15 }
        savingsEur:
          type: number
          nullable: true
          description: Projected savings over the horizon vs. leaving the battery idle (the no-battery baseline).
        bankedValueEur:
          type: number
          nullable: true
          description: >-
            Value of the energy the plan banks into (positive) or draws out of
            (negative) the horizon: the run's persisted terminal value per
            stored kWh times the SoC swing (socEndPct - socStartPct). Makes
            savingsEur honest on bank days, where storing into the next day
            reads as negative savings. Null when not computable (runs predating
            the terminal-value column, no battery asset) - never a fabricated 0.
        socStartPct:
          type: number
          nullable: true
          description: Battery state of charge at the plan start (the SoC the banked value is measured from).
        socEndPct:
          type: number
          nullable: true
          description: Planned state of charge at the horizon end.
        peakTargetKw:
          type: number
          nullable: true
          description: >-
            The run's planned billing-period grid-import peak target (PS-1,
            schedule.peak_target_kw) - the "Ziel" a Lastspitzen (peak-shaving)
            Anlage defends. Null when the site runs no peak-shaving module or on
            a run that predates the column.
        fallback14a:
          type: boolean
          nullable: true
          description: >-
            Fahrplan-Warum (schedule.fallback_14a): true = this run is the
            advisory build without the infeasible §14a grid-limit constraint
            (edge guards + grid operator enforce the physical limit) - the
            §14a copy switches to the fallback wording. Null on pre-feature
            runs or runs whose explain layer was off.
        whyTerminalAnchor:
          type: string
          nullable: true
          description: >-
            Erklaerbarkeit Stufe 1 (schedule.why_terminal_anchor, migration
            V20260822000000): WHICH branch anchored the value of stored energy -
            einspeisewert (a surplus slot's forgone feed-in) | bezugspreis (a
            deficit slot's avoided grid import - the trueb-horizon case) |
            marktpreis (cheapest refill where grid charging is allowed) |
            vorgabe (env-pinned, nothing derived). Additively extensible; a
            consumer that does not know a word IGNORES it rather than guessing.
            Null when the explain layer was off or on pre-feature runs - the
            surfaces then stay observational.
        whyRefillFreePct:
          type: number
          nullable: true
          description: >-
            Erklaerbarkeit Stufe 1 (schedule.why_refill_free_pct): how much of
            the battery's USABLE band the horizon refills for FREE (surplus in
            slots whose export value is <= 0), 0-100 - the summer statement
            "morgen fuellt Ihr Ueberschuss den Speicher ohnehin". Null when not
            evaluable (no usable band) - never a fabricated 0, which would read
            as "the horizon offers nothing".
        slots:
          type: array
          items:
            type: object
            properties:
              start: { type: string, format: date-time }
              batteryKw: { type: number, description: "Planned battery power; + = charge, - = discharge." }
              gridKw: { type: number, description: "Projected net grid power; + = import, - = export." }
              socPct: { type: number, description: "Planned state of charge at slot end." }
              priceEurMwh: { type: number }
              costEur: { type: number, description: "Projected slot cost with the plan." }
              baselineCostEur: { type: number, description: "Projected slot cost with the battery idle." }
              curtailKw: { type: number, nullable: true, description: "Planned PV curtailment for the slot (kW held back, >= 0); the optimizer curtails feed-in at negative prices. Null on pre-curtailment runs." }
              pvKw: { type: number, nullable: true, description: "PV forecast the slot planned with (kW, schedule.pv_kw). Feeds the pv-aware 'Laden aus dem Netz' derivation: grid-charging = charge beyond the slot's available PV (FK3 PV-bus semantics), not merely charging while importing. Null on rows without a persisted PV input." }
              loadKw: { type: number, nullable: true, description: "Load (consumption) forecast the slot planned with (kW, schedule.load_kw). Rendered with pvKw as the two forecast lines over the Fahrplan bars, so the plan explains itself. Null on rows without a persisted load input - the line is absent then, never a fabricated 0." }
              slotRole: { type: string, nullable: true, description: "Fahrplan-Warum role id (schedule.slot_role): warten | pv_speichern | guenstig_laden | eigenverbrauch | verkaufen | spitze_kappen | reserve_halten | abregeln (additively extensible). Null on pre-feature rows - the portal renders its chargeKind fallback then, never a fabricated explanation." }
              slotFlags: { type: array, nullable: true, items: { type: string }, description: "Binding-constraint codes (schedule.slot_flags CSV, split): soc_max, soc_floor, reserve_backup, reserve_peak, charge_cap, discharge_cap, solar_only, grid_limit_14a, feed_in_cap, peak_defining, curtailing. Null = no binding recorded / pre-feature row." }
              storedValueCtKwh: { type: number, nullable: true, description: "The EXACT value of a stored kWh at slot end (the run's SoC shadow price, ct/kWh, rounded 0.1 ct - schedule.stored_value_ct_kwh). Customer copy calls it 'Wert gespeicherter Energie'. Null on pre-feature rows." }
              gridValueCtKwh: { type: number, nullable: true, description: "Effective per-kWh energy value at the grid connection point (ct/kWh, schedule.grid_value_ct_kwh); deviates from the tariff exactly when §14a or the peak module deforms the slot's economics. Null on pre-feature rows." }
              peakPressureEurKw: { type: number, nullable: true, description: "The Leistungspreis allocation on this slot (EUR/kW, schedule.peak_pressure_eur_kw; sums to Leistungspreis + ratchet over the horizon). Null when the site runs no peak-shaving module or on pre-feature rows." }
              importPriceCtKwh: { type: number, nullable: true, description: "P0 Textwahrheit: what one IMPORTED kWh really costs the site in this slot (ct/kWh) - the price the optimizer decided with, not the bare spot in priceEurMwh. Recomposed (not persisted) by the api from spot + the site's tariff/Preisblatt via optimizer/SlotEconomics, the pricing.py twin. Null when the slot has no persisted spot price (a flat 'fest' tariff needs none); the portal degrades to a number-free sentence then and never labels spot as 'Netzstrom'." }
              exportValueCtKwh: { type: number, nullable: true, description: "P0 Textwahrheit: what one EXPORTED kWh really earns in this slot (ct/kWh) - spot + dynamic Marktprämie (Direktvermarktung) or the feste Vergütung (Eigenverbrauch), merchant mode bare spot. Recomposed like importPriceCtKwh; null when not computable." }
              importPriceSource: { type: string, nullable: true, description: "Which rule priced the import: fest | preisblatt | sammelaufschlag | default-flag | spot. A SITE-level fact, identical on every slot of a run; drives the sentence's price breakdown ('Börsenpreis X + Netzentgelte/Abgaben Y')." }
              measuredLoadKw: { type: number, nullable: true, description: "P3 Ist-Last: the MEASURED house consumption of this slot (kW) - the quarter-hour MEAN of telemetry.load_kw, i.e. the same quantity loadKw forecasts. Present only for slots that already happened; the RUNNING slot carries the mean of the samples measured so far. Null for future slots, slots without telemetry and sites reporting no load channel - the portal's solid Ist line is then absent, never a fabricated 0." }
              measuredPvKw: { type: number, nullable: true, description: "Ist-PV (the mirror of measuredLoadKw): the MEASURED PV production of this slot (kW) - the quarter-hour MEAN of telemetry.pv_power_kw, aggregated in the same pass/window as the measured load, i.e. the same quantity pvKw forecasts. It makes the PV forecast error visible and the EEG solar-charging rule ('Laden <= gemessene PV') checkable in the chart. Null for future slots, slots without telemetry and sites whose device reports no PV channel - the line is then absent, never a fabricated 0." }
              coverLoadFromBattery: { type: boolean, nullable: true, description: "Duty-Vorschau (schedule.cover_load_from_battery, migration V20260802010000): true = in THIS slot the device TRACKS the measured house deficit max(load - pv, 0) instead of executing the slot's forecast-derived watt value rigidly, i.e. the plan's batteryKw is a FORECAST here, not a command. Same boolean the frozen MQTT schedule contract carries; served so the Fahrplan can say it BEFORE the slot runs. TRI-STATE: null = not evaluated (pre-feature run / duty switch off), false = evaluated and no duty - the portal marks a phase only on an explicit true." }
              whyNextBest: { type: string, nullable: true, description: "Erklaerbarkeit Stufe 1 (schedule.why_next_best, migration V20260822000000): the best action this RESTING slot REJECTED - decken | verkaufen | solar_speichern | netzladen. Only physically ADMISSIBLE alternatives are named (charging needs SoC headroom and, in EEG mode, real PV surplus; netzladen needs the grid-charge permission), so a margin never describes an impossible action. Null on ACTIVE slots (the chosen action's marginal benefit is 0 at the optimum), when nothing else was possible, and on runs whose explain layer was off." }
              whyNextBestMarginCt: { type: number, nullable: true, description: "Erklaerbarkeit Stufe 1 (schedule.why_next_best_margin_ct): how much WORSE that rejected alternative would have been, in ct/kWh - always <= 0. |margin| <= 0.05 is a TIE and the surface must say so ('beides waere gerade fast gleich gut') instead of dressing an abwaegung up as certainty; on 17.08.2026 it was algebraically exactly 0,000 ct/kWh. Null exactly where whyNextBest is null - name and margin are ONE statement." }
              chargeFromSurplusOnly: { type: boolean, nullable: true, description: "Duty-Vorschau, charge-side mirror (schedule.charge_from_surplus_only, migration V20260802010000): true = in THIS slot the device clamps the commanded CHARGE to the measured solar surplus max(pv - load, 0) because buying the shortfall would be uneconomic - the plan's batteryKw is a forecast here too. Same tri-state discipline as coverLoadFromBattery." }
    ControlStatus:
      type: object
      description: Latest inverter-control confirmation for a site (report §5).
      properties:
        deviceId: { type: string, format: uuid }
        commandedKw: { type: number, nullable: true, description: "What the DEVICE regulates on. Since the in-slot duties this is the CORRECTED value, not the plan's watt value - executionMode/-Direction say why it differs." }
        confirmedKw: { type: number, nullable: true, description: "Setpoint the inverter read back." }
        allMatch: { type: boolean, description: "True when every controlled register confirmed its commanded value." }
        controlEnabled: { type: boolean, description: "Whether the device's control kill-switch is on." }
        certified: { type: boolean, description: "Whether the model is bench-certified for control." }
        mismatchRoles: { type: string, nullable: true, description: "Comma-separated roles that did not confirm (e.g. \"battery_power\")." }
        slotStart: { type: string, format: date-time, nullable: true }
        checkedAt: { type: string, format: date-time, description: "When the readback was taken (\"geprüft vor X\")." }
        controlSource: { type: string, nullable: true, enum: [schedule, default], description: "The device's COARSE truth: is a fresh plan driving it at all. It collapses every non-schedule mode (self-consumption fallback, a v2 desired holding the battery, calibration) into `default`, so it must never be rendered as \"the built-in safety rule is running\" - executionMode is the precise signal. Null for a pre-PR-3 row." }
        executionMode: { type: string, nullable: true, enum: [plan, follow, trim, fallback], description: "WHY the commanded value is what it is: `plan` = the plan's own value, `follow` = in-slot load following (discharge tracks the measured house deficit), `trim` = price-aware in-slot trim (charge held at the measured PV surplus), `fallback` = no fresh plan, the built-in self-consumption rule. Null for an older edge, or for a mode that maps onto none of them (the edge omits the block rather than mislabel it)." }
        executionDirection: { type: string, nullable: true, enum: [deepen, reduce], description: "Only for executionMode `follow`: the discharge was RAISED to cover the house (`deepen`) or LIMITED to what it needs (`reduce`). Both are deliberate; an unnamed correction reads as a defect. Null otherwise." }
        executionPlannedKw: { type: number, nullable: true, description: "The setpoint BEFORE the correction, so plan and execution can stand side by side instead of being two contradicting numbers under one word. Only for follow/trim." }
        executionTargetKw: { type: number, nullable: true, description: "The MEASURED value the correction tracks - the house deficit for `follow`, the PV surplus for `trim`; which one follows unambiguously from executionMode. Null when the device could not measure it (it never regulates blind, and never reports blind either) - never a fabricated 0." }
        certSource: { type: string, nullable: true, enum: [env, device, platform], description: "WHICH source granted the certification: `env` = the fleet-wide allowlist, `device` = a First-Light grant on that box, `platform` = the model register. Null = not certified, or an older edge - so an absent value must never be read as a claim about the source." }
        platformCertVerdict: { type: string, nullable: true, enum: [granted, covered_not_activated, not_covered, unknown], description: "What the PLATFORM model register says about this device's selected inverter. `covered_not_activated` = the model IS certified and one deliberate click is missing; `not_covered` = a bench run is genuinely needed. NULL is \"we do not know\" (an older edge, or one that never received a cloud document) and must NEVER be collapsed into `not_covered` - that would send a customer to a bench they do not need." }
        platformCertModel: { type: string, nullable: true, description: "The register entry that matched, so a surface can name WHICH model is covered/waiting." }
        platformCertReason: { type: string, nullable: true, description: "Plain-German cause where a covered-looking model still gets nothing (today: a contradicted bench write-sign convention)." }
    ControlCertification:
      type: object
      description: One bench-certified inverter model in the platform register.
      properties:
        brand: { type: string, description: "Catalog brand, stored lower-case." }
        model: { type: string, description: "Catalog model - the KEY, together with brand. A family is not a model: one bench run must never certify untested siblings." }
        family: { type: string, description: "The model's register family. CHECKED by the device, not derived - the same model under another register map is not what was proven." }
        controlPath: { type: string, nullable: true, enum: [remote, tou], description: "The control surface the bench run drove; it seeds Layer 1's sticky path decision. Null = the run states none." }
        invertControlSign: { type: boolean, nullable: true, description: "The bench-proven WRITE sign convention, which is firmware-dependent - so the DEVICE checks it against its own setting and fails closed on a contradiction. NULL and false are different statements: null = the bench did not answer the question (nothing is checked), false = it did." }
        certifiedAt: { type: string, format: date-time, description: "When the bench run happened (the substantive truth), separate from createdAt." }
        firmwareNote: { type: string, nullable: true, description: "The firmware it was proven on, as PLAIN TEXT for the operator - deliberately NOT a machine gate: the box cannot read a firmware version from the inverter, so a firmware window would be a promise nobody can check." }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
    CertifyControlModelRequest:
      type: object
      required: [brand, model, family]
      properties:
        brand: { type: string, maxLength: 64 }
        model: { type: string, maxLength: 128 }
        family: { type: string, maxLength: 64 }
        controlPath: { type: string, enum: [remote, tou] }
        invertControlSign: { type: boolean, nullable: true, description: "Omit when the bench run did not answer the sign question - omitted means the device checks nothing, false means it was proven not-inverted." }
        certifiedAt: { type: string, format: date-time, description: "Defaults to now when omitted." }
        firmwareNote: { type: string, maxLength: 512 }
        note: { type: string, maxLength: 512 }
    ControlActivation:
      type: object
      description: A plant whose battery control has been deliberately armed.
      properties:
        deviceId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        siteName: { type: string }
        tenantName: { type: string }
        externalRef: { type: string }
        activatedAt: { type: string, format: date-time }
        activatedBy: { type: string, description: "The JWT subject that clicked - the paper trail." }
        note: { type: string, nullable: true }
    CurtailmentStatus:
      type: object
      description: >
        Latest FEED-IN CURTAILMENT truth a site's device(s) reported (the
        additive `curtailment` heartbeat block). It is what turns the Fahrplan's
        "Abregeln" slot from a claim into a verifiable statement: the optimizer
        plans the PV cap, but whether the plant throttles depends on a manual
        per-unit release of the curtailment actor. Absent (204) = an older edge
        or a plant without a curtailment actor - consumers keep their PLAN
        wording then, never a fabricated execution claim.
      properties:
        deviceId: { type: string, format: uuid }
        units: { type: integer, description: "Curtailment-capable units the device has configured." }
        certifiedUnits: { type: integer, description: "Units carrying a per-unit First-Light release. certifiedUnits < units is THE actionable cause the portal names (\"0 von 2 Wechselrichtern freigegeben\")." }
        controlEnabled: { type: boolean, description: "The device's control kill-switch." }
        active: { type: boolean, description: "At least one unit currently APPLIES a cap." }
        appliedCapKw: { type: number, nullable: true, description: "Summed applied caps; null = none applied (never a fabricated 0)." }
        allMatch: { type: boolean, nullable: true, description: "Over the APPLYING units' readbacks; null = nothing applied. Only true is a confirmation - null must never be read as a disagreement." }
        possibleOverride: { type: boolean, description: "A unit's MEASURED power exceeds its cap after the settle window, so a foreign controller may be overriding the limit (Modbus has the lowest priority on Fronius)." }
        checkedAt: { type: string, format: date-time, description: "Newest per-unit readback timestamp - the freshness anchor. A stale block is NO evidence; the portal falls back to its plan wording." }
        exportGuard: { allOf: [{ $ref: "#/components/schemas/ExportGuard" }], nullable: true, description: "„Grenzen & Wächter\" Stufe 0: the live feed-in watchdog. null = not reported (older edge, or no feed-in limit configured) - never a fabricated \"no limit\"." }
        deviceExportLimit: { allOf: [{ $ref: "#/components/schemas/DeviceExportLimit" }], nullable: true, description: "The feed-in limit the INVERTER ITSELF holds. null = not reported (older edge, a family without a trustworthy register, or not read yet)." }
    ExportGuard:
      type: object
      description: >
        The live feed-in watchdog ("dynamische Einspeisebegrenzung") as the
        device reports it in every heartbeat. The box has been sending this
        block since it was built and the cloud read none of it, so the question
        "which feed-in limit does the box hold, and does it reach any device at
        all?" was only answerable through a maintenance tunnel - it cost two
        investigation rounds at Anlage Herzogau. `effective` is the field the
        block exists for: a watchdog that computes a perfect cap and writes it
        NOWHERE must say so instead of letting a plant believe in a protection
        it does not have.
      properties:
        limitKw: { type: number, description: "The feed-in limit at the grid connection point AS THE BOX KNOWS IT." }
        state: { type: string, enum: [ueberwacht, regelt, haelt, zieht_zusammen, sicherheitskappe], description: "The machine-readable word NEXT TO the German sentence; a word outside this vocabulary is dropped at ingest together with its whole block." }
        reason: { type: string, nullable: true, description: "The device's own German sentence for exactly that state - written ONCE on the device, so the :8484 card and the portal can never word the same verdict differently." }
        capKw: { type: number, nullable: true, description: "The plant-level PV cap the watchdog currently commands; null = none (never a fabricated 0)." }
        limiting: { type: boolean, description: "The cap is actually holding the producers back right now." }
        blind: { type: boolean, description: "The verdict was NOT formed from a fresh connection-point measurement (hold / contract / safe cap)." }
        effective: { type: boolean, description: "false = the cap can reach NO device at all." }
        reach: { type: string, nullable: true, description: "Names the gap in German; null when the cap reaches every unit." }
    DeviceExportLimit:
      type: object
      description: >
        The feed-in limit the INVERTER ITSELF holds - a foreign truth inside the
        customer's device, READ (never written) by the box. At Anlage Herzogau
        the Deye held an installer cap of 33,0 kW in register 0x00E7 while 70 kW
        were configured in the portal; the discrepancy was invisible for two
        investigation rounds because nobody read the register.
      properties:
        limitKw: { type: number, description: "The limit the device currently holds." }
        register: { type: string, description: "WHERE it came from (\"0x00e7\") - a number without its origin is not evidence." }
        readAt: { type: string, format: date-time, description: "Its OWN freshness anchor: the register is read at most once a day (one socket, no extra poll cadence), so it must never borrow checkedAt." }
    SiteSource:
      type: object
      description: >
        One measurement point of a site as the edge reports it. Absent
        measurements stay null (never a fabricated 0); a point that is stale or
        has never delivered says so via `health` instead of vanishing.
      properties:
        deviceId: { type: string, format: uuid, description: "The edge device that reported this point." }
        sourceId: { type: string, description: "Edge-local id (\"inverter\" for the primary)." }
        kind: { type: string, enum: [primary, source] }
        role: { type: string, nullable: true, description: "pv-generation | grid-meter | consumer; null for the primary." }
        label: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        pvKw: { type: number, nullable: true, description: "This point's OWN PV generation." }
        powerKw: { type: number, nullable: true, description: "Signed grid power, + import / - export." }
        loadKw: { type: number, nullable: true }
        health: { type: string, enum: [ok, stale, never] }
        readAt: { type: string, format: date-time, nullable: true }
        reportedAt: { type: string, format: date-time }
    SupplyPrice:
      type: object
      description: >
        One Anlage's structured supply-price sheet (site_supply_price, report
        vp-nacht-bezug-e7 §3.1). Components ct/kWh NETTO, all nullable (null =
        unknown, contributes nothing).
      properties:
        present: { type: boolean, description: "A row exists (false => portal prefills suggestions)." }
        hasComponents: { type: boolean, description: "At least one component maintained (the activation gate)." }
        netzentgeltArbeitspreisCt: { type: number, nullable: true }
        stromsteuerCt: { type: number, nullable: true }
        konzessionsabgabeCt: { type: number, nullable: true }
        umlagenCt: { type: number, nullable: true, description: "KWKG + Offshore + section 19 StromNEV as ONE sum." }
        vertriebsaufschlagCt: { type: number, nullable: true }
        ustPct: { type: number, nullable: true, description: "USt on everything incl. spot; 0 for Vorsteuer-Abzug (C&I)." }
        komponentenStand: { type: string, format: date, nullable: true, description: "Preisblatt gültig ab." }
        updatedAt: { type: string, format: date-time, nullable: true }
    UsageProfile:
      type: object
      description: >
        AE7 Nutzungsprofil read-model (docs/contracts/v2/usage-profile.md): the
        effective usage profile, the derived default, the override, the emphasis
        map and the signals it was derived from.
      properties:
        usageProfile:
          type: string
          enum: [arbitrage, peak, private]
          description: The EFFECTIVE profile (override when set, else the derived default).
        derivedProfile:
          type: string
          enum: [arbitrage, peak, private]
          description: The derived default, ignoring any override.
        override:
          type: string
          nullable: true
          enum: [arbitrage, peak, private]
        emphasis:
          type: object
          description: Which surfaces are prominent | secondary | minimal | hidden.
          properties:
            money: { type: string, enum: [prominent, secondary, minimal, hidden] }
            peak: { type: string, enum: [prominent, secondary, minimal, hidden] }
            flow: { type: string, enum: [prominent, secondary, minimal, hidden] }
            devices: { type: string, enum: [prominent, secondary, minimal, hidden] }
        signals:
          type: object
          properties:
            hasStorage: { type: boolean }
            hasPv: { type: boolean }
            hasControllableConsumer: { type: boolean }
            activeStrategyNodeTypes:
              type: array
              items: { type: string, example: vp.strategy.market }
            plantKind: { type: string, nullable: true }
            hasLeistungspreis: { type: boolean }
    SiteProfiles:
      type: object
      properties:
        profiles:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                enum: [eigenverbrauch, marktvermarktung, lastspitzenkappung, atypische-netznutzung]
              label: { type: string, description: Customer-facing German name. }
              state:
                type: string
                nullable: true
                enum: [an, aus]
                description: The STORED customer intent; null = derived default.
              derivedActive: { type: boolean, description: What the derivation alone says. }
              active: { type: boolean, description: Effective state after the intent overlay. }
              unlocks:
                type: object
                properties:
                  views: { type: array, items: { type: string } }
                  widgets: { type: array, items: { type: string } }
                  moneyStream: { type: string, nullable: true }
              requirements:
                type: array
                items:
                  type: object
                  properties:
                    label: { type: string }
                    met: { type: boolean }
              blockedReason:
                type: string
                nullable: true
                description: >
                  Honest German sentence for a switched-on profile that cannot
                  fully run yet. Never a request prompt.
              origin: { type: string, nullable: true, enum: [masterdata, flow] }
              flowRef:
                type: object
                nullable: true
                properties:
                  flowId: { type: string, format: uuid }
                  name: { type: string }
              gatedNodeTypes: { type: array, items: { type: string } }
              gatedNodesEnabled: { type: boolean }
    FlowNodeGovernance:
      type: object
      description: AE7 node governance - the gated strategy node types + per-site enablement.
      properties:
        gatedNodes:
          type: array
          items:
            type: object
            properties:
              type: { type: string, example: vp.strategy.market }
              label: { type: string, example: Marktoptimierung }
              gated: { type: boolean }
              enabled: { type: boolean, description: Enabled for THIS site. }
    FlowLayout:
      type: object
      description: >
        Portal v3 M5 - the editor canvas positions of a flow, stored OUTSIDE the
        hashed flow document (a dragged position must never change content_hash).
      properties:
        positions:
          type: object
          additionalProperties:
            type: object
            properties:
              x: { type: number }
              y: { type: number }
          description: node id -> {x, y} in canvas coordinates.
    FlowLiveStatus:
      type: object
      description: >
        Portal v3 M5 - what the DEVICE reports about a site's flows. Read-only.
      properties:
        acks:
          type: array
          description: One deployment ack per flow the device runs.
          items:
            type: object
            properties:
              flowId: { type: string, format: uuid }
              flowVersion: { type: integer }
              contentHash: { type: string, nullable: true }
              state: { type: string, enum: [active, error, unsupported] }
              detail: { type: string, nullable: true }
              reportedAt: { type: string, format: date-time, nullable: true }
        nodes:
          type: array
          description: >
            The per-node live states. EMPTY when the device does not send the
            feature-flagged block - the editor then shows channel values only,
