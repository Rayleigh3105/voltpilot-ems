      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: User deleted; their login stops working immediately. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant or user not found (including a user outside this tenant). }
        "409": { description: Attempt to delete one's own account. }
  /api/v1/admin/tenants/{tenantId}/users/{userId}/disable:
    post:
      tags: [admin]
      summary: Disable a customer user (blocks their logins).
      description: >
        Admins can never disable their OWN account (409) - the guard fires
        before any tenant check.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant or user not found (including a user outside this tenant). }
        "409": { description: Attempt to disable one's own account. }
  /api/v1/admin/tenants/{tenantId}/users/{userId}/enable:
    post:
      tags: [admin]
      summary: Re-enable a disabled customer user.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant or user not found (including a user outside this tenant). }
  /api/v1/admin/tenants/{tenantId}/users/{userId}/reset-password:
    post:
      tags: [admin]
      summary: Reset a customer user's password (support lever).
      description: >
        The platform has no SMTP and therefore no self-service password reset;
        this is how support recovers a customer who forgot their password or
        locked themselves out guessing. Sets the new password (`temporary`
        defaults to true: must be changed on next login) and lifts any
        brute-force lockout so the new password works immediately.
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200":
          description: Password reset; any lockout lifted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { description: Invalid password (must be 8-128 characters). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Tenant or user not found (including a user outside this tenant). }
  /api/v1/admin/sites/{siteId}/optimizer-diagnostics:
    get:
      tags: [admin]
      summary: Per-slot "why" view of one persisted optimizer run (Portal-Admin).
      description: >
        The plan's slots PLUS the per-slot euro decomposition the P1-P5 solver
        redesign actually optimized against: the bare spot price
        (`solverPriceCtKwh`), the real import price per the site's tariff
        (spot+Aufschlag / flat / spot), the real export value (spot + dynamic
        Marktprämie for Direktvermarktung incl. the §51 negative-price
        suspension; feste EEG-Einspeisevergütung incl. §51a for Eigenverbrauch;
        bare spot in merchant mode - mirrors the optimizer's pricing.py), the
        PERSISTED per-slot wear spend and its derived ct/kWh rate, an
        explicitly-APPROXIMATE stored-energy value (forward best-use price
        discounted by efficiency and wear - NOT a MILP shadow price), a
        decision label (the portal chargeKind twin) and one composed German
        rationale per slot. Fields that are honestly not computable for a slot
        (no persisted spot, pre-P2 rows without wear, battery-less site) are
        null, never a fabricated 0.

        Requires the `platform-admin` role AND the `X-Tenant-Id` tenant
        switcher: the read runs RLS-scoped over the selected tenant's own data
        (no BYPASSRLS); no tenant selected or the wrong tenant = 404. The §14a
        limit a run used is not persisted and therefore not returned;
        forecast-model lifecycle comes from GET /sites/{siteId}/forecast-quality.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: generatedAt
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: >
            Select a historical run by its exact generated_at; omitted = the
            latest run (or, with `date`, that day's newest run). An unknown
            timestamp is a 404 (never silently the latest); `availableRuns`
            in the response lists the day's choices.
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: >
            A Europe/Berlin calendar day: scopes `availableRuns` to that day's
            runs (the schedule hypertable keeps every run, so navigation is
            per day) and, without an explicit `generatedAt`, shows the day's
            newest run. A day without runs returns an empty well-formed body
            (not 404 - gaps inside the covered range are possible). Omitted =
            the shown run's day. `firstRunDate`/`lastRunDate` in the response
            bound the picker.
      responses:
        "200":
          description: >
            The run's diagnostics; a site without any plan yet returns an
            empty well-formed body (generatedAt null, no slots).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptimizerDiagnostics" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not visible for the selected tenant, or unknown generatedAt. }
  /api/v1/admin/sites/{siteId}/optimizer-config:
    get:
      tags: [admin]
      summary: The site's optimizer knobs - platform defaults, overrides, effective values.
      description: >
        Platform defaults mirror the optimizer's `OPTIMIZER_*` environment
        (the api receives the same variables - keep them in sync in compose);
        overrides are the nullable per-site/per-asset columns
        (`asset.wear_cost_ct_per_kwh`, `asset.soc_min_pct`/`soc_max_pct`,
        `site.backup_reserve_soc_pct`); effective = override ?? default. The
        pre-existing site levers (netzladen_erlaubt, plant_kind, tariff,
        anzulegender Wert) are echoed READ-ONLY - they stay editable via
        PUT /api/v1/sites/{siteId} (admins: with the X-Tenant-Id switcher).
        Terminal-value settings are env-level and read-only here. Same
        auth/tenancy as optimizer-diagnostics.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The merged config view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptimizerConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not visible for the selected tenant. }
    put:
      tags: [admin]
      summary: Write the per-site / per-asset optimizer overrides.
      description: >
        FULL-REPRESENTATION for the four override fields: the body IS the
        override state, a null/absent field CLEARS that override back to the
        platform default (matching the columns' NULL semantics). Battery
        fields (wear cost, SoC band) require a battery asset (409 otherwise);
        the EFFECTIVE SoC band (override ?? default per side) must stay a real
        window (400). Changes apply on the optimizer's next 15-min cycle - no
        re-solve is triggered here; use POST optimizer-what-if (design §4.3)
        to preview a knob change before saving it.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOptimizerConfigRequest" }
      responses:
        "200":
          description: The updated merged config view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OptimizerConfig" }
        "400": { description: Invalid value range or inconsistent effective SoC band. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not visible for the selected tenant. }
        "409": { description: Battery override on a site without a battery asset. }

  /api/v1/admin/sites/{siteId}/optimizer-what-if:
    post:
      tags: [admin]
      summary: Preview a knob change - solve this site twice, persist nothing.
      description: >
        The on-demand what-if re-optimize (design vp-admin-optimizer-ui-design
        §4.3). The api resolves the site through the RLS-scoped datasource
        (X-Tenant-Id switcher; a site the selected tenant cannot see is 404 and
        is never forwarded) and then asks the optimization service's internal
        synchronous solve surface to gather ONE fresh set of inputs
        (prices/forecasts/SoC/§14a/tariff of the real plant) and solve it
        TWICE: `baseline` as the site is configured, `variant` with the posted
        knobs. The delta is variant minus baseline.


        EPHEMERAL BY CONSTRUCTION: no plan is persisted to `schedule`, no MQTT
        schedule is published, the site's stored settings are untouched and the
        run currently in force stays in force. The comparison deliberately does
        NOT use the site's persisted run - that was generated at another time
        over another horizon with another price vintage, so a delta against it
        would attribute the passage of time to the knob.


        Every override field is OPTIONAL; absent means "leave as configured"
        (never zero), so an empty body simply re-solves the site as it stands.
        `backupReserveSocPct: 0` IS "no reserve" - a 0 % floor and no floor are
        the same constraint. Solves take well under a second, hence a plain
        synchronous response and no job id; concurrent runs are bounded, so a
        saturated service answers 429.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhatIfRequest" }
      responses:
        "200":
          description: Both freshly solved plans plus their delta. Nothing was committed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhatIfResult" }
        "400":
          description: >
            Invalid knobs (range, inverted SoC band) or a site that honestly
            cannot be planned right now (no price coverage). Body carries a
            German `message`.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Site not visible for the selected tenant. }
        "409": { description: The site has no battery asset - nothing to re-plan. }
        "429": { description: Too many concurrent re-optimizes; retry shortly. }
        "502": { description: The solve service is unreachable; the stored plan is unchanged. }
  /api/v1/sites/{siteId}/consumer-options:
    get:
      tags: [consumer]
      summary: The Anlagen-Modell assistant's capability-/context-filtered inputs.
      description: >
        The consumer types the site may create (catalog category=consumer,
        controllable, non-composed - each with its allowed control kinds, default
        failsafe and per-type intent suggestions), the condition SIGNAL catalog
        (name/label/class/valueType; cloud signals are compiled to windows and
        carry no hysteresis, D1), the four intent cards, whether the site has a
        storage (steers the storage questions, E3), the edge-reported sources
        that can back a consumer, and the master-data defaults. Tenant-scoped (RLS
        foreign site = 404).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The assistant inputs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/consumers:
    get:
      tags: [consumer]
      summary: List the site's controllable consumers.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The consumers with their master data + control-activation state.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Consumer" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
    post:
      tags: [consumer]
      summary: Create a consumer (connected to a reported source, or as a draft).
      description: >
        Creates the consumer as a v2 entity + its consumer_profile. `edgeSourceId`
        binds a reported source ("verbunden"); omitting it creates an unconnected
        DRAFT ("Noch nicht verbunden"). The requested `controlKind` is refused
        (422) when the device type cannot execute it (§16 - never widened by a
        customer value). No real command is issued in Increment 1.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConsumerRequest" }
      responses:
        "201":
          description: The created consumer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consumer" }
        "400": { description: Unknown type / invalid master data. Body carries a German `message`. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
        "409": { description: The chosen reported source is already assigned to a consumer. }
        "422": { description: The device type cannot execute the requested control kind. }
  /api/v1/sites/{siteId}/consumers/{id}:
    get:
      tags: [consumer]
      summary: Read one consumer's master data + state.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The consumer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consumer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Consumer/site not found for this tenant. }
    patch:
      tags: [consumer]
      summary: Edit a consumer's master data (optimistic via version).
      description: >
        Optimistic concurrency: send `expectedVersion`; a stale value is refused
        with 409. The control kind is again mapped onto the device capabilities
        (§16). `name` updates the entity label.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchConsumerRequest" }
      responses:
        "200":
          description: The updated consumer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consumer" }
        "400": { description: Invalid master data. Body carries a German `message`. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Consumer/site not found for this tenant. }
        "409": { description: Version conflict (someone else changed it first). }
        "422": { description: The device type cannot execute the requested control kind. }
    delete:
      tags: [consumer]
      summary: Fachlich stilllegen (409 while still connected).
      description: >
        Removes an UNCONNECTED consumer (returning the site to its pre-consumer
        state - Increment 1 holds no audit/fulfilment data). A consumer still
        bound to a device/source is refused (409): disconnect first (physische
        Registry-Bereinigung erst nach Deaktivierung, §11).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Consumer/site not found for this tenant. }
        "409": { description: Still connected to a device/source; disconnect first. }
  /api/v1/sites/{siteId}/consumers/{id}/policy:
    get:
      tags: [consumer]
      summary: Read the consumer's latest policy (204 when none).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The latest policy version (draft in Increment 1).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerPolicyVersion" }
        "204": { description: No policy authored yet. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Consumer/site not found for this tenant. }
    put:
      tags: [consumer]
      summary: Save a new DRAFT policy version.
      description: >
        Validates the policy document against consumer-policy.schema.json + the
        semantic ConsumerPolicyValidator (kind/enforcement coherence, must_run⇒grid
        allow, condition-tree limits, cloud-vs-local hysteresis, catalog signals,
        D4 power ranges, 24:00 normalisation) and stores it as the next DRAFT
        version. The document's `entity_id` is stamped from the path (a body can
        never target another entity). content_hash is derived from canonical JSON.
        Activation does not exist yet (Increment 1).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document:
                  type: object
                  description: A consumer-policy document (consumer-policy.schema.json).
      responses:
        "200":
          description: The stored draft version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerPolicyVersion" }
        "400": { description: The policy is invalid. Body carries a German `message`. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Consumer/site not found for this tenant. }
  /api/v1/sites/{siteId}/consumers/{id}/policy/activate:
    post:
      tags: [consumer]
      summary: Validate, compile and atomically activate the latest policy version (Inkrement 4).
      description: >
        Verbrauchssteuerung §11/§13.2 (D-19): validates the LATEST policy
        version, compiles its reactive-with-local requirements into at most ONE
        generated flow artifact (precomputed UTC price windows per D1, local
        signals with freshness + hysteresis, must_run → the bounded D-5
        override) and activates atomically - previous active version retired,
        the artifact rolled out over the EXISTING retained flow-deployment set.
        Flag-gated (VOLTPILOT_CONSUMER_CONTROL_ENABLED +
        VOLTPILOT_CONSUMER_POLICY_COMPILER_ENABLED, both default OFF): with a
        flag off the response is 200 with activated:false and a reason
        (activation_disabled / compiler_disabled) - the rule stays a draft. A
        compiler or rollout failure is 503 and the previously active version
        stays UNCHANGED. An entity already claimed by another active automation
        is 409 naming it (V-5).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Outcome envelope (activated true/false + reason + published).
          content:
            application/json:
              schema:
                type: object
                properties:
                  activated: { type: boolean }
                  reason: { type: string, nullable: true, description: "activation_disabled | compiler_disabled | null" }
                  message: { type: string }
                  published: { type: boolean }
                  policyVersion: { type: integer, nullable: true }
        "400": { description: No policy yet / the stored policy is invalid. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Consumer/site not found for this tenant. }
        "409": { description: The entity is already controlled by another active automation (named in `message`). }
        "422": { description: The consumer is not connected yet (E11). }
        "503": { description: Compiler/rollout unavailable - the previously active version is unchanged. }
  /api/v1/sites/{siteId}/consumers/{id}/policy/deactivate:
    post:
      tags: [consumer]
      summary: The real stop path - retire the active policy AND retract the retained artifact.
      description: >
        §16: works INDEPENDENTLY of the activation feature flags (a disabled
        flag must never leave a deployed rule looking stopped). Retires the
        active policy version and re-publishes the site's retained deployment
        set WITHOUT the generated artifact.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Stopped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  published: { type: boolean }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Consumer/site not found for this tenant. }
        "409": { description: No active policy. }
  /api/v1/sites/{siteId}/consumers/{id}/pause:
    post:
      tags: [consumer]
      summary: Pause the consumer (Gesamtschalter off, device failsafe applies).
      description: >
        §11/§16: flips the consumer's enable switch off, retracts the generated
        artifact from the retained deployment set and lets the desired TTLs
        expire - the entity falls to its registry failsafe. Works with the
        activation flags OFF (stop paths are never flag-gated).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Paused.
          content:
            application/json:
              schema:
                type: object
                properties:
                  published: { type: boolean }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Consumer/site not found for this tenant. }
  /api/v1/sites/{siteId}/consumers/{id}/resume:
    post:
      tags: [consumer]
      summary: Resume after a pause (re-enable + re-deploy the stored artifact, no compile).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Outcome envelope (the activate shape).
          content:
            application/json:
              schema:
                type: object
                properties:
                  activated: { type: boolean }
                  reason: { type: string, nullable: true }
                  message: { type: string }
                  published: { type: boolean }
                  policyVersion: { type: integer, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Consumer/site not found for this tenant. }
        "409": { description: No active policy to resume. }
        "503": { description: Rollout unavailable. }
  /api/v1/sites/{siteId}/consumer-schedule:
    get:
      tags: [consumer]
      summary: Consumer slots of the newest co-optimizer run (Fahrplan view).
      description: >
        Verbrauchssteuerung Inkrement 2 (§14.11): the planned consumer slots of
        the site's newest co-optimized run, one entity per consumer with its
        FULL slot grid (command on_off|setpoint_kw, target value, §15
        reason_code, served requirement). SHADOW semantics: rows exist only for
        sites the optimizer co-plans (VOLTPILOT_V2_PLAN_SITES) with active
        policies - nothing controls a device. Without a stored run the body is
        well-formed and empty (planId/generatedAt null, entities []); the
        Fahrplan then renders byte-identical to the pre-consumer view.
        Tenant-scoped via RLS (foreign site = 404).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The newest run's consumer slots (possibly empty).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerSchedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/modbus-probe:
    post:
      tags: [probe]
      summary: Read registers on this plant's device ONCE and show what came back.
      description: >
        Einheitsmodell Stufe 0b. The api publishes a NON-retained probe on
        ems/{tenant}/{site}/{device}/v2/probe (contract
        docs/contracts/mqtt-probe.schema.json) and waits ~5 s for the device's
        answer; nothing is stored on either side.


        Honesty rules the response carries: a successful line has raw AND value
        side by side (the pair that makes a scaling mistake visible) plus the
        raw 16-bit register words; a failed line carries a NAMED German class
        and no value at all - never a fabricated 0. A device that does not
        answer in time yields errorCode `timeout` with HTTP 200: that is an
        honest outcome the assistant renders, not an error.


        Which device is asked is never guessed - `deviceId` is optional only
        while the plant has exactly one device; several devices without a
        choice is a named 409.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProbeRequest" }
      responses:
        "200":
          description: >
            The device's answer, or the honest timeout/rate-limit outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeResult" }
        "400": { description: The request form is not readable (validation). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site or device not found for this tenant. }
        "409": { description: The plant has no device, or several and none was chosen. }
        "503": { description: The plant could not be reached to ask at all. }
  /api/v1/sites/{siteId}/consumer-status:
    get:
      tags: [consumer]
      summary: Edge-reported live states of the site's consumers.
      description: >
        Verbrauchssteuerung Inkrement 3 (D9/§15.1, a §11 status excerpt): the
        device heartbeat's additive consumers block, ingested by its own
        sibling listener into consumer_runtime_status (one row per entity,
        replaced wholesale per heartbeat; unknown state/reason words are
        discarded at ingest, never stored). An EMPTY list is the honest
        no-evidence state ("Zustand nicht bestätigt") - the portal then
        renders byte-identical to before. Tenant-scoped via RLS (foreign
        site = 404).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Reported consumer states (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsumerRuntimeStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/consumers/{id}/status:
    get:
      tags: [consumer]
      summary: One consumer's edge-reported live state.
      description: >
        The single-entity form of consumer-status. 204 without evidence -
        never a fabricated live state.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The reported state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerRuntimeStatus" }
        "204": { description: No reported state yet ("Zustand nicht bestätigt"). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/rule-events:
    get:
      tags: [rules]
      summary: Das Regel-Protokoll der Anlage (Zähler, Verlauf je Regel, Gesamt-Protokoll).
      description: >
        Einheitsmodell Stufe 5b (Konzept vp-komponenten-einheit-h2 Teil 5b.6):
        der Verlaufsspeicher, den die Momentaufnahmen-Tabellen
        (consumer_runtime_status, flow_device_ack) je Herzschlag wegwerfen.
        Geschrieben wird AUSSCHLIESSLICH aus WECHSELN im bestehenden
        Herzschlag-Strom - keine Edge-Änderung, kein neues Topic.
        Ehrlichkeitsregeln, die jede Fläche kennen muss: `switchedToday` ist
        NULLABLE (null = der Speicher hat den heutigen Tag nicht ganz gesehen,
        die Fläche sagt dann "seit HH:MM aufgezeichnet" statt einer 0),
        `recordingSince` null = für diese Anlage wurde noch gar nicht
        aufgezeichnet, und `accuracySeconds` nennt die Genauigkeit (der
        Herzschlag-Takt; ein Wechsel-und-zurück dazwischen ist unsichtbar).
        Mandantenbezogen über RLS (fremde Anlage = 404).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Das Protokoll (leer, solange nichts aufgezeichnet wurde).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleEvents" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Site not found for this tenant. }
  /api/v1/sites/{siteId}/command-history:
    get:
      tags: [commands]
      summary: Der Kommando-Verlauf einer Anlage bzw. EINER Komponente.
      description: >
        Kommando-Transparenz V1 (Konzept vp-kommando-transparenz-k3 §6.3): die
        Halteperioden und Punkt-Ereignisse EINES Zeitraums, aelteste zuerst,
        plus der Live-Zustand (control/curtailment - woertlich die DTOs der
        beiden bestehenden Momentaufnahme-Routen, damit keine zweite Wahrheit
        ueber dieselbe Sekunde entsteht).
        Ehrlichkeitsregeln, die jede Flaeche kennen muss: `recordingSince` null
        = fuer diese Anlage wurde noch gar nicht aufgezeichnet (ein leerer
        Verlauf ist dann KEINE entlastende Aussage), `writes` false = an diese
        Komponente geht kein Befehl, sie wird nur gelesen (die F4-Antwort),
        die vier `cycles*` sind in V1 IMMER null (aus 15-Sekunden-Momentaufnahmen
        laesst sich die Zahl der 10-Sekunden-Schreibvorgaenge nicht ableiten),
        `accuracySeconds` nennt die Genauigkeit, und `truncated` sagt, dass der
        Deckel gegriffen hat. Mandantenbezogen ueber RLS (fremde Anlage = 404).
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: entity
          in: query
          required: false
          description: >
            Die Komponente. Fehlt sie, umfasst die Antwort die ganze Anlage.
            Mit ihr kommen IHRE Zeilen plus die geraetebezogenen Zeilen ihres
            Geraets (entityId null) - die betreffen den Schreibweg, ueber den
            sie gesteuert wird, und waeren sonst nirgends sichtbar.
          schema: { type: string, format: uuid }
        - name: device
          in: query
          required: false
          description: >
            Das GERAET (Anlagen-Zentrale Stufe 1): die Referenz der VoltPilot-Box,
            die vom Edge gemeldete Quellen-Kennung eines Geraets dahinter
            (`inverter`, `src-...`) oder `cp-<ChargePointId>` einer Ladesaeule.
            Die BOX bekommt jede Zeile ihres Geraets - auch die geraetebezogenen
            ohne Komponente (die Abregelung), denn sie IST der Schreibweg der
            Anlage. Ein Geraet DAHINTER bekommt nur die Zeilen SEINER
            Komponenten: eine anlagenweite Abregelung einem von drei
            Wechselrichtern zuzuschreiben waere eine erfundene Zuordnung.
            Unbekannte Adresse = 404; zusammen mit `entity` = 400 (zwei
            verschiedene Fragen).
          schema: { type: string }
        - name: range
          in: query
          required: false
          description: >
            Tag, Woche oder Monat (Europe/Berlin-Kalender). Vorgabe `day`.
            Ein JAHR gibt es bewusst nicht - es ueberschritte die Aufbewahrung
            und waere damit ein Fenster, das per Konstruktion unvollstaendig
            antwortet.
          schema: { type: string, enum: [day, week, month], default: day }
        - name: at
          in: query
          required: false
          description: Anker-Datum des Zeitraums (Vorgabe heute).
          schema: { type: string, format: date }
        - name: from
          in: query
          required: false
          description: >
            Ein eigener Zeitraum, erster Kalendertag (nur zusammen mit `to`;
            schliesst `range`/`at` aus). Weiter zurueck als die Aufbewahrung
            (90 Tage) wird ABGELEHNT statt still gekappt: dort laege nichts
            mehr, und ein leeres Fenster laese sich als "damals wurde nichts
            geschickt" - eine entlastende Aussage ueber eine geloeschte Zeit.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: >
            Letzter Kalendertag des eigenen Zeitraums, EINSCHLIESSLICH - ein
            Fenster, das um 00:00 dieses Tages endete, liesse den ganzen
            gewaehlten Tag aussen vor.
          schema: { type: string, format: date }
        - name: streams
          in: query
          required: false
          description: >
            Befehlsart(en), komma-getrennt: `batterie` `abregelung`
            `verbraucher` `ladepunkt` `register`. Fehlt der Parameter, gilt
            keine Einschraenkung. Ein Wort ausserhalb des Vokabulars ist ein
            BENANNTER 400 (nie ein stiller Rueckfall auf "alles" - der zeigte
            MEHR Zeilen als verlangt).
          schema: { type: string }
        - name: sources
          in: query
          required: false
          description: >
            Herkunft/Herkuenfte, komma-getrennt: `cloud_abgeleitet` `geraet`
            `portal`.
          schema: { type: string }
        - name: verdicts
          in: query
          required: false
          description: >
            Ergebnis(se), komma-getrennt. Halteperioden: `bestaetigt`
            `abweichend` `keine_antwort` `prueft` `unbestaetigt` plus
            `fremdeinfluss` und `notaus` (beides KEINE Ruecklese-Urteile - sie
            leben in eigenen Spalten, weil sie andere Fragen beantworten).
            Register-Vorgaenge: `uebernommen` `nicht_uebernommen`
            `keine_quittung`. Ein Filter, der nur Woerter EINES Vokabulars
            nennt, schliesst den anderen Speicher aus - eine Zeile ohne dieses
            Ergebnis ist kein Treffer.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Zeilen je Speicher (1..2000). Vorgabe 500.
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
        - name: before
          in: query
          required: false
          description: >
            Der Seiten-Cursor nach hinten (`nextBefore` der vorigen Antwort):
            nur Zeilen, die BIS zu diesem Zeitpunkt begannen.
            Verglichen wird `<=`, nicht `<` - zwei Zeilen duerfen denselben
            Beginn tragen, und ein striktes Kleiner verloere die zweite lautlos
            an der Seitengrenze. Die Grenzzeile kommt deshalb ZWEIMAL; die
            Flaeche mischt die Seiten ueber die `id`.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Der Verlauf (leer, solange nichts aufgezeichnet wurde).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandHistory" }
        "400": { description: Unbekannter Zeitraum oder unbekanntes Filter-Wort. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Anlage oder Komponente nicht gefunden. }
  /api/v1/sites/{siteId}/register-write/preview:
    post:
      tags: [register-write]
      summary: Schritt 1 - den Ist-Wert eines Registers lesen (Vorschau).
      description: >
        Liest das Register EINMAL ueber die Schreib-Lane und liefert Roh- UND
        (wo eine Skala bekannt ist) skalierten Wert plus die Warnklasse. Es wird
        NICHTS geschrieben und NICHTS protokolliert - eine Lesung aendert nichts,
        und ein Protokoll der Lesungen wuerde die Schreibvorgaenge begraben, fuer
        die das Journal existiert.
        Weil die Vorschau ueber DIESELBE Lane laeuft, beweist sie mit, dass der
        Schreibweg offen ist: eine Ablehnung ("die Steuerung besitzt dieses
        Register gerade") erscheint hier, nie erst nach dem Klick.
        Ein Ausbleiben der Antwort ist ein ehrlicher AUSGANG (200 mit
        `errorCode: timeout`), kein Fehler.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterWriteRequest" }
      responses:
        "200":
          description: Das Ergebnis der Vorschau (auch ein benannter Fehlschlag ist 200).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterWriteOutcome" }
        "400": { description: Adresse oder Registerart nicht lesbar. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Anlage oder Geraet nicht gefunden. }
        "409": { description: Die Anlage hat kein oder mehr als ein Geraet - das Ziel wird nie geraten. }
        "503": { description: "Die Anlage ist gerade nicht erreichbar (nichts angefordert) - ODER das Register-Schreiben ist plattformweit abgeschaltet (voltpilot.register-write.enabled=false); der deutsche Grund unterscheidet die beiden." }
  /api/v1/sites/{siteId}/register-write:
    post:
      tags: [register-write]
      summary: Schritt 2 - der EINE Schreibvorgang, mit Beleg und Papier-Spur.
      description: >
        Schreibt das Register GENAU EINMAL (kein Retry, kein Auffrischen - es
        liegt im EEPROM) und liest ~2 s spaeter zurueck.
        `expectedBefore` reist als Waechter mit: hat sich der Ist-Wert seit der
        Vorschau geaendert, verweigert die Box, statt blind zu ueberschreiben.
        Die Bestaetigung des Downlink-Kontrakts baut der SERVER aus Adresse und
        Wert (Protokoll-Sicherheit, kein Tipp-Zwang).
        `note` ist PFLICHT bei Registern der Klasse `netz_compliance` (in Stufe 1
        also bei 0x00E7) und sonst freiwillig; sie wandert VERBATIM ins Journal.
        Reihenfolge: erst veroeffentlichen, dann protokollieren - scheitert schon
        das Veroeffentlichen (503), entsteht KEINE Zeile, die eine Anforderung
        behauptet, die es nie gab.
        Bleibt die Quittung aus, ist der Ausgang `unbekannt` - ausdruecklich NICHT
        "nicht geschrieben"; die Quittung landet im Journal, sobald sie eintrifft.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterWriteRequest" }
      responses:
        "200":
          description: Der Beleg (auch eine Ablehnung der Box ist 200 mit ihrem deutschen Grund).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterWriteOutcome" }
        "400": { description: Wert/Adresse nicht lesbar, oder die Pflicht-Notiz fehlt. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Anlage oder Geraet nicht gefunden. }
        "409": { description: Die Anlage hat kein oder mehr als ein Geraet. }
        "503": { description: "Die Anlage ist gerade nicht erreichbar (es wurde NICHTS geschrieben) - ODER das Register-Schreiben ist plattformweit abgeschaltet; der deutsche Grund unterscheidet die beiden." }
  /api/v1/sites/{siteId}/register-write/targets:
    get:
      tags: [register-write]
      summary: Der Geraete-Picker - welche Geraete als Ziel in Frage kommen.
      description: >
        Es entsteht KEINE neue Wahrheit: die Liste kommt aus dem, was die BOX
        ueber ihre Einrichtung meldet (local_setup) und aus den
        portal-verwalteten Komponenten. Ein Geraet OHNE Schreibweg wird
        GENANNT (`writable: false` + `reason`), nie verschwiegen - es
        wegzulassen erzeugte die Frage "warum fehlt mein Geraet?" und
        beantwortete sie nirgends. `writable` ist eine ANZEIGE-Hilfe, kein
        Tor: was wirklich geht, entscheidet das Geraet.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Die Ziele dieser Anlage.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RegisterWriteTarget" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Anlage nicht gefunden. }
  /api/v1/sites/{siteId}/register-write/register-knowledge:
    get:
      tags: [register-write]
      summary: Das kuratierte Register-Wissen (reine Anzeige).
      description: >
        Der Nachschlage-Teil des Experten-Modus: je Register-FAMILIE die
        bekannten Register mit Klartext-Namen, Warnklasse und - wo bekannt -
        Skala und Einheit. Es entscheidet NICHTS und sperrt nichts; ein
        Register, das hier fehlt, ist schreibbar und heisst ehrlich
        "unbekannt".
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Das Verzeichnis, Familie fuer Familie.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RegisterKnowledgeFamily" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Anlage nicht gefunden. }
  /api/v1/sites/{siteId}/register-write/history:
    get:
      tags: [register-write]
      summary: Der Verlauf der Register-Schreibvorgaenge dieser Anlage.
      description: >
        Dieselben Journal-Zeilen, die die Befehle-Seite als vierten Strom
        `register` einmischt - je Vorgang zu EINER Zeile gefaltet (Anforderung +
        Ergebnis, verbunden ueber `requestId`). Neueste zuerst.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: deviceId
          in: query
          required: false
          description: Nur die Vorgaenge EINES Geraets.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Der Verlauf (leer, solange nie geschrieben wurde).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RegisterWriteEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Anlage nicht gefunden. }
  /api/v1/messstellen:
    get:
      tags: [messstellen]
      summary: Das Messstellen-Register - je Messstelle Ort, Stellung, Quelle und Zustand zum Stichtag (AP-04 IP-4).
      description: >
        Recht `messstelle.ansehen`. `messstellen` trägt weiter die Vertrags-Form jeder
        Messstelle (IP-3), `register` die Zeile zum Stichtag: Ort mit abgeleitetem
        Standort (dieselbe Ableitung wie `GET /api/v1/messstellen/{id}/standort?am=`),
        elektrische Stellung, Quelle der Hauptgröße (Gerät, Messwert, seit; bei einem
        Wechsel `davor`) und der Lebenszyklus. Beide Listen nennen DIESELBEN Messstellen
        in derselben Reihenfolge (nach Kennzeichen); jeder Filter gilt für beide.
        `stichtag`: ein Tag (2026-11-20, dann gilt sein Beginn in Europe/Berlin) oder
        ein Zeitpunkt mit Versatz (das „+“ URL-kodiert); fehlend = jetzt. Ort und
        Stellung gelten an dessen Tag, die Quelle genau zu ihm. Ein Standort, Ort oder
        eine Anlage, die es im Kundenbereich nicht gibt (auch eine fremde), findet
        nichts - leer, nie 403. `beobachtung` und `letzter_wert` (IP-15) sagen je Größe,
        was ihre führende Quelle liefert - `aggregat` zählt „x von y Messstellen liefern
        Daten“ über genau die gezeigten Zeilen; `teilansicht` bleibt bis AP-03 `false`.
      parameters:
        - { name: standort, in: query, required: false, description: "Kurzzeichen oder ID des Standorts; die Zeile zählt, wenn ihr abgeleiteter Standort dieser ist.", schema: { type: string } }
        - { name: ort, in: query, required: false, description: "Kurzzeichen oder ID eines Standorts, Gebäudes oder Bereichs - einschließlich seines Teilbaums am Stichtag; U = direkt am Unternehmen.", schema: { type: string } }
        - { name: anlage, in: query, required: false, description: "ID der Anlage der elektrischen Stellung am Stichtag.", schema: { type: string, format: uuid } }
        - { name: zustand, in: query, required: false, description: "Ein Wort des Lebenszyklus.", schema: { type: string, enum: [entwurf, eingerichtet, aktiv, angehalten, archiviert] } }
        - { name: ohneQuelle, in: query, required: false, description: "true = nur gemessene ohne führende Quelle zum Zeitpunkt (berechnete sind nicht „ohne Quelle“, sie haben keine); fehlend oder false = kein Filter.", schema: { type: boolean } }
        - { name: stichtag, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Die Messstellen und ihre Register-Zeilen (leer ohne gewählten Kundenbereich).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessstelleListe" }
        "400": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [messstellen]
      summary: Legt eine Messstelle an; ohne Kennzeichen das nächste automatische (MS-0001 …).
      description: >
        Recht `messstelle.bearbeiten`. Geprüft wird erst jede Form (400:
        `kennzeichen_format`, `anfrage_ungueltig`, `groesse_ungueltig` mit dem ersten
        verletzten Merkmal nach dem Größen-Katalog), dann die Belegung (409
        `kennzeichen_belegt` - belegt ist, was eine Messstelle trägt, ein
        archiviertes UND das frühere Kennzeichen einer umbenannten; `bestehend`
        nennt den Träger). Das automatische Kennzeichen vergibt der Server unter
        der Zeilensperre des Zählers in derselben Transaktion wie Nebengrößen und
        Protokolleintrag. Das Medium ist das volle Vokabular des Vertrags, geprüft
        über den Größen-Katalog: Gas/Volumen (MS-21) ist anlegbar, Wasser, Wärme,
        Kälte und Druckluft haben noch keine Größe (400 `groesse_ungueltig`,
        `grund: medium`). Dass der Dialog im ersten Umfang nur „Strom“ anbietet
        (AP-00 E11) und keine berechnete Messstelle (E9), ist eine Regel der
        Fläche, nicht der Schnittstelle. Ein Feld, das es hier nicht gibt, ist 400
        `anfrage_ungueltig` - nie still verworfen.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessstelleAnlegen" }
            example:
              name: Spritzguss SG01–SG06
              art: gemessen
              medium: Strom
              hauptgroesse: { groesse: Wirkenergie, richtung: Bezug, einheit: kWh, wertart: Zählerstand }
              nebengroessen:
                - { groesse: Wirkleistung, richtung: Bezug, einheit: kW, wertart: Momentanwert }
      responses:
        "201":
          description: Angelegt; `Location` zeigt auf die neue Messstelle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Messstelle" }
        "400": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Kein Kundenbereich gewählt (Plattform-Admin ohne X-Tenant-Id). }
        "409": { $ref: "#/components/responses/MessstelleAbgelehnt" }
  /api/v1/messstellen/kennzeichen-vorschlag:
    get:
      tags: [messstellen]
      summary: Das nächste automatische Kennzeichen für den Anlege-Dialog.
      description: >
        Recht `messstelle.bearbeiten`. Die kleinste Nummer über dem Zähler, deren
        Kennzeichen niemand trägt oder trug (E7); der Zähler bewegt sich erst, wenn
        eine Messstelle ohne Kennzeichen gespeichert wird.
      responses:
        "200":
          description: Der Vorschlag.
          content:
            application/json:
              schema:
                type: object
                required: [kennzeichen]
                properties:
                  kennzeichen: { type: string, pattern: "^[A-Z0-9./-]{2,16}$", example: MS-0022 }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/messstellen/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [messstellen]
      summary: Eine Messstelle.
      description: Recht `messwerte.ansehen`.
      responses:
        "200":
          description: Die Messstelle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Messstelle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [messstellen]
      summary: Schreibt Kennzeichen, Name und Notiz (die ganze Menge).
      description: >
        Recht `messstelle.bearbeiten`. Art, Medium und Hauptgröße sind nie änderbar
        (eine andere Größe ist eine andere Messstelle): wer sie mitschickt, bekommt
        400 `anfrage_ungueltig`. Ein fehlendes Feld ist leer - ohne `kennzeichen` ist
        die Anfrage 400 `kennzeichen_format`, ohne `name` fehlt der Name danach
        (Entwurf). Das bisherige Kennzeichen bleibt der Messstelle belegt; sie darf
        zu ihm zurück. Ändert sich nichts, wird nichts geschrieben und nichts
        protokolliert. Eine archivierte Messstelle bleibt, wie sie ist (409
        `zustand_passt_nicht`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessstelleBearbeiten" }
            example: { kennzeichen: MS-06, name: Spritzguss SG01–SG06, notiz: Zählerplatz UV-3 }
      responses:
        "200":
          description: Die Messstelle nach dem Bearbeiten.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Messstelle" }
        "400": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MessstelleAbgelehnt" }
  /api/v1/messstellen/{id}/anhalten:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [messstellen]
      summary: Hält die Messstelle an (Umbau, Zähler ausgebaut) - Quellen und Zuordnungen bleiben.
      description: >
        Recht `messstelle.bearbeiten`, rückwirkend zusätzlich `aenderung.rueckwirkend`.
        Nur, wenn sie weder angehalten noch archiviert ist (sonst 409
        `zustand_passt_nicht`). Zeitpunkt auf die Minute (sonst 400), Vorgabe jetzt;
        die Vergangenheit ist erlaubt und steht als „rückwirkend“ im Protokoll, die
        Zukunft nicht (422 `zeitpunkt_in_zukunft`); er liegt NACH dem letzten
        Fortsetzen (422 `zeitpunkt_vor_vorgaenger`, `vorgaenger` nennt es) und nie vor
        dem Beginn der Messstelle (Mitternacht des ersten Tages ihres ersten Orts; 422
        `zeitpunkt_vor_vorgaenger` mit `beginn`).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessstelleUebergang" }
            example: { zeitpunkt: "2026-11-18T10:40:00+01:00", grund: Umbau }
      responses:
        "200":
          description: Die angehaltene Messstelle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Messstelle" }
        "400": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "422": { $ref: "#/components/responses/MessstelleAbgelehnt" }
  /api/v1/messstellen/{id}/fortsetzen:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [messstellen]
      summary: Setzt die angehaltene Messstelle fort; die Lücke bleibt sichtbar, nie aufgefüllt.
      description: >
        Recht `messstelle.bearbeiten`, rückwirkend zusätzlich `aenderung.rueckwirkend`.
        Nur, wenn sie angehalten und nicht archiviert ist (sonst 409
        `zustand_passt_nicht`). Der Zeitpunkt liegt NACH dem Anhalten (422
        `zeitpunkt_vor_vorgaenger` - dieselbe Regel und derselbe Code wie der Wechsel
        einer Quelle, A15), nie in der Zukunft (422 `zeitpunkt_in_zukunft`).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessstelleUebergang" }
      responses:
        "200":
          description: Die fortgesetzte Messstelle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Messstelle" }
        "400": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "422": { $ref: "#/components/responses/MessstelleAbgelehnt" }
  /api/v1/messstellen/{id}/archivieren:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [messstellen]
      summary: Archiviert die Messstelle - das Kennzeichen bleibt belegt, kein Wiederbeleben.
      description: >
        Recht `messstelle.bearbeiten`, rückwirkend zusätzlich `aenderung.rueckwirkend`.
        Zeitpunkt jetzt oder Vergangenheit (AP-04 §4.5; Zukunft 422
        `zeitpunkt_in_zukunft`), nach dem letzten Anhalten/Fortsetzen (422
        `zeitpunkt_vor_vorgaenger`). Auch eine angehaltene Messstelle lässt sich
        archivieren; eine archivierte nicht noch einmal (409 `zustand_passt_nicht`).
        Ihre Nebengrößen gelten mit ihr als archiviert. Ihre Zuordnungen (Ort,
        Stellung) enden am Vortag des Archivtags, eine erst an ihm oder später
        beginnende wird aufgehoben (A13); der Protokolleintrag nennt den letzten Tag
        (`zuordnungen_bis`). Jede offene Quelle endet zum Archivzeitpunkt (IP-13,
        `quellen_beendet` im Protokoll); eine angekündigte oder mit späterem Ende ließe
        sich dort nur umschreiben - dann 409 `zustand_passt_nicht`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessstelleUebergang" }
      responses:
        "200":
          description: Die archivierte Messstelle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Messstelle" }
        "400": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "422": { $ref: "#/components/responses/MessstelleAbgelehnt" }
  /api/v1/messstellen/{id}/ort:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [messstellen]
      summary: Setzt den Ort der Messstelle ab einem Tag (AP-04 IP-7).
      description: >
        Recht `messstelle.bearbeiten`, mit `gueltig_ab` vor heute zusätzlich
        `aenderung.rueckwirkend`. Die Tages-Mechanik des Ortsbaums
        (docs/contracts/v2/ortsbaum-vectors.json): `gueltig_ab` ist ein Tag, das
        laufende Intervall endet am Vortag, das neue erbt dessen Ende (bis zu einer
        geplanten Zuordnung); `korrektur: true` ersetzt das Intervall, das an
        `gueltig_ab` beginnt (das alte bleibt aufgehoben lesbar). Rückwirkend ist
        erlaubt und steht im Protokoll (`rueckwirkend`), die Zukunft ist geplant.
        Der Ort ist das Kurzzeichen eines Standorts, Gebäudes oder Bereichs - oder `U`,
        das Unternehmen (nur eine berechnete Messstelle). Abgelehnt: den Ort gibt es
        nicht, gab es an einem Tag noch nicht oder er war archiviert, `U` für eine
        gemessene (422 `ort_ungueltig` mit `grund`); an dem Tag beginnt schon ein Ort
        (409 `zuordnung_ueberlappt` - der Weg ist die Korrektur); schon genau dieser Ort
        (400 `zuordnung_unveraendert`); vor dem ersten Ort, kein Beginn am Tag der
        Korrektur (422 `zuordnung_ungueltig` mit `grund`); archivierte Messstelle (409
        `zustand_passt_nicht`). Status wie AP-02 §5.10, `ort_ungueltig` wie der
        Messstellen-Vertrag §7. Je Schreibvorgang genau ein Protokolleintrag
        (`ort_zugeordnet` bzw. `ort_korrigiert`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessstelleOrtAendern" }
            example: { kennzeichen: B-3, gueltig_ab: "2027-03-01", grund: Kaltwassersatz zieht in Halle 2 }
      responses:
        "200":
          description: Die Messstelle mit ihren Orten.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Messstelle" }
        "400": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "422": { $ref: "#/components/responses/MessstelleAbgelehnt" }
  /api/v1/messstellen/{id}/stellung:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [messstellen]
      summary: Setzt die elektrische Stellung der Messstelle ab einem Tag (AP-04 IP-7).
      description: >
        Recht `messstelle.bearbeiten`, mit `gueltig_ab` vor heute zusätzlich
        `aenderung.rueckwirkend`. Dieselbe Tages-Mechanik wie beim Ort (409
        `zuordnung_ueberlappt`, 400 `zuordnung_unveraendert`, 422 `zuordnung_ungueltig`). Regel 8 (Vertrag
        docs/contracts/v2/messstelle.md §6, E12) an JEDEM Tag des neuen Intervalls, an
        dem sich etwas ändert (`tag` nennt den ersten verletzten): 422
        `stellung_ungueltig` mit `grund` nicht_elektrisch · bezug_nur_bei_unterzaehler
        · bezug_fehlt · selbst · fremde_anlage (`bestehend`) · zyklus (`kette`); 409
        `hauptzaehler_vorhanden` mit `bestehend` - je Anlage und Richtung einer, alle
        am selben Zähler. Bis IP-13 die Quellen bindet, ist der Zähler einer Messstelle
        unbekannt: dann ist auch ein zweiter Hauptzähler in anderer Richtung 409. Eine
        Messstelle, die an einem Tag Unterzähler der geänderten ist, darf dadurch nicht
        in eine fremde Anlage zeigen (422 `stellung_ungueltig` mit `betroffen`). Die
        Anlage ist die ID einer Anlage des Kundenbereichs (sonst 400
        `anfrage_ungueltig`, `feld: anlage`), `unterzaehler_von` das Kennzeichen der
        Bezug-Messstelle. Je Schreibvorgang genau ein Protokolleintrag
        (`stellung_zugeordnet` bzw. `stellung_korrigiert`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessstelleStellungAendern" }
            example: { anlage: 5b0c0c6e-8f3a-4d7e-9a61-2f4f1c9d7b10, stellung: Unterzähler, unterzaehler_von: MS-10, gueltig_ab: "2027-03-01" }
      responses:
        "200":
          description: Die Messstelle mit ihrer elektrischen Stellung.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Messstelle" }
        "400": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "422": { $ref: "#/components/responses/MessstelleAbgelehnt" }
  /api/v1/messstellen/{id}/standort:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: am, in: query, required: false, schema: { type: string, format: date }, description: "Der Tag; fehlend = heute in der Zeitzone des Unternehmens." }
    get:
      tags: [messstellen]
      summary: Der Stand der Zuordnungen an einem Tag - Ort, Pfad, abgeleiteter Standort, Stellung.
      description: >
        Recht `messstelle.ansehen`, ein Tag in der Vergangenheit ("Stand am")
        zusätzlich `aenderungsprotokoll.lesen`. Die Verortung des Ortsbaum-Vertrags
        (Familie `messstelle_standort`): der Standort ist die Wurzel des Ortsknotens
        AN DIESEM TAG - zieht ein Gebäude um, wechselt der Standort ohne eigene
        Zuordnung. `grund`: verortet · am_unternehmen (Ort `U`, Standort null) ·
        nicht_verortet (an dem Tag kein Ort) · ort_nicht_im_baum. Dazu die Stellung,
        die an dem Tag gilt (null ohne). Eine fremde Messstelle ist 404, nie 403.
      responses:
        "200":
          description: Der Stand am Tag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessstelleStandortAm" }
        "400": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/messstellen/{id}/aenderungen:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/ProtokollVon"
      - $ref: "#/components/parameters/ProtokollBis"
      - $ref: "#/components/parameters/ProtokollAchse"
      - $ref: "#/components/parameters/ProtokollLimit"
      - $ref: "#/components/parameters/ProtokollNach"
    get:
      tags: [messstellen]
      summary: Das Aenderungsprotokoll EINER Messstelle, juengster Eintrag zuerst (AP-04 IP-21).
      description: >
        Recht `aenderungsprotokoll.lesen`. Jede Aenderung der Messstelle: anlegen,
        bearbeiten, anhalten, fortsetzen, archivieren, Ort, elektrische Stellung,
        Quellenbindung, Einstellungs-Fassung, Zaehlerwechsel. Nur lesend - ein
        Eintrag entsteht allein im jeweiligen Fachweg. Jede Zeile nennt BEIDE
        Zeitpunkte: `gilt_ab` (wann die Aenderung gilt) und `eingetragen_am` (wann
        sie eingetragen wurde); `zeitform` ist das Urteil dazu. `von`/`bis` filtern
        auf der Achse, die `achse` nennt - Vorgabe `wirkung` ("gilt ab"). Eine
        fremde Messstelle ist 404, nie 403.
      responses:
        "200":
          description: Das Protokoll der Messstelle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protokoll" }
        "400": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/messstellen/{id}/quellen:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [messstellen]
      summary: Die Quellen der Messstelle - je Größe die führende zum Stichtag, Vergleichsquellen, Zeitstrahl, Historie (AP-04 IP-13).
      description: >
        Recht `messstelle.ansehen`. `stichtag`: ein Zeitpunkt mit Versatz
        (2026-11-18T10:40:00+01:00, das „+“ URL-kodiert) oder ein Tag (dann dessen
        Beginn in Europe/Berlin); fehlend = jetzt. Je Größe (Hauptgröße zuerst) die
        führende Quelle zum Stichtag - `null` heißt keine Quelle, nie 0 -, die
        laufenden Vergleichsquellen und der Zeitstrahl der führenden Quellen ab Beginn
        der Messstelle (Mitternacht ihres ersten Orts; ohne Ort ab der ersten Quelle)
        mit jeder Lücke als eigenem Abschnitt. Eine fremde Messstelle ist 404, nie 403.
      parameters:
        - { name: stichtag, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Die Quellen der Messstelle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessstelleQuellenListe" }
        "400": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [messstellen]
      summary: Bindet eine Größe der Messstelle an einen Messkanal - führend oder zum Vergleich, zeitgültig auf die Minute.
      description: >
        Recht `messstelle.quelle`; mit einem „gültig ab“ vor jetzt zusätzlich
        `aenderung.rueckwirkend`. Der Messkanal ist Komponente + Gerät + Kanalname; das
        Gerät ist der Einbau, der die Komponente zu `gueltig_ab` speist, und die Quelle
        liegt ganz in dieser Speisung (sonst 422 `kein_geraet_zum_zeitpunkt`). Geprüft
        wird in der Reihenfolge des Vertrags (docs/contracts/v2/messstelle.md §5):
        Medium (422 `medium_ohne_quelle`) → Zweck (400 `vergleich_ohne_zweck`) →
        Passung Regel 7 (422 `quelle_passt_nicht` mit `grund` wertart · groesse ·
        einheit · richtung; ein Vorzeichen-Wert wie die Wirkleistung am
        Zweirichtungszähler hat keine Richtung und wartet auf AP-08) → Zeitraum (400
        `zeitraum_ungueltig`) → Gerät zum Zeitpunkt → Messwert führt schon eine andere
        Messstelle (409 `kanal_bereits_fuehrend`) → vor dem Beginn der Messstelle (422
        `zeitpunkt_vor_vorgaenger`) → Überlappung derselben Größe und Rolle, beim
        Vergleich desselben Messwerts (409 `bindung_ueberlappt`). Vergleichsquellen
        stehen überlappend nebeneinander; Lücken sind erlaubt. Eine neue offene
        führende Quelle beendet die laufende genau zu ihrem Beginn (Regel 2) - in
        derselben Transaktion, mit `endstand_vorgaenger`, und EINEM Protokolleintrag
        `quelle_gebunden`. Eine archivierte Messstelle oder Nebengröße bekommt keine
        Quelle (409 `zustand_passt_nicht`); eine fremde Messstelle oder Komponente ist
        404, nie 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessstelleQuelleBinden" }
      responses:
        "201":
          description: Gebunden; `Location` nennt die neue Quelle.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessstelleQuelleVorgang" }
        "400": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "422": { $ref: "#/components/responses/MessstelleAbgelehnt" }
  /api/v1/messstellen/{id}/quellen/wechsel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [messstellen]
      summary: Zähler wechseln - derselbe Vorgang wie POST /api/v1/geraete/{id}/austausch, aus der Sicht der Messstelle.
      description: >
        Recht `messstelle.quelle` („Führende Quelle binden · Zählerwechsel ·
        Wandlerfaktoren"); mit einem Zeitpunkt vor jetzt zusätzlich
        `aenderung.rueckwirkend`. Das Gerät wählt nie der Kunde: es ist das, aus dem die
        Messstelle zum Wechselzeitpunkt liest. Liest sie dann aus keinem (409
        `zustand_passt_nicht`: erst eine Quelle binden) oder aus mehreren (409
        `zustand_passt_nicht`: dann auf der Geräteseite wechseln), lehnt der Vorgang ab.
        Alles Weitere - Wirkungen, Prüfreihenfolge, Ablehnungen - steht bei
        `POST /api/v1/geraete/{id}/austausch`; es ist derselbe Vorgang in derselben
        Transaktion.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Zaehlerwechsel" }
      responses:
        "201":
          description: Gewechselt - beide Einbauten, die umgezogenen Bindungen, die übernommenen Einstellungen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZaehlerwechselVorgang" }
        "400": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "422": { $ref: "#/components/responses/MessstelleAbgelehnt" }
  /api/v1/messstellen/{id}/quellen/{quelleId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: quelleId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [messstellen]
      summary: Eine Quelle der Messstelle.
      description: Recht `messstelle.ansehen`. Eine Quelle einer anderen oder fremden Messstelle ist 404.
      responses:
        "200":
          description: Die Quelle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessstelleQuelle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/messstellen/{id}/quellen/{quelleId}/beenden:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: quelleId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [messstellen]
      summary: Beendet eine Quelle - genau einmal, nie gelöscht, nie überschrieben.
      description: >
        Recht `messstelle.quelle`; mit einem Ende vor jetzt zusätzlich
        `aenderung.rueckwirkend`. `gueltig_bis` auf die Minute (fehlend = jetzt; die
        Zukunft ist angekündigt), optional der Endstand (ohne Einheit: Hinweis
        `ablesestand_pruefen`). Das Ende liegt nach dem Beginn (400
        `zeitraum_ungueltig`); eine beendete Quelle wird nie erneut beendet (409
        `bindung_bereits_beendet`). Bis eine neue Quelle beginnt, bleibt eine sichtbare
        Lücke. Ein Protokolleintrag `quelle_beendet`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessstelleQuelleBeenden" }
      responses:
        "200":
          description: Die beendete Quelle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessstelleQuelleVorgang" }
        "400": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MessstelleAbgelehnt" }
  /api/v1/sites/{siteId}/data-sources:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [datenquellen]
      summary: Die Datenquellen der Anlage, archivierte eingeschlossen, in der Reihenfolge des Anlegens.
      description: >
        Recht: lesend (AP-06 §4.8). Je Quelle ihre Zeiträume und die Box, die JETZT
        liest (`zustaendige_box`, null ohne laufenden Zeitraum). „Liefert Daten“ ist
        eine Beobachtung aus dem Herzschlag (IP-14) und steht hier nicht.
      responses:
        "200":
          description: Die Quellen (ein Objekt, kein nacktes Array - additiv erweiterbar).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatenquelleListe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [datenquellen]
      summary: Legt eine Datenquelle als Entwurf an; das Kennzeichen DQ-n vergibt der Server.
      description: >
        Recht `datenquelle.bearbeiten`. Die Adresse wird normalisiert (Vertrag §3
        Nr. 5: Host klein, ohne Leerzeichen, Modbus-Port fehlend = 502, HTTP-Port
        ausgeschrieben; Solarman-Datenlogger `host:port/seriennummer`, Port fehlend = 8899). Mit `device_id` (der gewählten Box) laufen vorher die Regeln
        des Antrags `anlegen` bis vor die Prüfung - ein Grund davor
        (`adresse_an_box_vergeben`, `netzlage_fehlt`, `nur_ein_leser`,
        `vergleich_bestaetigen`) lehnt ab, BEVOR ein Entwurf entsteht; eine Box
        außerhalb des Kundenbereichs ist 404. `vergleich_bestaetigt` beantwortet
        die Rückfrage „als Vergleichsquelle anlegen?“. Ein Protokoll außerhalb des
        Vokabulars ist 400 `protokoll_unbekannt`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatenquelleAnlegen" }
            example:
              name: WAGO-Steuerung C-2
              protokoll: modbus_tcp
              adresse: 192.168.30.10
              geraete_ids: [1]
              netz: 192.168.30.0/24
              kadenz_s: 60
              device_id: 6f1c2a9e-0000-4000-8000-0000000000e3
      responses:
        "201":
          description: Angelegt (Entwurf, noch liest keine Box); `Location` zeigt auf die Quelle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Datenquelle" }
        "400": { $ref: "#/components/responses/DatenquelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DatenquelleAbgelehnt" }
  /api/v1/sites/{siteId}/data-sources/{id}:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [datenquellen]
      summary: Eine Datenquelle der Anlage.
      description: Recht lesend. Eine Quelle einer anderen Anlage oder eines anderen Kundenbereichs ist 404.
      responses:
        "200":
          description: Die Quelle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Datenquelle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [datenquellen]
      summary: Bearbeitet die Quelle (volle Darstellung); protokolliert wird nur, was sich ändert.
      description: >
        Recht `datenquelle.bearbeiten`. Name, Netzlage, Geräte-IDs und Lesetakt
        jederzeit; Protokoll, Adresse, Ein-Leser-Eigenschaft und Steuerquelle - die
        Eingänge der Antrags-Regeln - nur, solange die Quelle keinen Zeitraum hat
        (sonst 409 `weg_fest` mit `felder`). Eine archivierte Quelle ist 409
        `quelle_archiviert`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatenquelleBearbeiten" }
      responses:
        "200":
          description: Die Quelle danach.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Datenquelle" }
        "400": { $ref: "#/components/responses/DatenquelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DatenquelleAbgelehnt" }
  /api/v1/sites/{siteId}/data-sources/{id}/reachability-check:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [datenquellen]
      summary: Erreichbarkeitsprüfung von GENAU der gewählten Box (E11).
      description: >
        Recht `datenquelle.bearbeiten`. Die Box `device_id` - auch eine mit anderer
        Heimat-Anlage (E7), nie eine außerhalb des Kundenbereichs (404) - liest
        einmal über den Probe-Kanal (docs/contracts/mqtt-probe.schema.json, op
        `read`, auf ihrem EIGENEN Topic) die gespeicherte Adresse der Quelle; Host
        und Port kommen nie aus der Anfrage. Heute für Modbus TCP und
        SunSpec-Modbus (`register` bei SunSpec mit 40000 „SunS“ vorbelegt); für
        MQTT, HTTP und OCPP 422 `pruefung_nicht_moeglich`. Die Antwort ist ein
        ehrlicher AUSGANG (200), auch wenn die Prüfung scheitert. `gewertet`: „ok“
        oder eine Fehlerklasse der BOX (Vertrag §7) - nur dann steht die Prüfung im
        Protokoll und zählt für eine Zuständigkeit. Schweigt die Box
        (`box_meldet_sich_nicht`) oder lehnt ihr Prüf-Kanal ab (`rate_limited`,
        `not_supported`, `invalid_request`), zählt nichts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatenquellePruefen" }
            example: { device_id: 6f1c2a9e-0000-4000-8000-0000000000e2, unit_id: 1, register: 0 }
      responses:
        "200":
          description: Das Ergebnis der Prüfung (auch gescheitert oder ohne Antwort der Box).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatenquellePruefergebnis" }
        "400": { $ref: "#/components/responses/DatenquelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DatenquelleAbgelehnt" }
        "422": { $ref: "#/components/responses/DatenquelleAbgelehnt" }
        "503": { description: Die Frage konnte nicht an die Box gehen (Broker nicht erreichbar). }
  /api/v1/sites/{siteId}/data-sources/{id}/assignments:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [datenquellen]
      summary: Ab `effective_from` liest `device_id` die Quelle - erste Box oder Wechsel.
      description: >
        Recht `datenquelle.zustaendigkeit`. Die erste Box einer Quelle ist ein Antrag
        `anlegen`, jede weitere ein `wechsel`; geprüft von DatenquelleRegeln in der
        festen Reihenfolge des Vertrags (§5): protokoll_unbekannt → keine_volle_minute
        → rueckwirkend → steuerquelle → spaeterer_wechsel_geplant → schon_zustaendig →
        adresse_an_box_vergeben → netzlage_fehlt → nur_ein_leser →
        vergleich_bestaetigen → pruefung_fehlt → pruefung_gescheitert; der erste
        Grund entscheidet (Status siehe DatenquelleFehler). Das Prüfergebnis ist die
        jüngste gewertete Prüfung dieser Quelle von GENAU dieser Box für ihre heutige
        Adresse. `effective_from` auf die volle Minute (mit Sekunden 422, nie
        gerundet), frühestens jetzt; fehlend = jetzt auf die Minute abgerundet.
        Erlaubt: der laufende Zeitraum wird bei `effective_from` beendet und der neue
        eingetragen - in EINER Transaktion unter der Zeilensperre der Quelle; die
        Speicher-Regel (§4, `leerer_zeitraum`, `ueberschneidung`) prüft jeden
        geänderten Zeitraum; greift trotzdem ein Constraint (gleichzeitiger
        Schreibvorgang), 409 `gleichzeitig_geaendert` mit `grund`. Die Steuerquelle
        wechselt ihre Box nicht (409 `steuerquelle`, A13). Eine bestätigte
        Vergleichsquelle wird gekennzeichnet (`vergleichsquelle`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatenquelleZuweisen" }
            example: { device_id: 6f1c2a9e-0000-4000-8000-0000000000e2, effective_from: "2027-04-10T07:30:00+02:00" }
      responses:
        "201":
          description: Erlaubt und eingetragen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatenquelleZugewiesen" }
        "400": { $ref: "#/components/responses/DatenquelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DatenquelleAbgelehnt" }
        "422": { $ref: "#/components/responses/DatenquelleAbgelehnt" }
  /api/v1/sites/{siteId}/data-sources/{id}/history:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [datenquellen]
      summary: Das Protokoll der Quelle, jüngster Eintrag zuerst.
      description: >
        Recht lesend (`aenderungsprotokoll.lesen`). Append-only (data_source_aenderung):
        angelegt · bearbeitet (nur die geänderten Felder) · erreichbarkeit_geprueft
        (Box, Ergebnis) · zustaendigkeit_begonnen · zustaendigkeit_gewechselt (alt:
        die bisherige Box) · aus_bestand_uebernommen (IP-4: neu = Kennzeichen, Weg,
        Takt, Box, Beginn, Komponenten; `gilt_ab` = Reihenbeginn), jeder Eintrag mit Urheber (Kundenbenutzer =
        kundenadministrator/kunde, Plattform-Admin = voltpilot_betrieb/voltpilot).
      responses:
        "200":
          description: Die Einträge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatenquelleProtokoll" }
  /api/v1/sites/{siteId}/data-sources/vorschlag:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [datenquellen]
      summary: Die Vorschlagsliste der Bestands-Übernahme - vorhandene Komponenten, gruppiert zu Datenquellen je Box.
      description: >
        Recht `datenquelle.ansehen` (AP-06 IP-4, Vertrag §8, Abnahme A12). Liest nur -
        bis zur Bestätigung ändert sich nichts: kein Push, kein Fahrplan, keine Fläche.
        Gruppiert werden die Komponenten der Anlage OHNE Quelle nach Box + Protokoll +
        Adresse (DatenquelleRegeln.vorschlagsliste, Vektoren Familie `bestand`); ein
        komponiertes Geschwister landet bei seinem Wechselrichter; was keinen lesbaren
        Weg hat, steht benannt unter `ausgelassen` (keine_box · keine_adresse ·
        protokoll_unbekannt · anker_ohne_vorschlag) - nie geraten. Die Box einer
        Komponente ist die, die sie heute liest: die eigene einer komponierten Zeile, die
        Box der Ladestation, sonst die führende Box (LeadDeviceService, `fuehrung`).
        `ab` ist der Reihenbeginn (erste Speisung der Komponente, frühestens seit die Box
        in der Anlage ist); `kennzeichen` ab der nächsten freien Nummer des Kundenbereichs.
      responses:
        "200":
          description: Die Vorschläge und die ausgelassenen Komponenten.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatenquelleVorschlagsliste" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/sites/{siteId}/data-sources/vorschlag/uebernehmen:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [datenquellen]
      summary: Übernimmt bestätigte Vorschläge - Quelle, Zuständigkeit ab Reihenbeginn, Verweise, Protokoll.
      description: >
        Recht `datenquelle.bearbeiten` (AP-06 §4.8 anlegen; die Zuständigkeit ist die der
        HEUTIGEN Box, kein Wechsel). Je Vorschlag, in EINER Transaktion: die Quelle
        (Kennzeichen DQ-n vergibt der Server, ohne Name, Netzlage leer, Ein-Leser), ihre
        Zuständigkeit `[ab, offen)` auf die Minute - der EINZIGE Weg zu einem Beginn in der
        Vergangenheit (Vertrag §4) -, `measurement_point.data_source_id` der Komponenten,
        `geraet.data_source_id` des Geräts ihrer laufenden Speisung und EIN Protokoll-Eintrag
        `aus_bestand_uebernommen`. Bestätigt wird nur, was gezeigt wurde (Box, Protokoll,
        Adresse, Komponenten): sonst 409 `vorschlag_geaendert`. Hat eine Komponente
        inzwischen auf anderem Weg eine Quelle: 409 `komponente_hat_quelle`. Ist die
        Adresse an der Box schon vergeben: 409 `adresse_an_box_vergeben`. Ein schon
        übernommener Vorschlag zählt als `unveraendert` - ein zweiter Aufruf legt nichts an.
        Registry-Push, Flow-Aktivierung und Herzschlag bleiben unberührt (Push je Box: IP-6).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatenquelleUebernehmen" }
            example:
              vorschlaege:
                - device_id: 6f1c2a9e-0000-4000-8000-0000000000e1
                  protokoll: modbus_tcp
                  adresse: "192.168.10.31:502"
                  komponenten: [2b7e0f1a-0000-4000-8000-0000000000a4, 2b7e0f1a-0000-4000-8000-0000000000a5]
      responses:
        "200":
          description: Übernommen (auch, wenn schon alles übernommen war - dann `neu` 0).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatenquelleUebernommen" }
        "400": { $ref: "#/components/responses/DatenquelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DatenquelleAbgelehnt" }
  /api/v1/sites/{siteId}/komponenten/{entityId}/messkanaele:
    get:
      tags: [messstellen]
      summary: Die Messkanäle einer Komponente mit Größe, Richtung, Einheit und Wertart (AP-04 IP-9).
      description: >
        Recht `messwerte.ansehen`. Je Zeile der Mess-Selektion der Komponente
        (Katalogpunkt oder Selbstbau, aktiv oder abgewählt) ein Kanal, sortiert nach
        Kanalname. `groesse`, `richtung`, `einheit` und `wertart` sind in den Wörtern
        des Messstellen-Vertrags genau die Eingänge der Passung (Regel 7) einer
        späteren Quellenbindung; `quantity`/`direction` sind die Katalogwörter, aus
        denen sie abgebildet sind (Tabelle in catalog/measurement-points/README.md).
        Ein Katalogwort ohne Vertragswort (etwa `import_export`, der Vorzeichen-Wert
        eines Zweirichtungszählers) ergibt `null` - nie ein geratenes Nachbarwort.
        Selbstbau trägt Name und Einheit, aber (noch) keine Wertart, Größe oder
        Richtung. `geraet` ist das Gerät, das die Komponente JETZT speist (AP-04
        IP-10: die Speisung, deren halboffener Zeitraum jetzt enthält) - für jeden
        Kanal dasselbe, `null` ohne laufende Speisung, nie geraten. `speist` nennt je
        Kanal die Quellenbindungen, die zum `stichtag` laufen (AP-04 IP-13: Messstelle,
        Größe, Rolle, Zweck) - leer ohne laufende Bindung. Mandanten-Zaun ist die RLS:
        eine fremde Komponente, eine Komponente einer anderen Anlage und eine unbekannte
        sind 404, nie 403; Plattform-Admins nutzen X-Tenant-Id.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: stichtag, in: query, required: false, schema: { type: string }, description: "Wann `speist` gilt: ein Zeitpunkt mit Versatz oder ein Tag (dessen Beginn in Europe/Berlin); fehlend = jetzt." }
      responses:
        "200":
          description: Die Kanäle der Komponente (leer ohne Mess-Selektion).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MesskanalListe" }
              example:
                site_id: 5b0e1c52-2f7c-4d0e-9a61-0c3d4b7e2a10
                komponente: 9f4a6d2e-8c1b-4e37-b5a0-3d2c1e0f7a64
                inhaltsstand: "2026.09.11.1"
                messkanaele:
                  - kanal: sunspec.model_203.totwhimp
                    anzeigename: Total Watt-hours Imported
                    einheit: Wh
                    wertart: counter
                    groesse: Wirkenergie
                    richtung: Bezug
                    quantity: active_energy
                    direction: import
                    kadenz_s: 10
                    aktiv: true
                    lesende_box: 1c9e3a7b-5d2f-4b60-8e14-7a0b2c3d4e5f
                    geraet:
                      id: 7d2c9e14-3a5b-4f60-8b17-2e0c4d6a8f31
                      geraet: GR-2
                      einbau: GR-2
                      seriennummer: null
                    speist:
                      - messstelle_id: 3e8a1c52-6d0f-4b27-9a13-5c2e7d4f8b90
                        messstelle: MS-01
                        groesse: Wirkenergie
                        richtung: Bezug
                        rolle: fuehrend
                        zweck: null
                        gueltig_ab: "2024-03-12T00:00:00+01:00"
                        gueltig_bis: null
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/sites/{siteId}/geraete:
    parameters:
      - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [geraete]
      summary: Alle Geräte der Anlage, ausgebaute eingeschlossen.
      description: >
        Recht `messwerte.ansehen`. Je Einbau eine Zeile, nach Gerät (GR-2 vor
        GR-10) und darin nach Einbau; jede mit ihren Komponenten-Zeiträumen,
        Karten und Vorgängern. Ein Objekt, kein nacktes Array - erweiterbar,
        ohne die Form zu brechen.
      responses:
        "200":
          description: Die Geräte der Anlage (leer, wenn es keine gibt).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeraetListe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/geraete/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [geraete]
      summary: Ein Gerät (ein Einbau) mit Komponenten, Karten und Vorgängern.
      description: >
        Recht `messwerte.ansehen`. `vorgaenger` sind die früheren Einbauten
        desselben Geräts (gleiches `kennzeichen`, früher eingebaut), der jüngste
        zuerst - Z-5b nennt Z-5a mit `ausgebaut_am`.
      responses:
        "200":
          description: Das Gerät.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Geraet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/geraete/{id}/aenderungen:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: "#/components/parameters/ProtokollVon"
      - $ref: "#/components/parameters/ProtokollBis"
      - $ref: "#/components/parameters/ProtokollAchse"
      - $ref: "#/components/parameters/ProtokollLimit"
      - $ref: "#/components/parameters/ProtokollNach"
    get:
      tags: [geraete]
      summary: Das Aenderungsprotokoll EINES Geraets - Bindungen, Einstellungen, Ein- und Ausbau (AP-04 IP-21).
      description: >
        Recht `aenderungsprotokoll.lesen`. Ein Geraet hat kein eigenes Journal: seine
        Eintraege haengen an den Messstellen, die es speist, und nennen es ueber sein
        Einbau-Kennzeichen. Ein Zaehlerwechsel steht deshalb in BEIDEN
        Geraete-Protokollen - beim ausgebauten und beim eingebauten. Zeitachsen,
        Zeitraum und Seitenweise wie bei der Messstelle. Ein fremdes Geraet ist 404,
        nie 403.
      responses:
        "200":
          description: Das Protokoll des Geraets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Protokoll" }
        "400": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/geraete/{id}/einstellungen:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [geraete]
      summary: Die Einstellungs-Fassungen eines Geräts (Einbaus) - Historie und gültig zum Stichtag.
      description: >
        Recht `messwerte.ansehen`; ein Stichtag in der Vergangenheit („Stand
        am") zusätzlich `aenderungsprotokoll.lesen`. Wandlerverhältnis,
        Spannungswandler, Skalierung, Offset, Vorzeichen, Impulswertigkeit und
        Zählerkonstante als zeitgültige Fassungen AN DER QUELLE (UEMS AP-04
        IP-11, E4): am Einbau selbst, an einer Komponente, die er speist, oder
        an einem Kanal dieser Komponente (Vertrag
        docs/contracts/v2/quelle-einstellung.md). `gueltig` nennt je Quelle und
        Art die zum Stichtag gültige Fassung, `historie` alle - nach Quelle,
        Art und Beginn. Die Fassung 1 der Bestands-Komponenten ist aus ihrer
        heutigen Verbindung abgeleitet (`herkunft: bestand`, „gilt seit
        Beginn" der Speisung).
      parameters:
        - name: stichtag
          in: query
          required: false
          description: >
            Zeitpunkt nach ISO 8601 mit Versatz; ohne = jetzt. Das `+` eines
            Versatzes ist in der Adresse als `%2B` zu schreiben.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Die Einstellungen des Einbaus (leer, wenn keine erfasst ist).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Einstellungen" }
        "400": { $ref: "#/components/responses/EinstellungAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [geraete]
      summary: Eine neue Einstellungs-Fassung eintragen - Wirkung nur ab „gültig ab".
      description: >
        Recht `messstelle.quelle` („Führende Quelle binden · Zählerwechsel ·
        Wandlerfaktoren"); mit „gültig ab" vor jetzt zusätzlich
        `aenderung.rueckwirkend`. Die neue Fassung beendet die zu ihrem Beginn
        gültige derselben Quelle und Art genau dort und gilt bis zum Beginn der
        nächsten späteren (höchstens bis zum Ende der Quelle). KEIN
        gespeicherter Wert ändert sich (E5): keine Messreihe, keine Verbindung,
        keine Komponenten-Fassung, nichts an der Box - eine angewendete Fassung
        steht als „Zustellung ausstehend", bis AP-06 zustellt; einen falsch
        erfassten Zeitraum berichtigt eine Korrektur (AP-08). Protokoll an der
        Quelle (die Fassung mit Urheber, Zeit, rückwirkend, Begründung) und an
        jeder Messstelle, deren Quellenbindung (führend oder Vergleich) zum
        Beginn der Fassung aus der Quelle liest - je ein Eintrag
        `einstellung_geaendert` in ihrem Protokoll; `messstellen` nennt sie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EinstellungNeu" }
      responses:
        "201":
          description: Eingetragen - die neue Fassung, die beendete, die Folgen-Sätze.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EinstellungEingetragen" }
        "400": { $ref: "#/components/responses/EinstellungAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/EinstellungAbgelehnt" }
        "422": { $ref: "#/components/responses/EinstellungAbgelehnt" }
  /api/v1/geraete/{id}/austausch:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [geraete]
      summary: Gerät austauschen - der Zählerwechsel als EIN Vorgang (AP-04 IP-17).
      description: >
        Recht `geraet.einrichten`; die Quellenbindungen, die dabei umziehen, tragen
        zusätzlich `messstelle.quelle`, ein Zeitpunkt vor jetzt außerdem
        `aenderung.rueckwirkend`. DERSELBE Vorgang wie
        `POST /api/v1/messstellen/{id}/quellen/wechsel`, nur vom anderen Einstieg aus:
        entweder alle Wirkungen landen oder keine. In EINER Transaktion bekommt das alte
        Gerät seinen Ausbau, das neue seinen Einbau (dasselbe Gerät-Kennzeichen GR-4, ein
        neues Einbau-Kennzeichen), jede laufende Speisung wandert mit, jede laufende
        Quellenbindung endet GENAU zum Wechselzeitpunkt und beginnt dort neu am neuen
        Einbau, die Ablesestände landen als Endstand des Vorgängers und Anfangsstand des
        Nachfolgers, die Einstellungs-Fassungen werden übernommen, und je betroffener
        Messstelle hält EIN Protokolleintrag `zaehler_gewechselt` den Vorgang mit Urheber
        und Rückwirkend-Marker fest. Additiv steht die Marke „Zähler gewechselt" im
        Komponenten-Verlauf (`component_change_event`, `device_replaced`) - ein Zusatz, der
        den Wechsel nie scheitern lässt. Geprüft wird in dieser Reihenfolge: Zeitpunkt im
        laufenden Einbau des Vorgängers (422 `zeitpunkt_vor_vorgaenger` davor, 422
        `kein_geraet_zum_zeitpunkt` an einem schon ausgebauten) → Energiekarten (409
        `zustand_passt_nicht`: über sie entscheidet der Controllerwechsel, IP-19) → speist
        er überhaupt etwas (422 `kein_geraet_zum_zeitpunkt`) → angekündigte Quelle am alten
        Einbau (409 `zustand_passt_nicht`) → eine Bindung, die zum Zeitpunkt schon beendet
        ist (409 `bindung_bereits_beendet`) → freies Einbau-Kennzeichen (409
        `kennzeichen_belegt`) → je Bindung die Regeln der Quellenbindung (Vorgang
        `wechsel`). Eine archivierte Messstelle lehnt ab (409 `zustand_passt_nicht`); ein
        fremdes Gerät ist 404, nie 403. Der Wechsel ändert KEINEN gespeicherten Messwert:
        die Werte vor dem Zeitpunkt bleiben dem alten Einbau zugeordnet, die Lücke bis zum
        ersten Wert des neuen bleibt sichtbar und wird nie aufgefüllt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Zaehlerwechsel" }
      responses:
        "201":
          description: Gewechselt - beide Einbauten, die umgezogenen Bindungen, die übernommenen Einstellungen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZaehlerwechselVorgang" }
        "400": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MessstelleAbgelehnt" }
        "422": { $ref: "#/components/responses/MessstelleAbgelehnt" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Keycloak-issued OIDC access token (realm `voltpilot`). Must carry a
        `tenant_id` claim; the API sets it as the Postgres `app.tenant_id`
        session variable to drive Row-Level-Security.

        Tenant switcher (Portal-Admins only): a token with the `platform-admin`
        realm role (which carries NO tenant_id) may select a tenant per request
        via the `X-Tenant-Id` header (UUID). The customer endpoints then serve
        that tenant's data through the same RLS scoping the customer gets. The
        header is IGNORED for every non-admin token, so it can never widen a
        customer's access; an admin without the header sees zero rows
        (default-deny).
  parameters:
    ProtokollVon:
      name: von
      in: query
      required: false
      schema: { type: string }
      description: >
        Der Beginn des Zeitraums auf der gewaehlten Achse - ein Zeitpunkt mit
        Versatz (2026-11-18T10:00:00+01:00, das "+" URL-kodiert) oder ein Tag
        (2026-11-18, dann dessen Beginn in Europe/Berlin). Fehlend = ohne Grenze.
        Der Zeitraum ist halboffen: "von" zaehlt mit.
    ProtokollBis:
      name: bis
      in: query
      required: false
      schema: { type: string }
      description: >
        Das Ende des Zeitraums, AUSSCHLIESSLICH ("bis" zaehlt nicht mehr mit);
        dieselbe Form wie "von". Fehlend = ohne Grenze.
    ProtokollAchse:
      name: achse
      in: query
      required: false
      schema: { type: string, enum: [wirkung, eintrag], default: wirkung }
      description: >
        WELCHE der zwei Zeitachsen "von"/"bis" filtern und wonach sortiert wird.
        `wirkung` (Vorgabe) ist "gilt ab" - wann die Aenderung GILT; `eintrag` ist
        "eingetragen am" - wann sie EINGETRAGEN wurde. Ein rueckwirkender
        Zaehlerwechsel gilt am 18.11. um 10:40 und wurde um 11:05 eingetragen: mit
        `wirkung` steht er im Zeitraum 10:00-11:00, mit `eintrag` im Zeitraum
        11:00-12:00 - beide Male genau EINMAL.
    ProtokollLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      description: Wie viele Eintraege diese Seite hoechstens traegt.
    ProtokollNach:
      name: nach
      in: query
      required: false
      schema: { type: string }
      description: >
        Der Fortsetzungszeiger: der Wert `weiter` der vorigen Seite. Er traegt das
        Sortier-Tripel (Zeit auf der Achse, Herkunft, laufende Nummer), damit die
        naechste Seite auch bei gleichen Zeitstempeln genau hinter dem letzten
        gelieferten Eintrag ansetzt.
  responses:
    Unauthorized:
      description: Missing, expired or invalid Bearer token.
    Forbidden:
      description: Authenticated, but lacking the required role (e.g. a customer calling an admin endpoint).
    NotFound:
      description: >
        Not visible for the caller's tenant (RLS) or unknown. A foreign site is
        404, never 403.
    BadRequest:
      description: >
        Rejected before anything was written; the body carries a German
        `message`.
    MessstelleAbgelehnt:
      description: >
        Abgelehnt, nichts geschrieben. Der Körper trägt `code`, einen deutschen
        `message`-Satz und die Fakten des Urteils (siehe MessstelleFehler).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MessstelleFehler" }
    DatenquelleAbgelehnt:
      description: >
        Abgelehnt, nichts geschrieben. Der Körper trägt `code`, einen deutschen
        `message`-Satz (bei den Gründen des Vertrags genau dessen Satz) und die Fakten
        des Urteils (siehe DatenquelleFehler).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DatenquelleFehler" }
    OrtAbgelehnt:
      description: >
        Abgelehnt, nichts geschrieben (auch kein Protokolleintrag). Der Körper
        trägt `code`, einen deutschen `message`-Satz mit Grund und Weg (AP-02
        §5.10) und die Fakten des Urteils (siehe OrtFehler).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OrtFehler" }
    EinstellungAbgelehnt:
      description: >
        Abgelehnt, nichts geschrieben (auch kein Protokolleintrag). Der Körper
        trägt `code`, einen deutschen `message`-Satz und die Fakten des Urteils
        (siehe EinstellungFehler).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/EinstellungFehler" }
  schemas:
    OcppConnectorState:
