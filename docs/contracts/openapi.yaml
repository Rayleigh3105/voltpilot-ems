        "202":
          description: Job accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulationId: { type: string }
                  flowScenario: { type: string, enum: [voltpilot, standardSpeicher] }
        "422": { description: Invalid or not simulierbar (German message). }
        "404": { description: Not found. }
  /api/v1/admin/sites/{siteId}/flows/{flowId}/versions/{version}/simulation/{simulationId}:
    get:
      tags: [admin]
      summary: Poll the flow dry-run; completion flips draft -> simulated.
      description: >
        Relays the simulation job document plus flowScenario. When the job
        reports done, the version's lifecycle flips draft -> simulated and the
        summary (scenario, headline, price year) is recorded on the version.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
        - { name: simulationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The job status (+ flowScenario).
          content: { application/json: { schema: { type: object } } }
        "404": { description: Job/version not found (api restart forgets jobs). }
  /api/v1/admin/sites/{siteId}/flows/{flowId}/versions/{version}/activate:
    post:
      tags: [admin]
      summary: Activate a simulated version (compile + D-11 rollout).
      description: >
        Strict validation, the D1 safety gate (a draft must be simulated
        first), then compile + retire-previous + mark-active + publish the
        COMPLETE retained deployment set on ems/{t}/{s}/{d}/v2/flows
        (docs/contracts/v2/flow-artifact.md). Until the E2 compiler module
        lands the activation answers HONESTLY with activated=false,
        reason=compiler_missing ("Compiler folgt") and publishes nothing; with
        a compiler present the feature flag
        VOLTPILOT_FLOWS_ACTIVATION_ENABLED (default OFF, simulator-rig only)
        still gates the rollout.
      parameters:
        - { name: siteId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Activation outcome (activated, reason, message, published).
          content: { application/json: { schema: { type: object } } }
        "409": { description: Already active / draft not simulated yet. }
        "422": { description: Validation errors (message + findings). }
        "404": { description: Not found. }
  /api/v1/admin/tenants/{tenantId}/users/{userId}:
