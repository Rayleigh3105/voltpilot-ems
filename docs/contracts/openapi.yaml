        bereiche:
          type: array
          items: { $ref: "#/components/schemas/OrtsbaumBereich" }
    OrtsbaumBereich:
      type: object
      description: Ein Bereich erbt nie die Fläche seines Gebäudes (§4.1).
      properties:
        id: { type: string, format: uuid }
        kurzzeichen: { type: string, example: B-3 }
        name: { type: string, example: Halle 2 Montage }
        nutzung: { type: array, nullable: true, description: "E4 - das erste Wort ist die Hauptnutzung; null = keine gewählt.", items: { $ref: "#/components/schemas/Nutzung" } }
        notiz: { type: string, nullable: true }
        zustand: { type: string, enum: [entwurf, eingerichtet, aktiv, archiviert] }
        gueltigAb: { type: string, format: date }
        gueltigBis: { type: string, format: date, nullable: true }
        flaecheM2: { type: integer, nullable: true }
        flaecheQuelle: { type: string, nullable: true, enum: [eigen] }
        messstellenZahl: { type: integer, nullable: true, description: "Die Messstellen, deren Ort am Stichtag genau dieser Knoten ist; 0 wenn keine." }
    OrtsbaumDirektAmStandort:
      type: object
      properties:
        bereiche:
          type: array
          items: { $ref: "#/components/schemas/OrtsbaumBereich" }
        messstellenZahl: { type: integer, nullable: true, description: "Die Messstellen, deren Ort am Stichtag genau dieser Knoten ist; 0 wenn keine." }
    OrtAnlegen:
      type: object
