<title>Fachmodell auf einen Blick</title>
<desc>Drei Sichten auf dieselben Messstellen: Ort (blau: Kundenbereich, Unternehmen, Standort, Gebäude, Bereich), Organisation (grün: Prozess, Kostenstelle) und elektrisch (orange: Netzanschluss, Anlage). Die graue Erfassungskette Box → Datenquelle → Gerät → Komponente → Messkanal liefert die führende Quelle; die logische Messstelle in der Mitte überlebt sie. AP-00 vom 10.09.2026, verfeinert durch AP-01 bis AP-07.</desc>
