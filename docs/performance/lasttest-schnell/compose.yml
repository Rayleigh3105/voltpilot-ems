# Labor der Lasttest-Schnellmassnahmen (docs/performance/lasttest-schnellmassnahmen.md): eigenes
# Compose-Projekt, eigene Ports (25xxx), keine festen Namen. WT = Wurzel des Checkouts, JAR = api-Jar.
# Nie ohne -f compose.yml starten (die Repo-Compose-Datei trifft die Demo).
name: vpls

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: voltpilot
      POSTGRES_USER: voltpilot
      POSTGRES_PASSWORD: voltpilot_dev_pw
      TS_TUNE_MEMORY: 1GB
      TS_TUNE_NUM_CPUS: "4"
    command: [postgres, -c, max_connections=200, -c, "shared_preload_libraries=timescaledb,pg_stat_statements",
              -c, pg_stat_statements.track=top, -c, track_io_timing=on, -c, log_min_duration_statement=1000,
              -c, log_lock_waits=on]
    ports: ["127.0.0.1:25432:5432"]
    volumes:
      - ts:/var/lib/postgresql/data
      - ${WT}/infra/local/timescale:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltpilot -d voltpilot"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1200m

  emqx:
    image: emqx/emqx:5.8.3
    environment:
      EMQX_NODE__COOKIE: vpls_cookie
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: vpls_dev_pw
    ports: ["127.0.0.1:25883:1883", "127.0.0.1:25083:18083"]
    mem_limit: 600m

  api:
    image: voltpilot-demo-api:latest
    entrypoint: ["java", "-jar", "/jars/api.jar"]
    env_file: ["${ENVFILE:-api.env}"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx800m -XX:MaxMetaspaceSize=320m"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ${JAR}:/jars/api.jar:ro
    ports: ["127.0.0.1:25090:8090"]
    mem_limit: 1300m
    profiles: ["jvm"]

volumes:
  ts:
