# E2E overlay: adds a stand-in cloud broker (plain MQTT) and points the core
# at it via the dev escape hatches, so the FULL two-layer edge (sim ->
# Node-RED -> core -> "cloud") runs isolated with no real cloud stack.
# Used by test/e2e-compose.sh with its own project name + high ports - never
# against a live stack.
#
# ⚠ KEIN Dienst hier darf einen BIND-MOUNT aus dem Arbeitsverzeichnis tragen.
# Der Docker-Daemon loest einen Bind gegen SEIN Dateisystem auf; laeuft der Job
# selbst im Container (Forgejo-Runner), gibt es den Workspace-Pfad dort nicht.
# Begruendung und die Alternative stehen in Dockerfile.broker.
services:
  cloud-broker:
    # Bild statt Bind: die Konfiguration ist eingebacken (Dockerfile.broker).
    build:
      # ⚠ Relative Pfade in einer Compose-Datei loesen gegen das PROJEKT-
      # verzeichnis auf (den Ordner der ERSTEN -f-Datei, also edge-app/), NICHT
      # gegen den Ordner dieser Datei. Deshalb ./test, nicht . - `dockerfile`
      # zaehlt danach relativ zum Kontext.
      context: ./test
      dockerfile: Dockerfile.broker
    # Expliziter Name, damit ihn auch test/e2e-v2-compose.sh mit plain
    # `docker build` vorbauen kann: dieses Rig faehrt `up -d` OHNE --build
    # (Hosts mit altem buildx koennen `compose build` nicht).
    image: voltpilot-edge-e2e-broker:local

  # Der OTA-Apply-Sidecar gehoert NICHT in dieses Rig. Er ist kein Glied der
  # Kette, die hier bewiesen wird (sim -> nodered -> core -> cloud -> Fahrplan
  # -> Sollwert), und er traegt mit `.:/deploy` genau den Bind-Mount aus dem
  # Arbeitsverzeichnis, den ein containerisierter Runner nicht aufloesen kann.
  # Dass er im GERAETE-Compose ohne jedes Profil mitlaeuft, ist Gegenstand von
  # test/install-selfcheck.sh - nicht dieses Rigs.
  #
  # Ein nicht angefordertes Profil ist die einzige Art, einen Dienst aus einem
  # Overlay heraus wegzulassen: Compose kann einen Dienst der Basisdatei nicht
  # loeschen, und `volumes: !reset` braeuchte Compose >= 2.24.
  updater:
    profiles: ["nicht-im-e2e"]

  core:
    depends_on:
      - cloud-broker
    environment:
      VP_DEV_TENANT_ID: "00000000-0000-0000-0000-000000000001"
      VP_DEV_SITE_ID: "00000000-0000-0000-0000-000000000002"
      VP_DEV_DEVICE_ID: "00000000-0000-0000-0000-000000000003"
      VP_DEV_CLOUD_URL: "tcp://cloud-broker:1883"
      # Enable the inverter-control kill-switch so the Simulator control path
      # writes reg 40/41/42 and reads them back (write -> readback -> match).
      # No inverter is selected in the core here, so the empty family is treated
      # as certified (dev/sim path); the Node-RED sim adapter's own family gate
      # ('sunspec' certified) still governs.
      VP_CONTROL_ENABLED: "true"
