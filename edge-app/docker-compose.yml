# VoltPilot Edge-App: the installable customer-side edge.
#
# Pull-based deploy (prebuilt images, no local build):
#   docker login git.tecmaxx.de
#   docker compose up -d                       -> core + Node-RED (real inverter, wired per customer)
#   docker compose --profile sim up -d         -> PLUS the SunSpec simulator: full edge, zero hardware
#
# Every `up` always pulls the prebuilt registry images (pull_policy: always).
# Developers can still force a local build with `--build`:
#   docker compose up -d --build
#   docker compose --profile sim up -d --build
#
# Two layers, one package:
#   core     Layer 2 (Go): identity/enrollment, the ONLY cloud connection (mTLS
#            MQTT), telemetry store-and-forward, schedule cache + guards +
#            execution, embedded local MQTT bus, local device web app (:8484).
#   nodered  Layer 1: per-customer I/O flows (inverter read / setpoint write)
#            talking ONLY to the core's local bus. Wired by VoltPilot.
#
# Configuration: copy .env.example to .env. Nothing is strictly required -
# an unconfigured device generates a persistent reference and shows it in the
# local web app.
#
# Image version (rollback lever, all optional - unset = today's :latest):
#   VP_EDGE_IMAGE_TAG      pin BOTH images to one tag (e.g. a commit SHA)
#   VP_EDGE_CORE_IMAGE     full ref override for core    (digest pin: repo@sha256:...)
#   VP_EDGE_NODERED_IMAGE  full ref override for nodered (digest pin: repo@sha256:...)
# Set them in the .env (or via `./update.sh --tag <tag>` / `--core-image <ref>`).

name: voltpilot-edge

services:
  core:
    build:
      context: ./core
    image: ${VP_EDGE_CORE_IMAGE:-git.tecmaxx.de/mamotec/voltpilot-ems/edge-app-core:${VP_EDGE_IMAGE_TAG:-latest}}
    pull_policy: always
    restart: unless-stopped
    environment:
      VP_PORTAL_BASE_URL: ${VP_PORTAL_BASE_URL:-https://portal.voltpilot.de}
      VP_MQTT_HOST: ${VP_MQTT_HOST:-mqtt.voltpilot.de}
      VP_MQTT_PORT: ${VP_MQTT_PORT:-8883}
      VP_REF: ${VP_REF:-}
      VP_MAX_CHARGE_KW: ${VP_MAX_CHARGE_KW:-50}
      VP_MAX_DISCHARGE_KW: ${VP_MAX_DISCHARGE_KW:-50}
      VP_SOC_MIN_PCT: ${VP_SOC_MIN_PCT:-5}
      VP_SOC_MAX_PCT: ${VP_SOC_MAX_PCT:-95}
      VP_BUFFER_HOURS: ${VP_BUFFER_HOURS:-48}
      VP_UNCLAIM_CONFIRM_MINUTES: ${VP_UNCLAIM_CONFIRM_MINUTES:-20}
      VP_UNCLAIM_CONFIRM_POLLS: ${VP_UNCLAIM_CONFIRM_POLLS:-4}
      # Globaler Not-Aus der Wechselrichter-Steuerung. Standard 'true' =
      # exakt der einkompilierte Default; der eigentliche Gerätegate ist die
      # Freigabe pro Modell (First-Light / Zertifizierungs-Allowlist).
      VP_CONTROL_ENABLED: ${VP_CONTROL_ENABLED:-true}
      # Verbrauchssteuerung §19 Inkrement 5: der Verbraucher-Steuerungs-Schalter,
      # getrennt vom Wechselrichter-Not-Aus oben. Standard 'false' = der Edge
      # sendet nie ein Verbraucher-Kommando (Sofortaktion/Fahrplan), bis er je
      # Anlage nach dem Runbook (docs/verbrauchssteuerung-betrieb.md)
      # eingeschaltet wird. VP_CONTROL_ENABLED bleibt der globale Stopp.
      VP_CONSUMER_CONTROL_ENABLED: ${VP_CONSUMER_CONTROL_ENABLED:-false}
      # OCPP-Ladepunkte (Lastmanagement). Vorgabe AUS: ohne diesen Schalter
      # bindet die Box keinen Websocket-Server und verhaelt sich zeichengleich
      # wie vor dem Feature. Der eigentliche Zugangs-Zaun ist die Freigabeliste
      # der Charge-Point-Kennungen (chargers.json) - eine nicht eingetragene
      # Saeule wird schon beim Verbindungsaufbau abgewiesen. Die LEBENDE
      # Zuteilung braucht zusaetzlich VP_CONTROL_ENABLED und
      # VP_CONSUMER_CONTROL_ENABLED; ohne sie halten die Saeulen ihr
      # hinterlegtes Sicherheitsprofil (sicher, nur nicht optimiert).
      VP_OCPP_ENABLED: ${VP_OCPP_ENABLED:-false}
      # LAN-Port, auf dem die Ladesaeulen die Box anwaehlen. Muss mit dem
      # Port-Mapping unten uebereinstimmen (die Box nennt die Adresse in der
      # Weboberflaeche).
      VP_OCPP_PORT: ${VP_OCPP_PORT:-8887}
      # Host-Port des Modbus-Datenspiegels (NUR fuer die Anzeige der Adresse
      # in der Weboberflaeche; das Port-Mapping unten muss denselben Wert
      # nutzen). Der Spiegel selbst ist standardmaessig AUS (mirror.json).
      VP_MIRROR_PORT: ${VP_MIRROR_PORT:-502}
      # Dev-only escape hatches (skip enrollment / plain-MQTT cloud). Leave
      # EMPTY on customer devices - see README.
      VP_DEV_TENANT_ID: ${VP_DEV_TENANT_ID:-}
      VP_DEV_SITE_ID: ${VP_DEV_SITE_ID:-}
      VP_DEV_DEVICE_ID: ${VP_DEV_DEVICE_ID:-}
      VP_DEV_CLOUD_URL: ${VP_DEV_CLOUD_URL:-}
    volumes:
      - vp-edge-data:/data
    ports:
      # Local device web app (LAN): http://<geraet>:8484
      - "${VP_WEB_PORT:-8484}:8484"
      # Embedded local MQTT bus, host-loopback only (debugging; Layer 1
      # reaches it via the compose network as core:1883).
      - "127.0.0.1:${VP_BUS_PORT:-1884}:1883"
      # Modbus-Datenspiegel (LAN, nur Lesen): Gebaeudeautomation liest hier
      # statt am Ein-Client-Solarman-Logger. Container-Port fest 1502; ohne
      # aktivierten Spiegel lauscht nichts (Verbindung wird abgewiesen).
      - "${VP_MIRROR_PORT:-502}:1502"
      # OCPP: die Ladesaeulen waehlen die Box hier an
      # (ws://<box>:8887/ocpp/<Kennung>). LAN-only wie :8484 und der
      # Node-RED-Editor - nie oeffentlich erreichbar machen. Ohne
      # VP_OCPP_ENABLED lauscht nichts (Verbindung wird abgewiesen).
      - "${VP_OCPP_PORT:-8887}:8887"

  nodered:
    build:
      context: ./nodered
    image: ${VP_EDGE_NODERED_IMAGE:-git.tecmaxx.de/mamotec/voltpilot-ems/edge-app-nodered:${VP_EDGE_IMAGE_TAG:-latest}}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - core
    environment:
      VP_NODERED_USER: ${VP_NODERED_USER:-voltpilot}
      # Kein Standard-Passwort (fail closed): unset/'voltpilot' verweigert
      # settings.js den Editor-Start. Wert in der .env setzen (install.sh).
      VP_NODERED_PASSWORD: ${VP_NODERED_PASSWORD:-}
    volumes:
      # Named volume so per-customer flow wiring survives container
      # recreation; seeded from the image (template flows) on first run.
      - vp-nodered-data:/data
    ports:
      # Node-RED editor (LAN, behind adminAuth): the VoltPilot service
      # access for per-customer flow wiring. NOT for customers.
      - "${VP_NODERED_PORT:-1881}:1880"

  # --- ota profile: der Apply-Sidecar (OTA Stufe 3 „Autonom") -------------
  # ZWEI unabhaengige Tore, und beide sind zu:
  #   1. Das Profil `ota` - ohne `--profile ota` laeuft dieser Container gar
  #      nicht, und die Box verhaelt sich zeichengleich wie eine ohne ihn.
  #   2. Der Schalter je Geraet (<data>/ota/autonomy.json bzw.
  #      VP_OTA_AUTONOMOUS) - Vorgabe AUS. Ohne ihn beobachtet und meldet der
  #      Sidecar nur; er fuehrt kein einziges veraenderndes docker-Kommando aus.
  # Er besitzt den Docker-Socket und hat deshalb BEWUSST kein Netz und keinen
  # Host-Port. Der Deploy-Ordner ist eingehaengt, weil der Tausch genau den
  # Hebel benutzt, den auch update.sh benutzt (.env-Pin + compose up).
  # Betreiber-Anleitung: docs/ota-autonomie.md
  updater:
    profiles: [ota]
    build:
      context: ./core
      dockerfile: Dockerfile.updater
    image: ${VP_EDGE_UPDATER_IMAGE:-git.tecmaxx.de/mamotec/voltpilot-ems/edge-app-updater:${VP_EDGE_IMAGE_TAG:-latest}}
    pull_policy: always
    restart: unless-stopped
    network_mode: none
    environment:
      # Der Not-Ein fuer den Laborstand. Auf einem Kundengeraet bleibt er leer;
      # der eigentliche Schalter ist die Datei unter /data/ota/autonomy.json.
      VP_OTA_AUTONOMOUS: ${VP_OTA_AUTONOMOUS:-false}
      # Die am Pruefstand BELEGTEN Inverter-Neutral-Zeiten (familie:sekunden).
      # Leer = keine belegt = eine steuernde Anlage wird nicht autonom
      # aktualisiert. Siehe docs/ota-autonomie.md.
      VP_OTA_NEUTRAL_VERIFIED: ${VP_OTA_NEUTRAL_VERIFIED:-}
      VP_OTA_WATCHDOG_SECONDS: ${VP_OTA_WATCHDOG_SECONDS:-600}
      VP_OTA_DISK_GUARD_MB: ${VP_OTA_DISK_GUARD_MB:-2048}
      # Nach einem BESTAETIGTEN Tausch die abgeloesten Abbilder entfernen -
      # sonst waechst die Karte zu, bis der Plattenwaechter das naechste
      # Update verweigert. VP_OTA_PRUNE_KEEP ist die Zahl der abgeloesten
      # Releases, die je Komponente liegen bleiben. Je Geraet ueberstimmbar
      # mit /data/ota/prune.json.
      VP_OTA_PRUNE: ${VP_OTA_PRUNE:-true}
      VP_OTA_PRUNE_KEEP: ${VP_OTA_PRUNE_KEEP:-1}
      # Eine Box mit Host-Netz-Overlay muss beide Dateien nennen.
      VP_OTA_COMPOSE_FILES: ${VP_OTA_COMPOSE_FILES:-docker-compose.yml}
    volumes:
      - vp-edge-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/deploy

  # --- sim profile: hardware-free end-to-end mode -------------------------
  # Starts the SunSpec Modbus TCP simulator (the repo's edge/sim source) so
  # `docker compose --profile sim up -d --build` runs the FULL edge app with
  # zero hardware: sim -> Node-RED "SunSpec (Simulator)" flow -> core -> cloud.
  edge-sim:
    profiles: [sim]
    build:
      context: ../edge/sim
    image: git.tecmaxx.de/mamotec/voltpilot-ems/edge-app-sim:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      SIM_PORT: "502"

volumes:
  vp-edge-data:
  vp-nodered-data:
