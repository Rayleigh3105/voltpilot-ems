<script type="text/html" data-help-name="vp-modbus-switch">
  <p>GENERIERT - dieser Knoten wird nie von Hand gesetzt. Er entsteht
  ausschliesslich aus der Geraete-Freigabe (Einheitsmodell Stufe 4) im
  generierten Flow seines Geraets und schreibt genau EIN freigegebenes
  Register.</p>
  <p>Er abonniert das arbitrierte, geklemmte Kommando
  <code>edge/entities/{id}/command</code>, schreibt ueber dieselbe
  Verbindungs-Warteschlange wie die Lese-Knoten desselben Flows und
  veroeffentlicht seine Ruecklesung auf
  <code>edge/entities/{id}/readback</code>. Ohne das retained
  <code>edge/control/gate</code> schreibt er GAR NICHT.</p>
</script>
