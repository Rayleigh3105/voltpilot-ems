<script type="text/javascript">
  RED.nodes.registerType('vp-feed', {
    category: 'VoltPilot',
    color: '#95B9FF',
    defaults: {
      name: { value: '' },
      core: { value: '', type: 'vp-core', required: true },
      feed: { value: 'prices' }
    },
    inputs: 1,
    outputs: 1,
    icon: 'bridge.svg',
    label: function () { return this.name || 'vp-feed'; },
    paletteLabel: 'vp-feed'
  });
</script>

<script type="text/html" data-template-name="vp-feed">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-core"><i class="fa fa-server"></i> Core</label>
    <input type="text" id="node-input-core">
  </div>
</script>

<script type="text/html" data-help-name="vp-feed">
  <p>Abonniert einen der festen Plattform-Feeds (Whitelist):
  <code>prices</code> (edge/prices, Day-Ahead-Preise) oder
  <code>pv_forecast</code> (edge/forecast/pv). Solange der Core den Feed noch
  nicht liefert, bleibt der Knoten ruhig ("keine Daten").</p>
</script>
