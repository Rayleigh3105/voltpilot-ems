  RED.nodes.registerType('vp-verbraucher', {

    },

  <div class="form-row">

<script type="text/html" data-help-name="vp-verbraucher">
  <p>Sendet die Messung EINES Verbrauchers (z. B. einer go-e-Wallbox) an den
  VoltPilot Core-Agenten, auf dem quellenspezifischen Topic
  <code>edge/sources/&lt;id&gt;/telemetry</code>. Der gemessene Verbrauch
  (<code>load_kw</code>, &ge; 0) ist Anlagen-Last.</p>
  <p><code>msg.source_id</code>: die Quellen-ID (aus
  <code>edge/sources/config</code>), erforderlich.<br>
  <code>msg.payload</code>: Objekt mit <code>load_kw</code> (&ge; 0, und optional
  <code>ts</code>). Eine echte 0 (Gerät lädt gerade nicht) ist gültig. Nur Lesen -
  für eine Quelle gibt es keinen Steuerpfad.</p>
</script>
