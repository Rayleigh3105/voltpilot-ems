<script type="text/html" data-help-name="vp-modbus-read">
  <p>Liest EIN Register eines Modbus-TCP-Geraets (FC3 Holding / FC4 Input,
  Datentyp u16/s16/u32/s32/float32 mit Wortreihenfolge), skaliert den Wert und
  gibt ihn als Zahl aus. Optional wird jeder gelesene Wert als Messkanal einer
  Entitaet auf <code>edge/entities/&lt;entity&gt;/telemetry</code>
  aufgezeichnet. Getaktet ueber den Trigger-Eingang; pro Geraet laeuft immer
  nur EINE Verbindung (frische Socket je Lesung, 8&nbsp;s/8&nbsp;s/30&nbsp;s
  Timeouts). Nur Lesen - dieser Knoten schreibt nie ein Register.</p>
