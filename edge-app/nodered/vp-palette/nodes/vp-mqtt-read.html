<script type="text/html" data-help-name="vp-mqtt-read">
  <p>GENERIERT aus dem Anschluss einer selbst angebundenen Batterie (P5 Ebene 1).
  Der Knoten abonniert auf einem lokalen MQTT-Broker im Kundennetz die Topics
  der Batterie und bildet ihre Felder ueber eine nutzer-definierte Zuordnung auf
  die Standard-Batteriekanaele ab (<code>soc_pct</code>, <code>voltage_v</code>,
  <code>current_a</code>, <code>power_kw</code>, <code>cell_min_mv</code>,
  <code>cell_max_mv</code>, <code>temp_max_c</code>,
  <code>charge_allowed</code>, <code>discharge_allowed</code>,
  <code>charge_limit_a</code>, <code>discharge_limit_a</code>).</p>
  <p>Eine Zuordnung darf VIELE Topics umfassen und daraus ein Aggregat bilden
  (<code>min</code>/<code>max</code>/<code>sum</code>/<code>avg</code>/<code>count</code>/<code>last</code>)
  - so werden aus 176 Zellspannungen unter <code>emon/diybms/+/+</code> genau
  <code>cell_min_mv</code> und <code>cell_max_mv</code>.</p>
  <p>Veroeffentlicht wird im Takt des Trigger-Eingangs: EINE Nachricht auf
  <code>edge/entities/&lt;entity&gt;/telemetry</code> mit allen Kanaelen, die
  gerade einen frischen Wert haben. Ein Kanal ohne frische Probe FEHLT - er wird
  nie als 0 erfunden. Nur Lesen: auf den Kunden-Broker schreibt dieser Knoten
  nie. Nur Ziele im Heimnetz werden abonniert.</p>
</script>
