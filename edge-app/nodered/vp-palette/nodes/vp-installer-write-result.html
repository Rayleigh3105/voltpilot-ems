<script type="text/html" data-help-name="vp-installer-write-result">
  <p>Meldet das Ergebnis des einmaligen Installateur-Schreibauftrags an den
  VoltPilot Core-Agenten (<code>edge/installer-write/result</code>, nicht
  retained), korreliert über <code>request_id</code>.</p>
  <p><code>msg.payload</code>: <code>{ request_id, ok, before?, after?, wrote,
  error_code?, message? }</code>. <code>before</code>/<code>after</code> sind die
  Rohwerte des Registers vor und nach dem Schreiben; sie fehlen, wenn nicht
  gelesen werden konnte – eine 0 ist ein WERT, keine Abwesenheit.</p>
</script>
