<script type="text/html" data-help-name="vp-register-raw">
  <p>Veröffentlicht die ROHEN Registerblöcke des Wechselrichter-Polls
  RETAINED auf <code>edge/registers/raw</code> - die Datenquelle des
  Modbus-Datenspiegels im VoltPilot Core (Nur-Lese-Modbus-Server für die
  Gebäudeautomation, z.&nbsp;B. Loxone).</p>
  <p><code>msg.payload</code>: <code>{ ts, unit, blocks: [{ start, regs[],
  learned?, count?, error? }] }</code>. Reine Weitergabe bereits gelesener
  Daten - dieser Knoten macht KEIN Geräte-I/O; einen Schreibpfad gibt es
  konstruktionsbedingt nicht.</p>
</script>
