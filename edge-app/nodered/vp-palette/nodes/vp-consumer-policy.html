<script type="text/html" data-help-name="vp-consumer-policy">
  <p>GENERIERTER Verbraucherregel-Knoten (vom Policy-Compiler der Cloud
  erzeugt, nie von Hand gepflegt): wertet die kompilierte reaktive Regel
  lokal aus (Dreizustandslogik, Signal-Frische, Hysterese, vorberechnete
