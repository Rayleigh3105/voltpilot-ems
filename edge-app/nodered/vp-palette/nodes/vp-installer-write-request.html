<script type="text/html" data-help-name="vp-installer-write-request">
  <p>Empfängt vom VoltPilot Core-Agenten den EINMALIGEN Installateur-Schreibauftrag
  auf <code>edge/installer-write/request</code> (nicht retained) und gibt ihn aus.</p>
  <p>Der Core hat den Auftrag bereits geprüft: lokal gilt weiterhin nur
  <code>0x00E7</code> mit 1 bis 7000, der Portal-Fachzugang darf genau ein frei
  gewähltes Holding-Register lesen bzw. nach Vorschau einmal beschreiben. Dieser
  Knoten prüft die gemeinsame 16-Bit-Form und führt sie über den geteilten
  Solarman-Socket aus.</p>
  <p><code>msg.payload</code>: <code>{ request_id, mode, register, addr, value }</code>,
  <code>mode</code> ist <code>dry_run</code> (nur lesen, kein Schreibwert nötig)
  oder <code>apply</code>.</p>
</script>
