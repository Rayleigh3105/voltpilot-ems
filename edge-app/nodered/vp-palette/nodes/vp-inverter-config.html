<script type="text/html" data-help-name="vp-inverter-config">
  <p>Empfängt die im Edge-App-Webportal getroffene Wechselrichter-Auswahl vom
  VoltPilot Core-Agenten (lokaler Bus <code>edge/inverter/config</code>,
  retained). Damit verdrahtet sich der Flow selbst: der Kunde wählt vorne aus,
  hinten läuft automatisch der richtige Leseadapter - kein Flow-Edit pro
  Kunde.</p>
  <p>Ausgang <code>msg.payload</code> / <code>msg.inverter</code>: die geparste
  Auswahl (<code>brand</code>, <code>family</code>, <code>communication</code>
  <code>"solarman_v5"|"modbus_tcp"</code>, <code>connection</code>). Eine
  ungültige oder unbekannte Auswahl wird verworfen (der Flow bleibt untätig).
  Nur Auswahl/Monitoring - dieser Knoten steuert nichts.</p>
</script>
