<script type="text/html" data-help-name="vp-desired">
  <p>Veroeffentlicht einen WUNSCH (desired) fuer eine Entitaet auf
  <code>edge/entities/&lt;entity&gt;/desired</code> - der Core-Agent
  arbitriert, klemmt durch die Guard-Kette und schreibt allein das Kommando.
  Flows schreiben NIE Register. Der Ausgang liefert die Arbitrierungs-
  Entscheidungen zu den Wuenschen dieses Knotens (accepted/clamped/...).
  Die Konfiguration stammt aus dem Flow-Compiler (flowc) und wird nicht von
  Hand gepflegt.</p>
