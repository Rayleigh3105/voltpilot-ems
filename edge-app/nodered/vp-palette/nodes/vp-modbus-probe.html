<script type="text/html" data-help-name="vp-modbus-probe">
  <p>Führt die Register-Prüfung des Probe-Kanals aus: empfängt die bereits vom
  Core geprüften Leseschritte auf <code>edge/probe/request</code> (nicht
  retained), liest sie NACHEINANDER über den gemeinsamen
  Verbindungs-Manager und antwortet auf <code>edge/probe/result</code>.</p>
  <p>Der Knoten ist selbstständig – er braucht keine Verdrahtung. Er nutzt
  dieselbe Warteschlange wie <code>vp-modbus-read</code>: EIN Socket je
  (Host, Port) über alle Knoten hinweg, damit eine Vorschau dem laufenden
  Poll nie die Verbindung wegnimmt.</p>
  <p><b>Nur Lesen.</b> Es gibt hier keinen Schreibpfad; den im Vertrag
  vorgesehenen Schalt-Test lehnt der Core ehrlich ab, er erreicht den Bus gar
  nicht.</p>
</script>
