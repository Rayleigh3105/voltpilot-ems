<script type="text/html" data-help-name="vp-soc-derive">
  <p>GENERIERT aus dem Anschluss einer selbst angebundenen Batterie (P5b Ebene 2).
  Der Knoten nimmt die Standard-Batteriekanaele, die eine Ebene-1-Quelle gerade
  geliefert hat (heute <code>vp-mqtt-read</code>), und leitet daraus den
  Ladestand ab:</p>
  <ul>
    <li><code>direct</code> - die Quelle liefert einen echten <code>soc_pct</code>;
      er wird uebernommen (<em>gemessen</em>).</li>
    <li><code>ocv_curve</code> - zwei OCV&rarr;SoC-Kennlinien (Laden/Entladen),
      linear interpoliert und geklemmt; aus der hoechsten und der niedrigsten
      Zelle gewinnt das KONSERVATIVE Minimum (<em>berechnet:kennlinie</em>).</li>
    <li><code>coulomb</code> - Ladungszaehlung ab einem Anker, mit optionaler
      Rekalibrierung an den Spannungs-Endpunkten
      (<em>berechnet:ladungszaehlung</em>).</li>
  </ul>
  <p>Veroeffentlicht wird EINE Nachricht auf
  <code>edge/entities/&lt;entity&gt;/telemetry</code> mit
  <code>soc_pct</code> und <code>soc_source_code</code> (1&nbsp;= gemessen,
  2&nbsp;= Kennlinie, 3&nbsp;= Ladungszaehlung) - so behaelt die Historie die
  damalige Quelle.</p>
  <p>Ohne Eingang gibt es KEINEN Ladestand: fehlt die Zellspannung bzw. der
  Anker, wird nichts veroeffentlicht. Ein eingefrorener Wert wird im Status samt
  Alter gezeigt, aber nie mit einem frischen Zeitstempel erneut gesendet; nach
  der Haltefrist ist er abwesend und die Ladungszaehlung braucht einen neuen
  Anker.</p>
</script>
