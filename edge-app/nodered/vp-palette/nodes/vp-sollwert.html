<script type="text/html" data-help-name="vp-sollwert">
  <p>Empfängt den aktuellen Batterie-Sollwert des VoltPilot Core-Agenten
  (lokaler Bus, retained). Der Wert ist bereits durch die Guards des Core
  begrenzt (Leistungsband, SoC-Grenzen, §14a-Hüllkurve) - der Flow übersetzt
  ihn nur noch ins Geräteprotokoll (z.&nbsp;B. Modbus-Register-Write).</p>
  <p><code>msg.payload</code>: Sollwert in kW (+ = laden, − = entladen).<br>
  <code>msg.setpoint</code>: das vollständige Kommando
  (<code>battery_setpoint_kw</code>, <code>source</code>
  <code>"schedule"|"default"</code>, ggf. <code>slot_start</code>,
  <code>ts</code>).</p>
</script>
