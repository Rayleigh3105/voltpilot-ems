<script type="text/html" data-help-name="vp-register-want">
  <p>Abonniert die RETAINED Auto-Lern-Wunschliste des Modbus-Datenspiegels
  (<code>edge/registers/want</code>) und gibt sie aus:
  <code>{ blocks: [{ start, count }] }</code>.</p>
  <p>Der Poll liest davon höchstens EINEN Block je Zyklus (round-robin, nach
  den Primärblöcken, innerhalb derselben Socket-Disziplin, in der
  Steuer-Schreibbefehle Vorrang haben) - so ist die Belastung des Loggers
  hart gedeckelt, egal was der Verbraucher tut. Das Steuerfenster 1100-1121
  wird nie gepollt.</p>
</script>
