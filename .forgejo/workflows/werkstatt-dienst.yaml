name: Werkstatt-Dienst

# Prüft und baut den Werkstatt-Dienst (services/werkstatt-dienst) und schiebt
# sein Bild in die Registry. Von Hand gestartet. Bewusst getrennt von
# deploy.yaml/deploy-fast.yaml: der Dienst hat eine eigene Application mit Sync
# von Hand (werkstatt-prod), der Tag-Bump der übrigen Dienste fasst ihn nicht an;
# den Tag setzt der Betreiber im gitops-Repo (services/werkstatt-dienst/docs/runbook.md).
#
# Secrets wie deploy.yaml: FORGEJO_USERNAME / FORGEJO_PASSWORD (Registry).

on:
  workflow_dispatch:

jobs:
  test:
    name: Test (Go, Skripte)
    runs-on: ubuntu-latest-mo
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/werkstatt-dienst
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  # Die Container-Proben brauchen Docker; die Brücken-Probe zusätzlich
  # --privileged (Netz-Namensräume im Container). Der Bau wartet nicht auf
  # sie: kann ein Runner keine privilegierten Container, bleibt das hier rot
  # und sichtbar, ohne den Bau zu sperren.
  probe:
    name: Container-Proben
    runs-on: ubuntu-latest-mo
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Brücke im Container
        run: sh services/werkstatt-dienst/test/bruecke-probe.sh
      - name: Dienst-Bild unter restricted
        run: sh services/werkstatt-dienst/test/dienst-container-probe.sh
      # Ganzer Lauf ab frischem OpenWrt (echtes OpenWrt, Brücke, Wartungsserver);
      # braucht jq und Internet für die Box (apk, wget über die Brücke).
      - name: Lauf ab OpenWrt im Container
        run: sh services/werkstatt-dienst/test/box-probe.sh

  build:
    name: Build & Push werkstatt-dienst
    needs: test
    runs-on: ubuntu-latest-mo
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Forgejo Registry
        uses: docker/login-action@v3
        with:
          registry: git.tecmaxx.de
          username: ${{ secrets.FORGEJO_USERNAME }}
          password: ${{ secrets.FORGEJO_PASSWORD }}
      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/werkstatt-dienst
          build-args: |
            FASSUNG=${{ github.sha }}
          platforms: linux/amd64
          push: true
          cache-from: type=registry,ref=git.tecmaxx.de/mamotec/voltpilot-ems/werkstatt-dienst:buildcache
          cache-to: type=registry,ref=git.tecmaxx.de/mamotec/voltpilot-ems/werkstatt-dienst:buildcache,mode=max
          tags: |
            git.tecmaxx.de/mamotec/voltpilot-ems/werkstatt-dienst:${{ github.sha }}
