name: Build & Deploy (fast, no tests)

# Manual-only fast path: build + push every image, then roll out on the VPS.
# Unlike "Build & Deploy" this skips the test gate - it trusts the operator and
# goes straight to production. Use it for quick rollouts when you've already
# validated locally; use the full gated pipeline otherwise.
#
# Same Forgejo Actions secrets as deploy.yaml:
#   FORGEJO_USERNAME / FORGEJO_PASSWORD, DEPLOY_HOST / DEPLOY_USER /
#   DEPLOY_PASSWORD, DOMAIN. See docs/deploy.md.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Push ${{ matrix.component }}
    runs-on: ubuntu-latest-mo
    timeout-minutes: 60

    strategy:
      matrix:
        include:
          - component: api
            context: ./services/api
            build_args: ""
          - component: ingest
            context: ./services/ingest
            build_args: ""
          - component: timescale-writer
            context: ./services/timescale-writer
            build_args: ""
          - component: market-data
            context: ./services/market-data
            build_args: ""
          - component: forecast
            context: ./services/forecast
            build_args: ""
          # Repo-root context: the optimizer image installs services/forecast
          # alongside (see services/optimization/Dockerfile).
          - component: optimization
            context: .
            dockerfile: ./services/optimization/Dockerfile
            build_args: ""
          # VITE_KEYCLOAK_URL is appended in the "Compose image build args" step
          # below: the secrets context is NOT available inside strategy.matrix
          # (Forgejo resolves the matrix before secrets exist and rejects the
          # whole job), so ${{ secrets.DOMAIN }} must never appear here.
          - component: frontend
            context: ./frontend/portal
            build_args: |
              VITE_API_BASE=
              VITE_KEYCLOAK_REALM=voltpilot
              VITE_KEYCLOAK_CLIENT_ID=voltpilot-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Forgejo Registry
        uses: docker/login-action@v3
        with:
          registry: git.tecmaxx.de
          username: ${{ secrets.FORGEJO_USERNAME }}
          password: ${{ secrets.FORGEJO_PASSWORD }}

      # Secrets are valid in steps but not in strategy.matrix, so the final
      # build-args list is composed here: the matrix's non-secret args plus, for
      # the frontend only, the secret-derived VITE_KEYCLOAK_URL line.
      - name: Compose image build args
        id: args
        env:
          COMPONENT: ${{ matrix.component }}
          MATRIX_BUILD_ARGS: ${{ matrix.build_args }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          {
            echo 'build_args<<VP_BUILD_ARGS_EOF'
            printf '%s\n' "$MATRIX_BUILD_ARGS"
            if [ "$COMPONENT" = "frontend" ]; then
              echo "VITE_KEYCLOAK_URL=https://${DOMAIN}/auth"
            fi
            echo 'VP_BUILD_ARGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          build-args: ${{ steps.args.outputs.build_args }}
          platforms: linux/amd64
          push: true
          cache-from: type=registry,ref=git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:buildcache
          cache-to: type=registry,ref=git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:buildcache,mode=max
          tags: |
            git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:latest
            git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:${{ github.sha }}

  deploy:
    name: Deploy on VPS
    needs: build
    runs-on: ubuntu-latest-mo
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy compose + infra to VPS
        uses: https://github.com/appleboy/scp-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "docker-compose.prod.yml,infra/prod/**,infra/mqtt/acl/acl.conf,tools/pki/merge-acl-grants.sh,tools/pki/reload-broker-authz.sh,deploy/keycloak/themes/voltpilot/**"
          target: /tmp/voltpilot-deploy
          overwrite: true

      - name: Deploy via SSH
        uses: https://github.com/appleboy/ssh-action@master
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          command_timeout: 15m
          script_stop: true
          # DEPLOY_PASSWORD reaches the remote shell via `envs:` (the action
          # exports the step env vars there), so the secret never interpolates
          # into the script text and special characters can't break quoting.
          envs: DEPLOY_PASSWORD
          script: |
            set -euo pipefail

            DEPLOY_DIR=/srv/docker/voltpilot

            # Privilege helper: a root deploy user runs commands directly
            # (hosts without sudo installed); a non-root user goes through
            # `sudo -S` with the password on stdin, as before.
            priv() { if [ "$(id -u)" -eq 0 ]; then "$@"; else printf '%s\n' "$DEPLOY_PASSWORD" | sudo -S "$@"; fi; }

            priv mkdir -p "$DEPLOY_DIR/infra/prod" "$DEPLOY_DIR/infra/mqtt/acl" "$DEPLOY_DIR/tools/pki"
            priv cp /tmp/voltpilot-deploy/docker-compose.prod.yml "$DEPLOY_DIR/docker-compose.yml"
            priv cp -r /tmp/voltpilot-deploy/infra/prod/. "$DEPLOY_DIR/infra/prod/"
            priv cp /tmp/voltpilot-deploy/tools/pki/merge-acl-grants.sh /tmp/voltpilot-deploy/tools/pki/reload-broker-authz.sh "$DEPLOY_DIR/tools/pki/"
            # MQTT ACL: MERGE, never overwrite - the grants between the anchors
            # are runtime state (api enrollment issuance / voltpilot-ca.sh) and
            # a plain copy would revoke every enrolled device. Deploys before
            # the acl/ directory mount kept the file one level up - migrate its
            # grants on the first run.
            DEPLOYED_ACL="$DEPLOY_DIR/infra/mqtt/acl/acl.conf"
            [ -f "$DEPLOYED_ACL" ] || DEPLOYED_ACL="$DEPLOY_DIR/infra/mqtt/acl.conf"
            priv sh "$DEPLOY_DIR/tools/pki/merge-acl-grants.sh" \
              /tmp/voltpilot-deploy/infra/mqtt/acl/acl.conf "$DEPLOYED_ACL" /tmp/voltpilot-deploy/acl.merged
            priv cp /tmp/voltpilot-deploy/acl.merged "$DEPLOY_DIR/infra/mqtt/acl/acl.conf"
            # The broker reads the ACL as a different non-root uid: a root
            # umask (or a stray restrictive mode) must never leave the dir or
            # file unreadable, or EMQX fails boot-time config validation.
            priv chmod 755 "$DEPLOY_DIR/infra/mqtt/acl"
            priv chmod 644 "$DEPLOY_DIR/infra/mqtt/acl/acl.conf"
            # VoltPilot Keycloak login theme to the compose bind-mount path.
            priv mkdir -p "$DEPLOY_DIR/deploy/keycloak/themes"
            priv rm -rf "$DEPLOY_DIR/deploy/keycloak/themes/voltpilot"
            priv cp -r /tmp/voltpilot-deploy/deploy/keycloak/themes/voltpilot "$DEPLOY_DIR/deploy/keycloak/themes/voltpilot"
            rm -rf /tmp/voltpilot-deploy

            echo "${{ secrets.FORGEJO_PASSWORD }}" | docker login git.tecmaxx.de -u "${{ secrets.FORGEJO_USERNAME }}" --password-stdin

            cd "$DEPLOY_DIR"
            export IMAGE_TAG="${{ github.sha }}"
            docker compose pull
            docker compose up -d --remove-orphans
            # Theme + gzip caches live on the container FS and survive a plain
            # restart - recreate so theme changes actually reach browsers.
            docker compose up -d --force-recreate keycloak
            # Make ACL changes effective: the file authorizer compiles its rules
            # at source init and a running broker never re-reads acl.conf on its
            # own (emqx ctl conf reload does NOT do it - verified on 5.8.3).
            # Non-fatal: a still-booting broker reads the fresh file anyway.
            EMQX_EXEC="docker compose exec -T emqx" sh tools/pki/reload-broker-authz.sh \
              || echo "warn: broker authz reload failed - ACL changes apply at the next broker (re)start"
            docker image prune -f
