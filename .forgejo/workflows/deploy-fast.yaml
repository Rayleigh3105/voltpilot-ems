name: Build & Deploy (fast, no tests)

# Manual-only fast path: build + push every image, then bump the image tags in
# the gitops repo. Unlike "Build & Deploy" this skips the test gate - it trusts
# the operator. Use it for quick rollouts when you've already validated locally;
# use the full gated pipeline otherwise.
#
# Der SSH/SCP-Deploy auf die Prod-VM ist mit dem Cutover VM -> k3s-Cluster
# (03.08.2026) ENTFERNT: die Compose-Zwillinge auf der VM sind gestoppt, NPM
# zeigt auf den Cluster, und Argo CD deployt aus dem gitops-Repo. Ein Lauf
# dieses Workflows haette die gestoppten VM-Dienste sonst wiederbelebt - mit
# einem zweiten Optimierer gegen dieselben Live-Anlagen. Der Ablauf ist jetzt:
# Images bauen + pushen -> gitops-Tag-Bump-Commit -> Argo synct.
#
# Same Forgejo Actions secrets as deploy.yaml:
#   FORGEJO_USERNAME / FORGEJO_PASSWORD, DOMAIN. See docs/deploy.md.
#   GITOPS_PUSH_TOKEN (optional) - der gitops-Tag-Bump am Ende dieser Datei;
#   ohne das Secret ueberspringt der Job sauber.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Push ${{ matrix.component }}
    runs-on: ubuntu-latest-mo
    timeout-minutes: 60

    strategy:
      matrix:
        include:
          - component: api
            context: .
            dockerfile: ./services/api/Dockerfile
            build_args: ""
          - component: ingest
            context: ./services/ingest
            build_args: ""
          - component: timescale-writer
            context: ./services/timescale-writer
            build_args: ""
          - component: market-data
            context: ./services/market-data
            build_args: ""
          - component: forecast
            context: ./services/forecast
            build_args: ""
          # Repo-root context: the optimizer image installs services/forecast
          # alongside (see services/optimization/Dockerfile).
          - component: optimization
            context: .
            dockerfile: ./services/optimization/Dockerfile
            build_args: ""
          # flowc-serve: the cloud-side flow-graph -> flow-artifact compiler
          # sidecar the api compiles flows through during activation (E2 flowc).
          - component: flowc
            context: ./edge-app/nodered/flowc
            build_args: ""
          # Repo-root context like the optimizer: the image bakes the realm
          # import (infra/prod/keycloak) AND the login theme
          # (deploy/keycloak/themes), which live in different directories.
          # Compose still defaults to the upstream image; the k8s Deployment
          # pulls this one (deploy/keycloak/README.md).
          - component: keycloak
            context: .
            dockerfile: ./deploy/keycloak/Dockerfile
            build_args: ""
          # VITE_KEYCLOAK_URL is appended in the "Compose image build args" step
          # below: the secrets context is NOT available inside strategy.matrix
          # (Forgejo resolves the matrix before secrets exist and rejects the
          # whole job), so ${{ secrets.DOMAIN }} must never appear here.
          - component: frontend
            context: ./frontend/portal
            build_args: |
              VITE_API_BASE=
              VITE_KEYCLOAK_REALM=voltpilot
              VITE_KEYCLOAK_CLIENT_ID=voltpilot-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Forgejo Registry
        uses: docker/login-action@v3
        with:
          registry: git.tecmaxx.de
          username: ${{ secrets.FORGEJO_USERNAME }}
          password: ${{ secrets.FORGEJO_PASSWORD }}

      # Secrets are valid in steps but not in strategy.matrix, so the final
      # build-args list is composed here: the matrix's non-secret args plus, for
      # the frontend only, the secret-derived VITE_KEYCLOAK_URL line.
      - name: Compose image build args
        id: args
        env:
          COMPONENT: ${{ matrix.component }}
          MATRIX_BUILD_ARGS: ${{ matrix.build_args }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          {
            echo 'build_args<<VP_BUILD_ARGS_EOF'
            printf '%s\n' "$MATRIX_BUILD_ARGS"
            if [ "$COMPONENT" = "frontend" ]; then
              echo "VITE_KEYCLOAK_URL=https://${DOMAIN}/auth"
            fi
            echo 'VP_BUILD_ARGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          build-args: ${{ steps.args.outputs.build_args }}
          platforms: linux/amd64
          push: true
          cache-from: type=registry,ref=git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:buildcache
          cache-to: type=registry,ref=git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:buildcache,mode=max
          tags: |
            git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:latest
            git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # CI-Zielpfad (Captain-Go 01.08.2026): DER DEPLOY IST EIN COMMIT.
  #
  # Nach gruenen Image-Builds schreibt die Pipeline den frischen Bild-Stand
  # selbst in das gitops-Repo fort: der `images:`-Block in
  # apps/voltpilot/overlays/prod/kustomization.yaml wird auf ${GITHUB_SHA}
  # gesetzt und committet. Damit ist jederzeit per `git log` beantwortbar, was
  # im Cluster laufen soll, und ein Rollback ist ein `git revert`.
  # Bewusst OHNE `:latest` und ohne Argo-CD-Image-Updater (kein Registry-
  # Polling, kein weiterer Controller; Begruendung im gitops-README,
  # "CI/CD-Zielpfad").
  #
  # Der Bump landet NUR IM GIT. Alle Argo-Applications ausser der Root-App
  # stehen auf MANUELLEM Sync - der Cluster zieht den neuen Stand also erst
  # beim naechsten (menschlich ausgeloesten) Sync (gitops README,
  # "Sync-Policy: heute manuell").
  #
  # Seit dem Cutover (03.08.2026) ist dieser Job der EINZIGE Abnehmer der
  # Builds: der VM-Deploy-Job ist entfernt, weil er die gestoppten
  # Compose-Zwillinge auf der Prod-VM wiederbelebt haette.
  # ---------------------------------------------------------------------------
  gitops-tag-bump:
    name: Bump gitops image tags
    needs: build
    runs-on: ubuntu-latest-mo
    timeout-minutes: 10

    env:
      # Host = wofuer die Zugangsdaten gelten, REMOTE = was geklont wird.
      # Getrennt, damit das Skript unveraendert gegen ein lokales Repo laufen
      # kann - genau das tut tools/deploy/test-gitops-bump-workflow.sh.
      GITOPS_HOST: git.tecmaxx.de
      GITOPS_REMOTE: https://git.tecmaxx.de/mamotec/gitops.git
      GITOPS_BRANCH: main
      # Die EINE Datei, die dieser Job anfassen darf.
      OVERLAY: apps/voltpilot/overlays/prod/kustomization.yaml

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Bump gitops prod overlay and push
        env:
          # Eigenes CI-Token mit repository:write NUR auf das gitops-Repo -
          # niemals ein persoenliches Token. Anlegen: siehe docs/deploy.md,
          # "gitops-Tag-Bump (CI-Zielpfad)". Ist das Secret nicht gesetzt,
          # UEBERSPRINGT dieser Schritt sauber (gruen) statt die Pipeline rot
          # zu faerben - so kann der Zielpfad vor dem Secret gemerged werden.
          GITOPS_PUSH_TOKEN: ${{ secrets.GITOPS_PUSH_TOKEN }}
          # Optional. Forgejo authentifiziert ueber das Token (Passwortfeld);
          # der Benutzername ist dabei egal, deshalb reicht der Default.
          GITOPS_PUSH_USER: ${{ secrets.GITOPS_PUSH_USER }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail

          if [ -z "${GITOPS_PUSH_TOKEN:-}" ]; then
            echo "GITOPS_PUSH_TOKEN ist nicht gesetzt - der gitops-Tag-Bump wird UEBERSPRUNGEN."
            echo "Es wurde nichts geklont, nichts committet, nichts gepusht."
            echo "Anlegen: Forgejo -> voltpilot-ems -> Settings -> Actions -> Secrets (docs/deploy.md)."
            {
              echo "### gitops-Tag-Bump uebersprungen"
              echo ""
              echo "\`GITOPS_PUSH_TOKEN\` ist nicht gesetzt - das gitops-Repo wurde NICHT veraendert."
              echo "Der prod-Overlay muss bis dahin von Hand auf \`${SHA}\` gesetzt werden."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi

          BUMP="$PWD/tools/deploy/gitops-image-bump.sh"
          WORK="$(mktemp -d)"
          CREDS="$WORK/.git-credentials"
          trap 'rm -rf "$WORK"' EXIT

          # Das Token landet WEDER in der Remote-URL (die bliebe in .git/config
          # und in jeder Fehlermeldung stehen) NOCH in einer Kommandozeile: es
          # geht ueber eine 0600-Credential-Datei, die mit $WORK stirbt. Der
          # Helper wird nur fuer den clone mitgegeben und danach LOKAL im
          # Checkout gesetzt - die globale git-Konfiguration des Runners bleibt
          # unberuehrt.
          ( umask 077; printf 'https://%s:%s@%s\n' \
              "${GITOPS_PUSH_USER:-ci}" "$GITOPS_PUSH_TOKEN" "$GITOPS_HOST" > "$CREDS" )

          git -c "credential.helper=store --file=$CREDS" \
            clone --depth 1 --branch "$GITOPS_BRANCH" "$GITOPS_REMOTE" "$WORK/gitops"
          cd "$WORK/gitops"
          git config "credential.helper" "store --file=$CREDS"
          git config user.name  "VoltPilot CI"
          git config user.email "ci@voltpilot.de"

          # Push-Schleife gegen das Rennen zweier parallel fertig werdender
          # Laeufe. Bewusst NICHT `pull --rebase`: beide Laeufe fassen exakt
          # dieselben newTag-Zeilen an, ein Rebase kollidiert also genau dort.
          # Stattdessen wird bei jedem Versuch vom FRISCHEN origin/main neu
          # abgeleitet - der Edit ist idempotent, also ist das konfliktfrei
          # per Konstruktion und endet an derselben Stelle: main zeigt auf den
          # sha des zuletzt fertig gewordenen Laufs.
          attempt=1
          while [ "$attempt" -le 3 ]; do
            git fetch --depth 1 origin "$GITOPS_BRANCH"
            git reset --hard "origin/$GITOPS_BRANCH"

            set +e
            sh "$BUMP" "$OVERLAY" "$SHA"
            rc=$?
            set -e
            case "$rc" in
              0) ;;
              2) echo "gitops/$GITOPS_BRANCH steht bereits auf $SHA - kein Leer-Commit."
                 echo "### gitops-Tag-Bump: nichts zu tun (bereits \`${SHA}\`)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
                 exit 0 ;;
              *) echo "FATAL: der Tag-Bump wurde verweigert (siehe Meldung oben) - gitops bleibt unveraendert." >&2
                 exit 1 ;;
            esac

            # Sicherheitsnetz: NUR der Overlay darf sich geaendert haben.
            dirty="$(git status --porcelain)"
            touched="$(printf '%s\n' "$dirty" | awk 'NF {print $NF}')"
            if [ "$touched" != "$OVERLAY" ]; then
              echo "FATAL: unerwartete Aenderungen im gitops-Checkout - es wird nichts gepusht:" >&2
              printf '%s\n' "$dirty" >&2
              exit 1
            fi

            git add "$OVERLAY"
            git commit -q \
              -m "ci(images): voltpilot-ems@$SHA" \
              -m "Alle Images aus dem Build von $WORKFLOW tragen denselben sha." \
              -m "Lauf: $RUN_URL"

            if git push origin "HEAD:$GITOPS_BRANCH"; then
              echo "gitops/$GITOPS_BRANCH auf $SHA gepinnt."
              {
                echo "### gitops-Tag-Bump"
                echo ""
                echo "prod-Overlay auf \`${SHA}\` gepinnt (Versuch ${attempt})."
                echo "Argo CD steht auf manuellem Sync - der Cluster zieht beim naechsten Sync nach."
              } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              exit 0
            fi

            echo "Push abgelehnt (paralleler Lauf?) - Versuch $attempt von 3, neu ableiten." >&2
            attempt=$((attempt + 1))
            sleep $((attempt * 3))
          done

          echo "FATAL: gitops-Push nach 3 Versuchen fehlgeschlagen. Die Images sind gebaut und" >&2
          echo "gepusht; nachziehen von Hand: tools/deploy/gitops-image-bump.sh <overlay> $SHA" >&2
          exit 1
