name: Build & Deploy (fast, no tests)

# Manual-only fast path: build + push every image, then roll out on the VPS.
# Unlike "Build & Deploy" this skips the test gate - it trusts the operator and
# goes straight to production. Use it for quick rollouts when you've already
# validated locally; use the full gated pipeline otherwise.
#
# Same Forgejo Actions secrets as deploy.yaml:
#   FORGEJO_USERNAME / FORGEJO_PASSWORD, DEPLOY_HOST / DEPLOY_USER /
#   DEPLOY_PASSWORD, DOMAIN. See docs/deploy.md.
#   GITOPS_PUSH_TOKEN (optional) - der gitops-Tag-Bump am Ende dieser Datei;
#   ohne das Secret ueberspringt der Job sauber.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Push ${{ matrix.component }}
    runs-on: ubuntu-latest-mo
    timeout-minutes: 60

    strategy:
      matrix:
        include:
          - component: api
            context: ./services/api
            build_args: ""
          - component: ingest
            context: ./services/ingest
            build_args: ""
          - component: timescale-writer
            context: ./services/timescale-writer
            build_args: ""
          - component: market-data
            context: ./services/market-data
            build_args: ""
          - component: forecast
            context: ./services/forecast
            build_args: ""
          # Repo-root context: the optimizer image installs services/forecast
          # alongside (see services/optimization/Dockerfile).
          - component: optimization
            context: .
            dockerfile: ./services/optimization/Dockerfile
            build_args: ""
          # flowc-serve: the cloud-side flow-graph -> flow-artifact compiler
          # sidecar the api compiles flows through during activation (E2 flowc).
          - component: flowc
            context: ./edge-app/nodered/flowc
            build_args: ""
          # Repo-root context like the optimizer: the image bakes the realm
          # import (infra/prod/keycloak) AND the login theme
          # (deploy/keycloak/themes), which live in different directories.
          # Compose still defaults to the upstream image; the k8s Deployment
          # pulls this one (deploy/keycloak/README.md).
          - component: keycloak
            context: .
            dockerfile: ./deploy/keycloak/Dockerfile
            build_args: ""
          # VITE_KEYCLOAK_URL is appended in the "Compose image build args" step
          # below: the secrets context is NOT available inside strategy.matrix
          # (Forgejo resolves the matrix before secrets exist and rejects the
          # whole job), so ${{ secrets.DOMAIN }} must never appear here.
          - component: frontend
            context: ./frontend/portal
            build_args: |
              VITE_API_BASE=
              VITE_KEYCLOAK_REALM=voltpilot
              VITE_KEYCLOAK_CLIENT_ID=voltpilot-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Forgejo Registry
        uses: docker/login-action@v3
        with:
          registry: git.tecmaxx.de
          username: ${{ secrets.FORGEJO_USERNAME }}
          password: ${{ secrets.FORGEJO_PASSWORD }}

      # Secrets are valid in steps but not in strategy.matrix, so the final
      # build-args list is composed here: the matrix's non-secret args plus, for
      # the frontend only, the secret-derived VITE_KEYCLOAK_URL line.
      - name: Compose image build args
        id: args
        env:
          COMPONENT: ${{ matrix.component }}
          MATRIX_BUILD_ARGS: ${{ matrix.build_args }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          {
            echo 'build_args<<VP_BUILD_ARGS_EOF'
            printf '%s\n' "$MATRIX_BUILD_ARGS"
            if [ "$COMPONENT" = "frontend" ]; then
              echo "VITE_KEYCLOAK_URL=https://${DOMAIN}/auth"
            fi
            echo 'VP_BUILD_ARGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          build-args: ${{ steps.args.outputs.build_args }}
          platforms: linux/amd64
          push: true
          cache-from: type=registry,ref=git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:buildcache
          cache-to: type=registry,ref=git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:buildcache,mode=max
          tags: |
            git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:latest
            git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:${{ github.sha }}

  deploy:
    name: Deploy on VPS
    needs: build
    runs-on: ubuntu-latest-mo
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy compose + infra to VPS
        uses: https://github.com/appleboy/scp-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "docker-compose.prod.yml,infra/prod/**,infra/mqtt/acl/acl.conf,tools/pki/merge-acl-grants.sh,tools/pki/reload-broker-authz.sh,deploy/keycloak/themes/voltpilot/**"
          target: /tmp/voltpilot-deploy
          overwrite: true

      - name: Deploy via SSH
        uses: https://github.com/appleboy/ssh-action@master
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          command_timeout: 15m
          script_stop: true
          # DEPLOY_PASSWORD reaches the remote shell via `envs:` (the action
          # exports the step env vars there), so the secret never interpolates
          # into the script text and special characters can't break quoting.
          envs: DEPLOY_PASSWORD
          script: |
            set -euo pipefail

            DEPLOY_DIR=/srv/docker/voltpilot

            # Privilege helper: a root deploy user runs commands directly
            # (hosts without sudo installed); a non-root user goes through
            # `sudo -S` with the password on stdin, as before.
            priv() { if [ "$(id -u)" -eq 0 ]; then "$@"; else printf '%s\n' "$DEPLOY_PASSWORD" | sudo -S "$@"; fi; }

            priv mkdir -p "$DEPLOY_DIR/infra/prod" "$DEPLOY_DIR/infra/mqtt/acl" "$DEPLOY_DIR/tools/pki"
            priv cp /tmp/voltpilot-deploy/docker-compose.prod.yml "$DEPLOY_DIR/docker-compose.yml"
            priv cp -r /tmp/voltpilot-deploy/infra/prod/. "$DEPLOY_DIR/infra/prod/"
            priv cp /tmp/voltpilot-deploy/tools/pki/merge-acl-grants.sh /tmp/voltpilot-deploy/tools/pki/reload-broker-authz.sh "$DEPLOY_DIR/tools/pki/"
            # MQTT ACL: MERGE, never overwrite - the grants between the anchors
            # are runtime state (api enrollment issuance / voltpilot-ca.sh) and
            # a plain copy would revoke every enrolled device. Deploys before
            # the acl/ directory mount kept the file one level up - migrate its
            # grants on the first run.
            DEPLOYED_ACL="$DEPLOY_DIR/infra/mqtt/acl/acl.conf"
            [ -f "$DEPLOYED_ACL" ] || DEPLOYED_ACL="$DEPLOY_DIR/infra/mqtt/acl.conf"
            priv sh "$DEPLOY_DIR/tools/pki/merge-acl-grants.sh" \
              /tmp/voltpilot-deploy/infra/mqtt/acl/acl.conf "$DEPLOYED_ACL" /tmp/voltpilot-deploy/acl.merged
            priv cp /tmp/voltpilot-deploy/acl.merged "$DEPLOY_DIR/infra/mqtt/acl/acl.conf"
            # The broker reads the ACL as a different non-root uid: a root
            # umask (or a stray restrictive mode) must never leave the dir or
            # file unreadable, or EMQX fails boot-time config validation.
            priv chmod 755 "$DEPLOY_DIR/infra/mqtt/acl"
            priv chmod 644 "$DEPLOY_DIR/infra/mqtt/acl/acl.conf"
            # Broker cert/key permissions. The certs are staged out of band
            # (below), but scp/cp preserve their source mode, so server.key
            # commonly lands 0600 owned by the deploy user - unreadable by the
            # emqx process (a NON-root uid inside the container), which then
            # fails boot with "cannot read keyfile" (live incident 2026-07-03).
            # Enforce emqx-readable perms on every deploy so a re-staged key is
            # never hand-fixed live again (see docs/deploy.md step 3).
            if [ -d "$DEPLOY_DIR/infra/mqtt/certs" ]; then
              priv chmod 755 "$DEPLOY_DIR/infra/mqtt/certs"
              priv find "$DEPLOY_DIR/infra/mqtt/certs" -type f \
                \( -name '*.crt' -o -name '*.pem' -o -name '*.key' \) -exec chmod 644 {} +
            fi
            # VoltPilot Keycloak login theme to the compose bind-mount path.
            priv mkdir -p "$DEPLOY_DIR/deploy/keycloak/themes"
            priv rm -rf "$DEPLOY_DIR/deploy/keycloak/themes/voltpilot"
            priv cp -r /tmp/voltpilot-deploy/deploy/keycloak/themes/voltpilot "$DEPLOY_DIR/deploy/keycloak/themes/voltpilot"
            rm -rf /tmp/voltpilot-deploy

            echo "${{ secrets.FORGEJO_PASSWORD }}" | docker login git.tecmaxx.de -u "${{ secrets.FORGEJO_USERNAME }}" --password-stdin

            cd "$DEPLOY_DIR"
            # Preflight: MQTT_DOMAIN is REQUIRED when device enrollment is on
            # (the proxied/domain-based production model). Devices dial
            # ${MQTT_DOMAIN} for mTLS MQTT and it must match the broker
            # server-cert SAN; an unset value silently fell back to
            # mqtt.${DOMAIN} and handed devices the wrong host live (2026-07-03).
            # A non-enrollment deployment (VOLTPILOT_ENROLLMENT_ENABLED=false)
            # is exempt. See docs/deploy.md and .env.prod.example.
            envval() { grep -E "^$1=" .env 2>/dev/null | tail -1 | cut -d= -f2- | sed 's/^["'"'"']//; s/["'"'"']$//'; }
            enroll="$(envval VOLTPILOT_ENROLLMENT_ENABLED)"
            case "${enroll:-true}" in
              ''|true|TRUE|True|1|yes|on)
                if [ -z "$(envval MQTT_DOMAIN)" ]; then
                  echo "FATAL: device enrollment is enabled but MQTT_DOMAIN is unset in $DEPLOY_DIR/.env." >&2
                  echo "Set MQTT_DOMAIN to the FQDN devices dial for MQTT (must match the broker server-cert SAN); see docs/deploy.md and .env.prod.example." >&2
                  exit 1
                fi ;;
            esac
            export IMAGE_TAG="${{ github.sha }}"
            # Persist the pinned tag into .env (in place, idempotent) so a later
            # manual `docker compose up --force-recreate` on the VM recreates with
            # THESE images, not the stale :latest the .env default would otherwise
            # roll every service back to (footgun that bit the operator 2026-07-02).
            # A commit SHA has no sed-special chars; replace an existing line,
            # append only if the key is absent (matches ^IMAGE_TAG= exactly).
            if grep -qE '^IMAGE_TAG=' .env 2>/dev/null; then
              priv sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
            else
              printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" | priv tee -a .env >/dev/null
            fi
            docker compose pull
            docker compose up -d --remove-orphans
            # Theme + gzip caches live on the container FS and survive a plain
            # restart - recreate so theme changes actually reach browsers.
            docker compose up -d --force-recreate keycloak
            # Make ACL changes effective: the file authorizer compiles its rules
            # at source init and a running broker never re-reads acl.conf on its
            # own (emqx ctl conf reload does NOT do it - verified on 5.8.3).
            # Non-fatal: a still-booting broker reads the fresh file anyway.
            EMQX_EXEC="docker compose exec -T emqx" sh tools/pki/reload-broker-authz.sh \
              || echo "warn: broker authz reload failed - ACL changes apply at the next broker (re)start"
            docker image prune -f

  # ---------------------------------------------------------------------------
  # CI-Zielpfad (Captain-Go 01.08.2026): DER DEPLOY IST EIN COMMIT.
  #
  # Nach gruenen Image-Builds schreibt die Pipeline den frischen Bild-Stand
  # selbst in das gitops-Repo fort: der `images:`-Block in
  # apps/voltpilot/overlays/prod/kustomization.yaml wird auf ${GITHUB_SHA}
  # gesetzt und committet. Damit ist jederzeit per `git log` beantwortbar, was
  # im Cluster laufen soll, und ein Rollback ist ein `git revert`.
  # Bewusst OHNE `:latest` und ohne Argo-CD-Image-Updater (kein Registry-
  # Polling, kein weiterer Controller; Begruendung im gitops-README,
  # "CI/CD-Zielpfad").
  #
  # Der Bump landet NUR IM GIT. Alle Argo-Applications ausser der Root-App
  # stehen in der Probe-Phase auf MANUELLEM Sync - der Cluster zieht den neuen
  # Stand also erst beim naechsten (menschlich ausgeloesten) Sync. Das ist so
  # gewollt: waehrend Cluster und VM parallel laufen, entscheidet ein Mensch,
  # wann der Cluster nachzieht (gitops README, "Sync-Policy: heute manuell").
  #
  # `needs: build` - NICHT der VM-Deploy: beide sind unabhaengige Abnehmer
  # derselben Images, und ein Huster auf der VM darf den Git-Bump nicht
  # blockieren (und umgekehrt). Der VM-Deploy bleibt unveraendert und faellt
  # erst beim Cutover weg; bis dahin bleiben beide Welten aktuell.
  # ---------------------------------------------------------------------------
  gitops-tag-bump:
    name: Bump gitops image tags
    needs: build
    runs-on: ubuntu-latest-mo
    timeout-minutes: 10

    env:
      # Host = wofuer die Zugangsdaten gelten, REMOTE = was geklont wird.
      # Getrennt, damit das Skript unveraendert gegen ein lokales Repo laufen
      # kann - genau das tut tools/deploy/test-gitops-bump-workflow.sh.
      GITOPS_HOST: git.tecmaxx.de
      GITOPS_REMOTE: https://git.tecmaxx.de/mamotec/gitops.git
      GITOPS_BRANCH: main
      # Die EINE Datei, die dieser Job anfassen darf.
      OVERLAY: apps/voltpilot/overlays/prod/kustomization.yaml

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Bump gitops prod overlay and push
        env:
          # Eigenes CI-Token mit repository:write NUR auf das gitops-Repo -
          # niemals ein persoenliches Token. Anlegen: siehe docs/deploy.md,
          # "gitops-Tag-Bump (CI-Zielpfad)". Ist das Secret nicht gesetzt,
          # UEBERSPRINGT dieser Schritt sauber (gruen) statt die Pipeline rot
          # zu faerben - so kann der Zielpfad vor dem Secret gemerged werden.
          GITOPS_PUSH_TOKEN: ${{ secrets.GITOPS_PUSH_TOKEN }}
          # Optional. Forgejo authentifiziert ueber das Token (Passwortfeld);
          # der Benutzername ist dabei egal, deshalb reicht der Default.
          GITOPS_PUSH_USER: ${{ secrets.GITOPS_PUSH_USER }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail

          if [ -z "${GITOPS_PUSH_TOKEN:-}" ]; then
            echo "GITOPS_PUSH_TOKEN ist nicht gesetzt - der gitops-Tag-Bump wird UEBERSPRUNGEN."
            echo "Es wurde nichts geklont, nichts committet, nichts gepusht."
            echo "Anlegen: Forgejo -> voltpilot-ems -> Settings -> Actions -> Secrets (docs/deploy.md)."
            {
              echo "### gitops-Tag-Bump uebersprungen"
              echo ""
              echo "\`GITOPS_PUSH_TOKEN\` ist nicht gesetzt - das gitops-Repo wurde NICHT veraendert."
              echo "Der prod-Overlay muss bis dahin von Hand auf \`${SHA}\` gesetzt werden."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi

          BUMP="$PWD/tools/deploy/gitops-image-bump.sh"
          WORK="$(mktemp -d)"
          CREDS="$WORK/.git-credentials"
          trap 'rm -rf "$WORK"' EXIT

          # Das Token landet WEDER in der Remote-URL (die bliebe in .git/config
          # und in jeder Fehlermeldung stehen) NOCH in einer Kommandozeile: es
          # geht ueber eine 0600-Credential-Datei, die mit $WORK stirbt. Der
          # Helper wird nur fuer den clone mitgegeben und danach LOKAL im
          # Checkout gesetzt - die globale git-Konfiguration des Runners bleibt
          # unberuehrt.
          ( umask 077; printf 'https://%s:%s@%s\n' \
              "${GITOPS_PUSH_USER:-ci}" "$GITOPS_PUSH_TOKEN" "$GITOPS_HOST" > "$CREDS" )

          git -c "credential.helper=store --file=$CREDS" \
            clone --depth 1 --branch "$GITOPS_BRANCH" "$GITOPS_REMOTE" "$WORK/gitops"
          cd "$WORK/gitops"
          git config "credential.helper" "store --file=$CREDS"
          git config user.name  "VoltPilot CI"
          git config user.email "ci@voltpilot.de"

          # Push-Schleife gegen das Rennen zweier parallel fertig werdender
          # Laeufe. Bewusst NICHT `pull --rebase`: beide Laeufe fassen exakt
          # dieselben newTag-Zeilen an, ein Rebase kollidiert also genau dort.
          # Stattdessen wird bei jedem Versuch vom FRISCHEN origin/main neu
          # abgeleitet - der Edit ist idempotent, also ist das konfliktfrei
          # per Konstruktion und endet an derselben Stelle: main zeigt auf den
          # sha des zuletzt fertig gewordenen Laufs.
          attempt=1
          while [ "$attempt" -le 3 ]; do
            git fetch --depth 1 origin "$GITOPS_BRANCH"
            git reset --hard "origin/$GITOPS_BRANCH"

            set +e
            sh "$BUMP" "$OVERLAY" "$SHA"
            rc=$?
            set -e
            case "$rc" in
              0) ;;
              2) echo "gitops/$GITOPS_BRANCH steht bereits auf $SHA - kein Leer-Commit."
                 echo "### gitops-Tag-Bump: nichts zu tun (bereits \`${SHA}\`)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
                 exit 0 ;;
              *) echo "FATAL: der Tag-Bump wurde verweigert (siehe Meldung oben) - gitops bleibt unveraendert." >&2
                 exit 1 ;;
            esac

            # Sicherheitsnetz: NUR der Overlay darf sich geaendert haben.
            dirty="$(git status --porcelain)"
            touched="$(printf '%s\n' "$dirty" | awk 'NF {print $NF}')"
            if [ "$touched" != "$OVERLAY" ]; then
              echo "FATAL: unerwartete Aenderungen im gitops-Checkout - es wird nichts gepusht:" >&2
              printf '%s\n' "$dirty" >&2
              exit 1
            fi

            git add "$OVERLAY"
            git commit -q \
              -m "ci(images): voltpilot-ems@$SHA" \
              -m "Alle Images aus dem Build von $WORKFLOW tragen denselben sha." \
              -m "Lauf: $RUN_URL"

            if git push origin "HEAD:$GITOPS_BRANCH"; then
              echo "gitops/$GITOPS_BRANCH auf $SHA gepinnt."
              {
                echo "### gitops-Tag-Bump"
                echo ""
                echo "prod-Overlay auf \`${SHA}\` gepinnt (Versuch ${attempt})."
                echo "Argo CD steht auf manuellem Sync - der Cluster zieht beim naechsten Sync nach."
              } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              exit 0
            fi

            echo "Push abgelehnt (paralleler Lauf?) - Versuch $attempt von 3, neu ableiten." >&2
            attempt=$((attempt + 1))
            sleep $((attempt * 3))
          done

          echo "FATAL: gitops-Push nach 3 Versuchen fehlgeschlagen. Die Images sind gebaut und" >&2
          echo "gepusht; nachziehen von Hand: tools/deploy/gitops-image-bump.sh <overlay> $SHA" >&2
          exit 1
