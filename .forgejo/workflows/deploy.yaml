name: Build & Deploy

# Gated push-to-deploy for the single-VPS prod stack (docker-compose.prod.yml),
# modeled on saalo's pipeline: test -> build+push every image to the Forgejo
# registry -> SSH/SCP roll-out on the VPS. Manual trigger (workflow_dispatch);
# wire it to `push` on your release branch once the runner + secrets are set.
#
# Required Forgejo Actions secrets (Repo -> Settings -> Actions -> Secrets):
#   FORGEJO_USERNAME / FORGEJO_PASSWORD  - registry login (git.tecmaxx.de)
#   DEPLOY_HOST / DEPLOY_USER / DEPLOY_PASSWORD  - the VPS SSH target
#   DOMAIN                               - public FQDN (bakes into the SPA + realm)
# See docs/deploy.md.

on:
  workflow_dispatch:

jobs:
  # Pre-deploy gate: all service tests must pass before we spend time building
  # images. A red test job stops the whole pipeline here.
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest-mo
    # Hard ceiling so a wedged suite can never block the single runner for
    # hours (job 2587 sat >2.5 h on a livelocked test before this existed).
    timeout-minutes: 45

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            type: jvm
            path: services/api
          - name: ingest
            type: jvm
            path: services/ingest
          - name: timescale-writer
            type: jvm
            path: services/timescale-writer
          - name: market-data
            type: python
            path: services/market-data
            pip_install: "-e '.[dev]'"
          # ml = xgboost/numpy so the shadow-challenger tests (test_ml.py) run
          # in the gate instead of skipping; the Ubuntu runner ships libgomp.
          - name: forecast
            type: python
            path: services/forecast
            pip_install: "-e '.[dev,ml]'"
          # solver = the HiGHS wheel (needed for the behavioral MILP tests);
          # ../forecast = the sibling path dep for the persistence fallback.
          # The gate skips @pytest.mark.slow (heavy multi-solve year chains;
          # a 3-day smoke twin stays in the default set) - run a plain
          # `pytest` locally for the full suite.
          - name: optimization
            type: python
            path: services/optimization
            pip_install: "-e '.[dev,solver]' -e ../forecast"
            pytest_args: "-m 'not slow'"
          - name: frontend
            type: frontend
            path: frontend/portal

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---- JVM services (Maven wrapper; Testcontainers tests self-skip when
      #      Docker is absent - see AGENTS.md) --------------------------------
      - name: Set up JDK 21
        if: matrix.type == 'jvm'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven test
        if: matrix.type == 'jvm'
        working-directory: ${{ matrix.path }}
        run: ./mvnw -B test

      # ---- Python services -------------------------------------------------
      - name: Set up Python
        if: matrix.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pytest
        if: matrix.type == 'python'
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.pip_install }}
          pytest ${{ matrix.pytest_args }}

      # ---- Frontend (tsc type-check + Vite build) --------------------------
      - name: Set up Node
        if: matrix.type == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build (typecheck + bundle)
        if: matrix.type == 'frontend'
        working-directory: ${{ matrix.path }}
        run: |
          npm install
          npm run build

      # CSP smoke: runs the REAL built nginx image and asserts its security
      # headers never break the silent-SSO login flow (inline scripts under
      # script-src 'self' = the 2026-07-17 prod login outage). The in-script
      # Chrome check self-skips when no browser is on the runner; the static
      # header/content checks still gate the outage class.
      - name: CSP smoke (built nginx image + silent-SSO)
        if: matrix.type == 'frontend'
        working-directory: ${{ matrix.path }}
        run: npm run test:csp

      # Cache smoke: same built image, asserts the SPA cache policy - hashed
      # /assets/* immutable, index.html + the try_files fallback revalidated
      # (no Cache-Control at all = a reload after a deploy renders the PREVIOUS
      # version, captain report 2026-07-30) - and that the security headers
      # survive on every one of those responses (nginx add_header does not
      # inherit into inner blocks).
      - name: Cache smoke (built nginx image + SPA cache policy)
        if: matrix.type == 'frontend'
        working-directory: ${{ matrix.path }}
        run: npm run test:cache

  # Build + push every deployed image in parallel. The deploy job waits for the
  # whole matrix. Tags: :latest and :${{ github.sha }} (the rollout pins the SHA).
  build:
    name: Build & Push ${{ matrix.component }}
    needs: test
    runs-on: ubuntu-latest-mo
    timeout-minutes: 60

    strategy:
      matrix:
        include:
          - component: api
            context: ./services/api
            build_args: ""
          - component: ingest
            context: ./services/ingest
            build_args: ""
          - component: timescale-writer
            context: ./services/timescale-writer
            build_args: ""
          - component: market-data
            context: ./services/market-data
            build_args: ""
          - component: forecast
            context: ./services/forecast
            build_args: ""
          # Repo-root context: the optimizer image installs services/forecast
          # alongside (see services/optimization/Dockerfile).
          - component: optimization
            context: .
            dockerfile: ./services/optimization/Dockerfile
            build_args: ""
          # flowc-serve: the cloud-side flow-graph -> flow-artifact compiler
          # sidecar the api compiles flows through during activation (E2 flowc).
          - component: flowc
            context: ./edge-app/nodered/flowc
            build_args: ""
          # Repo-root context like the optimizer: the image bakes the realm
          # import (infra/prod/keycloak) AND the login theme
          # (deploy/keycloak/themes), which live in different directories.
          # Compose still defaults to the upstream image; the k8s Deployment
          # pulls this one (deploy/keycloak/README.md). Kept in lockstep with
          # deploy-fast.yaml so both pipelines publish the same nine images.
          - component: keycloak
            context: .
            dockerfile: ./deploy/keycloak/Dockerfile
            build_args: ""
          # The SPA bakes its config at build time. VITE_API_BASE empty => the SPA
          # calls same-origin /api/... (nginx proxies it); Keycloak is served under
          # https://${DOMAIN}/auth behind the external proxy. VITE_KEYCLOAK_URL is
          # appended in the "Compose image build args" step below: the secrets
          # context is NOT available inside strategy.matrix (Forgejo resolves the
          # matrix before secrets exist and rejects the whole job), so
          # ${{ secrets.DOMAIN }} must never appear here.
          - component: frontend
            context: ./frontend/portal
            build_args: |
              VITE_API_BASE=
              VITE_KEYCLOAK_REALM=voltpilot
              VITE_KEYCLOAK_CLIENT_ID=voltpilot-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Forgejo Registry
        uses: docker/login-action@v3
        with:
          registry: git.tecmaxx.de
          username: ${{ secrets.FORGEJO_USERNAME }}
          password: ${{ secrets.FORGEJO_PASSWORD }}

      # Secrets are valid in steps but not in strategy.matrix, so the final
      # build-args list is composed here: the matrix's non-secret args plus, for
      # the frontend only, the secret-derived VITE_KEYCLOAK_URL line.
      - name: Compose image build args
        id: args
        env:
          COMPONENT: ${{ matrix.component }}
          MATRIX_BUILD_ARGS: ${{ matrix.build_args }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          {
            echo 'build_args<<VP_BUILD_ARGS_EOF'
            printf '%s\n' "$MATRIX_BUILD_ARGS"
            if [ "$COMPONENT" = "frontend" ]; then
              echo "VITE_KEYCLOAK_URL=https://${DOMAIN}/auth"
            fi
            echo 'VP_BUILD_ARGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          build-args: ${{ steps.args.outputs.build_args }}
          platforms: linux/amd64
          push: true
          cache-from: type=registry,ref=git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:buildcache
          cache-to: type=registry,ref=git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:buildcache,mode=max
          tags: |
            git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:latest
            git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:${{ github.sha }}

  # Optional smoke gate: voltpilot has no browser e2e suite yet, so it is
  # deferred (the Testcontainers integration tests in the `test` job already
  # exercise the ingest pipe + RLS + OIDC end to end). When a Playwright smoke
  # suite lands, add a `smoke` job here between `build` and `deploy` that brings
  # up the just-built images and runs it, mirroring saalo's deploy.yaml.

  deploy:
    name: Deploy on VPS
    needs: build
    runs-on: ubuntu-latest-mo
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Ship the compose file + the infra the stack bind-mounts (prod Keycloak
      # realm, prod TimescaleDB init, the MQTT ACL, the Keycloak login theme).
      # Device certs are NOT shipped - they are staged on the VPS out of band
      # (see docs/connect-a-device.md).
      - name: Copy compose + infra to VPS
        uses: https://github.com/appleboy/scp-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "docker-compose.prod.yml,infra/prod/**,infra/mqtt/acl/acl.conf,tools/pki/merge-acl-grants.sh,tools/pki/reload-broker-authz.sh,deploy/keycloak/themes/voltpilot/**"
          target: /tmp/voltpilot-deploy
          overwrite: true

      - name: Deploy via SSH
        uses: https://github.com/appleboy/ssh-action@master
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          command_timeout: 15m
          script_stop: true
          # DEPLOY_PASSWORD reaches the remote shell via `envs:` (the action
          # exports the step env vars there), so the secret never interpolates
          # into the script text and special characters can't break quoting.
          envs: DEPLOY_PASSWORD
          script: |
            set -euo pipefail

            DEPLOY_DIR=/srv/docker/voltpilot

            # Privilege helper: a root deploy user runs commands directly
            # (hosts without sudo installed); a non-root user goes through
            # `sudo -S` with the password on stdin, as before.
            priv() { if [ "$(id -u)" -eq 0 ]; then "$@"; else printf '%s\n' "$DEPLOY_PASSWORD" | sudo -S "$@"; fi; }

            # scp-action preserves the source paths under the target directory.
            priv mkdir -p "$DEPLOY_DIR/infra/prod" "$DEPLOY_DIR/infra/mqtt/acl" "$DEPLOY_DIR/tools/pki"
            priv cp /tmp/voltpilot-deploy/docker-compose.prod.yml "$DEPLOY_DIR/docker-compose.yml"
            priv cp -r /tmp/voltpilot-deploy/infra/prod/. "$DEPLOY_DIR/infra/prod/"
            priv cp /tmp/voltpilot-deploy/tools/pki/merge-acl-grants.sh /tmp/voltpilot-deploy/tools/pki/reload-broker-authz.sh "$DEPLOY_DIR/tools/pki/"
            # MQTT ACL: MERGE, never overwrite - the grants between the anchors
            # are runtime state (api enrollment issuance / voltpilot-ca.sh) and
            # a plain copy would revoke every enrolled device. Deploys before
            # the acl/ directory mount kept the file one level up - migrate its
            # grants on the first run.
            DEPLOYED_ACL="$DEPLOY_DIR/infra/mqtt/acl/acl.conf"
            [ -f "$DEPLOYED_ACL" ] || DEPLOYED_ACL="$DEPLOY_DIR/infra/mqtt/acl.conf"
            priv sh "$DEPLOY_DIR/tools/pki/merge-acl-grants.sh" \
              /tmp/voltpilot-deploy/infra/mqtt/acl/acl.conf "$DEPLOYED_ACL" /tmp/voltpilot-deploy/acl.merged
            priv cp /tmp/voltpilot-deploy/acl.merged "$DEPLOY_DIR/infra/mqtt/acl/acl.conf"
            # The broker reads the ACL as a different non-root uid: a root
            # umask (or a stray restrictive mode) must never leave the dir or
            # file unreadable, or EMQX fails boot-time config validation.
            priv chmod 755 "$DEPLOY_DIR/infra/mqtt/acl"
            priv chmod 644 "$DEPLOY_DIR/infra/mqtt/acl/acl.conf"
            # Broker cert/key permissions. The certs are staged out of band
            # (below), but scp/cp preserve their source mode, so server.key
            # commonly lands 0600 owned by the deploy user - unreadable by the
            # emqx process (a NON-root uid inside the container), which then
            # fails boot with "cannot read keyfile" (live incident 2026-07-03).
            # Enforce emqx-readable perms on every deploy so a re-staged key is
            # never hand-fixed live again (see docs/deploy.md step 3).
            if [ -d "$DEPLOY_DIR/infra/mqtt/certs" ]; then
              priv chmod 755 "$DEPLOY_DIR/infra/mqtt/certs"
              priv find "$DEPLOY_DIR/infra/mqtt/certs" -type f \
                \( -name '*.crt' -o -name '*.pem' -o -name '*.key' \) -exec chmod 644 {} +
            fi
            # VoltPilot Keycloak login theme to the compose bind-mount path
            # (./deploy/keycloak/themes/voltpilot in docker-compose.prod.yml).
            priv mkdir -p "$DEPLOY_DIR/deploy/keycloak/themes"
            priv rm -rf "$DEPLOY_DIR/deploy/keycloak/themes/voltpilot"
            priv cp -r /tmp/voltpilot-deploy/deploy/keycloak/themes/voltpilot "$DEPLOY_DIR/deploy/keycloak/themes/voltpilot"
            rm -rf /tmp/voltpilot-deploy

            echo "${{ secrets.FORGEJO_PASSWORD }}" | docker login git.tecmaxx.de -u "${{ secrets.FORGEJO_USERNAME }}" --password-stdin

            cd "$DEPLOY_DIR"
            # Preflight: MQTT_DOMAIN is REQUIRED when device enrollment is on
            # (the proxied/domain-based production model). Devices are told to
            # dial ${MQTT_DOMAIN} for mTLS MQTT, and that name must match the
            # broker server-cert SAN. An unset value silently fell back to
            # mqtt.${DOMAIN} and handed devices the wrong host live (2026-07-03),
            # so abort here with a clear message instead. A non-enrollment
            # deployment (VOLTPILOT_ENROLLMENT_ENABLED=false) is exempt.
            envval() { grep -E "^$1=" .env 2>/dev/null | tail -1 | cut -d= -f2- | sed 's/^["'"'"']//; s/["'"'"']$//'; }
            enroll="$(envval VOLTPILOT_ENROLLMENT_ENABLED)"
            case "${enroll:-true}" in
              ''|true|TRUE|True|1|yes|on)
                if [ -z "$(envval MQTT_DOMAIN)" ]; then
                  echo "FATAL: device enrollment is enabled but MQTT_DOMAIN is unset in $DEPLOY_DIR/.env." >&2
                  echo "Set MQTT_DOMAIN to the FQDN devices dial for MQTT (must match the broker server-cert SAN); see docs/deploy.md and .env.prod.example." >&2
                  exit 1
                fi ;;
            esac
            # Pin this rollout to the exact images this run built; secrets and all
            # other settings come from $DEPLOY_DIR/.env (provisioned out of band,
            # see .env.prod.example). The mTLS device certs must already be staged
            # under $DEPLOY_DIR/infra/mqtt/certs/ (docs/connect-a-device.md).
            export IMAGE_TAG="${{ github.sha }}"
            # Persist the pinned tag into .env (in place, idempotent) so a later
            # manual `docker compose up --force-recreate` on the VM recreates with
            # THESE images, not the stale :latest the .env default would otherwise
            # roll every service back to (footgun that bit the operator 2026-07-02).
            # A commit SHA has no sed-special chars; replace an existing line,
            # append only if the key is absent (matches ^IMAGE_TAG= exactly).
            if grep -qE '^IMAGE_TAG=' .env 2>/dev/null; then
              priv sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
            else
              printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" | priv tee -a .env >/dev/null
            fi
            docker compose pull
            docker compose up -d --remove-orphans
            # Keycloak keeps image + config, so `up -d` does not recreate it. In
            # `start` mode themes are cached at boot, AND served theme resources
            # are pre-gzipped into /opt/keycloak/data/tmp/kc-gzip-cache on the
            # CONTAINER filesystem - which survives a plain `restart`. So a
            # restart still serves the OLD theme css to browsers (they accept
            # gzip; only curl without Accept-Encoding sees the new file).
            # Recreating the container drops that cache. Verified on KC 26.0.5.
            docker compose up -d --force-recreate keycloak
            # Make ACL changes effective: the file authorizer compiles its rules
            # at source init and a running broker never re-reads acl.conf on its
            # own (emqx ctl conf reload does NOT do it - verified on 5.8.3).
            # Non-fatal: a still-booting broker reads the fresh file anyway.
            EMQX_EXEC="docker compose exec -T emqx" sh tools/pki/reload-broker-authz.sh \
              || echo "warn: broker authz reload failed - ACL changes apply at the next broker (re)start"
            docker image prune -f

  # Red-run notification. The gate jobs already mark the run red in Forgejo (the
  # commit status check); this makes the failing stage explicit in the summary.
  notify-failure:
    name: Notify on red gate
    needs: [test, build, deploy]
    if: failure()
    runs-on: ubuntu-latest-mo
    timeout-minutes: 10

    steps:
      - name: Summarise the failed run
        run: |
          {
            echo "## :red_circle: Deploy gate failed"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| test   | ${{ needs.test.result }} |"
            echo "| build  | ${{ needs.build.result }} |"
            echo "| deploy | ${{ needs.deploy.result }} |"
            echo ""
            echo "Commit \`${{ github.sha }}\` was NOT deployed."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy gate failed for ${{ github.sha }} - see job results above." >&2
          exit 1
