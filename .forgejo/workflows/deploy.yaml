name: Build & Deploy

# Gated pipeline: test -> build+push every image to the Forgejo registry ->
# bump the image tags in the gitops repo (Argo CD deploys from there). Manual
# trigger (workflow_dispatch); wire it to `push` on your release branch once
# the runner + secrets are set.
#
# Der SSH/SCP-Deploy auf die Prod-VM ist mit dem Cutover VM -> k3s-Cluster
# (03.08.2026) ENTFERNT: die Compose-Zwillinge auf der VM sind gestoppt, NPM
# zeigt auf den Cluster, und Argo CD deployt aus dem gitops-Repo. Ein Lauf
# haette die gestoppten VM-Dienste sonst wiederbelebt - mit einem zweiten
# Optimierer gegen dieselben Live-Anlagen. Die VM-Anleitung in docs/deploy.md
# bleibt als historische/Notfall-Referenz von Hand ausfuehrbar.
#
# Required Forgejo Actions secrets (Repo -> Settings -> Actions -> Secrets):
#   FORGEJO_USERNAME / FORGEJO_PASSWORD  - registry login (git.tecmaxx.de)
#   DOMAIN                               - public FQDN (bakes into the SPA + realm)
#   GITOPS_PUSH_TOKEN                    - OPTIONAL: repository:write nur auf
#     mamotec/gitops, fuer den Tag-Bump-Job (CI-Zielpfad). Ohne das Secret
#     ueberspringt der Job sauber, die Pipeline bleibt gruen.
# See docs/deploy.md.

on:
  workflow_dispatch:

jobs:
  # Pre-deploy gate: all service tests must pass before we spend time building
  # images. A red test job stops the whole pipeline here.
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest-mo
    # Hard ceiling so a wedged suite can never block the single runner for
    # hours (job 2587 sat >2.5 h on a livelocked test before this existed).
    timeout-minutes: 45

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            type: jvm
            path: services/api
          - name: ingest
            type: jvm
            path: services/ingest
          - name: timescale-writer
            type: jvm
            path: services/timescale-writer
          - name: market-data
            type: python
            path: services/market-data
            pip_install: "-e '.[dev]'"
          # ml = xgboost/numpy so the shadow-challenger tests (test_ml.py) run
          # in the gate instead of skipping; the Ubuntu runner ships libgomp.
          - name: forecast
            type: python
            path: services/forecast
            pip_install: "-e '.[dev,ml]'"
          # solver = the HiGHS wheel (needed for the behavioral MILP tests);
          # ../forecast = the sibling path dep for the persistence fallback.
          # The gate skips @pytest.mark.slow (heavy multi-solve year chains;
          # a 3-day smoke twin stays in the default set) - run a plain
          # `pytest` locally for the full suite.
          - name: optimization
            type: python
            path: services/optimization
            pip_install: "-e '.[dev,solver]' -e ../forecast"
            pytest_args: "-m 'not slow'"
          - name: frontend
            type: frontend
            path: frontend/portal
          # Versionierter Messpunktkatalog: komplett offline aus vendorten,
          # checksum-gepinnten Hersteller-Snapshots erzeugen und validieren.
          - name: measurement-point-catalog
            type: catalog
          # Der CI-Zielpfad prueft sich selbst: beide Docker-freien
          # Selbstchecks des gitops-Tag-Bumps (der Overlay-Edit gegen eine
          # Kopie des echten prod-Overlays, und der ECHTE Job-Schritt aus
          # beiden Workflows gegen ein lokales git-Repo). Sekunden, kein Netz.
          - name: gitops-tag-bump
            type: shell
          # Die OTA-Release-Automatik prueft sich selbst: die
          # Veroeffentlichungs-Schritte gegen einen lokalen Stub (inkl. einer
          # ECHTEN Signatur-Zeremonie mit Wegwerf-Schluesseln) und der ECHTE
          # `run:`-Text des Tag-Laufs. Ohne Forgejo, ohne Portal, ohne Docker.
          - name: ota-release
            type: shell

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---- JVM services (Maven wrapper; Testcontainers tests self-skip when
      #      Docker is absent - see AGENTS.md) --------------------------------
      - name: Set up JDK 21
        if: matrix.type == 'jvm'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven test
        if: matrix.type == 'jvm'
        working-directory: ${{ matrix.path }}
        run: ./mvnw -B test

      # ---- Python services -------------------------------------------------
      - name: Set up Python
        if: matrix.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pytest
        if: matrix.type == 'python'
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.pip_install }}
          pytest ${{ matrix.pytest_args }}

      - name: Measurement-point catalog checks
        if: matrix.type == 'catalog'
        run: |
          python3 catalog/measurement-points/tools/update_deye_key_lock.py --check
          python3 catalog/measurement-points/tools/extract_shelly.py --check
          python3 catalog/measurement-points/tools/generate.py --check
          python3 catalog/measurement-points/tools/validate.py
          python3 -m unittest discover -s catalog/measurement-points/tests -p 'test_*.py'

      # ---- Frontend (tsc type-check + Vite build) --------------------------
      - name: Set up Node
        if: matrix.type == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build (typecheck + bundle)
        if: matrix.type == 'frontend'
        working-directory: ${{ matrix.path }}
        run: |
          npm install
          npm run build

      # CSP smoke: runs the REAL built nginx image and asserts its security
      # headers never break the silent-SSO login flow (inline scripts under
      # script-src 'self' = the 2026-07-17 prod login outage). The in-script
      # Chrome check self-skips when no browser is on the runner; the static
      # header/content checks still gate the outage class.
      - name: CSP smoke (built nginx image + silent-SSO)
        if: matrix.type == 'frontend'
        working-directory: ${{ matrix.path }}
        run: npm run test:csp

      # Cache smoke: same built image, asserts the SPA cache policy - hashed
      # /assets/* immutable, index.html + the try_files fallback revalidated
      # (no Cache-Control at all = a reload after a deploy renders the PREVIOUS
      # version, captain report 2026-07-30) - and that the security headers
      # survive on every one of those responses (nginx add_header does not
      # inherit into inner blocks).
      - name: Cache smoke (built nginx image + SPA cache policy)
        if: matrix.type == 'frontend'
        working-directory: ${{ matrix.path }}
        run: npm run test:cache

      # ---- Repo-Werkzeuge (Shell) -----------------------------------------
      # PyYAML, weil test-gitops-bump-workflow.sh den echten `run:`-Text des
      # Tag-Bump-Schritts AUS den Workflow-Dateien liest und ihn ausfuehrt.
      - name: Set up Python (PyYAML)
        if: matrix.type == 'shell'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: gitops tag-bump self-checks
        if: matrix.name == 'gitops-tag-bump'
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          bash tools/deploy/test-gitops-image-bump.sh
          bash tools/deploy/test-gitops-bump-workflow.sh

      # Go, damit die ECHTE Zeremonie im Selbsttest wirklich laeuft (ohne go
      # ueberspringt er sie sauber - im Gate wollen wir sie aber haben).
      - name: Set up Go
        if: matrix.name == 'ota-release'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: OTA release self-checks
        if: matrix.name == 'ota-release'
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          bash tools/ota/test-release-publish.sh
          bash tools/ota/test-release-workflow.sh

  # Build + push every deployed image in parallel. The tag-bump job waits for
  # the whole matrix. Tags: :latest and :${{ github.sha }} (the gitops overlay
  # pins the SHA).
  build:
    name: Build & Push ${{ matrix.component }}
    needs: test
    runs-on: ubuntu-latest-mo
    timeout-minutes: 60

    strategy:
      matrix:
        include:
          - component: api
            context: ./services/api
            build_args: ""
          - component: ingest
            context: ./services/ingest
            build_args: ""
          - component: timescale-writer
            context: ./services/timescale-writer
            build_args: ""
          - component: market-data
            context: ./services/market-data
            build_args: ""
          - component: forecast
            context: ./services/forecast
            build_args: ""
          # Repo-root context: the optimizer image installs services/forecast
          # alongside (see services/optimization/Dockerfile).
          - component: optimization
            context: .
            dockerfile: ./services/optimization/Dockerfile
            build_args: ""
          # flowc-serve: the cloud-side flow-graph -> flow-artifact compiler
          # sidecar the api compiles flows through during activation (E2 flowc).
          - component: flowc
            context: ./edge-app/nodered/flowc
            build_args: ""
          # Repo-root context like the optimizer: the image bakes the realm
          # import (infra/prod/keycloak) AND the login theme
          # (deploy/keycloak/themes), which live in different directories.
          # Compose still defaults to the upstream image; the k8s Deployment
          # pulls this one (deploy/keycloak/README.md). Kept in lockstep with
          # deploy-fast.yaml so both pipelines publish the same nine images.
          - component: keycloak
            context: .
            dockerfile: ./deploy/keycloak/Dockerfile
            build_args: ""
          # The SPA bakes its config at build time. VITE_API_BASE empty => the SPA
          # calls same-origin /api/... (nginx proxies it); Keycloak is served under
          # https://${DOMAIN}/auth behind the external proxy. VITE_KEYCLOAK_URL is
          # appended in the "Compose image build args" step below: the secrets
          # context is NOT available inside strategy.matrix (Forgejo resolves the
          # matrix before secrets exist and rejects the whole job), so
          # ${{ secrets.DOMAIN }} must never appear here.
          - component: frontend
            context: ./frontend/portal
            build_args: |
              VITE_API_BASE=
              VITE_KEYCLOAK_REALM=voltpilot
              VITE_KEYCLOAK_CLIENT_ID=voltpilot-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Forgejo Registry
        uses: docker/login-action@v3
        with:
          registry: git.tecmaxx.de
          username: ${{ secrets.FORGEJO_USERNAME }}
          password: ${{ secrets.FORGEJO_PASSWORD }}

      # Secrets are valid in steps but not in strategy.matrix, so the final
      # build-args list is composed here: the matrix's non-secret args plus, for
      # the frontend only, the secret-derived VITE_KEYCLOAK_URL line.
      - name: Compose image build args
        id: args
        env:
          COMPONENT: ${{ matrix.component }}
          MATRIX_BUILD_ARGS: ${{ matrix.build_args }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          {
            echo 'build_args<<VP_BUILD_ARGS_EOF'
            printf '%s\n' "$MATRIX_BUILD_ARGS"
            if [ "$COMPONENT" = "frontend" ]; then
              echo "VITE_KEYCLOAK_URL=https://${DOMAIN}/auth"
            fi
            echo 'VP_BUILD_ARGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          build-args: ${{ steps.args.outputs.build_args }}
          platforms: linux/amd64
          push: true
          cache-from: type=registry,ref=git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:buildcache
          cache-to: type=registry,ref=git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:buildcache,mode=max
          tags: |
            git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:latest
            git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # CI-Zielpfad (Captain-Go 01.08.2026): DER DEPLOY IST EIN COMMIT.
  #
  # Nach gruenen Image-Builds schreibt die Pipeline den frischen Bild-Stand
  # selbst in das gitops-Repo fort: der `images:`-Block in
  # apps/voltpilot/overlays/prod/kustomization.yaml wird auf ${GITHUB_SHA}
  # gesetzt und committet. Damit ist jederzeit per `git log` beantwortbar, was
  # im Cluster laufen soll, und ein Rollback ist ein `git revert`.
  # Bewusst OHNE `:latest` und ohne Argo-CD-Image-Updater (kein Registry-
  # Polling, kein weiterer Controller; Begruendung im gitops-README,
  # "CI/CD-Zielpfad").
  #
  # Der Bump landet NUR IM GIT. Alle Argo-Applications ausser der Root-App
  # stehen auf MANUELLEM Sync - der Cluster zieht den neuen Stand also erst
  # beim naechsten (menschlich ausgeloesten) Sync (gitops README,
  # "Sync-Policy: heute manuell").
  #
  # Seit dem Cutover (03.08.2026) ist dieser Job der EINZIGE Abnehmer der
  # Builds: der VM-Deploy-Job ist entfernt, weil er die gestoppten
  # Compose-Zwillinge auf der Prod-VM wiederbelebt haette.
  # ---------------------------------------------------------------------------
  gitops-tag-bump:
    name: Bump gitops image tags
    needs: build
    runs-on: ubuntu-latest-mo
    timeout-minutes: 10

    env:
      # Host = wofuer die Zugangsdaten gelten, REMOTE = was geklont wird.
      # Getrennt, damit das Skript unveraendert gegen ein lokales Repo laufen
      # kann - genau das tut tools/deploy/test-gitops-bump-workflow.sh.
      GITOPS_HOST: git.tecmaxx.de
      GITOPS_REMOTE: https://git.tecmaxx.de/mamotec/gitops.git
      GITOPS_BRANCH: main
      # Die EINE Datei, die dieser Job anfassen darf.
      OVERLAY: apps/voltpilot/overlays/prod/kustomization.yaml

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Bump gitops prod overlay and push
        env:
          # Eigenes CI-Token mit repository:write NUR auf das gitops-Repo -
          # niemals ein persoenliches Token. Anlegen: siehe docs/deploy.md,
          # "gitops-Tag-Bump (CI-Zielpfad)". Ist das Secret nicht gesetzt,
          # UEBERSPRINGT dieser Schritt sauber (gruen) statt die Pipeline rot
          # zu faerben - so kann der Zielpfad vor dem Secret gemerged werden.
          GITOPS_PUSH_TOKEN: ${{ secrets.GITOPS_PUSH_TOKEN }}
          # Optional. Forgejo authentifiziert ueber das Token (Passwortfeld);
          # der Benutzername ist dabei egal, deshalb reicht der Default.
          GITOPS_PUSH_USER: ${{ secrets.GITOPS_PUSH_USER }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail

          if [ -z "${GITOPS_PUSH_TOKEN:-}" ]; then
            echo "GITOPS_PUSH_TOKEN ist nicht gesetzt - der gitops-Tag-Bump wird UEBERSPRUNGEN."
            echo "Es wurde nichts geklont, nichts committet, nichts gepusht."
            echo "Anlegen: Forgejo -> voltpilot-ems -> Settings -> Actions -> Secrets (docs/deploy.md)."
            {
              echo "### gitops-Tag-Bump uebersprungen"
              echo ""
              echo "\`GITOPS_PUSH_TOKEN\` ist nicht gesetzt - das gitops-Repo wurde NICHT veraendert."
              echo "Der prod-Overlay muss bis dahin von Hand auf \`${SHA}\` gesetzt werden."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi

          BUMP="$PWD/tools/deploy/gitops-image-bump.sh"
          WORK="$(mktemp -d)"
          CREDS="$WORK/.git-credentials"
          trap 'rm -rf "$WORK"' EXIT

          # Das Token landet WEDER in der Remote-URL (die bliebe in .git/config
          # und in jeder Fehlermeldung stehen) NOCH in einer Kommandozeile: es
          # geht ueber eine 0600-Credential-Datei, die mit $WORK stirbt. Der
          # Helper wird nur fuer den clone mitgegeben und danach LOKAL im
          # Checkout gesetzt - die globale git-Konfiguration des Runners bleibt
          # unberuehrt.
          ( umask 077; printf 'https://%s:%s@%s\n' \
              "${GITOPS_PUSH_USER:-ci}" "$GITOPS_PUSH_TOKEN" "$GITOPS_HOST" > "$CREDS" )

          git -c "credential.helper=store --file=$CREDS" \
            clone --depth 1 --branch "$GITOPS_BRANCH" "$GITOPS_REMOTE" "$WORK/gitops"
          cd "$WORK/gitops"
          git config "credential.helper" "store --file=$CREDS"
          git config user.name  "VoltPilot CI"
          git config user.email "ci@voltpilot.de"

          # Push-Schleife gegen das Rennen zweier parallel fertig werdender
          # Laeufe. Bewusst NICHT `pull --rebase`: beide Laeufe fassen exakt
          # dieselben newTag-Zeilen an, ein Rebase kollidiert also genau dort.
          # Stattdessen wird bei jedem Versuch vom FRISCHEN origin/main neu
          # abgeleitet - der Edit ist idempotent, also ist das konfliktfrei
          # per Konstruktion und endet an derselben Stelle: main zeigt auf den
          # sha des zuletzt fertig gewordenen Laufs.
          attempt=1
          while [ "$attempt" -le 3 ]; do
            git fetch --depth 1 origin "$GITOPS_BRANCH"
            git reset --hard "origin/$GITOPS_BRANCH"

            set +e
            sh "$BUMP" "$OVERLAY" "$SHA"
            rc=$?
            set -e
            case "$rc" in
              0) ;;
              2) echo "gitops/$GITOPS_BRANCH steht bereits auf $SHA - kein Leer-Commit."
                 echo "### gitops-Tag-Bump: nichts zu tun (bereits \`${SHA}\`)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
                 exit 0 ;;
              *) echo "FATAL: der Tag-Bump wurde verweigert (siehe Meldung oben) - gitops bleibt unveraendert." >&2
                 exit 1 ;;
            esac

            # Sicherheitsnetz: NUR der Overlay darf sich geaendert haben.
            dirty="$(git status --porcelain)"
            touched="$(printf '%s\n' "$dirty" | awk 'NF {print $NF}')"
            if [ "$touched" != "$OVERLAY" ]; then
              echo "FATAL: unerwartete Aenderungen im gitops-Checkout - es wird nichts gepusht:" >&2
              printf '%s\n' "$dirty" >&2
              exit 1
            fi

            git add "$OVERLAY"
            git commit -q \
              -m "ci(images): voltpilot-ems@$SHA" \
              -m "Alle Images aus dem Build von $WORKFLOW tragen denselben sha." \
              -m "Lauf: $RUN_URL"

            if git push origin "HEAD:$GITOPS_BRANCH"; then
              echo "gitops/$GITOPS_BRANCH auf $SHA gepinnt."
              {
                echo "### gitops-Tag-Bump"
                echo ""
                echo "prod-Overlay auf \`${SHA}\` gepinnt (Versuch ${attempt})."
                echo "Argo CD steht auf manuellem Sync - der Cluster zieht beim naechsten Sync nach."
              } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              exit 0
            fi

            echo "Push abgelehnt (paralleler Lauf?) - Versuch $attempt von 3, neu ableiten." >&2
            attempt=$((attempt + 1))
            sleep $((attempt * 3))
          done

          echo "FATAL: gitops-Push nach 3 Versuchen fehlgeschlagen. Die Images sind gebaut und" >&2
          echo "gepusht; nachziehen von Hand: tools/deploy/gitops-image-bump.sh <overlay> $SHA" >&2
          exit 1

  # Red-run notification. The gate jobs already mark the run red in Forgejo (the
  # commit status check); this makes the failing stage explicit in the summary.
  notify-failure:
    name: Notify on red gate
    needs: [test, build, gitops-tag-bump]
    if: failure()
    runs-on: ubuntu-latest-mo
    timeout-minutes: 10

    steps:
      - name: Summarise the failed run
        run: |
          {
            echo "## :red_circle: Deploy gate failed"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| test            | ${{ needs.test.result }} |"
            echo "| build           | ${{ needs.build.result }} |"
            echo "| gitops-tag-bump | ${{ needs['gitops-tag-bump'].result }} |"
            echo ""
            echo "Commit \`${{ github.sha }}\` was NOT rolled out (gitops overlay unchanged)."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "Deploy gate failed for ${{ github.sha }} - see job results above." >&2
          exit 1
