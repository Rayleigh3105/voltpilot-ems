name: Build & Push Edge-App Images

# Builds + pushes the customer-side Edge-App images to the Forgejo registry so
# the operator can PULL them on the edge device instead of building locally
# (the edge docker-compose.yml already names these images). Manual trigger.
#
# Builds a MULTI-ARCH manifest list (linux/amd64 + linux/arm64) under each tag
# so a Raspberry Pi (arm64/v8) pulls the arm64 variant automatically. Runs on
# the amd64 runner: the core image cross-compiles (Go GOARCH from $TARGETARCH),
# and the nodered image's golang deye-build stage is cross-compiled too, so no
# arm64 emulation is needed. QEMU is set up for any residual emulated layers.
#
# Required Forgejo Actions secrets (Repo -> Settings -> Actions -> Secrets):
#   FORGEJO_USERNAME / FORGEJO_PASSWORD  - registry login (git.tecmaxx.de)
# See edge-app/DEPLOY.md.

# Ein RELEASE entsteht durch einen git-Tag `edge-JJJJ.MM.N` (Captain-Entscheid
# D5). Der Tag-Lauf baut dieselben Images (der Versionsstempel wird dann
# automatisch `<tag>-<kurzsha>`), erzeugt das Manifest, SIGNIERT es, prueft die
# Kette gegen die eingebackene Wurzel, haengt die vier Dateien als
# Release-Assets an und traegt das Release ins Portal-Register ein.
# „git tag -> fertig" (Captain-Order 04.08.2026).
#
# ⚠ DIESE AUTOMATIK REVIDIERT ENTSCHEID D3 BEWUSST: der Release-Schluessel ist
# jetzt ein heisses CI-Geheimnis. Die vier Kompensationen sind LOAD-BEARING und
# muessen alle gelten (docs/ota-signing.md §4):
#   1. Die KALTE WURZEL bleibt offline beim Owner - CI sieht sie nie. Ein
#      missbrauchter Release-Schluessel wird durch ein neues root-signiertes
#      Trust-Set entwertet (§7.1), ohne dass ein einziges Geraet angefasst wird.
#   2. Das Register-Konto darf NUR registrieren (Realm-Rolle
#      edge-release-publisher). Kein Rollout, keine Welle, kein Geraete-Ziel -
#      serverseitig erzwungen und Endpunkt fuer Endpunkt in AdminApiTest
#      nachgewiesen. Ein uebernommener Runner verunreinigt die Liste; er
#      erreicht kein Geraet.
#   3. Der Mensch-Akt bleibt Mensch-Akt: „Rollout starten" ist Portal
#      (Plattform-Admin). Es gibt hier keinen Pfad dorthin.
#   4. NICHTS in einem Wirkpfad haengt an diesem Lauf (§6-Doktrin). Der Runner
#      schlaeft nachweislich ein - dann taucht das Release eben SPAETER in der
#      Liste auf; ein laufender Rollout wartet nie auf ihn. Und die Handarbeit
#      bleibt vollstaendig moeglich: dieselben Bytes entstehen lokal mit
#      demselben Befehl (`vp-ota manifest …` ist deterministisch).
#
# Fehlt eines der Geheimnisse, laeuft der Job GRUEN durch, signiert NICHTS und
# druckt die Handschritte - so ist die Automatik einschaltbar, ohne dass ein
# halb konfiguriertes Repo halb veroeffentlichte Releases erzeugt.
#
# Zusaetzliche Actions-Secrets (Repo -> Settings -> Actions -> Secrets):
#   VP_OTA_RELEASE_KEY               Inhalt von rel-<id>.key (die GEHEIME Datei)
#   VP_OTA_PUBLISHER_CLIENT_SECRET   Secret des Keycloak-Dienstkontos
#   VP_OTA_FORGEJO_TOKEN             optional; sonst FORGEJO_USERNAME/PASSWORD
# Variablen (optional): VP_OTA_PORTAL, EDGE_RELEASE_SEQ (nur als Rueckfall),
#   EDGE_MIN_FROM_SEQ, EDGE_STATE_SCHEMA, EDGE_SIGNING_KEY_ID
on:
  workflow_dispatch:
  push:
    tags:
      - 'edge-*'

jobs:
  # A tag publishes customer-side runtime code. Gate the exact packaged
  # catalog, core, Node-RED runtime and palette before any registry write; the
  # two realistic rigs then prove OCPP and the complete sim -> edge -> cloud ->
  # schedule loop. A release workflow without this dependency could otherwise
  # push an image that the regular cloud-service matrix never exercises.
  test:
    name: Edge release gate
    runs-on: ubuntu-latest-mo
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: edge-app/core/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: edge-app/nodered/vp-palette/package-lock.json

      - name: Canonical measurement catalog + packaged Edge runtime
        run: |
          python3 catalog/measurement-points/tools/update_deye_key_lock.py --check
          python3 catalog/measurement-points/tools/extract_shelly.py --check
          python3 catalog/measurement-points/tools/generate.py --check
          python3 catalog/measurement-points/tools/validate.py
          python3 -m unittest discover -s catalog/measurement-points/tests -p 'test_*.py'
          python3 catalog/measurement-points/tools/package_edge_runtime.py --check

      - name: Go core (race)
        working-directory: edge-app/core
        # Integration packages briefly reserve ephemeral listeners before the
        # real server binds them. Keep packages serial so two rigs cannot steal
        # each other's port and turn a sound release into a flaky red gate.
        run: go test -race -p 1 ./...

      - name: Node-RED runtime and drivers
        working-directory: edge-app
        run: |
          mapfile -t tests < <(find nodered -type f -name '*.test.js' \
            -not -path '*/node_modules/*' -print | sort)
          node --test "${tests[@]}"

      - name: vp-palette
        working-directory: edge-app/nodered/vp-palette
        run: |
          npm ci
          npm test

      - name: OCPP system rig
        run: bash edge-app/test/e2e-ocpp.sh

      - name: Edge compose system rig
        run: bash edge-app/test/e2e-compose.sh

  # Build + push each edge-app image in parallel. Tags: :latest and
  # :${{ github.sha }}, mirroring the deploy.yaml build-push pattern.
  build:
    name: Build & Push ${{ matrix.component }}
    needs: test
    runs-on: ubuntu-latest-mo
    # Multi-arch QEMU builds are slow but bounded; never wedge the runner.
    timeout-minutes: 90

    strategy:
      matrix:
        include:
          - component: edge-app-core
            context: ./edge-app/core
            dockerfile: ./edge-app/core/Dockerfile
          - component: edge-app-nodered
            context: ./edge-app/nodered
            dockerfile: ./edge-app/nodered/Dockerfile
          # Der OTA-Apply-Sidecar (Stufe 3). Er teilt sich den Build-Kontext mit
          # dem Kern, weil er aus DEMSELBEN Go-Modul stammt: nur so teilen
          # Sidecar und Kern `internal/otaverify` und `internal/otaapply`
          # woertlich - „unabhaengig verifizieren" heisst zwei Prozesse, nicht
          # zwei Implementierungen derselben Regel.
          #
          # Er steht bewusst NICHT in der Artefakt-Liste eines Releases (siehe
          # den manifest-Job unten): der Sidecar tauscht sich nie selbst.
          - component: edge-app-updater
            context: ./edge-app/core
            dockerfile: ./edge-app/core/Dockerfile.updater

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Forgejo Registry
        uses: docker/login-action@v3
        with:
          registry: git.tecmaxx.de
          username: ${{ secrets.FORGEJO_USERNAME }}
          password: ${{ secrets.FORGEJO_PASSWORD }}

      # Version stamp baked into each image via --build-arg VERSION: the short
      # commit SHA normally, and "<tag>-<shortsha>" when the build ref is a tag.
      # The core image compiles it into agent.Version (ldflags -X); it surfaces
      # in the :8484 dashboard + deviceInfo. The nodered image records it as an
      # OCI image label. Without this every edge image reports Version="dev".
      - name: Compute version stamp
        id: version
        run: |
          short_sha="${GITHUB_SHA::12}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}-${short_sha}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${short_sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:buildcache
          cache-to: type=registry,ref=git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:buildcache,mode=max
          tags: |
            git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:latest
            git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:${{ github.sha }}

  # Erzeugt das UNSIGNIERTE release.json fuer einen Tag-Lauf. Laeuft NUR bei
  # einem Tag und nur, wenn beide Images wirklich gebaut wurden.
  #
  # Die Digests werden bewusst NICHT aus dem Build-Job durchgereicht, sondern
  # aus der REGISTRY zurueckgelesen: die Registry ist die Wahrheit darueber,
  # was unter diesem Tag tatsaechlich liegt, und der Weg spart die
  # Artefakt-Verdrahtung ueber eine Matrix hinweg. Gepinnt wird der Digest der
  # MANIFEST-LISTE (multi-arch), also genau das, was ein Geraet zieht.
  #
  # ⚠ Der `edge-app-updater` steht mit ABSICHT NICHT im Manifest. Ein Release
  # beschreibt, was der Sidecar ANWENDET - und er wendet sich nie selbst an
  # (otaapply.UpdaterComponent laesst ihn aus der Artefakt-Liste heraus, laut
  # protokolliert). Seine eigenen Aktualisierungen sind selten, beaufsichtigt
  # und out-of-band: `docker compose up -d updater`.
  manifest:
    name: Release signieren + veroeffentlichen
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest-mo
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Die Tag-ANNOTATION ist eine Eingabe (min-from-seq, urgent,
          # Release-Notiz), und die haengt am Tag-OBJEKT - ohne die Tags im
          # Klon gaebe es sie nicht.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Login to Forgejo Registry
        uses: docker/login-action@v3
        with:
          registry: git.tecmaxx.de
          username: ${{ secrets.FORGEJO_USERNAME }}
          password: ${{ secrets.FORGEJO_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Der Digest der Manifest-Liste IST per Definition der sha256 ihrer rohen
      # Bytes - deshalb ist `--raw | sha256sum` der versionsunabhaengige Weg,
      # mit dem `--format` als schnellerer Erstversuch. Ein Ergebnis, das nicht
      # wie ein Digest aussieht, bricht den Lauf ab: ein halb geratener Pin
      # waere schlimmer als kein Manifest.
      - name: Digests der gepushten Images auflesen
        id: digests
        run: |
          set -euo pipefail
          resolve() {
            local ref="$1" d=""
            d="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$ref" 2>/dev/null || true)"
            if ! printf '%s' "$d" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              d="sha256:$(docker buildx imagetools inspect --raw "$ref" | sha256sum | cut -d' ' -f1)"
            fi
            if ! printf '%s' "$d" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "Kein Digest fuer $ref ermittelbar - Abbruch statt geratenem Pin." >&2
              exit 1
            fi
            printf '%s' "$d"
          }
          base="git.tecmaxx.de/mamotec/voltpilot-ems"
          {
            echo "core=$base/edge-app-core@$(resolve "$base/edge-app-core:${GITHUB_SHA}")"
            echo "nodered=$base/edge-app-nodered@$(resolve "$base/edge-app-nodered:${GITHUB_SHA}")"
          } >> "$GITHUB_OUTPUT"

      # Alles, was das Manifest braucht - an EINER Stelle, damit der signierte
      # und der unsignierte Pfad nachweislich dieselben Eingaben benutzen.
      #
      # Die Reihenfolge ist tragend: `release_seq` steht IM Manifest, die
      # Signatur geht ueber dessen Bytes - die Ordnung muss also VOR dem
      # Signieren feststehen. Sie kommt deshalb aus dem REGISTER
      # (GET .../edge-releases/next-seq mit dem Veroeffentlicher-Konto), nicht
      # aus einer von Hand gepflegten Repo-Variable. Traegt sich zwischen Lesen
      # und Eintragen ein zweites Release ein, scheitert die Registrierung LAUT
      # an der Monotonie-Pruefung - der Lauf wird dann mit der neuen Nummer
      # wiederholt, statt eine Reihenfolge zu verbiegen.
      - name: Release-Eingaben bestimmen
        id: inputs
        run: |
          set -euo pipefail
          . tools/ota/release-publish.sh

          ready=true
          [ -n "${VP_OTA_RELEASE_KEY:-}" ] || { echo "::notice::VP_OTA_RELEASE_KEY fehlt - es wird NICHT signiert."; ready=false; }
          [ -n "${VP_OTA_PUBLISHER_CLIENT_SECRET:-}" ] || { echo "::notice::VP_OTA_PUBLISHER_CLIENT_SECRET fehlt - es wird NICHT registriert."; ready=false; }

          portal="${VP_OTA_PORTAL:-https://portal.voltpilot.de}"
          keyfile="${RUNNER_TEMP}/vp-ota-release.key"

          if [ "$ready" = true ]; then
            # Der geheime Schluessel beruehrt nie das Arbeitsverzeichnis und nie
            # eine Kommandozeile: Datei ausserhalb des Checkouts, 0600, am Ende
            # des Jobs geschreddert.
            umask 077
            printf '%s' "$VP_OTA_RELEASE_KEY" > "$keyfile"
            chmod 600 "$keyfile"
            key_id="$(ota_key_id "$keyfile")"
            echo "::add-mask::$VP_OTA_PUBLISHER_CLIENT_SECRET"

            trust="${VP_OTA_TRUST_SET:-edge-app/ota/trust-set.json}"
            for f in "$trust" "$trust.sig"; do
              [ -f "$f" ] || { echo "::error::$f fehlt - ohne root-signiertes Trust-Set kann die Kette nicht gegengeprueft werden (edge-app/ota/README.md)."; exit 1; }
            done

            token="$(ota_token "$(ota_token_url "$portal")" \
              "${VP_OTA_PUBLISHER_CLIENT_ID:-voltpilot-release-publisher}" \
              "$VP_OTA_PUBLISHER_CLIENT_SECRET")"
            echo "::add-mask::$token"
            printf '%s' "$token" > "${RUNNER_TEMP}/vp-ota-token"
            chmod 600 "${RUNNER_TEMP}/vp-ota-token"

            read -r seq prev <<<"$(ota_next_seq "$portal" "$token")"
            echo "Register: naechste Sequenz $seq (bisher hoechste: $prev)"
          else
            # Rueckfall ohne Automatik: die von Hand gepflegte Repo-Variable.
            # Fehlt auch sie, bricht der Lauf LAUT ab, statt eine Ordnung zu
            # erfinden - eine falsche Reihenfolge ist genau der Zustand, den
            # das Register beseitigt hat.
            seq="${EDGE_RELEASE_SEQ:?weder ein Veroeffentlicher-Konto noch EDGE_RELEASE_SEQ - die Ordnung kommt aus dem Register}"
            prev=$((seq > 0 ? seq - 1 : 0))
            key_id="${EDGE_SIGNING_KEY_ID:-rel-2026-a}"
          fi

          # Die /data-Zustandsversion steht im REPO neben dem Code (sie ist eine
          # Eigenschaft des Codes), nicht in einer Repo-Variable, die niemand
          # mit einem Commit verbindet. Eine Variable darf sie noch ueberstimmen.
          state_schema="${EDGE_STATE_SCHEMA:-$(ota_state_schema edge-app/core/otastate.schema)}"

          # Die Tag-Annotation ist die einzige RELEASE-spezifische Eingabe, die
          # nicht aus dem Code oder dem Register folgt - und sie reist im Tag,
          # also im selben Objekt, das den Lauf ausgeloest hat.
          ann="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' || true)"
          min_from="$(ota_tag_directive min-from-seq "$ann")"
          [ -n "$min_from" ] || min_from="${EDGE_MIN_FROM_SEQ:-0}"
          notes="$(ota_tag_notes "$ann")"
          urgent="$(ota_tag_directive urgent "$ann")"
          downgrade="$(ota_tag_directive allow-downgrade "$ann")"

          {
            echo "ready=$ready"
            echo "seq=$seq"
            echo "prev=$prev"
            echo "key_id=$key_id"
            echo "state_schema=$state_schema"
            echo "min_from=$min_from"
            echo "notes=$notes"
            echo "urgent=$urgent"
            echo "downgrade=$downgrade"
            echo "portal=$portal"
            echo "keyfile=$keyfile"
          } >> "$GITHUB_OUTPUT"
        env:
          VP_OTA_RELEASE_KEY: ${{ secrets.VP_OTA_RELEASE_KEY }}
          VP_OTA_PUBLISHER_CLIENT_SECRET: ${{ secrets.VP_OTA_PUBLISHER_CLIENT_SECRET }}
          VP_OTA_PORTAL: ${{ vars.VP_OTA_PORTAL }}
          VP_OTA_PUBLISHER_CLIENT_ID: ${{ vars.VP_OTA_PUBLISHER_CLIENT_ID }}
          EDGE_RELEASE_SEQ: ${{ vars.EDGE_RELEASE_SEQ }}
          EDGE_MIN_FROM_SEQ: ${{ vars.EDGE_MIN_FROM_SEQ }}
          EDGE_STATE_SCHEMA: ${{ vars.EDGE_STATE_SCHEMA }}
          EDGE_SIGNING_KEY_ID: ${{ vars.EDGE_SIGNING_KEY_ID }}

      # EINE Wahrheit ueber die Manifest-Form: derselbe Befehl, den der Owner
      # lokal fuer ein handgebautes Release benutzt (und dessen Ergebnis der
      # Verifizierer des Geraets gegenliest). Die Ausgabe ist DETERMINISTISCH
      # (feste Feldreihenfolge, feste Einrueckung, genau ein abschliessender
      # Zeilenumbruch) - dieselben Eingaben ergeben byteweise dieselbe Datei,
      # lokal wie hier.
      - name: Manifest erzeugen
        working-directory: edge-app/core
        run: |
          set -euo pipefail
          args=()
          [ "${NOTES}" = "" ] || args+=(--notes "${NOTES}")
          [ "${URGENT}" = "true" ] && args+=(--urgent) || true
          [ "${DOWNGRADE}" = "true" ] && args+=(--allow-downgrade) || true
          go run ./cmd/vp-ota manifest \
            --release "${GITHUB_REF_NAME}" \
            --seq "${SEQ}" \
            --commit "${GITHUB_SHA::12}" \
            --artifact "core=${{ steps.digests.outputs.core }}" \
            --artifact "nodered=${{ steps.digests.outputs.nodered }}" \
            --min-from-seq "${MIN_FROM}" \
            --state-schema "${STATE_SCHEMA}" \
            --key-id "${SIGNING_KEY_ID}" \
            "${args[@]}" \
            --out "${GITHUB_WORKSPACE}/release.json"
        env:
          SEQ: ${{ steps.inputs.outputs.seq }}
          MIN_FROM: ${{ steps.inputs.outputs.min_from }}
          STATE_SCHEMA: ${{ steps.inputs.outputs.state_schema }}
          SIGNING_KEY_ID: ${{ steps.inputs.outputs.key_id }}
          NOTES: ${{ steps.inputs.outputs.notes }}
          URGENT: ${{ steps.inputs.outputs.urgent }}
          DOWNGRADE: ${{ steps.inputs.outputs.downgrade }}

      # ⚠ Aus einem CI-Log heraus wird NICHT kopiert: die Signatur geht ueber
      # die exakten Bytes, und ein Log kann Leerraum/Zeilenenden anfassen. Der
      # Log liefert deshalb die beiden Dinge, die man lokal NICHT wissen kann
      # (die Digests) und die PRUEFSUMME, gegen die man die lokal erzeugte
      # Datei haelt. Stimmt sie ueberein, ist die lokale Datei die richtige.
      - name: Digests + Pruefsumme ausgeben
        run: |
          set -euo pipefail
          echo "core    : ${{ steps.digests.outputs.core }}"
          echo "nodered : ${{ steps.digests.outputs.nodered }}"
          echo "sha256(release.json) = $(sha256sum "${GITHUB_WORKSPACE}/release.json" | cut -d' ' -f1)"
          echo "--- release.json (NUR zur Ansicht, nicht kopieren) ---"
          cat "${GITHUB_WORKSPACE}/release.json"

      # Bequemlichkeit, kein Wirkpfad: schlaegt die Artefakt-Ablage fehl (der
      # Runner braucht dafuer einen Artefakt-Dienst), bleibt der Job GRUEN -
      # die Pruefsumme oben genuegt, um lokal dieselbe Datei zu erzeugen.
      - name: Manifest als Artefakt ablegen (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: release-manifest-${{ github.ref_name }}
          path: release.json
          if-no-files-found: error

      # Signieren und danach mit `--root baked` GEGENPRUEFEN - also gegen exakt
      # die Wurzel, die im Image steckt. Das ist Zeichen fuer Zeichen die
      # Pruefung, die jedes Geraet durchfuehrt, nur vorgezogen vor die
      # Auslieferung: faellt sie durch, geht NICHTS hinaus (kein Asset, kein
      # Register-Eintrag) - ein Release, das die Flotte ohnehin ablehnen wuerde,
      # darf gar nicht erst entstehen.
      - name: Signieren + gegen die eingebackene Wurzel pruefen
        if: steps.inputs.outputs.ready == 'true'
        run: |
          set -euo pipefail
          . tools/ota/release-publish.sh
          ota_sign "${GITHUB_WORKSPACE}/release.json" "${{ steps.inputs.outputs.keyfile }}"

      # Erst jetzt geht etwas hinaus. Beides ist idempotent: eine vorhandene
      # Forgejo-Release wird wiederverwendet, ein gleichnamiges Asset ersetzt,
      # und eine BYTEGLEICHE Wiederholung im Register ist ein 200 statt eines
      # 409 (ein erneut gelaufener Job hinter einer erfolgreichen Registrierung
      # darf nicht rot werden). Abweichende Bytes unter derselben Version
      # bleiben ein LAUTER Fehlschlag.
      - name: Assets anhaengen + ins Register eintragen
        if: steps.inputs.outputs.ready == 'true'
        run: |
          set -euo pipefail
          . tools/ota/release-publish.sh
          VP_OTA_PORTAL_TOKEN="$(cat "${RUNNER_TEMP}/vp-ota-token")"
          export VP_OTA_PORTAL_TOKEN
          ota_publish "${GITHUB_WORKSPACE}/release.json" "${GITHUB_REF_NAME}"
        env:
          VP_OTA_PORTAL: ${{ steps.inputs.outputs.portal }}
          VP_OTA_FORGEJO_TOKEN: ${{ secrets.VP_OTA_FORGEJO_TOKEN }}
          FORGEJO_USERNAME: ${{ secrets.FORGEJO_USERNAME }}
          FORGEJO_PASSWORD: ${{ secrets.FORGEJO_PASSWORD }}

      # Der geheime Schluessel verlaesst den Runner nicht - und er bleibt auch
      # nicht liegen. `always()`, damit auch ein abgebrochener Lauf aufraeumt.
      - name: Schluessel + Token vom Runner entfernen
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/vp-ota-release.key" "${RUNNER_TEMP}/vp-ota-token" || true

      - name: Ergebnis
        run: |
          if [ "${{ steps.inputs.outputs.ready }}" = "true" ]; then
            cat <<EOF
          Release ${GITHUB_REF_NAME} ist signiert, gegen die eingebackene Wurzel
          geprueft, als Release-Asset angehaengt und im Register eingetragen
          (Stand ${{ steps.inputs.outputs.seq }}).

          Was NICHT passiert ist - und mit Absicht nie aus CI passiert:
            * kein Rollout gestartet, keine Welle freigegeben
            * keinem Geraet ein Ziel zugewiesen
          Beides ist Portal -> Plattform -> Edge-Updates (Plattform-Admin).
          EOF
          else
            cat <<'EOF'
          Es wurde NICHT signiert (Geheimnisse fehlen, siehe die Hinweise oben).
          Das Manifest ist damit noch wertlos. Weiter von Hand:
            1. release.json lokal mit denselben Digests erzeugen und die
               sha256-Pruefsumme von oben vergleichen (oder das Artefakt laden)
            2. vp-ota sign --key <release>.key --domain release --in release.json
            3. release.json + release.json.sig + trust-set.json(.sig) als
               Forgejo-Release-Assets anhaengen
            4. den ausgegebenen curl gegen /api/v1/admin/edge-releases schicken
          Anleitung: docs/ota-signing.md
          EOF
          fi
