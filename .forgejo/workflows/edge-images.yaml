name: Build & Push Edge-App Images

# Builds + pushes the customer-side Edge-App images to the Forgejo registry so
# the operator can PULL them on the edge device instead of building locally
# (the edge docker-compose.yml already names these images). Manual trigger.
#
# Builds a MULTI-ARCH manifest list (linux/amd64 + linux/arm64) under each tag
# so a Raspberry Pi (arm64/v8) pulls the arm64 variant automatically. Runs on
# the amd64 runner: the core image cross-compiles (Go GOARCH from $TARGETARCH),
# and the nodered image's golang deye-build stage is cross-compiled too, so no
# arm64 emulation is needed. QEMU is set up for any residual emulated layers.
#
# Required Forgejo Actions secrets (Repo -> Settings -> Actions -> Secrets):
#   FORGEJO_USERNAME / FORGEJO_PASSWORD  - registry login (git.tecmaxx.de)
# See edge-app/DEPLOY.md.

on:
  workflow_dispatch:

jobs:
  # Build + push each edge-app image in parallel. Tags: :latest and
  # :${{ github.sha }}, mirroring the deploy.yaml build-push pattern.
  build:
    name: Build & Push ${{ matrix.component }}
    runs-on: ubuntu-latest-mo
    # Multi-arch QEMU builds are slow but bounded; never wedge the runner.
    timeout-minutes: 90

    strategy:
      matrix:
        include:
          - component: edge-app-core
            context: ./edge-app/core
          - component: edge-app-nodered
            context: ./edge-app/nodered

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Forgejo Registry
        uses: docker/login-action@v3
        with:
          registry: git.tecmaxx.de
          username: ${{ secrets.FORGEJO_USERNAME }}
          password: ${{ secrets.FORGEJO_PASSWORD }}

      # Version stamp baked into each image via --build-arg VERSION: the short
      # commit SHA normally, and "<tag>-<shortsha>" when the build ref is a tag.
      # The core image compiles it into agent.Version (ldflags -X); it surfaces
      # in the :8484 dashboard + deviceInfo. The nodered image records it as an
      # OCI image label. Without this every edge image reports Version="dev".
      - name: Compute version stamp
        id: version
        run: |
          short_sha="${GITHUB_SHA::12}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}-${short_sha}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${short_sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:buildcache
          cache-to: type=registry,ref=git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:buildcache,mode=max
          tags: |
            git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:latest
            git.tecmaxx.de/mamotec/voltpilot-ems/${{ matrix.component }}:${{ github.sha }}
