# Voltpilot portal - production nginx (single public HTTP entry point).
# TLS is terminated by an EXTERNAL reverse proxy (Caddy on another host) that
# forwards all traffic for ${DOMAIN} to this container on plain HTTP. This nginx
# serves the built SPA and reverse-proxies the two internal backends so nothing
# else is published:
#   /api/  -> api      (Spring Boot portal API, container port 8090; paths are
#                       already /api/v1/... so the prefix is preserved)
#   /auth/ -> keycloak (served under the /auth relative path, KC_HTTP_RELATIVE_PATH)
# Mirrors saalo/frontend/nginx.conf.

# Response compression (audit vp-portal-perf-a4, finding B3). Payloads here are
# 79-93 % compressible (telemetry 160 KB->14 KB, Fahrplan 47 KB->3.3 KB,
# history-year 69 KB->4.7 KB) and every 30 s poll re-sends them uncompressed
# over the DACH field's mobile/remote links. This is the SINGLE web entry point,
# so one gzip block here covers the SPA assets, the proxied API (/api ->
# api:8090) AND Keycloak (/auth). `gzip_proxied any` is load-bearing: nginx does
# NOT compress upstream responses by default, so without it /api + /auth would
# stay uncompressed even with gzip on. An upstream that already sent
# Content-Encoding (the api also enables server.compression) is passed through
# untouched, never double-encoded. text/html is always compressed once gzip is
# on (it is the one type in the built-in gzip_types); the list below adds the
# JSON/JS/CSS/SVG the portal actually ships. min_length skips tiny payloads
# where the gzip header would cost more than it saves.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/json
    application/javascript
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/plain;

# Trust the external TLS-terminating proxy's scheme; default to https because TLS
# is terminated upstream (the /auth -> Keycloak route relies on this being https).
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      https;
}

# SPA cache policy (real symptom: after a deploy a plain reload rendered the
# PREVIOUS version's layout). Without an explicit Cache-Control nginx sends only
# Last-Modified/ETag, and the browser then applies HEURISTIC freshness: it keeps
# reusing a cached index.html WITHOUT revalidating, and that stale document
# references the old hashed bundles - which are still in the cache too. Result:
# the whole old application, though the server has long been serving the new one.
#
#   /assets/*  - Vite emits content-hashed filenames there (index-<hash>.js/.css,
#                and hashed images/fonts), so a change ALWAYS changes the URL:
#                cache forever, never revalidate.
#   everything else (index.html via the SPA fallback, favicon.svg,
#                silent-check-sso.html/.js - unhashed by design) - "no-cache":
#                the browser may store it but MUST revalidate every time, so it
#                still gets a cheap 304 when nothing changed. Deliberately NOT
#                "no-store", which would forbid even that conditional request.
#
# THE add_header TRAP, solved deliberately: nginx does NOT inherit add_header
# from an outer block once an inner block declares its own add_header - a nested
# `location /assets/` for the cache header would therefore SILENTLY DROP the CSP
# and the other security headers below. So the policy is a per-request VARIABLE
# consumed by a single add_header inside the one SPA location: one place, one set
# of headers, no duplication that could drift apart. ($uri is the post-try_files
# path, so the SPA fallback is evaluated as /index.html - also "no-cache".)
map $uri $vp_cache_control {
    default              "no-cache";
    ~^/assets/           "public, max-age=31536000, immutable";
}

# The CSP exists ONCE, as a constant map (source string deliberately empty ->
# always the default). Three locations serve it (the SPA, the hashed assets,
# the asset 404 below) and nginx's non-inheriting add_header would otherwise
# force three verbatim copies of this long string - the smoke tests only check
# per-response PRESENCE, so a stale copy would drift silently. Extending the
# allowlist HERE reaches every location.
map '' $vp_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' https://geocoding-api.open-meteo.com; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Probe endpoint (docs/k8s-readiness.md). The SPA location would answer 200
    # for any path via try_files, so a probe pointed at "/" would ship the whole
    # index.html on every check and could not be told apart from a wrong route.
    # This one is cheap, unlogged, and deliberately says nothing about the
    # backends: nginx is ready when it can serve the SPA - /api and /auth have
    # their own probes on their own pods.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed bundles: a VANISHED asset is a hard 404, never the SPA fallback.
    # Real defect (live-measured 2026-08-04): after a deploy the old hashed
    # bundles are gone from the image, and the fallback answered them with
    # 200 + index.html AS text/html - Cloudflare then cached that HTML under
    # the .js URL and stamped its default browser TTL (4 h) onto it, so stale
    # tabs got "MIME type text/html" module errors instead of a clean failure
    # and the poisoned URL stayed wrong for hours. try_files sends misses to
    # the named location below so the 404 NEVER carries the immutable header
    # of the hit case - a deploy race (new index.html, old pod) would
    # otherwise let caches pin the 404 for a year.
    location /assets/ {
        try_files $uri @assets_missing;

        add_header Content-Security-Policy $vp_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # Only existing bundles reach this add_header (misses left via
        # try_files above), so the map always yields the immutable policy here.
        add_header Cache-Control $vp_cache_control always;
    }

    # The asset miss: 404 with the same security-header set and an explicit
    # no-cache, so neither a browser nor a CDN holds on to the miss.
    location @assets_missing {
        add_header Content-Security-Policy $vp_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
        return 404;
    }

    # SPA: every unknown route falls back to index.html; assets are served directly.
    #
    # Security headers (S4): the ROPC auto-login keeps tokens (incl. the refresh
    # token) in sessionStorage, so a future XSS would be full session theft - the
    # CSP is the mitigation layer. Scoped to the SPA location only: /api is JSON
    # (Spring Security sets its own headers) and /auth pages are Keycloak's to
    # govern (our CSP would break its login theme). Allowlist rationale - each
    # entry is a real dependency of the built SPA, nothing else:
    #   style-src  'unsafe-inline' (ECharts tooltips inject style="" via
    #              innerHTML; scripts stay strictly 'self') + fonts.googleapis.com
    #              (Inter/Inter Tight via CSS @import in the design-system tokens)
    #   font-src   fonts.gstatic.com (the font files behind that CSS)
    #   img-src    data: + *.tile.openstreetmap.org (Leaflet site-location map)
    #   connect-src geocoding-api.open-meteo.com (keyless address search in the
    #              onboarding flow); the API + Keycloak are same-origin ('self')
    #   frame-src/frame-ancestors 'self' (NOT 'none': keycloak-js silent SSO
    #              frames our own /silent-check-sso.html; foreign framing -
    #              clickjacking - stays blocked)
    location / {
        try_files $uri $uri/ /index.html;

        add_header Content-Security-Policy $vp_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # See the $vp_cache_control map above (hashed assets immutable, HTML
        # revalidated). Kept in THIS location together with the security headers
        # so nginx's non-inheriting add_header can never strip them.
        add_header Cache-Control $vp_cache_control always;
    }

    # Portal API. The SPA calls same-origin /api/v1/... (VITE_API_BASE is empty in
    # the prod build), so no trailing URI on proxy_pass keeps the /api prefix.
    location /api/ {
        proxy_pass http://api:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Keycloak served under /auth (KC_HTTP_RELATIVE_PATH=/auth). No trailing URI on
    # proxy_pass, so the /auth/ prefix is preserved. Only used behind the external
    # proxy in production; unused in local dev (the SPA hits Keycloak directly).
    location /auth/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}
