<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover ist die Voraussetzung dafuer, dass `env(safe-area-inset-*)`
      ueberhaupt einen Wert liefert (Mobil-Umbau Stufe 1). Ohne sie saesse die
      Bottom-Bar als installierte Web-App im iPhone-Home-Indicator, obwohl das
      Polster im CSS laengst steht.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Favicon: die gelieferten Marken-Originale, byte-genau eingecheckt (nicht
      generiert). Moderne Browser nehmen das SVG, aeltere die 96er-PNG, und
      `/favicon.ico` bedient jedes Tool, das die Wurzel blind abfragt.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <!--
      App-Huelle (PWA). Mehr braucht es nicht, damit das Portal auf dem
      Startbildschirm landet und dort im Vollbild startet:

      - `manifest` traegt Name, Icons, `display: standalone` und `start_url: /`.
      - `apple-touch-icon` ist der einzige Weg, dem iPhone ein Icon zu nennen -
        es liest das Manifest dafuer nicht.
      - `theme-color` faerbt die System-Leiste. #FFFFFF ist KEINE Willkuer: die
        Kopfzeile der App ist `--vp-surface` (weiss), eine andere Farbe hier
        erzeugte eine sichtbare Kante ueber ihr.
      - `apple-mobile-web-app-status-bar-style: default` (schwarze Schrift auf
        hellem Grund) ist die einzige richtige Wahl, solange NIRGENDS im CSS ein
        `env(safe-area-inset-top)` steht: `black-translucent` schoebe den Inhalt
        unter die Statusleiste, und die 68-px-Kopfzeile hat dafuer kein Polster.
        Wer eines einbaut, darf diese Zeile neu bewerten.

      Die Icons sind die gelieferten Marken-Originale (favicon.svg/.ico,
      favicon-96x96.png, icons/*.png) - byte-genau eingecheckt, nicht generiert.
      Wer die Marke aendert, ersetzt diese Dateien und hebt `SW_VERSION` in
      `public/sw.js` (die Icons liegen im Vorrat des Service Workers).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VoltPilot" />
    <title>VoltPilot EMS</title>
    <!--
      KEIN `<link rel="preconnect">` - und das ist eine gemessene Entscheidung,
      kein Versaeumnis (Perf-Review `vp-cockpit-perf-p7` §3 A4).

      Ein Preconnect kann nur eine FREMDE Origin frueher aufbauen. Auf dem
      Boot-Pfad gibt es in der Produktion keine mehr:

      - **API und Keycloak sind SAME-ORIGIN.** Der Bau setzt `VITE_API_BASE=""`
        (also `/api/v1/...`) und `VITE_KEYCLOAK_URL=https://${DOMAIN}/auth`
        (`docker-compose.prod.yml`); beide laufen ueber die nginx dieses Images.
        Ein Preconnect auf die eigene Origin ist per Definition wirkungslos -
        die Verbindung, die dieses Dokument geholt hat, ist dieselbe.
      - **Die Schriften kommen seit dem Selbst-Hosten aus `/assets`**
        (`designsystem/tokens/fonts.css`) - `fonts.googleapis.com` und
        `fonts.gstatic.com` sind samt ihrer CSP-Eintraege entfallen.
      - Alles Uebrige ist NICHT der Boot: die OSM-Kacheln haengen an Leaflet
        (nachgeladen), die Adress-Suche `geocoding-api.open-meteo.com` am
        Anlege-Assistenten.

      Wer hier eine fremde Origin einfuehrt (ein CDN, ein Karten-Host, eine
      getrennte Auth-Domain), traegt ihren Preconnect NACH - und erweitert im
      selben Zug die CSP-Allowlist in `frontend/portal/nginx.conf`.
    -->
    <!--
      Sofort-Skelett gegen Chromes Paint-Holding (2026-08-01).
      Beim Reload haelt Chrome das ALTE Bild, bis das neue Dokument ERSTMALS
      zeichnet. Vorher zeichnete das Portal erst nach JS-Download + React-Mount
      + Keycloak-Check - der Captain sah nach jedem Deploy 2-3 s die eingefrorene
      alte Ansicht. Dieses Skelett zeichnet, sobald das Stylesheet da ist, also
      lange bevor die App laeuft.

      Regeln (bitte einhalten):
      - Nur INLINE: kein externes Asset, keine Schrift-Datei, kein Bild. Damit
        bleibt index.html no-cache-tauglich und braucht keinen Hash. Die echte
        Buehne zeigt die Wortmarke als PNG - hier steht ihre Textfassung
        (Blitz in --vp-primary #95B9FF + schwarzer Schriftzug, die zwei Farben
        der Datei), weil ein Bild-Request genau den Roundtrip kostete, den das
        Skelett vermeidet.
      - Farben sind aus designsystem/tokens/colors.css HART einkopiert
        (--vp-grad-hero, --vp-surface, --vp-border, --vp-action, --vp-primary) -
        die Tokens selbst kommen erst mit dem Stylesheet.
      - Es liegt als position:fixed-Overlay ueber #root, kann also nie einen
        Layout-Sprung ausloesen; BootErrorBoundary.componentDidMount entfernt es
        in DEMSELBEN Commit, in dem React das erste Bild schreibt (kein Flackern).
      - Optisch die Vorwegnahme von <BootSplash>/<AuthScreen> in ihrer NEUEN
        Fassung: Wortmarke auf WEISS, der Marken-Verlauf nur als 3-px-Streifen
        oben, rechts die helle Formularseite mit Spinner. Die Umschaltbreite
        900 px ist dieselbe wie die Container-Query von `.vp-auth` - wer eine
        aendert, aendert beide (sonst blitzt beim Start die falsche Aufteilung).
    -->
    <style>
      #vp-boot-skeleton {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        background: #ffffff;
      }
      #vp-boot-skeleton .vp-bs-strip {
        height: 3px;
        flex: none;
        background: linear-gradient(135deg, #95b9ff 0%, #7ba3f7 50%, #5a8de8 100%);
      }
      #vp-boot-skeleton .vp-bs-split {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #vp-boot-skeleton .vp-bs-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 20px 20px 0;
      }
      #vp-boot-skeleton .vp-bs-brand svg {
        display: block;
        width: 22px;
        height: 22px;
        flex: none;
      }
      #vp-boot-skeleton .vp-bs-word {
        font-family:
          'Inter Tight', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1;
        color: #000000;
      }
      #vp-boot-skeleton .vp-bs-panel {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 20px 28px;
      }
      #vp-boot-skeleton .vp-bs-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid #e9ecef;
        border-top-color: #2c5282;
        animation: vp-bs-spin 0.9s linear infinite;
      }
      @keyframes vp-bs-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /*
        Das Ausblenden (Bewegungs-Programm P4, Konzept
        `data/vp-motion-konzept-m1/report.md` §6 Zeile "App-Start").
        Frueher wurde das Skelett hart entfernt - Skelett und Cockpit lagen in
        DEMSELBEN Frame uebereinander, der Wechsel war ein Schnitt. Jetzt
        blendet es ueber dem schon fertigen ersten Bild aus.

        ⚠ WARUM DIE REGEL HIER STEHT UND NICHT IN src/index.css: dieses
          Skelett lebt VOR dem Buendel. Das Buendel ist beim Ausblenden zwar
          laengst da (React hat gerendert), aber die Regel muss auch dann
          greifen, wenn es das NICHT ist - deshalb liest sie die Tokens nur
          MIT Rueckfall. Die Zahlen sind die der Familie
          (`--vp-motion-exit` 160 ms, `--vp-ease-in`); wer sie dort aendert,
          aendert hier den Rueckfall mit.

        ⚠ UNTER REDUZIERTER BEWEGUNG steht das Token auf 0 ms (der EINE
          Schalter `--vp-motion-scale`), der Uebergang ist dann von selbst
          ein Schnitt - und `removeBootSkeleton` wartet gar nicht erst.
      */
      #vp-boot-skeleton.vp-bs-leaving {
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--vp-motion-exit, 160ms)
          var(--vp-ease-in, cubic-bezier(0.4, 0, 1, 1));
      }
      /* Breite Fassung: Marke links, Formularseite rechts - wie `.vp-auth`. */
      @media (min-width: 900px) {
        #vp-boot-skeleton .vp-bs-split {
          flex-direction: row;
          align-items: stretch;
        }
        #vp-boot-skeleton .vp-bs-brand {
          flex: 0 0 46%;
          max-width: 620px;
          align-items: flex-start;
          padding: 40px 44px;
          border-right: 1px solid #e9ecef;
        }
        #vp-boot-skeleton .vp-bs-brand svg {
          width: 28px;
          height: 28px;
        }
        #vp-boot-skeleton .vp-bs-word {
          font-size: 28px;
        }
        #vp-boot-skeleton .vp-bs-panel {
          padding: 40px 44px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #vp-boot-skeleton .vp-bs-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="vp-boot-skeleton" aria-hidden="true">
      <div class="vp-bs-strip"></div>
      <div class="vp-bs-split">
        <div class="vp-bs-brand">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"
              fill="#95b9ff"
              stroke="#95b9ff"
              stroke-width="2"
              stroke-linejoin="round"
            />
          </svg>
          <span class="vp-bs-word">VoltPilot</span>
        </div>
        <div class="vp-bs-panel"><div class="vp-bs-spinner"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
