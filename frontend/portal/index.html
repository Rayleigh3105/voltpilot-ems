<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover ist die Voraussetzung dafuer, dass `env(safe-area-inset-*)`
      ueberhaupt einen Wert liefert (Mobil-Umbau Stufe 1). Ohne sie saesse die
      Bottom-Bar als installierte Web-App im iPhone-Home-Indicator, obwohl das
      Polster im CSS laengst steht.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Favicon: die gelieferten Marken-Originale, byte-genau eingecheckt (nicht
      generiert). Moderne Browser nehmen das SVG, aeltere die 96er-PNG, und
      `/favicon.ico` bedient jedes Tool, das die Wurzel blind abfragt.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <!--
      App-Huelle (PWA). Mehr braucht es nicht, damit das Portal auf dem
      Startbildschirm landet und dort im Vollbild startet:

      - `manifest` traegt Name, Icons, `display: standalone` und `start_url: /`.
      - `apple-touch-icon` ist der einzige Weg, dem iPhone ein Icon zu nennen -
        es liest das Manifest dafuer nicht.
      - `theme-color` faerbt die System-Leiste. #FFFFFF ist KEINE Willkuer: die
        Kopfzeile der App ist `--vp-surface` (weiss), eine andere Farbe hier
        erzeugte eine sichtbare Kante ueber ihr.
      - `apple-mobile-web-app-status-bar-style: default` (schwarze Schrift auf
        hellem Grund) ist die einzige richtige Wahl, solange NIRGENDS im CSS ein
        `env(safe-area-inset-top)` steht: `black-translucent` schoebe den Inhalt
        unter die Statusleiste, und die 68-px-Kopfzeile hat dafuer kein Polster.
        Wer eines einbaut, darf diese Zeile neu bewerten.

      Die Icons sind die gelieferten Marken-Originale (favicon.svg/.ico,
      favicon-96x96.png, icons/*.png) - byte-genau eingecheckt, nicht generiert.
      Wer die Marke aendert, ersetzt diese Dateien und hebt `SW_VERSION` in
      `public/sw.js` (die Icons liegen im Vorrat des Service Workers).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VoltPilot" />
    <title>VoltPilot EMS</title>
    <!--
      KEIN `<link rel="preconnect">` - und das ist eine gemessene Entscheidung,
      kein Versaeumnis (Perf-Review `vp-cockpit-perf-p7` §3 A4).

      Ein Preconnect kann nur eine FREMDE Origin frueher aufbauen. Auf dem
      Boot-Pfad gibt es in der Produktion keine mehr:

      - **API und Keycloak sind SAME-ORIGIN.** Der Bau setzt `VITE_API_BASE=""`
        (also `/api/v1/...`) und `VITE_KEYCLOAK_URL=https://${DOMAIN}/auth`
        (`docker-compose.prod.yml`); beide laufen ueber die nginx dieses Images.
        Ein Preconnect auf die eigene Origin ist per Definition wirkungslos -
        die Verbindung, die dieses Dokument geholt hat, ist dieselbe.
      - **Die Schriften kommen seit dem Selbst-Hosten aus `/assets`**
        (`designsystem/tokens/fonts.css`) - `fonts.googleapis.com` und
        `fonts.gstatic.com` sind samt ihrer CSP-Eintraege entfallen.
      - Alles Uebrige ist NICHT der Boot: die OSM-Kacheln haengen an Leaflet
        (nachgeladen), die Adress-Suche `geocoding-api.open-meteo.com` am
        Anlege-Assistenten.

      Wer hier eine fremde Origin einfuehrt (ein CDN, ein Karten-Host, eine
      getrennte Auth-Domain), traegt ihren Preconnect NACH - und erweitert im
      selben Zug die CSP-Allowlist in `frontend/portal/nginx.conf`.
    -->
    <!--
      Sofort-Lader gegen Chromes Paint-Holding (2026-08-01, Lade-Moment Q4).
      Beim Reload haelt Chrome das ALTE Bild, bis das neue Dokument ERSTMALS
      zeichnet. Vorher zeichnete das Portal erst nach JS-Download + React-Mount
      + Keycloak-Check - der Captain sah nach jedem Deploy 2-3 s die eingefrorene
      alte Ansicht. Dieser Lader zeichnet, sobald das Stylesheet da ist, also
      lange bevor die App laeuft.

      Es ist die INLINE-Fassung des VoltPilot-Lade-Moments (`VpLoaderScreen`):
      der Marken-Blitz fuellt sich sichtbar von unten nach oben und setzt weich
      zurueck. React fuehrt beim Mount GENAU DIESE Animation weiter (`VpLoader`,
      dieselbe Loop `vp-loader-fill`), also blendet das Inline-Bild nur aus -
      der Blitz startet weder neu noch springt er (belegt am Produktions-Build).

      Regeln (bitte einhalten):
      - Kein zusaetzlicher REQUEST: kein externes Asset, keine Schrift-Datei.
        Die ECHTE Wortmarke (designsystem/assets/voltpilot-wordmark.png, 9,2 kB,
        byte-genau) steht hier als DATA-URI - inline, also KEIN Request, damit
        index.html no-cache-tauglich bleibt und keinen Hash braucht. Der
        React-Lader zeigt byte-genau DASSELBE Bild (`?inline`-Import), damit der
        Uebergang deckungsgleich ist (kein Ersatz-Logo, kein spaetes Auftauchen).
      - Kein `url(...)` und kein <img> auf ein EXTERNES Asset. Erlaubt sind nur
        lokale SVG-Fragment-Refs (`url(#vplFill-bs)`, eigenes `-bs`-Praefix gegen
        Kollision mit den `useId`-IDs des React-Laders) und Data-URIs (kein
        Request). Waechter: src/bootSkeleton.test.ts.
      - Farben sind aus designsystem/tokens/colors.css HART einkopiert
        (--vp-grad-hero, --vp-surface, --vp-primary, der Marken-Verlauf) -
        die Tokens selbst kommen erst mit dem Stylesheet.
      - Es liegt als position:fixed-Overlay ueber #root, kann also nie einen
        Layout-Sprung ausloesen; BootErrorBoundary.componentDidMount entfernt es
        in DEMSELBEN Commit, in dem React das erste Bild schreibt (kein Flackern).
      - Optisch identisch zur zentrierten Marken-Buehne von `VpLoaderScreen`:
        Marken-Verlauf als 3-px-Streifen oben, Wortmarke und darunter der Blitz,
        beide mittig. Wer die Marke neu toent, zieht hier UND in `.vp-loader-*`
        (src/index.css) mit.
    -->
    <style>
      #vp-boot-skeleton {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        background: #ffffff;
      }
      #vp-boot-skeleton .vp-bs-strip {
        height: 3px;
        flex: none;
        background: linear-gradient(135deg, #95b9ff 0%, #7ba3f7 50%, #5a8de8 100%);
      }
      /* ⚠ Alle Masse hier sind DECKUNGSGLEICH zu `.vp-loader-*` in src/index.css
         (stage-gap 32 = --vp-space-6, loader-gap 16 = --vp-space-4, Wortmarke-PNG
         Höhe 40, Marke 104, Statuszeile 16 mit reservierten zwei Zeilen).
         Wer eine Zahl aendert, aendert sie DORT mit - sonst springt der
         Uebergang (Waechter: e2e/loader-parity.spec.ts). */
      #vp-boot-skeleton .vp-bs-stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        padding: 24px;
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        min-width: 0;
      }
      #vp-boot-skeleton .vp-bs-word {
        display: block;
        height: 40px;
        width: auto;
      }
      #vp-boot-skeleton .vp-bs-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      #vp-boot-skeleton .vp-bs-mark {
        display: block;
        width: 104px;
        height: 104px;
      }
      #vp-boot-skeleton .vp-bs-text {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 2.8em;
        max-width: 26ch;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px;
        font-weight: 600;
        line-height: 1.4;
        text-align: center;
        color: #66717c;
      }
      /*
        Die ausstrahlenden Puls-Ringe - GENAU die Loop, die der React-Lader
        (`.vp-loader-ring` / `vp-loader-pulse`, src/index.css) weiterfuehrt:
        scale + fade, drei um je 1/3 der Periode versetzt. Reset bei Deckkraft 0
        (nahtlose Periode). Nur transform/opacity, keine Layout-Bewegung. Eigener
        Keyframe-Name `vp-bs-pulse`, damit er die gleichnamige Loop des Buendels
        nicht global ueberschreibt (identischer Inhalt).
      */
      #vp-boot-skeleton .vp-bs-ring {
        fill: none;
        transform-box: fill-box;
        transform-origin: center;
        animation: vp-bs-pulse 1.8s cubic-bezier(0.2, 0.7, 0.2, 1) infinite;
      }
      #vp-boot-skeleton .vp-bs-ring.r2 { animation-delay: -0.6s; }
      #vp-boot-skeleton .vp-bs-ring.r3 { animation-delay: -1.2s; }
      @keyframes vp-bs-pulse {
        0% { transform: scale(1); opacity: 0; }
        15% { opacity: 0.5; }
        70% { opacity: 0; }
        100% { transform: scale(1.55); opacity: 0; }
      }
      /*
        Das Ausblenden (Bewegungs-Programm P4, Konzept
        `data/vp-motion-konzept-m1/report.md` §6 Zeile "App-Start").
        Frueher wurde das Skelett hart entfernt - Skelett und Cockpit lagen in
        DEMSELBEN Frame uebereinander, der Wechsel war ein Schnitt. Jetzt
        blendet es ueber dem schon fertigen ersten Bild aus.

        ⚠ WARUM DIE REGEL HIER STEHT UND NICHT IN src/index.css: dieser
          Lader lebt VOR dem Buendel. Das Buendel ist beim Ausblenden zwar
          laengst da (React hat gerendert), aber die Regel muss auch dann
          greifen, wenn es das NICHT ist - deshalb liest sie die Tokens nur
          MIT Rueckfall. Die Zahlen sind die der Familie
          (`--vp-motion-exit` 160 ms, `--vp-ease-in`); wer sie dort aendert,
          aendert hier den Rueckfall mit.

        ⚠ UNTER REDUZIERTER BEWEGUNG steht das Token auf 0 ms (der EINE
          Schalter `--vp-motion-scale`), der Uebergang ist dann von selbst
          ein Schnitt - und `removeBootSkeleton` wartet gar nicht erst.
      */
      #vp-boot-skeleton.vp-bs-leaving {
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--vp-motion-exit, 160ms)
          var(--vp-ease-in, cubic-bezier(0.4, 0, 1, 1));
      }
      /* Reduzierte Bewegung: die Ringe ruhen (wie der React-Lader), ein einziger
         bleibt als leiser Halo - der Uebergang ist ein Schnitt. */
      @media (prefers-reduced-motion: reduce) {
        #vp-boot-skeleton .vp-bs-ring {
          animation: none;
          opacity: 0;
        }
        #vp-boot-skeleton .vp-bs-ring.r1 {
          opacity: 0.35;
        }
      }
    </style>
  </head>
