<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover ist die Voraussetzung dafuer, dass `env(safe-area-inset-*)`
      ueberhaupt einen Wert liefert (Mobil-Umbau Stufe 1). Ohne sie saesse die
      Bottom-Bar als installierte Web-App im iPhone-Home-Indicator, obwohl das
      Polster im CSS laengst steht.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>VoltPilot EMS</title>
    <!--
      Sofort-Skelett gegen Chromes Paint-Holding (2026-08-01).
      Beim Reload haelt Chrome das ALTE Bild, bis das neue Dokument ERSTMALS
      zeichnet. Vorher zeichnete das Portal erst nach JS-Download + React-Mount
      + Keycloak-Check - der Captain sah nach jedem Deploy 2-3 s die eingefrorene
      alte Ansicht. Dieses Skelett zeichnet, sobald das Stylesheet da ist, also
      lange bevor die App laeuft.

      Regeln (bitte einhalten):
      - Nur INLINE: kein externes Asset, keine Schrift-Datei, kein Bild. Damit
        bleibt index.html no-cache-tauglich und braucht keinen Hash.
      - Farben sind aus designsystem/tokens/colors.css HART einkopiert
        (--vp-grad-hero, --vp-surface, --vp-border, --vp-action) - die Tokens
        selbst kommen erst mit dem Stylesheet.
      - Es liegt als position:fixed-Overlay ueber #root, kann also nie einen
        Layout-Sprung ausloesen; BootErrorBoundary.componentDidMount entfernt es
        in DEMSELBEN Commit, in dem React das erste Bild schreibt (kein Flackern).
      - Optisch die Vorwegnahme von <BootSplash>/<AuthScreen>: links Marken-
        flaeche mit Glas-Plakette, rechts helle Flaeche mit Spinner.
    -->
    <style>
      #vp-boot-skeleton {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        grid-template-columns: 1.08fr 1fr;
        background: #ffffff;
      }
      #vp-boot-skeleton .vp-bs-brand {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 44px 46px;
        background:
          radial-gradient(circle at 12% 10%, rgba(255, 255, 255, 0.18), transparent 240px),
          linear-gradient(135deg, #95b9ff 0%, #7ba3f7 50%, #5a8de8 100%);
      }
      #vp-boot-skeleton .vp-bs-glass {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 30px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow:
          0 16px 44px rgba(20, 40, 70, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.6);
      }
      #vp-boot-skeleton .vp-bs-glass svg {
        display: block;
        width: 26px;
        height: 26px;
      }
      #vp-boot-skeleton .vp-bs-word {
        font-family:
          'Inter Tight', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1;
        color: #ffffff;
      }
      #vp-boot-skeleton .vp-bs-panel {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 44px 48px;
      }
      #vp-boot-skeleton .vp-bs-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid #e9ecef;
        border-top-color: #2c5282;
        animation: vp-bs-spin 0.9s linear infinite;
      }
      @keyframes vp-bs-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Phone: dieselbe Kopfband-Aufteilung wie .vp-auth (max-width 799px). */
      @media (max-width: 799px) {
        #vp-boot-skeleton {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
          align-content: start;
        }
        #vp-boot-skeleton .vp-bs-brand {
          padding: 26px 16px 20px;
        }
        #vp-boot-skeleton .vp-bs-glass {
          padding: 10px 18px;
          border-radius: 16px;
        }
        #vp-boot-skeleton .vp-bs-glass svg {
          width: 20px;
          height: 20px;
        }
        #vp-boot-skeleton .vp-bs-word {
          font-size: 20px;
        }
        #vp-boot-skeleton .vp-bs-panel {
          padding: 40px 18px;
          align-items: start;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #vp-boot-skeleton .vp-bs-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="vp-boot-skeleton" aria-hidden="true">
      <div class="vp-bs-brand">
        <div class="vp-bs-glass">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"
              fill="#fff"
              stroke="#fff"
              stroke-width="2"
              stroke-linejoin="round"
            />
          </svg>
          <span class="vp-bs-word">VoltPilot</span>
        </div>
      </div>
      <div class="vp-bs-panel"><div class="vp-bs-spinner"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
