<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; font-family: var(--vp-font-body); background: var(--vp-surface); }
  #root { padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Input, Switch } = window.VoltPilotDesignSystem_0e1953;
  function Demo() {
    const [on, setOn] = React.useState(true);
    const [on2, setOn2] = React.useState(false);
    return (
      <div className="grid">
        <div className="stack">
          <Input label="E-Mail" type="email" placeholder="name@firma.de" defaultValue="kontakt@firma.de" />
          <Input label="PLZ" placeholder="10115" error="Bitte gültige PLZ eingeben" />
        </div>
        <div className="stack">
          <Input label="Firma" placeholder="Musterfirma GmbH" />
          <Switch checked={on} onChange={() => setOn(!on)} label="Dynamischer Tarif aktiv" />
          <Switch checked={on2} onChange={() => setOn2(!on2)} label="Lastspitzenkappung" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
