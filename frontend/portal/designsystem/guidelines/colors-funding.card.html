<!-- @dsCard group="Colors" viewport="700x150" name="Funding & Tints" subtitle="Mintfläche, pale-blue tiles, blue tint" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--vp-font-body); background: var(--vp-surface); }
  .row { display: flex; gap: 14px; padding: 20px; }
  .sw { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .chip { height: 64px; border-radius: var(--vp-radius-md); border: 1px solid var(--vp-border); }
  .name { font-size: 12px; font-weight: 600; color: var(--vp-text-dark); }
  .hex { font-size: 11px; color: var(--vp-text-gray); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--vp-grad-funding)"></div><span class="name">Mintfläche</span><span class="hex">#E8F5E9 → #C8E6C9</span></div>
    <div class="sw"><div class="chip" style="background:var(--vp-green)"></div><span class="name">Grüner Akzent</span><span class="hex">#4CAF50</span></div>
    <div class="sw"><div class="chip" style="background:linear-gradient(135deg,var(--vp-paleblue-start),var(--vp-paleblue-end))"></div><span class="name">Hellblaue Fläche</span><span class="hex">#F0F4FF → #E3ECFF</span></div>
    <div class="sw"><div class="chip" style="background:var(--vp-tint)"></div><span class="name">Blaue Tönung</span><span class="hex">rgba(149,185,255,.12)</span></div>
  </div>
</body>
</html>
