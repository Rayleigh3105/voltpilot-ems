<!-- @dsCard group="Spacing" viewport="700x170" name="Radius & Shadows" subtitle="Corners and elevation" -->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--vp-font-body); background: var(--vp-bg-light); padding: 24px; }
  .row { display: flex; gap: 22px; align-items: flex-start; }
  .item { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .box { width: 84px; height: 70px; background: var(--vp-surface); border: 1px solid var(--vp-border); display:flex;align-items:center;justify-content:center; }
  .lbl { font-size: 11px; font-weight: 600; color: var(--vp-text-dark); }
  .sub { font-size: 10px; color: var(--vp-text-gray); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:10px"></div><span class="lbl">sm · 10px</span></div>
    <div class="item"><div class="box" style="border-radius:16px"></div><span class="lbl">md · 16px</span></div>
    <div class="item"><div class="box" style="border-radius:24px"></div><span class="lbl">lg · 24px</span></div>
    <div class="item"><div class="box" style="border-radius:50px"></div><span class="lbl">pill · 50px</span></div>
    <div class="item"><div class="box" style="border-radius:16px;box-shadow:var(--vp-shadow-md);border:none"></div><span class="lbl">shadow-md</span></div>
    <div class="item"><div class="box" style="border-radius:16px;box-shadow:var(--vp-shadow-hover);border:none"></div><span class="lbl">glow</span><span class="sub">hover</span></div>
  </div>
</body>
</html>
