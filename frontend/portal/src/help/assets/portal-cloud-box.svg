<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 432" role="img" aria-labelledby="title desc"><title id="title">Portal, Planung und Box</title><desc id="desc">Im Portal werden Angaben gemacht und Ergebnisse gelesen. Die Cloud plant. Die Box übermittelt Messwerte und führt freigegebene Vorgaben an Geräten aus.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2C5282"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#1E3A5F}.label{font-size:24px;font-weight:650}.small{font-size:20px;fill:#526170}.line{fill:none;stroke:#2C5282;stroke-width:3;marker-end:url(#arrow)}</style><rect x="20" y="10" width="480" height="82" rx="12" fill="white" stroke="#D3DCE4"/><rect x="20" y="10" width="5" height="82" rx="2" fill="#2C5282"/><text x="38" y="44" class="label">Portal</text><text x="38" y="74" class="small">Angaben, Ansichten und Regeln</text><path d="M260 92V130" class="line" marker-start="url(#arrow)"/><rect x="20" y="139" width="480" height="82" rx="12" fill="white" stroke="#D3DCE4"/><rect x="20" y="139" width="5" height="82" rx="2" fill="#2C5282"/><text x="38" y="173" class="label">Planung in der Cloud</text><text x="38" y="203" class="small">Preise · Vorhersagen · Grenzen</text><path d="M120 221V275" class="line"/><path d="M400 275V221" class="line"/><text x="145" y="253" class="small">Plan</text><text x="274" y="253" class="small">Messwerte</text><rect x="20" y="284" width="480" height="82" rx="12" fill="white" stroke="#D3DCE4"/><rect x="20" y="284" width="5" height="82" rx="2" fill="#2C5282"/><text x="38" y="318" class="label">Box vor Ort</text><text x="38" y="348" class="small">Geräte verbinden · Vorgaben begrenzen</text><path d="M260 366V392" class="line" marker-start="url(#arrow)"/><text x="260" y="427" text-anchor="middle" class="label">Wechselrichter · Zähler · Ladepunkte</text></svg>
