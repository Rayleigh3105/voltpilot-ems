<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 458" role="img" aria-labelledby="title desc"><title id="title">Vom Plan zur gemessenen Wirkung</title><desc id="desc">Plan, gesendeter Auftrag, Geräteantwort und Messung sind vier unterschiedliche Nachweise. Eine Bestätigung allein beweist keine Wirkung.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2C5282"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#1E3A5F}.label{font-size:24px;font-weight:650}.small{font-size:20px;fill:#526170}.line{fill:none;stroke:#2C5282;stroke-width:3;marker-end:url(#arrow)}</style><rect x="16" y="8" width="488" height="84" rx="12" fill="white" stroke="#D3DCE4"/><rect x="16" y="8" width="5" height="84" rx="2" fill="#2C5282"/><text x="34" y="42" class="label">Plan</text><text x="34" y="72" class="small">Was soll passieren?</text><path d="M260 92V118" class="line"/><rect x="16" y="126" width="488" height="84" rx="12" fill="white" stroke="#D3DCE4"/><rect x="16" y="126" width="5" height="84" rx="2" fill="#2C5282"/><text x="34" y="160" class="label">Auftrag</text><text x="34" y="190" class="small">Was wurde an das Gerät gesendet?</text><path d="M260 210V236" class="line"/><rect x="16" y="244" width="488" height="84" rx="12" fill="white" stroke="#D3DCE4"/><rect x="16" y="244" width="5" height="84" rx="2" fill="#2C5282"/><text x="34" y="278" class="label">Antwort</text><text x="34" y="308" class="small">Was hat das Gerät bestätigt?</text><path d="M260 328V354" class="line"/><rect x="16" y="362" width="488" height="84" rx="12" fill="white" stroke="#D3DCE4"/><rect x="16" y="362" width="5" height="84" rx="2" fill="#2C5282"/><text x="34" y="396" class="label">Messung</text><text x="34" y="426" class="small">Was hat sich tatsächlich verändert?</text></svg>
