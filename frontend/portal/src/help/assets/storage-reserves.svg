<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 378" role="img" aria-labelledby="title desc"><title id="title">Kapazität und nutzbarer Speicher</title><desc id="desc">Eine technische Untergrenze und Reserven begrenzen die frei planbare Energie. Eine obere Grenze begrenzt die Ladung. Die Flächen sind schematisch und geben keine empfohlenen Werte vor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2C5282"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#1E3A5F}.label{font-size:24px;font-weight:650}.small{font-size:20px;fill:#526170}.line{fill:none;stroke:#2C5282;stroke-width:3;marker-end:url(#arrow)}</style><rect x="38" y="12" width="106" height="344" rx="12" fill="white" stroke="#9C27B0" stroke-width="3"/><path d="M55 80H127V254H55Z" fill="#D5E5FF"/><path d="M55 259H127V313H55Z" fill="#E8D7F0"/><path d="M55 318H127V340H55Z" fill="#CFD8DC"/><path d="M144 75H174M144 257H174M144 316H174" stroke="#66717C" stroke-width="2"/><text x="187" y="54" class="label">Obere Grenze</text><text x="187" y="87" class="small">Bis hier laden</text><text x="187" y="170" class="label">Planbarer Bereich</text><text x="187" y="203" class="small">Für die verfügbaren Aufgaben</text><text x="187" y="270" class="label">Reserve</text><text x="187" y="300" class="small">Für einen Zweck zurückgehalten</text><text x="187" y="342" class="label">Technische Untergrenze</text></svg>
