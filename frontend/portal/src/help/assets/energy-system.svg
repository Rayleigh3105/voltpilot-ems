<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-labelledby="title desc"><title id="title">Mögliche Energieflüsse</title><desc id="desc">PV liefert Strom. Speicher kann laden und entladen; Netz kann liefern und aufnehmen. Verbraucher nutzen Strom. Das Bild zeigt keine Live-Messung.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2C5282"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#1E3A5F}.label{font-size:24px;font-weight:650}.small{font-size:20px;fill:#526170}.line{fill:none;stroke:#2C5282;stroke-width:3;marker-end:url(#arrow)}</style><rect x="115" y="8" width="290" height="86" rx="12" fill="white" stroke="#D3DCE4"/><rect x="115" y="8" width="5" height="86" rx="2" fill="#FF9800"/><text x="133" y="42" class="label">PV-Erzeugung</text><text x="133" y="72" class="small">Strom vom Dach</text><path d="M260 94V133" class="line"/><rect x="170" y="143" width="180" height="70" rx="12" fill="#1E3A5F"/><text x="260" y="186" text-anchor="middle" class="label" style="fill:white">Ihre Anlage</text><path d="M170 178H65V271" class="line" marker-start="url(#arrow)"/><path d="M350 178H455V271" class="line" marker-start="url(#arrow)"/><path d="M260 213V354" class="line"/><rect x="6" y="278" width="200" height="82" rx="12" fill="white" stroke="#D3DCE4"/><rect x="6" y="278" width="5" height="82" rx="2" fill="#9C27B0"/><text x="24" y="312" class="label">Speicher</text><text x="24" y="342" class="small">Laden / entladen</text><rect x="314" y="278" width="200" height="82" rx="12" fill="white" stroke="#D3DCE4"/><rect x="314" y="278" width="5" height="82" rx="2" fill="#607D8B"/><text x="332" y="312" class="label">Netz</text><text x="332" y="342" class="small">Bezug / Export</text><rect x="132" y="363" width="256" height="74" rx="12" fill="white" stroke="#D3DCE4"/><rect x="132" y="363" width="5" height="74" rx="2" fill="#4CAF50"/><text x="150" y="397" class="label">Verbraucher</text><text x="150" y="427" class="small">Haus · Auto · Betrieb</text></svg>
