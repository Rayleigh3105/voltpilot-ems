# =============================================================================
# Voltpilot-EMS - PRODUCTION / pilot compose (single VM/VPS MVP, no Kubernetes).
# Two ways to get the app images (api, ingest, timescale-writer, frontend,
# market-data, forecast, optimization) - see docs/deploy.md:
#   a) MANUAL first deploy (no CI): git clone on the server, then
#        docker compose -f docker-compose.prod.yml build
#        docker compose -f docker-compose.prod.yml up -d
#      (the `build:` contexts build every image locally from this clone).
#   b) CI push-to-deploy (.forgejo/workflows/deploy.yaml): images are PULLED
#      from the Forgejo registry, pinned to ${IMAGE_TAG}; the workflow ships
#      this file to /srv/docker/voltpilot/ and runs `pull` + `up -d`.
# This is a self-contained, standalone stack - NOT merged with
# docker-compose.yml (that file is the local dev stack).
#
# -----------------------------------------------------------------------------
# TWO public entry points, everything else internal:
#   1. frontend  (APP_PORT, plain HTTP) - the SPA + reverse proxy. TLS is
#      terminated by an EXTERNAL reverse proxy on another host (Nginx Proxy
#      Manager or Caddy - see docs/deploy.md) that forwards all traffic for
#      ${DOMAIN} here. The frontend nginx serves the SPA and proxies
#      /api/ -> api and /auth/ -> Keycloak, so the API and Keycloak stay
#      internal - nothing else is published.
#   2. emqx 8883 (mTLS) - remote edge devices connect outbound with a client
#      cert (see docs/connect-a-device.md / docs/security-mqtt.md). Preserved
#      verbatim from the original secure-broker overlay this file grew out of.
#
# Your external proxy MUST:
#   - forward https://${DOMAIN}  ->  http://THIS_VPS:${APP_PORT:-8080}
#   - preserve the Host header and set X-Forwarded-Proto: https
# Firewall APP_PORT so ONLY the proxy host can reach it (it is plain HTTP);
# leave 8883 open to the internet for devices. See docs/deploy.md.
#
# All credentials come from /srv/docker/voltpilot/.env (see .env.prod.example);
# the ${VAR:?...} entries abort the deploy if a secret is missing. Changing
# DOMAIN also requires rebuilding the frontend image with a matching
# VITE_KEYCLOAK_URL (the SPA bakes it in - see the deploy workflow).
#
# -----------------------------------------------------------------------------
# OPTIONALE DRITTE ENTRY-GRUPPE: die DATENEBENE fuer den k3s-Cluster.
# Standardmaessig AUS - dann veroeffentlicht dieser Stack exakt die zwei Ports
# oben und sonst nichts, genau wie vor Einfuehrung dieses Blocks.
#
# Beim k8s-Umzug (Stufe 1) laufen timescaledb / keycloak-db / emqx / redpanda
# bewusst WEITER auf dieser VM, waehrend die zustandslosen Dienste in den
# Cluster ziehen (Scout-Report vp-zielinfra-k6 §3.6). Die Cluster-Pods
# erreichen sie ueber ExternalName-Services, deren Ports das gitops-Repo
# festlegt (apps/voltpilot/base/external/README.md) - dieser Stack muss sie
# also im LAN veroeffentlichen.
#
# Einschalten: in der .env BEIDE Variablen setzen (siehe .env.prod.example)
#   DATA_PLANE=enabled
#   DATA_PLANE_HOST=192.168.178.128      # LAN-Adresse DIESER VM
#
# DATA_PLANE ist der EINE Schalter: er waehlt unten die include-Datei
# (infra/prod/dataplane/{disabled,enabled}.yml -> die veroeffentlichten Ports)
# UND schaltet im redpanda-Block den EXTERNAL-Kafka-Listener frei. Ein Tippfehler
# im Wert laesst das include ins Leere laufen und bricht laut ab, statt die
# Datenebene halb zu konfigurieren.
#
# SICHERHEIT: alle Datenebenen-Ports binden an ${DATA_PLANE_HOST}, NICHT an
# 0.0.0.0 - und die Variable ist Pflicht, sobald der Overlay an ist. Die Ports
# selbst sind unauthentifiziert bzw. nur passwortgeschuetzt; die eigentliche
# Zusage ist die Firewall: nur die drei k3s-Nodes duerfen ran. Die ufw-Regeln
# stehen in docs/deploy.md ("Datenebene fuer den k3s-Cluster freigeben").
# =============================================================================
name: voltpilot

# Datenebenen-Ports. Ohne DATA_PLANE zieht das die No-op-Datei disabled.yml,
# die nichts definiert - der aufgeloeste Stack ist dann byte-identisch zu einem
# ohne diesen Block. Das include wird als BASIS gemergt, `ports:`-Listen werden
# also ADDIERT (die emqx-Eintraege unten bleiben unberuehrt).
include:
  - path: ./infra/prod/dataplane/${DATA_PLANE:-disabled}.yml

services:
  # ---------------------------------------------------------------------------
  # TimescaleDB: one Postgres instance for timeseries (hypertables) + master
  # data. On a FRESH volume the init scripts create the collector-owned tables
  # (day_ahead_prices/forecast); the api's Flyway V1/V2 own the core schema, the
  # RLS policies and the voltpilot_app role when the api container starts.
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voltpilot}
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - timescale-data:/var/lib/postgresql/data
      # *.sql here run once, in filename order, on FIRST init only.
      - ./infra/prod/timescale:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voltpilot} -d ${POSTGRES_DB:-voltpilot}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Keycloak store - a DEDICATED Postgres, isolated from the application DB
  # (mirrors saalo's prod split so a TimescaleDB restore never touches auth).
  # ---------------------------------------------------------------------------
  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # Keycloak (OIDC). Production mode (`start`, not start-dev): persistent
  # Postgres store + strict hostname. Served under the /auth relative path so the
  # frontend nginx can reverse-proxy it; TLS terminates on the external proxy
  # (KC_HTTP_ENABLED + KC_PROXY_HEADERS trust its X-Forwarded-*). The prod realm
  # is imported on first boot; VP_PUBLIC_ORIGIN / VP_API_CLIENT_SECRET fill its
  # ${...} placeholders (redirect URIs, web origins, confidential secret).
  # ---------------------------------------------------------------------------
  keycloak:
    # Default = the STOCK upstream image with realm + theme bind-mounted below
    # (unchanged behaviour). Set KEYCLOAK_IMAGE in .env to the project image
    # that BAKES both in - git.tecmaxx.de/mamotec/voltpilot-ems/keycloak:latest,
    # built by the `keycloak` CI matrix entry - to preview what the Kubernetes
    # deployment runs; the mounts then just overlay byte-identical files and may
    # be dropped after the move. Keep the pinned version here and the
    # ARG KEYCLOAK_VERSION in deploy/keycloak/Dockerfile in lockstep.
    # Details + the IMAGE_TAG caveat: deploy/keycloak/README.md.
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.0.5}
    restart: unless-stopped
    # Deliberately NOT `--optimized`: correct for BOTH images (the project image
    # bakes the identical build options, so Keycloak does not re-augment).
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # KC_HOSTNAME MUST include the /auth path, or Keycloak emits frontend URLs
      # (form actions, CSS links) without it -> 405 on login + unstyled page.
      KC_HOSTNAME: https://${DOMAIN:?set DOMAIN in .env}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Substituted into the imported realm (infra/prod/keycloak/voltpilot-realm.json).
      VP_PUBLIC_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      VP_API_CLIENT_SECRET: ${VP_API_CLIENT_SECRET:?set VP_API_CLIENT_SECRET in .env}
      # Password of the seeded Portal-Admin user `admin` (realm role platform-admin).
      VP_PORTAL_ADMIN_PASSWORD: ${VP_PORTAL_ADMIN_PASSWORD:?set VP_PORTAL_ADMIN_PASSWORD in .env}
      # Secret of the OTA release-publisher service account (client
      # voltpilot-release-publisher). The client ships DISABLED in the realm
      # import, so the default here is inert until an operator enables it -
      # see docs/ota-signing.md "Einmalige Einrichtung".
      VP_RELEASE_PUBLISHER_SECRET: ${VP_RELEASE_PUBLISHER_SECRET:-change-me}
    volumes:
      - ./infra/prod/keycloak:/opt/keycloak/data/import:ro
      # VoltPilot login theme. On a CI roll-out the deploy workflow ships this
      # directory to $DEPLOY_DIR/deploy/keycloak/themes/voltpilot (saalo pattern);
      # a git clone has it at the same relative path. In `start` mode themes are
      # cached at boot and pre-gzipped onto the container FS (kc-gzip-cache),
      # which SURVIVES a plain restart - the workflow therefore force-recreates
      # keycloak after `up -d` so theme changes actually reach browsers.
      - ./deploy/keycloak/themes/voltpilot:/opt/keycloak/themes/voltpilot:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The image ships no curl/wget; health lives on the management port 9000.
      # KC_HTTP_RELATIVE_PATH=/auth also shifts the health endpoint under /auth.
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"
      start_period: 90s # first boot runs a config build + DB migration before it answers
      interval: 5s
      timeout: 5s
      retries: 40

  # ---------------------------------------------------------------------------
  # Redpanda: single-broker Kafka-API event log. INTERNAL ONLY by default - only
  # the in-cluster listener is advertised (redpanda:29092) and no host port is
  # published, so it is never reachable from outside the compose network.
  #
  # Mit DATA_PLANE=enabled kommt ein ZWEITER, externer Listener dazu. Das ist
  # kein Umbiegen des vorhandenen: ein Kafka-Listener kann genau EINE Adresse
  # annoncieren, und die Compose-Dienste brauchen weiterhin `redpanda:29092`,
  # waehrend der Cluster die LAN-Adresse dieser VM braucht. Also:
  #   INTERNAL  Container 29092, annonciert redpanda:29092  (unveroeffentlicht)
  #   EXTERNAL  Container 29093, annonciert ${DATA_PLANE_HOST}:29092
  # und infra/prod/dataplane/enabled.yml veroeffentlicht Host-29092 auf
  # Container-29093. Der Cluster bootstrappt also gegen Host-Port 29092 und
  # bekommt als Broker-Adresse dieselbe Adresse zurueck - Kafka-Clients
  # verbinden sich nach dem Bootstrap zur annoncierten Adresse neu, weshalb
  # diese fuer die Nodes aufloesbar und erreichbar sein MUSS.
  # DATA_PLANE_ADVERTISED_HOST ueberschreibt die annoncierte Adresse, falls der
  # Cluster die VM ueber einen DNS-Namen statt der IP erreichen soll.
  # ---------------------------------------------------------------------------
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      # Ohne DATA_PLANE bleibt es beim reinen in-cluster Listener (wie bisher).
      - --kafka-addr=INTERNAL://0.0.0.0:29092${DATA_PLANE:+,EXTERNAL://0.0.0.0:29093}
      - --advertise-kafka-addr=INTERNAL://redpanda:29092${DATA_PLANE:+,EXTERNAL://${DATA_PLANE_ADVERTISED_HOST:-${DATA_PLANE_HOST}}:${DATA_PLANE_REDPANDA_PORT:-29092}}
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # One-shot: create the MVP telemetry.raw topic, then exit 0.
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        rpk topic create ${REDPANDA_TELEMETRY_TOPIC:-telemetry.raw}
        --brokers redpanda:29092
        --partitions ${REDPANDA_TELEMETRY_PARTITIONS:-3}
        --replicas 1 || true;
        rpk topic create ${REDPANDA_TELEMETRY_V2_TOPIC:-telemetry-v2.raw}
        --brokers redpanda:29092
        --partitions ${REDPANDA_TELEMETRY_PARTITIONS:-3}
        --replicas 1 || true;
        rpk topic list --brokers redpanda:29092
    restart: "no"

  # ---------------------------------------------------------------------------
  # EMQX: MQTT broker + the hardened mTLS device ingress (8883). Preserved from
  # the secure-broker overlay this file grew out of - see docs/security-mqtt.md.
  # Devices connect OUTBOUND on 8883 with a client cert; 1883 (plaintext) and
  # the dashboard stay on loopback for the internal ingest consumer + operators.
  # ---------------------------------------------------------------------------
  emqx:
    image: emqx/emqx:5.8.3
    restart: unless-stopped
    environment:
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:?set EMQX_NODE_COOKIE in .env}
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?set EMQX_DASHBOARD_PASSWORD in .env}
      # --- mTLS listener on 8883 -------------------------------------------
      # Require + verify a client x.509 cert signed by the device CA. A device
      # with no cert / an untrusted cert is dropped at the TLS handshake.
      EMQX_LISTENERS__SSL__DEFAULT__BIND: "0.0.0.0:8883"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE: /opt/emqx/etc/certs/device-ca.crt
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: /opt/emqx/etc/certs/server.crt
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: /opt/emqx/etc/certs/server.key
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY: verify_peer
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__FAIL_IF_NO_PEER_CERT: "true"
      # Bind the cert identity: MQTT username := cert CN (device_id), and the
      # clientid := CN too, so a device cannot spoof either. The ACL grants are
      # keyed on this username (see infra/mqtt/acl/acl.conf).
      # NOTE: in EMQX 5.x this is the GLOBAL mqtt.* setting, NOT a listener
      # field - the listener-scoped env form is rejected as unknown_env_vars
      # and silently ignored (verified on 5.8.3). Global is safe: a connection
      # without a client cert (the loopback-only 1883 backbone clients) is
      # unaffected, its username/clientid stay whatever the client sent.
      EMQX_MQTT__PEER_CERT_AS_USERNAME: cn
      EMQX_MQTT__PEER_CERT_AS_CLIENTID: cn
      # --- authorization ----------------------------------------------------
      # The file authorizer reads acl.conf from the DIRECTORY mount below (the
      # default path /opt/emqx/etc/acl.conf cannot be used: a directory cannot
      # be mounted onto a file path, and a single-file bind mount pins the old
      # inode - the api's atomic grant rewrite would never become visible here).
      # The env value is parsed as HOCON, replacing the default sources array
      # (verified on 5.8.3 - no unknown_env_vars complaint).
      EMQX_AUTHORIZATION__SOURCES: '[{type = file, enable = true, path = "/opt/emqx/etc/acl/acl.conf"}]'
      # Deny anything no rule matches (the acl.conf still ends with an explicit
      # allow for anonymous internal clients on the firewalled 1883).
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__DENY_ACTION: disconnect
      # Anonymous MQTT-level login stays on: the SSL listener is gated by the
      # TLS client cert, and 1883 is loopback-only + firewalled.
    volumes:
      # Broker server cert/key + device CA. Populate infra/mqtt/certs/ with the
      # tool output first (that dir is gitignored - keys never hit the repo).
      - ./infra/mqtt/certs/server.crt:/opt/emqx/etc/certs/server.crt:ro
      - ./infra/mqtt/certs/server.key:/opt/emqx/etc/certs/server.key:ro
      - ./infra/mqtt/certs/device-ca.crt:/opt/emqx/etc/certs/device-ca.crt:ro
      # Per-tenant/-device ACL (committed; grants appended by the cert tool and
      # the api's enrollment issuance). Mounted as a DIRECTORY on purpose: the
      # api replaces acl.conf atomically (tmp + rename), and only a directory
      # mount lets this container see the renamed-in file - a single-file bind
      # mount would stay pinned to the original inode forever. Grants apply on
      # the next authz reload (tools/pki/reload-broker-authz.sh).
      - ./infra/mqtt/acl:/opt/emqx/etc/acl:ro
      # Optional CRL for cryptographic revocation (enable CRL check in EMQX to use).
      - ./infra/mqtt/certs/crl.pem:/opt/emqx/etc/certs/crl.pem:ro
      - emqx-data:/opt/emqx/data
    # Expose ONLY 8883 to the internet. Keep the dashboard, WebSocket and the
    # plaintext listener on loopback so they are reachable only on the host
    # (put a firewall in front regardless - see the hardening checklist).
    # Mit DATA_PLANE=enabled kommen 1883 + 18083 ZUSAETZLICH auf der LAN-Adresse
    # dazu (infra/prod/dataplane/enabled.yml); diese Loopback-Binds bleiben.
    ports:
      - "8883:8883"                 # mTLS device ingress (public)
      - "127.0.0.1:1883:1883"       # plaintext, INTERNAL ingest only (loopback)
      - "127.0.0.1:18083:18083"     # dashboard (loopback / tunnel only)
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Portal API (Spring Boot): the user-facing spine. OAuth2 resource server
  # (validates Keycloak JWTs), tenant-scoped REST over TimescaleDB with Postgres
  # RLS, device claiming. On start it runs Flyway as the Postgres superuser
  # (creating the non-privileged voltpilot_app role + RLS policies), then serves
  # as voltpilot_app so RLS applies. Internal only - reached via the frontend's
  # /api reverse proxy.
  # ---------------------------------------------------------------------------
  api:
    image: git.tecmaxx.de/mamotec/voltpilot-ems/api:${IMAGE_TAG:-latest}
    # For the manual no-CI path: `docker compose -f docker-compose.prod.yml build`
    # builds every app image locally from a git clone and tags it with the
    # `image:` name, so the subsequent `up -d` uses the local build instead of
    # pulling. The CI path ignores `build:` (it runs `pull` + `up -d`).
    build:
      context: ./services/api
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      # Production default is a BLANK profile: only db/migration (prod-safe core)
      # runs, never db/dev, so no demo tenants/telemetry land on a real DB. Set
      # SPRING_PROFILES_ACTIVE=local in .env ONLY for a throwaway demo VM (seeds
      # the two demo tenants + demo/demo realm user). Editing a db/dev migration
      # after a VM ran `local` no longer bricks startup - see the api's
      # spring.flyway.ignore-migration-patterns "*:missing" (docs/deploy.md).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SERVER_PORT: 8090
      # Runtime connection: non-privileged app role (RLS applies to it).
      POSTGRES_JDBC_URL: jdbc:postgresql://timescaledb:5432/${POSTGRES_DB:-voltpilot}
      APP_DB_USER: ${APP_DB_USER:-voltpilot_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      # Cross-tenant admin datasource (voltpilot_admin, BYPASSRLS, created by
      # Flyway V4) - used ONLY by the platform-admin endpoints. Without these the
      # api would fall back to the hardcoded dev password for that role.
      ADMIN_DB_USER: ${ADMIN_DB_USER:-voltpilot_admin}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD in .env}
      # Flyway connection: Postgres superuser (owns schema, creates role + RLS).
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Keycloak Admin REST API (customer-user provisioning). Compose-internal
      # base URL - prod serves Keycloak under the /auth relative path, so the
      # dev default (no path) would 404. The secret is the same confidential
      # client secret the realm import bakes into voltpilot-api.
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080/auth
      # Marktstammdatenregister ("Anlage verknüpfen"): blank = keyless public
      # JSON backend; the captain's Webdienst credentials switch lookups to the
      # official SOAP webservice (no code change, just these two variables).
      MASTR_API_KEY: ${MASTR_API_KEY:-}
      MASTR_MARKTAKTEUR_NUMMER: ${MASTR_MARKTAKTEUR_NUMMER:-}
      KEYCLOAK_REALM: voltpilot
      KEYCLOAK_API_CLIENT_ID: voltpilot-api
      KEYCLOAK_API_CLIENT_SECRET: ${VP_API_CLIENT_SECRET:?set VP_API_CLIENT_SECRET in .env}
      # OIDC on. Issuer is the browser-facing Keycloak URL (under /auth); JWKS is
      # fetched over the compose-internal URL (the issuer-trap fix).
      VOLTPILOT_SECURITY_OIDC_ENABLED: "true"
      # Public self-service registration; set false in .env for a closed platform.
      VOLTPILOT_REGISTRATION_ENABLED: ${VOLTPILOT_REGISTRATION_ENABLED:-true}
      # Registration rate limiter: two own proxy hops append to X-Forwarded-For
      # (external reverse proxy -> frontend nginx), so the real client is the
      # 2nd-from-the-right entry; earlier entries are client-supplied.
      VOLTPILOT_REGISTRATION_RATE_LIMIT_TRUSTED_PROXIES: ${VOLTPILOT_REGISTRATION_RATE_LIMIT_TRUSTED_PROXIES:-2}
      OIDC_ISSUER_URI: https://${DOMAIN:?set DOMAIN in .env}/auth/realms/voltpilot
      OIDC_JWK_SET_URI: http://keycloak:8080/auth/realms/voltpilot/protocol/openid-connect/certs
      # The SPA is served same-origin, so CORS is not strictly needed; allow the
      # public origin anyway for direct API tooling.
      VOLTPILOT_CORS_ALLOWED_ORIGINS: https://${DOMAIN:?set DOMAIN in .env}
      # Which forecast model is LIVE per kind. Since the portal promotion
      # switch (docs/forecasting.md) these are the DEFAULT: a row in
      # site_forecast_model_choice (je Anlage) bzw. forecast_model_choice
      # (plattformweit) wins over them. Keep in sync with the forecast +
      # optimization services (same .env vars) - all three resolve the SAME
      # precedence, so they cannot disagree.
      VOLTPILOT_ACTIVE_LOAD_MODEL: ${VOLTPILOT_ACTIVE_LOAD_MODEL:-load-persistence}
      VOLTPILOT_ACTIVE_PV_MODEL: ${VOLTPILOT_ACTIVE_PV_MODEL:-pv-physical}
      # Api-side mirror of the optimizer's platform tunables (admin optimizer
      # panel + per-slot diagnostics) - same .env variables as the optimization
      # service, so the display and the solver never disagree.
      OPTIMIZER_WEAR_COST_CT_PER_KWH: ${OPTIMIZER_WEAR_COST_CT_PER_KWH:-4.0}
      OPTIMIZER_TERMINAL_VALUE_QUANTILE: ${OPTIMIZER_TERMINAL_VALUE_QUANTILE:-0.3}
      OPTIMIZER_TERMINAL_VALUE_CT_PER_KWH: ${OPTIMIZER_TERMINAL_VALUE_CT_PER_KWH:-}
      OPTIMIZER_EEG_RATES_JSON: ${OPTIMIZER_EEG_RATES_JSON:-}
      OPTIMIZER_DEFAULT_SUPPLY_COMPONENTS: ${OPTIMIZER_DEFAULT_SUPPLY_COMPONENTS:-true}
      # --- First-boot device enrollment over HTTPS (kinderleicht mTLS) --------
      # A fresh device knowing only its ref + portal URL uploads a CSR and polls
      # for its certificate; on claim the api signs it with the device CA
      # mounted below (see docs/connect-a-device.md). Security note: this makes
      # the api the CA signer - the CA mount and this VM are part of the PKI
      # trust boundary (docs/security-mqtt.md). Set false if the CA is not
      # staged on this host (issuance then answers 503, everything else works).
      VOLTPILOT_ENROLLMENT_ENABLED: ${VOLTPILOT_ENROLLMENT_ENABLED:-true}
      VP_ENROLLMENT_CA_DIR: /pki/ca
      VP_ENROLLMENT_ACL_FILE: /pki/acl/acl.conf
      # What enrolled devices are told to dial: the dedicated MQTT domain
      # (plain DNS A record to this VM - see docs/deploy.md), port 8883.
      VP_ENROLLMENT_MQTT_HOST: ${MQTT_DOMAIN:-mqtt.${DOMAIN}}
      VP_ENROLLMENT_MQTT_PORT: 8883
      # Same proxy-chain depth as the registration limiter (external reverse
      # proxy -> frontend nginx).
      VOLTPILOT_ENROLLMENT_RATE_LIMIT_TRUSTED_PROXIES: ${VOLTPILOT_ENROLLMENT_RATE_LIMIT_TRUSTED_PROXIES:-2}
      # --- Auto-reload the broker authorizer on grant write/removal -----------
      # EMQX's file authorizer never re-reads acl.conf on its own, and the api
      # can't run `emqx eval` (no docker socket). So right after it writes the
      # per-device grant (issuance) or removes it (unclaim), it re-initialises
      # the file source over the EMQX REST management API (internal :18083) - the
      # HTTP twin of tools/pki/reload-broker-authz.sh - so a freshly claimed
      # device is publishable within seconds instead of at the next deploy/cron
      # reload (which stays the backstop). Auth reuses the dashboard credentials
      # the emqx service already ships. Best-effort: a broker outage only warns,
      # never fails issuance. Needs a redeploy to take effect.
      VOLTPILOT_BROKER_AUTHZ_RELOAD_ENABLED: ${VOLTPILOT_BROKER_AUTHZ_RELOAD_ENABLED:-true}
      VOLTPILOT_BROKER_AUTHZ_RELOAD_API_URL: http://emqx:18083/api/v5
      VOLTPILOT_BROKER_AUTHZ_RELOAD_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      VOLTPILOT_BROKER_AUTHZ_RELOAD_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?set EMQX_DASHBOARD_PASSWORD in .env}
      # --- Device data purge ("Datenaufzeichnungen löschen") ------------------
      # The api talks to the broker over the compose-internal plain listener
      # (like ingest): on-claim provisioning configs, the retained purge_data
      # command after a purge, and the purge_request listener that lets the
      # device trigger the same purge from its local web app
      # (docs/contracts/mqtt-data-purge.schema.json). All best-effort - a broker
      # outage never fails an api request.
      VOLTPILOT_PROVISIONING_ENABLED: "true"
      MQTT_BROKER_URL: tcp://emqx:1883
      VOLTPILOT_PURGE_MQTT_LISTENER_ENABLED: "true"
      # Inverter-control confirmation ingestion (portal "Steuerung" strip).
      VOLTPILOT_CONTROL_MQTT_LISTENER_ENABLED: "true"
      # Feed-in curtailment ("Abregeln") execution truth (portal three-stage
      # wording: geplant / setzt es noch nicht um / bestätigt).
      VOLTPILOT_CURTAILMENT_MQTT_LISTENER_ENABLED: "true"
      # Consumer runtime status (Verbrauchssteuerung Inkrement 3, D9): the
      # heartbeat consumers block -> consumer_runtime_status.
      VOLTPILOT_CONSUMERS_MQTT_LISTENER_ENABLED: "true"
      # Register schreiben ueber das Portal: der CLOUD-NOT-AUS. Vorgabe AN.
      # Er ist der EINZIGE plattformweite Hebel - auf der Box gibt es seit der
      # Captain-Korrektur vom 20.08.2026 KEIN Feature-Flag mehr (D2
      # KORRIGIERT), der Einmal-Schreibpfad ist dort immer verfuegbar. Auf
      # "false" gesetzt refuesieren die zwei SCHREIBENDEN Schritte mit 503 und
      # deutschem Grund; Ziel-Liste, Register-Wissen und VERLAUF bleiben lesbar
      # - das Schreiben abzuschalten darf die Papier-Spur nie verstecken.
      VOLTPILOT_REGISTER_WRITE_ENABLED: "${VOLTPILOT_REGISTER_WRITE_ENABLED:-true}"
      # Verbrauchssteuerung Inkrement 4: the consumer-policy activation gates,
      # BOTH default OFF (tests/rig only; Produktivierung ist Inkrement 5). The
      # stop paths (deactivate/pause + retained-artifact retraction) ignore
      # them by design (Flag aus != gestoppt).
      VOLTPILOT_CONSUMER_CONTROL_ENABLED: ${VOLTPILOT_CONSUMER_CONTROL_ENABLED:-false}
      VOLTPILOT_CONSUMER_POLICY_COMPILER_ENABLED: ${VOLTPILOT_CONSUMER_POLICY_COMPILER_ENABLED:-false}
      # D8 event replanning: the trigger listener (sibling on the status
      # topic) - on like the other listeners; it only ever CALLS the solve
      # service, which is itself semaphore-bounded.
      VOLTPILOT_CONSUMER_REPLAN_TRIGGER_ENABLED: ${VOLTPILOT_CONSUMER_REPLAN_TRIGGER_ENABLED:-true}
      VOLTPILOT_SOURCES_MQTT_LISTENER_ENABLED: "true"
      VOLTPILOT_ENTITIES_MQTT_LISTENER_ENABLED: "true"
      # Portal v3 M5: the device's own view of the flows it runs (deployment
      # acks + the feature-flagged per-node states) - read-only, feeds the
      # editor's "Läuft auf dem Gerät" badge.
      VOLTPILOT_FLOWS_MQTT_LISTENER_ENABLED: "true"
      # OTA Stufe 0 „Sehen": the top-level `version` + the additive `update`
      # block into device_update_status - read-only, no write path to any
      # device. It is its own listener because the version ingest above rides
      # the `flows` block, which a box without a rolled-out automation never
      # sends.
      VOLTPILOT_OTA_MQTT_LISTENER_ENABLED: "true"
      # OTA Stufe 2: derselbe Schalter traegt den Rollout-Waechter (Zustaende
      # fortschreiben, Auto-Halt, Drift-Republish) - ohne den Status-Ingest
      # gaebe es kein gemeldetes IST, gegen das er urteilen koennte. Der
      # RETAINED Verteilweg selbst reitet auf voltpilot.provisioning.* (derselbe
      # Broker wie Provisionierung und Entity-Push), also kein neuer Knopf.
      # Ersparnis-Simulation: the internal simulation service (see the
      # `simulation` service below); the api proxies async jobs there.
      VOLTPILOT_SIMULATION_BASE_URL: ${VOLTPILOT_SIMULATION_BASE_URL:-http://simulation:8095}
      # Flow compiler: the flowc-serve sidecar (see the `flowc` service below).
      VOLTPILOT_FLOWS_COMPILER_BASE_URL: ${VOLTPILOT_FLOWS_COMPILER_BASE_URL:-http://flowc:8099}
      # Portal v3 M5 GO-LIVE: customer-built automations really control devices
      # from this release on. The safety net is STRUCTURAL, not procedural - a
      # flow can only ever emit a DESIRE; arbitration picks a holder and the
      # edge guard chain CLAMPS every command (§14a envelope both directions,
      # EEG solar-only charge, rated power band, SoC window, rate limit).
      # ROLLBACK (fastest lever): set VOLTPILOT_FLOWS_ACTIVATION_ENABLED=false
      # in .env and redeploy the api - NEW activations then refuse with
      # `activation_disabled`. It does NOT un-deploy anything: artifacts already
      # retained on …/v2/flows keep running. To stop ONE live rule use
      # POST /api/v1/sites/{siteId}/flows/{flowId}/deactivate, which retires the
      # active version and republishes the smaller set - deliberately NOT gated
      # by this flag. See docs/deploy.md "Automationen (Flow-Aktivierung)".
      VOLTPILOT_FLOWS_ACTIVATION_ENABLED: ${VOLTPILOT_FLOWS_ACTIVATION_ENABLED:-true}
    volumes:
      # Device-CA working dir (created by tools/pki/voltpilot-ca.sh init-ca in
      # this clone). READ-WRITE on purpose: issuance advances the CA's
      # serial/index.txt database, shared with the shell tool so revoke/list/
      # gen-crl keep working over api-issued certs. The ACL lives in the same
      # directory EMQX mounts read-only - grants the api writes apply on the
      # next authz reload (tools/pki/reload-broker-authz.sh, see docs/deploy.md).
      # Both are DIRECTORY mounts on purpose: the grant writer replaces
      # acl.conf atomically via rename, which fails with EBUSY when the target
      # is a single-file bind mount (and such a mount would pin EMQX to the
      # replaced inode anyway). Never mount acl.conf as a single file.
      - ${VP_PKI_CA_DIR:-./tools/pki/out/ca}:/pki/ca
      - ./infra/mqtt/acl:/pki/acl
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/localhost/8090; echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '\"status\":\"UP\"'"
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Ingest: subscribe to EMQX telemetry topics (QoS1), validate against the
  # telemetry contract, produce telemetry.raw events to Redpanda. Reaches EMQX
  # in-cluster at emqx:1883 (loopback publish is host-only). Internal.
  # ---------------------------------------------------------------------------
  ingest:
    image: git.tecmaxx.de/mamotec/voltpilot-ems/ingest:${IMAGE_TAG:-latest}
    build:
      context: ./services/ingest
    restart: unless-stopped
    depends_on:
      emqx:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 8091
      MQTT_BROKER_URL: tcp://emqx:1883
      MQTT_TELEMETRY_TOPIC_FILTER: ${MQTT_TELEMETRY_TOPIC_FILTER:-ems/+/+/+/telemetry}
      REDPANDA_BOOTSTRAP_SERVERS: ${REDPANDA_BOOTSTRAP_SERVERS:-redpanda:29092}
      REDPANDA_TELEMETRY_TOPIC: ${REDPANDA_TELEMETRY_TOPIC:-telemetry.raw}
      REDPANDA_TELEMETRY_V2_TOPIC: ${REDPANDA_TELEMETRY_V2_TOPIC:-telemetry-v2.raw}
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/localhost/8091; echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '\"status\":\"UP\"'"
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Writer: consume telemetry.raw and insert into the TimescaleDB `telemetry`
  # hypertable. Connects as voltpilot_app and sets the RLS tenant per event.
  # Depends on `api` because api's Flyway owns the schema, RLS and that role.
  # ---------------------------------------------------------------------------
  writer:
    image: git.tecmaxx.de/mamotec/voltpilot-ems/timescale-writer:${IMAGE_TAG:-latest}
    build:
      context: ./services/timescale-writer
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      SERVER_PORT: 8092
      REDPANDA_BOOTSTRAP_SERVERS: ${REDPANDA_BOOTSTRAP_SERVERS:-redpanda:29092}
      REDPANDA_TELEMETRY_TOPIC: ${REDPANDA_TELEMETRY_TOPIC:-telemetry.raw}
      REDPANDA_TELEMETRY_V2_TOPIC: ${REDPANDA_TELEMETRY_V2_TOPIC:-telemetry-v2.raw}
      POSTGRES_JDBC_URL: jdbc:postgresql://timescaledb:5432/${POSTGRES_DB:-voltpilot}
      APP_DB_USER: ${APP_DB_USER:-voltpilot_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/localhost/8092; echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '\"status\":\"UP\"'"
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Market-data collector: day-ahead spot prices -> day_ahead_prices. Runs the
  # CLI's `serve --persist` mode like the dev stack: refresh today+tomorrow on
  # startup, then every 6h (MARKET_DATA_REFRESH_SECONDS) - coverage-aware: past
  # ~12:45 Berlin (MARKET_DATA_PUBLICATION_HOUR) it polls every 15 min
  # (MARKET_DATA_FAST_REFRESH_SECONDS) until tomorrow's prices land, bounded at
  # midnight, so an unlucky refresh phase can't miss the ~13:00 publication for
  # hours (the optimizer's horizon extends on its next 15-min replan). The
  # default source is
  # the KEYLESS energy-charts.info API (Fraunhofer ISE); set
  # MARKET_DATA_SOURCE=entsoe (plus ENTSOE_SECURITY_TOKEN) to fetch from the
  # ENTSO-E Transparency Platform instead - see docs/deploy.md. Writes
  # market-wide, non-RLS rows over the POSTGRES_* superuser connection.
  # ---------------------------------------------------------------------------
  market-data:
    image: git.tecmaxx.de/mamotec/voltpilot-ems/market-data:${IMAGE_TAG:-latest}
    build:
      context: ./services/market-data
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    command: ["serve", "--persist"]
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-voltpilot}
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # energy-charts (keyless) by default; `entsoe` needs the token below.
      MARKET_DATA_SOURCE: ${MARKET_DATA_SOURCE:-energy-charts}
      MARKET_DATA_ZONE: ${MARKET_DATA_ZONE:-DE-LU}
      MARKET_DATA_REFRESH_SECONDS: ${MARKET_DATA_REFRESH_SECONDS:-21600}
      MARKET_DATA_FAST_REFRESH_SECONDS: ${MARKET_DATA_FAST_REFRESH_SECONDS:-900}
      MARKET_DATA_PUBLICATION_HOUR: ${MARKET_DATA_PUBLICATION_HOUR:-12.75}
      ENTSOE_SECURITY_TOKEN: ${ENTSOE_SECURITY_TOKEN:-}
      ENTSOE_BASE_URL: ${ENTSOE_BASE_URL:-https://web-api.tp.entsoe.eu/api}
      MARKET_DATA_HEALTH_PORT: ${MARKET_DATA_HEALTH_PORT:-8094}
      POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-10}
    healthcheck:
      # /health is the LIVENESS answer of the serve loop (docs/k8s-readiness.md):
      # 200 while the process runs, body carries cycles/failures. python:slim has
      # no curl/wget, so the check uses the interpreter that is already there.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8094/health').read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Weather collector: hourly forecast (Open-Meteo, keyless, EU-hosted) per
  # site's lat/lon -> weather_forecast (RLS-scoped; rows tenant-stamped from the
  # owning site). `serve --persist` refreshes on startup then every 3h, same as
  # the dev stack. Reuses the forecast image (same package, different
  # entrypoint). Depends on api: its Flyway owns weather_forecast + the grants.
  # ---------------------------------------------------------------------------
  weather-collector:
    image: git.tecmaxx.de/mamotec/voltpilot-ems/forecast:${IMAGE_TAG:-latest}
    build:
      context: ./services/forecast
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      api:
        condition: service_healthy
    entrypoint: ["python", "-m", "voltpilot_forecast.weather_collect"]
    command: ["serve", "--persist"]
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-voltpilot}
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      WEATHER_FORECAST_DAYS: ${WEATHER_FORECAST_DAYS:-3}
      WEATHER_REFRESH_SECONDS: ${WEATHER_REFRESH_SECONDS:-10800}
      WEATHER_HEALTH_PORT: ${WEATHER_HEALTH_PORT:-8098}
      POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-10}
    healthcheck:
      # /health is the LIVENESS answer of the serve loop (docs/k8s-readiness.md):
      # 200 while the process runs, body carries cycles/failures. python:slim has
      # no curl/wget, so the check uses the interpreter that is already there.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8098/health').read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Forecast collector (shadow-mode model registry, docs/forecasting.md): every
  # 15 min it runs the BASELINE models (load-persistence, pv-physical) plus the
  # self-gated XGBoost challengers (load-xgb, pv-residual-xgb) for every site,
  # persists each run model-tagged into the `forecast` hypertable, maintains
  # forecast_model_state, and once per Berlin day retrains the challengers and
  # runs the daily forecast/plan evaluation (forecast_accuracy/plan_accuracy).
  # The optimizer consumes ONLY the active model's rows (VOLTPILOT_ACTIVE_*;
  # default = baselines - promotion is a deliberate flip of these vars on BOTH
  # this service and `optimization`). Depends on api: its Flyway owns
  # forecast.model + the RLS-scoped quality tables.
  # ---------------------------------------------------------------------------
  forecast:
    image: git.tecmaxx.de/mamotec/voltpilot-ems/forecast:${IMAGE_TAG:-latest}
    build:
      context: ./services/forecast
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      api:
        condition: service_healthy
    entrypoint: ["python", "-m", "voltpilot_forecast.forecast_collect"]
    command: ["serve"]
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-voltpilot}
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      FORECAST_INTERVAL_SECONDS: ${FORECAST_INTERVAL_SECONDS:-900}
      FORECAST_HORIZON_HOURS: ${FORECAST_HORIZON_HOURS:-24}
      VOLTPILOT_ML_MIN_DAYS: ${VOLTPILOT_ML_MIN_DAYS:-21}
      VOLTPILOT_ACTIVE_LOAD_MODEL: ${VOLTPILOT_ACTIVE_LOAD_MODEL:-load-persistence}
      VOLTPILOT_ACTIVE_PV_MODEL: ${VOLTPILOT_ACTIVE_PV_MODEL:-pv-physical}
      FORECAST_HEALTH_PORT: ${FORECAST_HEALTH_PORT:-8097}
      POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-10}
    healthcheck:
      # /health is the LIVENESS answer of the serve loop (docs/k8s-readiness.md):
      # 200 while the process runs, body carries cycles/failures. python:slim has
      # no curl/wget, so the check uses the interpreter that is already there.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8097/health').read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Optimization engine: the rolling battery-dispatch planner. Every 15 min,
  # for every site with a battery asset, it solves the cost-optimal 24h MILP
  # over day-ahead prices + forecasts, persists the plan to the `schedule`
  # hypertable (RLS-scoped; the portal's Fahrplan view reads it) and publishes
  # it retained to the device's MQTT schedule topic
  # (docs/contracts/mqtt-schedule.schema.json). Publishes over the INTERNAL
  # plaintext listener like ingest (the mTLS 8883 listener is for devices).
  # Depends on api: its Flyway owns the schedule table + battery params.
  # ---------------------------------------------------------------------------
  optimization:
    image: git.tecmaxx.de/mamotec/voltpilot-ems/optimization:${IMAGE_TAG:-latest}
    # Repo-root context (unlike the sibling services): the optimizer's image
    # bundles the sibling forecast package for its persistence fallback.
    build:
      context: .
      dockerfile: services/optimization/Dockerfile
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      emqx:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-voltpilot}
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MQTT_HOST: emqx
      MQTT_PORT: "1883"
      OPTIMIZER_INTERVAL_SECONDS: ${OPTIMIZER_INTERVAL_SECONDS:-900}
      OPTIMIZER_HORIZON_HOURS: ${OPTIMIZER_HORIZON_HOURS:-24}
      # Shadow-mode forecasting: the optimizer reads ONLY the ACTIVE model's
      # rows from the forecast hypertable. These are the DEFAULT - a portal
      # promotion wins - per PLANT (site_forecast_model_choice) over the
      # platform default (forecast_model_choice); the optimizer reads both
      # ONCE per cycle. Keep in sync with the forecast service.
      VOLTPILOT_ACTIVE_LOAD_MODEL: ${VOLTPILOT_ACTIVE_LOAD_MODEL:-load-persistence}
      VOLTPILOT_ACTIVE_PV_MODEL: ${VOLTPILOT_ACTIVE_PV_MODEL:-pv-physical}
      # Optimizer-redesign Stage 1 tunables (services/optimization config.py):
      # battery wear cost per kWh cycled (per-asset override via
      # asset.wear_cost_ct_per_kwh) + telemetry freshness windows.
      OPTIMIZER_WEAR_COST_CT_PER_KWH: ${OPTIMIZER_WEAR_COST_CT_PER_KWH:-4.0}
      OPTIMIZER_GRID_LIMIT_MAX_AGE_MINUTES: ${OPTIMIZER_GRID_LIMIT_MAX_AGE_MINUTES:-60}
      OPTIMIZER_SOC_MAX_AGE_MINUTES: ${OPTIMIZER_SOC_MAX_AGE_MINUTES:-120}
      # Structured Bezugspreis: researched default supply components as the
      # fallback for dynamisch-without-Aufschlag / ohne sites WITHOUT a
      # maintained site_supply_price row (report vp-nacht-bezug-e7 §3.1).
      # Default ON (captain decision 2026-07-29) - a site without a
      # maintained price sheet rechnet mit den Default-Komponenten; set
      # this to false to opt out. Mirrored to the api service (same
      # variable) so display and solver agree.
      OPTIMIZER_DEFAULT_SUPPLY_COMPONENTS: ${OPTIMIZER_DEFAULT_SUPPLY_COMPONENTS:-true}
      # The three in-slot price-aware duties published per slot (the edge
      # enforces them against MEASURED values, never a price): the charge-side
      # trim that LOWERS a charge (charge_from_surplus_only), the discharge-side
      # load following (cover_load_from_battery) and the charge-side absorption
      # that RAISES a charge to the measured surplus (charge_surplus_to_battery).
      # SEPARATE levers on purpose - they push the setpoint in different
      # directions on a control path, so one must be stoppable without losing
      # the others. All default ON; setting one to false makes its payloads
      # byte-identical to before and every edge behaves exactly as it did (the
      # fields are FAIL-OPEN on the edge by contract) - the ops kill-switch per
      # duty, no image change.
      OPTIMIZER_SLOT_TRIM_ENABLED: ${OPTIMIZER_SLOT_TRIM_ENABLED:-true}
      OPTIMIZER_LOAD_FOLLOW_ENABLED: ${OPTIMIZER_LOAD_FOLLOW_ENABLED:-true}
      OPTIMIZER_SURPLUS_CHARGE_ENABLED: ${OPTIMIZER_SURPLUS_CHARGE_ENABLED:-true}
      # MIG v1->v2 migration switch: comma-separated site UUIDs the optimizer
      # ADDITIONALLY publishes a v2 shadow plan for (ems/{t}/{s}/{d}/v2/plan);
      # the v1 /schedule plan is byte-identical for every site. Default EMPTY =
      # nothing flagged (byte-identical v1). Flip it per site to migrate,
      # unset/remove a site to roll back (seconds, no image change). See
      # docs/migration-v1-to-v2.md.
      VOLTPILOT_V2_PLAN_SITES: ${VOLTPILOT_V2_PLAN_SITES:-}
      # Verbrauchssteuerung §19 Inkrement 5: master gate for co-optimizing
      # steuerbare Verbraucher. OFF (default) = consumer-less v2 shadow, turned
      # on per docs/verbrauchssteuerung-betrieb.md after the pilot.
      OPTIMIZER_CONTROLLABLE_LOADS_ENABLED: ${OPTIMIZER_CONTROLLABLE_LOADS_ENABLED:-false}
      OPTIMIZER_HEALTH_PORT: ${OPTIMIZER_HEALTH_PORT:-8096}
      POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-10}
    healthcheck:
      # /health is the LIVENESS answer of the serve loop (docs/k8s-readiness.md):
      # 200 while the process runs, body carries cycles/failures. python:slim has
      # no curl/wget, so the check uses the interpreter that is already there.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8096/health').read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Ersparnis-Simulation service: the SAME optimization image with a different
  # entrypoint (the weather-collector pattern). Internal-only (NO public port -
  # the api proxies + owns all auth/tenancy); a cpus limit isolates the
  # minutes-long solve bursts so the production optimizer never starves.
  # One-time prerequisite per reference year (idempotent, safe to re-run):
  #   docker compose -f docker-compose.prod.yml run --rm market-data backfill --year 2025 --persist
  simulation:
    image: git.tecmaxx.de/mamotec/voltpilot-ems/optimization:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/optimization/Dockerfile
    restart: unless-stopped
    command: ["simulate-serve"]
    cpus: "3.0"
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-voltpilot}
      POSTGRES_USER: ${POSTGRES_USER:-voltpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SIM_MAX_WORKERS: ${SIM_MAX_WORKERS:-3}
      # Concurrent SYNCHRONOUS admin what-if re-optimizes (design §4.3).
      # A what-if solves in the request thread, so it is bounded: excess
      # calls get 429 instead of starving the simulation jobs' CPU budget.
      WHATIF_MAX_CONCURRENT: ${WHATIF_MAX_CONCURRENT:-2}
      # D8 on-demand replan (POST /replan, Verbrauchssteuerung §13.4): one real
      # cycle per call, bounded; the api's trigger listener debounces per site.
      # MQTT_HOST wires the retained plan publish - without it a replan
      # persists and honestly reports published: false.
      REPLAN_MAX_CONCURRENT: ${REPLAN_MAX_CONCURRENT:-1}
      MQTT_HOST: emqx
      MQTT_PORT: "1883"
      VOLTPILOT_V2_PLAN_SITES: ${VOLTPILOT_V2_PLAN_SITES:-}
      OPTIMIZER_CONTROLLABLE_LOADS_ENABLED: ${OPTIMIZER_CONTROLLABLE_LOADS_ENABLED:-false}
      POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-10}
      # Same pricing layer as the optimizer - keep the ONE price truth
      # (default-supply-components defaults ON platform-wide, opt out with false).
      OPTIMIZER_DEFAULT_SUPPLY_COMPONENTS: ${OPTIMIZER_DEFAULT_SUPPLY_COMPONENTS:-true}
    healthcheck:
      # /health is the LIVENESS answer of the serve loop (docs/k8s-readiness.md):
      # 200 while the process runs, body carries cycles/failures. python:slim has
      # no curl/wget, so the check uses the interpreter that is already there.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8095/health').read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # flowc-serve: the CLOUD-side flow-graph -> flow-artifact compiler sidecar
  # (E2 flowc; edge-app/nodered/flowc/serve.js). The api compiles flows through
  # it during activation - no Node runtime in the JVM, and the JCS content hash
  # is never reimplemented in Java. Stdlib Node, INTERNAL only (no public port),
  # /health probed. Always up so an operator can flip a site's activation flag
  # (VOLTPILOT_FLOWS_ACTIVATION_ENABLED) without a compose change.
  # ---------------------------------------------------------------------------
  flowc:
    image: git.tecmaxx.de/mamotec/voltpilot-ems/flowc:${IMAGE_TAG:-latest}
    build:
      context: ./edge-app/nodered/flowc
    restart: unless-stopped
    # /health is defined in the image's own HEALTHCHECK (BusyBox wget).

  # ---------------------------------------------------------------------------
  # Frontend: the built SPA on nginx, and the SINGLE public HTTP entry point the
  # external TLS proxy forwards to. nginx also reverse-proxies /api/ -> api and
  # /auth/ -> keycloak (see frontend/portal/nginx.conf).
  # ---------------------------------------------------------------------------
  frontend:
    image: git.tecmaxx.de/mamotec/voltpilot-ems/frontend:${IMAGE_TAG:-latest}
    # The SPA bakes its config in at BUILD time (import.meta.env). A local
    # `docker compose build frontend` therefore needs DOMAIN from .env - same
    # values the CI build passes via secrets. VITE_API_BASE stays empty
    # (same-origin /api through this image's nginx).
    build:
      context: ./frontend/portal
      args:
        VITE_API_BASE: ""
        VITE_KEYCLOAK_URL: https://${DOMAIN:-voltpilot.example.com}/auth
        VITE_KEYCLOAK_REALM: voltpilot
        VITE_KEYCLOAK_CLIENT_ID: voltpilot-frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:${APP_PORT:-8080}:80"
    depends_on:
      - api
      - keycloak
    healthcheck:
      # /healthz is nginx's own 200 (frontend/portal/nginx.conf) - deliberately
      # says nothing about the api/keycloak upstreams, which have their own
      # probes. Serving the SPA is what "ready" means here.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  # A single private bridge network for all services. Only the two published
  # ports above (frontend APP_PORT, emqx 8883) cross it to the host; everything
  # else talks over this internal network by compose service name - es sei denn,
  # die optionale Datenebene ist an (DATA_PLANE=enabled), dann kommen die vier
  # LAN-gebundenen Cluster-Ports dazu (siehe Kopf dieser Datei).
  default:
    name: voltpilot-prod

volumes:
  timescale-data:
  keycloak-db-data:
  emqx-data:
  redpanda-data:
